description:
  en: First-person article by Jon Bluming, March 2000, recounting his time in the Kodokan Kenshusei class
    around 1960. Confirms the Kenshusei Olympic training program (August 1960), that regular instructors
    included Daigo, Kawamura and Osawa, that members attended special seminars given by teachers like
    Mifune and Samura, and recounts an incident in which he was summoned before Risei Kano and Daigo Sensei
    for behaving childishly. Also describes Donn Draeger treating his toe injury.
