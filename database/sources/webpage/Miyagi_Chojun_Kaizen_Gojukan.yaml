description:
  en: Kaizen Gojukan (IKGA) profile of Chojun Miyagi. Born April 25, 1888 in Naha to an aristocratic family;
    began martial arts at 12 with Aragaki Ryuko, who introduced him to Kanryo Higaonna; commenced training
    with Higaonna in 1902 at 14, becoming his top student at 20; military service in Kyushu at 22 for
    two years; Higaonna taught him privately for three years until Higaonna died in 1915; first trip to
    Fuchow in 1915 visiting Ryu Ryu Ko's grave; trained two months with a student of Ryu Ryu Ko; the crane
    and tile roof story; Saifa kata; Rokkishu/Tensho development with Gokenki; 1921 demonstration for
    crown prince Hirohito and 1925 for prince Chichibu; Junbi undo development; Karate Research Club in
    1926.
