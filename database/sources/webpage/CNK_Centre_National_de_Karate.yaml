description:
  en: Official English-language history page of the Centre National de Karate (CNK), the Brussels karate
    school founded by Claude Goetz. Records that Claude Goetz and Jean De Haes created the first karate
    school in Brussels in 1962 as the ancestor of the CNK, and that Goetz trained in Paris together with
    Tsutomu Ohshima.
