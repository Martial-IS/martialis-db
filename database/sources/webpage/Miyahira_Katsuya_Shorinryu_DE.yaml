description:
  en: Shorinryu.de page on Grand Master Miyahira Katsuya (1918-2010), founder of Okinawa Shorinryu Shidokan,
    10th dan Hanshi and president of the Okinawa Shorin Ryu Karatedo Kyokai. States he was taught at age
    five by his father (Toyama military school background), began deep karate study in April 1933 under
    Chibana Choshin (Shuri-te), also practiced at the College of Shuri under Tokuda Anbun from September
    1933, and deepened kumite in the dojo of Motobu Choki. After the war he founded his first dojo in
    Nishihara, taught at Ryukyu University from 1953, and built the Shidokan dojo at his home in Tsuboya
    in 1956.
