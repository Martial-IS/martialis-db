description:
  en: Blog post by kendo writer Geoff Salmon reproducing Tom Bolling's resume of Mishima's sword-art career
    - the main non-Wikipedia English account of it. Dates formal instruction from June 1958 under Kendo
    Kyoshi 7th Dan Masami Yoshikawa at Higashi-Chofu Police Station, practice from December 1958 in the
    basement dojo of the Dai-ichi Seimei building under Kyoshi 7th Dan Takayuki Yamamoto, iaido from November
    1965 at Himonya Police Station, entry to the Saineikan training hall within the Imperial Palace grounds
    in March 1966 under Kyoshi 7th Dan Masami Matsunaga for both kendo and iaido, and participation in
    the 1st World Kendo Championships at the Nippon Budokan on 5 April 1970. Comments note that his participation
    was a goodwill match and record community scepticism about his technical level.
