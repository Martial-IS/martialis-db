description:
  en: 'Biography of Seiichi Akamine (1920-1995) by Sensei Roberto Fernandez de la Reguera (his Chile representative,
    translated by Christian Tapia), from the Bushido Reiryoku Kan school. Primary descendant account:
    born Naha 14 May 1920, early training under his grandfather, Shorin-ryu under Chomo Hanashiro, Kentsu
    Yabu and Chotoku Kyan, then Goju-ryu under Seiko Higa and Kanki Izumigawa (1st dan at 16, 2nd at 18,
    4th at 22 from Higa), kobudo under Shinko Matayoshi, Tokyo years (Shikan-kan dojo, anatomy/physiology
    studies), the 1950 Nippon TV demonstration, immigration to Brazil in 1957, the Brazilian Association
    of Karate-Do, the Ken-Shin-Kan school (1968), and his Chile/Uruguay branches. Received 8th dan from
    the Japanese Butokai and declined 9th and 10th dan.'
