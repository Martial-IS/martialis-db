description:
  en: Dutch encyclopedia entry on Jan van der Horst (judoka). Records that "Onder zijn bondscoachschap
    won Wim Ruska zijn eerste wereldtitel in 1967 en werd het Europees kampioenschap behaald door het
    Nederlands judoteam" - that under his national-coaching Wim Ruska won his first world title in 1967
    and the Dutch judo team won the European championship.
