description:
  en: Official biography of Roy Y. Suenaka on the Wadokai Aikido website. Details his training under his
    father Warren Kenji Suenaka and his instructors (Henry Okazaki, James Mitose, Koichi Tohei, Shuji
    Mikami), his aikido study under Morihei Ueshiba (menkyo kaiden 1961), private study with Hohan Soken
    (rokudan 1972), Kodokan judo under Kazuo Ito (sandan 1970), and a dated training/instructor list including
    Goju-ryu study with Eiichi Miyazato (1967-1972), Kyokushin karate with Masutatsu Oyama (1961-1963)
    and Kobayashi karate with Chosin Chibana (1962).
