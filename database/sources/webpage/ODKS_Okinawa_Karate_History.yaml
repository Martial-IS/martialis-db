description:
  en: ODKS (Okinawan karate) history page covering Higaonna Kanryo's training. States Higaonna, at about
    17, studied martial arts under Maya Arakaki, i.e. Arakaki Seisho (1840-1920) of Kume village; that
    Arakaki himself studied martial arts under the Tei-shi Yabu Pechin (formerly Hokama); and that Arakaki
    performed his specialty "Jusanpo" at the 1867 celebration of the Chinese investiture mission at the
    royal tea house in Shuri before Sho Tai.
