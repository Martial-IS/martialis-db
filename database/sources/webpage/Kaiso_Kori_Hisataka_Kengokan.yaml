description:
  en: Kengokan (Shorinjiryu Kenkokan) Karate Dojo Canberra page on Kaiso Kori Hisataka (1907-1988), founder
    of Shorinjiryu Kenkokan Karatedo. Covers his birth in Shuri, the Kudaka family arts (Kudaka-ryu Okinawa-te
    and Shishiryu bojutsu), his training under weapons master Sanda Kanagusuku, Chotoku Kyan as his main
    teacher (Taiwan tour 1929-30), Kodokan judo 4th dan under Sanpo Toku, the Manchurian years, and the
    founding of the first Kenkokan dojo in Hamada, Kyushu after the war.
