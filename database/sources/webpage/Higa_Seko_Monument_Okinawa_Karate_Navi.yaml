description:
  en: Okinawa Karate Navi site page on the commemorative monument of Higa Seko and his son Higa Seikichi
    at the Higa family gravesite in Shikina, Naha. States Higa Seko was born in 1898, studied under Higaonna
    Kanryo from 1911 and also studied with Miyagi Chojun; from 1931 he opened various dojo in several
    locations; in 1960 he founded the Goju-ryu International Karate and Kobudo Federation; he passed away
    in 1966.
