description:
  en: Obituary of 本田土洲 (Honda Doshū), president of the Senshu Aikido Association (泉州合気道協会), who passed
    away on 14 January 2011. The notice recalls his 7th dan promotion celebration, his expeditions to
    Portugal, Uzbekistan and France, and that as a young man he went alone to Portugal to spread aikido.
  ja: 泉州合気道協会会長の本田土洲先生が2011年1月14日に逝去されたことに対する追悼記事。七段昇段祝い、ポルトガル・ウズベキスタン・フランスへの遠征、若き日に単身ポルトガルへ渡り合気道を広めたことを回顧している。
