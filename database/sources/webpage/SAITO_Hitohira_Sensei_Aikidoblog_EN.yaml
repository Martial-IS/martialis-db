description:
  en: Biography of Hitohira SAITO Sensei (born 12 February 1957 in Iwama) published by Aikido Blog, covering
    his training from age seven under Morihei Ueshiba, his chef studies in Sendai and Osaka, teaching
    at the Yoyogi Uehara dojo, his appointment at the Iwama dojo in 1986, the founding of Iwama Shinshin
    Aiki Shuren Kai in 2004, and his renaming to Hitohira in 2009.
