description:
  en: Biography of Moshe Feldenkrais published by the Feldenkrais Educational Foundation of North America,
    based on the book 'The Feldenkrais Method, Learning Through Movement' (Handspring Press, 2021, ed.
    Staffan Elgelid and Chrish Kresge). Covers his birth in Slavuta, emigration to Palestine in 1919,
    Paris years and meeting with Jigoro Kano in 1933, escape to Britain in 1940 and work for the Admiralty,
    British citizenship in February 1949, return to Israel in 1950, and the later development of the Feldenkrais
    Method.
