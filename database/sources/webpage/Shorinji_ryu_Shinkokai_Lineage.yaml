description:
  en: Lineage page of the Shorinji-ryu Shinkokai USA branch, the style founded by Joen Nakazato. States
    Shorinji-ryu is based directly on the teachings of Chotoku Kyan (1870-1945) and was named in 1954
    by his student Joen Nakazato (1922-2010), who wanted to pass on Kyan's style in its entirety. Gives
    Nakazato's birth in 1922 in Chinen village, his study under Kyan from April 1937 to December 1943
    while a student at the Okinawa Prefecture Agriculture School, his army service in World War II, the
    dojo he opened at Matsubashi, Kumamoto Prefecture, the dojo in the courtyard of his old home in Chinen
    village, his vow to pass on Kyan's style without any change, the naming of the style after the Shaolin
    temple, his 2000 designation as an Intangible Cultural Asset, and his death in 2010 at 88. Also profiles
    Kyan's own teachers (Matsumura, Matsumora, Oyadomari, Pechin Yara) and the kata transmission, and
    names Hitoshi Oyakawa as a direct student of Nakazato.
