description:
  en: Essay on a Mongolian-wrestling research site arguing, via Beijing shuai jiao elder Li Baoru's own
    testimony, that modern jacketed shuai jiao descends directly from Mongol bökh (via Manchu buku and
    the Qing Shan Pu Ying), and characterising the competing unbroken-Han-lineage narrative as a Republican-era,
    ethnonationalist revision. Self-published; cited for a contested minority position, not as an uncontested
    fact - see the confidence rationale on the citing assertion.
