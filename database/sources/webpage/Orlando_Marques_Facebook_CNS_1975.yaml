description:
  en: >
    Facebook post by Orlando Marques, dated 2 January 2025, recounting how Misao Honda gave a
    demonstration at the Clube Naval Setubalense and started the first Aikikai aikido class in Portugal
    there in June 1975, while Marques was a director of the club.
  pt: >
    Publicação no Facebook de Orlando Marques, de 2 de janeiro de 2025, que relata como Misao Honda fez
    uma demonstração no Clube Naval Setubalense e aí iniciou a primeira classe de Aikido Aikikai em
    Portugal em junho de 1975, quando Marques era diretor do clube.
