description:
  en: Tang Soo Do World Who's Who profile of Grandmaster Pat Johnson (1939-2023), 9th Dan, pin no. 6971.
    Independently confirms his 1963 military-era training start, captaincy of Chuck Norris's competition
    team, creation of the penalty point system, two Golden Fist awards, NASKA Hall of Fame induction (1993)
    and Black Belt Magazine Instructor of the Year honor (dated 1995 here). Does not name his Korean instructor
    or any Chuck Norris student role.
