description:
  en: City of Mechelen announcement, dated 10 October 2012, of the inauguration on 11 October 2012 of
    the new combat sports hall (Donkerlei) named after Felix De Smedt. Records that De Smedt, pioneer
    of judo in Belgium, died on 2 August 2012 aged 88, founded the first Belgian judo club in 1946, that
    a Mechelen branch of Bushido-Kwai was created in 1951, that he trained the Mechelen police corps from
    1954, and that the Royal title was granted in 1996.
