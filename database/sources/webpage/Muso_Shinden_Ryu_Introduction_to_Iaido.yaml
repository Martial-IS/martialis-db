description:
  en: Introduction to iaido published by the Muso Shinden Ryu Association of Finland. Notes that iaijutsu
    was originally a part of kenjutsu, that some masters came to concentrate exclusively on drawing the
    sword, and that in the peaceful Tokugawa era iaido was born; describes kata practice (nukitsuke, kiritsuke,
    chiburi, noto), solo training, and the art's non-competitive spiritual aims.
