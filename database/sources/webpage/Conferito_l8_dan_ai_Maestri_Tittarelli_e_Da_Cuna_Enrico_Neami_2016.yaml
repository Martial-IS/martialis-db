description:
  en: Article by Enrico Neami reporting that Iwama Shin Shin Aiki Shurenkai head Saito Hitohira Jukucho
    conferred the grade of VIII dan Dentō Iwama Ryu on Shihan Tristao Da Cuña and Shihan Alessandro Tittarelli
    at the Kagami Biraki ceremony held in Iwama on 17 January 2016. Includes photographs of both masters
    at the ceremony.
  it: Articolo di Enrico Neami che riporta che il capo scuola dell'Iwama Shin Shin Aiki Shurenkai, Saito
    Hitohira Jukucho, ha conferito ai Maestri Tristao Da Cuña e Alessandro Tittarelli il grado di VIII
    dan Dentō Iwama Ryu in occasione della cerimonia del Kagami Biraki tenutasi a Iwama il 17 gennaio
    2016. Include fotografie dei due maestri alla cerimonia.
