description:
  en: 'Biographical article on Kiyoshi Nakakura published by the All Belgium Kendo Federation, documenting
    his long relationship with Belgian kendo (1969 first visit, 1977 European championships in Brussels,
    the annual ''Nakakura Cup'' seminar from 1992). Includes a dated career timeline (Daidokan 1929, Yushinkan
    1930, Imperial Guard 1931, Tokyo Shouka University 1934, Kagoshima Police 1953, All Japan Kendo Federation
    roles) and exact grade dates: Kendo Kyoshi 1939, 8th dan 1959, Hanshi 1962, 9th dan 1978; Iaido Hanshi
    1978, 9th dan 1983.'
