description:
  en: Official website of the Clube Naval Setubalense, a nautical and multi-sport club in Setúbal founded
    on 6 May 1920, currently offering rowing, sailing, swimming, handball, gymnastics and adapted sport.
    It does not currently offer aikido, but is the historical venue where Misao Honda gave his first demonstration
    on 10 May 1975 and where Orlando Marques Pereira began aikido in July 1975.
  pt: Site oficial do Clube Naval Setubalense, clube náutico e polidesportivo de Setúbal fundado a 6 de
    maio de 1920, atualmente com remo, vela, natação, andebol, ginástica e desporto adaptado. Não oferece
    atualmente Aikido, mas é o local histórico onde Misao Honda fez a sua primeira demonstração em 10
    de maio de 1975 e onde Orlando Marques Pereira iniciou o Aikido em julho de 1975.
