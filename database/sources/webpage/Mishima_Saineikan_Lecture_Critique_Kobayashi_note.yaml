description:
  en: Self-published critical essay examining Mishima's lecture "Watashi no Kiite Hoshii Koto" given at
    the Imperial Palace Police headquarters on 28 May 1970 (printed in the palace police magazine Sainei,
    June 1970; collected works vol. 36, pp. 141-163). It quotes Mishima's first-person statement that
    he had been permitted to train at the Saineikan since the previous year, but argues this was self-mythologising,
    noting evidence that Mishima had declined a Saineikan invitation around October 1964. Cited here transparently
    as the accessed carrier of those primary-text fragments; its interpretive claims are the author's
    own.
