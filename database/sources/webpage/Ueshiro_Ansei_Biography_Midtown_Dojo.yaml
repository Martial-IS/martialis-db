description:
  en: Biography of Ansei Ueshiro on the Midtown Karate Dojo site (Ueshiro Shorin-Ryu Karate USA network).
    States he was born April 20, 1933 in Kin, Okinawa, a direct descendant of the Okinawan "Bushi" warrior
    class; his father Anho Ueshiro was his first teacher along with Entasu Isaenta and Toguchi Seitoku.
    Records the loss of both parents in the 1945 Battle of Okinawa and severe injuries to his hands; his
    enrollment in Shoshin Nagamine's newly formed Matsubayashi Shorin-Ryu dojo, promotion to sandan (Sensei)
    at 27, and eventual position as Chief Instructor at the main Shorin-Ryu dojo in Naha; four years (1958-1962)
    as world champion; his selection in 1960 by Nagamine and other Okinawan masters to bring karate-do
    to the US, with a special US government visa obtained through his student James Wax (first American
    black belt in Shorin-Ryu, then a US Marine stationed in Okinawa) and Robert Yarnall; his arrival in
    the United States on September 15, 1962; the East Coast and Midwest dojo network by the late 1970s;
    his import/export enterprise to avoid over-commercialization; US citizenship in the early 1990s; his
    death on May 7, 2002, burial in Locust Valley, NY, and the network of over 100 US dojo tracing their
    roots to him.
