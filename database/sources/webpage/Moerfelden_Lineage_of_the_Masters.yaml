description:
  en: 'Lineage page of a Matsumura Kenpo dojo (Okinawa Karate Moerfelden), presenting the style''s genealogy:
    Satunuku Sakugawa (1733-1815); Sokon Matsumura (1797-1889), founder of Shorin Ryu; Nabe Matsumura
    (1860-1930), Sokon''s grandson, "considered the successor of Bushi Matsumura and thus heir to the
    Matsumura Shorin Ryu", who held that knowledge should only be passed to family members, "for that
    reason his nephew Hohan Soken was probably his only long-time student"; Hohan Soken (1890-1982), born
    in Gaja (Nishihara district), who began learning Matsumura Shorin Ryu and Kobudo from his uncle Nabe
    at 13, began teaching his own style "Matsumura Shuri Te" in 1945, later renamed Shorin Ryu Matsumura
    Seito, and founded the Shorin Ryu Matsumura Seito Okinawa Karate Kobudo Association; Yuichi Kuda (1929-1999),
    who studied Okinawa Kenpo under Shigeru Nakamura (1894-1969) before becoming Soken''s student after
    1969 and founding Matsumura Kenpo; and Tomosada Kuda (born 1950), current grandmaster. Note: the page
    gives Matsumura Sokon''s dates as 1797-1889 and Hohan Soken''s as 1890-1982, differing from other
    sources.'
