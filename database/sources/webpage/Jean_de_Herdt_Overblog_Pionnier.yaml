description:
  en: Tribute article to Jean de Herdt by a former student, published 23 January 2013, shortly after de
    Herdt's death on 5 January 2013. Records his black belt in 1940, his status as the first Westerner
    to hold a drawn match against Toshiro Daigo at the Vel d'Hiv before more than 16,000 spectators, his
    role alongside Jean Beaujean in running the Club Franco-japonais after Mikinosuke Kawaishi's return
    to Japan, the first French national black-belt championship (Paris, 1943) and the College des Ceintures
    Noires (1942), his teaching of Anton Geesink, and his rank of 6th dan and Knighthood of the Legion
    of Honour.
