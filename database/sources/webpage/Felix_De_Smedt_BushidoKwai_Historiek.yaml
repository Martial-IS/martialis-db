description:
  en: 'History page of the Bushido-Kwai Mechelen club website on founder Felix De Smedt: his judo and
    jiu-jitsu instructor diploma from the school of Erich Rahn in Berlin, further training under Jean
    De Herdt (5th dan, European champion), Robert Godet (5th dan), G. F. M. Schutte (7th dan) and Tokio
    Hirano (7th dan, world champion), the founding of the Judo & Jiu-Jitsu Academie Bushido-Kwai at Schelle
    on 20 May 1946 at age 23, its expansion with branches at Boom, Willebroek, Mechelen, Heist o/d Berg,
    Weerde and Berlaar, the creation of the Mechelen branch on 14 March 1951, the Mechelen police-corps
    training, and consultation of master Ichiro Abe on the dojo tatami floor.'
