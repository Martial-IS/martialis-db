description:
  en: Official biography of Jon Bluming published on his own site. Records that he joined the Tung Jen
    judo club in Amsterdam in November 1953, that his sensei Dr G. Schutte gave him his 1st dan after
    only 12 months, that Opa Schutte was a 4th dan from Tokio Hirano at that time, that he received his
    3rd dan from Tokio Hirano in 1957 after throwing 75 judoka in 26 minutes, and that in November 1959
    the elderly man he had seen at the Kodokan in 1951 (Kyuzo Mifune) became his head teacher when he
    joined the famous Kenshusei class of the 25 best fighters in Japan. Also records training under Donn
    Draeger, Shimizu and Kuroda in bo-jitsu, kendo and iai-jitsu.
