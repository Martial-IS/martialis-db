description:
  en: Blog post of the Kishiwada Shōbukai reporting the death on 14 January 2011 of 本田土洲 (Honda Doshū),
    former president of the Kishiwada City Aikido Federation and president of the Senshu Aikido Association,
    who taught aikido for many years in Portugal and other countries and built a large organization in
    the Senshu region. A companion post (2012) records that after his death the Senshu Aikido Association
    was renamed Senshu Buikukai.
  ja: 岸和田市翔武会のブログ記事。2011年1月14日に逝去した本田土洲師範（岸和田市合気道連盟前会長、泉州合気道協会会長）を追悼。ポルトガルをはじめ多くの国で長きにわたり合気道を指導し、泉州地区に大きな組織を育てたことを記す。関連記事（2012年）では逝去後に泉州合気道協会が泉州武育会と改名したことを記録している。
