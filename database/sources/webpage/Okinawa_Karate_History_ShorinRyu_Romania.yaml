description:
  en: Shorin-Ryu Romania history page covering the Shuri-te lineage masters. States Ankichi Arakaki began
    studying karate at an early age, learning from Shinpan Gusukuma (his teacher from primary grades),
    then Chomo Hanashiro (when he was in high school), before intensifying his training with the founder
    of Kobayashi Shorin-ryu, Chosin Chibana; moved to Kadena in 1921 after graduating military service;
    died at 28 of ulcers.
