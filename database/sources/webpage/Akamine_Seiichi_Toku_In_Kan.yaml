description:
  en: 'Biography of Seiichi "Shikan" Akamine (1920-1995) from the Toku In Kan school (Uruguay branch of
    his lineage, via Sensei Juan Carlos Rius). Primary descendant account: born Naha, moved to Kawasaki
    at age five, Goju-ryu training with Kanki Izumigawa and Seiko Higa, Shuri-te with Seitoku Higa, kobudo
    with Shinpo Matayoshi, creation of the "Shikan Ryu" teaching method, 8th dan from Budokan and Shuseki
    Shihan from Kanken Toyama (both recognized by the Dai Nippon Butokukai), anatomy/physiology studies
    at the University of Tokyo, war service as navy telegrapher, immigration to Brazil in 1957, the Brazilian
    Association of Karate, and introduction of karate-do to Uruguay.'
