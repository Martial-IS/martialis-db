description:
  en: 'Article by Terence McPartland (September 2012) on the DC Judo club''s website about Feldenkrais''
    judo career: his meeting with Jigoro Kano in 1933, his study of judo under Mikinosuke Kawaishi with
    shodan in 1936 and nidan in 1938, his work with Kawaishi on teaching judo to Westerners (documented
    in Kawaishi''s My Method of Judo), the founding of the Jujitsu Club de France in 1936, and his students
    including Paul Bonét-Maury, first IJF Secretary-General.'
