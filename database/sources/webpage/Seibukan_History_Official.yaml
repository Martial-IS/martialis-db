description:
  en: 'Official history of the Seibukan school on the International Okinawa Shorin-Ryu Seibukan Karate-do
    Association website. Covers founder Zenryo Shimabukuro (1909-1969): born Showa-era Shuri Kubagawa,
    Naha on November 5, 1909 (Meiji 42); to Osaka at 18 (1926); settled in Chatan 1933 as a confectioner;
    began training under Chotoku Kyan in 1935 (Showa 10); opened a dojo in Chatan in 1952; instructed
    US Army 503rd Airborne from 1961; built the Seibukan dojo in 1962, creating the Wanshu kata; president
    of the Okinawa Karate-do Union 1965; awarded Hanshi 10th dan by the All-Okinawa Karate Federation
    in 1967; died at 61 in 1969. Also covers successor Zenpo Shimabukuro (b. 1943), who studied Kobayashi-ryu
    under Chozo Nakama and inherited the school in 1969.'
