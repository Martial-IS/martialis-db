description:
  en: 'History page of the Omine Okinawa Karate & Kobudo Dojo, profiling the dojo''s lineage: Katsuhiko
    Shinzato (1939-present, 新里勝彦), born in Manila, Philippines, family relocated to Okinawa during the
    Second World War, began karate in 1957 under Tsunetaka Shimabukuro, became a student of Shoshin Nagamine
    in 1967, and is head of the Shorin Ryu Kishaba Juku, "a focused method of study within Matsubayashi
    Ryu"; Seikichi Odo (1926-2002, 小渡世吉), student of Shigeru Nakamura and kobudo under Shinpo Matayoshi;
    and Chotoku Omine (1929-1975), born on Saipan, who trained in Matsubayashi Ryu from 1947 under Nagamine,
    became head instructor at Nagamine Dojo, and in 1969 accompanied Nagamine to the US as chief instructor
    of the International Shorin Ryu Karate Do Association. Accessed via the Wayback Machine (2023-02-12
    snapshot); the live site timed out.'
