description:
  en: Lineage page of Kiyobukan (a US dojo following the Shorinji-ryu and Shorin-ryu traditions). Describes
    Choshin Chibana and his students including Shugoro Nakazato (1919-, Shorinkan), and Seiei Nakaza (born
    1942), who began karate in 1957 at age 15 under the guidance of Joen Nakazato, described as "one of
    the most noted students of Chotoku Kyan (student of the great Matsumura Sokon) and founder of Shorinji-ryu",
    who taught Nakaza Shuri-te.
