description:
  en: 'Blog of the Onomichi Kobudo Preservation Society (尾道古武道保存会), formerly the "Seibukan Onomichi Dojo",
    a

    group practicing Fusen-ryu jujitsu (founded by Motsuge Fusei, 9th abbot of saidoji-ji, Onomichi, Hiroshima

    Prefecture) and related martial arts. Describes the training curriculum as including jujitsu, kenjutsu,
    iaijutsu,

    bo-jutsu, jitte, naginata, kusarigama, and others; publishes articles on the arts and on anecdotes
    of the founder.

    Like the hombu site, the blog presents Fusen-ryu as an integrated koryu tradition with no special
    newaza emphasis.

    '
