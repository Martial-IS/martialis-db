description:
  en: Bushido Karate Club Ireland article on Eiichi Miyazato (1922-1999), one of the foremost inheritors
    of Chojun Miyagi's Goju-Ryu and founder of the Jundokan Dojo. Covers his early training under his
    father and then Chojun Miyagi (Sanchin emphasis), his role after Miyagi's death (helping oversee the
    dojo at the request of Miyagi's family, inheriting the training equipment), and the founding of the
    Jundokan (the article gives 1957, while the EN Wikipedia gives 1956).
