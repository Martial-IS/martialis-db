description:
  en: Budo Éditions' author biography page for Guy Pelletier (1921-2011), 9th dan judo, one of the
    pioneers of French judo who began under Feldenkrais then Kawaishi, opened the JC Saint-Martin club
    in Paris in 1945, and met Ichirō Abé in 1952, remaining loyal to him and tasked by him with developing
    Kodokan judo in France.
