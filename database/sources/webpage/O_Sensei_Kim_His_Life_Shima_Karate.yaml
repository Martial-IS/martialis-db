description:
  en: 'Shima Karate biography of O-Sensei Richard Kim''s life, including a section on Arakaki Ankichi
    (1899-1927): born into a wealthy family in Shuri, started training under Chomo Hanashiro and Shinpan
    Gusukuma, dropped out of middle school in his teens and began training under Chosin Chibana, at 19
    defeated a giant wrestler from Yomitan in a sumo tournament, died at 28 of ulcers.'
