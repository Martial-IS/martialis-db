description:
  en: Blog post on the Arequipa sports blog 'Deportes de Arequipa' by journalist Rómulo Jesús Leanderas
    Rodríguez, published on 18 April 2016 for the 24th anniversary of the Club Shinzo Murayama in Arequipa
    (founded 18 April 1992 in the Mariano Melgar district; first president Pastor Vizcarra Cárdenas; first
    coach Segundo Rivasplata Tejada). It recounts that Shinzo Shiozaki was born in Kumamoto Prefecture,
    Japan, on 27 March 1905, started judo at age 12, and arrived in Peru at age 25 (c. 1930) with the
    aim of spreading judo.
