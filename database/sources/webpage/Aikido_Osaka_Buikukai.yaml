description:
  en: Official website of the Aikido Osaka Buikukai Hombu Dojo, an Aikikai-registered dojo founded in
    1960 by Kobayashi Hirokazu. Records that the organization currently has about 50 dojo and 20 school
    aikido clubs in Osaka Prefecture, with Kimura Jiro (8th dan Aikikai) as president and chief instructor.
  ja: 合気道大阪武育会本部道場の公式ホームページ。昭和35年（1960年）に小林裕和により創設された（公財）合気会登録道場。現在大阪府内に総数50道場と所属校の合気道部20校があり、木村二郎（合気会八段位）が会長・首席師範であることを記す。
