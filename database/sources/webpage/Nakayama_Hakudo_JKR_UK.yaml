description:
  en: Biographical page on Nakayama Hakudo published by JKR-UK, the Kushida (Konishi lineage) karate organization.
    States that 'besides teaching Konishi Soke, he also taught kendo and Iaidō to Gigō Funakoshi, the
    third son of Gichin Funakoshi Sensei. It is thought that this led to the recognised influence in Shotokan
    of kendo and Iaidō based training.'
