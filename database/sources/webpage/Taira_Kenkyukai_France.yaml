description:
  en: Official page of the French branch of the Okinawa Goju Ryu Kenkyukai, a global karate organisation
    promoting research into the practical application of Okinawa Goju Ryu Karate kata and technique, headed
    by Taira Masaji Sensei, 9th Dan Hanshi. Confirms Taira Masaji (平良 正次, born 1 December 1952) as a leading
    teacher of Okinawa Goju Ryu Karate Do and head of the Okinawa Gojuryu Kenkyu Kai; his teacher was
    Eiichi Miyazato, a student of Chojun Miyagi and founder of the Jundokan; his karate is that of his
    teacher and the Jundokan with the addition of his novel approach to kata application, and he is best
    known as a researcher and practitioner of Goju Ryu kata bunkai. Records that he teaches seminars worldwide
    (US, Canada, Australia, France, Italy, Portugal, England, Lithuania, India and New Zealand) and that
    the French branch is represented since 2012 by OGKKF Paris (Pascal Duroux and Christian Rosso) and
    IGKDF Vanves (Nirina Rakotozafiminahy).
