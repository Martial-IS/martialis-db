description:
  en: Tribute pages of Ueshiro Shorin-Ryu Karate USA, the organization founded by Grand Master Ansei Ueshiro
    (1962) and continued by Hanshi Robert Scaglione. The students tribute (May 7, 2002) announces Ueshiro's
    death from a stroke, describes Shorin-ryu as the teachings of Master Nagamine brought from Okinawa,
    and the family tribute places his origins in Kin, Okinawa and his home in New York. Also carries a
    student-contributed photo tribute spanning his youth in Okinawa, the 1962 arrival in the USA, kata
    demonstrations, and later dojo photos through 1992.
