description:
  en: Official Japanese Cabinet Office (CAO) biography of Higaonna Kanryo for the Okinawan Karate heritage
    site. States he was born April 17, 1853 in Naha Nishimura, fourth son of firewood merchant Higaonna
    Kanyo; studied tōde under Arakaki Seisho from about age 17 (or 20) for about three years; crossed
    to China in 1874, becoming a disciple of the Fuzhou martial artist Ryu Ryu Ko (variously identified
    as Xie Chongxiang) after saving his teacher's family in a great flood; returned to Naha in 1877; began
    teaching at home in Nishimura, and in 1905 was the first to teach Naha-te within the school curriculum
    at the Naha Municipal Commercial School; died in 1915 of bronchial asthma.
