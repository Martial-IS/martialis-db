description:
  en: Houston Karate page on Yamanni Chinen Ryu Kobujutsu (Yamanni Ryu), a classical bojutsu art that
    originated in Okinawa and developed within the Ryukyuan warrior class. Traces the art's origins to
    Kanga Sakugawa bringing a staff-fighting art from China and its development by the Chinen family,
    entrusted with the security of Ryukyuan nobles. States Masami Chinen was the last member of the Chinen
    family to teach the art, and that upon his death the family passed the title of Soke to his student
    Chogi Kishaba, who began training with Chinen as a teenager; in 1979 Kishaba sent his top students
    Toshihiro Oshiro and Kiyoshi Nishime to the United States, and in 1985 they founded the RBKD with
    Kishaba as its head.
