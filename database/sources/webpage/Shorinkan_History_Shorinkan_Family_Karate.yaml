description:
  en: 'History page of Shorinkan Family Karate (Canon City, Colorado, under Sensei Jim Wick) on Shorin-ryu
    Shorinkan. States Chibana Choshin presented his personal black belt to his most influential student
    Nakazato Shugoro; Nakazato (1921-2016) was awarded 9th dan by Chibana in 1967, became president of
    the Okinawan Shorin-Ryu Shorinkan Karate-do Kyokai after Chibana''s death in 1969, was promoted to
    10th dan in 1980, is credited with introducing the Gorin kata, received the Intangible Cultural Asset
    title (August 2000), the Ken Bunka Korosha Cultural Award (2006), and the Order of the Rising Sun
    with Gold and Silver Rays (November 4, 2007). Note: gives birth year 1921, differing from the EN Wikipedia
    1920.'
