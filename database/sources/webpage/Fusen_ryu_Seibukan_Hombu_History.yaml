description:
  en: 'Official history page of the Fusen-ryu Seibukan hombu dojo. Presents the lineage: founder Takeda
    Motsuge (Motsugai)

    "Genkotsu Osho"; 2nd Takeda Teiji; 3rd Tanabe Torajiro; 4th Tanabe Mataemon (and co-4th Tanabe Takejiro);
    5th

    Nakayama Eisaburo; 6th Nakayama Yamato; 7th Inoue Kazutoshi. Notes the school''s curriculum as an
    integrated budo

    (jujitsu, kusarigama, bo-jutsu, naginata, yae-kama, jitte, etc.), records that Tanabe Mataemon''s
    disciples later

    established dojo such as the Senbukan and Iyokan in Kobe (the school names itself the "Bitchu Nagao-line
    Fusen-ryu

    Seibukan" to avoid confusion), and remarks that the school preserves the Fusen-ryu sanshuki (30 forms),
    2nd gen

    kumigae 42 hon, and the Butokukai-prescribed jujitsu kata of 4th gen Mataemon. Notably, the hombu''s
    own history

    contains no particular emphasis on newaza or ground-grappling as a defining feature of the school.

    '
