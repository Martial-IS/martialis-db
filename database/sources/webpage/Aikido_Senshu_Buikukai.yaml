description:
  en: Official website of the Aikido Senshu Buikukai, an Aikikai-recognized dojo founded in 1990 as the
    Senshu Aikido Association by the late Honda Doshū (7th dan), now renamed Aikido Senshu Buikukai and
    active across five cities and one town in the Senshu region of southern Osaka. Recognized by the Aikikai
    Foundation as an official dojo since April 2012; representative instructor Egawa Kunio (7th dan),
    vice-chairman of the Aikido Osaka Buikukai.
  ja: 合気道泉州武育会の公式ホームページ。1990年に（故）本田土洲師範（七段）により泉州合気道協会として設立され、現在は合気道泉州武育会と改名し大阪府南部・泉州地域の5市1町で活動する合気会公認道場。2012年4月から公益財団法人合気会より公認道場として認可。代表師範は合気道大阪武育会副理事長の江川邦夫七段。
