description:
  en: History of kendo in Shizuoka Prefecture before the Showa era, published by the Shizuoka Prefecture
    Kendo Federation from its 50th anniversary commemorative volume. Records that Onaga Kuro (大長九郎) mastered
    Rikishin-ryu (力信流, a comprehensive art of jujutsu, kendo, iai and bojutsu), came to Shizuoka from
    Okayama as a police jujutsu instructor, founded the Bushukan dojo (武修館) in Shizuoka City in 1903,
    and became a Shizuoka Prefecture police bujutsu professor (1908, 1918). Also records that in 1924
    the judoka Mochizuki Minoru and Murai Kyoichi spread Tenshin Shoden Katori Shinto-ryu at the Eishinkan
    dojo of Oka Fumio in Shizuoka City.
  ja: 静岡県剣道連盟が50周年記念誌等から抜粋した昭和以前の静岡県剣道史。大長九郎が力信流（柔術・剣道・居合・棒術の総合武術）を修め、岡山県から静岡県警察本署の柔術師範として来静し、1903年に静岡市富士見横町に武修館道場を創設、1908年・1918年に警察部剣道教授・県警察本部武術教授となったことを記す。また1924年、柔道家の望月稔と村井恭一が岡文雄の盈進館道場において天真正伝香取神道流を広めたことも記す。
