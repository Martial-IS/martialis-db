description:
  en: 'Official Motobu-ryu biography of Motobu Choki (本部朝基先生). Primary source of the Motobu family tradition:
    born Meiji 3, 4th month, 5th day (lunar) = May 5, 1870 (solar), third son of Motobu Aji Choshin and
    mother Shinushi; childhood name Masanra. Hired Itosu Anko at the Motobu Udundi at age 12 (kazoe),
    studying with his brother Choyu (five years older, to whom he always lost in kumite); secretly studied
    under Matsumura Sokon and Sakuma, Matsumura being Itosu''s own teacher and Motobu and Yabu Kentsu
    his beloved disciples; from 19 studied under Matsumora Kosaku, who praised his martial talent (Ryukyu
    Shimpo, Showa 11). Records the kake-dameshi at Tsuji, the move to Osaka c. 1921, the November 1922
    Kyoto boxing match at age 52, the 1923 dojo in Shikanjima (Osaka) and Mikage demonstrations, King
    magazine coverage (Taisho 14), the May 1926 kumite book, Toyo University first shihan (1929) and Waseda
    University first shihan (1930), the Daidokan at Koishiki Haramachi (named after the zen saying "daido
    munmon", the first formally named karate-only dojo in Japan), the 1932 book Watashi no Todejutsu,
    the 1936 return to Okinawa with the October 25, 1936 Ryukyu Shimpo Roundtable of Karate Masters (later
    "Karate Day") and the exclusive "Jitsusen-dan" interview of November 7, 1936; the late resumption
    of kenjutsu and bojutsu; the closing of the Daidokan in 1941, final return to Okinawa in 1942, and
    death April 15, 1944 at 74, his grave in Kaizuka, Osaka Prefecture.'
