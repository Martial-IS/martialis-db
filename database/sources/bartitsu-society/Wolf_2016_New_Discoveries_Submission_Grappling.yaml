description:
  en: 'Research article by Bartitsu historian Tony Wolf (originally published on bartitsu.org, 14 Sep
    2016) on the

    "mixed styles" submission grappling matches of London c.1900 and their roots. Identifies K. Tani (Kaneo
    Tani, son

    of Tenshin Shin''yo-ryu sensei Torao Tani) and S. Yamamoto as Bartitsu Club principals alongside Yukio
    Tani and

    Sadakazu Uyenishi; documents Yataro Handa''s Osaka dojo (opened 1897, teaching a Sekiguchi-ryu-derived
    Daito-ryu)

    as the training ground of Uyenishi, Yamamoto and Taro Miyake; attributes the ne-waza innovations largely
    to

    Mataemon "Newaza" Tanabe - quoting Tanabe''s own account of his development, the historian Minoru
    Yamada on Tanabe

    teaching both Yukio Tani and Taro Miyake at the Senbukan dojo in Kobe during the 1890s, and judo historian

    Shinichi Oimatsu that "Tani was a student of Tanabe Mataemon in Kobe" - notes the 1891 loss of Takizaburo
    Tobari

    to Tanabe, and records that most of E.W. Barton-Wright''s martial-arts training was done in Kobe at
    the Shinden

    Fudo-ryu dojo of sensei Terajima Kuniichiro for about three years (c.1895-1898). Heavily relied upon
    by Brough et

    al. (2023, mas.166).

    '
