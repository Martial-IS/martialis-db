description:
  en: The Karate Page article tracing the lineage of the Gojushiho kata across Okinawan karate schools.
    States Seiichi Iju was the first teacher of Shuguro Nakazato (founder of Shorin-ryu Shorinkan), learned
    Gojushiho from Shinpan Gusukuma, and - since he is never mentioned as a student of Anko Itosu and
    was a student of Gusukuma (b. 1890) - estimates Iju was not born before 1900.
