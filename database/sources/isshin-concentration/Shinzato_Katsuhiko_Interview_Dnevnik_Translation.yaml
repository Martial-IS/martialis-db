description:
  en: Translation (posted July 15, 2019 on the Isshin - Concentration the Art blog) of an interview with
    Katsuhiko Shinzato published in the Slovenian newspaper Dnevnik, conducted during his seminar visit
    to Slovenia (with his Okinawan students, at the invitation of Borut Mauhler); the interview dates
    to around 2010, as Shinzato mentions that the Encyclopaedia of Okinawan karate and kobudo (Kashiwashobo,
    Tokyo) was published the previous month. Shinzato states he entered the University of the Ryukyus
    in 1957 and began karate then, continued at a graduate school in the US, that the master with the
    greatest influence on him was Chokei Kishaba (dates given as 1931-2000), and that the study circle
    "Kishaba Juku" is named in honor of Kishaba's unique training methods. He was one of the contributors
    to the Encyclopaedia, whose information gathering began in 2003, and practices karate most days for
    six hours.
