description:
  en: Joe Swift's 2001 article on Motobu Choki, reposted on the Isshin-Concentration blog in 2019. Covers
    Motobu's Osaka years (karate promotion society, 1926 book Okinawa Kenpo Karatejutsu Kumite-hen), his
    1927 move to Tokyo and the Daidokan dojo, and lists Ueshima Sannosuke of Kushinryu among the sympathetic
    Tokyo karate exponents in contact with Motobu.
