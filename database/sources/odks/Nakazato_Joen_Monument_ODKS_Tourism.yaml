description:
  en: Okinawa Dento Karatedo Shinkokai page on the Nakazato Joen commemorative monument in Chinen, Nanjo
    City (589 Chinen, Chinen, Nanjo City). States Nakazato Joen (1922-2010), a leading figure in the Okinawan
    karate world, was born in Chinen Village in 1922 and studied under Kyan Chotoku from 1938 to 1943,
    a training period of six years and eight months during which he learned the essence of Shuri-te and
    Tomari-te and faithfully inherited Kyan's teachings. Records that he opened a dojo in Kumamoto Prefecture
    in 1947, established another in his hometown of Chinen Village upon returning to Okinawa in 1952,
    and founded the Shorinji-Ryu style in 1955, based on Shuri-te and Tomari-te with techniques derived
    from the eight kata passed down from Kyan. He held positions including Vice Chairman of the Japan
    Karatedo Federation Okinawa Branch, Vice Chairman of the Okinawa Karate Federation and Chairman of
    the All Okinawa Karate Do Federation; was awarded 10th dan Shorinji-Ryu Hanshi in 1989; was recognized
    as a holder of Okinawa Prefecture's intangible cultural asset "Okinawa Karate and Kobujutsu" in 2000;
    and was selected as an Okinawa Prefecture Person of Cultural Merit in 2007.
