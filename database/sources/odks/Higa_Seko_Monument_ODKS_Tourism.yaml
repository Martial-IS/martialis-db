description:
  en: Okinawa Dento Karatedo Shinkokai (Naha) tourism page on the Seko and Seikichi Higa commemorative
    monument at the Higa family gravesite in Shikina, Naha. States Seko Higa (1898-1966) entered the dojo
    of Kanryo Higaonna and later trained under Chojun Miyagi, served as a police officer before establishing
    his own dojo, was the first chairman of the International Goju-ryu Karate Kobudo Federation and the
    first vice chairman of the Okinawa Prefecture Karate-do Federation.
