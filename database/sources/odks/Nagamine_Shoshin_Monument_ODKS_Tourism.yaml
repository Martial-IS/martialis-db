description:
  en: Okinawa Dento Karatedo Shinkokai tourism page on the Nagamine Shoshin monument in Tomari, Naha.
    States Nagamine, born in Tomari, began his martial arts journey under Chojin Kuba of Tomari-te, then
    Taro Shimabukuro of Shuri-te, and ultimately Ankichi Aragaki, a disciple of Kyan Chotoku; while stationed
    at Kadena Police Station he studied under Kyan Chotoku for approximately two years; created the "popular
    kata I" in 1941; in 1997 became the first individual in the Okinawan karate community designated "Okinawa
    Prefecture's Intangible Cultural Property Holder."
