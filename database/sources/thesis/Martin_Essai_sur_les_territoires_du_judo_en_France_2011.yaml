description:
  en: Grégory Martin's doctoral thesis (Université Bordeaux 3 - Michel de Montaigne, 2011, HAL tel-00808060)
    on the spatial diffusion of judo in France. Documents the role of Moshé Feldenkrais as one of the
    introducers of judo in France in the 1930s and of Paul Bonét-Maury as the French architect of its
    development, the founding of the Jiu-Jitsu Club de France on 20 September 1936, the 1939 merger with
    the Club Franco-Japonais, and the early French judo championships.
  fr: Thèse de doctorat de Grégory Martin (Université Bordeaux 3 - Michel de Montaigne, 2011, HAL tel-00808060)
    sur la diffusion spatiale du judo en France. Documente le rôle de Moshe Feldenkrais comme l'un des
    introducteurs du judo en France dans les années 1930 et de Paul Bonét-Maury comme artisan du développement
    du judo français, la création du Jiu-jitsu Club de France le 20 septembre 1936, la fusion de 1939
    avec le Club Franco-Japonais et les premiers championnats de France de judo.
