description:
  en: >-
    Udo Mönig's (later spelt Moenig) doctoral dissertation (Keimyung University, 2012). A critical
    history of taekwondo. Chapter V traces the founders of the five original kwan to their karate teachers
    in Japan (Funakoshi Gichin, Tōyama Kanken, possibly Mabuni Kenwa) and covers the naming of taekwondo
    in 1955 and the Korea Taekwondo Association. Chapter VII covers the move to full-contact sport, the
    Ji-Do Kwan's bōgu sparring and the WTF. Locators are the printed page numbers.
