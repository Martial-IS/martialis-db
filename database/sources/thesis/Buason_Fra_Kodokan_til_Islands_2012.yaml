description:
  en: >-
    Ragnar Logi Búason's BA thesis in history (University of Iceland, 2012,
    supervised by Guðmundur Hálfdanarson) on Icelandic judo from 1956 to
    1975: the start of judo at Ármann after the 1956 boxing ban, its first
    foreign instructors, the founding of Judokwai (later Judofélag
    Reykjavíkur), and the founding and first years of the Judo Federation of
    Iceland. Draws on newspapers, JSÍ records and interviews with Sigurður H.
    Jóhannsson and Eysteinn Þorvaldsson.
notes: >-
  Linked from jsi.is as "Saga JSÍ". Leads not yet recorded: Ármann
  instructors Friedhelm Geyer (1956-1958, p. 6) and Bernard Paul (1960, p.
  8); visiting instructors Kisaburo Watanabe (1966, p. 19), Alex Fraser and
  George Kerr (1968, p. 20), Syd Hoare and Ichiro Abe (JR, 1968, pp. 21-22),
  N. Yamamoto, 5th dan, brought by Kobayashi to coach at Ármann in
  1969-1970; Kobayashi's 1969 visit as technical adviser to
  the ÍSÍ judo committee (p. 22); Eysteinn Þorvaldsson, JSÍ chairman from
  1973 for a decade (pp. 34-35).
