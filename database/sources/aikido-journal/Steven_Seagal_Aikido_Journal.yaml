description:
  en: Aikido Journal Encyclopedia entry on Steven Seagal, documenting that he studied karate under Fumio
    Demura before beginning aikido under Harry Ishisaka at the Orange County Aikikai, received his 1st
    dan from Koichi Tohei in the summer of 1974, took over the Aikikai-affiliated Tenshin Aikido Dojo
    in Osaka, was promoted to 5th dan and eventually awarded 6th dan.
