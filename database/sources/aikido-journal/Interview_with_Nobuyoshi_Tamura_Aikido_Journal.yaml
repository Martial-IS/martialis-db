description:
  en: Interview with Nobuyoshi Tamura conducted in two parts (Marseille, 2 August 1983 by Didier Boyet;
    Tokyo, 29 August 1984 by Stanley Pranin) and published by Aikido Journal. Covers his entry into the
    Aikikai Hombu Dojo as an uchi-deshi around 1953-54, his years taking ukemi for Morihei Ueshiba, and
    his training in aiki-ken and jo.
