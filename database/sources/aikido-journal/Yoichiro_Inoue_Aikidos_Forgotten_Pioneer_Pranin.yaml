description:
  en: >-
    Long biographical article by Stanley Pranin on Inoue Yōichirō (Noriaki):
    judo under Takagi in Tanabe around 1911, Hokkaido and Takeda Sōkaku, the
    Omoto years, the Tokyo and Budō Senyōkai period with Ueshiba Morihei, and
    the post-war Aiki Budō, Shinwa Taidō and Shin'ei Taidō names. Quotes
    Inoue's interviews with the author.
