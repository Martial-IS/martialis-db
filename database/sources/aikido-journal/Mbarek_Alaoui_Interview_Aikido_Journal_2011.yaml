description:
  en: Interview with M'barek Alaoui conducted for Aikido Journal (2011) and reproduced on aiki-wiki.eu.
    Alaoui describes beginning aikido in 1957 with European teachers in Morocco including Georges Stobbaerts
    and Julien Naessens, receiving his shodan from Nobuyoshi Tamura in 1964 as the first shodan in Morocco,
    the teachers who passed through Casablanca (Nakazono, Chiba, Noro), the beginning of Emile Metzinger
    in 1964, Tamura's regular visits and his relations with the Portuguese aikido federation.
  fr: Entretien avec M'barek Alaoui réalisé pour Aikido Journal (2011) et reproduit sur aiki-wiki.eu.
    Alaoui décrit le début de l'aïkido en 1957 avec des professeurs européens au Maroc dont Georges Stobbaerts
    et Julien Naessens, la réception de son shodan de Nobuyoshi Tamura en 1964 comme premier shodan au
    Maroc, les professeurs passés par Casablanca (Nakazono, Chiba, Noro), le début d'Emile Metzinger en
    1964, les visites régulières de Tamura et ses relations avec la fédération portugaise d'aïkido.
