description:
  en: Research article by Guillaume Erard clarifying the connection between Takuma Hisa and Hirokazu Kobayashi,
    concluding that Kobayashi's exposure to Daito-ryu Aiki-jujutsu under Hisa was brief and informal,
    and that his practice was essentially post-war Aikido. Includes statements from Kimura Jiro and André
    Cognard.
