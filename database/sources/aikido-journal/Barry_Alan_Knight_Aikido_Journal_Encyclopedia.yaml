description:
  en: Encyclopedia entry for Barry Alan Knight on Aikido Journal, recording his birth in 1945, career
    as a risk manager and graduate in physics/engineering/risk management, beginning aikido in Melbourne
    in 1970, practice at Aikikai Hombu Dojo in 1976 and at Iwama under Morihiro Saito from 1978-1980,
    his private dojo (Rensei Dojo) in Melbourne, and his ranks including 5th dan Aikikai (Iwama style)
    and 4th dan kyudo.
