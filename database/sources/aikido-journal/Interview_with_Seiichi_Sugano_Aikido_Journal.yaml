description:
  en: Interview with Seiichi Sugano conducted on 13 November 1996 at the New York Aikikai by Fuyuo Nanaura,
    published by Aikido Journal. Covers his entry into aikido, his years as an uchi-deshi under Morihei
    Ueshiba at the old Wakamatsu-cho dojo, his departure for Australia in 1965, and his views on training
    and O-Sensei's legacy.
