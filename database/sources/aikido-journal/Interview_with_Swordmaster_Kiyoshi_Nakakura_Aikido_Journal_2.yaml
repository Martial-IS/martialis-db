description:
  en: Second of a two-part interview with Kiyoshi Nakakura conducted by Stanley Pranin on 23 December
    1987 at his residence in Higashi Murayama City. Nakakura discusses the early naming of the art (Daito-ryu,
    Aioi-ryu, Aiki Budo, Aikido), the Kobukan and Admiral Isamu Takeshita, the Omoto religion and the
    1935 incident, Sokaku Takeda's visits, Junichi Haga, the Saineikan and Tenranjiai tournaments, his
    trip to Manchuria in 1942, and his 1969 trip to Europe founding the European Kendo Federation and
    the 1970 World Kendo Tournament.
