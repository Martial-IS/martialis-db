description:
  en: First of a two-part interview with Kiyoshi Nakakura conducted by Hideo Yamanaka and Stanley Pranin
    (interviews of 15 October and 23 December 1987) at his residence in Higashi Murayama City. Nakakura
    describes his childhood in Kagoshima, the harsh training at the Daidokan, entering the Yushinkan of
    Hakudo Nakayama in 1930, his arrival at the Kobukan as Ueshiba's adopted son (married his daughter
    Matsuko in 1932, name Morihiro Ueshiba), training both kendo and aikido there, the live-in students
    of the Kobukan, and his decision to leave the Ueshiba family in 1937.
