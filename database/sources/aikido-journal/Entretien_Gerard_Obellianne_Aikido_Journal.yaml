description:
  en: Interview with Gérard Obellianne conducted by Horst Schwickerath (Auch, 24 September 2013), published
    in Aikido Journal n°49FR (1/2014) and reproduced on aiki-wiki.eu. Covers his birth in Rabat in 1942,
    his study of aikido with Georges Stobbaerts from 1967/68 and his direction of the Budo Club du Maroc
    after Stobbaerts left in 1970, his decisive training under Hirokazu Kobayashi from 1970 to 1982 and
    his role as delegate of the Aikikai Osaka Hombu for Morocco (1972-1980), the 1970 falling-out between
    Stobbaerts and Nobuyoshi Tamura and the creation of the Syu do kan by M'Barek Alaoui and Emile Metzinger,
    the Bu Iku Kan club he co-founded with Jean Visconti, his return to France in 1987, and his club at
    the Mont-de-Marsan air base.
  fr: Entretien avec Gérard Obellianne réalisé par Horst Schwickerath (Auch, 24 septembre 2013), publié
    dans Aikido Journal n°49FR (1/2014) et reproduit sur aiki-wiki.eu. Couvre sa naissance à Rabat en
    1942, son étude de l'aïkido avec Georges Stobbaerts à partir de 1967/68 et sa direction du Budo Club
    du Maroc après le départ de Stobbaerts en 1970, sa formation décisive sous Hirokazu Kobayashi de 1970
    à 1982 et son rôle de délégué de l'Aïkikaï Osaka Hombu pour le Maroc (1972-1980), la mésentente de
    1970 entre Stobbaerts et Nobuyoshi Tamura et la création du Syu do kan par M'Barek Alaoui et Emile
    Metzinger, le club Bu Iku Kan co-fondé avec Jean Visconti, son retour en France en 1987, et son club
    à la base aérienne de Mont-de-Marsan.
