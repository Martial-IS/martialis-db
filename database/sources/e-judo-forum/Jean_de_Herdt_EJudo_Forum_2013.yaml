description:
  en: Forum post by the historian Cichorei Kano (E-Judo forum), 15 April 2013, on the death of Jean de
    Herdt earlier that year. Notes that neither the IJF nor the EJU devoted attention to his passing,
    that de Herdt was the first European judo champion and a four-time European champion, and that he
    is considered one of Kawaishi's first judo students (per certain sources, the 21st), having started
    judo the same year as Fukuda Keiko (1935). Recounts de Herdt's 1951 drawn match (match-nul) against
    Toshiro Daigo after 22 minutes, de Herdt's own claim that he could have beaten a gassed Daigo but
    declined out of respect, and links to the lyonne.fr article on de Herdt.
