description:
  en: >-
    E-Judo forum thread of May-June 2014 on Shōriki Matsutarō's 10th dan and
    his wartime record. Cichorei Kano states that he has pictures of Shōriki
    training under Mifune Kyūzō and describes a well-known photograph of the
    two in kamae; fredlinux posts a picture of Mifune and Shōriki. It also
    discusses the dates of his 7th, 9th and 10th dan promotions.
