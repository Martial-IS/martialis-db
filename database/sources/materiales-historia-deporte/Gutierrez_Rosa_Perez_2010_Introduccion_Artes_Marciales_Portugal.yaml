description:
  en: 'Peer-reviewed journal article (Materiales para la Historia del Deporte, vol. VIII, 2010, pp. 9-17)
    on the

    arrival of Asian martial arts in Portugal. Documents Raku (Sadakazu Uyenishi), born in Osaka on 22
    December 1880

    (1.65 m, 58 kg), debuting at the Colyseu dos Recreios in Lisbon on 21 December 1907 (defeating Joaquim
    de Sousa

    Sardinha), his Lisbon run until 20 February 1908 as the assassination of Carlos I loomed, the Terceiro
    Campeonato

    Internacional de Lucta (18 April - mid-May 1908) where he beat Poirée, Coconet, Schneider and others
    under jujutsu

    rules, a Porto run at the Teatro Águia d''Ouro (19-29 December 1908), and a second Lisbon run (20
    November -

    25 December 1909). Companions included Etaro Deguchi "Deko" and Imagiro Hayashi. Yuzo Hirano arrived
    with Takitaro

    Taki in Lisbon in late 1909 (1.45 m, 50 kg), acted until 2 January 1910 and in Oporto 16 June - mid-August
    1910,

    married Phoebe Laughton Parry (a former student of Raku in London), settled with her in Porto, and
    - per Armando

    Gonçalves''s own books (1914, 1936, 1941, 1942) - trained Gonçalves and formed the ranks of the PSP
    (Polícia de

    Segurança Pública) in jujutsu. Also covers Yukio Tani''s Lisbon run (Nov-Dec 1911, vs Maurice de Riaz)
    and the

    post-1946 revival via António Hilmar Schalck Corrêa Pereira''s Academia de Judo.

    '
  es: 'Artículo de revista (Materiales para la Historia del Deporte, vol. VIII, 2010, pp. 9-17) sobre
    la llegada de las

    artes marciales asiáticas a Portugal. Documenta a Raku (Sadakazu Uyenishi), nacido en Osaka el 22
    de diciembre de

    1880 (1,65 m, 58 kg), su debut en el Colyseu dos Recreios de Lisboa el 21 de diciembre de 1907 (venciendo
    a Joaquim

    de Sousa Sardinha), su temporada lisboeta hasta el 20 de febrero de 1908, el Tercer Campeonato Internacional
    de

    Lucha (18 de abril - mediados de mayo de 1908), una gira por Porto en el Teatro Águia d''Ouro (19-29
    de diciembre de

    1908) y una segunda temporada en Lisboa (20 de noviembre - 25 de diciembre de 1909). También documenta
    a Yuzo Hirano,

    que llegó con Takitaro Taki a Lisboa a finales de 1909, actuó hasta el 2 de enero de 1910 y en Oporto
    desde el 16 de

    junio hasta mediados de agosto de 1910, se casó con Phoebe Laughton Parry y se instaló con ella en
    Porto; según los

    propios libros de Armando Gonçalves (1914, 1936, 1941, 1942), Hirano entrenó a Gonçalves y formó las
    filas de la PSP

    en jujutsu.

    '
