description:
  en: Blog post on the Olimpiaduerme blog, published 2 October 2015, announcing Fernando Franco as the
    first Spanish black belt in judo. Recounts his 1st dan from Ichiro Abe (22 July 1954), his selection
    for the Spanish national team at the European Championships in Brussels (1954), and the first 5th
    dan exam in Spain (November 1969 at Gimnasio Moscardó, with Henri Courtine and Bernard Pariset as
    tribunal, where Fernando Franco and José Pons were the only ones to pass). Also mentions the posthumous
    7th dan granted by RFEJYDA.
