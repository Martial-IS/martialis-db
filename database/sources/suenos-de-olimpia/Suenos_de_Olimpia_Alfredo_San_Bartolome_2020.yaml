description:
  en: 'Blog post on the Spanish sports-history blog Sueños de Olimpia retelling the origins of judo in
    Spain around Alfredo San Bartolomé: his arrival at the Gimnasio Juventud in Madrid in 1947, the foundation
    of the Asociación Española de Judo y Jiu-Jitsu in May 1950 and its renaming to Bushidokwai, the role
    of the club in the genesis of Spanish judo, San Bartolomé''s 3rd dan from Ichiro Abe (1954) and 4th
    dan from Kiyoshi Mizuno (1958), his failure in the November 1969 5th dan exam and his promotion to
    5th dan by the Federación Española in 1973, and his death in Madrid in May 1979.'
