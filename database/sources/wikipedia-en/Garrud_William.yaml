description:
  en: 'English Wikipedia article on William Garrud (1873-1960), British jujutsu instructor. Documents
    his introduction to

    jujutsu in 1899 with his wife Edith, study under Yukio Tani and Sadakazu Uyenishi at the Bartitsu
    school and the

    Golden Square dojo, training also with Taro Miyake, Mitsuyo Maeda, Gunji Koizumi and Akitaro Ohno
    at Golden Square,

    his taking over the Golden Square dojo when Uyenishi left for Japan in 1908, the 1914 book "The Complete
    Jujitsuan"

    dedicated to Uyenishi, WWI training of the Volunteer Civil Force, and his retirement in 1925. Cites
    Brough (2020),

    Royal Armouries (2018), Kelly (2019), Godfrey (2010) and Green & Svinth (2010).

    '
