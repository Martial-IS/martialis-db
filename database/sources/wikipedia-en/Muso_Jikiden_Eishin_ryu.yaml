description:
  en: English Wikipedia article on Muso Jikiden Eishin Ryu, a Japanese iaijutsu school descended from
    Hayashizaki Jinsuke. Covers its history in the Tosa domain under the Yamauchi clan, the role of Oe
    Masaji in restructuring the curriculum, the two main branches (Tanimura-ha and Shimomura-ha), and
    notable teachers including Hosokawa Yoshimasa and Goto Magobei Masasuke. Oe Masaji was the second
    person after Nakayama Hakudo to be awarded hanshi in iaido by the Dai Nippon Butoku Kai.
