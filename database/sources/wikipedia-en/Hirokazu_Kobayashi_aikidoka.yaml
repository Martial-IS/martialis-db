description:
  en: Wikipedia article on Hirokazu Kobayashi (小林裕和), Japanese aikido teacher and student of Morihei Ueshiba,
    awarded 8th dan in 1970 and initiator of Kobayashi aikido. Covers his wartime survival, his time as
    uke to Ueshiba alongside Morihiro Saito, his role as chief instructor in Kansai, and his teaching
    in Europe from 1964.
