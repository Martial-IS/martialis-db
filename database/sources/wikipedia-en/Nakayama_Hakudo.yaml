description:
  en: English Wikipedia article on Nakayama Hakudo (1872-1958), founder of the iaido style Muso Shinden-ryu.
    Records his hanshi (master instructor) ranks in kendo, iaido and jodo from the All Japan Kendo Federation,
    his instructor's license in Shinto Muso-ryu and menkyo kaiden in Shindo Munen-ryu as 7th soke, his
    teaching at the Yushinkan Dojo, his friendship with Morihei Ueshiba and role in arranging the marriage
    of his student Kiyoshi Nakakura to Ueshiba's daughter Matsuko, his teaching of Minoru Mochizuki and
    Gigo Funakoshi, and his role in the Toyama Military Academy sword curriculum.
