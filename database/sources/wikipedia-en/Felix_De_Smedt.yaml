description:
  en: English Wikipedia biography of Felix De Smedt, credited with introducing judo to Belgium. Covers
    his formal study in Berlin in January 1941 under Erich Rahn, the founding of the first Belgian judo
    club (Bushido-Kwai) at Schelle on 20 May 1946 and its move to Mechelen in 1951, his promotion to shodan
    in September 1952 by Ger F. M. Schutte and his first-generation study under Tokio Hirano from 1952,
    his teaching of police and children's judo, the Royal title granted in 1996, his ranks of BJB 2nd
    dan and BKFS 6th dan, his death on 2 August 2012, and the Mechelen dojo named after him that October.
