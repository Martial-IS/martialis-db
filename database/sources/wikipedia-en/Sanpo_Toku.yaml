description:
  en: English Wikipedia article on the pre-war Kodokan judoka Sanpo Toku (1887-1945), covering his 165-opponent
    league victory, the public rivalry with Mifune known as 'Waza no Mifune / Oni no Toku', his refusal
    to learn ukemi, his expulsion from the Kodokan after the 1912 Brazilian Navy incident and reinstatement
    in 1917, his own dojo, and his students including Minoru Mochizuki.
