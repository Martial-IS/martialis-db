description:
  en: English Wikipedia article on jodo, the Japanese martial art of the short staff (jo). Gives the art's
    two names - jodo, "way of the jo", and jojutsu, "art of the jo" - notes its similarity to bojutsu
    and its strong focus on defence against the Japanese sword, and gives the jo's length as roughly 3
    to 5 feet. Also recounts the Shinto Muso-ryu founding tradition of Muso Gonnosuke Katsuyoshi and his
    duels with Miyamoto Musashi, including the shortening of the bo to a 4 shaku 2 sun 1 bu jo.
