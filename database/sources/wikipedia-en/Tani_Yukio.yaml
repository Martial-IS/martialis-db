description:
  en: 'English Wikipedia article on Yukio Tani (1881-1950), pioneering Japanese jujutsu and judo instructor
    and

    professional challenge wrestler, one of the first jujutsu stylists to teach and compete outside Japan.
    Covers his

    early training (Tenjin Shinyo-ryu under his father, rumoured study with Mataemon Tanabe, evidence
    of training at

    Yataro Handa''s Seibukan school in Osaka), arrival in London in 1900 with Barton-Wright''s invitation,
    Bartitsu club

    demonstrations with Uyenishi, the music hall challenge circuit under William Bankier, the 1906 book
    "The Game of

    Ju-Jitsu", his first professional teaching post at the Budokwai from 1918, the 2nd dan judo certification
    awarded

    by Jigoro Kano in 1920 (later 4th dan), his leading student Masutaro Otani (founder of the MOSJ/British
    Judo

    Council), the 1937 stroke, and his death in London on 24 January 1950.

    '
