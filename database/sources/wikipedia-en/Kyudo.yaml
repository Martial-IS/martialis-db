description:
  en: English Wikipedia article on kyudo, the Japanese martial art of archery. Records that kyudo is based
    on the older kyujutsu of the feudal samurai class, that the name was officially changed from kyujutsu
    to kyudo in 1919, and that the reorganization followed the example of other martial arts systematizing
    for educational purposes. Also covers the yumi (the asymmetrical bow of over two metres, gripped at
    the lower third), the term yumihiki for practitioners, and worldwide practice numbers.
