description:
  en: English Wikipedia article on Masakatsu Morita (1945-1970), Tatenokai member who attempted the kaishaku
    after Mishima's seppuku and then killed himself the same way. Records his birth in Yokkaichi, Catholic
    schooling, entry to Waseda University in 1966, first meeting with Mishima on 19 June 1967, membership
    from the society's establishment in October 1968, and the events of 25 November 1970 at the Ichigaya
    garrison.
