description:
  en: English Wikipedia article on Kiyoshi Nakakura. Describes him as the top kendo student of Nakayama
    Hakudo, appointed by Hakudo to represent kendo at Morihei Ueshiba's aikido dojo; he married Ueshiba's
    daughter Matsuko, was adopted into the Ueshiba family as Morihiro Ueshiba, but left after a few years
    over Ueshiba's Oomoto-kyo beliefs, with Kisshomaru Ueshiba taking his place as heir. He achieved 9th
    dan in both kendo and iaido.
