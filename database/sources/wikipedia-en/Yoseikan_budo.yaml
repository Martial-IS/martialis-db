description:
  en: 'English Wikipedia article on Yoseikan Budo, the composite (sogo budo) Japanese-French martial art
    created by Hiroo Mochizuki, covering its eclectic origins in Minoru Mochizuki''s Yoseikan system (judo,
    aikido, karate, Gyokushin-ryu jujutsu, Tenshin Shoden Katori Shinto-ryu, boxing, savate), the 1970s
    creation of the modern style, its rank system (mudansha/yudansha, blue gi, blue and white belt), competition
    forms, and the 2000 soke succession. Note: the article carries a ''needs more citations'' banner.'
