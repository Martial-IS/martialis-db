description:
  en: 'English Wikipedia article on Wado-ryu, one of the four major karate styles, founded by Hironori
    Otsuka (1892-1982) out of Shindo Yoshin-ryu jujutsu and Okinawan karate (Funakoshi, Mabuni, Motobu).
    Covers the founding dates (1929 first teaching at Tokyo University, 1938 registration with the Dai
    Nippon Butoku Kai as ''Shinshu Wadoryu Karate-Jujutsu''), the technique and kata, ranks, the Wadokai/renmei
    organisations, and notable practitioners including Hiroo Mochizuki. Note: the article carries a ''needs
    more citations'' banner.'
