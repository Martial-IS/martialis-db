description:
  en: >-
    English Wikipedia article on Pierre Vigny (1866–1943), French master-at-arms: birth at Taninges,
    army service from 1886, his school in Geneva, chief instructor of the Bartitsu Club, his own London
    academy at 18 Berner Street from 1903, return to Geneva in 1912, and his walking-stick and umbrella
    method, which H. G. Lang's 1923 book drew on through Lang's training with Vigny's student Percy Rolt.
