description:
  en: English Wikipedia article on Shindo Munen Ryu, a koryu school of kenjutsu and iaijutsu founded by
    Fukui Hyoomon Yoshihira in the early 18th century. Covers the Edo Den lineage, the creation of the
    Kanto Ha by Negishi Shingoro (6th generation), the succession to Nakayama Hakudo (7th generation)
    and Nakayama Zendo (8th generation), and the school's survival through the Meiji period. Lists notable
    practitioners including Negishi Shingoro, Nakayama Hakudo, Hashimoto Toyo, Kiyoshi Nakakura, and Haga
    Junichi.
