description:
  en: 'English Wikipedia article on Moshé Feldenkrais: born 6 May 1904 in Slavuta (Russian Empire, present-day
    Ukraine), died 1 July 1984 in Tel Aviv; his studies in Paris and work at the Radium Institute with
    Frédéric Joliot-Curie; his meeting with Jigoro Kano in September 1933 and Kano''s encouragement to
    study judo under Mikinosuke Kawaishi; black belt in 1936 and 2nd dan in 1938 (dates flagged citation-needed);
    co-founding member of the Ju-Jitsu Club de France; his flight to Britain in 1940 and the origin of
    the Feldenkrais Method.'
