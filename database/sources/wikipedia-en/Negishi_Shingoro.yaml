description:
  en: English Wikipedia article on Negishi Shingoro (1844-1913), samurai of Nagaoka Domain, 6th and last
    headmaster of Shindo Munen Ryu kenjutsu, founder of the Yushinkan dojo in Tokyo. Describes his training
    at the Renpeikan, his Menkyo Kaiden in Shindo Munen Ryu, his Hanshi title from Dai Nippon Butokukai
    (1906), his role in creating the Dai Nippon Teikoku Kendo Kata, and his most famous student Nakayama
    Hakudo, to whom he also served as adoptive father.
