description:
  en: 'English Wikipedia article on Bartitsu, the eclectic self-defence system founded by E.W. Barton-Wright
    in London in

    1899. Records that Barton-Wright, via correspondence with Jigoro Kano, arranged for Japanese jujutsu
    practitioners

    Kaneo Tani, Seizo Yamamoto and the nineteen-year-old Yukio Tani to travel to London and serve as instructors
    at the

    Bartitsu Club at 67b Shaftesbury Avenue; that Kaneo Tani and Yamamoto soon returned to Japan while
    Yukio Tani stayed

    and was joined by Sadakazu Uyenishi; and that the Japanese instructors fought challenge matches against
    other combat

    styles on the music hall circuit.

    '
