description:
  en: Wikipedia article on Shin Shin Toitsu Aikido (心身統一合氣道), also known as Ki Aikido (氣合氣道), a Japanese
    gendai budo derived from aikido. It documents the 1971 creation of the Ki No Kenkyūkai (Ki Society)
    by Koichi Tohei while he was still chief instructor at the Aikikai Hombu Dojo, his split from the
    Aikikai in 1974, and the subsequent split of the teaching among several federations.
