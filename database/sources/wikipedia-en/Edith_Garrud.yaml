description:
  en: 'English Wikipedia article on Edith Garrud (1872-1971), née Edith Margaret Williams, the first British
    female

    teacher of jujutsu and one of the first female martial arts instructors in the Western world. Documents
    her

    introduction to jujutsu in 1899 alongside her husband William Garrud, their study under Yukio Tani
    and Sadakazu

    Uyenishi at the Bartitsu School of Arms and continued training under Uyenishi at the Golden Square
    Dojo, their

    taking over the dojo at the end of 1908, her own School of Ju-jutsu at Argyll Place from about 1909,
    the

    Suffragettes'' Self-Defence Club offered to WSPU members, and her 1913 training of the WSPU Bodyguard.
    Cites

    Crawford (2003), Kelly (2019), Royal Armouries (2018), Green & Svinth (2010), Godfrey (2010/2012),
    Looser (2011),

    Rouse (2017) and Callan/Heffernan/Spenn (2018).

    '
