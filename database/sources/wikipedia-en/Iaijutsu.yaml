description:
  en: English Wikipedia article on iaijutsu, the combative quick-draw sword technique and one of the koryu
    disciplines of the classical warrior. Notes the term emerged from earlier sword-drawing practice (with
    battojutsu as an older name), its counter-attack orientation, Draeger's two starting postures (iai-goshi,
    tachi-ai), and the koryu schools that include iaijutsu (Muso Jikiden Eishin-ryu, Suio-ryu, Mugai-ryu,
    Tenshin Shoden Katori Shinto-ryu, Hoki-ryu and others). States that iaijutsu preceded and coexists
    with the modern form iaido (term first appearing in 1932).
