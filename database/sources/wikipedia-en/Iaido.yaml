description:
  en: English Wikipedia article on iaido, the modern Japanese budo art of drawing the sword. Notes the
    term appeared in 1932, was popularized by Nakayama Hakudo, and emerged from iaijutsu. Describes the
    four components of iaido kata (nukitsuke, kiritsuke/kirioroshi, chiburi, noto), solo practice, the
    koryu forms in the Toho-gata set (Muso Jikiden Eishin-ryu, Mugai-ryu, Shindo Munen-ryu, Suio-ryu,
    Hoki-ryu), and iaido's status as an intrinsic form of Japanese modern budo.
