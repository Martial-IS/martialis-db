description:
  en: English Wikipedia article on Yukio Mishima. Records that he took up weight training in 1955 with
    a three-sessions-per-week regimen maintained for his final fifteen years, became very skilled (5th
    dan) at kendo, reached 2nd dan in battojutsu (the English rendering of his iai grades), 1st dan in
    karate, and tried boxing for a short period in 1956. Also covers the Tatenokai's martial and physical
    training regimen (kendo, long-distance running, live-fire drills, personally overseen by Mishima)
    and his 46-day GSDF basic training in April-May 1967.
