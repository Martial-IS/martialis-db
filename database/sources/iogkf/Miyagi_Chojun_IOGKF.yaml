description:
  en: IOGKF biography of Chojun Miyagi (1888-1953). Born April 25, 1888 in Okinawa; at age five became
    heir to the Miyagi family; began karate at eleven under Ryuko Aragaki (Tomari-te); at fourteen was
    introduced to Higaonna Kanryo, training with him from 1902 until October 1916 (the IOGKF gives Higaonna's
    death here as 1916, conflicting with the 1915 date used in this database). After Higaonna's death
    he made trips to China and research into physiology; registered karate at the Butokukai; developed
    the Junbi-undo and the Gekisai Dai Ichi and Dai Ni kata, plus Tensho and a revised Sanchin. Demonstrations
    for Prince Hirohito (1921) and Prince Chichibu (1925); established the Karate Research Club in 1926
    with Hanashiro, Motobu and Mabuni; performances at the Butoku-kai Tournament (1930) and Sainei Budo
    Tournament (1932).
