description:
  en: IOGKF (International Okinawan Goju-Ryu Karate-do Federation) biography of Kanryo Higaonna (1853-1915).
    Born in Naha 1853, one of eight children; his father traded firewood between the local islands. Began
    learning Chinese kempo at fourteen; at sixteen left for Foochow (Fuzhou), staying at the Ryukyu-kan
    settlement, and after nearly a year was introduced to and eventually accepted as personal disciple
    of Master Ryu Ryuko; helped his master as a bamboo craftsman by day and trained at night, beginning
    with Sanchin, nigiri-game, muchi-ishi and makiwara practice.
