description:
  en: Tales of Okinawan Grand Masters by Shoshin Nagamine, founder of Matsubayashi-ryu (Tuttle Publishing).
    Page 74 records that the prominent swordsman and kendo master Nakayama Hakudo offered Gichin Funakoshi
    the use of his own dojo in Hongo-Yumi-cho during the times when it was unoccupied. The account describes
    the shared use of the dojo but does not mention any teaching relationship between Nakayama and the
    Funakoshis.
