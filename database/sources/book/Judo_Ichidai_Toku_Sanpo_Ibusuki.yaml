description:
  en: Biography of the Kodokan judoka Toku Sanpo by Ibusuki Eizo (指宿英造), published by Nanpo Shinsha (南方新社)
    in 2007. The primary source of the two Wikimedia Commons portraits of Toku Sanpo (1915 and 1937) and
    of much of his biography, including the 1912 Brazilian Navy incident, his expulsion and reinstatement,
    and his death in the 1945 Tokyo air raid.
  ja: 指宿英造著による講道館柔道家・徳三宝の評伝（南方新社、2007年）。徳三宝の写真2点（1915年・1937年）の出典であり、1912年のブラジル艦隊事件、破門と復帰、1945年の東京大空襲での死去など伝記の多くを支える一次資料。
