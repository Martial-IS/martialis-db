description:
  en: Le Sabre et la Vie, ou le combat pour l'unité de l'Être, Claude Durix's 1985 work on iaido and Zen
    (Guy Trédaniel). The accessible copy hosted by the Busen Iaido Dojo reproduces long excerpts (the
    print editions are out of print). Durix describes his introduction to iaido by his sensei Kiyoshi
    Nakakura (9th dan, disciple of Nakayama Hakudo), practice at the dojo of Morihiro Okada, and develops
    the philosophical approach to the kata of iai (Nuki-Tsuke, Seme, Furikabute, Kiri-Tsuke, Chiburui,
    Noto-Tsuke, Zanshin, Ku).
  fr: Le Sabre et la Vie, ou le combat pour l'unité de l'Être, l'ouvrage de Claude Durix (1985) sur l'iaido
    et le zen (Guy Trédaniel). La copie accessible hébergée par le Busen Iaido Dojo reproduit de larges
    extraits (les éditions papier étant épuisées). Durix décrit son introduction à l'iaido par son sensei
    Kiyoshi Nakakura (9e dan, disciple de Nakayama Hakudo), la pratique au dojo de Morihiro Okada, et
    développe l'approche philosophique des kata de l'iai (Nuki-Tsuke, Seme, Furikabute, Kiri-Tsuke, Chiburui,
    Noto-Tsuke, Zanshin, Ku).
