description:
  en: Travelogue-investigation by Christopher Ross (martial arts practitioner and Japan resident) into
    the fate of Mishima's sword. Contains first-hand interviews central to his martial arts record - the
    sword dealer's family account of teaching Mishima iai as a teenager (Omori-ryu, called Hasegawa Eishin-ryu
    at the time, practised with shinken, including the kaishaku form), the testimony of Hiroshi Funasaka
    (his senior at the kendo dojo, sword donor after writing Eirei no Zekkyo), and an assessment chapter
    recording that at his death Mishima held fifth dan kendo, second dan iaido and first dan Shotokan
    karate, alongside sceptical evaluations of his technique by Henry Scott Stokes and others.
