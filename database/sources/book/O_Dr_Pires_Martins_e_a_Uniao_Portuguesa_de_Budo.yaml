description:
  en: Chapter by José Araújo in the book "A Génese do Karate em Portugal" (Edição do Autor, 2009, © José
    António Gomes Patrão), on Dr. Pires Martins and the União Portuguesa de Budo. Records the Academia
    de Budo at Rua Visconde de Seabra in Lisbon, the role of its director Pires Martins, the introduction
    of aikido at the Academia, the contributions of Misao Honda and Leopoldo Ferreira to the aikido section,
    and the Academia's closure in the 1980s.
  pt: Capítulo de José Araújo no livro "A Génese do Karate em Portugal" (Edição do Autor, 2009, © José
    António Gomes Patrão), sobre o Dr. Pires Martins e a União Portuguesa de Budo. Regista a Academia
    de Budo na Rua Visconde de Seabra em Lisboa, o papel do seu diretor Pires Martins, a introdução do
    Aikido na Academia, as contribuições de Misao Honda e Leopoldo Ferreira para a secção de Aikido, e
    o encerramento da Academia na década de 80.
