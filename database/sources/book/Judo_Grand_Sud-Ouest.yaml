description:
  en: 'Chapter (pp. 1-18) by the judo historian Michel Brousse in ''Sport, relations sociales et action
    collective'' (ed. Jean-Pierre Augustin and Jean-Paul Callède, Pessac: Maison des Sciences de l''Homme
    d''Aquitaine, 1995) on the implantation of judo in the French grand Sud-Ouest. Documents the Toulouse
    dissidence: Georges Lasserre taught Kano''s method and affiliated his club, the Shudokan (renamed
    from the Olympo-Judo-Club when he took over its technical direction from Pierre Landetcheberry, who
    had affiliated it with the Budokwai of London in 1947), with the Budokwai. The Lasserre brothers created
    study bursaries to bring Japanese judoka to Toulouse; in November 1951 Ichiro Abe arrived as the first
    official envoy of the Kodokan in Europe. Parisian teaching professionals came to study under his direction;
    the federal refusal which followed his departure for Brussels led to the creation of the Union Fédérale
    des Amateurs du Judo Kodokan on 8 October 1954 and to the April 1956 protocol unifying the two tendencies.
    Names Roussel, Levannier, Belaud and Courtine as the rare champions who practised the Kodokan ''art
    de la souplesse''.'
