description:
  en: Oral records on kendo dictated by Nakayama Hakudo (Nakayama Hiromichi), edited by Domoto Akihiko
    from the notes of Nakayama Zendo, published by Ski Journal in 1988. Includes an appendix with the
    complete explanation of the Shindo Munen-ryu transmission forms (神道無念流伝承形全解), supervised by
    Inamura Eiichi. A primary biographical source for Nakayama Hakudo.
  ja: 中山博道が口述した剣道についての記録を、中山善道の聞書をもとに堂本昭彦が編集した書（スキージャーナル、1988年）。附・神道無念流伝承形全解（稲村栄一監修）。中山博道の一次資料。
