description:
  en: Oral-history book (494 pages) of interviews by Claude Thibault with the pioneers of French judo,
    published by Budo-éditions in 2011. In his own interview, Jean de Herdt recounts (pp. 356, 360-361)
    that in December 1951 the Kodokan experts proposed the 6th dan to him, which he refused in agreement
    with Mikinosuke Kawaishi; that he officially received the 4th dan remitted by Risei Kano; that Kawaishi
    declared his 5th and 6th dan would require no further examination; that he passed the 5th dan in June
    1956 under Kawaishi's direction; and that his 6th dan certificate was never signed because Kawaishi
    was already ill. De Herdt's interview is the source of the grade history quoted on the Judo Pour Tous
    website.
