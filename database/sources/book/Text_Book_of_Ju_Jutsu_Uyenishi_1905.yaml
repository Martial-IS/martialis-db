description:
  en: 'English-language manual of jujutsu written by Uyenishi under his professional wrestling alias ''Raku''

    with the assistance of his student E.H. Nelson, first published in 1905 by Health and Strength Publications.

    Its front matter lists his credentials as instructor to the Rikugun yōnan gakkō (Military College
    for Officers),

    the Tai-iku-kai (Imperial Military College of Physical Training), the Shihan gakkō (School of Instructors),

    the Police Training School, all government schools in Osaka, and the Army Gymnastic Staff at Aldershot.

    The 9th edition (post-WWII) contains Percy Longhurst''s updated biography.

    '
