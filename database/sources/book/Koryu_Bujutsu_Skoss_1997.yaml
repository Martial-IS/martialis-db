description:
  en: >-
    Anthology of essays on the Japanese classical martial traditions by practitioners licensed in
    them: a field guide to twelve ryu, chapters on Tenjin Shinyo-ryu jujutsu and on the Tatsumi-ryu
    headmaster Kato Takashi, an interview with the Tendo-ryu teacher Sawada Hanae, and essays on
    koryu training and on Marishiten. Volume 1 of the Classical Warrior Traditions of Japan series.
