description:
  en: Groundwork (newaza) manual by Moshe Feldenkrais, first published in 1952 (French original 'Judo
    pour ceintures noires', 1951). This 2010 Blue Snake Books edition, edited by Elizabeth Beringer, carries
    forewords by Michel Brousse ('A Judo Pioneer in France'), Dennis Leri and Moti Nativ, and reproduces
    the foreword by Gunji Koizumi from the 1952 edition. Feldenkrais's own preface acknowledges Mikinosuke
    Kawaishi as his friend and teacher, and Gunji Koizumi and T. P. Leggett as judo figures he learned
    from.
