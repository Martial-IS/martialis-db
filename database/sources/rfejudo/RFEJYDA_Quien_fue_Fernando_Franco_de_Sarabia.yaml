description:
  en: Newsletter article by the Real Federación Española de Judo y Deportes Asociados, published 28 October
    2022, on the life and legacy of Fernando Franco de Sarabia (1912–1988), first Spanish black belt in
    judo (1st dan, Kodokan diploma 22 July 1954, examined by Ichiro Abe), founder of Gimnasio Samurái
    (1958), disseminator of judo into state institutions and Real Madrid, and posthumous 7th dan recipient.
