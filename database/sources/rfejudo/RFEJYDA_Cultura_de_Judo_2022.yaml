description:
  en: 'Blog article by José Ángel Guedea Adiego (8th dan) on the official website of the Real Federación
    Española de Judo y Deportes Asociados, reproducing his 2009 article "Un poco de historia" on the antecedents
    of judo in Spain: the Raku exhibitions around 1930, the group of aficionados who in 1947 contacted
    the Peruvian 2nd dan Alfredo San Bartolomé and founded the first judo club in Madrid, Fernando Franco
    Sarabia as the first Spanish black belt (examined by Ichiro Abe), Yves Klein as the first technical
    director, the judo department created within the Federación de Lucha presided by Agustín Aznar, and
    the constitution of the Federación Española de Judo in 1965 with Rafael Urculo.'
