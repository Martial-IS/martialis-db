description:
  en: About page of the ADAS (Associação Desportiva de Aikido de Setúbal), which records that 'Buikukai
    Portugal' finally became a reality with Orlando Marques named president by the Buikukai of Osaka,
    Japan, and that ADAS-Aikido Buikukai Portugal is an organization with headquarters in Osaka offering
    aikido training following the teachings of Morihei Ueshiba.
  pt: Página 'Sobre Nós' da ADAS (Associação Desportiva de Aikido de Setúbal), que regista que o 'Buikukai
    Portugal' finalmente se tornou realidade com Orlando Marques nomeado presidente pela Buikukai de Osaka,
    Japão, e que a ADAS-Aikido Buikukai Portugal é uma organização com sede em Osaka que oferece treino
    de Aikido segundo os ensinamentos de Morihei Ueshiba.
