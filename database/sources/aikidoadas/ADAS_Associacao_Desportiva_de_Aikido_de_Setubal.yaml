description:
  en: Official website of the ADAS (Associação Desportiva de Aikido de Setúbal), recording its dojo at
    Rua Diogo Cão 20A, 2910-471 Setúbal, and its rebranding as ADAS-Aikido Buikukai Portugal, an organization
    with headquarters in Osaka, Japan, whose president, Orlando Marques (6th dan Aikikai), was appointed
    by the Buikukai of Osaka.
  pt: Site oficial da ADAS (Associação Desportiva de Aikido de Setúbal), que regista o seu dojo na Rua
    Diogo Cão 20A, 2910-471 Setúbal, e a sua renomeação como ADAS-Aikido Buikukai Portugal, uma organização
    com sede em Osaka, Japão, cujo presidente, Orlando Marques (6º dan Aikikai), foi nomeado pela Buikukai
    de Osaka.
