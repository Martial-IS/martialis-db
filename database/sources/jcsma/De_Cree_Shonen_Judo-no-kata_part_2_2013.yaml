description:
  en: 'Review article on the history and pedagogy of judo for children, including a section on early Western
    judo pioneers that discusses Moshe Feldenkrais''s role in France: founding of the Jiu-Jitsu Club de
    France at 82 rue Beaubourg, shodan awarded by Kawaishi in 1936 (not by Kanō, and not directly recognized
    by the Kōdōkan), nidan in 1938, jujutsu largely self-taught from books, work under Paul Langevin in
    1939-1940, and the finding from the Budokwai dan-rank register that Feldenkrais only joined the Budokwai
    in 1948 (debunking a 1932 shodan claim). Also covers Trevor Leggett (Budokwai shodan 1935).'
