description:
  en: Dojo guide for Shizuoka Prefecture published by the WEB Hiden website of BAB Japan. Lists the Rikishin-ryu
    school Bushukan (力信流・武修館) as an active dojo teaching spear-staff, kodachi, kenjutsu and jujutsu, together
    with Mochizuki-lineage schools including Gyokushin-ryu aikido (founded to continue the spirit and
    technique of Mochizuki Minoru) and the Kokusai Budo Seifukai (International Budo Seifukai) of Mochizuki
    Minoru's direct transmission.
  ja: BABジャパンのWEB秘伝による静岡県の道場ガイド。力信流・武修館（槍棒術・小太刀術・剣術・体術）を現役道場として掲載し、望月稔の精神と技を継承する玉心流合気道、望月稔直伝の国際武道正風会本部など望月系の団体も掲載する。
