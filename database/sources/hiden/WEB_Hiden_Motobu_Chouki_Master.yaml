description:
  en: 'Master profile of Motobu Choki on the WEB Hiden (BAB Japan) site: 1870 (Meiji 3) - 1944 (Showa
    19); Ryukyu Tode karateka who brought karate to mainland Japan, most renowned for real combat of his
    era; late in life he named his own style Nihon Denryu Heiho Motobu Kenpo (日本伝流兵法本部拳法), commonly called
    Motobu-ryu karate-do. Born in Shuri Akahira as third son of Motobu Choshin of the royal blood; learned
    Tode with his brother from Itosu Anko, then engaged in kake-dameshi at the Tsuji quarter; studied
    under several masters including Matsumora Kosaku; in 1922, in Osaka, entered a boxing pick-up match
    and knocked out a giant Russian boxer in round two with a kosa (one-knuckle fist) strike at age 52;
    organized the Tode-jutsu Fukyukai in Osaka; published Okinawa Kenpo Tode Jutsu Kumite-hen (the profile
    dates this to 1923, differing from the 1926 date given by the Motobu-ryu official site and JA Wikipedia);
    moved to Tokyo in 1927, founding the Daidokan at Koishiki Haramachi, teaching at Toyo University through
    the mediation of Konishi Yasuhiro; published Watashi no Todejutsu in 1932; returned to Okinawa in
    1939 per this profile (other sources give 1941); died spring 1944 at 74. Known for his emphasis on
    Naihanchi, though his books show deep knowledge of many kata.'
