description:
  en: 'Web Hiden topic article (July 16, 2024) announcing a new bimonthly series on the Dai Nippon Teikoku

    Kendo Kata, transmitted from Nakayama Zendo - the son of Nakayama Hakudo - to Ogawa Takeshi, the 10th

    headmaster of the Yushinkan dojo and Shindo Munen Ryu. Confirms that Zendo was Hakudo''s son and that

    he was the designated successor who inherited Hakudo''s martial knowledge in its totality, including

    the kata compiled by Hakudo himself. The article references the August 2024 issue of Monthly Hiden

    as the source of the full series.

    '
