description:
  en: Budo Japan interview (HIDEN March 2024) with Higa Minoru, second Kancho of the Okinawa Kobayashi
    Shorin-ryu Karate Kyudokan. Confirms the Kyudokan hombu dojo in Tsuboya was founded in 1954 by Grand
    Master Higa Yuchoku (1910-1994), Hanshi 10th dan, after whom Minoru took over as second Kancho. Includes
    recollections of Yuchoku Sensei as a strict teacher (the "Dojo of the demons"), his development of
    the Gosun Tsuki technique, and that the Kyudokan Jion kata descends from Hanashiro Chomo.
