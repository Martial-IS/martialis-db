description:
  en: Budo Japan interview (HIDEN February 2024) with Higaonna Morio, head of IOGKF. States everything
    in Goju-ryu started with Higaonna Kanryo Sensei (1853-1915), who went to the Chinese province of Fujian
    at the age of 15 to avenge his father's enemies and to study under the Chinese martial arts master
    Lulukou; his desire for revenge disappeared as he became a master, and he returned to the Ryukyu to
    become a master of Naha-te.
