description:
  en: News item of 18 February 2016 from the Clube Atlético de Alvalade reporting that their aikido teacher
    Luís Antunes received the title of shihan (Grand Master) and the 7th dan of aikido from the Aikikai
    of Tokyo, the highest grade in Portugal, with photographs taken in Japan.
  pt: Notícia de 18 de fevereiro de 2016 do Clube Atlético de Alvalade reportando que o seu professor
    de Aikido Luís Antunes recebeu o título de shihan (Grande Mestre) e a graduação de 7º dan de Aikido
    pela Aikikai de Tóquio, a mais alta em Portugal, com fotografias tiradas no Japão.
