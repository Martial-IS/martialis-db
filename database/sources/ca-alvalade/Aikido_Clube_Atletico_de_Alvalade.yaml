description:
  en: Page on the aikido section of the Clube Atlético de Alvalade, naming Luís Filipe Gomes Antunes as
    the teacher, born 18 October 1954, who began aikido at age 14, trained with Hirokazu Kobayashi until
    the early 1980s and then with Nobuyoshi Tamura until his death in 2010, and holds the 7th dan and
    shihan title from the Aikikai of Tokyo.
  pt: Página da secção de Aikido do Clube Atlético de Alvalade, que indica Luís Filipe Gomes Antunes como
    professor, nascido a 18 de outubro de 1954, que começou o Aikido aos 14 anos, treinou com Hirokazu
    Kobayashi até ao início dos anos 1980 e depois com Nobuyoshi Tamura até à sua morte em 2010, e detém
    o 7º dan e o título de shihan da Aikikai de Tóquio.
