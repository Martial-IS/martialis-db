description:
  en: 'Peer-reviewed academic article (Martial Arts Studies, no. 10, pp. 66-72) by David Brough on the
    dojo Uyenishi

    established at 31 Golden Square, Piccadilly Circus in 1903. Focuses on Uyenishi''s teaching of the
    British Army

    and of women''s classes, and how these influenced physical culture and laid the foundation for the
    politicisation

    of jujutsu as women''s self-defence. Notes Uyenishi left the UK in 1907 and that the dojo lived on
    through William

    and Edith Garrud before being demolished by 1930.

    '
