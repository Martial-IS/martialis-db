description:
  en: 'Budo Japan feature article (October 20, 2023) by Grigoris Miliaresis reporting on a visit to the

    Yushinkan dojo, the headquarter Dojo of Shinto Munen-ryu. Covers the school''s history from its

    18th-century founder Fukui Hyoomon through Negishi Shingoro''s transformation of the Renpeikan

    into the Yushinkan in 1885, and the school''s 20th-century development under Nakayama Hakudo, who

    kept it alive through the pre-war, wartime and post-war periods. Confirms that Hakudo left the

    school to his son Nakayama Zendo (1900-1981), ''one of the few people who inherited Hakudo''s martial

    knowledge in its totality,'' who in 1969 asked Ogawa Takeshi (then 24) to dedicate his life to the

    heritage as the 10th head. Includes photographs of Nakayama Hakudo and Nakayama Zendo, and detailed

    descriptions of Shinto Munen-ryu kumitachi and iai kata.

    '
