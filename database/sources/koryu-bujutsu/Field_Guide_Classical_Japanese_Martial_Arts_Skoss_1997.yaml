description:
  en: >-
    Entries on twelve classical ryu (weapons, founding date, founder, present head, prefecture and
    field notes), compiled from Japanese reference works and Kobudo demonstration programmes.
notes: >-
  The author is not a member of any of the twelve ryu. Her stated sources are Watatani and Yamada,
  Bugei Ryuha Daijiten (1978), Miyazaki, Nihon Densho Bugei Ryuha (1994), the Nihon Kobudo
  Shinkokai and Kyokai programmes, and Warner and Draeger (1982). Present heads are as of 1997.
