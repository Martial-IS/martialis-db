notes: >-
  The author is not a member of the ryu. His note 2: the history and current activities come from
  articles by Kubota Toshihiro (Miyazaki 1994, 26-29; Nihon Kobudo Sokan 1988), Kobudo
  demonstration programme notes, and personal communications with Kubota and other exponents,
  1978-1997. So it is the Kubota (Tenyokai) line's own account; tenyokai.com is the same line.
