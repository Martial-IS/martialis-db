description:
  en: >-
    French Wikipedia stub on Maurice Sarry (1935–1994), fencing master and French boxer who codified
    the competition rules of canne de combat in the 1960s, published a canne method in 1978, and led the
    savate federation's canne and staff committee from 1977.
  fr: >-
    Ébauche Wikipédia (fr) sur Maurice Sarry (1935–1994), maître d'armes et boxeur qui codifie dans les
    années 1960 les règles de compétition de la canne de combat, publie une méthode en 1978 et dirige le
    comité canne et bâton de la fédération de savate à partir de 1977.
