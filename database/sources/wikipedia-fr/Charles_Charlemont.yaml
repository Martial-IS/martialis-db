description:
  en: >-
    French Wikipedia stub on Charles Charlemont (born Louis Charles Pilet, 1862–1944), French boxing
    master: son of Joseph Charlemont and his successor at the head of the club until 1944, his 1899 bout
    with Jerry Driscoll, the many teachers he trained at the academy in the rue des Martyrs, and the
    Légion d'honneur in 1928.
  fr: >-
    Ébauche Wikipédia (fr) sur Charles Charlemont (né Louis Charles Pilet, 1862–1944), maître de boxe
    française : fils de Joseph Charlemont et son successeur à la tête du club jusqu'en 1944, combat de
    1899 contre Jerry Driscoll, nombreux professeurs formés dans son académie rue des Martyrs, et Légion
    d'honneur en 1928.
