description:
  en: >-
    French Wikipedia stub on Louis Armand Victorin Leboucher (1807–1866), French boxing and canne master
    in Paris: his successive salles (rue de la Michodière, rue de Choiseul, passage Verdeau from 1855),
    his quick self-defence "method of the traveller", and the 1850 bout he organised between Louis
    Vigneron and Rambaud "la résistance".
  fr: >-
    Ébauche Wikipédia (fr) sur Louis Armand Victorin Leboucher (1807–1866), maître de boxe française et
    de canne à Paris : ses salles successives (rue de la Michodière, rue de Choiseul, passage Verdeau à
    partir de 1855), sa méthode « du voyageur », et la rencontre de 1850 qu'il organise entre Louis
    Vigneron et Rambaud « la résistance ».
