description:
  en: French Wikipedia article on Claude Durix (1921-2012), French ophthalmologist and writer specialised
    in Japan, Zen Buddhism and calligraphy. Records his birth in Villeneuve-l'Archevêque in 1921, his
    1945 start in the martial arts with twelve black belt grades (4th dan kendo, 3rd dan judo, 3rd dan
    iaido, 2nd dan aikido), his participation in three kendo world championships (Tokyo 1970, Los Angeles
    1973, London 1976), his discovery of Zen at the Manpuku-ji temple in 1956, his role in spreading Zen
    in Morocco and Europe, and his honours (Officier de la Légion d'honneur 1980, Croix de guerre 1939-1945,
    Grand officier de l'ordre du Ouissam alaouite).
  fr: Article de Wikipédia en français sur Claude Durix (1921-2012), ophtalmologue et écrivain français
    spécialiste du Japon, du bouddhisme zen et de la calligraphie. Enregistre sa naissance à Villeneuve-l'Archevêque
    en 1921, ses débuts dans les arts martiaux en 1945 avec douze grades de ceinture noire (4e dan de
    kendo, 3e dan de judo, 3e dan d'iaido, 2e dan d'aikido), sa participation à trois championnats du
    monde de kendo (Tokyo 1970, Los Angeles 1973, Londres 1976), sa découverte du zen au temple Manpuku-ji
    en 1956, son rôle dans la diffusion du zen au Maroc et en Europe, et ses distinctions (Officier de
    la Légion d'honneur 1980, Croix de guerre 1939-1945, Grand officier de l'ordre du Ouissam alaouite).
