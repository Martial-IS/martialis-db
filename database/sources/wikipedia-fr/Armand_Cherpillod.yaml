description:
  en: >-
    French Wikipedia article on Armand Cherpillod (1876–1940), Swiss wrestling champion: gymnastics and
    freestyle wrestling teacher at the Bartitsu Academy of Arms and Physical Culture in London from 1901,
    where Yukio Tani and Sadakazu Uyenishi taught him jujutsu; later physical-education and police
    self-defence instructor in Switzerland.
  fr: >-
    Article Wikipédia (fr) sur Armand Cherpillod (1876–1940), champion suisse de lutte : professeur de
    gymnastique et de lutte libre à la Bartitsu Academy of Arms and Physical Culture à Londres dès 1901,
    où Yukio Tani et Sadakazu Uyenishi lui apprennent le ju-jitsu ; ensuite moniteur d'éducation physique
    et instructeur d'autodéfense de corps de police en Suisse.
