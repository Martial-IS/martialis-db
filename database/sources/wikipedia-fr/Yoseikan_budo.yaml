description:
  en: 'French Wikipedia article on Yoseikan Budo, covering the meaning of the name and logo, the technique
    repertoire, the ''wave'' (mouvement ondulatoire) principle, the claim that the method is not a synthesis
    of existing arts, the uniform blue gi with blue and white belt, competition, the World Yoseikan Federation,
    and the 2000 soke succession. Records the art as developed in the late 1960s and officially founded
    in 1975 by Hiroo Mochizuki. Note: the article carries a ''needs more citations'' banner.'
  fr: 'Article de Wikipédia (français) sur le Yoseikan Budo : signification du nom et du logo, répertoire
    technique, principe du mouvement ondulatoire, l''affirmation que la méthode n''est pas une synthèse
    d''arts existants, la tenue bleue à ceinture blanche et bleue, la compétition, la World Yoseikan Federation
    et la succession soke de 2000. L''art y est décrit comme développé à la fin des années 1960 et fondé
    officiellement en 1975 par Hiroo Mochizuki.'
