description:
  en: >-
    French Wikipedia article on Michel Casseux, called Pisseux (probably 1794–1869), savate and canne
    master who opened the first savate salle about 1825 at La Courtille: names and addresses from
    contemporary almanacs, Charlemont's 1899 account, his students (among them Charles Lecour), and the
    1843 savate treatise by "an amateur, student of Michel, called Pisseux".
  fr: >-
    Article Wikipédia (fr) sur Michel Casseux, dit Pisseux (probablement 1794–1869), maître de savate
    et de canne qui ouvre la première salle de savate vers 1825 à la Courtille : noms et adresses tirés
    des almanachs, récit de Charlemont (1899), ses élèves (dont Charles Lecour), et le traité de 1843
    d'« un amateur, élève de Michel, dit Pisseux ».
