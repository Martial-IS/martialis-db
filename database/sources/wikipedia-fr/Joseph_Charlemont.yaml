description:
  en: >-
    French Wikipedia article on Joseph Charlemont (1839–1929), French boxing (savate) and canne master:
    birth at Lesdain and death in Paris (citing the Paris death record), the method he learned from
    Charles Lecour and Louis Vigneron, exile in Brussels, his 1878 and 1899 books, the Académie de boxe
    he founded at 24 rue des Martyrs in 1887, and his son Charles Charlemont, who succeeded him.
  fr: >-
    Article Wikipédia (fr) sur Joseph Charlemont (1839–1929), maître de boxe française et de canne :
    naissance à Lesdain et décès à Paris (acte de décès des Archives de Paris), méthode apprise de Charles
    Lecour et de Louis Vigneron, exil à Bruxelles, ouvrages de 1878 et 1899, Académie de boxe fondée au
    24 rue des Martyrs en 1887, et son fils Charles Charlemont qui lui succède.
