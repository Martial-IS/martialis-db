description:
  en: >-
    French Wikipedia article on Charles Lecour (1808–1894), who joined savate with English boxing to
    form French boxing: savate learned from Michel "Pisseux", boxing lessons from the English professional
    Adams in Paris (as Lecour told Joseph Charlemont), his salle in the passage des Panoramas opened in
    1832 with his brother Hubert, his student Rambaud "la résistance", and Charlemont as his student.
  fr: >-
    Article Wikipédia (fr) sur Charles Lecour (1808–1894), qui réunit la savate et la boxe anglaise en
    boxe française : savate apprise auprès de Michel « Pisseux », leçons de boxe auprès de l'Anglais Adams
    à Paris (selon le récit de Lecour rapporté par Joseph Charlemont), salle du passage des Panoramas
    ouverte en 1832 avec son frère Hubert, son élève Rambaud « la résistance », et Charlemont son élève.
