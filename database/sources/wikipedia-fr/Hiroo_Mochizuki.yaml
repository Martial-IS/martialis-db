description:
  en: French Wikipedia article on Hiroo Mochizuki (b. 1936), creator of Yoseikan Budo, covering his training
    with his father Minoru and directly with Morihei Ueshiba, the introduction of karate to France in
    1957 and of Wado-ryu in 1963, his veterinary studies (Nihon Daigaku, 1962), the development of the
    YOKEN method from 1965 later renamed Yoseikan Budo, the 1975 French federation and 1997 World Yoseikan
    Federation, the soke title received from his father in 2000, and his ranks (10th dan karate, 8th dan
    aikido, 8th dan jujitsu, 7th dan iaido, 3rd dan judo).
  fr: 'Article de Wikipédia (français) sur Hiroo Mochizuki (né en 1936), créateur du Yoseikan Budo : formation
    auprès de son père Minoru et directement auprès de Morihei Ueshiba, introduction du karaté en France
    en 1957 et du Wado-ryu en 1963, études vétérinaires (Nihon Daigaku, 1962), développement de la méthode
    YOKEN à partir de 1965 rebaptisée Yoseikan Budo, fédération française 1975 et World Yoseikan Federation
    1997, titre de soke reçu de son père en 2000, et grades (10e dan karaté, 8e dan aïkido, 8e dan jujitsu,
    7e dan iaido, 3e dan judo).'
