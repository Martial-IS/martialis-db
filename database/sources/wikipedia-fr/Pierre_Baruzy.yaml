description:
  en: >-
    French Wikipedia article on Count Pierre Baruzy (1897–1994), industrialist and French boxing
    champion: student of Charles Charlemont at the academy from age 13, eleven-time champion of France,
    president of the Académie de boxe française from 1930, president of the Fédération nationale de boxe
    française after the war and founding president of the Comité national de boxe française in 1965;
    also his business and wartime record.
  fr: >-
    Article Wikipédia (fr) sur le comte Pierre Baruzy (1897–1994), industriel et champion de boxe
    française : élève de Charles Charlemont à l'académie dès 13 ans, onze fois champion de France,
    président de l'Académie de boxe française à partir de 1930, président de la Fédération nationale de
    boxe française après la guerre et président fondateur du Comité national de boxe française en 1965 ;
    aussi sa carrière industrielle et son parcours pendant la guerre.
