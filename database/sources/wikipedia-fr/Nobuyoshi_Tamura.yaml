description:
  en: French Wikipedia article on Nobuyoshi Tamura. Details his birth in Osaka in 1933, his entry into
    the Aikikai Hombu Dojo as an uchi-deshi in 1953, his departure for France in 1964 as Aikikai delegate
    for Europe, the founding of the FFAB and his role as national technical director, the Shumeikan Dojo,
    and lists his former students including M'barek Alaoui (died 2014, first 8th dan in North Africa).
  fr: Article de Wikipédia en français sur Nobuyoshi Tamura. Détaille sa naissance à Osaka en 1933, son
    entrée au Hombu Dojo de l'Aikikai comme uchi deshi en 1953, son départ pour la France en 1964 comme
    délégué de l'Aikikai en Europe, la fondation de la FFAB et son rôle de directeur technique national,
    le Dojo Shumeikan, et liste ses anciens élèves dont M'barek Alaoui (mort en 2014, premier 8e dan d'Afrique
    du Nord).
