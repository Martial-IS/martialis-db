description:
  en: >-
    French Wikipedia article on Louis Vigneron (1827–1871), French boxing and canne master: his 1850
    win over Rambaud "la résistance", a student of Charles Lecour, in a bout organised by Louis
    Leboucher; his salle in Paris; his 1854 win over the English boxer Dickson; his 1867 loss to Joseph
    Charlemont; his death in August 1871 at Boulogne-sur-Mer (the article gives both 21 and 22 August).
  fr: >-
    Article Wikipédia (fr) sur Louis Vigneron (1827–1871), maître de boxe française et de canne : sa
    victoire de 1850 sur Rambaud « la résistance », élève de Charles Lecour, dans une rencontre organisée
    par Louis Leboucher ; sa salle à Paris ; sa victoire de 1854 sur l'Anglais Dickson ; sa défaite de
    1867 face à Joseph Charlemont ; sa mort en août 1871 à Boulogne-sur-Mer (l'article donne le 21 et le
    22 août).
