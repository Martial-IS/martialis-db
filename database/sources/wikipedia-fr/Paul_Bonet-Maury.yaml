description:
  en: 'French Wikipedia article on Paul Bonét-Maury, judoka and radiobiologist: birth and death dates
    with civil registry reference (Archives de Paris, birth act n° 460, 1900, with marginal death note),
    his scientific career, his discovery of judo in 1936 and role as vice-president of the Jiu-Jitsu Club
    de France, president of the FFL in July 1944, founder-president of the FFJJJ (1946-1956), secretary-general
    of the IJF (until his resignation in 1971), second Frenchman to obtain a black belt, 5th dan in his
    lifetime and posthumous 6th dan on 14 September 1975.'
  fr: 'Article Wikipédia (fr) consacré à Paul Bonét-Maury, judoka et radiobiologiste : dates de naissance
    et de décès avec référence d''état civil (Archives de Paris, acte de naissance n° 460, 1900, avec
    mention marginale de décès), carrière scientifique, découverte du judo en 1936 et rôle de vice-président
    du Jiu-jitsu Club de France, président de la FFL en juillet 1944, président-fondateur de la FFJJJ
    (1946-1956), secrétaire général de la FIJ (jusqu''à sa démission en 1971), deuxième Français à obtenir
    sa ceinture noire, 5e dan de son vivant et 6e dan posthume le 14 septembre 1975.'
