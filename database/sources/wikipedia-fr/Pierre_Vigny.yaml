description:
  en: >-
    French Wikipedia stub on Pierre Vigny (1866–1943): artillery service from 1886, his salle d'armes in
    Geneva from 1891, instructor at Barton-Wright's Bartitsu club, his own London salle at 18 Berner
    Street from 1903, his high-guard cane system, its codification by "his student H. G. Lang" in 1923,
    and his wife Marguerite's umbrella self-defence.
  fr: >-
    Ébauche Wikipédia (fr) sur Pierre Vigny (1866–1943) : régiment d'artillerie en 1886, salle d'armes à
    Genève dès 1891, instructeur au club Bartitsu de Barton-Wright, sa propre salle à Londres au 18 Berner
    Street en 1903, son système de canne en garde haute, codifié en 1923 par « son élève H.G. Lang », et
    l'autodéfense au parapluie de son épouse Marguerite.
