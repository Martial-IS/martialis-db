description:
  en: YouTube video on Misao Honda shihan, 7th dan Aikikai, described as the founder of Aikido Aikikai
    in Portugal, who in 1980 formed Portugal's first two yudansha registered with the Hombu Dojo Aikikai
    in Tokyo, and died on 14 January 2011. The video description dates him 1944-2011, born in Izumisano,
    Osaka.
  pt: Vídeo do YouTube sobre Misao Honda shihan, 7º dan Aikikai, descrito como o fundador do Aikido Aikikai
    em Portugal, que em 1980 formou os primeiros dois yudansha em Portugal com registo no Hombu Dojo Aikikai
    em Tóquio, e faleceu em 14 de janeiro de 2011. A descrição do vídeo data-o de 1944-2011, natural de
    Izumisano, Osaka.
