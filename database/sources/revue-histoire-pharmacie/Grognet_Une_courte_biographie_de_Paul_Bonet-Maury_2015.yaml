description:
  en: 'Biographical article by Jean-Marc Grognet (CEA, Direction des sciences du vivant) on the parallel
    lives of Paul Bonét-Maury, pharmacist and researcher in radiobiology, and judoka: his education and
    career at the Curie laboratory and the Institut du Radium, his discovery of judo in 1936 and his role
    as vice-president of the Jiu-Jitsu Club de France, president of the French Judo and Jiu-Jitsu Federation
    (1946-1956), secretary-general of the International Judo Federation (1956-1971) and secretary-general
    of the European Judo Union, and his posthumous 6th dan of 14 September 1975. Article available on
    Persée.'
  fr: 'Article biographique de Jean-Marc Grognet (CEA, Direction des sciences du vivant) sur les vies
    parallèles de Paul Bonét-Maury, pharmacien et chercheur en radiobiologie, et judoka : sa formation
    et sa carrière au laboratoire Curie et à l''Institut du Radium, sa découverte du judo en 1936 et son
    rôle de vice-président du Jiu-jitsu Club de France, de président de la Fédération française de judo
    et de jiu-jitsu (1946-1956), de secrétaire général de la Fédération internationale de judo (1956-1971)
    et de secrétaire général de l''Union européenne de judo, et son 6e dan posthume du 14 septembre 1975.
    Article disponible sur Persée.'
