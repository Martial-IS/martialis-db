description:
  en: Biographical article on Gigo (Yoshitaka) Funakoshi published by the Shotokai Encyclopedia (March
    1996), the lineage organization founded by Gigo's own students Shigeru Egami and Genshin Hironishi.
    States that Gigo created the Gohon Kumite as 'a system very much like Kendo, an art that Yoshitaka
    also practiced and studied under the last Great Master, Hakudo Nakayama, from whom he obtained valuable
    inspiration for the future karate developments.' Also records the Kihon Ippon Kumite, Jiyu Ippon Kumite
    and the Ten no Kata, and the 1936 publication of Karate-do Kyohan.
