description:
  en: News item from the Aikikai de Portugal announcing the award of the 7th dan and the title of shihan
    to Professor Luís Antunes, both from the Hombu Dojo, delivered personally by the Dôshu Moriteru Ueshiba
    on 9 February. Includes a photograph of the Dôshu handing over the diploma.
  pt: Notícia da Aikikai de Portugal anunciando a atribuição do 7º dan e do título de shihan ao Professor
    Luís Antunes, ambos pelo Hombu Dojo, entregues pessoalmente pelo Dôshu Moriteru Ueshiba no passado
    dia 9 de fevereiro. Inclui uma fotografia do Dôshu a entregar o diploma.
