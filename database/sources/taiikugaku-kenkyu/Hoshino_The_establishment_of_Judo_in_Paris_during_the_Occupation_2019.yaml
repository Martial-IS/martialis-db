description:
  en: Peer-reviewed article (pp. 187-203) by Utsuru Hoshino (Konan University) on how judo was practiced
    in German-occupied Paris and acquired the status of a sport in France, centred on the Jiu-Jitsu Club
    de France and its judoka, especially Paul Bonét-Maury, president of the club, and Mikinosuke Kawaishi,
    who provided technical guidance. Documents the club's low-key demonstrations, Kawaishi's teaching
    method (color belts, high membership fees), the club's entry into the French Wrestling Federation
    in 1942, and the First French Judo Championship in late May 1943.
