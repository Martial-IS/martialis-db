description:
  en: >-
    Guillaume Erard's examination of the claimed link between Kobayashi Hirokazu and Hisa Takuma's
    Daito-ryu, drawing on interviews with Kobayashi Kiyohiro, Kimura Jiro and senior Takumakai students.
    Concludes that Kobayashi was not a Daito-ryu shihan; notes his 8th dan from the Aikikai in 1970 and that
    he remained an Aikikai shihan.
