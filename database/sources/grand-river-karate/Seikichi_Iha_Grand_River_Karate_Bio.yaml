  en: 'Grand River Karate page on Seikichi Iha (1931-2024 per this source), Hanshi 10 dan, awarded the
    title of Intangible Cultural Asset by Okinawa Governor Denny Tamaki on May 19, 2020, the first such
    award to an individual living outside Okinawa; North American Director for Shorin-ryu Shidokan; studied
    under Shinpan Gusukuma and Katsuya Miyahira. Note: this source gives 1931 for his birth year, while
    the Fighting Arts interview gives July 12, 1932.'
