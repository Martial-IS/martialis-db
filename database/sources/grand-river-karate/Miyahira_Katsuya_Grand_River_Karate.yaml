description:
  en: Grand River Karate page on Katsuya Miyahira (1918-2010), president of the Okinawa Shorin Ryu Shidokan,
    honored by the Japan Martial Arts Association in 1989. Covers his early training from his father (Toyama
    Army School background), his study at the dojo of Choshin Chibana at Nakijin Goten of Yoshitsugu Teishi
    (influenced by senior pupils Kangi Shoya, Yasuyoshi Kamikosu, Tsuguyoshi Miyagi, Chozo Nakama and
    Shinji Tawada), karate at the First Junior High School under Anbun Tokuda, the traditional Shuri-te
    methods, and the opening of his Nishihara dojo in 1948.
