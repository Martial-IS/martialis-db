description:
  en: 'Survey report published by the Federação Portuguesa de Aikido (FPA), 1st edition, November 2024,
    based on 451 responses collected via Google Forms from the federation''s database of practitioners
    and former practitioners (ideation and coordination Silvana Munzi and Rui Martins; survey elaboration
    Daniela Morais, Silvana Munzi and Rui Martins; analysis Beatriz Ribeiro, Silvana Munzi and Rui Martins).
    Its enquadramento section restates the federation''s history: constitution of the FPAA on 7 September
    1990 (Diário da República, 11 October 1990), of the FPADA in 1994 (Diário da República, 13 October
    1994), the subsequent self-dissolution of the FPADA and the FPAA''s negotiated integration of the
    remaining Portuguese aikido associations, and the 1995 rename to FPA; it also documents the FPA''s
    public-utility sports status (UPD) and its role with the IPDJ and the Confederação do Desporto de
    Portugal. Local PDF copy; no public URL.'
  pt: 'Relatório de inquérito publicado pela Federação Portuguesa de Aikido (FPA), 1.ª edição, novembro
    de 2024, baseado em 451 respostas recolhidas via Google Forms a partir da base de dados da Federação
    de praticantes e ex-praticantes (ideação e coordenação Silvana Munzi e Rui Martins; elaboração e realização
    do inquérito Daniela Morais, Silvana Munzi e Rui Martins; análise Beatriz Ribeiro, Silvana Munzi e
    Rui Martins). No seu enquadramento repõe a história da Federação: constituição da FPAA a 7 de setembro
    de 1990 (Diário da República, 11 de outubro de 1990), da FPADA em 1994 (Diário da República, 13 de
    outubro de 1994), a subsequente dissolução da FPADA e a mudança negociada pela FPAA com todas as associações
    de Aikido existentes em Portugal, e a mudança de nome para FPA em 1995; documenta ainda o estatuto
    de Utilidade Pública Desportiva da FPA e o seu papel junto do IPDJ e da Confederação do Desporto de
    Portugal. Cópia local em PDF; sem URL público.'
