description:
  en: Biography of Ansei Ueshiro on the Finding Karate site. States he was born April 20, 1933 in Kin,
    Okinawa, son of Anch Ueshiro, descended from the Bushi warrior class, and nephew of the renowned karate
    master Ankichi Arakaki. He learned karate from his father and received lessons from Entasu Isaenta
    and Toguichi Seitoku. During the 1945 Battle of Okinawa his parents died and he lost several fingers
    on both hands with severe burns; around 1946 relatives enrolled him at the original Naha dojo of Shoshin
    Nagamine (himself a top student of Arakaki Ankichi). Records his 1960 promotion to 3rd dan by Nagamine
    and his eventual role as Chief Instructor of the dojo; the American serviceman James Wax as the first
    American promoted to black belt in Matsubayashi-Ryu Shorin-Ryu (1958), his marriage to Nagamine's
    niece and sponsorship of Ueshiro's move; Ueshiro's arrival in the United States on September 15, 1962,
    sent by Nagamine to spread Matsubayashi-Ryu; his first students James Wax and Frank Grant; the East
    Coast and Midwest schools by the late 1960s-70s; his departure from the central Matsubayashi-Ryu organisation
    in 1969 over disagreements following his creation of the Fukyugata Sandan kata; the establishment
    of Ueshiro Shorin-Ryu Karate USA by the 1980s; the 30-year celebration in 1992; and his death from
    a stroke on May 7, 2002 in Oceanside, New York, buried in Locust Valley, with Robert Scaglione continuing
    the organisation.
