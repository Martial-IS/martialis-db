description:
  en: Finding Karate profile of Eiichi Miyazato (1922-1999). Born July 5, 1922 in Naha, one of seven children;
    his father Jiro, a merchant, had been a student of Kanryo Higaonna; Miyazato started training around
    age 13, introduced to Chojun Miyagi (a family neighbour); his elder brother Eiko was a longtime student
    at Miyagi's Garden Dojo. Judo under Shoko Itokazu from 1936, eventually the Kodokan, All Okinawa Judo
    Champion and All Japan Police Judo Champion. Draftee, deployed to Manchuria; father died in the Battle
    of Okinawa. Joined the Ryukyu Police in 1946, assisted Miyagi at the Police Academy. After Miyagi's
    death (October 8, 1953) inherited his training equipment, took over the Garden Dojo at 32, succeeded
    Miyagi as Chief Instructor of the Police Academy. Jundokan dojo in Naha from 1957 (3-story building),
    new location 1970; resigned police 1971. Hanshi from All Japan Karate-do Federation (September 8,
    1979); 7th dan Kodokan judo (May 1, 1981); 10th dan and Hanshi from the Okinawa Gojuryu Karatedo Kyokai
    (March 20, 1988); chairman of the Okinawa Prefecture Karatedo Federation (1991). Died December 11,
    1999; posthumously awarded 8th dan by the Kodokan.
