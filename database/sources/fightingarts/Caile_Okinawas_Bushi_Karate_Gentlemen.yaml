description:
  en: 'Essay by Christopher Caile (published May 30, 2024) on the Okinawan concept of "Bushi" as distinct
    from the Japanese warrior code of Bushido. Caile consulted his sensei Katsuhiko Shinzato - professor
    of linguistics at Okinawa International University - who explained that "Bushi" uses the same kanji
    and pronunciation in Okinawa and Japan but different meanings: in Okinawa it was an honorific for
    respected karate masters rather than a warrior-class term. Footnote 3 records that Shinzato is the
    head of the Okinawan Karate-Do Shorin-Ryu Kishaba Juku and was a student of Tsunetaka Shimabukuro,
    Shoshin Nagamine, Seigi Nakamura, Chokei Kishaba and Chogi Kishaba (Yamani-Ryu Bojutsu). The article
    also touches on the lineage of Bushi Matsumura, Chotoku Kyan and others, and thanks Shinzato, Morio
    Higaonna and Walter Dailey for input.'
