description:
  en: 'Compilation of interviews with Seikichi Iha conducted between 1985 and 1992 at the Original Okinawa
    Karate dojo and Iha''s home in Lansing, Michigan. Primary source: Iha born in Nishihara, Okinawa on
    July 12, 1932; trained under Shinpan Gusukuma (accepted as formal student in 1950, four years of training);
    after Gusukuma''s death in 1954 met and studied under Katsuya Miyahira; promotions 5-dan shihan (1963),
    6-dan (1964), kyoshi 7-dan (1967), kyoshi 8-dan (1978), hanshi 9-dan from Miyahira on March 12, 1989;
    teaching in Manila (1963-64), Futenma Marines (1964), Los Angeles (1967), and Lansing, Michigan (from
    1975). US Branch Chief of the Okinawa Shorin-ryu Karatedo Association.'
