description:
  en: 'Ernie Estrada''s interview with Hohan Soken, conducted September 10, 1978 at the Kadena NCO Club.
    Primary source: Soken identifies himself as born May 25, 1889 in Gaja Village, Nishihara City, native
    Okinawan, style officially called Matsumura Orthodox Shorin-ryu Karate-do, Shihan 10-Dan, honbu dojo
    in Gaja Village. States Bushi Matsumura left the "hands" of his teachings to his grandson Matsumura
    Nabe (his uncle, his mother being Nabe-tanmei''s sister), and that he became a student of his uncle
    around 1902 or 1903, learning Uchinan Sui-di as it was then called.'
