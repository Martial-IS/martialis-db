description:
  en: Interview article by Don Warrener with Jean-Claude Van Damme, which also looks back at Van Damme's
    amateur fighting career and his 1980 bout against Verlugels. It records that Claude Goetz was Van
    Damme's karate teacher and that Goetz studied with Tsutomu Oshima, a disciple of Gichin Funakoshi.
    Cites the 1980 Brussels event featuring Dan Macaruso versus Dominique Valera.
