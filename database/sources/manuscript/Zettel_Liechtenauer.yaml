description:
  en: >-
    Johannes Liechtenauer's long mnemonic poem of rhyming couplets on the long sword, mounted dueling,
    and armoured fencing with spear, short sword and dagger, the core text of the German school; no
    autograph survives, and it is preserved in seventeen unglossed copies and in the glosses of later
    masters. Recorded as a transmission document; not consulted directly.
