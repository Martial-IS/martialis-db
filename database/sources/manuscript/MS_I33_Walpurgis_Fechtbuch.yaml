title: Liber de Arte Dimicatoria (Royal Armouries MS I.33)
nativeTitle: Liber de Arte Dimicatoria
issuedDate: '132X'
language: la
description:
  en: >-
    The oldest extant treatise on medieval martial arts, on sword and buckler, made in Franconia in the
    1320s by three scribes and up to seventeen illustrators, perhaps devised by a secular priest named
    Lutegerus; also called the Walpurgis or Tower Fechtbuch. Held by the Royal Armouries, Leeds. Not
    consulted directly.
