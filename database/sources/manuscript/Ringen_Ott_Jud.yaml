  en: >-
    Ott Jud's grappling (Ringen) treatise, the dominant work on wrestling in the Liechtenauer tradition;
    the original is lost, and the oldest copy is the Gotha version in Hans Talhoffer's manual (ca.
    1448), followed by the Rome (1452) and Augsburg (1460s) branches. Recorded as a transmission
    document; not consulted directly.
