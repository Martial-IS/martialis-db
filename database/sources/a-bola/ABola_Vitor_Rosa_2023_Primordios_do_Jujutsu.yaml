description:
  en: 'Newspaper article by Vítor Rosa (A Bola, Espaço Universidade, 9 August 2023) on the origins of
    jujutsu in Portugal.

    Documents Raku Uyenishi''s performance at the Coliseu de Lisboa in 1907 (27 years old, 59 kg), his
    defeat of

    local wrestling champions (including Diogo Conelli... per the A Bola/Bartitsu-source record) and his
    assertion

    that he had beaten the English middleweight and heavyweight champion Gruhn upon arriving in the UK.

    '
  pt: Artigo de imprensa de Vítor Rosa (A Bola, Espaço Universidade, 9 de agosto de 2023) sobre os primórdios
    do jujutsu em Portugal, documentando a atuação de Raku Uyenishi no Coliseu de Lisboa em 1907 (27 anos,
    59 kg) e a sua afirmação de que, ao chegar ao Reino Unido, venceu o campeão dos médios e pesados de
    Inglaterra, Gruhn.
