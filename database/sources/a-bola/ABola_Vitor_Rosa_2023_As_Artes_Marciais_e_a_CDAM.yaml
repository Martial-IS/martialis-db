description:
  en: 'Newspaper article by Vítor Rosa (A Bola, 9 August 2023) on the history of the Comissão Diretiva
    das Artes Marciais (CDAM): Decreto-Lei 48462 of 2 July 1968 as the first special regulation of martial
    arts'' practice in Portugal, the creation of the CDAM by Decreto-Lei 105/72 of 30 March 1972 in the
    Secretariado-Geral da Defesa Nacional, its successive transfers of tutelage (EMGFA 1974, MEC 1980,
    MQV 1982, Presidência do Conselho de Ministros 1985), and its extinction by Decreto-Lei 69/87 of 9
    February 1987. Popular-press summary of the same author''s archival research on the CDAM.'
  pt: 'Artigo de imprensa de Vítor Rosa (A Bola, 9 de agosto de 2023) sobre a história da Comissão Diretiva
    das Artes Marciais (CDAM): o Decreto-Lei n.º 48462, de 2 de julho de 1968, como primeira regulamentação
    especial da prática das artes marciais em Portugal, a criação da CDAM pelo Decreto-Lei n.º 105/72,
    de 30 de março, no Secretariado-Geral da Defesa Nacional, as suas sucessivas transferências de tutela
    (EMGFA 1974, MEC 1980, MQV 1982, Presidência do Conselho de Ministros 1985) e a sua extinção pelo
    Decreto-Lei n.º 69/87, de 9 de fevereiro de 1987. Síntese de divulgação da mesma investigação arquivística
    do autor sobre a CDAM.'
