    Aikido por Georges Stobbaerts em 1965, o desenvolvimento das várias organizações e federações portuguesas
    de Aikido, e a fundação da Associação Portuguesa Aiki-Shuren Dojo (APASD) em 1989 sob Tristão da Cunha.
