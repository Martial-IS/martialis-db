description:
  en: Biographical profile of Master Jean-Marc Duclos on the Aikido Marcial Dôjo Clube website. Records
    his birth in Rouen on 19 October 1954, his 5th dan in aikido, his study under Georges Stobbaerts from
    1964 to 1998, under Gérard Obélianne between 1971 and 1973, and under Mitsugi Saotome since 22 August
    2000, plus his leadership roles in the APADA, the CDAM and the FPADA.
  pt: Perfil biográfico do Mestre Jean-Marc Duclos no site do Aikido Marcial Dôjo Clube. Regista o seu
    nascimento em Rouen a 19 de outubro de 1954, o seu 5º dan de Aikido, o estudo com Georges Stobbaerts
    entre 1964 e 1998, com Gérard Obélianne entre 1971 e 1973, e com Mitsugi Saotome desde 22 de agosto
    de 2000, além dos seus cargos de liderança na APADA, na CDAM e na FPADA.
