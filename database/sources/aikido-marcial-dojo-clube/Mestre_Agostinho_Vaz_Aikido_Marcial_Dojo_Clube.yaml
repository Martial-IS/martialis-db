description:
  en: Biographical page on Agostinho Vaz (5th dan FPA, 4th dan Aikikai) published by the Aikido Marcial
    Dôjo Clube, describing his judo practice from 1969, the start of aikido in 1977 in Almada under Katsumi
    Motomura, the arrival of Toshio Kawakami of the Shiseikai, his main references Nobuyoshi Tamura and
    Seiichi Sugano, and his teaching in Almada since 1985.
  pt: Página biográfica sobre Agostinho Vaz (5º dan FPA e 4º dan Aikikai) publicada pelo Aikido Marcial
    Dôjo Clube, descrevendo a sua prática de judo desde 1969, o início do Aikido em 1977 em Almada sob
    Katsumi Motomura, a chegada de Toshio Kawakami da Shiseikai, as suas principais referências Nobuyoshi
    Tamura e Seiichi Sugano, e o seu ensino em Almada desde 1985.
