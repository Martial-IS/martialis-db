description:
  en: Biographical profile of Master Luís Antunes published by the Aikido Marcial Dôjo Clube, covering
    his birth in 1953, his start in aikido on 1 August 1970 with Hirokazu Kobayashi in Castel-Jaloux,
    his training with Leopoldo Ferreira and José Araújo in the Misao Honda group, his direct studentship
    under Nobuyoshi Tamura, and his presidency of the Federação Portuguesa de Aikido.
  pt: Perfil biográfico do Mestre Luís Antunes publicado pelo Aikido Marcial Dôjo Clube, abrangendo o
    seu nascimento em 1953, o início da prática a 1 de agosto de 1970 com Hirokazu Kobayashi em Castel-Jaloux,
    o treino com Leopoldo Ferreira e José Araújo no grupo de Misao Honda, a sua condição de aluno direto
    de Nobuyoshi Tamura e a presidência da Federação Portuguesa de Aikido.
