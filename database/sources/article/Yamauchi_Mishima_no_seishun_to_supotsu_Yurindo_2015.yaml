description:
  en: Essay by literary critic Yamauchi Yukihiro (author of Mishima Yukio no Nikutai, Kawade Shobo Shinsha,
    2014 - the standard study of Mishima's physical culture) marking the 45th anniversary of his death.
    Details the September 1955 start of bodybuilding with a home coach, the September 1956 entry into
    boxing under Nichidai club head coach Kojima Tomoo (with fellow pupil Ishibashi Hirotsugu, later All-Japan
    bantamweight champion), the sparring sessions filmed by Ishihara Shintaro, and Mishima's own words
    on finding in kendo "my homeland... the ideal harmony of body and spirit".
