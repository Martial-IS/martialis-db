description:
  en: Memorial for Jan van der Horst by Willem Visser, published 17 May 2009 on the JBN Limburg news page
    (archived). Records van der Horst's early teachers Awazu, Deherdt and Bonnet Maury in France and later
    sensei Ishiro (Ichiro) Abe in Brussels, his close bond with Morioka, that he was Anton Geesink's first
    teacher, and his later role as national coach and CIOS Sittard lecturer.
