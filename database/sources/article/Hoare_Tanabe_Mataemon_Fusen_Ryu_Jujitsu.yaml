description:
  en: 'English translation by judo historian Syd Hoare of the account "Tanabe Mataemon Talks About His
    Fusen-Ryu Jujitsu",

    taken from the c.1170-page DaiNippon Judo-shi (Great Japan Judo History), published 1939. Gives Tanabe''s
    genealogy

    (Motsuge Zenji/Genkotsu Osho founding the line; Takeda Sadaharu; Tanabe Torajiro; Tanabe Mataemon),
    dates (born

    Okayama 1869, died Osaka 1942, menkyo kaiden at 17, Keishicho appointment 1890, judo Kyoshi 1906,
    retirement 1922,

    Judo Hanshi by the Butokukai 1927), his own account of his ground-grappling development and nickname
    "Newaza-Tanabe",

    and his remark that he and his pupils mostly practised gyaku-waza or joint-locking. Also cites Oimatsu''s
    remark that

    Yukio Tani was a student of Tanabe Mataemon in Kobe, where he learned Fusen-ryu jujitsu. Cited by
    the English

    Wikipedia article on Mataemon Tanabe.

    '
