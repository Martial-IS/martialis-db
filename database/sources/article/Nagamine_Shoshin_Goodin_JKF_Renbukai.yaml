description:
  en: Article on Shoshin Nagamine by karate historian Charles C. Goodin. States Nagamine began karate
    at 17 with Chojin Kuba; two years later traveled to Shuri to study under Shimabuku Taro, who referred
    him to Arakaki Ankichi (a student of Gusukuma Shimpan, Hanashiro Chomo, Chibana Choshin and Kyan Chotoku);
    during his Kadena Police Station years (1931-1935) studied directly under Kyan; in 1936 at the Tokyo
    Metropolitan Police Academy received instruction under Motobu Choki; also practiced judo and kendo
    with dan rankings; established his first dojo in 1943 in Tomari, the Tomari Ken Yu Kai, with Kyan
    attending the opening ceremony.
