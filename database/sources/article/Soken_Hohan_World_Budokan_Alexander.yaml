description:
  en: George W. Alexander's article on Hohan Soken (1889-1982), based on an interview conducted September
    10, 1978. Born May 25, 1889 in Gaja Village, Nishihara City; founder of Matsumura Seito Shorin Ryu.
    States the Matsumura family lineage passed from Matsumura Sokon to his grandson Nabe Matsumura (1860-1920),
    and that Soken began training at thirteen in 1902 under his uncle Nabe Matsumura, his uncle's only
    student; after ten years of basic training began learning hakutsuru in 1912 at twenty-three. Also
    trained with Kenwa Mabuni and Gokenki (white crane), and studied weaponry under Komesu Ushi-no-Tanmei
    and Mantaka Tsuken. Moved to Buenos Aires in 1924, returning to Okinawa in 1952.
