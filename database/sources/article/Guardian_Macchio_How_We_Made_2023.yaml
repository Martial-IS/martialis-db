description:
  en: Guardian 'How we made' interviews on The Karate Kid (1984). Ralph Macchio states firsthand that
    apart from four childhood jiu-jitsu lessons he had no martial arts experience, and that before filming
    he was trained in Okinawan Goju-ryu karate by Pat E. Johnson. Screenwriter Robert Mark Kamen describes
    his own Goju-ryu background tracing to Chojun Miyagi as the basis for the film's training content.
