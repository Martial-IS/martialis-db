description:
  en: 'Biography of Shimabuku Tatsuo (1908-1975), founder of Isshin-ryu karate, by A.J. Advincula (1997).
    A primary account by a practitioner who knew him: covers his birth in Chan village (now Kinaka), Gushikawa
    City, his Shuri-te study with Chotoku Kyan (four years, from about age 23-24), Naha-te study with
    Chojun Miyagi (about three years from around 1936), a year with Choki Motobu in Naha (1938), his time
    in the Philippines and Osaka, and the naming of Isshin-ryu on January 15, 1956. The dates differ in
    places from the EN Wikipedia article.'
