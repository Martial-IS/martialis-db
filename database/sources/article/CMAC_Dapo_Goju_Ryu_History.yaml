description:
  en: CMAC Dapo article on the creation of Goju-ryu karate, covering the Fujian roots of Naha-te. States
    Chojun Miyagi was born into a wealthy family and at age 11 began training with Ryuko Aragaki, a Tomari-te
    expert; after three years he was introduced to Higashionna (Higaonna) in 1902; his training was severe,
    including shime and conditioning with chishi, heavy jars, dumbbells, kongoken and makiwara. Also covers
    Seisho Aragaki as first teacher of Kanryo Higashionna, his training with Wai Xinxian and teaching
    at Taitei Kojo's dojo, and the introduction of Higashionna to the Kojo dojo around 1870.
