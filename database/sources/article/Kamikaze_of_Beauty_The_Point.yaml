description:
  en: Essay on Mishima's Sun and Steel quoting the John Bester translation directly, including Mishima's
    account of beginning intensive physical training in 1955 at age thirty - weightlifting, running, boxing
    and kendo - and his stated ideal of reviving 'the old Japanese ideal of a combination of letters and
    the martial arts' (bunburyodo). Useful as an accessible English carrier of Sun and Steel's own statements
    about his physical culture.
