notes: >-
  PDF "Tatami Articles 7-25.pdf", linked from Morotti's bio on the Hollywood
  Judo Dojo website (https://hollywoodjudo.com/instructors/bio/id/8572).
  Translator not named (the byline reads "By Philippe Morotti"; file
  metadata gives Gary Goltz). The translation is looser than the original:
  "passé par le Racing Club de France période Neil Adams" becomes "He trained
  under Neil Adams at the famed Racing Club de France". The PDF also has a
  private e-mail after the article: do not cite it.
