description:
  en: Regional press article published 14 March 2012 on Jean de Herdt at age 88, presenting him as the
    first pupil of Mikinosuke Kawaishi, the man who implanted judo in Europe. Recounts the 1935 meeting
    between de Herdt (then 14, below the 17-year minimum age) and Kawaishi, insisted upon by de Herdt's
    father, a champion of Greco-Roman wrestling; and that three years later de Herdt was among the first
    to obtain the black belt, at age 17. The article is cited by Cichorei Kano's E-Judo forum post on
    de Herdt.
