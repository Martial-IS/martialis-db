description:
  en: Interview with Ichiro Abe by Atsushi Miyazaki in the Kodokan's monthly magazine Judo (April 2012
    issue, pp. 7-20), the 13th in the series "Kodokan Judo Ten-dan Monogatari". Abe recounts his judo
    career in his own words, including his first teacher Sato Shigeru at Maebashi Junior High School and
    the tutelage of Nagaoka Shuichi, Hashimoto Shojiro, Otaki Tadao and Matsumoto Yoshizo at Tokyo Higher
    Normal School summer workshops.
