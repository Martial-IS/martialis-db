description:
  en: 'First-person memorial of Akamine Eisuke (chairman of the Ryu Kyu Kobudo Preservation and Promotion
    Association, died January 1999 at 74) by Katherine Loukopoulos, a Greek practitioner who trained on
    Okinawa for fourteen years. Primary source for the Nagamine Shoshin dojo milieu: the author first
    came to Okinawa in December 1982 and studied at Nagamine''s honbu dojo in Kumoji, Naha, where Nakamura
    Seigi was a Matsubayashi Shorin Ryu teacher, gave her special training for hours at a time, arranged
    her daily training and introduced her to Miyazato Eiichi (Jundokan) and Uehara Ko (weapons, student
    of Miyazato); she later became a direct student of Miyazato Eiichi and studied Ryu Kyu Kobudo under
    Akamine Eisuke and Shiroma Katsuo, winning the women''s black belt Bo Kata category at the 1997 World
    Karate Kobudo Championships.'
