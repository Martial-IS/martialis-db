description:
  en: Magazine profile of Wim Ruska in Ons Amsterdam (July/August 2017) by Peter de Brock. Details his
    Amsterdam upbringing, early judo at club Yu-Ai, and his move to train at Jon Bluming's club Tung Jen;
    calls Bluming "Ruska's judomeester" and describes Ruska beating him with six ippons after three months.
    Also covers the 1964 Tokyo selection dispute, the Munich double gold, and his later years.
