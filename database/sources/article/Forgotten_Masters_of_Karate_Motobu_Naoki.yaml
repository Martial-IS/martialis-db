description:
  en: 'Motobu Naoki''s article "Forgotten Masters of Karate" (translated from his Ameblo blog of February
    19, 2016, based on a 1918 Ryukyu Shimpo article), introducing Okinawan karate masters of the Taisho
    era: Kiyuna Tanmei, Chinen Sanra, Yabu Kentsu and Motobu Choyu. States Chinen Sanra was a famous bojutsu
    master of commoner origin (yago Yamanmee, hence Yamane-ryu), and that after the war his grandson Chinen
    Masami served as head of the family; Higa Seitoku of the Bugeikan studied under Masami and was awarded
    the only shihan license Masami ever issued, making the Bugeikan the legitimate successor to the Yamane-ryu;
    Yabiku Moden and Oshiro Chojo also studied under Chinen Sanra.'
