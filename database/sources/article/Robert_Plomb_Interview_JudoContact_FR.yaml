description:
  en: Interview with Marcel Clause by Charles Herszaft, published in the Belgian judo magazine Judo Contact
    (November 2001). Clause recounts in his own words that he began judo in 1952 at age 23 under his first
    teacher Monsieur Plomb (then a brown belt), that Plomb taught at the Wasmes club which Clause later
    ran, and describes his long career under Ichiro Abe from his 1st dan onwards.
