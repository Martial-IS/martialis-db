description:
  en: Multi-part interview with Jean-Claude Van Damme published in Fighter International magazine in November
    1988 and reproduced on the backkicks.com martial arts encyclopedia. Van Damme states he started karate
    in Brussels in 1971 at age 11, names Claude Goetz as his original instructor, and confirms he briefly
    trained with Dominique Valera; the magazine intro records that he received his black belt in Shotokan
    karate from Goetz in 1978.
