description:
  en: 'Critical book review (2 December 2018) by the judo historian Michel Brousse of the biography ''Jean
    de Herdt: le premier entre tous les judokas'' by René Boisramé and Noël Andréucci (Budo-éditions,
    2018). Uses period archival sources - Jean Gailhat''s account in the Bulletin officiel de la Fédération
    française de judo jiu-jitsu, Jacques Faizant''s report in Judo International (15 January 1952), Risei
    Kano''s own June 1952 report, and John Barnes''s account in the British Judo Quarterly Bulletin (January
    1952) - to correct the book''s claims. Documents that de Herdt was awarded his 4th dan on 6 December
    1951 by Risei Kano, president of the Kodokan, at 11 pm, after a drawn demonstration match against
    Toshiro Daigo in which Daigo beat the nine other French black belts. Debunks the book''s claim that
    ambassador Yotaro Sugimura offered 4th, 5th and 6th dan in the name of the Kodokan (Sugimura died
    in 1939), and contests de Herdt''s self-claims concerning the founding of the Panamerican Judo Confederation,
    the Fédération française de judo and the Collège des ceintures noires.'
