description:
  en: Essay by Geoffrey E. Gaudion on Shoshin Nagamine and his teachers, hosted on okinawanshorinryu.com
    (Okinawan Shorin-Ryu BB essays). Covers Ankichi Arakaki (born November 1899 in Shuri, first of eleven
    children; his first teachers were Shinpan Gusukuma and Chomo Hanashiro; after quitting school he studied
    under Choshin Chibana; after military discharge in 1921 he moved to Kadena where he learned karate
    from Chotoku Kyan; died of ulcers on December 28, 1927 at age 28), and his teachers Kyan, Motobu and
    Nagamine.
