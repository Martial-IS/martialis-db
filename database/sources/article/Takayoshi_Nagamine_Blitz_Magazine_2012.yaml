description:
  en: Blitz Magazine article (December 2012) by Kimberley Granger and Reece Cummings on Soke Takayoshi
    Nagamine's visit to Australia. States he was born in Naha City, Okinawa in August 1945, began studying
    karate at age six as the son of Matsubayashi-ryu founder Shoshin Nagamine (a living intangible cultural
    asset), holds 10th dan in Matsubayashi-ryu with the title of Hanshisei, lived over 10 years in the
    US teaching in the Ohio region, and returned home to lead the World Matsubayashi-Ryu (Shorin-Ryu)
    Karate-do Association. Includes his explanation of the five fundamentals philosophy.
