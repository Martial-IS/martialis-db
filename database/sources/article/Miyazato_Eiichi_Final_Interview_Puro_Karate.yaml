description:
  en: 'Portuguese translation of two articles on Eiichi Miyazato (1921-1999 per this source): "The Final
    Interview!" by Jaromir Musil (October 5, 2006) and an interview by Kent Moyer (2001). Primary accounts:
    Miyazato began training with Chojun Miyagi in 1935 at age 13; he was active in judo, All Okinawan
    Judo champion and president of the Okinawa Judo Federation; member of the board of directors of the
    All Japan Karate-Do Goju-Kai; 10th dan Hanshi and director of the Jundokan. Discusses the senior students
    of Miyagi at his death in 1953 (Seiko Higa, Meitoku Yagi, Eiichi Miyazato, Koshin Iha, Seikichi Toguchi)
    and the succession question.'
