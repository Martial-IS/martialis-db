description:
  en: MovieWeb feature examining Pat Morita's martial arts background. States Morita had no karate experience
    before The Karate Kid, that the cast including Morita and Ralph Macchio was taught goju-ryu ('Okinawan
    classic') karate by Pat E. Johnson, and that Fumio Demura doubled Morita's fight scenes and inspired
    the Miyagi character.
