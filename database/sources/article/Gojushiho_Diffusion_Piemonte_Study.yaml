description:
  en: 'Study by Emanuel Giordano and Manuel Vignola (June 4, 2021) on the diffusion of the Gojushiho kata.
    States Shinpan Gusukuma handed down two versions: a short one (in the Shubukan school of Joki Uema
    and the Ryubukan school of Seitoku Ishikawa) and a longer one transmitted by Gusukuma''s student Seiichi
    Iju, similar to the version of Chozo Nakama, practiced in the Shorin-ryu Shorinkan school under the
    name "Iju Gojushiho".'
