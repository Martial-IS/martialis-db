description:
  en: Motobu Naoki's Motobu-ryu Blog article (September 2, 2023) on Nakama Chozo's Gojushiho kata. States
    Nakama was a senior disciple of Chibana Choshin; when Motobu Choki briefly returned to Okinawa for
    the 1936 Roundtable of Karate Masters, Nakama learned kumite from him; after the war Nakama had a
    close relationship with Uehara Seikichi, exchanging techniques. Notes Nakama had no dojo of his own,
    teaching at a local community center and his home, and that per Nakamoto Mamoru (Bunbukan Dojo) Nakama
    learned Gojushiho from Hanashiro Chomo.
