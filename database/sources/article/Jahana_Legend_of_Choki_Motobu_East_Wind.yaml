description:
  en: Translation of Seijin Jahana's article "Choki Motobu, a Forerunner of Combative Karate" from Aoi
    Umi (Blue Sea) magazine No. 70 (February 1978), published on East Wind Budo. Jahana interviewed Chozo
    Nakama (then 80) in 1978; Nakama stated he learned karate directly from Choki Motobu, whose own dojo
    opened around 1940 in Nishishinmachi (Kumecho now), Naha after his return from Osaka. Covers the Motobu-Nakama
    relationship, the unpublished manuscript story, and states Nakama held Hanshi 9th dan.
