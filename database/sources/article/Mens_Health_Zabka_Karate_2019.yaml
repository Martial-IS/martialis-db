description:
  en: Men's Health interview with William Zabka ahead of Cobra Kai season two. Zabka states he knew nothing
    about karate before The Karate Kid, was trained by Pat E. Johnson ("He built me up from nothing"),
    kept training with Johnson after the film, and credits karate training (karate and taekwondo during
    Cobra Kai) with healing a high-school wrestling back injury.
