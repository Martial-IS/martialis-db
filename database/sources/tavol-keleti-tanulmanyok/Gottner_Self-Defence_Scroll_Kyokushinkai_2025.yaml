description:
  en: Peer-reviewed article by Richárd Gábor Gottner analysing the scroll Masutatsu Oyama received from
    Daitō-ryū master Yoshida Kōtarō. Concludes the scroll is a one-of-a-kind Yoshida-style stick-parasol
    self-defence mokuroku, not a menkyo kaiden, and that Oyama was a student of a Daitō-ryū representative
    instructor but never received an official transmission licence
