description:
  en: Undergraduate thesis on Mishima and kendo, reading his kendo fiction ("Ken", "Honba") through three
    viewpoints - watching, doing, dying - against the aesthetics of Sun and Steel. Biographically it dates
    his taking up kendo to around age thirty-three, about three years after he began physical training
    in 1955, records that he kept up practice unchanged until a few days before his death, and quotes
    Sun and Steel's "kendo ni wa arayuru otoko-rashisa no bi ga gyoshu shite ita" ("all masculine beauty
    was condensed in kendo"). It does not treat his teachers, dojos, dan grades or competition record.
