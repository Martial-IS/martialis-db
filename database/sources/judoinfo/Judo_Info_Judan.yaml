  en: >-
    Judo Info page profiling the Kodokan 10th dan holders from Yamashita
    Yoshitsugu to the 2006 promotions, with a list in order of promotion
    date. The page states its copyright as 1997/2008 and its last
    modification as 21 November 2008. The entry on Shōriki Matsutarō gives
    his birth and records that he was promoted to 10th dan after his death.
