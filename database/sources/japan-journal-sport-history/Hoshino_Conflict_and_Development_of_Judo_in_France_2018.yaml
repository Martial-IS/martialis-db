description:
  en: 'Peer-reviewed article (pp. 1-18) by Utsuru Hoshino (Waseda University) on the conflicts and development
    of French judo from 1946 to 1956, based on the FFJJ''s official organ Judo (published from January
    1950) and Kodokan periodicals. Documents the founding of the FFJJ (5 December 1946); the rise of the
    Kodokan-tendance around the Shudokan Club and Ichiro Abe; the founding of the UAK on 8 October 1954
    (renamed FATK in early 1955); and the unification agreement of 29 February 1956, concluded with representatives
    of the Direction des Sports and the Ministère de l''Éducation Nationale present, which established
    the FFJDA '
