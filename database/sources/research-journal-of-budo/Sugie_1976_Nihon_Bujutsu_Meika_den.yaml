description:
  en: 'Research note (武道学研究 / Research Journal of Budo, vol. 8, no. 3, pp. 60-66) by Sugie Masatoshi (Osaka

    University) arranging the biographies of the 日本武術名家伝 into a chronological table of Meiji-era martial

    artists. The table''s Meiji 6-7 (1873-74) entries record that a kenjutsu teacher served at Handa Yataro''s
    practice

    hall (演武場) at Dojima, residing there to instruct students - independent corroboration of Handa''s
    Osaka presence

    in the early Meiji period, before the 1878 founding of the Seibukan.

    '
  ja: '杉江正敏（大阪大学）による研究ノート（武道学研究 第8巻第3号、60-66頁）。『日本武術名家伝』の略伝を明治期武道家の

    年表に整理したもの。明治6-7年（1873-74年）の項に、剣術教師が堂島の半田弥太郎の演武場に剣術教師として住み込んで

    門生を指導したと記録されており、1878年の盛武館創設以前の明治初期における半田の大阪での活動の独立した裏付けとなる。

    '
