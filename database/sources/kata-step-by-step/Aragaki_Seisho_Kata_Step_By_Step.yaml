description:
  en: 'Kata Step by Step article on Aragaki Seisho (1840-1918), also known as Arakaki Ou, Maya Arakaki
    and Aragaki Tsuji Pechin Seisho, and called "Aragaki the Cat". Royal court official with the title
    Chikudon Peichin, Chinese interpreter who travelled to Beijing in September 1870. His only documented
    martial arts instructor was Wai Xinxian of Fuzhou; he taught kempo to Higaonna Kanryo and introduced
    him to Kojo Taitei in Fuzhou. Kata taught: Unshu, Seisan, Shihohai, Sochin, Niseishi, Shisochin, Sanchin,
    plus weapons kata Arakaki-no-kun, Arakaki-no-sai, Sesoku-no-kun. Students included Higaonna Kanryo,
    Chojun Miyagi, Kenwa Mabuni, Gichin Funakoshi, Kanbun Uechi, Kanken Toyama and Tsuyoshi Chitose.'
