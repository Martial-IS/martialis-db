description:
  en: Compilation on the history of aikido in Portugal, principal mentor Jean-Marc Duclos, published by
    the Federação Portuguesa de Aikido (FPA) and reproduced on its website. Covers the arrival of Japanese
    martial arts in Portugal, the early days of aikido under Georges Stobbaerts and Misao Honda, the role
    of the CDAM, and the founding of the FPA and the main Portuguese aikido associations.
  pt: Compilação sobre a história do Aikido em Portugal, com Jean-Marc Duclos como principal mentor, publicada
    pela Federação Portuguesa de Aikido (FPA) e reproduzida no seu site. Abrange a chegada das artes marciais
    japonesas a Portugal, os primórdios do Aikido sob Georges Stobbaerts e Misao Honda, o papel da CDAM
    e a fundação da FPA e das principais associações portuguesas de Aikido.
