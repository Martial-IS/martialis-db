description:
  en: Guest article by Jeff Karinya on kenshi247.net about Nakayama Hakudo and the Yushinkan dojo. Covers
    Hakudo's origins in Komatsu, Ishikawa, his training under Negishi Shingoro and other teachers, his
    study of Shinto Muso Ryu jojutsu and the Tosa Eishin Ryu iai schools (Hosokawa Yoshimasa, Morimoto
    Tokumi), the 1920 and 1927 hanshi titles, his creation of Muso Shinden Ryu in 1933, and the Yushinkan
    students selected to learn specific arts - including Nakakura Kiyoshi, who learned only Muso Shinden
    Ryu Iaido and Kendo.
