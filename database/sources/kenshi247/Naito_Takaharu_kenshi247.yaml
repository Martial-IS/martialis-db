description:
  en: kenshi247 biography of Naitō Takaharu (1862-1929); the article states it is 'mostly a quick
    translation from the Japanese wikipedia article', so it is not independent corroboration of JA wiki
    claims. Covers the Tobukan entry in 1874, training under Sakakibara Kenkichi (1883, one year), the
    Keishichō entry in 1888, Seirenshō 1897, the Butokuden five-teacher appointment and Busen head
    instruction from 1899, the 1901 Taikai draw with Takano, and the 1911 kata committee.
