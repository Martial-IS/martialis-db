description:
  en: kenshi247 biography of Monna Tadashi (1855-1930); 'basically a quick translation of some secondary
    material' (the Mito Tobukan 130-year history; Domoto Akihiko's 'Meiji Gekken-ka'). Covers his Tobukan
    years under Kozawa and Shimoe, Keishichō, Seirenshō 1899, Busen from 1907, hanshi 1913 (with Naitō and
    Takano), and the 1919 dismissal. Source of the 'Waza Monna, Ki Takaharu' pairing.
