description:
  en: Peer-reviewed study of how bushidō imagery and nihonjinron rhetoric shaped karate's postwar global
    spread. On Mishima Yukio it states that after training in kendo and iaido he started karate training
    in 1967 at the Japan Karate Association, and that shortly before his death he took part in the 13th
    All-Japan Karate Championships at the Nippon Budokan in 1970 (this latter claim follows Pita Céspedes
    2014 rather than primary JKA records). Also documents his role, with Hagakure nyūmon (1967), in restoring
    the popular international image of bushidō.
