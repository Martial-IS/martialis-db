description:
  en: Archival study of the Comissão Diretiva das Artes Marciais (CDAM), the Portuguese state body controlling
    martial arts and combat sports, based on the CDAM fonds at the Arquivo da Defesa Nacional (184 dossiers
    in 17 units across 12 series, transferred in 2019 by the CEFDM/DGRDN). Establishes that Decreto-Lei
    48462 of 2 July 1968 merely assigned control competence to the Departamento da Defesa Nacional without
    regulamentação, that the CDAM itself was created by Decreto-Lei 105/72 of 30 March 1972 in the Secretariado-Geral
    da Defesa Nacional and regulated by Portaria 813/73, and documents its successive changes of tutelage
    (EMGFA 1974, MEC 1980, MQV 1982, Presidência do Conselho de Ministros 1985) and its extinction by
    Decreto-Lei 69/87 of 9 February 1987, with its rights and obligations transferred to the Direção-Geral
    dos Desportos. Also documents the União Portuguesa de Budo's role in the state control process (16
    July 1966 survey) and the mid-1980s Portuguese karate federations (FPK, FPKDA).
  pt: Estudo arquivístico sobre a Comissão Diretiva das Artes Marciais (CDAM), organismo estatal português
    de controlo das artes marciais e desportos de combate, baseado no fundo documental da CDAM no Arquivo
    da Defesa Nacional (184 processos em 17 unidades de instalação, 12 séries, entregues em 2019 pela
    CEFDM/DGRDN). Estabelece que o Decreto-Lei n.º 48462, de 2 de julho de 1968, atribuiu apenas competência
    de controlo ao Departamento da Defesa Nacional sem regulamentação, que a CDAM foi criada pelo Decreto-Lei
    n.º 105/72, de 30 de março, no Secretariado-Geral da Defesa Nacional e regulamentada pela Portaria
    813/73, e documenta as suas sucessivas tutelas (EMGFA 1974, MEC 1980, MQV 1982, Presidência do Conselho
    de Ministros 1985) e a sua extinção pelo Decreto-Lei n.º 69/87, de 9 de fevereiro de 1987, com transferência
    dos direitos e obrigações para a Direção-Geral dos Desportos. Documenta ainda o papel da União Portuguesa
    de Budo no processo de controlo estatal (levantamento de 16 de julho de 1966) e as federações portuguesas
    de karaté de meados da década de 1980 (FPK, FPKDA).
