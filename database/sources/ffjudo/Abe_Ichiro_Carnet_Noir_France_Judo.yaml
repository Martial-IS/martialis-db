description:
  en: 'Official France Judo obituary (carnet noir, published 28 February 2022) announcing the death of
    Ichiro Abe on 27 February 2022 at age 99. Records that he began judo in 1937 at the Maebashi lycée
    with Master Sato 5th dan, and that he settled in Toulouse in 1951 during the Kodokan judo promotion
    campaign in Europe, aged 29 and 6th dan, as technical advisor at the Shudokan of Robert Lasserre;
    it credits him as one of the fathers of a school of judo in France, around reputed French professors
    and judoka such as Pierre Roussel, Jacques Belaud, Luc Levannier and Guy Pelletier. It further lists
    his career in European and Japanese judo bodies: technical director of the Belgian Judo Association
    (1953), technical advisor of the European Judo Union (1955), head of the Kodokan international department
    (1969), president of the All Japan Judo Federation (1985), and his promotion to 10th dan on 8 January
    2006.'
