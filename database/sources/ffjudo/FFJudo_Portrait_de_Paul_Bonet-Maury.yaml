description:
  en: 'Portrait of Paul Bonet-Maury published by the French Judo Federation (FFJDA): founder of the Fédération
    française de judo et de jiu-jitsu in December 1946, creation of the Collège des Ceintures Noires in
    1947, key role in the founding of the International Judo Federation in 1951 of which he became secretary-general,
    state recognition of judo in 1955, and the development of women''s competition from 1950.'
  fr: 'Portrait de Paul Bonet-Maury publié par la Fédération française de judo (FFJDA) : fondateur de
    la Fédération française de judo et de jiu-jitsu en décembre 1946, création du Collège des Ceintures
    Noires en 1947, rôle déterminant dans la création de la Fédération internationale de judo en 1951
    dont il devient secrétaire général, agrément d''État du judo en 1955 et développement des compétitions
    féminines à partir de 1950.'
