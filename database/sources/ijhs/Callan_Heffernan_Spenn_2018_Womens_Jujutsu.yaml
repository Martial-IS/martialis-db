description:
  en: 'Peer-reviewed academic article (The International Journal of the History of Sport, vol. 35, no.
    6, pp. 530-553)

    on the first British women''s pioneers of jujutsu/judo. Case study 1 covers Phoebe Roberts (1887-1937):
    born Phoebe

    Parry in Monmouthshire, adopted by the London manufacturing chemist Roberts family; joined Uyenishi''s
    Golden Square

    School in 1903 aged 16, promoted to instructor within a year; performed alongside her teachers Tani
    and Uyenishi

    from December 1904, including Caxton Hall, the Aldershot military demonstrations, the June 1905 Japan
    Society

    garden party attended by Prince Arisugawa, and venues up to the Japanese School of Ju-jitsu in Oxford
    Street.

    Married Juzo/Juso Hirano in March 1907, toured Spain in 1908, and followed Hirano to Barcelona and
    Portugal; as

    Phoebe Laughton-Parry she married Don Carlos de Castro Henriques in 1916 and died in Porto in October
    1937. Case

    study 2 covers Edith Garrud (1872-1971), whose suffragette-era jujutsu is treated here alongside the
    Bodyguard

    she trained for the WSPU. Case study 3 covers Sarah Mayer.

    '
