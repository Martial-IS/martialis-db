description:
  en: Biography page on the self-published "Judo en Familia" Google Sites project devoted to Fernando
    Franco de Sarabia (died 1988), first Spanish judo black belt. Records his presence from 1948 in the
    founding nucleus of Madrid judo around Alfredo San Bartolomé, the founding of the Club Bushidokwai,
    his green belt from Mikinosuke Kawaishi at a stage in Biarritz (1952) and brown belt by 1953, his
    progression through the dan grades (4th dan in 1968 when he opened his Gimnasio Samurai on calle General
    Martínez Campos), and the first 5th dan examination held in Spain (Gimnasio Moscardó, Madrid, November
    1969, with Henri Courtine and Bernard Pariset on the tribunal).
