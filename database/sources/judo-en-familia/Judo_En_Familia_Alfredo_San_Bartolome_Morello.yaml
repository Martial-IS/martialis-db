description:
  en: Biography page on the self-published "Judo en Familia" Google Sites project devoted to Alfredo San
    Bartolomé Morello (1912-1979), the Peruvian-born pioneer of judo in Spain. Records his birth in Peru
    (possibly Lima), his discovery of judo in 1931 in Lima, his first teacher Shinsho Siosaki Murayama,
    his dan grades in Peru (1st dan 1936, 2nd dan 1940), his arrival in Madrid in 1947 and first classes
    at the Gimnasio Juventud, the foundation of the Asociación Española de Judo y Jiu-jitsu (May 1950)
    and the Club Bushidokwai, his 3rd dan from Yves Klein (1954, with Ichiro Abe as sponsor) and 4th dan
    from Kiyoshi Mizuno (1958), the Medalla de Oro al Mérito Deportivo (29 November 1972), and his death
    in Madrid on 14 May 1979.
