description:
  en: Oshiro Dojo page on Shihan Toshihiro Oshiro, co-founder and chief instructor of the RBKD. States
    he was born in Haneji, Okinawa, learned from Shoshin Nagamine, Chogi Kishaba, Masao Shima and Seigi
    Nakamura, emigrated to the United States in 1978, founded Oshiro Dojo in Northern California, co-founded
    the RBKD, holds 9th dan in Shima-Ha Shorin-Ryu karate and 8th dan in Yamanni Chinen Ryu kobujutsu,
    and relocated back to Okinawa in 2018.
