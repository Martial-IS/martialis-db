description:
  en: 'Second part of the 1978 interview with Hohan Soken, "made by Ernest Estrada", hosted on milos.io.
    Primary source for Soken''s kata and weaponry: he teaches the Matsumura kata - pinan shodan and nidan,
    naihanchi shodan and nidan, patsai-sho and dai, chinto, gojushiho, kusanku, rohai ichi-ni- san, and
    hakutsuru - naming the Matsumura kusanku (the older version) the best kata of his youth; he also teaches
    bo, sai, tuifa, kama, nunchaku, kusarigama and suruchin, his favorite weapons form being tsukenbo
    (learned from Komesu Ushi). States he knew Taira Shinken well and taught him some of his older forms,
    formed the All Okinawa Kobujutsu Association in 1970, and is a member of the Ryukyu Historical Society.
    Discusses the old Okinawan grappling art "ti" (also "te-kumi" or "gyaku-te") and Soken''s views on
    kata naming and village traditions.'
