description:
  en: Interview with Jon Bluming by WR Mann, published on the Realfighting Organization site; the USAdojo
    repost is a copy of this. Bluming describes his instructors in Tokyo as including Donn Draeger, Mas
    Oyama, Kenji Kurosaki and Ichitaro Kuroda; recounts how Draeger trained him from March 1959, proposed
    him for the Kenshusei class, and how they trained bo-jitsu under Shimizu and Kuroda twice a week for
    two and a half years, receiving 3rd dan from the Japanese Kendo Federation.
