description:
  en: Interview with Teruo Chinen conducted by Dong Tran at the Jundokan International Spring Gasshuku
    on May 31, 1997 in Montclair, New Jersey. Covers Chinen's birth in Kobe, training under Eiichi Miyazato
    under Miyagi's watchful eye, helping move equipment to the Jundokan after Miyagi's death, the Yoyogi
    dojo years in Tokyo (1958-1969), his move to the US in 1969, co-chairing the IOGKF (1973-1979), and
    his family relationship with Yamanni-ryu founder Masami Chinen, his grand-uncle.
