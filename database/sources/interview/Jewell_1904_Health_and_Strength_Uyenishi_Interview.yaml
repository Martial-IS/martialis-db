description:
  en: 'March 1904 interview with jujutsu pioneer Sadakazu Uyenishi, published in Health and Strength Magazine.
    The

    journalist J. St. A. Jewell states that Uyenishi learned jujutsu from Yataro Handa of Osaka, and that
    Yukio Tani

    "was also a pupil of Yataro Handa''s" and "received the finishing touches of his jujitsu education
    at Mr. Handa''s

    hands". The interview also reportedly describes Uyenishi as the Champion of Osaka. Republished in
    The Bartitsu

    Compendium, vol. 2 (Wolf, ed.), and quoted in Wolf''s 2016 Bartitsu Society article and the peer-reviewed
    Brough

    et al. (2023) paper on the British Ju-jitsu Society (mas.166). The primary text is not directly accessible
    here;

    this entry is sourced via Wolf 2016 (01M0AJNJHSV6RHCNNKNM0Y1EHT) and Brough et al. 2023

    (01M0A7YYEFNNVJ1W07NHA7XJHG).

    '
