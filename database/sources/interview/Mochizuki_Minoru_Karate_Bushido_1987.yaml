description:
  en: Interview with Minoru Mochizuki conducted by P. Bénoliel (translation Olivier Chabot, photos A.
    Tran Van), published in the French magazine Karaté-Bushido (issue 139, September 1987), on the occasion
    of a stage with Alain Floquet in Villeneuve-sur-Lot in July 1987. Covers his biography from 1912,
    the four Katori Shinto-ryu shihan at the Kodokan (Tamai, Kuboki, Ito, Shiina), the studies arranged
    by Kano with Ueshiba, Shimizu and Hakudo Nakayama, the 1933 Daito-ryu Okuden Inka diploma, the sutemi
    as his own creation, karate under Kudaka and Gichin Funakoshi (three months of courses, not counting
    himself a student), Mongolia, and his years in France from 1951.
