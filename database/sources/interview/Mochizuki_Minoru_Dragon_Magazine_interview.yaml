description:
  en: 'Two-part interview with Minoru Mochizuki by Eric Garnier Sinclair, published in the French magazine
    Dragon Magazine (issue 11 dated 2005; issue 9''s publication year is not stated). The first part (''époque
    Jigoro Kano'') covers his childhood, training with Sampo Toku and Gyokushin-ryu under Sanjuro Oshima,
    his Kodokan years under Kano and Mifune, the Kobudo Kenkyukai and the four Katori Shinto-ryu shihan,
    and his study of kendo and iaido under Hakudo Nakayama. The second part, published after his death
    on 30 May 2003, covers the Ueshiba dojo years (Mejiro and Ushigome), the 1932 transmission manuscripts
    (Goshinyo no te, Hiden ogi no koto), Sokaku Takeda''s visit, the Yoseikan dojo opening, Mongolia,
    and the encounter with Tadashi Abe. Mochizuki recounts being chosen by Kano to study aiki-jujutsu
    with Morihei Ueshiba, Shindo Muso-ryu jojutsu with Koji Shimizu, and the sword with Hakudo Nakayama.
    Ranks sidebar: 9th dan jujitsu, 8th dan judo, 8th dan iaido, 8th dan katori shinto ryu, 5th dan karate,
    5th dan kendo.'
