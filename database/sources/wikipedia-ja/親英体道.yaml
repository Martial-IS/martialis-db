description:
  en: >-
    Japanese Wikipedia stub on Shin'ei Taidō, founded by Inoue Noriaki. Gives
    the Inoue side of its origin (an Inoue family art taught to Ueshiba
    Morihei as Aioi-ryū, later Aiki Budō), the renaming to Shinwa Taidō in
    1946 and to Shin'ei Taidō in 1975. Tagged for missing citations (July
    2020); its only references are Aiki News issues.
