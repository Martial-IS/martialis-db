description:
  en: Japanese Wikipedia article on Soken Hohan (1891-1982 per this source), Okinawan karateka active
    before and after the war, founder of Shorin-ryu Matsumura Seito. Born 1891 in Gaja, Nishihara; his
    mother Kami was a granddaughter of Matsumura Sokon; studied tōde under his maternal uncle Nabe Tanmei
    from about age 12 until 1918, then learned Ryukyu kobudo from Komesu Ushi Tanmei of Iho beach, Nishihara.
    Performed at the 1924 Taisho Theater demonstration in Naha with Motobu Choyu and Kyan Chotoku; emigrated
    to Buenos Aires in 1924 (photographer, then cleaner); returned to Okinawa in 1952; named his style
    Shorin-ryu Matsumura Seito karate-do around 1956; Okinawa Karate-do Federation director 1959; co-founded
    the Okinawa Kobudo Association in June 1961 with Uehara Seikichi, Shimabuku Tatsuo, Shimabukuro Zenryo
    and others. Died November 30, 1982.
