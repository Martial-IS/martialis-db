description:
  en: Japanese Wikipedia article on Shimoe Hidetaro (1848-1904), Utsunomiya-domain samurai and
    Hokushin Ittō-ryū kenjutsu master, head (jukutō) of the Edo Genbukan dojo at 19, and
    kenjutsu instructor for the Keishichō and prefectural police. Covers his training under the
    Chiba family, his instruction at the Mito Tobukan (Monna Tadashi, Naitō Takaharu), and his
    1897 Seirensho.
