description:
  en: >-
    Japanese Wikipedia article on Jikishin Kage-ryū kenjutsu (formally Kashima Shinden Jikishin
    Kage-ryū). Covers the disputed foundership (Matsumoto/Sugimoto Bizen-no-kami the traditional
    first head; the name dating from the seventh head Yamada Mitsutoki, 1683), the early adoption
    of shinai and bogu uchi-komi training, the widest spread of any school in late-Edo Japan, the
    branches (Chōnaga-ha, Fujikawa-ha, Danno-ha, Otani-ha, and the Satsuma transmission Shin'ei-ryū),
    the five transmitted kata, and the Meiji masters including Sakakibara Kenkichi (Otani-ha). The
    history section is citation-flagged.
