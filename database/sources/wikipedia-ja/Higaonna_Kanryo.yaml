description:
  en: Japanese Wikipedia article on Higaonna Kanryo (1853-1915), called the restorer of Naha-te and a
    leading Tote master of the Meiji period. Born April 17, 1853 (lunar March 10, Kaei 6) in Naha Nishimura,
    fourth son of the Shin-shi Higaonna Kanyo and mother Makamado; Chinese name Shin Zenki. Studied tōde
    under Arakaki Seisho from about 1873 at age 20 (or 17). Later studied in Fuzhou under Ryu Ryu Ko (Lulukou),
    became his assistant instructor, and returned to Okinawa. Began teaching Naha-te at the Naha Commercial
    School in 1905. Died 1915.
