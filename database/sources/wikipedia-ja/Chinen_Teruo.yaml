description:
  en: Japanese Wikipedia article on Teruo Chinen (1941-2015), Goju-ryu karate master who founded the Jundokan
    International karate organization. Born in Kobe, Hyogo (the lead gives July 8, 1941 while the body
    gives June 8, 1941); father a Japanese Navy officer from Okinawa, grandfather a full-time te instructor,
    great-grandfather in the Yamane-ryu kobudo lineage. Began Goju-ryu training in 1954 under Eiichi Miyazato;
    promoted to black belt after about six years; joined Morio Higaonna at the Yoyogi Dojo in Tokyo in
    1959; went to Spokane, Washington in 1969 as technical advisor, promoted to 4th dan before departure;
    IOGKF technical advisor 1979-1986; founded Jundokan International in 1987; promoted to 7th dan by
    Miyazato around 1988; suffered undiagnosed diabetes from 1995.
