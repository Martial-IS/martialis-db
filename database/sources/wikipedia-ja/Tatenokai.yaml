description:
  en: Japanese Wikipedia article on the Tatenokai. Records its founding ceremony on 5 October 1968 at
    the Kokka Gijuku hall in Toranomon (offices successively in Ginza and Shinjuku), dissolution on 28
    February 1971, leadership under Mishima with Mochimaru Hiroshi and then Morita Masakatsu as student
    presidents, and - centrally for this database - its members' martial training about a hundred strong
    monthly experience-enlistments at Camp Takigahara with jukendo shodan testing, weekly karate for some
    ten core members under Nakayama Masatoshi from autumn 1968, and from May 1969 iai practice for the
    eight-man elite guard at the Itabashi police station dojo and the Imperial Palace Police's Saineikan,
    plus guerrilla-warfare lectures and street exercises led by Colonel Yamamoto Kiyokatsu of the GSDF
    Intelligence School.
