description:
  en: Japanese Wikipedia article on Kobayashi Hirokazu (小林裕和), covering his birth in Osaka Prefecture
    in 1929, his entry into the Aikikai Hombu Dojo in 1946, his return to Osaka in 1954, his appointment
    as Aikikai chief instructor in Kansai, his dan progression (6th dan 1962, 7th dan 1964, 8th dan 1970),
    his teaching in Europe from 1964, and his death by sepsis in 1998.
  ja: 小林裕和に関する日本語版ウィキペディア記事。1929年の大阪府での出生、1946年の合気会本部道場入門、1954年の大阪帰郷、関西における合気会指導者への就任、段位の推移（1962年六段、1964年七段、1970年八段）、1964年以降のヨーロッパでの指導、1998年の敗血症による死去を扱う。
