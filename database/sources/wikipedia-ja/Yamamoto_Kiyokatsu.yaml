description:
  en: Japanese Wikipedia article on Yamamoto Kiyokatsu (1919-2001), career army officer (major, Nakano
    School intelligence instructor) and postwar GSDF lieutenant general-rank officer at the Ground Self-
    Defense Force Intelligence School (Kodaira, Tokyo), where he helped create its psychological warfare
    defence course, served as education section chief from March 1967 and deputy commandant from July
    1969, retiring in February 1972. Known as the de facto instructor of Mishima's Tatenokai, leading
    their guerrilla-warfare lectures, street exercises and infiltration drills, and opposing the final
    coup plan. Lists his memoirs on Mishima, including Jieitai "Kage no Butai" (Kodansha, 2001).
