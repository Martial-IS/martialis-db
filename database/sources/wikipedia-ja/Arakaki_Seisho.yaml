description:
  en: 'Japanese Wikipedia article on Arakaki Seisho (1840-1920), Tote (karate) master of the late Ryukyu
    Kingdom and Meiji period and leading Naha-te master. Born 1840 in Higashi-wakasa-machi, Naha; nicknamed
    "Mayaa Arakaki" (Cat) or "Arakaki Guwa"; studied Tode under the Tei-shi Yabu Pechin (formerly Hokama);
    demonstrated the kata Jusanpo, Chishiyaukin and kumite at the 1867 celebration at the royal villa
    in Shuri; possibly accompanied the Shō Tai tribute mission to Beijing in 1867; Fumura Chikudon Pechin
    and Higaonna Kanryo are said to have studied under him. Note: gives death year 1920, differing from
    the EN Wikipedia 1918.'
