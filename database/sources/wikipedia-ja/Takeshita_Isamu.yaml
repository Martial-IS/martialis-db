description:
  en: Japanese Wikipedia article on Takeshita Isamu, covering his military career from 1890-1929, his
    1904 introduction of judo to the United States via President Theodore Roosevelt, his patronage and
    study of aikibudo under Morihei Ueshiba at the Kobukan, his 1935 aikibudo demonstration tour in North
    America, and his post-war roles including chairman of the Japan Sumo Association.
  ja: 竹下勇の日本語版ウィキペディア記事。1890年から1929年までの海軍生活、1904年のルーズベルト大統領への柔道伝授、 小布施道場での植芝盛平への合気柔術の師事、1935年の北アメリカ演示
    tour、戦後の日本相撲協会会長などを記載。
