description:
  en: Short Japanese Wikipedia stub on Takano Sakichirō (高野佐吉郎, imina Mitsumasa, 1803-1884), Takano Sasaburo's grandfather
    and first teacher. Gives his birth into the Horiuchi family of Onohara, Chichibu and adoption into the Takano family,
    entry to Nakanishi Shisei's itto-ryu dojo in Edo (with a list of fellow disciples), his menkyo kaiden, his studies
    under Yamaga Motoyoshi (military science) and Sakai Morimichi (Zen), and his return home as kenjutsu instructor to
    the Oshi domain with a dojo at Chichibu Shrine. The fuller account of his daijo-instructor role appears in the
    grandson's article, not here.
