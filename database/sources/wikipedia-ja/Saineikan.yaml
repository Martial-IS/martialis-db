description:
  en: Japanese Wikipedia article on the Saineikan, the budo hall inside the Tokyo Imperial Palace grounds.
    Records its original completion in September 1883 at Kiyoicho as an Imperial Household Ministry fencing
    and spear venue, transfer to the Imperial Palace Police in 1894, earthquake damage in 1923, and the
    current building completed December 1933 within the Otemon gate. Operated by the Imperial Palace Police
    (Kyucho) for kendo, judo and kyudo (the 'Sainei Sando'); Nakayama Hakudo served as one of its kendo
    instructors prewar; venue of imperial-review tournaments (tenran shiai). Address 1-3, Chiyoda, Chiyoda-ku,
    Tokyo.
