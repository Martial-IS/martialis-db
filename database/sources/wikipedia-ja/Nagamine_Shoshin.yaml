description:
  en: Japanese Wikipedia article on Nagamine Shoshin (1907-1997), Okinawan karateka, policeman, founder
    of Matsubayashi-ryu and karate historian. Born in Tomari, Naha; began karate at 17; studied under
    Ankichi Arakaki (a senior student of Kyan) from 19; graduated the Naha Commercial School in 1928 and
    joined the infantry (Jinan Incident); appointed policeman in 1931, studying under Kyan at Kadena Police
    Station; studied under Motobu Choki in Tokyo in 1936; awarded Renshi by the Dai Nippon Butokukai in
    1940 (with Higa Seko); created the "Fukyugata I" in 1941; first vice chairman of the Okinawa Karate-do
    Federation 1956, chairman 1961-1969; organized the World Matsubayashi-ryu Karate Federation 1977;
    Order of the Rising Sun, 5th class (1982); designated an Okinawa Prefecture Intangible Cultural Asset
    holder in 1997, the first in the Okinawan karate world; died of acute renal failure the same year.
