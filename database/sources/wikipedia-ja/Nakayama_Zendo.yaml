description:
  en: 'Japanese Wikipedia article on Nakayama Zendo (1900-1981), eldest son and designated successor of
    Nakayama

    Hakudo. Covers his birth as Nakayama Yoshimichi, his training at the Yushinkan dojo under his father
    in

    Shindo Munen-ryu kenjutsu, Muso Shinden-ryu iaido, and Shindo Muso-ryu jodo, his Butokukai ranks (Seirensho

    1925, Kyoshi in iaido and jodo 1927, Kyoshi in kendo 1929), his succession as the 8th headmaster of
    Shindo

    Munen-ryu after Hakudo''s death in 1958, his temporary retreat from the martial arts world during
    the

    war and post-war period, and his later interviews that formed the basis of the Nakayama Hakudo Kendo

    Kojutsushu. Includes external identifiers: ISNI 0000000381367172 and VIAF 260804040.

    '
