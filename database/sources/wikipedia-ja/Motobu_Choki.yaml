description:
  en: Japanese Wikipedia article on Motobu Choki (本部朝基, 1870-1944), Ryukyu Tode karateka and founder of
    Nihon Denryu Heiho Motobu Kenpo (Motobu-ryu). Gives the birth as Meiji 3, 4th month, 5th day (lunar)
    = May 5, 1870 (solar), third son of Motobu Aji Choshin in Shuri Akahira; childhood name Shinzaburo,
    nicknames "Saru Gomen" and "Motobu no Saru". Details the Motobu Udundi royal lineage (descendant of
    Sho Shitsu's sixth prince, Motobu Prince Chōhei); karate from age 12 under Itosu Anko with elder brother
    Choyu, then Matsumura Sokon and Sakuma Pechin, then Matsumora Kosaku (kumite); kake-dameshi at Tsuji;
    1921 move to Osaka; November 1922 victory over a foreign boxer in Kyoto at age 52, covered by King
    magazine (September 1925 issue, the first to sell over a million copies); 1923 Tode-jutsu Fukyukai
    in Osaka; 1926 first kumite book Okinawa Kenpo Tode Jutsu Kumite-hen (the Choki 12 yakusoku kumite);
    1927 move to Tokyo with the Daidokan dojo, Toyo University first shihan (1929), Otsuka Hironori became
    a student (1929); 1932 book Watashi no Todejutsu (Naihanchi photos); the Piston Horiguchi episode;
    kata repertoire (Naihanchi, Passai, Seisan, Channan, Hakugyoku); 1936-37 return to Okinawa; the October
    25, 1936 Roundtable of Karate Masters; 1941 final return to Okinawa; death April 1944; students including
    Marukawa Kenji, Nakata Mizuhiko, Takano Genjuro, Higashionna Hiroshi, Sodeyama Toyosaku, Ueshima Sannosuke,
    Miyahira Katsuya and Nakama Chomo; the style continued by his son Motobu Chosei.
