description:
  en: Japanese Wikipedia article on Yukio Mishima. Its chronology (drawn from the collected-works chronological
    tables, col. 42) gives the martial arts record in detail - bodybuilding from September 1955, boxing
    under Kojima Tomoo from September 1956, kendo from November 1958 at the Dai-ichi Seimei company dojo,
    kendo dan grades (shodan 23 Apr 1961, nidan 24 Mar 1963, sandan 22 Mar 1964, yondan 29 May 1966, godan
    11 Aug 1968), iai from November 1965 with formal entry into Omori-ryu iai under Funasaka Yoshio (shodan
    12 Feb 1967, nidan 14 Dec 1969), karate at the Japan Karate Association dojo under chief instructor
    Nakayama Masatoshi from July 1967 (shodan 17 Jun 1970), the January 1966 friendship match against
    Hashimoto Ryutaro, participation in the 1st World Kendo Championships on 5 April 1970, and Tatenokai
    training under JSDF instructor Yamamoto Kyokatsu.
  ja: 三島由紀夫の日本語版ウィキペディア記事。略年譜（決定版全集42巻年譜による）が武道歴を詳しく記す。1955年9月からのボディビル、1956年9月からの小島智雄監督下のボクシング、1958年11月からの第一生命道場での剣道（初段1961年・二段1963年・三段1964年・四段1966年・五段1968年）、1965年11月から始めた居合と舩坂良雄を師範とする大森流居合への入門（初段1967年・二段1969年）、1967年7月からの日本空手協会・中山正敏のもとでの空手（初段1970年）、1966年1月の橋本龍太郎との親善試合、1970年4月の第1回世界剣道選手権大会参加、自衛隊調査学校での山本舜勝による楯の会指導を扱う。
