description:
  en: 'Japanese Wikipedia article on Mochizuki Minoru, with a chronology: judo from 1912; kendo from 1918
    at the Bushukan dojo of Onaga Kuro (Rikishin-ryu); judo from Toku Sanpo in 1924; Gyokushin-ryu jujutsu
    and kirigami in 1925; Kodokan entry 1926; uchi-deshi to Mifune 1927; the Kobudo Kenkyukai and the
    Yushinkan of Nakayama Hakudo (iai) 1928; direct instruction from Kano 1929; 4th dan 1930, entry to
    Ueshiba and to Shimizu Takaji (Shindo Muso-ryu jo) 1930; Yoseikan dojo 1931; Mongolia 1938; kendo
    and jodo 5th dan 1956; judo 7th dan 1959; Paris cultural award 1960; moved to France 1999; death 2003.
    Note: the article gives the birth date as 11 April 1907, conflicting with the 7 April of the English
    Wikipedia and of Mochizuki''s own interviews; the article carries a ''no sources'' banner.'
  ja: ウィキペディア日本語版の望月稔の記事。年譜：1912年柔道を始める、1918年大長九郎（力信流）の道場・武修館で剣道、1924年徳三宝より柔道、1925年玉心流柔術を修行し切紙を授けられる、1926年講道館入門、1927年三船久蔵の内弟子、1928年古武道研究会参加と中山博道の有信館で居合、1929年嘉納治五郎の直接指導、1930年四段位、植芝盛平入門、清水隆次に入門し神道夢想流杖術、1931年養正館開設、1938年モンゴルへ、1956年剣道五段・杖道五段、1959年柔道七段、1999年フランスに移住、2003年死去。なお誕生日は4月11日としており、英語版や本人のインタビュー（4月7日）と食い違う。
