description:
  en: 'Japanese Wikipedia article on Gyokushin-ryu, recording the founder as Sasaki Goroemon (佐々木五郎衛門,
    also Sasaki Akiyori) of the Edo period, Mochizuki Minoru''s study of the school before opening Yoseikan
    Budo, and the warning that the Gyokushin-ryu kossōjutsu whose soke Hatsumi Masaaki claims, founded
    by Sasaki Sadaatsu of the Muromachi period, is a different school of the same name. References include
    the Bugei Ryuha Daijiten and Nihon Budoshi. Note: the article carries a ''no sources'' banner.'
  ja: ウィキペディア日本語版の玉心流の記事。江戸時代に佐々木暉頼（佐々木五郎衛門）が開いた柔術の流派であり、望月稔が当流を学んで養正館武道を開いたと記す。また、初見良昭が宗家を称する玉心流骨法術は室町時代の佐々木貞安を開祖とする同名別流であると警告する。参考文献：増補版・武芸流派大辞典、日本武道史。
