description:
  en: Japanese Wikipedia article on Nakayama Hakudo, the swordsman known as the 'God of Kendo', covering
    his origins in Ishikawa Prefecture, his training under Negishi Shingoro in Shindo Munen-ryu at the
    Yushinkan, his mastery of kendo, iaido and jodo as the first Sandō no Hanshi, the creation of Muso
    Shinden Ryu, and his influence on pre-war and post-war Japanese swordsmanship.
  ja: 中山博道の日本語版ウィキペディア記事。「剣道の神様」と呼ばれた剣客で、石川県出身、有信館で根岸信五郎の神道無念流を学び、剣道・居合道・杖道の三道の範士となり、夢想神伝流を創始し、戦前・戦後の日本剣道に大きな影響を与えた。
