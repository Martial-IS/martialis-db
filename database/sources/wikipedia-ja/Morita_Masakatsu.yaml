description:
  en: Japanese Wikipedia article on Morita Masakatsu (1945-1970), second student president of the Tatenokai,
    who died by seppuku alongside Mishima on 25 November 1970. Covers his birth in Yokkaichi, early orphaning,
    Catholic schooling at Kaisei, entry to Waseda University where he joined the karate club, his leadership
    of the right-wing student faction, his presence in the nine-man kesshitai (suicide squad) who learned
    iai on Mishima's instructions from May 1969 and were each given a nihonto, and his role in the Ichigaya
    incident.
