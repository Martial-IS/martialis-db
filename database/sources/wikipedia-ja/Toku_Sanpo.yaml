description:
  en: 'Japanese Wikipedia article on Toku Sanpo, covering his birth on Tokunoshima (Amagi-cho Kanekyu,
    Oshima district, Kagoshima), his real-name reading Toku Mitaka, the Kodokan 9th dan and Dai Nippon
    Butokukai judo kyoshi titles, his 1906 Kodokan entry following the advice of Samura Kaichiro, the
    ''Lone Cypress in the Field'' nickname and the rivalry with Mifune and Tabata, his refusal to practice
    ukemi, the 1912 Brazilian Navy incident and expulsion, the 1917 pardon and his teaching of Hayashi
    Iwazo and Ushijima Tatsukuma, the 1930/1932 All-Japan selection championships, and his death during
    the 1945-03-10 Tokyo air raid. Bibliography includes the book Judo Ichidai: Toku Sanpo (Ibusuki Eizo,
    Nanpo Shinsha, 2007).'
  ja: ウィキペディア日本語版の徳三宝の記事。徳之島（大島郡天城町兼久）出身、本名は「とく みたか」、講道館柔道九段・大日本武徳会柔道教士、佐村嘉一郎の勧めで上京し1906年講道館入門、野中の一本杉の異名、三船久蔵・田畑昇太郎との名勝負、受身を殆ど稽古しなかった逸話、1912年ブラジル艦隊の水兵15人を返り討ちにして破門、1917年破門を許され林岩三や牛島辰熊らを指導、1930年・1932年の全日本選士権、1945年3月10日東京大空襲で逝去。参考文献に『柔道一代
    徳三宝』（指宿英造著、南方新社、2007年）。
