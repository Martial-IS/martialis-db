description:
  en: >-
    Japanese Wikipedia article on Inoue Noriaki (1902-1994), founder of
    Shin'ei Taidō and nephew of Ueshiba Morihei. Covers his names, his judo
    study under Takagi Kiyoichi, the meeting with Takeda Sōkaku, Omoto and
    Deguchi Onisaburō, the renaming of his art, his death in Kunitachi, and a
    visit by Egami Shigeru. Tagged for missing citations (June 2020); lists
    Aiki News issues among its references but has no footnotes.
