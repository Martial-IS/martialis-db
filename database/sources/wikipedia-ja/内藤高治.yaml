description:
  en: Japanese Wikipedia article on Naitō Takaharu (1862-1929), Hokushin Ittō-ryū swordsman. Covers his
    Mito birth into the Ichige family, entry to the Tobukan at 12 under Kozawa Torakichi (kirigami at 14,
    mokuroku at 18), the 1881 adoption into the Naitō family, training at Sakakibara Kenkichi's dojo
    1883-1884, the Keishichō career from 1888, Seirenshō 1897, the Butokuden/Busen years from 1899, the
    1911 kendo kata committee, and his death in 1929. Carries a citation-needed tag (July 2020); footnotes
    cite Ono Kumao's 'The Swordsman Naitō Takaharu' (1930) and Domoto Akihiko's 'Meiji Gekken-ka'.
