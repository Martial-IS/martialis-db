description:
  en: Japanese Wikipedia article on Nakamura Hansuke (1845-1897), Ryōi Shintō-ryū jūjutsuka of the Tokyo
    Metropolitan Police. Records his birth in Kurume (Kōka 2-11-16), childhood training under Shimozaka
    Saizō, his 1883 appointment to the police jūjutsu staff with Uehara Shōgo, the 1886 bout with Tomita
    Tsunejirō, his ~1-hour draw with Yokoyama Sakujirō at the police martial arts tournament (dated here
    to October 1887, with referee Kudomi Tetsutarō and Superintendent-General Mishima Michitsune intervening),
    his nickname "Shōki no Hansuke", the sumō-banzuke-style jūjutsuka ranking placing him as eastern yokozuna,
    his role in composing the Keishichō jūjutsu kata, and his being the model for Murai Hansuke in Tomita
    Tsuneo's novel Sanshirō Sugata.
