description:
  en: Japanese Wikipedia article on Kiyoshi Nakakura. Covers his birth in Higashikushira in 1910, his
    training at the Daidokan Budo School and at the Yushinkan of Nakayama Hakudo, his career in the Imperial
    Guard, his 1932 adoption into the Ueshiba family as Morihiro Ueshiba, his kendo titles (Kyoshi 1939,
    8th dan 1959, Hanshi 1962, 9th dan 1978) and iaido grades (Hanshi 1978, 9th dan), his post-war career
    in Kagoshima, the 1964 Tokyo Olympics kendo demonstration, and the founding of the European Kendo
    Federation.
  ja: 中倉清の日本語版ウィキペディア記事。1910年の東串良での誕生、大道館武道専修学校と中山博道の有信館での修行、皇宮警察での勤務、1932年の植芝家への養子入り（植芝盛博）、剣道の称号（教士1939年、八段1959年、範士1962年、九段1978年）と居合道の段位（範士1978年、九段）、戦後の鹿児島での活動、1964年東京オリンピック剣道デモンストレーション、欧州剣道連盟の設立を扱う。
