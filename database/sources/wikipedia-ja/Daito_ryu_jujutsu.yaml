description:
  en: 'Japanese Wikipedia article on Daito-ryu jujutsu (大東流柔術), the school founded by Handa Yataro in
    Osaka in

    1878, distinct from the Daito-ryu Aiki-jujutsu lineage of Takeda Sokaku. Records his birth (1847,
    son of the

    Kishu domain retainer Taniguchi Toemon), his training in Sekiguchi Shinshin-ryu (Sekiguchi Ujitane,
    1860),

    Tenjin Shin''yo-ryu (Yamana Shinkuro) and Shibukawa-ryu (Takenaka Isamu), the 1876 move to Osaka and
    takeover of

    Yamana Shinjuro''s dojo, the 1878 founding of the Seibukan at Dojima-ura-cho, Kita-ku and of Daito-ryu
    jujutsu,

    and his students (Uyenishi Sadakazu 2nd dan, Miyake Taro 5th dan, Tani Yukio 2nd dan, Yamamoto Seizo
    4th dan,

    Sakata Danji 6th dan, Kimotsuki Soji who moved to the Kodokan, and Fushimi Tatsusaburo of Fusen-ryu
    who

    succeeded him). Also covers Tanabe Mataemon''s degeiko at the Seibukan and the visit of Jigoro Kano''s
    Kodokan

    students. Sources cited include the 日本現今人名辞典 (1900), Fukuoka Masami''s 月刊秘伝 article (2021) and

    Ueshiba Kishomaru''s 合気道真諦 (1986).

    '
  ja: '半田弥太郎が1878年に大阪で開いた柔術流派・大東流柔術（武田惣角系の大東流合気柔術とは別系）の日本語版ウィキペディア記事。

    半田の生誕（1847年、紀州藩士・谷口藤右衛門の子）、関口新心流（関口氏胤、1860年）・天神真楊流（山名新九郎）・澁川流

    （竹中勇）の修行、1876年の大阪移住と山名新十郎の道場継承、1878年の北区堂島裏町における盛武館開設と大東流柔術創始、

    門人（上西貞一二段・三宅多留次五段・谷幸雄二段・山本清蔵四段・坂田団次六段・講道館に移籍した肝付宗次・半田を継いだ

    不遷流の伏見辰三郎）を記録する。また盛武館への田辺又右衛門の出稽古や嘉納治五郎率いる講道館門弟の訪問にも言及する。

    '
