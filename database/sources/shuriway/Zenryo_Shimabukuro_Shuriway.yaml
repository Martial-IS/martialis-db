description:
  en: Shuriway biography of Zenryo Shimabukuro (1909-1969), 10th dan red belt, foremost disciple of Chotoku
    Kyan, who trained ten years as a private student under Kyan, taught from home after the war, built
    the Seibukan dojo in 1962, received the 10th dan red belt in 1964, was a founding member of the Chubu
    Shorin Ryu association, and died of appendicitis in 1969. Page notes it was originally provided by
    a third party.
