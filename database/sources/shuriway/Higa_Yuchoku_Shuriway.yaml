description:
  en: Shuriway biography of Yuchoku Higa (1910-1994), 10th dan Hanshi Shorin-ryu master and founder of
    the Kyudokan dojo. Covers his first master Jiro Shiroma (6 years of Shuri-te training), study under
    Jinnan Shinzato (Naha-te / Goju-ryu, disciple of Miyagi) and Seiei Miyahira after Shiroma's death
    in 1933, meeting Chibana Choshin in 1943 and becoming his main pupil, receiving the first Hanshi 9th
    dan conferred by Chibana (1965), founding the Kyudokan dojo (1947), serving as first vice-president
    of the Okinawa Shorin-ryu Karate-do Association (1961), and receiving Hanshi 10th dan in 1976.
