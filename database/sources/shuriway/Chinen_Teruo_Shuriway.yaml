description:
  en: Shuriway biography of Teruo Chinen (1941-2015) by Leonardo Pereira, president of Jundokan International
    in Portugal. Born June 8, 1941 in Kobe; family moved to Shuri at five and Naha at six; grandfather
    a Shorin-ryu instructor and father practiced bo, sai and nunchaku; influenced by the school next door,
    Chojun Miyagi's dojo. Began training in 1954 under Eiichi Miyazato at the Jundokan dojo; after five
    years left for Tokyo, joining Morio Higaonna in 1959; trained together five years and developed randori.
    In 1969 came to Spokane as technical advisor to the Spokane School of Karate; IOGKF technical advisor
    1973-1984; formed Jundokan International in 1984 in honor of his teacher Eiichi Miyazato.
