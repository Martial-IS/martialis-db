description:
  en: Shuriway biography of Seiko Higa (1898-1966). Born in Naha November 8, 1898; began training with
    Kanryo Higaonna at age 13 and after Higaonna's death in 1915 trained with Chojun Miyagi. Elementary
    school teacher for one year, then a policeman for ten years; left the force in 1931 and opened his
    own dojo in Naha. Taught in Saipan 1937-1939 (a date differing from the EN Wikipedia's 1935-1937).
    After WWII opened a new dojo in Itoman-cho and taught at a high school karate club, Ryukyu University
    and the Naha prison. Listed as "Headmaster" in a 1952 newspaper document by Miyagi; stepped in as
    Miyagi's temporary successor after his death. In 1956 became vice-chairman of the Okinawa Karatedo
    Federation, chairman four years later. In 1960 opened the Shodokan dojo in the Yogi district of Naha
    and created the International Karatedo and Kobudo Federation, serving as its first president until
    his death in 1966.
