description:
  en: October 1971 issue of Black Belt magazine. Page 44 records that in 1930, when Gichin Funakoshi was
    almost 60, he moved out of the Meishojuku and took up lodging with his youngest son Yoshitaka at a
    house in Koishikawa, and that 'his new base of teaching karate was set up a nearby Yushinkan, a kendo
    dojo belonging to Hakudo Nakayama, a well-known kendo master.'
