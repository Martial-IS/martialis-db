description:
  en: Article in Papeles Salmantinos de Educación (vol. 29, 2025, pp. 29-48) on the evolution of judo
    in Spain from its introduction in the late 1940s - Alfredo San Bartolomé in Madrid from 1947, Henri
    Birnbaum in Barcelona in 1950, the entry of judo into the Federación Española de Lucha in 1951 - to
    the constitution of the Federación Española de Judo in 1965 and the growth of licences and competition,
    with particular attention to the incorporation of women judoka.
