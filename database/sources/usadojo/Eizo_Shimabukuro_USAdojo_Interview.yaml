description:
  en: USAdojo interview (September 25, 1985) with Eizo Shimabukuro (1925-2017), younger brother of Isshin-ryu
    founder Tatsuo Shimabuku. States Eizo studied under the same masters as Tatsuo, including Chotoku
    Kyan, Choki Motobu, Chojun Miyagi and Shinken Taira, corroborating Tatsuo Shimabuku's teacher set;
    also covers Eizo's own Goju-ryu training under Chojun Miyagi from about 1939-1940.
