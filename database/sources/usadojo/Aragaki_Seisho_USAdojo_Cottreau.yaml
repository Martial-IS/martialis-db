description:
  en: USAdojo article by Travis Cottreau (Chito-ryu author) on Aragaki Seisho. Covers his Chikudon Peichin
    title, fluency in Chinese and 1870 petition to travel to Beijing, his Tote and weapons mastery (Arakaki-no-kun,
    Arakaki-no-sai, Sesoku-no-kun), and that the only Chinese master associated with him is Wai Xinxian
    (or Wai Shinzan) of Fuzhou. Mentions his interruption of instruction of the young Higashionna Kanryo.
