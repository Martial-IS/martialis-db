description:
  en: 'Shoshin Nagamine''s own autobiography, first published in the commemorative journal for the 55th
    anniversary of Matsubayashi-ryu''s founding and his 85th birthday, hosted on the WMKA site. Primary
    source: born July 15, 1907 in Tomari-son, Naha; karate from 1926 at 17 under neighbor Chojin Kuba;
    nightly training at Tomari Primary School under old master Kotatsu Iha; from March 1928 disciple of
    Taro Shimabukuro, then under Ankichi Arakaki; conscription 1928 (47th Infantry, Jinan Incident); policeman
    1931; "second teacher" Chotoku Kyan at Kadena Police Station from December 1931 through August 1936;
    Motobu Choki in Tokyo (April-October 1936, Hongo ward); Renshi title May 1940 from the Dai Nippon
    Butokukai (on the recommendation of Chojun Miyagi); kendo from 1938 (sandan 1941); surrender in 1945;
    police marshal of Naha 1946.'
