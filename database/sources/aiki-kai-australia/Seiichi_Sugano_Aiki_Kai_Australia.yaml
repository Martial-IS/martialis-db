description:
  en: Biography of Seiichi Sugano published by Aiki Kai Australia, the organization he founded, covering
    his birth in Otaru, his training as uchi-deshi under Morihei Ueshiba, his appointment in 1965 to introduce
    aikido to Australia, his teaching in Europe and New York, his 2003 amputation, and his legacy through
    the Aikido Foundation.
