description:
  en: Interview with Portuguese aikido master Professor Luís Antunes, conducted by Pedro Escudeiro on
    31 October 2000 for the Surya publication. Covers his start in aikido in 1970 with Hirokazu Kobayashi
    in Castel-Jaloux, his later training under Nobuyoshi Tamura, the founding of the first Aikikai-only
    dojo in Portugal (GDINE, 1980) and the Associação Desportiva Aikikai de Portugal, and his presidency
    of the Federação Portuguesa de Aikido.
  pt: Entrevista ao Mestre de Aikido Professor Luís Antunes, conduzida por Pedro Escudeiro a 31 de outubro
    de 2000 para a publicação Surya. Abrange o início da sua prática em 1970 com Hirokazu Kobayashi em
    Castel-Jaloux, o seu treino posterior sob Nobuyoshi Tamura, a fundação do primeiro dojo exclusivamente
    Aikikai em Portugal (GDINE, 1980) e da Associação Desportiva Aikikai de Portugal, e a sua presidência
    da Federação Portuguesa de Aikido.
