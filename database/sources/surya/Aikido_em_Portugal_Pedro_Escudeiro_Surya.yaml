description:
  en: Introduction and biography page of the "Aikido em Portugal" history project by Pedro Escudeiro,
    published in the Surya magazine of the Centro de Artes Orientais. Escudeiro recounts starting aikido
    in January 1983 at age 11 at the Aiki-Shuren Dojo de Portugal, his 1998 editorship of the school newspaper
    Yamabushi, and the origins of his interview series on the history of aikido in Portugal.
  pt: Página de introdução e biografia do projeto "Aikido em Portugal" de Pedro Escudeiro, publicada na
    revista Surya do Centro de Artes Orientais. Escudeiro relata o início da prática de Aikido em janeiro
    de 1983 aos 11 anos no Aiki-Shuren Dojo de Portugal, a direção do jornal da escola Yamabushi em 1998
    e a origem da sua série de entrevistas sobre a história do Aikido em Portugal.
