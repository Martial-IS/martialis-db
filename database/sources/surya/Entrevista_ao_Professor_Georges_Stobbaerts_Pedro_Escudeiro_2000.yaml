description:
  en: 'Interview with Georges Stobbaerts conducted by Pedro Escudeiro for the Surya publication of the
    Centro de Artes Orientais. Covers his martial arts career in Belgium, Morocco and Portugal: his early
    dojos (Aachen 1958, Liège 1959), the founding of the Budo Club du Maroc in Casablanca, the introduction
    of aikido to Portugal through his student Daniel Laurent, the first international aikido seminar in
    Bucelas in 1968, his uchi-deshi training under Kiyoshi Nakakura in kendo and iaido, his judo master
    Kenshiro Abe, the influences of Tadashi Abe and Aritoshi Murashige, and his 8th dan in aikido from
    the Dai Nippon Butoku Kai.'
  pt: 'Entrevista a Georges Stobbaerts conduzida por Pedro Escudeiro para a publicação Surya do Centro
    de Artes Orientais. Abrange o seu percurso nas artes marciais na Bélgica, em Marrocos e em Portugal:
    os seus primeiros dojos (Aachen 1958, Liège 1959), a fundação do Budo Club du Maroc em Casablanca,
    a introdução do Aikido em Portugal através do seu aluno Daniel Laurent, o primeiro estágio internacional
    de Aikido em Bucelas em 1968, a sua formação como uchideshi de Kiyoshi Nakakura em Kendo e Iaido,
    o seu mestre de Judo Kenshiro Abe, as influências de Tadashi Abe e Aritoshi Murashige, e o seu 8º
    dan de Aikido da Dai Nippon Butoku Kai.'
