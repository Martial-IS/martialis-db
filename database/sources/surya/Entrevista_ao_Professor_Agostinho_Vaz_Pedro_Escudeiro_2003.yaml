description:
  en: Interview with Agostinho Vaz conducted by Pedro Escudeiro on 16 December 2003 for the Surya publication
    of the Centro de Artes Orientais. Vaz, then president of the Federação Portuguesa de Aikido and a
    3rd dan, recounts his path from judo (1969-1974) to aikido from 1977 in Almada under Katsumi Motomura
    and then Toshio Kawakami of the Shiseikai association, his main references Nobuyoshi Tamura (since
    1986) and Seiichi Sugano (visiting since 1996), and his teaching in Almada since 1985.
  pt: Entrevista a Agostinho Vaz conduzida por Pedro Escudeiro a 16 de dezembro de 2003 para a publicação
    Surya do Centro de Artes Orientais. Vaz, então presidente da Federação Portuguesa de Aikido e 3º dan,
    relata o seu percurso do judo (1969-1974) ao aikido desde 1977 em Almada sob Katsumi Motomura e depois
    Toshio Kawakami da associação Shiseikai, as suas principais referências Nobuyoshi Tamura (desde 1986)
    e Seiichi Sugano (a visitar desde 1996), e o seu ensino em Almada desde 1985.
