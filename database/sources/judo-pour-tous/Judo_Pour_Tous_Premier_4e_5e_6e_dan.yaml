description:
  en: 'Judo Pour Tous page recounting the grade history of Jean de Herdt, quoting his own account from
    Claude Thibault''s Les Pionniers du Judo Français (pp. 356, 360-361): the Kodokan experts proposed
    the 6th dan in December 1951 and de Herdt refused it in agreement with Kawaishi; he officially received
    the 4th dan remitted by Risei Kano; Kawaishi declared his 5th and 6th dan would require no further
    examination; he passed the 5th dan in June 1956 under Kawaishi; and his 6th dan was never signed because
    Kawaishi was already ill. The page is part of the Judo Pour Tous site run by Carl De Crée.'
