description:
  en: Autobiographical presentation page for Carl De Crée on the Judo Pour Tous site, recording that he
    earned his black belt at 16 under his principal teacher Felix De Smedt (1923-2012), founder of the
    Bushido-Kwai Mechelen academy, that he was technically inspired by Marcel Clause (1927-2004) and completed
    his judo kata studies with him between 1978 and 1992, that he followed advanced stages under Hirano
    Tokio and in 2005-2008 studied kata with Fukuda Keiko in San Francisco, that he trained jujutsu under
    Tobari Kazu, Kurimura Yoji and Okano Isao in Japan, and that he holds 8th dan judo, 6th dan jujutsu
    (moderne), and a Kyokushinkai black belt.
