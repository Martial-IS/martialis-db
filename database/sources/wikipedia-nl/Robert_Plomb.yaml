description:
  en: Dutch Wikipedia biography of Robert Plomb, pioneer of Belgian judo and founder of the Royal Judo
    Club de Mons; records that he first encountered judo in 1944 while stationed in Aldershot, England,
    founded the Club Sportif de la Police Judiciaire in 1948, obtained his 1st dan in 1952 (examined by
    Jean de Herdt), and later 6th dan (1982, jury chaired by Abe Ichiro), 7th dan (1992), 8th dan (2000)
    and 9th dan (2012). Notes Marcel Clause among his pupils.
