description:
  en: Dutch Wikipedia article on Gerhard Frederik Marinus Schutte ("opa Schutte"), Bloemendaal dentist
    and judoka (Haarlem, 10 May 1901 - 17 July 1978). Came to judo at age 46 shortly after the Second
    World War, his first teacher being judo pioneer Jaap Nauwelaerts de Agé. Founded a judo school in
    Haarlem in 1948 (Kenamju) and the Nederlandse Amateur Judo Associatie (NAJA) in 1950, later merged
    into the Judo Bond Nederland. Cites two Black Belt magazine articles by J.D. Schilder (1967, 1970).
