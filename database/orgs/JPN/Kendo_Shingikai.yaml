description:
  en: Consulting body to the Ministry of Education, established in 1938 to argue the case for wider sponsorship of kendo in education and the community. Its 1938 petition held that final victory in modern war is won by soldiers fighting with the sword.
notes: Bennett names Naitō Takaharu among the 1938 founders, but Naitō died in April 1929; not recorded here. The seven signatories of its 1938 petition are participants of the petition Event; Bennett does not state that they were members.
hasEvidence:
  - basedOnSource: 01M2WGNYAW6K10EEMQDG8VYGVG
    quotation: the Kendo Deliberation Council petition of 1938 stated that, although modern warfare is fought with “science and technology,” final victory is attained only by soldiers “facing the enemy front on, and stabbing and cutting them.”
