description:
  en: The Aikido Senshu Buikukai is an Aikikai-recognized aikido organization founded in 1990 as the Senshu Aikido Association (泉州合気道協会) by the late Honda Doshū (7th dan), renamed Aikido Senshu Buikukai and active across five cities and one town in the Senshu region of southern Osaka. Its representative instructor is Egawa Kunio, vice-chairman of the Aikido Osaka Buikukai.
  pt: O Aikido Senshu Buikukai é uma organização de Aikido reconhecida pela Aikikai fundada em 1990 como Associação Senshu de Aikido (泉州合気道協会) pelo falecido Honda Doshū (7º dan), renomeada Aikido Senshu Buikukai e ativa em cinco cidades e uma vila na região Senshu do sul de Osaka. O seu instrutor representante é Egawa Kunio, vice-presidente do Aikido Osaka Buikukai.
