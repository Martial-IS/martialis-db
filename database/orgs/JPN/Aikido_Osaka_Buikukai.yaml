description:
  en: The Aikido Osaka Buikukai is an Aikikai-registered aikido organization founded in 1960 by Kobayashi Hirokazu, the root of the Buikukai network in the Osaka region. It currently comprises about 50 dojo and 20 school aikido clubs in Osaka Prefecture, with Kimura Jiro (8th dan Aikikai) as president and chief instructor.
  pt: O Aikido Osaka Buikukai é uma organização de Aikido registada na Aikikai fundada em 1960 por Kobayashi Hirokazu, a raiz da rede Buikukai na região de Osaka. Atualmente compreende cerca de 50 dojos e 20 clubes escolares de Aikido na província de Osaka, com Kimura Jiro (8º dan Aikikai) como presidente e instrutor-chefe.
