description:
  en: Private militia of about a hundred right-wing students founded by Yukio Mishima on 5 October 1968 (developing out of his earlier "National Guard" scheme), funded entirely from his writing royalties. Although political in purpose, its daily life was heavily martial. Members qualified through one-month GSDF experience-enlistments - chiefly at Camp Takigahara, Fuji School, including jukendo shodan testing - attended weekly karate sessions for some ten core members under Nakayama Masatoshi at the Japan Karate Association from autumn 1968, and from May 1969 an eight-man elite guard ("kesshitai", each given a nihonto) learned iai at the Itabashi police station dojo and the Imperial Palace Police's Saineikan. Guerrilla-warfare lectures, street exercises and infiltration drills were led by Colonel Yamamoto Kiyokatsu of the GSDF Intelligence School. Offices were first in Ginza (Kojaji Building), then Shinjuku. The society effectively ended with Mishima's seppuku at Camp Ichigaya on 25 November 1970 and was formally disbanded on 28 February 1971.
