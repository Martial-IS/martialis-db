description:
  en: Organization founded by Koichi Tohei in 1971, known in English as the Ki Society, promoting Shin Shin Toitsu Aikido (Ki Aikido), the style of aikido based on Tohei's teaching of mind-body coordination. Tohei founded it while still chief instructor of the Aikikai Hombu Dojo and split from the Aikikai in 1974. The teaching later split into several federations, including the Ki Society under Tohei and later his son Shin'ichi Tohei.
  ja: 藤平光一が1971年に創設した組織。英語ではKi Societyと呼ばれ、心身統一合氣道（氣の合氣道）を普及する。合気会本部師範在任中に創設し、1974年に合気会から分派した。後に複数の連盟に分裂し、Ki Societyは藤平光一の後を子の藤平信一が継いだ。
