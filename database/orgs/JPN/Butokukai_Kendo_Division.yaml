description:
  en: The Dai Nippon Butokukai's standing kendo division, with its own president. Kimura Tokutarō led it from 1942 until Japan's 1945 surrender, and Nakayama Hakudō briefly headed it in early 1946, months before the Butokukai's dissolution.
