description:
  en: The All Japan Judo Federation (全日本柔道連盟, Zen Nihon Jūdō Renmei) is the national governing body of judo in Japan, founded on 6 May 1949 with Risei Kano, head of the Kodokan, as its first president. It joined the International Judo Federation in 1952, and its presidents also led the Kodokan, reflecting the close institutional link between the two bodies.
