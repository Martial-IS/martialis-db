notes: >-
  Tsuji Shinpei's Shingitō-ryū attribution comes from the JA wiki, not from Bennett, and that style has no record here. Bennett also describes an earlier, separate 1906 Butokukai kata committee chaired by Watanabe Noboru.
description:
  en: Committee constituted by the Dai Nippon Butokukai to develop a standardized set of kenjutsu kata for school dissemination. Produced the ten-form Dai-Nippon Teikoku Kenjutsu Kata (大日本帝国剣道形), ratified by the Butokukai on 16 October 1912. Preceded the 1906 Butokukai Seitei Kenjutsu Kata (3 kata) and succeeded it.
