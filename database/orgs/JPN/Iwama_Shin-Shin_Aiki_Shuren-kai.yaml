description:
  en: Traditional Iwama-style aikido organization founded in February 2004 by Saito Hitohiro (Hitohira) after his separation from the Aikikai, preserving and disseminating the techniques of the Founder Morihei Ueshiba as taught at Iwama. It has affiliated dojo in about 20 countries.
  pt: Organização de Aikido tradicional de estilo Iwama fundada em fevereiro de 2004 por Saito Hitohiro (Hitohira) após a sua separação do Aikikai, preservando e divulgando as técnicas do Fundador Morihei Ueshiba tal como ensinadas em Iwama. Tem dojos afiliados em cerca de 20 países.
