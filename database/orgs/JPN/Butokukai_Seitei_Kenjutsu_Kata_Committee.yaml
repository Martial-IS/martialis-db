description:
  en: First Dai Nippon Butokukai committee to standardise kenjutsu kata for schools, chaired by Watanabe Noboru. Seven kenjutsu experts holding the title of hanshi were appointed on 7 May 1906, joined in July by seven younger experts holding kyōshi. It produced the three-form Dai-Nippon Butokukai Seitei Kenjutsu Kata, presented to the Butokukai president on 13 August 1906 and poorly received. The ten-form Dai-Nippon Teikoku Kenjutsu Kata of 1911-12 superseded it.
notes: Twelve of the fourteen members are unidentified; Bennett names only Watanabe and Negishi.
hasEvidence:
  - basedOnSource: 01M2WGNYAW6K10EEMQDG8VYGVG
    quotation: 'The committee had crafted a set of kata they called the Dai-Nippon Butokukai Seitei Kenjutsu Kata. It was comprised of three forms: jōdan (heaven), chūdan (earth), and gedan (man).'
    informationType: infotype:secondary
    supports: true
    evidenceType: evidencetype:direct
