description:
  en: 'The Shotokan Karate-Do International Federation (SKIF) is the international Shotokan karate organization founded by Hirokazu Kanazawa in 1978 after he left the Japan Karate Association (JKA). Headquartered in Tokyo, SKIF grew into one of the largest Shotokan organizations, with branches across Europe, the Americas, Africa, and Asia. Note: SKIF''s own materials date its founding to 1978, while some secondary sources state 1977.

'
