description:
  en: >-
    The Greater Japan Martial Virtue Society, the largest martial arts organization in Japan before the Second World War, established in Kyoto on 1895-04-17; its first president was Imperial Prince Komatsunomiya Akihito. By the 1930s it had been turned from a public into a private organization and had lost its authority to govern all martial arts organizations in Japan. The GHQ dissolved it in 1946, and more than 1,300 of its leaders were purged in the following years.
  ja: >-
    1895年（明治28年）4月17日、京都に設立された戦前日本最大の武道団体。初代会長は小松宮彰仁親王。1930年代には 公的機関から民間団体となり、武道界全体を統轄する権限を失った。1946年にGHQにより解散され、1,300人以上の 幹部が公職追放となった。
