description:
  en: >-
    Okinawan study group of the 1920s dedicated to preserving and promoting karate, in which masters of
    the so-called Naha-te, Shuri-te and Tomari-te lines, and the White Crane teacher Wu Xiangui, trained
    and shared their methods; it lasted until 1930.
notes: >-
  Cramer's member list (pp. 56–57) also names Chojo Oshiro and Moden Yabiku (no records yet). His photo
  caption (p. 55) shows Shinpan Shiroma, Choryo Maeshiro, Choshin Chibana and Genwa Nakasone with
  Kyan, Yabu, Hanashiro and Miyagi.
