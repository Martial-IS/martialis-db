description:
  en: Kenjutsu and kendo school headed by Takano Sasaburō, renamed in 1891 from the Meishinsha run by his grandfather Takano Sakichirō. Operated a headquarters dojo at Urawa and a network of branch dojo (bunkan) across Saitama, Chiba, Gunma, Kanagawa, Ibaraki and Tokyo. Its Chichibu hall, the Meishin Honkan, was designated a Chichibu City historic site in 1965.
notes: Sugie (1976) dates the Meishinsha to Meishinkan renaming to 1891, while kenshi247 has Takano building the Urawa Meishinkan in 1890 and gives two competing build dates, 1888 and 1890. The 1891 date follows the peer-reviewed account. Whether this was a founding or a renaming is unsettled.
