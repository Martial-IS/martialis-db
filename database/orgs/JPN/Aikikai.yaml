description:
  en: The Aikikai is the original school of aikido, centered on the Aikikai Foundation in Tokyo and headed by the Dōshu, the family heir of the founder Morihei Ueshiba. It operates the Hombu dojo (Aikido World Headquarters) and issues certificates of grading and instructor titles throughout the world, and also manages the historical Iwama dojo in Ibaraki as a satellite.
  pt: O Aikikai é a escola original de Aikido, centrada na Fundação Aikikai em Tóquio e liderada pelo Dōshu, o herdeiro familiar do fundador Morihei Ueshiba. Opera o Hombu dojo (Aikido World Headquarters) e emite certificados de graduação e títulos de instrutor em todo o mundo, gerindo também o histórico dojo de Iwama em Ibaraki como filial.
