description:
  en: 'The Japan Karate Association (JKA) is one of the oldest global Shotokan karate organizations. Established in 1949 by senior students of Gichin Funakoshi, with Nakayama Masatoshi as chief instructor, the JKA emerged from karate clubs at Tokyo universities. It is the parent body from which the Shotokan Karate-Do International Federation (SKIF), founded by Hirokazu Kanazawa after leaving the JKA, and many other splinter organizations derive.

'
