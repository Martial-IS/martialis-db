description:
  'no': Det nasjonale judoforbundet i Norge, stiftet 28. juni 1967 under et treningsleir. Henrik Lundh var blant initiativtakerne men takket nei til å bli forbundets første president. Vervet gikk til Torkel Sauer. Lundh satt aldri i forbundsstyret. Forbundet ble senere medlem av European Judo Union og International Judo Federation.
