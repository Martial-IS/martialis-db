description:
  'no': Den første judoklubben i Norge, stiftet på konstituerende generalforsamling i Idrettens Hus, den gamle Turnhallen i St. Olavs gate, med 31 personer til stede. Henrik Lundh ble klubbens første formann. Torkel Sauer og Olav Knutsen regnes som medstiftere. NJJK er den eldste judoklubben i Norge og er fortsatt i virksomhet. Klubben tilbød kun trening for gutter og menn de første årene.
