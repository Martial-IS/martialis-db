description:
  en: >-
    German fencing guild of the Brotherhood of Saint Mark, from fifteenth-century Nuremberg and later
    based in Frankfurt, where it met yearly, elected its captain (Hauptmann) and examined candidates for
    the title of master of the longsword. Emperor Frederick III granted it the monopoly of that title in
    1487. It taught longsword, rapier, dussack, staff and polearms, and rivalled the Federfechter.
notes: >-
  en Wikipedia says Hans Talhoffer may have co-founded it; Wiktenauer notes there is no record of the
  guild before 1474. No founder recorded.
