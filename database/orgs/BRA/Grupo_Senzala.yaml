description:
  en: >-
    Capoeira group started in Rio de Janeiro after 1964 by middle-class young men around the Flores
    brothers, building on what Mestre Bimba had taught them. It won the Berimbau de Ouro tournament
    in 1967-1969 and its training methods, graduation system and style became a model for many
    groups; in 1974 it split into academies led by its red-belt teachers.
notes: >-
  It had no regular mestre (Assunção, p. 170). Camisa Roxa trained its members in 1966. Groups
  founded by former members: Abadá (Camisa), Capoeira Brasil (Boneco, Paulão, Paulinho Sabiá), Jelon
  Vieira's group in the United States (p. 172).
hasEvidence:
  - basedOnSource: 01M6A208ZNPSHKF5VJ6T8GGKH5
    quotation: >-
      In 1974, Senzala fragmented into individual academies directed by the senior teachers who had
      been awarded the red belt, but they still maintained an overall link between each group.
    locator: '172'
    locatorLabel: page
    informationType: infotype:secondary
    supports: true
