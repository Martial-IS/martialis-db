description:
  en: >-
    Jiu-jitsu federation of Rio de Janeiro, founded in 1967 as the Guanabara Federation; its 1967 manual
    and rules (reshaped in 1975) set jiu-jitsu apart from judo. Hélio Gracie and later Robson Gracie
    presided over it.
