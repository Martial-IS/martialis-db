description:
  en: >-
    South Korea's national taekwondo association, formed in 1959 when the kwan unified under Choi Hong-hi.
    Hwang Kee was the first to split from it. After the 1961 coup it was renamed Korea Taesudo Association,
    and took back the name Korea Taekwondo Association in 1965.
notes: >-
  Mönig's note 53 (p. 96) says "The Korea Taekwondo Federation (KTA) was founded in 1965", against his own
  p. 60 and Green & Svinth's 1959; 1965 is the year the taekwondo name came back.
