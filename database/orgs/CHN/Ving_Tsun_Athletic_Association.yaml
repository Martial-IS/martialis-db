description:
  en: >-
    Association of Ip Man's Wing Chun line in Hong Kong. Planned from 1964 and ratified in 1967 with
    Ip Man as president, it was the first private traditional martial arts association registered
    with and recognised by the Hong Kong government.
notes: >-
  Judkins and Nielson pp. 259-261. First secretary: Lee Man (no record). Police inspector Tang
  Sang took a leading role early on; Ip Man walked out with the instructors after a dispute over
  his monthly pay, and they returned after Tang Sang left Hong Kong in 1974 (pp. 260-261).
