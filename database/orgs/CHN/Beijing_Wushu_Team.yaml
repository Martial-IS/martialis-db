description:
  en: Professional wushu team based in Beijing, founded in November 1974 by Wu Bin and Li Junfeng. Predecessor was the Beijing Wushu School (1959). Won the national team championship 11 times, including an unprecedented 10-year consecutive winning streak (1975-1985). Notable athletes include Jet Li (five consecutive national championships), Donnie Yen, Wu Jing, and Hao Zhihua. Based at the Shichahai Sports School. Still active as of 2025.
