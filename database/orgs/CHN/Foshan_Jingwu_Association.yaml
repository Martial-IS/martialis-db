description:
  en: >-
    Foshan branch of the Jingwu Athletic Association, founded in 1920. From 1923 to 1937 it ran
    schools and placed martial arts coaches across the town; the Japanese used its new building as a
    granary.
notes: >-
  Judkins and Nielson pp. 138-147, 183, 200, 229. Jiu Wan taught Wing Chun in its building in
  1945-1949, probably renting the space (p. 229). A northern Praying Mantis master linked to it
  challenged Foshan's teachers in the 1920s; Ip Man fought him (p. 183).
