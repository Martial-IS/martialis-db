description:
  en: >-
    Choy Li Fut school in Foshan, reopened by Jeong Yim in 1867 at 15 Ya Bang Street. By 1920 it had
    thirteen branches and about 3,000 members; it backed the labour movement and the Communist
    Party, and the Nationalists suppressed it in 1927.
notes: >-
  Judkins and Nielson pp. 96-99, 105, 116-119, 175, 201. Closed after the Boxer Uprising (1900 on
  p. 105, 1901 on p. 175) and reopened c. 1905. Some members fought the Japanese from 1937; the
  original association had essentially ceased to exist in mainland China by the middle of WWII,
  and efforts to rebuild after 1945 failed (p. 119). An earlier Foshan branch of Chan Heung's
  network (c. 1848) closed in the Red Turban Revolt (p. 95); the book does not say it bore the
  Hung Sing name. The year of suppression (1927) is from the surrounding narrative of the April
  1927 purge.
