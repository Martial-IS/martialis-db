description:
  en: Governing body of wushu in China, founded in September 1958. Also known as the Wushu Administrative Center of the General Administration of Sport of China. Responsible for the development and standardization of modern wushu and sanda throughout China. Recognized by the International Wushu Federation (IWUF). Part of the General Administration of Sport of China, All-China Sports Federation, and Chinese Olympic Committee. Headquartered in Beijing.
