description:
  en: Municipal-level wushu sports association in Beijing, founded in 1962. One of the first provincial-level wushu associations established after the founding of the People's Republic. Organizes wushu competitions, training, and international exchange in the Beijing area. Currently led by President Lu Xuefeng (2025-present). Has 64 specialized committees, 21 working committees, and 93 member units. Notable officers include Vice Chairman Chang Zhenfang (from 1962) and Special Advisor Wu Bin.
notes: Attested from 1960 (officer claim, 1960年任北京市武术协会副主席); Baidu Baike gives its registration as
  a social organization on 1992-08-31. No source found for the original founding date.
