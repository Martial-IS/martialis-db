description:
  en: >-
    Foshan martial arts association formed in the early 1930s from the network of 'Yi' schools.
    Backed by the yellow trade unions and local Nationalist officers, it taught Hung Gar and Wing
    Chun in about a dozen branches; the Japanese closed it and it reopened after 1945.
notes: >-
  Judkins and Nielson pp. 116-124, 183, 191-195, 204-206. Wing Chun instructors: Jiu Chao after
  1945 (Kuai Zi Lane branch); possibly Cheung Bo (the 'Hui Yi' school, p. 195). Ip Man met Pan Nam
  at one of its branches in 1949 (p. 206). Instructor roles need Place records; not recorded.
