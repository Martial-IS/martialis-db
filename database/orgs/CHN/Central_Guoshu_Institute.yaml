description:
  en: >-
    National martial arts institution of the Nationalist government, launched in Nanjing in 1928
    under Zhang Zhijiang as the Guoshu Research Academy and renamed later that year. It ran the
    National Guoshu Exams of 1928 and 1933 and sought to standardise the Chinese martial arts.
notes: >-
  Judkins and Nielson pp. 148-163. Zhang Zhijiang (1882-1966) has no record. The Chinese name
  中央國術館 is the common one; the book's glossary gives 國術研究館 (Guoshu Yanjiuguan) for the 1928 name.
  Existing records (Chang Zhenfang, Wang Ziping, Zhang Wenguang) mention it in text only.
