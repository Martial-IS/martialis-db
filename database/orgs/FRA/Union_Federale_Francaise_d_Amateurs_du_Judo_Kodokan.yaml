description:
  en: 'The federation of the Kodokan-tendance in French judo (the Shudokan Club and the followers of Ichiro Abe''s Kodokan method, opposed to the Méthode Kawaishi of the FFJJ). Founded on 8 October 1954 as the Union fédérale française d''amateurs du judo Kodokan (UAK), renamed Fédération française des amateurs des techniques Kodokan (FATK) in early 1955, and unified with the FFJJ on 29 February 1956 to form the FFJDA. At unification it counted roughly 150 clubs and 5,000-6,000 registered members against the FFJJ''s 800 clubs and 25,000 members.

'
  fr: 'La fédération de la « tendance Kodokan » du judo français (le Shudokan Club et les adeptes de la méthode Kodokan d''Ichiro Abe, opposés à la méthode Kawaishi de la FFJJ). Fondée le 8 octobre 1954 sous le nom d''Union fédérale française d''amateurs du judo Kodokan (UAK), renommée Fédération française des amateurs des techniques Kodokan (FATK) début 1955, elle s''est unie à la FFJJ le 29 février 1956 pour former la FFJDA. Au moment de l''unification, elle comptait environ 150 clubs et 5 000 à 6 000 membres, contre 800 clubs et 25 000 membres du côté de la FFJJ.

'
hasEvidence:
