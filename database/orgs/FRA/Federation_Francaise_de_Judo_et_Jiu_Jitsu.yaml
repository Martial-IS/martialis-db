description:
  en: The Fédération française de judo et de jiu-jitsu (FFJJ), created on 5 December 1946, was the French judo federation. Its first president was Paul Bonét-Maury (1946-1956); the presidency was held by French nationals, while Japanese master Mikinosuke Kawaishi served as its technical director from his return to France in 1948. Jean de Herdt passed his 5th dan under Kawaishi's direction in June 1956 within this federation. The FFJJ unified with the Kodokan-tendance federation (UAK/FATK) under the agreement of 29 February 1956 to form the Fédération française de judo et disciplines associées (FFJDA) and ceased to exist as a separate body.
  fr: La Fédération française de judo et de jiu-jitsu (FFJJ), créée le 5 décembre 1946, était la fédération française de judo. Son premier président fut Paul Bonét-Maury (1946-1956) ; la présidence revenait à des ressortissants français, tandis que le maître japonais Mikinosuke Kawaishi en assurait la direction technique à compter de son retour en France en 1948. Jean de Herdt y passa son 5e dan sous la direction de Kawaishi en juin 1956. La FFJJ s'est unie à la fédération « tendance Kodokan » (UAK/FATK) par l'accord du 29 février 1956 pour former la Fédération française de judo et disciplines associées (FFJDA) et a cessé d'exister en tant qu'entité distincte.
