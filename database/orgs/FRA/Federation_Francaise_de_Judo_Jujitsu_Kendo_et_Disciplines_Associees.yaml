description:
  en: 'The Fédération française de judo, jujitsu, kendo et disciplines associées (FFJDA, "France Judo"), the current French judo federation, established in 1956 through the unification of the Fédération française de judo et de jiu-jitsu (FFJJ) and the Kodokan-tendance federation UAK/FATK, under an agreement concluded on 29 February 1956 with representatives of the Direction des Sports and the Ministère de l''Éducation Nationale present. The first post-unification presidents were Paul de Rocca-Serra (1956) and Jean Pimentel (1956-1961). Its modern name adds jujitsu, kendo and associated disciplines; in 1956 it was named Fédération française de judo et disciplines associées. Wikipedia (fr) instead treats the FFJDA as one continuous institution since 1946 (see the merger recorded under affiliations).

'
  fr: 'La Fédération française de judo, jujitsu, kendo et disciplines associées (FFJDA, « France Judo »), fédération française de judo actuelle, est issue de la réunion en 1956 de la Fédération française de judo et de jiu-jitsu (FFJJ) et de la fédération « tendance Kodokan » (UAK/FATK), par un accord conclu le 29 février 1956 en présence de représentants de la direction des Sports et du ministère de l''Éducation nationale. Les premiers présidents après l''unification furent Paul de Rocca-Serra (1956) puis Jean Pimentel (1956-1961). Son nom actuel y adjoint le jujitsu, le kendo et les disciplines associées ; en 1956, elle se nommait Fédération française de judo et disciplines associées. Wikipédia (fr) considère pour sa part la FFJDA comme une institution continue depuis 1946 (fusion enregistrée sous affiliations).

'
