description:
  en: The Fédération Française d'Aïkido et de Budo (FFAB) is one of the two French aikido federations. Gérard Obellianne is recorded in its 2013 Manuel du Pratiquant as co-secrétaire for the FFAB in the CSDGE Aikido / UFA and as a member of the Conseil de l'Aïkido.
  pt: A Federação Francesa de Aikido e Budo (FFAB) é uma das duas federações francesas de aikido. Gérard Obellianne é registado no seu Manuel du Pratiquant de 2013 como co-secretário da FFAB na CSDGE Aikido / UFA e como membro do Conselho de Aikido.
