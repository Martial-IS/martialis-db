description:
  fr: Ligue régionale de la FFJDA en Aquitaine, issue de la réunification du judo du Sud-Ouest le 28
    octobre 1971, renommée Ligue d'Aquitaine lors de l'assemblée générale de novembre 1976 et fusionnée
    dans la Ligue Nouvelle-Aquitaine le 18 juin 2016.
notes: The name the ligue carried before November 1976 is not given in this source. Not the same body
  as Aquitaine Aikido League, a different federation for a different sport.
hasEvidence:
- basedOnSource: 01M00NPBTPWWBSJZRMYXBESJ97
  quotation: Le Sud-ouest, pourtant le plus éprouvé dans la période passée, va être le premier à œuvrer
    dans la voie de la réunification le 28 octobre 1971. La fusion est entérinée à l'unanimité.
  informationType: infotype:secondary
  supports: true
  evidenceType: evidencetype:direct
