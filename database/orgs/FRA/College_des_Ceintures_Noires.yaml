description:
  fr: Organisation française du judo née le 30 juin 1947, distincte de la Fédération française de judo
    et de jiu-jitsu et parfois en conflit avec elle sur l'attribution des grades. Réunifiée avec la FFJDA
    par un protocole d'accord en 1968-1971.
notes: Distinguish from the FFJDA (French Judo and Jiu-Jitsu Federation);
  the two bodies coexisted and disputed rank authority until reunification.
hasEvidence:
- basedOnSource: 01M00NPBTPWWBSJZRMYXBESJ97
  quotation: un climat de détente s'instaure en 1968 et en 1971 et deux protocoles d'accord sont signés,
    l'un entre la FFJDA et le CCN, l'autre entre la FFJDA et la Fédération nationale du judo sportif (FNJS)
  informationType: infotype:secondary
  supports: true
  evidenceType: evidencetype:direct
