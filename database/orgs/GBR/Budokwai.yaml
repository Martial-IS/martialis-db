description:
  en: >-
    The Budokwai (武道会), the London judo club founded on 1918-01-26 by Gunji Koizumi, with Yukio Tani as its first professional teacher, and the oldest judo club in Europe. Beyond its own dojo it served as a reference body for Kodokan judo in Europe: the Toulouse Shudokan records its affiliation to the Budokwai from 1947.
