description:
  en: The European Judo Union (EJU) is the continental governing body for judo in Europe, one of the five continental unions recognised by the International Judo Federation. Founded on 28 July 1948, it comprises 51 national judo federations, including the Federação Portuguesa de Judo.
  pt: A União Europeia de Judo (EJU) é o organismo continental de governo do judo na Europa, uma das cinco uniões continentais reconhecidas pela Federação Internacional de Judo. Fundada a 28 de julho de 1948, compreende 51 federações nacionais de judo, incluindo a Federação Portuguesa de Judo.
