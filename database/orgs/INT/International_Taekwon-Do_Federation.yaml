description:
  en: >-
    International taekwondo federation founded by Choi Hong-hi in 1966 after he lost his leadership roles in
    the Korea Taekwondo Association. It moved with him to Canada in 1972 and its headquarters moved from
    Toronto to Vienna in 1985. It governs ITF Taekwondo.
