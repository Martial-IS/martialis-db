  - basedOnSource: 01M5JRHX02FCWT71TH3J8H4WCG
    quotation: >-
      The Fellowship of Liechtenauer (Geselschaft Liechtenauers) is a group of seventeen masters listed
      in the introduction to the three oldest copies of Paulus Kal's fencing manual.
    informationType: infotype:secondary
    supports: true
    evidenceType: evidencetype:direct
  - basedOnSource: 01M5JRHX02NDGJQM5H34ZMD53H
    quotation: >-
      Perhaps his most significant legacy is an honor role of deceased masters included in the Bologna
      (Ms. 1825) and Munich (Cgm 1507) versions of his treatise, which he styled the Society of
      Liechtenauer (Geselschaft Liechtenauers).
    informationType: infotype:secondary
    supports: true
    evidenceType: evidencetype:direct
