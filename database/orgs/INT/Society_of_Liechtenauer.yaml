type: Organization
id: 01M5JRHX02G2KWHX61AFRF2ZVM
name:
  en: Society of Liechtenauer
  de: Geselschaft Liechtenauers
aka:
  en:
    - Fellowship of Liechtenauer
orgType: orgclass:other
description:
  en: >-
    The seventeen masters whom Paulus Kal, about 1470, listed as the "Geselschaft Liechtenauers" in the
    introduction to his fencing manual: Johannes Liechtenauer and masters of his tradition from what are
    now Germany, Austria, the Czech Republic and Poland. It is not known whether it was ever a formal
    body; it may have been a company formed for a campaign or a memorial roll of deceased masters.
notes: >-
  Memberships follow Kal's list as given on Wiktenauer (from MS 1825, Cgm 1507 and MS KK5126). Hans
  Döbringer, often linked to Liechtenauer, is not on it.
