description:
  en: The national governing body of judo in Spain, constituted in 1965 (under the leadership of Rafael Urculo), succeeding the judo department previously created within the Federación Española de Lucha. It later became the Real Federación Española de Judo y Deportes Asociados. The rfejudo account dates the constitution to 1965 with Rafael Urculo at its head, while the Sueños de Olimpia blog describes Agustín Aznar as its 'primer presidente'.
