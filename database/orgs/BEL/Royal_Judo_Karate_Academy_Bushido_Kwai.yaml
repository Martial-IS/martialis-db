description:
  en: The first judo club in Belgium, founded by Felix De Smedt at Schelle on 20 May 1946 as the Judo and Jujutsu Academy Bushido-Kwai, with a Mechelen branch created on 14 March 1951. In 1996 it became the first Belgian judo club granted the Royal predicate. Renowned for its emphasis on highly technical, clean judo. Current head is Carl De Crée.
