description:
  en: The Federação Portuguesa de Karaté-Do e Disciplinas Associadas (FPKDA) was a Portuguese karate federation whose statutes were approved in July 1983 by seventeen associations, during the restructuring of the Comissão Diretiva das Artes Marciais (CDAM). It obtained its notarial constitution on 24 January 1986 (Diário da República, 6 February 1986), after which it requested recognition from the CDAM and the attribution of the powers foreseen in the competitive field.
  pt: A Federação Portuguesa de Karaté-Do e Disciplinas Associadas (FPKDA) foi uma federação portuguesa de karaté cujos estatutos foram aprovados em julho de 1983 por dezassete associações, durante a reestruturação da Comissão Diretiva das Artes Marciais (CDAM). Obteve o registo notarial de constituição em 24 de janeiro de 1986 (Diário da República, 6 de fevereiro), após o que solicitou à CDAM o seu reconhecimento e a atribuição dos poderes previstos no campo competitivo.
