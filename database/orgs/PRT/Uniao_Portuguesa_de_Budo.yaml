description:
  en: The União Portuguesa de Budo (UBU) is the oldest martial arts association in Portugal, founded by Mestre António Hilmar Schalck Corrêa Pereira. Its statutes were approved in 1960, and it served as the leading body of the martial arts in Portugal until the state created the Comissão Directiva das Artes Marciais (CDAM) in 1972, which took over the supervision and control of martial arts. Its historical honbu dojo was the Academia de Budo in Lisbon, where aikido was introduced in the early 1970s under Misao Honda and Leopoldo Ferreira.
  pt: A União Portuguesa de Budo (UBU) é a mais antiga associação de artes marciais em Portugal, fundada pelo Mestre António Hilmar Schalck Corrêa Pereira. Os seus estatutos foram aprovados em 1960, e serviu como principal organismo das artes marciais em Portugal até o Estado criar a Comissão Directiva das Artes Marciais (CDAM) em 1972, que assumiu a superintendência e o controlo das artes marciais. O seu honbu dojo histórico foi a Academia de Budo em Lisboa, onde o Aikido foi introduzido no início dos anos 1970 sob Misao Honda e Leopoldo Ferreira.
