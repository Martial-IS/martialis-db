description:
  en: The ADAS (Associação Desportiva de Aikido de Setúbal) is a Portuguese aikido association founded on 23 November 1998 by Orlando Marques, who serves as its Technical Director. It rebranded as ADAS-Aikido Buikukai Portugal, the Portuguese branch of the Aikido Osaka Buikukai, with its president appointed by the Buikukai of Osaka, Japan. In its last years Honda Doshū was its technical advisor.
  pt: A ADAS (Associação Desportiva de Aikido de Setúbal) é uma associação portuguesa de Aikido fundada a 23 de novembro de 1998 por Orlando Marques, que é o seu Diretor Técnico. Foi renomeada ADAS-Aikido Buikukai Portugal, a filial portuguesa do Aikido Osaka Buikukai, com o seu presidente nomeado pela Buikukai de Osaka, Japão. Nos últimos anos Honda Doshū foi o seu assessor técnico.
