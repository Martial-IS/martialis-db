description:
  en: The Federação Portuguesa de Aikido e Disciplinas Associadas (FPADA) was constituted in 1994, published in the Diário da República on 13 October 1994, as a response to the then monopoly held by the Federação Portuguesa de Aikido Aikikai (FPAA). It later dissolved itself, and the FPAA negotiated a merger with the remaining aikido associations, becoming the FPA in 1995.
  pt: A Federação Portuguesa de Aikido e Disciplinas Associadas (FPADA) foi constituída em 1994, publicada no Diário da República a 13 de outubro de 1994, como resposta ao monopólio então detido pela Federação Portuguesa de Aikido Aikikai (FPAA). Mais tarde decidiu dissolver-se, e a FPAA negociou a integração das restantes associações de Aikido, tornando-se a FPA em 1995.
