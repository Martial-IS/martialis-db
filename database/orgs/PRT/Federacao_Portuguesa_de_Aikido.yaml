description:
  en: National governing body for aikido in Portugal, constituted on 7 September 1990 as the Federação Portuguesa de Aikido Aikikai (FPAA). After the Federação Portuguesa de Aikido e Disciplinas Associadas (FPADA) dissolved itself, the FPAA negotiated the integration of the remaining Portuguese aikido associations and was renamed Federação Portuguesa de Aikido (FPA) in 1995. It regroups the various Portuguese aikido schools and associations, holding public-utility sports status, and is recognised by the Aikikai Foundation, which issues its grading certificates.
  pt: Organismo nacional de governo do Aikido em Portugal, constituído a 7 de setembro de 1990 como Federação Portuguesa de Aikido Aikikai (FPAA). Após a dissolução da Federação Portuguesa de Aikido e Disciplinas Associadas (FPADA), a FPAA negociou a integração das restantes associações portuguesas de Aikido e foi renomeada Federação Portuguesa de Aikido (FPA) em 1995. Reagrupa as várias escolas e associações portuguesas de Aikido, detém a utilidade pública desportiva, e é reconhecida pela Fundação Aikikai, que emite os seus certificados de graduação.
