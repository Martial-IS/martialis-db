description:
  en: The Associação de Clubes de Aikido TenChi (ACAT) is the Portuguese association representing the dojos of the TenChi school founded by Georges Stobbaerts. It is affiliated with the Federação Portuguesa de Aikido (FPA), which is the body through which Stobbaerts' aikido is represented within the federation, and is recognized by the Aikikai Foundation.
  pt: A Associação de Clubes de Aikido TenChi (ACAT) é a associação portuguesa que representa os dojos da escola TenChi fundada por Georges Stobbaerts. Está filiada na Federação Portuguesa de Aikido (FPA), através da qual o Aikido de Stobbaerts é representado na federação, e é reconhecida pela Fundação Aikikai.
