description:
  en: The Comissão Directiva das Artes Marciais (CDAM) was the Portuguese state body created by Decreto-Lei n.º 105/72 of 30 March 1972 in the Secretariado-Geral da Defesa Nacional to supervise and control the teaching, learning and practice of martial arts and combat sports (AM&DC), succeeding a first legislative attempt, Decreto-Lei n.º 48462 of 2 July 1968, which had assigned that competence to the Departamento da Defesa Nacional. It took over the control role over the martial arts previously claimed by the União Portuguesa de Budo. After the 1974 revolution it was successively made dependent on the EMGFA (1974), the Ministério da Educação e Ciência (1980), the Ministério da Qualidade de Vida (1982) and the Presidência do Conselho de Ministros (1985). It was extinguished by Decreto-Lei n.º 69/87 of 9 February 1987, its rights and obligations passing to the Direção-Geral dos Desportos.
  pt: A Comissão Directiva das Artes Marciais (CDAM) foi o organismo estatal português criado pelo Decreto-Lei n.º 105/72, de 30 de março de 1972, no Secretariado-Geral da Defesa Nacional, para superintender e controlar o ensino, a aprendizagem e a prática das artes marciais e desportos de combate (AM&DC), sucedendo a uma primeira tentativa legislativa, o Decreto-Lei n.º 48462, de 2 de julho de 1968, que atribuíra essa competência ao Departamento da Defesa Nacional. Assumiu o papel de controlo das artes marciais anteriormente reclamado pela União Portuguesa de Budo. Após a revolução de 1974, foi sucessivamente dependente do EMGFA (1974), do Ministério da Educação e Ciência (1980), do Ministério da Qualidade de Vida (1982) e da Presidência do Conselho de Ministros (1985). Foi extinta pelo Decreto-Lei n.º 69/87, de 9 de fevereiro de 1987, com os seus direitos e obrigações a passarem para a Direção-Geral dos Desportos.
