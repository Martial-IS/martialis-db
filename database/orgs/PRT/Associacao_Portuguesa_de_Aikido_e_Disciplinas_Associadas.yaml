description:
  en: The Associação Portuguesa de Aikido e Disciplinas Associadas (APADA) was founded on 11 December 1975. It was one of the associations carrying the aikido of Georges Stobbaerts' lineage in Portugal, with Jean-Marc Duclos as technical director since 1988.
  pt: A Associação Portuguesa de Aikido e Disciplinas Associadas (APADA) foi fundada a 11 de dezembro de 1975. Foi uma das associações que transportou o Aikido da linhagem de Georges Stobbaerts em Portugal, com Jean-Marc Duclos como diretor técnico desde 1988.
