description:
  en: The Federação Portuguesa de Karaté (FPK) was a Portuguese karate federation whose statutes were approved in 1985 by three associations, during the restructuring of the Comissão Diretiva das Artes Marciais (CDAM). In late December 1985 it attempted to affiliate with the international karate bodies WUKO and EKU, where the CDAM held the national representation at the request of the associations; WUKO rejected the application.
  pt: A Federação Portuguesa de Karaté (FPK) foi uma federação portuguesa de karaté cujos estatutos foram aprovados em 1985 por três associações, durante a reestruturação da Comissão Diretiva das Artes Marciais (CDAM). No final de dezembro de 1985 tentou filiar-se nos organismos internacionais de karaté WUKO e EKU, onde a CDAM detinha a representação nacional a pedido das associações; a WUKO rejeitou o pedido.
