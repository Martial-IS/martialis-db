description:
  en: National Portuguese aikido association recognised by the Aikikai Foundation (Aikido World Headquarters), founded on 3 January 1984. Its Technical Director is Luís Antunes, 7th dan and shihan of the Aikikai, who was awarded the 7th dan by the Dôshu Moriteru Ueshiba in 2016.
  pt: Associação nacional portuguesa de Aikido reconhecida pela Fundação Aikikai (Aikido World Headquarters), fundada a 3 de janeiro de 1984. O seu Director Técnico é Luís Antunes, 7º dan e shihan da Aikikai, que recebeu o 7º dan das mãos do Dôshu Moriteru Ueshiba em 2016.
