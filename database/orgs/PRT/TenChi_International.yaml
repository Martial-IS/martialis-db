description:
  en: The TenChi International is the school founded by Georges Stobbaerts in 1978 in the region of Sintra, Portugal, with the Dojo TenChi as its seat. It is recognized as a school of aikido at graduation level, was declared a Ryu by the Dai Nippon Butoku Kai, and comprises the Tenchi Tessen art of movement alongside aikido. Its teaching in Portugal is represented in the Federação Portuguesa de Aikido by the Associação de Clubes de Aikido TenChi (ACAT).
  pt: A TenChi International é a escola fundada por Georges Stobbaerts em 1978 na região de Sintra, Portugal, tendo o Dojo TenChi como sede. É reconhecida como escola de Aikido ao nível das graduações, foi declarada Ryu pela Dai Nippon Butoku Kai, e integra a arte do movimento Tenchi Tessen a par do Aikido. O seu ensino em Portugal é representado na Federação Portuguesa de Aikido pela Associação de Clubes de Aikido TenChi (ACAT).
