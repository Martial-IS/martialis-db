description:
  en: The Associação Cultural Portuguesa de Aikido (ACPA) was founded on 14 October 2005. It is technically directed by Agostinho Vaz, 5th dan Aikikai. Before his death, Seiichi Sugano Shihan, 8th dan Aikikai, directed several of the association's stages and was its highest reference; today some stages are directed by Antoine Vermeulen, 7th dan Aikikai.
  pt: A Associação Cultural Portuguesa de Aikido (ACPA) foi fundada a 14 de outubro de 2005. É orientada tecnicamente pelo Prof. Agostinho Vaz, 5º dan Aikikai. Antes do seu falecimento, o Shihan Seiichi Sugano, 8º dan Aikikai, dirigiu vários estágios desta Associação e foi o seu orientador máximo; hoje alguns estágios são orientados pelo Mestre Antoine Vermeulen, 7º dan Aikikai.
