description:
  en: Portuguese aikido association founded in 1989 by Tristão da Cunha to develop Iwama Shin-Shin Aikishurenkai (Iwama Ryu) aikido in Portugal. The name Aiki-Shuren Dojo was given by Morihiro Saito for the dojo in Portugal. Its Technical Director was Tristão da Cunha, 7th dan Iwama Shin Shin Aikido, later 8th dan.
  pt: Associação portuguesa de Aikido fundada em 1989 por Tristão da Cunha para desenvolver o Aikido Iwama Shin-Shin Aikishurenkai (Iwama Ryu) em Portugal. O nome Aiki-Shuren Dojo foi dado por Morihiro Saito para o dojo em Portugal. O seu Director Técnico foi Tristão da Cunha, 7º dan Iwama Shin Shin Aikido, mais tarde 8º dan.
