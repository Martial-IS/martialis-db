description:
  en: Martial arts governing body founded by Chuck Norris in 1979 to succeed his National Tang Soo Do Congress as the organizational home of American Tang Soo Do (today it governs the Chuck Norris System). Pat E. Johnson served as executive vice president from 1979 until he left in 1986 over philosophical differences with Norris and reformed the NTC.
