description:
  en: Governing body Chuck Norris created in 1973 for his American Tang Soo Do, with Pat E. Johnson as
    executive vice president and chief of instruction. Norris disbanded it in 1979 to form the United
    Fighting Arts Federation; after leaving UFAF in 1986, Johnson reformed the NTC and led it for the
    rest of his life. Its status after Johnson's death in
    2023 is unclear.
