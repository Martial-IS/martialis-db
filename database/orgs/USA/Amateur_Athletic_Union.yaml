description:
  en: >-
    American amateur sports organization founded in 1888, dedicated to the promotion and
    development of amateur sports and physical fitness programs. The AAU has more than 900,000
    members nationwide. James E. Sullivan and William Buckingham Curtis set it up at the New
    York Athletic Club to give amateur sport shared standards. The AAU formerly served as the
    national Olympic sports governing body in the United States until the Amateur Sports Act of
    1978 established independent national governing bodies. It moved its national headquarters
    to Lake Buena Vista, Florida in 1996.
