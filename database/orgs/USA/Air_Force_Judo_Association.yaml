description:
  en: Judo association of the US Air Force. It began as the 15th Air Force Judo Association at March AFB
    in late 1956, was admitted to the Judo Black Belt Federation as a yudanshakai in 1957, and later became
    the Armed Forces Judo Association, from which the USJA was formed in 1969.
