    cite: History of the USJA
    quotation: >-
      One of the first judo groups to organize was the 15th Air Force Judo Association that began in the Physical Conditioning Unit at March AFB in late 1956.
    informationType: infotype:secondary
    supports: true
    evidenceType: evidencetype:direct
hasEvidence:
