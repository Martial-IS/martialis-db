name:
  ja-Latn: Tenjin Shin'yō-ryū
  ja: 天神真楊流
description:
  en: >-
    Koryū jujutsu school (天神真楊流, 'Divine True Willow School') founded in the 1830s by Iso
    Mataemon Ryūkansai Minamoto no Masatari (磯又右衛門柳関斎源正足). Its curriculum covers strikes,
    throws, immobilisations and chokes. Kanō Jigorō trained in it, and with Kitō-ryū it was a
    major influence on judo.
