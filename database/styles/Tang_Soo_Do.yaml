      quotation: >-
        Between 1944 and Korea's liberation from Japanese rule in 1945, the original schools or kwans of Tang Soo Do were founded in Korea by practitioners who studied Okinawan karate and had exposure to kung-fu. At the time, there were five kwans (schools) of Taekwondo, of which only Chung Do Kwan of Won-kuk Lee and Moo Duk Kwan of Hwang Kee identified their martial arts as Tang Soo Do.
      informationType: infotype:secondary
