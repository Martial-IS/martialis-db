description:
  en: Traditional Korean martial art first taught in the kwans of 1944-1945, Lee Won-kuk's Chung Do Kwan and Hwang Kee's Moo Duk Kwan. Emphasizes hard kicking and striking techniques, with forms (hyung), sparring, and self-defense. Tang Soo Do served as the foundation for American Tang Soo Do and heavily influenced the development of Taekwondo.
