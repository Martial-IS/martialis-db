description:
  en: >-
    Boxing of ancient Greece, known from Minoan and Mycenaean art and Homer, an Olympic event from 688
    BCE. Bouts had no rounds and were won by knockout or submission; boxers wrapped their hands in
    leather thongs, later in harder "sharp thongs", from which the Roman caestus grew.
notes: >-
  Recorded as a variant of Boxing for the practitioner roll-up only: modern boxing descends from English
  pugilism, not from Greek boxing.
