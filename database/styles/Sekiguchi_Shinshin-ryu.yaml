  ja: 関口新心流
description:
  en: 'A koryu school of jujutsu. Records preserved in the Daito-ryu jujutsu literature name Sekiguchi
    Ujitane as

    Handa Yataro''s teacher in the style from 1860, while Handa was serving in the Kishu domain; Handa''s
    later

    Daito-ryu jujutsu is described by Wolf (2016) as an obscure development of Sekiguchi-ryu jujutsu.

    '
  ja: '柔術の古流流派。大東流柔術の文献には、半田弥太郎が1860年より紀州藩にて関口氏胤からこの流儀を学んだと記録される。

    Wolf (2016) は半田の大東流柔術を関口流柔術の一変種として記述している。

    '
