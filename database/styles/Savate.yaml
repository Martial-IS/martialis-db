description:
  en: >-
    French kicking and punching combat sport. It grew from the street fighting of early
    nineteenth-century Paris; Michel Casseux, called Pisseux, opened the first salle about 1825, and
    Charles Lecour joined its kicks with English boxing punches in the 1830s. Joseph Charlemont codified
    the academic form late in the century.
  fr: >-
    Sport de combat français de pieds et de poings, issu des combats de rue du Paris du début du XIXe
    siècle ; Michel Casseux, dit Pisseux, ouvre la première salle vers 1825 et Charles Lecour y joint les
    coups de poing de la boxe anglaise dans les années 1830. Joseph Charlemont en codifie la forme
    académique à la fin du siècle.
notes: >-
  The fr Wikipedia infobox names Michel Casseux and Charles Lecour as founders; Green and Svinth (p. 257)
  say it is not known who invented it, so no foundedEvent is recorded.
