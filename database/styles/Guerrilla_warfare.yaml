description:
  en: Modern military discipline of irregular combat - insurgent operations, counter-guerrilla strategy,
    and the intelligence work of surveillance, infiltration and tracking that supports them - taught by
    armed forces rather than practised as a civilian art. Colonel Yamamoto
    Kiyokatsu of the Japan Ground Self-Defense Force Intelligence School gave lectures (Yugeisen gaisetsu,
    yugeisen koho ippan yoryo, yugeisen unyo) and urban street exercises for Mishima Yukio's Tatenokai
    in 1967-1969.
