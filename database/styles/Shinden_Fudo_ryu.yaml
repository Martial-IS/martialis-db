description:
  en: 'Shinden Fudo-ryu (神伝不動流, Immovable Heart School) is a koryu school of Japanese martial arts founded
    in around

    1113 by Izumo Kanja Yoshiteru, one of the oldest styles of jujutsu. The curriculum is entirely unarmed,
    with no

    weapons and no formal stance (kamae); techniques start from a natural, loose posture and work with
    one''s natural

    surroundings, most training taking place outdoors. It was a blend of indigenous Japanese and Chinese
    styles.

    Note that the Wikipedia article distinguishes the Shinden Fudo-ryu Dakentaijutsu lineage from the
    "Shinden Fudo

    ryu Kempo" studied by Edward William Barton-Wright, which it says is not connected to the Dakentaijutsu
    school;

    the BJS paper (citing Keegan 2019) nonetheless credits Barton-Wright with teaching Shinden Fudo-ryu
    jujutsu

    techniques.

    '
