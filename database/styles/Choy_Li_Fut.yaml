description:
  en: >-
    Southern Chinese boxing style created by Chan Heung, who made it public in 1836. Spread through
    a network of branch schools from about 1848, it was the most popular system in Guangdong by the
    end of the century; its popularity fell sharply after 1949.
notes: >-
  Judkins and Nielson pp. 92-99, 117-119. The name joins Choy Gar, Li Gar and Fut Gar, the arts
  Chan Heung said he learned. The Nanquan article cites Judkins and Nielson among its references.
