description:
  en: Shooto is a combat sport and hybrid martial art founded by Satoru Sayama in 1985, considered one of the first true mixed martial arts systems. It combines punching, kicking, throwing, and submissions, drawing techniques from Muay Thai, Catch-As-Catch-Can wrestling, Russian Sambo and Judo. Practitioners are called shooters or shootists. It was brought to the United States by Yorinaga Nakamura through the USA Shooto Association.
  ja: 修斗（しゅうと）は、1985年に佐山聡によって創設された日本の総合格闘技。打撃・投げ・関節技を組み合わせたハイブリッド格闘技で、ムエタイ、キャッチ・アズ・キャッチ・キャン、サンボ、柔道の技術を取り入れている。総合格闘技の先駆けとされ、アメリカでは中村頼永によってUSA修斗協会が設立された。
