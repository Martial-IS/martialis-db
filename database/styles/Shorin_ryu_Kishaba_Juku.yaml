description:
  en: 'Shorin-ryu Kishaba Juku is the school of Okinawan karate founded by Chokei

    Kishaba (1929-2000), who studied under Hohan Soken, Shoshin Nagamine and

    Seigi Nakamura. After Kishaba''s death in 2000 his senior student Katsuhiko

    Shinzato became the Juko Cho (head) of the Kishaba Juku. The school has

    affiliated dojos in Japan, the United States, France, Germany and Israel.

'
