description:
  en: >-
    Classical school of swordsmanship founded by Ōno Shōkan in the Tensho era (1573-1593), restored
    in the late Edo and Meiji periods by the Shibata family (15th head Shibata Mamoru, a Metropolitan
    Police instructor), who still lead it. Known for uchiotoshi; part of its technique entered the
    police Keishi-ryu.
notes: >-
  Its own page: the founder's teachers are unknown because the densho burned in 1945; the 18th head is
  Shibata Akio. The Field Guide (1997) gives the 17th soke, Shibata Tetsuo (d. 2004). Tradition traces it
  to the Kyo-hachi-ryu of Kiichi Hogen.
