description:
  en: >-
    School of swordsmanship founded by Miyamoto Musashi in the first half of the seventeenth century,
    known for its two-sword forms. Heads (its own page): Miyamoto Musashi, Terao Motomenosuke Nobuyuki,
    Terao Goemon Katsuyuki, Yoshida Josetsu Masahiro, Santo Hikozaemon Kiyohide, Santo Hanbei Kiyoaki,
    Santo Shinjuro Kiyotake, Aoki Kikuo Hisakatsu, Kiyonaga Tadanao Masami, Imai Masayuki Nobukatsu,
    Iwami Toshio Harukatsu, Kajiya Takanori Kogen (12th).
notes: >-
  Readings of the heads' names after the founder are this record's, from the kanji on its page. Its own
  page: Musashi founded it at fifty. Present head per the Field Guide (1997): 10th soke Imai Masayuki
  (Oita).
