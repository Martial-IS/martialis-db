description:
  en: Arnis, also known as Eskrima or Kali, is the national martial art of the Philippines. It emphasizes
    weapon-based fighting with sticks, knives, bladed weapons, and improvised weapons, as well as open-hand
    techniques. The World Eskrima Kali Arnis Federation (WEKAF) governs international competition. Dan
    Inosanto is a major proponent and teacher of FMA through the Inosanto Academy.
  fil: Ang Arnis, na kilala rin bilang Eskrima o Kali, ay ang pambansang sining pandigma ng Pilipinas.
    Binibigyang-diin nito ang pakikipaglaban gamit ang mga patpat, kutsilyo, at iba pang sandata, pati
    na rin ang mga teknik na walang sandata.
