description:
  en: Taijiquan is a Chinese internal (neijia) martial art practiced for combat, health, and meditation.
    It features slow flowing movements coordinated with breath, rooted in Taoist philosophy. Traditionally
    associated with the Wudang school, its core principle is using softness to overcome hardness. The
    most widespread modern form is the Yang-style simplified sequence.
