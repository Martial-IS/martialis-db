description:
  en: 'Kinomichi (氣之道) is a martial art in the budo tradition, developed from aikido by

    Masamichi Noro, one of Morihei Ueshiba''s uchi-deshi and his designated delegate for

    Europe and Africa, and founded in Paris in 1979. In France it is affiliated with the

    FFAAA and maintains relations with the Aikikai Foundation. It is practiced mainly in

    France and other European countries.


    Rank system note: Kinomichi does not use the aikido dan/kyu system; progression is by "stages" (niveaux) under Noro''s teaching, with no belt grades.'
