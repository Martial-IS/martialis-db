description:
  en: >-
    Street self-defence system founded in New York by Moses Powell in 1959, drawing on the Marine Corps
    combatives of Charles Nelson, the Filipino arts of Florendo Vistacion and the Japanese arts of
    Kiyose Nakae; it never had a tournament division.
