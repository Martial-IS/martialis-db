name:
  en: Tenchi Tessen
  fr: Ten-Chi Tessen
description:
  en: 'Tenchi Tessen is an art of movement created in 1985 by Georges Stobbaerts, in which a

    traditional katana is replaced by a fan (tessen). Developed within the TenChi school he

    founded in Portugal, it blends the movement principles of budo with an emphasis on flow,

    spiral and the "content of the form" over mechanical technique. The TenChi International

    school, of which Tenchi Tessen is a discipline, was declared a Ryu by the Dai Nippon

    Butoku Kai.

    '
  pt: 'O Tenchi Tessen é uma arte do movimento criada em 1985 por Georges Stobbaerts, na qual uma

    katana tradicional é substituída por um leque (tessen). Desenvolvida no âmbito da escola

    TenChi que fundou em Portugal, combina os princípios de movimento do Budo com ênfase no

    fluxo, na espiral e no "conteúdo da forma" em vez da técnica mecânica. A escola TenChi

    International, da qual o Tenchi Tessen é uma disciplina, foi declarada Ryu pela Dai Nippon

    Butoku Kai.

    '
