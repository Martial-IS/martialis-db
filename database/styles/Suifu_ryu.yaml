description:
  en: >-
    Suifu-ryū (水府流) kenjutsu is a Mito-domain school integrating Ittō-ryū (Mito-ha Ittō-ryū), Shinkage-ryū, and Shin-Kage-ryū (JA wiki), established under the Mito domain's martial-arts style-consolidation policy. It was taught at the domain school Kōdōkan, where Monna Tadashi studied it under Toyoshima Genpachi (1868-1872) and received menkyō kaiden (JA wiki, Monna Tadashi). The name Suifu-ryū covers several domain arts (including Suifu-ryū suishu, still extant); the kenjutsu branch is recorded as no longer extant.
  ja: >-
    水府流剣術は水戸藩の流派統合政策で一刀流（水戸派）・新陰流・真陰流を統合した剣術流派。藩校弘道館で指南され、 門奈正が豊島源八より免許皆伝を受けた。現存せず。
