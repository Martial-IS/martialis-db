name:
  en: Changquan
  zh: 长拳
  zh-Latn: Chángquán
aka:
  en:
    - Long Fist
    - Northern Long Fist
styleType: styleclass:modern
description:
  en: Changquan (Long Fist) is a family of external (waijia) Chinese martial arts from northern China, emphasizing fully extended kicks, striking techniques, and long-range fighting. The name refers to the characteristic long-range techniques where the body is fully stretched. Historically, Changquan is an umbrella term encompassing numerous traditional northern styles including Chaquan, Huaquan, Pao Chui, Mizongyi, Fanziquan, Hongquan, and others. These styles share a common emphasis on athleticism, aerial kicks, and extended postures but differ in their specific forms and tactical emphasis. Modern competition wushu Changquan was standardized in the 1950s from these traditional systems, particularly drawing on Chaquan, Huaquan, and Pao Chui. In contemporary usage, 'Changquan' can refer either to the broad historical family of northern Long Fist styles or specifically to the modern standardized competition form.
  zh: 长拳是中国北方外家拳术的总称，以舒展大方的踢法、击法和远距离格斗为特点。名称源于其招式舒展、动作放长击远的特征。历史上，长拳是涵盖查拳、华拳、炮捶、迷踪艺、翻子拳、洪拳等多个传统北方拳种的统称。这些拳种共享强调腾空腿法和舒展姿势的特征，但在具体套路和战术侧重上各有不同。现代竞技武术长拳于1950年代从这些传统系统中标准化而来，主要取材于查拳、华拳和炮捶。当代语境下，长拳既可以指北方长拳的历史体系，也可以特指现代竞技标准化套路。
