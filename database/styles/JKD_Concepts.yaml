description:
  en: 'One of the two posthumous branches of Jeet Kune Do, led by Dan Inosanto after Bruce Lee''s death
    in 1973. It continues Lee''s philosophy of individual self-expression, re-interpreting combat systems
    through the lens of Jeet Kune Do and incorporating elements from other martial arts - most notably
    grappling and Filipino martial arts (Kali, Escrima, Arnis).

    '
