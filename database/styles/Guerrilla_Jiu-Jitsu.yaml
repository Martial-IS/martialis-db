description:
  en: 'Guerrilla Jiu-Jitsu is the grappling system developed and branded by Dave Camarillo,

    blending Brazilian jiu-jitsu with his judo groundwork and adapted for mixed martial

    arts. Camarillo developed it while running the grappling program at American Kickboxing

    Academy (AKA) from September 2003, and graduates his students under that banner.

'
