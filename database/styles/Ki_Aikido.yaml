description:
  en: Ki Aikido (心身統一合氣道, Shin Shin Toitsu Aikido), also known as Ki-Aikido (氣合氣道), is a Japanese gendai budo and one of the arts derived from aikido, appearing after the founder Morihei Ueshiba's death in 1969. It was founded by Koichi Tohei in 1971 with the creation of the Ki Society (Ki No Kenkyūkai), while he was still chief instructor at the Aikikai Hombu Dojo; he split from the Aikikai in 1974. The style focuses on mind and body coordination based on aikido techniques and the Japanese yoga Shinshin-tōitsu-dō taught by Tempu Nakamura, promoting non-violent conflict solving and self-development.
  ja: 心身統一合氣道（氣の合氣道）は、1969年の開祖植芝盛平の没後に生まれた合氣道系の日本現代武道の一つ。1971年に藤平光一が合氣会本部師範在任中に氣の研究会（Ki Society）を創設して始まり、1974年に合氣会から分派した。中村天風の心身統一法と合氣道の技を基盤に心身統一を重視し、非暴力的な問題解決と自己啓発を目指す。
