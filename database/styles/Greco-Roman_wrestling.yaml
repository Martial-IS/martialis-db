description:
  en: >-
    Olympic wrestling style in which all holds are above the waist and tripping is barred. Despite its
    name it grew from a French folk style, the lutte à mains plates, and became, with freestyle, the
    standard for the Olympics and World Championships under the IAWF/FILA from 1921.
