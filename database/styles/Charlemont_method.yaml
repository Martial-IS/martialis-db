description:
  en: >-
    The academic form of French boxing codified by Joseph Charlemont from his training with Louis
    Vigneron and the methods of the Lecour brothers, which he refined with his own observations. He
    published his first treatise in the late 1870s and taught it at his Académie de boxe in Paris; his
    son Charles and pupils such as Victor Castérès carried it on. Green and Svinth say the Charlemont
    camp kept French boxing academic rather than a competitive sport.
  fr: >-
    Forme académique de la boxe française, codifiée par Joseph Charlemont à partir de son entraînement
    avec Louis Vigneron et des méthodes des frères Lecour, qu'il corrige par ses propres observations.
    Enseignée à son Académie de boxe à Paris, elle est poursuivie par son fils Charles et des élèves comme
    Victor Castérès.
notes: >-
  No founding date: Charlemont was about to publish his first treatise in 1876 (Charlemont 1899, p. 369);
  Green and Svinth date the synthesis to the 1880s and 1890s. Vigneron has no style record; his link to
  Charlemont is the teacher claim on Joseph Charlemont.
hasEvidence:
