styleType: styleclass:modern
description:
  en: Tan Tui (Springing Legs) is a foundational training system within northern Chinese Long Fist (Changquan) martial arts, deeply rooted in China's Hui Muslim community. The routines emphasize blocking, stances, footwork, and especially kicks, with the characteristic springing leg technique that gives the style its name. Originally consisting of 28 roads based on the Arabic alphabet, it was later condensed to the common 10-road and 12-road versions. Tan Tui is widely practiced as essential basic training in Chaquan and other northern styles, and is one of the most recognized foundational routines in Chinese martial arts. It serves as both a standalone training method and a prerequisite for more advanced Long Fist forms.
  zh: 弹腿是中国北方长拳的基础训练套路和训练体系，深深根植于回族穆斯林社区。套路以招架、步法、腿法为主，尤以弹腿这一标志性腿法命名。最初为28路，基于阿拉伯字母，后简化为常见的10路和12路。弹腿是查拳等北方拳种的基本功训练，也是中国武术中最具代表性的基础套路之一。既可作为独立的训练方法，也是进阶长拳套路的先修内容。
