description:
  en: >-
    Ancient Greek combat event, the third of the "heavy events" after wrestling and boxing, which it
    combined: a fight won by submission or incapacity in which only biting and gouging were barred. It
    was fought at the Olympic and other crown games; Arrichion of Phigalia is its most famous champion.
