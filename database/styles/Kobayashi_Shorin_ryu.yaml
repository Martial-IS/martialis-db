description:
  en: 'Kobayashi Shorin-ryu is the school of Okinawan karate developed by Chibana

    Choshin (1885-1969) based on what he learned from Anko Itosu. Chibana was

    the first to establish a Japanese ryu name for an Okinawan karate style,

    naming Itosu''s karate Shorin-ryu in 1929. The school descends from the

    Shuri-te tradition and preserves the kata of Itosu''s teaching.

'
