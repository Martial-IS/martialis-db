description:
  en: 'Chinese martial arts, commonly referred to with the umbrella terms kung fu, gong fu, kuoshu

    or wushu, are multiple fighting styles that have developed over the centuries in Greater

    China, encompassing striking systems, jacket wrestling, and weapon arts. The striking

    tradition is broadly classified into internal (neijia) and external (waijia) schools, with

    major groupings including Wudang (internal) and Shaolin (external); alongside it sits shuai

    jiao, China''s native jacket-wrestling tradition, governed by the same national and

    international wushu bodies as the striking styles.

    '
  zh: '中國武術是中國傳統武術的總稱，歷史悠久，流派眾多，涵蓋拳術、摔跤（摔跤）和器械武術。

    拳術主要分為內家拳和外家拳兩大類，其中內家拳以武當拳為代表，外家拳以少林拳為代表；

    摔跤則是中國本土的跤術傳統，與拳術同受同一武術管理機構管轄。

    '
