description:
  en: >-
    Shin Tamiya-ryū (新田宮流) is a branch of iaijutsu (sumi-ai, battojutsu); the JA wiki attributes its founding to Wada Heisuke Masakatsu. It was taught alongside Hokushin Ittō-ryū at the Mito Tobukan, where Monna Tadashi studied it under Kozawa Ichirō from 1882 and received menkyō kaiden (JA wiki, Monna Tadashi).
  ja: >-
    新田宮流は抜刀術（居合）の流派。水戸東武館で北辰一刀流とともに指南され、門奈正が一郎より免許皆伝を受けた。
