description:
  en: >-
    Jacket wrestling of Cornwall, standing only, won by throwing the opponent onto two shoulders and a
    hip or two hips and a shoulder (a "back"). It is almost the same sport as Breton gouren, differing
    mainly in the loose jacket. The Cornish Wrestling Association stayed out of the FILC when it was
    founded in 1985.
