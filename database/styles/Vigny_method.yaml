description:
  en: >-
    Self-defence method with the walking stick and umbrella, founded by Pierre Vigny around 1898 in
    Geneva from a heavily modified canne de combat. It used high, double-handed guards and strikes to
    the head, hands and joints. Vigny taught it at Barton-Wright's Bartitsu Club and at his own London
    academy; Barton-Wright described it in Pearson's Magazine (1901), and H. G. Lang's book The Walking
    Stick Method of Self Defence (1923) drew on it.
notes: >-
  fr Wikipedia says the high guard was inspired by Caribbean kalinda; not in other sources here.
  Green and Svinth (p. 220) say Kapap preserves parts of it; that link waits for the Kapap cluster.
