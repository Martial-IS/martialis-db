description:
  en: >-
    Comprehensive classical school centred on the sword (iaijutsu and kenjutsu), with yawara,
    spear and other weapons, founded by Tatsumi Sankyo in the Eisho era (1504-1520) and the
    official style of the Sakura domain from the 1670s. Headmasters (the ryu's own list): 1 Tatsumi
    Sankyo, 2 Tatsumi Iwami-no-kami, 3 Tatsumi Kazumanosuke, 4 Mikami Hannojo, 5 Matsui Kotofuru,
    6 Kuwajima Tazaemon, 7 Oishi Sensuke, 8 Yamaguchi Shichirozaemon, 9 Takekawa Kyubei, 10 Kasuya
    Dankuro, 11 Henmi Ryuho, 12 Henmi Sohachi, 13 Hanzawa Kihei, 14 Henmi Shinkuro, 15 Hanzawa
    Gon'emon (the same man as the 13th), 16 Henmi Sohachi, 17 Henmi Chuzo, 18 Hanzawa Naritsune,
    19 Kato Hisashi, 20 Kato Sadao, 21 Kato Takashi, 22 Kato Hiroshi.
notes: >-
  Branches named by the ryu: Tatsumi Shin-ryu (from the 6th headmaster; Fukuzawa Yukichi trained in it
  in the Okudaira domain, per Keeley) and Tatsumi To-ryu (from the 7th); both extinct. Readings of the
  early headmasters' names are the ryu's own (立身流の歴史). Kato Takashi was president of the Nihon
  Kobudo Shinkokai; the ryu is a Chiba Prefecture intangible cultural asset.
