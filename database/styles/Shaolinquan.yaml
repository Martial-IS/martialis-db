description:
  en: 'Shaolin kung fu is the largest and most famous style of kung fu. It was developed in the

    Shaolin Temple in Henan, China during its 1500-year history. It combines Mahayana Buddhist,

    Chan philosophy and martial arts. The name Shaolin is used as a brand for the external styles

    of kung fu, with many styles in southern and northern China using the name Shaolin.

'
  zh: '少林拳是中國最著名的武術流派，起源於河南嵩山少林寺，擁有1500多年的歷史。

    融合了大乘佛教、禪宗哲學和武術，是中國外家拳的代表。

'
