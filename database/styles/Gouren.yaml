description:
  en: >-
    Breton jacket wrestling, standing only, won by a throw onto the shoulders (a lamm), recorded since at
    least the fourteenth century and almost the same sport as Cornish wrestling. Charles Cotonnec's
    FALSAB (1930) revived it, and it is central to the FILC.
