name:
  en: Cha Quan
  zh: 查拳
  zh-Latn: Cháquán
styleType: styleclass:modern
description:
  en: Cha Quan is one of the most influential northern Chinese Long Fist (Changquan) martial arts, deeply rooted in the Hui Muslim community. It originated in Guanxian, Shandong, and is characterized by extended postures, clear stop-start rhythm, springy footwork, full kicks, and aerial techniques. The style was systematized by the Chang family (Chang Zhenfang and his lineage) and spread widely through Hui communities across northern China. The canonical curriculum consists of ten progressively-numbered forms (Shi Lu Cha Quan), supplemented by foundational training routines including Tan Tui (Springing Legs). Cha Quan was a foundational influence on modern competition wushu Changquan and remains widely practiced both as a standalone art and as basic training for other northern styles.
  zh: 查拳是中国北方长拳最具影响力的拳种之一，深深根植于回族穆斯林社区。起源于山东冠县，以舒展的姿势、清晰的节奏、弹性的步法、充分的踢法和空中技术为特点。查拳由常氏家族（常振芳及其传承）系统化，通过华北回族社区广泛传播。经典套路为十路查拳，辅以弹腿等基础训练套路。查拳是现代竞技武术长拳的重要影响源之一，至今仍广泛作为独立拳种或其他北方拳种的基础训练来习练。
