description:
  en: Edo-period Japanese school of iai (sword-drawing), named after its founder Ōmori Rokazaemon Masahira of the mid-18th century; its seiza-opening curriculum was absorbed as the shoden set of the Muso Shinden and Muso Jikiden Eishin lineages and is also transmitted as an independent lineage with its own masters (shihan). Funasaka Yoshio, who taught it to Yukio Mishima in the 1960s, noted that "we studied what is now called Omori Ryu, but we called it Hasegawa Eishin Ryu". Mishima formally entered the school under Funasaka in 1966.
