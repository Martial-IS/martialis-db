description:
  en: 'Nihon Jujutsu (日本柔術) is a modern Japanese martial art founded by Sato Shizuya. It focuses on practical, efficient self-defense techniques derived from pre-1945 Kodokan Judo, Aikibujutsu, and Taihojutsu (Japanese police methods). Training includes physical conditioning, evasion, striking, throwing, and immobilization techniques.

'
