description:
  en: >-
    Southern Chinese martial art that claims a Tibetan origin and appeared in Guangdong in the
    1860s. Its Bak Hok Pai branch, named by Wu Zhaozhong (Ng Siu-chung), was well known in Hong Kong
    and Macau by the 1950s. Not related to Fujian White Crane.
notes: >-
  Sibling styles in the same lineage, Lama Pai and Hop Ga, have no records; no style relation
  recorded. The infobox gives its ancestor art as Lion's Roar.
hasEvidence:
  - basedOnSource: 01M69ZB9CEPEEZBWGA1PDRF4K1
    cite: Tibetan White Crane (Wikipedia EN)
    quotation: >-
      This style is not related to Fujian White Crane (福建白鶴拳), which developed independently in Fujian
      Province within the Southern Shaolin Five Animals tradition.
    informationType: infotype:secondary
    supports: true
    evidenceType: evidencetype:direct
  - basedOnSource: 01M69VJBQCHMMFMBTHKD733P9H
    quotation: >-
      Chen Kefu studied Tibetan White Crane, a style which claims western China and Tibet as its
      ancestral home. It is distinct from the White Crane schools found in Fujian Province, previously
      discussed elsewhere in this volume. The antecedents of this western White Crane first appeared
      in Guangdong Province during the 1860s.
