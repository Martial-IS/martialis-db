description:
  en: >-
    Eclectic self-defence method announced by E. W. Barton-Wright in London in 1898. It began from the
    jujutsu he had studied in Kobe and, by 1901, cross-trained jujutsu, English boxing, savate, Pierre
    Vigny's walking-stick method and European wrestling, each for a different range of combat. It was
    taught at the Bartitsu Club in Soho until 1902–1903, then fell out of use; Conan Doyle's "baritsu"
    kept the name alive, and the Bartitsu Society has revived it since 2002.
notes: >-
  The jujutsu was the Shinden Fudo Ryu of Terajima Kunichiro in Kobe (en Wikipedia), which may not be
  the Shinden Fudo-ryu recorded in this database (see Barton-Wright's notes), so the relation points at
  Jujutsu. en Wikipedia also names Swiss schwingen, through Armand Cherpillod.
