    hasConfidence:
      confidenceLevel: conflevel:probable
      assessedBy: agent:FSM
      confidenceRationale: >-
        English Wikipedia states the Beijing lineage is "in essence the lineage from the Manchu buku
        style that was practiced by the Imperial Guards Brigade, Shan Pu Ying" - Manchu buku being their
        adoption of Mongol bökh. Beijing shuai jiao elder Li Baoru is separately reported stating shuai
        jiao "comes directly from Mongol Bokh". Held at Probable rather than Confirmed because this is
        one side of a live historiographical dispute: the competing claim of an unbroken
        multi-millennial Han lineage from jiaodi/jiaoli is the mainstream popular account in
        Chinese-language sources.
    notes: Does not exclude older Han wrestling traditions (jiaodi/jiaoli) from having also fed into shuai jiao's technical vocabulary; the claim here is specifically about the Shan Pu Ying institutional lineage that produced the Beijing style codified in 1917-1928, not about the deeper multi-millennial ancestry, which is deliberately not modelled as an entity in this database - reifying it would invite a spurious continuity edge that the sources don't support.
