styleType: styleclass:traditional
description:
  en: 'Shuai jiao is the ancient jacket-wrestling wushu style of China, with regional traditions in

    Beijing, Tianjin, Baoding (where the fast-throwing kuai jiao variant developed), and Shanxi.

    Ancient Chinese wrestling terminology (jiaodi, jiaoli) is documented from the Zhou dynasty

    onward, and a widely repeated Republican-era account presents shuai jiao as its unbroken

    continuation - a narrative some read as a Han-nationalist revision

    dating to anti-Qing sentiment of the early 20th century. What is not contested is the

    Qing-era institutional lineage: the Manchu adopted Mongol bökh as buku (布庫) and formed the

    Shan Pu Ying (善撲營), an elite imperial wrestling battalion; after the dynasty''s fall in 1912,

    former battalion members taught Han and Hui civilians in Beijing, Tianjin, and Baoding. Ma

    Liang formalised the art in 1917 through the manual Zhonghua Xin Wushu (中華新武術), and the

    Central Guoshu Institute fixed the name "shuai jiao" and standardised competition rules in

    1928. It remains a recognised discipline of Chinese wushu, governed alongside sanda by the

    same national and international wushu bodies, and continues to be taught in Chinese police

    and military academies.

'
  zh: '摔跤是中國古老的著衣摔跤武術，有北京、天津、保定（快跤）、山西等地方傳統。清代滿族將蒙古式摔跤

    （博克）稱為布庫，並組建善撲營。1912年清朝滅亡後，善撲營成員向北京、天津、保定的漢族及回族平民

    傳授技藝。1917年馬良編著《中華新武術》使該武術系統化，1928年中央國術館確定「摔跤」之名並標準化

    比賽規則。摔跤現為中國武術的正式項目之一，與散打同受國家及國際武術機構管轄。

'
