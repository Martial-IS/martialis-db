description:
  en: >-
    The Yagyu line of Shinkage-ryu, from Yagyu Sekishusai Munetoshi, Kamiizumi's student. The Edo
    line of his son Munenori served the Tokugawa shoguns; the Owari line passed through his grandson
    Hyogonosuke Toshitoshi. Owari line heads (its own page): Kamiizumi Nobutsuna, Yagyu Munetoshi,
    Yagyu Toshitoshi, Tokugawa Yoshinao, Yagyu Toshikane, Tokugawa Mitsutomo, Tokugawa Tsunanari,
    Yagyu Toshinobu, Tokugawa Yoshimichi, Yagyu Toshitomo, Yagyu Toshiharu, Tokugawa Haruyuki, Yagyu
    Toshiyuki, Yagyu Toshihisa, Tokugawa Naritomo, Yagyu Toshimasa, Yagyu Toshishige, Tokugawa
    Yoshikatsu, Yagyu Toshikane, Yagyu Toshinaga, Yagyu Toshimichi, Yagyu Koichi Toshinobu (22nd).
notes: >-
  Readings of the Owari heads' names are this record's, from the kanji on the school's page
  (柳生新陰流兵法剣術). The Field Guide's founding date ("Muromachi period, ca. 1658") is
  self-contradictory and is not used. Present head per the Field Guide (1997) and the school's page:
  22nd soke Yagyu Koichi.
