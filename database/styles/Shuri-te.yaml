description:
  en: Shuri-te was a pre-World War II term for the indigenous martial art tradition of the Shuri region
    of Okinawa, the old capital of the Ryukyu Kingdom. Associated teachers include Sakugawa Kanga, Matsumura
    Sokon, Itosu Anko, and Funakoshi Gichin. It is one of the three regional Okinawan te traditions -
    alongside Naha-te and Tomari-te - from which modern karate styles descended; its direct successors
    include Shotokan, Shito-ryu, and Shorin-ryu.
