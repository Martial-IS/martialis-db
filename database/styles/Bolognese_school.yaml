description:
  en: >-
    The fencing tradition of Bologna, named after Lippo (Filippo) Dardi, who opened a school there in
    the 1410s. It taught armed and unarmed combat with the single-handed side sword and its companion
    arms, two-handed swords and polearms, with many guards, long solo drills and paired sequences. It is
    known from the sixteenth-century books of Guido Antonio de Luca's students Manciolino and Marozzo,
    and from Viggiani; Agrippa and the rapier masters grew out of it.
notes: >-
  Dardi's licence: 1412 (Wiktenauer); founding of the school: 1415 (en Wikipedia). Green and Svinth call
  him both Lippo di Bartolomeo Dardi (p. 246) and Bartolomeo de Lippo Dardi (p. 249).
