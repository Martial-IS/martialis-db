description:
  en: 'The branch of taekwondo governed by the International Taekwon-Do Federation (ITF), founded by Choi Hong-hi in 1966. ITF Taekwondo emphasizes a traditional approach with sine wave motion, patterned movements (tul), and a distinctive set of forms. It is practiced in over 120 countries and is distinct from the Olympic/WT style in its forms, terminology, and training methodology. General Choi Hong-hi is recognized by ITF organizations as the principal founder of taekwondo.

'
