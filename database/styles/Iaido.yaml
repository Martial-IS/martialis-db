name:
  en: Iaido
  ja-Latn: Iaidō
  ja: 居合道
description:
  en: 'Iaidō (居合道) is a modern Japanese budo art that emphasizes being aware and capable of

    quickly drawing the sword and responding to sudden attacks. Iaido practice is performed

    primarily solo in the form of kata, which involve executing techniques against one or

    more imaginary opponents: drawing the sword from its scabbard (nukitsuke), cutting

    (kiritsuke/kirioroshi), shaking blood from the blade (chiburi) and returning the sword

    to the scabbard (noto). The term ''iaido'' first appeared in 1932 and was popularized by

    Nakayama Hakudo, emerging from the koryu drawing art iaijutsu. Iaido is an intrinsic

    form of Japanese modern budo, drawing on koryu forms such as Musō Jikiden Eishin-ryū,

    Mugai-ryū, Shindō Munen-ryū, Suiō-ryū and Hōki-ryū.

    '
  pt: 'O Iaidō (居合道) é uma arte moderna japonesa de budo que enfatiza estar atento e ser

    capaz de desembainhar rapidamente a espada e responder a ataques súbitos. A prática do

    iaido é feita principalmente a solo sob a forma de kata, que envolvem a execução de

    técnicas contra um ou mais adversários imaginários: desembainhar a espada (nukitsuke),

    cortar (kiritsuke/kirioroshi), sacudir o sangue da lâmina (chiburi) e devolver a espada

    à bainha (noto). O termo ''iaido'' apareceu pela primeira vez em 1932 e foi popularizado

    por Nakayama Hakudo, emergindo da arte koryu de desembainhar, o iaijutsu. O iaido é uma

    forma intrínseca do budo moderno japonês, baseando-se em formas koryu como Musō Jikiden

    Eishin-ryū, Mugai-ryū, Shindō Munen-ryū, Suiō-ryū e Hōki-ryū.

    '
