name:
  en: Iaido
  ja-Latn: Iaidō
  ja: 居合道
description:
  en: >-
    Modern Japanese budo of drawing the sword and responding at once to a sudden attack, trained
    mostly alone through kata against imagined opponents. A kata runs through the draw
    (nukitsuke), the cut (kiritsuke/kirioroshi), shaking off the blood (chiburi) and the return
    to the scabbard (noto). The word 'iaido' dates from 1932 and was popularised by Nakayama
    Hakudo; the art grew from koryu iaijutsu, including Musō Jikiden Eishin-ryū, Mugai-ryū,
    Shindō Munen-ryū, Suiō-ryū and Hōki-ryū.
  pt: >-
    Budo japonês moderno de desembainhar a espada e responder de imediato a um ataque súbito,
    treinado sobretudo a solo, em kata contra adversários imaginários. Um kata percorre o saque
    (nukitsuke), o corte (kiritsuke/kirioroshi), o gesto de sacudir o sangue (chiburi) e o
    regresso à bainha (noto). A palavra 'iaido' data de 1932 e foi popularizada por Nakayama
    Hakudo; a arte nasceu do iaijutsu koryu, incluindo Musō Jikiden Eishin-ryū, Mugai-ryū,
    Shindō Munen-ryū, Suiō-ryū e Hōki-ryū.
