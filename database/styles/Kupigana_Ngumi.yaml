description:
  en: >-
    Afrikan-centred martial art developed by Nganga Tolo-Naa and Mfundishi Maasi from the late 1960s,
    drawing on the karate of Count Dante and James Cheatham, the Yang-style taijiquan of Hou Chi Kwang,
    the qigong of Alan Lee and the American Bando of Maung Gyi.
