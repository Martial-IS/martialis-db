description:
  en: 'Shorin-ryu (少林流) is one of the major modern Okinawan martial arts, an umbrella term

    for the schools descended from the Shuri-te tradition of Matsumura Sokon and Anko

    Itosu, combining Shaolin kung fu elements with the native Shuri-te fighting style.

    It diverged into many schools, including Kobayashi Shorin-ryu (Chibana Choshin),

    Matsubayashi-ryu (Nagamine Shoshin) and Shobayashi Shorin-ryu (Shimabuku Eizo).

'
