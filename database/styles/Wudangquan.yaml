description:
  en: 'Wudangquan is a class of Chinese martial arts, named after the Wudang Mountains. It is one

    of the two major groups of Chinese martial arts alongside Shaolin, representing the internal

    (neijia) tradition. Its core styles include tai chi, xingyiquan, and baguazhang, which

    emphasize using the focused mind to control the body rather than brute force.

'
  zh: '武當拳是中國武術的一大門派，以武當山命名，與少林派並列為中國武術兩大流派。

    武當拳屬內家拳，核心拳種包括太極拳、形意拳和八卦掌。

'
