description:
  en: >-
    Classical school of naginata for armoured combat, tracing to Toda Seigen, a retainer of Asakura
    Yoshikage who inherited the main line of Chujo-ryu (Toda-ryu); carried by the Sakuya family and,
    from the 14th head, by women headmasters. Named Toda-ha Buko-ryu by the 13th head, Sakuya Ryosuke
    Takeyuki. Heads (its own page) end with the 19th Nitta Suzuyo, Nakamura Yoichi, and the 21st,
    Kenjo Hisayo.
notes: >-
  Readings of heads' names are this record's. Green and Svinth (p. 159) note Yazawa Isako, the 16th head
  in the school's list, introducing Buko-ryu naginata at Japan Women's University in 1901.
