description:
  en: >-
    Gyokushin-ryū (玉心流) is a koryu jujutsu style noted for its wide range of sacrifice throws
    (sutemiwaza), founded in the Edo period by Sasaki Goroemon (佐々木五郎衛門) and extinct after its
    last headmaster Sanjuro Oshima. The name means 'spherical spirit' - like a ball, one's
    spirit is free to roll in all directions. Minoru Mochizuki trained in it in Tokyo in the
    mid-1920s while at Sampo Toku's dojo, and drew from it the inspiration for the sutemi waza
    that later characterized his Yoseikan. Yoseikan budo partially descends from this style.
    Note: the Gyokushin-ryu kossōjutsu whose soke Hatsumi Masaaki claims, founded by Sasaki
    Sadaatsu of the Muromachi period, is a different school of the same name.
