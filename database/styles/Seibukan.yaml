description:
  en: 'Seibukan (聖武館, "Holy Art School") is the school of Shorin-ryu karate

    founded by Zenryo Shimabukuro in 1962. Shimabukuro studied under Chotoku

    Kyan from 1932 to 1945 and taught karate out of his home after World War

    II; he was awarded a 10th dan in 1964 within the Okinawan Karate-do United

    Association.

'
