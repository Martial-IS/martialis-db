description:
  en: 'Wrestling here denotes the Western/international grappling lineage

    that converged into the modern Olympic and folk wrestling forms - Greco-Roman, freestyle,

    folkstyle, catch, and submission wrestling. It is one of the oldest human combat disciplines,

    appearing in the ancient Olympic Games in 708 BC. National and regional wrestling traditions

    outside this lineage - Chinese shuai jiao, Mongolian bökh, Japanese judo and sumo, and others -

    are separate styles, even though English usage sometimes groups all of them under the single word "wrestling".

    '
