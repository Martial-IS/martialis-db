description:
  en: >-
    Iaijutsu school transmitted in Tosa domain: the Shimomura-ha line of the Hasegawa Eishin-ryū, popularly 下村派 as against the Tanimura-ha (無双直伝英信流), with which it was originally the same school. Traced to Hayashizaki Jinsuke Shigenobu in the late Sengoku period (JA wiki). Its fifteenth-generation headmaster Hosokawa Yoshimasa, who held the menkyō kaiden from Shimomura Shigeichi, granted menkyō kaiden to Ueda Heitarō; in 1931 Ueda renamed the transmission 無双神伝抜刀術兵法 (Musō Shinden Battōjutsu Heihō) and became its seventeenth head, passing it to Ogata Gōichi in 1949 (JA wiki). Distinct from the similarly named Musō Shinden-ryū that Nakayama Hakudō created in 1933 out of the same Tosa Eishin-ryū material.
  ja: >-
    土佐に伝わった居合を中心とする流派で、長谷川英信流の下村派。無双直伝英信流（谷村派）と元々は同じ流派。 流祖は林崎甚助。十五代宗家細川義昌が植田平太郎に免許皆伝を授け、植田は1931年に無双神伝抜刀術兵法と称して 十七代を継承、1949年に尾形郷一に伝えた。1933年に中山博道が同じ土佐英信流から興した夢想神伝流とは別の流派。
