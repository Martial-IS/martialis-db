notes: >-
  Tohoku line founder Takenaga Hayato (c. 1640, served Yagyu Munenori) and Edo line founder Araki
  Mataemon (1584-1637, a student of Munenori per the Field Guide); the record carries no single
  founder. Edo line heads (Kobudo Kyokai page) end with the 11th, Kajitsuka Yasushi; the Tohoku line
  is headed by the Hoshi family.
