name:
  en: Muso Shinden Ryu
  ja-Latn: Musō Shinden Ryū
  ja: 夢想神伝流
description:
  en: 'Musō Shinden Ryū (夢想神伝流) is the iaido school created by Nakayama Hakudo in 1933,

    restructuring the Tosa Eishin-ryū iai he had learned from Hosokawa Yoshimasa and

    Morimoto Tokumi in Kochi. Alongside kendo it is one of the two arts practised by the

    Yushinkan students, and it is the iaido style most widely practised today. Practitioners

    of Musō Shinden Ryū are iaido practitioners.

'
  pt: 'O Musō Shinden Ryū (夢想神伝流) é a escola de iaido criada por Nakayama Hakudo em 1933,

    reestruturando o iai Tosa Eishin-ryū que tinha aprendido com Hosokawa Yoshimasa e

    Morimoto Tokumi em Kochi. A par do kendo é uma das duas artes praticadas pelos alunos do

    Yushinkan, e é o estilo de iaido mais praticado na atualidade. Os praticantes de Musō

    Shinden Ryū são praticantes de iaido.

'
