description:
  en: >-
    Okinawan karate style of Juhatsu Kyoda, named after his teacher Kanryo Higaonna (東恩納). Close to
    Goju-ryu but with its own kata syllabus and execution; it adds Jion (from Yabu Kentsu) and Neipai
    (from Wu Xiangui).
