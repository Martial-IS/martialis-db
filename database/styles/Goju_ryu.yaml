description:
  en: 'Goju-ryu (剛柔流, "hard-soft style") is one of the main traditional Okinawan styles of

    karate, founded by Chojun Miyagi in 1930 on the Naha-te tradition of his teacher

    Higaonna Kanryo. It combines hard, linear strikes with soft, circular open-hand

    techniques, joint locks and throws, and emphasizes breathing in the core kata

    Sanchin and Tensho.

'
