description:
  en: >-
    Thai full-contact martial art and combat sport, also called Thai boxing, known as the 'Art
    of Eight Limbs' for striking with fists, elbows, knees and shins, alongside sweeps and
    clinch work. It spread worldwide in the late 20th century. The International Federation of
    Muaythai Associations (IFMA), recognised by the International Olympic Committee, governs it.
  th: มวยไทยเป็นศิลปะการต่อสู้และกีฬาการต่อสู้แบบเต็มรูปแบบของไทย ใช้การโจมตีแบบยืน การกวาด และการคลินช์ รู้จักกันในชื่อ 'ศิลปะแห่งแปดแขนขา' เนื่องจากใช้หมัด ศอก เข่า และแข้งร่วมกัน
