description:
  en: Okinawan Kobudō is the weapons system of Okinawan martial arts, encompassing traditional weapons such as the bō (staff), sai (trident), tonfa (handled club), kama (sickle), and nunchaku. It developed alongside karate in the Ryukyu Kingdom and was systematized in the 20th century by masters such as Taira Shinken and Moden Yabiku.
