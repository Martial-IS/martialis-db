name:
  en: Kyudo
  ja-Latn: Kyūdō
  ja: 弓道
description:
  en: 'Kyūdō (弓道) is the Japanese martial art of archery, practised with the asymmetrical

    wakyū (Japanese bow) of over two metres, gripped at the lower third of the stave. It

    is based on kyūjutsu, the archery art of the samurai class of feudal Japan; the name

    was officially changed from kyūjutsu to kyūdō in 1919, and, following the example of

    other martial arts systematizing for educational purposes, the various forms of

    shooting in use until then were reorganized and integrated. Alongside its budo

    character as training of body and mind, kyūdō today also carries the aspects of a

    sport and of school physical education. Practitioners may refer to themselves as

    yumihiki (弓引き), "ones who draw the bow".

    '
