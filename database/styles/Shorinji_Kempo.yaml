description:
  en: >-
    Japanese martial art founded in 1947 by So Doshin (Nakano Michiomi), combining strikes, joint locks,
    throws and pressure points with Zen Buddhist practice. It claims the legacy of the Shaolin Temple;
    a 1972 court ruling made it change its name to Nippon Shorinji Kempo, and Draeger saw Hakko-ryu
    jujutsu in its techniques.
