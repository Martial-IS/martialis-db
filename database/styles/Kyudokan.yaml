description:
  en: 'Kyudokan is the school of Kobayashi Shorin-ryu karate founded by Yuchoku

    Higa, who studied under Choshin Chibana from 1948, received 9th dan from

    him in 1965 and was awarded Hanshi 10th dan in 1976. Higa also served as

    president of the Okinawa Prefecture Karatedo Federation and the All Okinawa

    Karatedo Federation.

'
