description:
  en: Naha-te was a pre-World War II term for the indigenous martial art tradition of the Naha region
    of Okinawa, the old commercial city of the Ryukyu Kingdom. It is most associated with Higaonna Kanryo,
    who studied Fujianese martial arts in China before returning to teach in Naha, and with his student
    Miyagi Chojun. It is one of the three regional Okinawan te traditions - alongside Shuri-te and Tomari-te
    - from which modern karate styles descended; its direct successors include Goju-ryu, Uechi-ryu, and
    Ryuei-ryu.
