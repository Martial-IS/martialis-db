description:
  en: >-
    Kenjutsu school (一刀流, 'one-sword school') developed by Itō Ittōsai Kagehisa, and the source
    of many later styles: Ono-ha, Mizoguchi-ha, Nakanishi-ha, Kogen, Hokushin, Itto Shoden and
    Mugai-ryu. Recorded here as the kenjutsu school practiced by Miozo Mochizuki, the father of
    Minoru Mochizuki, per the Dragon Magazine interview.
