description:
  en: >-
    The Italian tradition of the sword and other edged weapons, from Fiore dei Liberi's Fior di
    Battaglia (1409) and Filippo Vadi through the Bolognese masters and the rapier masters Agrippa,
    Capoferro, Giganti and Fabris to classical fencing. It favours certain guards, attention to time
    (tempo) and the thrust.
