description:
  en: >-
    The Spanish tradition of fencing of the early modern period, mainly with the rapier, based on reason,
    geometry and classical philosophy. Jerónimo Sánchez de Carranza set it out in his treatise of 1569
    (printed 1582); his student Luis Pacheco de Narváez spread it and later split it into Carrancistas
    and Pachequistas. It used a single straight-arm guard and circular footwork, and lasted about two
    centuries.
notes: >-
  Founder: Carranza per Green and Svinth and Wiktenauer; en Wikipedia's Carranza article calls him a
  precursor and gives the founding to Pacheco. Founding dated by Carranza's 1569 treatise.
