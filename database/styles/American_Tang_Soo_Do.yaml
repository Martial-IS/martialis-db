description:
  en: American Tang Soo Do is a hybrid martial art developed by Chuck Norris in 1966, combining Korean Tang Soo Do with Judo, Shito-ryu Karate, and Shotokan Karate. It was governed by the National Tang Soo Do Congress (NTC) before Norris evolved it into the Chuck Norris System. It emphasizes hard blocking, kicking, and striking techniques.
