description:
  en: 'Shorinkan is the school of Kobayashi Shorin-ryu karate founded by Shugoro

    Nakazato, who trained under Seiichi Iju (1935-1940) and Chosin Chibana

    (from 1942) and received his shihan license from Chibana in 1955 before

    opening his Nakazato Dojo at Aja, near Naha. Nakazato was designated an

    intangible cultural asset holder by Okinawa Prefecture in 2000 and awarded

    the Order of the Rising Sun, 5th Class in 2007.

'
