description:
  en: The branch of Ittō-ryū kenjutsu carried by the Nakanishi family; practitioners and the branch itself continued to
    call it "Ono-ha Ittō-ryū" (its formal lineage name), with "Nakanishi-ha" attaching as a common designation once
    headship had passed through several generations of the Nakanishi family. Takano Sakichirō, a senior disciple of the
    branch's 4th-generation head, and his grandson Takano Sasaburō both trained and taught in this line, which became a
    root of modern kendo pedagogy.
