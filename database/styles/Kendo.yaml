description:
  en: 'Kendo (剣道, Kendō, lit. ''sword way'' or ''way of the sword'') is a modern Japanese martial art,

    descended from kenjutsu (traditional Japanese swordsmanship), that uses bamboo swords (shinai)

    and protective armor (bōgu). It originated from samurai swordsmanship exercises and was

    formalized as a modern budo in the early 20th century, with the All Japan Kendo Federation

    established after World War II.

    '
