description:
  en: >-
    Classical school best known for its naginata, with sword, short sword, two swords, jo and
    kusarigama, founded by Saito Denkibo after a revelation at Tsurugaoka Hachimangu in 1581 (Tensho
    9). First called Ten-ryu. Today based at the Shubukan, Itami.
notes: >-
  The Field Guide gives the founding date as November 21, 1582; the school's own page gives Tensho 9
  (1581), month 11, day 21, of the lunar calendar. Present head per the Field Guide (1997): 16th soke
  Mitamura Takeko; Green and Svinth name Mitamura Akinori as 14th soke (Doshisha Girls' School, 1899).
  Denkibo's son Hogen continued the line as second head (Kobudo Kyokai).
