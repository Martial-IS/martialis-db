description:
  en: Tomari-te was a martial art tradition originating from Tomari village (present-day Naha City), the
    second-largest trading port of the Ryukyu Kingdom. Associated teachers include Matsumora Kosaku, Oyadomari
    Kokan, and Teruya Soeun Kishin (1804-1864). It is one of the three regional Okinawan te traditions
    - alongside Shuri-te and Naha-te - from which modern karate styles descended; it contributed to the
    development of Wado-ryu and branches of Shorin-ryu, including Matsubayashi-ryu.
