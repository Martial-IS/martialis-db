description:
  en: 'Taekwondo is a Korean martial art and combat sport involving primarily kicking techniques

    and punching. It was developed during the 1940s and 1950s by Korean martial artists with

    experience in karate and Chinese martial arts, emerging from the nine original kwans of

    Tang Soo Do. It became an Olympic sport in 2000 and is governed by World Taekwondo (WT)

    and the International Taekwon-Do Federation (ITF).

'
  ko: '태권도는 한국의 무술이자 격투 스포츠로, 주로 발차기 기술과 펀치를 사용한다.

    1940~1950년대에 걸쳐 개발되었으며, 2000년부터 올림픽 정식 종목이 되었다.

'
