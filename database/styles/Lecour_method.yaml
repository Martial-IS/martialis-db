description:
  en: >-
    The gymnastic form of French boxing founded by Charles Lecour in Paris about 1832, joining savate
    kicks with English boxing punches after his lessons with the English boxer Adams. Charles and his
    brother Hubert developed it at their salle in the passage des Panoramas; it became common in the
    1860s. Lecour never published it. Joseph Charlemont later drew on it for his academic method.
  fr: >-
    Forme gymnique de la boxe française fondée par Charles Lecour à Paris vers 1832, qui joint les coups
    de pied de la savate aux coups de poing de la boxe anglaise apprise de l'Anglais Adams. Charles et son
    frère Hubert la développent dans leur salle du passage des Panoramas ; elle se répand dans les années
    1860. Lecour ne la publie jamais.
notes: >-
  Green and Svinth (p. 257) credit the Lecour brothers; Hubert was born in 1820, so the 1832 founding is
  Charles's. Lecour's 1876 letter to Charlemont (Charlemont 1899, p. 369) says his written method was not
  yet printed.
