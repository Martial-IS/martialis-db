description:
  en: 'Shorinji-ryu (Shorinjiryu Kenkokan Karate) is a style of karate founded by

    Kori Hisataka in Kumamoto in 1945, emphasizing spiritual development through

    karate training. Hisataka studied karate under Chotoku Kyan, kobudo under

    Sanda Kanagusuku, judo at the Kodokan and Chinese martial arts in Manchuria;

    the style he created combines these influences.

'
