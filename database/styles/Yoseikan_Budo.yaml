description:
  en: 'Yōseikan Budō (養正館武道), originally Yoseikan-ryū Gyokushin Jujutsu, is a sōgō budō (総合武道, composite)
    martial art created by Hiroo Mochizuki (b. 1936), son of Minoru Mochizuki, into which various martial
    ways have been integrated: judo, aikido, karate, Gyokushin-ryū jujutsu and Tenshin Shōden Katori Shintō-ryū,
    together with western arts such as boxing and savate. Its technique is built around the ''wave'' (mouvement
    ondulatoire) movement principle, and the Yoseikan federation describes it not as a synthesis of existing
    arts but as a distinct method with its own rank system (mudansha/yudansha, blue gi, blue and white
    belt without rank marks). The name comes from Minoru Mochizuki''s Yoseikan dojo, ''the place where
    the truth is taught''. Practitioners of Yoseikan Budo are not practitioners of the source arts: rank
    is earned within the system''s own curriculum and organizations.

    '
  fr: 'Le Yoseikan Budo (養正館武道), à l''origine Yoseikan-ryu Gyokushin Jujutsu, est un art martial composite
    (sōgō budō) créé par Hiroo Mochizuki (né en 1936), fils de Minoru Mochizuki, intégrant judo, aïkido,
    karaté, jujutsu Gyokushin-ryu et Tenshin Shoden Katori Shinto-ryu, ainsi que des arts occidentaux
    comme la boxe et la savate. Sa technique repose sur le principe du mouvement ondulatoire, et la fédération
    Yoseikan le décrit non comme une synthèse d''arts existants mais comme une méthode distincte avec
    son propre système de grades (mudansha/yudansha, gi bleu, ceinture blanche et bleue sans marques).
    Le nom provient du dojo Yoseikan de Minoru Mochizuki, « le lieu où la vérité est enseignée ». Les
    pratiquants de Yoseikan Budo ne sont pas pratiquants des arts d''origine : le grade s''obtient dans
    le cadre de son propre cursus et de ses propres organisations.

    '
