description:
  en: >-
    Syncretic art of Florendo Visitacion ("Professor Vee") of New York, built on the jujutsu he learned
    from Kiyose Nakae and Charles Nelson with Filipino arnis and kali, Chinese and other Japanese arts;
    it was renamed several times, finally Visitacion Kuntao-Arnis.
hasEvidence:
  - basedOnSource: 01M61T316BSCW19RMVXAS63XHZ
    quotation: >-
      As his personal style evolved, so did its name, at one point he renamed it Vee Jitsu, Vee Jitsu Te,
      Visitacion-Ryu Jiujitsu and the final art he presented for recognition among his peers was
      Visitacion Kuntao-Arnis.
    informationType: infotype:secondary
    supports: true
    evidenceType: evidencetype:direct
