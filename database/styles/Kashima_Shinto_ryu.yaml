description:
  en: >-
    Classical school of swordsmanship of the Kashima Shrine, named by Tsukahara Bokuden, who joined
    the Kashima tradition of his birth family to Katori Shinto-ryu. Transmitted in the Urabe Yoshikawa
    family; dojo at Kashima, Ibaraki.
notes: >-
  The school counts the Kashima no tachi back to Kuninazu no Mahito and lists Bokuden in the Yoshikawa
  family succession (Kobudo Kyokai page). Ibaraki Prefecture intangible cultural property (1989).
