description:
  en: 'Matsubayashi-ryu (松林流) is a style of Okinawan karate founded in 1947 by Shoshin

    Nagamine, named in honor of Matsumura Sokon (Matsu) and Kosaku Matsumora (Bayashi),

    the masters whose teachings it is based upon. Its curriculum includes 18 kata, seven

    two-man yakusoku kumite routines, and kobudo practice. It is a school within the

    Shorin-ryu family.

'
