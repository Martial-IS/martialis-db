name:
  pt: Capoeira Angola
aka:
  pt:
    - Capoeira de Angola
styleType: styleclass:traditional
description:
  en: >-
    The traditional Bahian capoeira as named from the 1930s, in opposition to Bimba's Regional, and
    codified by Mestre Pastinha at his Centro Esportivo de Capoeira Angola: low inner game, ritual
    and a set orchestra led by the berimbau.
notes: >-
  No founder: Assunção treats Pastinha as its codifier, not its creator (ch. 6). Revived from the
  1980s by Mestre Moraes's GCAP and others (pp. 182-185).
