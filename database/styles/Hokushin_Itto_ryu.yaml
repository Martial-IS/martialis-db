description:
  en: >-
    Hokushin Ittō-ryū (北辰一刀流) is a koryū kenjutsu school of the Ittō-ryū lineage, founded by
    Chiba Shusaku (1793/1794-1856), who synthesized Hokushin Musō-ryū and Ono-ha Ittō-ryū
    Nakanishi-ha (JA wiki). Its Edo dojo, the Genbukan (established 1820 per Bennett; 1822 per the
    JA wiki), was one of the three great dojos of Edo and 'boasted thousands of students'; Chiba's
    sixty-eight techniques, recorded in Kōsaka Masataka's 1884 compilation, 'now constitute the
    fundamental modus operandi of modern kendo' (Bennett). The Mito Tobukan continued the school
    into the Meiji era, where Naitō Takaharu and Monna Tadashi trained.
  ja: >-
    北辰一刀流は千葉周作が北辰夢想流と小野派一刀流中西派を統合して創始した一刀流系の古流剣術。江戸の道場・玄武館は
    幕末江戸三大道場の一つ。明治期に水戸東武館で継承され、内藤高治や門奈正が修業した。
