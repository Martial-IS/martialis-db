description:
  en: Composite kenjutsu school assembled for the Tokyo Metropolitan Police, its ten kenjutsu kata adapted in June 1886 from ten existing ryūha and its five standing iaidō forms borrowed from five more. Still practised by some Tokyo police officers.
notes: Two of the ten contributing ryūha have no record here - Hōzan-ryū and Jigen-ryū - and Yagyū-ryū is ambiguous between the existing Yagyū Shingan-ryū and the Yagyū Shinkage line. Add those derived_from edges once the styles exist.
