description:
  en: The Chuck Norris System (formerly Chun Kuk Do) is a hybrid martial art founded by Chuck Norris in 1990. It evolved from American Tang Soo Do by incorporating techniques from Brazilian Jiu-Jitsu, Arnis, Hapkido, Taekwondo, American Kenpo, Kyokushin, and other systems. It emphasizes self-defense, competition, weapons, grappling, and fitness. It is governed by the United Fighting Arts Federation (UFAF).
