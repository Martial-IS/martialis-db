name:
  en: Hung Gar
  zh: 洪家拳
aka:
  en:
    - Hung Kuen
    - Hung Ga
styleType: styleclass:traditional
description:
  en: >-
    Southern Chinese boxing style of Guangdong. Judkins and Nielson separate the older village Hung Kuen, an
    eighteenth-century family style known only through legend, from the later lineage built by Wong
    Fei-hung and his students in Foshan, Guangzhou and Hong Kong.
notes: >-
  Judkins and Nielson pp. 76, 81-87. Founding legend: Hong Xi Guan, a student of the abbot Jee
  Shim, taught by him after the destruction of the Southern Shaolin Temple (pp. 86-87); not
  recorded. Taught with Wing Chun by the Zhong Yi Association in Foshan (p. 183).
