description:
  en: >-
    Israeli close-combat system taught in the Israel Defense Forces and, from 1964, to civilians by
    Imi Lichtenfeld at Netanya; led after his death by federations founded by his and Eli Avikzar's
    students.
hasEvidence:
  - basedOnSource: 01M5G930MN1VM84DEZNGEZP48E
    quotation: >-
      Civilian krav maga dates to the 1960s. Again, Imi Lichtenfeld was involved, as were some of his
      students, to include Haim Zut and Eli Avikzar. In 1964, after retiring from the IDF, Lichtenfeld
      began teaching krav maga to civilians at a gym in Natanya.
    locator: '585'
    locatorLabel: page
    informationType: infotype:secondary
    supports: true
    evidenceType: evidencetype:direct
