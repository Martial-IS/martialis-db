description:
  en: '10th Planet Jiu-Jitsu is a no-gi Brazilian jiu-jitsu system founded by Eddie Bravo. It is a variant of Brazilian jiu-jitsu that emphasizes a no-gi approach, with distinctive innovations in rubber guard, lockdown half guard, and twister submissions. The system was developed after Bravo''s departure from the traditional gi-based BJJ approach.

'
