description:
  en: 'Iwama Ryu (岩間流), also called Iwama Style or Iwama Shin Shin Aikido, is a line of aikido preserving
    the teaching of Morihei Ueshiba as systematised and passed on by Morihiro Saito at the Iwama dojo.
    It emphasises the close relationship between taijutsu and weapon practice (aiki-ken and aiki-jo),
    and rigorous adherence to the Iwama tradition. Following Saito''s death in 2002 his son Hitohiro Saito
    continued the teaching, creating the Iwama Shin Shin Aikishurenkai in 2004.

    '
