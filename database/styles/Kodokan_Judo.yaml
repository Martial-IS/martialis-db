description:
  en: 'Kodokan Judo is a modern martial art created by Jigoro Kano in 1882. It is a refinement and codification of jujutsu principles with an emphasis on throwing techniques, groundwork, and moral education. Judo became the first Japanese martial art to gain widespread international recognition and was inducted as an Olympic sport in 1964.

'
  ja: '講道館柔道（こうどうかんじゅうどう）は、1882年（明治15年）に嘉納治五郎 が創始した武道・スポーツ・身体鍛錬の方法。

'
