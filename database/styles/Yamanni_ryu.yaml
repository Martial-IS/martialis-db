description:
  en: 'Yamanni-ryu (also Yamanni-Chinen-ryu or Yamane-ryu) is an Okinawan bojutsu

    (staff) style named after Chinen Masami''s grandfather Sanra Chinen, known as

    Yamani Usumei or Yamane Tanmei. It is a traditional, relatively

    unmodernized weapons style passed down privately; its most prominent

    modern practitioners were Chogi Kishaba, the only active instructor of the

    style in Okinawa, and his student Toshihiro Oshiro, who brought it to the

    United States. It is the technical foundation of the Ryukyu Bujutsu Kenkyu

    Doyukai (RBKD).

    '
