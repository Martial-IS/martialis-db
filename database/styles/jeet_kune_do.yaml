description:
  en: Jeet Kune Do is a hybrid martial art conceived and practiced by Bruce Lee that centers on counterattacking an opponent in order to impede their offense. As an eclectic martial art, it draws from Wing Chun, Tai Chi, taekwondo, boxing, fencing, and jujutsu. Lee did not formally codify JKD before his death, leading to multiple interpretations including the 'JKD Concepts' and 'JKD Nucleus' branches. It is often deemed a predecessor of mixed martial arts (MMA).
