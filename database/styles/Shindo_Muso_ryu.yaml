description:
  en: 'Shindō Musō-ryū (神道夢想流), most commonly known for its practice of jodo/jojutsu, is a traditional
    koryu school of the Japanese martial art of jojutsu - the art of wielding the short staff (jo), with
    the technical purpose of defeating a swordsman in combat. It was founded by the samurai Musō Gonnosuke
    Katsuyoshi (fl. c. 1605) in the early Edo period. Its 25th and last (unofficial) headmaster was Takaji
    Shimizu (1896-1978). Jigoro Kano arranged for Minoru Mochizuki to study Shindo Muso-ryu jojutsu with
    Shimizu Takaji in 1930 (rendered ''Koji Shimizu'' in the French interviews), alongside the studies
    he arranged with Morihei Ueshiba and Hakudo Nakayama.

    '
