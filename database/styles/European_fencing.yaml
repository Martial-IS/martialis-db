name:
  en: European fencing
aka:
  en:
    - Fencing
    - European swordsmanship
    - Western fencing
styleType: styleclass:traditional
description:
  en: >-
    The European art of the sword and related weapons, as taught by masters of defence from the late
    Middle Ages: the German school of Liechtenauer, the Italian schools of Fiore dei Liberi and Bologna,
    the Spanish Destreza, the English masters of defence, and the later rapier, smallsword and classical
    schools from which the modern sport descends. Masters taught wrestling, dagger and polearms with
    the sword.
notes: >-
  Umbrella style for the historical traditions recorded as its variants. Not the same as the modern
  Olympic sport (wd:Q12100), so no sameAs; en Wikipedia notes that the medieval treatises do not stand in
  continuity with modern fencing.
hasEvidence:
  - basedOnSource: 01M5JRHX02J3PJ28A8MK97A9AW
    quotation: >-
      The oldest surviving treatise on western fencing is the Royal Armouries Ms. I.33, also known as the
      Tower manuscript, written c. 1300 in present-day Germany, which discusses the usage of the arming
      sword together with the buckler.
    informationType: infotype:secondary
    supports: true
    evidenceType: evidencetype:direct
  - basedOnSource: 01M5G930MN1VM84DEZNGEZP48E
    quotation: >-
      The first evidence of a continuous, European tradition begins two generations later, with the
      German grandmaster Johannes Liechtenauer.
    locator: '244'
    locatorLabel: page
    informationType: infotype:secondary
    supports: true
    evidenceType: evidencetype:direct
