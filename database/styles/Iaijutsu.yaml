name:
  ja-Latn: Iaijutsu
  ja: 居合術
description:
  en: 'Iaijutsu (居合術) is the combative quick-draw sword technique, one of the koryu

    (classical) disciplines of the Japanese warrior. It focuses on the drawing of the

    katana and immediate response to an attack, a counter-attack-oriented art developed

    for the relatively static applications of the warrior''s daily life rather than the

    battlefield. Originally a part of kenjutsu, it became a dedicated discipline as

    masters concentrated exclusively on the drawing of the sword. Koryu schools that

    include iaijutsu in their curriculum include Musō Jikiden Eishin-ryū, Suiō-ryū,

    Mugai-ryū, Tenshin Shōden Katori Shintō-ryū and Hōki-ryū. Its modern form is iaido.

    '
  pt: 'Iaijutsu (居合術) é a técnica combativa de desembainhar rapidamente a espada, uma das

    disciplinas koryu (clássicas) do guerreiro japonês. Foca-se no desembainhar da katana

    e na resposta imediata a um ataque, uma arte orientada para o contra-ataque, desenvolvida

    para as aplicações relativamente estáticas da vida quotidiana do guerreiro em vez do campo

    de batalha. Originalmente parte do kenjutsu, tornou-se uma disciplina dedicada à medida

    que os mestres se concentravam exclusivamente no desembainhar da espada. Escolas koryu

    que incluem iaijutsu no seu currículo incluem Musō Jikiden Eishin-ryū, Suiō-ryū, Mugai-ryū,

    Tenshin Shōden Katori Shintō-ryū e Hōki-ryū. A sua forma moderna é o iaido.

    '
