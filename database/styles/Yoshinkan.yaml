description:
  en: Yoshinkan Aikido (養神館合気道) is a style of aikido founded by Gozo Shioda in 1955. Often called the "hard" style of aikido, it emphasizes practical self-defense applications and is taught to the Tokyo Metropolitan Police. The Yoshinkan style is currently the second largest aikido organization worldwide.
