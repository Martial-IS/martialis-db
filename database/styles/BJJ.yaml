description:
  en: >-
    Grappling martial art and combat sport centred on ground fighting, where the aim is to force
    a submission through joint locks and chokes. Developed in Brazil by the Gracie family from
    about 1925, from the jujutsu and Kodokan judo that Mitsuyo Maeda taught Carlos Gracie in
    1917, and later a core discipline of MMA.
  pt: >-
    Arte marcial e desporto de combate de luta agarrada, centrados no solo, em que o objetivo é
    levar o adversário à desistência por chaves de articulação ou estrangulamentos. Desenvolvido
    pela família Gracie no Brasil, no início do século XX, ganhou projeção mundial com os
    torneios de vale tudo e de MMA dos anos 1990.
