description:
  en: >-
    Modern Japanese martial art (合気道, 合氣道) created by Morihei Ueshiba from his martial training,
    philosophy and religious beliefs, with the aim of self-defence that also spares the attacker
    from injury. Now practised in about 140 countries, in many styles, among them Aikikai,
    Yoshinkan, Shodokan Aikido, Iwama Ryu, Iwama Shin Shin Aiki Shuren Kai, Renshinkai and Ki
    Aikido.
