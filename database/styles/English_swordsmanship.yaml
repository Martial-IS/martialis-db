description:
  en: >-
    The native English art of defence taught by the London Masters of Defence and their successors:
    sword and buckler, sword and dagger, two-handed sword, quarterstaff, bill and later the backsword,
    with the rapier added after the Italian masters arrived in the 1570s–1590s. George Silver defended it
    against the rapier in 1599; the backsword and quarterstaff were still taught by eighteenth-century
    prizefighters such as James Figg.
hasEvidence:
  - basedOnSource: 01M5G930MN1VM84DEZNGEZP48E
    quotation: >-
      Even George Silver (ca. 1560s–ca. 1620s), whose works provide the only detailed study of
      Elizabethan martial arts, was quick to point out that he was a gentleman, not a professional fencing
      master.
    locator: '254'
    locatorLabel: page
    informationType: infotype:secondary
    supports: true
    evidenceType: evidencetype:direct
