description:
  en: 'Fusen-ryu (不遷流) is a koryu school of jujutsu founded by Motsugai Takeda (also known as Fusen). Its curriculum

    covers jujutsu, bojutsu, jojutsu, kenjutsu, iaijutsu, naginatajutsu, kusarigamajutsu and jittejutsu. Although

    popularly believed to be specialized in newaza (groundfighting) because of its famous master Mataemon Tanabe,

    the style actually focused on gyaku-waza (stand-up grappling), especially wrist locks; Tanabe''s ground strategy

    came from his personal contest experience. The school rose to fame in 1891 when headmaster Tanabe defeated Kodokan

    judoka Takisaburo Tobari in a challenge match, and Tanabe taught at both the Dai Nippon Butoku Kai and Yataro

    Handa''s Osaka dojo. Its most known apprentices were Taro Miyake and Yukio Tani.

'
