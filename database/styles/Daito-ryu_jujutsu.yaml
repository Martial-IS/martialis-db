description:
  en: 'Daito-ryu jujutsu (大東流柔術) is a koryu school of jujutsu founded by Handa Yataro (半田弥太郎) in Osaka
    in 1878.

    Handa trained in Sekiguchi Shinshin-ryu, Tenjin Shin''yo-ryu and Shibukawa-ryu, and devised the curriculum
    largely

    from Tenjin Shin''yo-ryu, with which it shares many technique names. He opened the Seibukan dojo at
    Dojima-ura-cho,

    Kita-ku, Osaka and established the school together with the Daito Bunbukan. Its students - Uyenishi
    Sadakazu,

    Taro Miyake, Yukio Tani and Seizo Yamamoto - took the school''s ground-grappling skills to London
    and the wider

    West from 1900, and the Fusen-ryu master Mataemon Tanabe cross-trained (degeiko) at the Seibukan,
    whose instruction

    later passed to Tanabe''s student Fushimi Tatsusaburo. Despite the similar name, it is a different
    school from the

    Daito-ryu Aiki-jujutsu lineage of Takeda Sokaku.

    '
  ja: '大東流柔術は半田弥太郎が1878年に大阪で開いた柔術の古流流派。半田は関口新心流・天神真楊流・澁川流を修行し、

    特に天神真楊流から技を考案したとされ、多くの技名が天神真楊流と共通する。大阪北区堂島裏町に盛武館を開き、

    大東文武館とともに大東流柔術を興した。門人の上西貞一・三宅多留次・谷幸雄・山本清蔵らは1900年からロンドンなど

    海外にその寝技を伝え、不遷流の田辺又右衛門も盛武館に出稽古に通い、後に田辺の門人伏見辰三郎が半田の後を継いだ。

    名称が似るものの武田惣角系の大東流合気柔術とは別流派である。

    '
