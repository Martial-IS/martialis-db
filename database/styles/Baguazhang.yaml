name:
  en: Baguazhang
  zh-Latn: Baguazhang
  zh: 八卦掌
description:
  en: >-
    Chinese internal martial art (neijia) whose name (八卦掌) means 'eight trigram palm', after the
    trigrams of the I Ching. Grouped with tai chi and xingyiquan as one of the three main arts
    of the Wudang school.
  zh: >-
    中國內家拳之一，由清末武師董海川傳出，與太極拳、形意拳合稱三大內家拳。
