description:
  en: Mixed martial arts (MMA) is a full-contact combat sport that combines striking and grappling technique from multiple disciplines - including Brazilian jiu-jitsu, wrestling, Muay Thai and boxing - under a single, codified ruleset. It emerged from early no-holds-barred contests in the 1990s and is regulated today under the Unified Rules of Mixed Martial Arts. Unlike those component arts, MMA has no rank or belt system of its own; practitioners typically train and grade in one or more of them separately.
