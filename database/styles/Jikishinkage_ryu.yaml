notes: >-
  The name dates from 1683: Japanese Wikipedia, "天和3年（1683年）、直心正統流の皆伝を授かった山田光徳は、流名を「直心影流」と改めた。"
  The school's genealogy counts back to the Sengoku period, and Skoss dates the founding to the
  late fifteenth or early sixteenth century. Its genealogy places Kamiizumi Ise-no-kami second,
  a claim Japanese Wikipedia calls the school's own.
