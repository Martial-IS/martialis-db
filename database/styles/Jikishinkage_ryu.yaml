description:
  en: >-
    Koryū kenjutsu school, formally Kashima Shinden Jikishin Kage-ryū, claiming Kashima Jingū and Kashima no Tachi as its origin (JA wiki). The traditional first head, Matsumoto (Sugimoto) Bizen-no-kami, is unverifiable; the name Jikishin Kage-ryū dates from the seventh head Yamada Mitsutoki, who renamed the school in 1683 after taking over Chikushin Shōtō-ryū (JA wiki). In the Edo period it was among the first to adopt shinai and bogu uchi-komi training, and by the late Edo period it was the most widely spread school in the country (JA wiki). The five transmitted kata are Hōtō, Tō, Kodachi, Ha-biki and Marubashi. Branches include the Chōnaga-ha, Fujikawa-ha, Danno-ha and the Otani-ha, which flourished in the late bakumatsu under Kōbusho head Otani Nobutomo; the Satsuma transmission is called Shin'ei-ryū. Meiji masters include Sakakibara Kenkichi (Otani-ha), pioneer of the public gekiken kagyō fencing exhibitions.
  ja: >-
    鹿島神傳直心影流。江戸時代に竹刀・防具の打ち込み稽古をいち早く導入し、江戸時代後期には全国に最も 広まった剣術流派。流祖は伝承上戦国の松本（杉本）備前守、流名は七代山田光徳（1683年改称）より。 分派に長沼派・藤川派・団野派・男谷派、薩摩伝は真影流。
