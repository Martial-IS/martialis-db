description:
  en: Catch wrestling (originally catch-as-catch-can) is a traditional grappling style originating in Lancashire, England, with roots in the 19th century. It emphasizes submissions, pins, and throws and was taught at the famous Snake Pit in Wigan. Catch wrestling is a foundational influence on shoot wrestling, shooto, and modern MMA, transmitted through wrestlers like Billy Riley, Karl Gotch, and their students.
