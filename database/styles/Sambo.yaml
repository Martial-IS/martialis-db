name:
  ru-Latn: Sambo
  ru: сaмбо
aka:
  ru-Latn: Samozashchita bez oruzhiya
  ru: самозащита без оружия
description:
  en: >-
    Martial art and combat sport of Soviet origin, developed for Red Army hand-to-hand combat in
    the early 1920s. The name (Russian: самбо) abbreviates samozashchita bez oruzhiya,
    'self-defence without weapons'. It draws on judo, jiu-jitsu and several wrestling styles,
    and UWW recognises it as a style of amateur wrestling. Vasili Oshchepkov is counted among
    its founders.
