description:
  en: >-
    The German school of the longsword and related weapons, wrestling and dagger, in and out of armour,
    taught in the Holy Roman Empire from the late fourteenth to the seventeenth century in the tradition
    of Johannes Liechtenauer. His students kept his teaching in cryptic verses (the Zettel), which later
    masters glossed; Paulus Kal listed seventeen masters of the "Society of Liechtenauer". The guilds of
    the Marxbrüder and Federfechter examined masters, and Joachim Meyer's 1570 book is its last great
    summary.
notes: >-
  The founder entry follows Green and Svinth. The Pol Hausbuch (quoted in en Wikipedia) says Liechtenauer
  did not invent the art; Green and Svinth say he synthesised the teachings of the masters he trained
  with into a new method.
