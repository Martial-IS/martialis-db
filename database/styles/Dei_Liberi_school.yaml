description:
  en: >-
    Fiore dei Liberi's art of wrestling, dagger, sword, poleaxe and spear, in and out of armour and on
    horseback, built from the teachings of Italian and German masters and set down in Il Fior di
    Battaglia (about 1409), with mnemonic numbers and animal allegories. Filippo Vadi's treatise
    (1482–1487) continues it.
notes: >-
  "Armizare" is the modern name; none of the sources used here uses it, so it is not given as an alias.
  Founding dated by Fiore's documented activity (1381–1409).
