description:
  en: Wing Chun is a concept-based martial art, a form of Southern Chinese kung fu, and a close-quarters
    system of self-defense. It is characterized by close-quarters hand-to-hand combat, rapid-fire punches,
    and straightforward efficiency. Its philosophy emphasizes capturing and sticking to an opponent's
    centerline through simultaneous attack and defense, tactile sensitivity, and using an opponent's force
    against them. There are at least eight distinct lineages, of which the Ip Man and Yuen Kay-shan lineages
    are the most prolific. The martial art was brought to Hong Kong and then the rest of the world by
    Ip Man, with Bruce Lee being his most famous student. The Ving Tsun Athletic Association, founded
    in 1967 by Ip Man and his students, helped spread Wing Chun globally.
