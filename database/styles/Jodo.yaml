description:
  en: 'Jōdō (杖道), "way of the jō", is a Japanese martial art using a short staff called a

    jō, usually about 3 to 5 feet (0.9 to 1.5 m) long. The art is similar to bōjutsu and

    is strongly focused upon defence against the Japanese sword. It is a modern budo

    whose origin is the koryu art Shintō Musō-ryū jōjutsu, founded by Musō Gonnosuke

    Katsuyoshi after his duels with Miyamoto Musashi; by shortening the bō to a jō of

    four shaku two sun one bu, Gonnosuke gained the ability to combine techniques of the

    long staff, the spear and the sword in one weapon. The older art is also known as

    jōjutsu (杖術), "art of the jō".

    '
