notes: Created to carry Miyake Tsunako's 7th dan, which had been sitting as a rank entry with no style_id.
  The underlying claim is a blog reading ("7-dan in jodo") and stays probable on her record; this Style
  entity is sourced independently from the general EN and JA Wikipedia articles on the art, not from that
  blog. Distinct from Shindo Muso-ryu , the koryu jojutsu school it derives
  from, in the same way Iaido is distinct from Iaijutsu.
