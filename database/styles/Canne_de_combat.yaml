styleType: styleclass:modern
description:
  en: >-
    French cane and staff fencing. Practised from medieval times, it was codified by nineteenth-century
    masters such as Louis Leboucher and Joseph Charlemont and taught in savate clubs. It declined after
    the First World War; Roger Lafond revived it after the Second, and Maurice Sarry wrote competition
    rules. A committee within the savate federation runs it.
  fr: >-
    Escrime française à la canne et au bâton, codifiée au XIXe siècle par des maîtres comme Louis
    Leboucher et Joseph Charlemont et enseignée dans les salles de savate ; relancée après la Seconde
    Guerre mondiale par Roger Lafond, avec des règles de compétition de Maurice Sarry.
