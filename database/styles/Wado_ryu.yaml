description:
  en: 'Wadō-ryū (和道流) is one of the four major karate styles, created by Hironori Ōtsuka (1892-1982), who merged Shindō Yōshin-ryū jujutsu (of which he held menkyo kaiden under Tatsusaburo Nakayama) with Okinawan karate learned from Gichin Funakoshi and later Kenwa Mabuni and Motobu Chōki. It places emphasis on tai sabaki, joint locks and throws alongside striking. Ōtsuka first taught karate at Tokyo University in 1929 and registered the style with the Dai Nippon Butoku Kai in 1938 as ''Shinshu Wadoryu Karate-Jujutsu'', soon shortened to Wadō-ryū.

'
