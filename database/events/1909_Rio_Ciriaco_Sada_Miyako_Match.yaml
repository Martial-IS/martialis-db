description:
  en: >-
    Challenge match in a pavilion on the Avenida Central, in which the capoeira Ciríaco da Silva
    beat the ju-jitsu champion Sada Miyako. The most likely account has him win with a rabo de
    arraia to the head; another has him first throw sand in his opponent's eyes.
notes: >-
  Assunção spells the Japanese champion Sada Miako. Ciríaco was then carried in triumph along the
  Avenida Central and shown to academics at the Faculty of Medicine (p. 127).
