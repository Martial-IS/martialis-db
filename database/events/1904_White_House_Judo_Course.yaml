description:
  en: The judo instruction Theodore Roosevelt received from Yamashita Yoshiaki in the White House. The naval attaché Isamu Takeshita arranged the meeting in March 1904; impressed by the demonstration, Roosevelt engaged Yamashita on the spot, and during March and April 1904 he practiced judo three afternoons a week in a ground floor White House office, then occasionally through the summer before the elections. His training partners included his sons, his private secretary, Takeshita, Secretary of War William Howard Taft, and Secretary of the Interior Gifford Pinchot.
  ja: 1904年3月、海軍武官の竹下勇の仲介で山下義韶がホワイトハウスでセオドア・ルーズベルト大統領と会見し、 その場で柔道指導が決まった。3月から4月にかけて大統領は週3回の午後、ホワイトハウス一階の執務室で稽古し、 夏の間は時折続けた後、選挙のため中断した。稽古相手は息子たち、私設秘書、竹下、陸軍長官タフト、 内務長官ピンショーら。
notes: Roosevelt's goal was weight reduction (over 220 pounds, hoping for 200 by the elections) rather than rank. Yamashita later told journalist Joseph Clarke that Roosevelt was his best pupil but "very heavy and very impetuous." Roosevelt's prior jujutsu exposure - some tricks shown in 1902 by James J. O'Brien, a former Nagasaki policeman - is separate from this course. Yamashita left Washington around May 1904 and, at Roosevelt's insistence, took the Naval Academy post instead of teaching Harvard football players.
