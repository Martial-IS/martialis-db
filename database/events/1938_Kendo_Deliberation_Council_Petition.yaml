description:
  en: >
    Petition of the Kendo Deliberation Council to the Ministry of Education, signed by seven kendo
    figures. It held that, although modern war is fought with science and technology, final victory
    comes only from soldiers who face the enemy and fight with the sword.
hasEvidence:
  - basedOnSource: 01M2WGNYAW6K10EEMQDG8VYGVG
    quotation: >
      the Kendo Deliberation Council petition of 1938 stated that, although modern warfare is fought with
      “science and technology,” final victory is attained only by soldiers “facing the enemy front on,
      and stabbing and cutting them.”
    informationType: infotype:secondary
    supports: true
    evidenceType: evidencetype:direct
