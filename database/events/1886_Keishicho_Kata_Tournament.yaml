  en: Police bujutsu tournament at which representatives of ten ryūha agreed a unified kenjutsu kata,
    forming the basis of the Keishi-ryū. It followed the August 1885 police kenjutsu guidelines that capped
    shinai length below four shaku and introduced a national police promotion system.
