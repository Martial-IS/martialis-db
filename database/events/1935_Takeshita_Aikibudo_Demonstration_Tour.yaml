description:
  en: In September 1935, Admiral Isamu Takeshita toured North America demonstrating aikibudo (aikido), stopping in New Orleans, San Francisco, Washington DC, and Seattle. In Washington DC he demonstrated to US newspapermen; in Seattle his partner was Yasuyuki Kumagai (5-dan, Seattle Dojo). This was the earliest documented demonstration of Ueshiba's art in North America.
  ja: 1935年9月、竹下勇海軍大将は合気柔術（合気道）を披露するため北アメリカを巡回した。ニューオーリンズ、 サンフランシスコ、ワシントンD.C.、シアトルで演武を行った。
