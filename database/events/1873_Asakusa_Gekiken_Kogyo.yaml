description:
  en: First of the paid public fencing exhibitions organised by Sakakibara Kenkichi, held over twelve days at a makeshift arena by the riverbank in Asakusa. Eighty-eight fighters competed in three ranks, the first class being ten Jikishin Kage-ryū fencers, the second thirty-six students of Sakakibara, the third forty fighters including women. Matches followed Kōbusho rules, best of three points with neutral adjudicators, and members of the public could register to challenge the fencers. Scheduled for ten days and extended by demand, it ended abruptly when a fire at the imperial palace halted all entertainment in Tokyo.
