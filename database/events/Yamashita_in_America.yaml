description:
  en: 'Yoshiaki Yamashita''s 1903-1906 mission to the United States, the first Kodokan judo instruction
    abroad: hired by the Seattle businessman Sam Hill to teach his son, Yamashita gave the first Kodokan
    judo exhibition shown to a non-Japanese audience in North America (Seattle Theatre, October 1903),
    taught President Theodore Roosevelt in the White House (March-April 1904), wrestled a private match
    against Joseph Grant (February 1905), and taught judo at the US Naval Academy (1905-1906).'
  ja: 山下義韶の1903年から1906年にかけてのアメリカ派遣。シアトルの実業家サミュエル・ヒルの依頼で渡米した山下は、 北米で初めて非日本人観客に講道館柔道を披露したシアトル劇場の演武会（1903年10月）、ホワイトハウスでの
    セオドア・ルーズベルト大統領への柔道指導（1904年3月-4月）、ジョセフ・グラントとの非公開試合（1905年2月）、 米海軍兵学校での柔道課程（1905年-1906年）を行った。
notes: Yamashita sailed from Yokohama on 23 September 1903 aboard the SS Shinano Maru with his wife Fude
  and his assistant Saburo Kawaguchi, and left the United States after the 1906 academic year (he attended
  a judo conference in Kyoto on 24 July 1906). His sponsors included several leading Japanese industrialists.
  Sam Hill's original purpose - teaching his son James Nathan - was displaced when Roosevelt took Yamashita
  for the White House and Naval Academy appointments; Hill later complained that Roosevelt had "taken
  away from Harvard my judo man without my permission or even asking."
