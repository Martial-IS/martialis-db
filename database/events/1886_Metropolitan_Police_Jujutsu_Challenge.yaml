description:
  en: 'The jujutsu matches of the 1886 Metropolitan Police (Keishichō) gekken tournament, held at the Yayoi Shrine in Shiba Park: Kodokan judoka - Yokoyama Sakujirō, Saigō Shirō, Yamashita Yoshitsugu and others - faced koryū jūjutsu men, mostly Totsuka-ha Yōshin-ryū disciples, in a series of challenge bouts. The most famous, Yokoyama against the police Ryōi Shintō-ryū instructor Nakamura Hansuke, ran 55 minutes before Superintendent-General Mishima Michitsune declared a draw. After the matches the Kodokan supplied police jūjutsu instructors (Yokoyama, Yamashita).'
  ja: 明治19年（1886年）秋、芝公園内の弥生社で行われた警視庁撃剣大会の柔術試合。講道館側は横山作次郎・西郷四郎・ 山下義韶ら十数名、古流側は戸塚楊心流門弟が大半を占めた。良移心当流の中村半助（警視庁）対横山作次郎の一戦は 55分を過ぎて三島通庸総監が引分を宣言した。この試合の後、講道館は横山・山下らを警視庁柔術師範として送り出す ことができた。
notes: 'Sources differ on the year: the Bunbukan account places the matches at the autumn Meiji 19 (1886) Yayoi Shrine police gekken tournament, and the Ryōi Shintōkai account also gives 1886 for the Nakamura–Yokoyama draw; Japanese Wikipedia dates that bout to October 1887 (Meiji 20), and Svinth''s Yamashita chronology places the Kodokan teams'' matches with the Tokyo police jujutsu club in 1883 and 1884 - possibly the same rivalry series dated differently, or earlier rounds of it. The date is recorded as 1886 per the detailed specialist account, with the disputing sources marked supports: false. Kano''s memoirs (p. 49) date the Kodokan–Totsuka contest to 1888, and their footnote (p. 50) cites Watanabe''s Meiji Budo Shi for November 8, 1885 and January 1888, suggesting several contests. The Bunbukan author also questions whether this was a formal tournament at all or a de facto Kodokan-vs-koryū challenge contest. The referee was Kudomi Tetsutarō (Shibukawa-ryū); Superintendent-General Mishima Michitsune ordered the draw. Related but distinct: Nakamura fought Tomita Tsunejirō in July 1886 at the Tenjin Shin''yō-ryū dōjō. Other Kodokan participants named by the source but not yet in the database: Munakata Itsurō, Saodai Bunzō, Iwanami Shizuya, Oda Katsutarō. Missing entities: Ryōi Shintō-ryū (a style record) and a Tokyo Metropolitan Police organization record (would allow org_ids and a Mishima official participation).'
