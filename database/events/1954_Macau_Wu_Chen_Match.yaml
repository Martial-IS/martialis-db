description:
  en: >-
    Exhibition match in Macau in early 1954 between Wu Gongyi, head of the Wu-style taijiquan
    association in Hong Kong, and Chen Kefu of Tibetan White Crane, after Wu's open challenge of
    August 1953. Held for charity after the Shek Kip Mei fire, it ended without a clear result and
    set off a boom in martial arts schools and wuxia fiction.
notes: >-
  Judkins and Nielson pp. 234-237 (after Hamm): the contract was signed on New Year's Day 1954 for
  a fight one month later; Jin Yong's first novel, The Book and the Sword (1955), followed from
  the interest it created (p. 236).
