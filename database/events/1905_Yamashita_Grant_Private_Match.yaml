description:
  en: A private match arranged by President Theodore Roosevelt on 23 February 1905 between Yamashita Yoshiaki
    and Joseph Grant, a middleweight catch-as-catch-can wrestler. Roosevelt wanted a firsthand answer
    to the jujutsu-vs-wrestling question that journalists and Russo-Japanese War propaganda had made fashionable.
    In Roosevelt's account, Yamashita choked Grant inside a minute and applied an elbow hold two minutes
    later, though Grant's strength plainly wore Yamashita down.
  ja: 1905年2月23日、セオドア・ルーズベルト大統領の手配で行われた山下義韶と中量級キャッチ・アズ・キャッチ・ キャンのレスラー、ジョセフ・グラントとの非公開試合。ルーズベルトは柔術対レスリングの実力を自ら確かめよう
    とした。大統領の記述によれば、山下は1分足らずでグラントを絞め落とし、さらに2分ほどで腕固めを極めたが、 グラントの力に山下は消耗したという。
notes: Joseph Grant does not have a Person record in the database (a professional wrestler, not a lineage
  practitioner), so he is not listed as a participant. The match was private, not a public challenge.
