description:
  en: The Strategic Air Command Combative Measures instructor training program, initiated by General Curtis
    LeMay in 1951. Selected SAC airmen were sent to Tokyo's Kodokan Judo Institute for intensive multi-art
    training in judo, karate, aikido, and police tactics. The program ran for over a decade, with the
    SAC-ARDC Yudanshakai sanctioned by the Kodokan in 1955. By 1962 SAC had over 160 black-belt combative
    measures instructors and the program produced national AAU judo champions and an Olympian (George
    Harris). The course was eventually cut in 1966 during the Vietnam buildup due to budget pressures.
