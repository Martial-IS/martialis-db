description:
  en: 'The original Carlson Gracie Jiu-Jitsu Academy in Hollywood, California. Founded by Carlson Gracie, this gym was the birthplace of the Carlson Gracie Team and produced numerous MMA fighters and BJJ champions. Joe Rogan started his BJJ training here in 1996 under the instruction of Vitor Belfort and the Carlson Gracie coaching staff.

'
