description:
  en: 'American Kickboxing Academy (AKA) is a mixed martial arts gym in San Jose, California,

    founded in 1985 by Javier Mendez. One of the pioneering MMA schools in the United

    States, it has trained prominent fighters including Daniel Cormier, Khabib

    Nurmagomedov, Cain Velasquez, Jon Fitch and Josh Koscheck. Dave Camarillo ran its

    grappling program from September 2003, where he developed Guerrilla Jiu-Jitsu, and

    Leandro Vieira has been the academy''s Brazilian jiu-jitsu head coach.

'
