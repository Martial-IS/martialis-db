description:
  en: Aikido dojo in Garden Grove, California, founded by Harry Kiyoshi Ishisaka in 1964 (first as the Westminster Aikido School, then moved to Garden Grove as the Orange County Aiki Kai). Ishisaka was its chief instructor until his death in 1978, and it was the first aikido school of Steven Seagal. The dojo was affiliated with the Ki Society International for a period before becoming independent. It hosts an annual Harry Ishisaka memorial seminar.
