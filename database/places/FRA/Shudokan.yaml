description:
  en: A Toulouse judo club that became the cradle of the Kodokan school of French judo. It was founded as the Olympo-Judo-Club, affiliated to the Budokwai of London in 1947 while Pierre Landetcheberry directed it technically; when Landetcheberry left, Georges Lasserre took over the technical direction and renamed the club Shudokan. Georges and Robert Lasserre funded study bursaries that brought Japanese judoka to Toulouse, notably Ichiro Abe, the first official envoy of the Kodokan in Europe, who arrived in November 1951 and served as technical advisor until his departure for Brussels in 1953. The club and the French professors trained under Abe there - Pierre Roussel, Jacques Belaud, Luc Levannier, Guy Pelletier - formed the core of the Kodokan-tendance opposed to the Kawaishi method, which founded the Union Fédérale des Amateurs du Judo Kodokan in October 1954.
  fr: Un club de judo toulousain devenu le berceau de l'école Kodokan du judo français. Fondé sous le nom d'Olympo-Judo-Club, il fut affilié au Budokwai de Londres en 1947 sous la direction technique de Pierre Landetcheberry ; au départ de celui-ci, Georges Lasserre prit la direction technique et rebaptisa le club Shudokan. Georges et Robert Lasserre créèrent des bourses d'études qui firent venir des judoka japonais à Toulouse, notamment Ichiro Abe, premier envoyé officiel du Kodokan en Europe, arrivé en novembre 1951 et conseiller technique du club jusqu'à son départ pour Bruxelles en 1953. Le club et les professeurs français formés sous Abe - Pierre Roussel, Jacques Belaud, Luc Levannier, Guy Pelletier - constituèrent le noyau de la tendance Kodokan opposée à la méthode Kawaishi, à l'origine de l'Union Fédérale des Amateurs du Judo Kodokan en octobre 1954.
