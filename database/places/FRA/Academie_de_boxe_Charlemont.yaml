description:
  en: >-
    French boxing and canne academy founded by Joseph Charlemont in 1887 at 24 rue des Martyrs, Paris.
    His son Charles Charlemont succeeded him and trained many teachers there; Pierre Baruzy entered it at
    13 and became its president in 1930.
notes: >-
  fr Wikipedia's Baruzy article calls it "l'académie de boxe française"; taken as the same academy,
  since he studied there under Charles Charlemont.
