description:
  en: 'A Parisian judo club, cradle of French judo, founded on 20 September 1936 at 82 rue Beaubourg by Moshé Feldenkrais with the help of his scientist colleagues from the Institut du Radium, including Frédéric Joliot-Curie, and Paul Bonét-Maury. The club was directed by two vice-presidents, Feldenkrais and Bonét-Maury, with Jigoro Kano as honorary president; at its official creation in 1936 Kano attended as a member of the Committee of Honor. In 1937 the club merged with the Club Franco-Japonais, founded by Mikinosuke Kawaishi in July 1936, retaining the JJCF name, with Kawaishi as chief instructor (Martin''s thesis dates the merger to the 1939 mobilisation); by the Occupation years it was located at rue Thénard in the Latin Quarter, with Bonét-Maury as president and Kawaishi as professor. From 1942 the club joined the Fédération française de lutte as a specialised judo section, through Bonét-Maury''s administrative work; under the Occupation it held low-key public demonstrations, trained practitioners on Kawaishi''s method (including the color belt system) and, in late May 1943, its section organised the first French judo championship at the Salle Wagram (3,000 spectators; Jean de Herdt first champion), followed by a second championship on 9 May 1944 at the Palais de Glace. According to English Wikipedia the club still exists today.

'
  fr: 'Club de judo parisien, berceau du judo français, fondé le 20 septembre 1936 au 82 rue Beaubourg par Moshe Feldenkrais avec l''aide de ses collègues scientifiques de l''Institut du Radium, dont Frédéric Joliot-Curie, et de Paul Bonét-Maury. Le club était dirigé par deux vice-présidents, Feldenkrais et Bonét-Maury, avec Jigoro Kano comme président d''honneur ; lors de sa création officielle en 1936, Kano assista comme membre du comité d''honneur. En 1937, le club fusionna avec le Club Franco-Japonais, fondé par Mikinosuke Kawaishi en juillet 1936, en conservant le nom de JJCF, avec Kawaishi comme instructeur principal (la thèse de Martin date la fusion de la mobilisation de 1939) ; pendant l''Occupation, il était installé rue Thénard au Quartier Latin, avec Paul Bonét-Maury comme président et Kawaishi comme professeur. À partir de 1942, le club rejoignit la Fédération française de lutte comme section spécialisée de judo, grâce au travail administratif de Bonét-Maury ; sous l''Occupation, il organisa des démonstrations publiques discrètes, forma ses membres à la méthode Kawaishi (dont le système de ceintures de couleurs) et, fin mai 1943, sa section organisa le premier championnat de France de judo à la salle Wagram (3 000 spectateurs ; Jean de Herdt premier champion), suivi d''un deuxième championnat le 9 mai 1944 au Palais de Glace. Selon Wikipédia (en), le club existe toujours aujourd''hui.

'
