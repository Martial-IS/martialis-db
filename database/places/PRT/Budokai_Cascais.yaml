description:
  en: The Budokan of Portugal was the dojo Georges Stobbaerts opened in Cascais in 1972, which marked his definitive settlement in Portugal after years of commuting from Morocco. A second venue followed in Lisbon (Alcântara). It hosted seminars with Japanese masters, including Hirokazu Kobayashi, and was the base of the TenChi school in the 1970s, where early students such as Leopoldo Ferreira trained.
  pt: O Budokan de Portugal foi o dojo que Georges Stobbaerts abriu em Cascais em 1972, que marcou a sua fixação definitiva em Portugal após anos de ponte com Marrocos. Seguiu-se uma segunda sala em Lisboa (Alcântara). Acolheu estágios com mestres japoneses, incluindo Hirokazu Kobayashi, e foi a base da escola TenChi nos anos 1970, onde treinaram alunos como Leopoldo Ferreira.
