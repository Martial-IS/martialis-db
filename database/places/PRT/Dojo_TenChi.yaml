description:
  en: The Dojo TenChi was the cultural centre and dojo built by Georges Stobbaerts and his students in the Várzea of Sintra, Portugal, starting in 1981. It comprised two practice halls (500 m² and 120 m²) within a 2.5 hectare garden, and was the seat of the TenChi International school. It organized conferences and seminars with great masters from India and Japan on science, philosophy, art and the budo, alongside regular aikido classes and the Tenchi Tessen.
  pt: O Dojo Ten-Chi foi o centro cultural e dojo construído por Georges Stobbaerts e pelos seus alunos na Várzea de Sintra, Portugal, a partir de 1981. Compreendia duas salas de prática (500 m² e 120 m²) integradas num jardim de 2,5 hectares, e foi a sede da escola TenChi International. Organizava conferências e estágios com grandes mestres da Índia e do Japão sobre ciência, filosofia, arte e o Budo, além de aulas regulares de Aikido e do Tenchi Tessen.
