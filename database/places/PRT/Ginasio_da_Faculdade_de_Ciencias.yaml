  en: Gymnasium of the Faculty of Sciences of the University of Lisbon, the main dojo (honbu) of the Associação Portuguesa Aiki-Shuren Dojo, where Tristão da Cunha has taught Iwama Ryu aikido. In the 2003 dojos list it was the venue with the most instructors.
  pt: Ginásio da Faculdade de Ciências da Universidade de Lisboa, o dojo principal (honbu) da Associação Portuguesa Aiki-Shuren Dojo, onde Tristão da Cunha ensina Aikido Iwama Ryu. Na lista de dojos de 2003 era o local com mais instrutores.
