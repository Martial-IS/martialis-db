description:
  en: Sports group of the National Statistics Institute in Lisbon, whose aikido dojo, founded in 1980, was the first Aikikai-only dojo in Portugal. Authorised through an endorsed Aikikai certificate, it was the dojo through which Luís Antunes was admitted as a direct student of Nobuyoshi Tamura. Antunes began teaching there in 1981.
  pt: Grupo desportivo do Instituto Nacional de Estatística em Lisboa, cujo dojo de Aikido, fundado em 1980, foi o primeiro dojo exclusivamente Aikikai em Portugal. Autorizado através de um certificado Aikikai endossado, foi o dojo através do qual Luís Antunes foi admitido como aluno direto de Nobuyoshi Tamura. Antunes começou a dar aulas aí em 1981.
