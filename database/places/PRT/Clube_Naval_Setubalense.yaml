description:
  en: Nautical and multi-sport club in Setúbal founded on 6 May 1920, currently offering rowing, sailing, swimming, handball, gymnastics and adapted sport. It does not currently offer aikido, but is the historical venue where Misao Honda gave his first demonstration in Portugal on 10 May 1975, giving rise to the first Aikido Aikikai school in the country, and where Orlando Marques Pereira began aikido in July 1975.
  pt: Clube náutico e polidesportivo de Setúbal fundado a 6 de maio de 1920, atualmente com remo, vela, natação, andebol, ginástica e desporto adaptado. Não oferece atualmente Aikido, mas é o local histórico onde Misao Honda fez a sua primeira demonstração em Portugal em 10 de maio de 1975, dando origem à primeira escola de Aikido Aikikai do país, e onde Orlando Marques Pereira iniciou o Aikido em julho de 1975.
