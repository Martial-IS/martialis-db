description:
  en: 'The Academia de Budo, founded on 23 February 1958 by Mestre António Hilmar Schalck Corrêa Pereira in Entrecampos, Lisbon, was the first martial arts club in Portugal and the historical honbu dojo of the União Portuguesa de Budo (UBU). It was the cradle of aikido in Portugal: Misao Honda taught there in 1971-72, after which Leopoldo Ferreira took over the aikido section, and it was where aikido was first introduced in 1965 at the request of its director, Dr. Pires Martins. The Academia closed in the 1980s.'
  pt: 'A Academia de Budo, fundada a 23 de fevereiro de 1958 pelo Mestre António Hilmar Schalck Corrêa Pereira em Entrecampos, Lisboa, foi o primeiro clube de artes marciais em Portugal e o honbu dojo histórico da União Portuguesa de Budo (UBU). Foi o berço do Aikido em Portugal: Misao Honda aí ensinou em 1971-72, tendo depois Leopoldo Ferreira assumido a secção de Aikido, e foi onde o Aikido foi pela primeira vez introduzido em 1965 a pedido do seu diretor, o Dr. Pires Martins. A Academia encerrou na década de 80.'
