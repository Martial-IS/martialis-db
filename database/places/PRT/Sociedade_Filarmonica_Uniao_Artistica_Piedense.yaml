description:
  en: Multi-sport recreational and cultural association in Cova da Piedade, Almada, founded on 23 October 1889, whose aikido programme (offered alongside judo and iaido) is run under the Associação Cultural Portuguesa de Aikido (ACPA) and has been taught by Agostinho Vaz since 1992.
  pt: Associação recreativa, desportiva e cultural em Cova da Piedade, Almada, fundada a 23 de outubro de 1889, cujo programa de Aikido (oferecido a par do Judo e do Iaido) decorre sob a Associação Cultural Portuguesa de Aikido (ACPA) e é lecionado por Agostinho Vaz desde 1992.
