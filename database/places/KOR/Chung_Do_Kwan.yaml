description:
  en: >-
    The first tangsu-do (karate) school in Korea, founded by Lee Won-kuk in 1944; one of the five original
    kwan of taekwondo. Son Duk-sung succeeded Lee as its head. The Korean army's taekwondo of the late
    1950s was based on it.
notes: >-
