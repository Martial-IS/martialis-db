description:
  en: >-
    Karate school founded at the YMCA by Yoon Byung-in in 1946 as the YMCA Kwŏnbŏp Bu, later the Chang Moo
    Kwan; one of the five original kwan of taekwondo. After Yoon disappeared in the Korean War, Lee Nam-suk
    and Kim Soon-bae led it.
