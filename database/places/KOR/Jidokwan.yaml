description:
  en: >-
    The karate division (Kwŏnbŏp Bu) of the Chosŏn Yŏn-Mu Kwan, a judo club, founded by Chun Sang-sup in
    1946; one of the five original kwan of taekwondo. It closed when Chun disappeared in the Korean War;
    Yoon Kwe-byung and Lee Chong-woo reopened it and renamed it Jidokwan. Under Yoon it took up bōgu
    full-contact sparring.
notes: >-
  Renaming year: 1951 (Mönig) or 1953 (Green & Svinth). Treated as one establishment, as both sources say
  "reopened"/"renamed". No source gives the city, so the site is country-level.
