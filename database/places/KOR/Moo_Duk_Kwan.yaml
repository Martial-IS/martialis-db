description:
  en: >-
    School founded by Hwang Kee; one of the five original kwan of taekwondo. Hwang called its art hwasu-do,
    then Tang Soo Do from 1947 and Soo Bahk Do from the late 1950s.
notes: >-
  Founding date disputed: 9 November 1945 is Hwang's own date; his senior students Kim Young-duk and Choi
  Hee-suk say the early 1950s (Segarra); Green & Svinth say formally organized in 1947. No source gives the
  city, so the site is country-level (Segarra places Hwang's early training at the Railway Bureau in
  Yongsan).
