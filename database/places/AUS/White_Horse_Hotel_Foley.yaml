description:
  en: >-
    Larry Foley's boxing school at his White Horse Hotel, George Street, Sydney, opened after his 1879
    win over Abe Hicken, with Jem Mace as an instructor. Bob Fitzsimmons, Peter Jackson, Young Griffo and
    Frank Slavin trained there, and Foley's Ironpot Stadium behind the hotel used the Queensberry Rules.
