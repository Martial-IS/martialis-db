description:
  en: Dojo in central Casablanca co-founded by Gérard Obellianne and the shotokai karateka Jean Visconti after the Budo Club du Maroc closed (its premises were bought by a company for a private school). It attracted many students.
  pt: Dojo no centro de Casablanca co-fundado por Gérard Obellianne e pelo carateca shotokaï Jean Visconti depois do fecho do Budo Club du Maroc (as instalações foram compradas por uma empresa para uma escola privada). Atraiu muitos alunos.
