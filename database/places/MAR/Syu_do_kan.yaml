      quotation: En 1970, au Budo club du Maroc, il y a eu une mésentente entre Georges Stobbaerts et maître Tamura, ce qui a fait que maître Tamura n'a plus été invité par Stobbaerts, et quand il est revenu au Maroc, il est allé avec M'Barek Alaoui et Emile Metzinger, au Syu do kan. Ces deux personnes avaient quitté Georges Stobbaerts pour créer leur club.
