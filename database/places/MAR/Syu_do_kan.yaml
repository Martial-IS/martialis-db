description:
  en: Dojo in Casablanca created in 1970 by M'Barek Alaoui and Emile Metzinger after they left Georges Stobbaerts. It followed the Tamura (Aikikai) line and is described on its Facebook page as the first aikido school in Morocco and Africa, created by Alaoui; it remains active under the Alaoui family.
  pt: Dojo em Casablanca criado em 1970 por M'Barek Alaoui e Emile Metzinger depois de deixarem Georges Stobbaerts. Seguiu a linha de Tamura (Aikikai) e é descrito na sua página de Facebook como a primeira escola de Aikido em Marrocos e em África, criada por Alaoui; permanece ativo sob a família Alaoui.
