description:
  en: The Budo Club du Maroc was the dojo founded by Georges Stobbaerts in Casablanca in 1962, the first aikido and kendo dojo in Africa. He taught martial arts and yoga there for about a decade, forming numerous students who themselves became teachers, including Daniel Laurent and M'Barek Alaoui. It was the venue of early seminars with visiting Japanese masters such as Nobuyoshi Tamura and Julien Naessens.
  pt: O Budo Club du Maroc foi o dojo fundado por Georges Stobbaerts em Casablanca em 1962, o primeiro dojo de Aikido e Kendo em África. Aí ensinou artes marciais e Yoga durante cerca de uma década, formando numerosos alunos que se tornaram professores, incluindo Daniel Laurent e M'Barek Alaoui. Foi o local de estágios com mestres japoneses de visita, como Nobuyoshi Tamura e Julien Naessens.
