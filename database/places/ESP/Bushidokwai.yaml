description:
  en: The first judo club in Spain, founded in Madrid in May 1950 as the Asociación Española de Judo y Jiu-jitsu by Alfredo San Bartolomé with Fernando Franco de Sarabia and Antonio Burrieza Jiménez, and renamed Club Bushidokwai shortly after. It moved from Calle Recoletos 4 to Calle Donoso Cortés 53 in 1954 and is still operating, making it the oldest Spanish judo club.
