description:
  en: Military academy of the Tokugawa shogunate in Edo, founded in 1856 to train shogunal retainers and closed in 1866. At its height it employed over five hundred instructors of kenjutsu, sōjutsu and kyūjutsu, more than two-thirds of them teaching sword or spear. It would grant a rank on merit to a fencer who defeated a ranked opponent from an established school, and barred masters not of warrior stock from its posts.
notes: Ōtani Seiichirō Nobutomo is described elsewhere as its head; find a quotable statement and add the role.
