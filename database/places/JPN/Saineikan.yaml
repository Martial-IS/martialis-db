description:
  en: Budo hall inside the Tokyo Imperial Palace grounds, run by the Imperial Palace Police (Kyucho). First completed in September 1883 at Kioicho as an Imperial Household Ministry venue for sword and spear, transferred to the Palace Police in 1894, damaged in the 1923 earthquake, and rebuilt within the Otemon gate in December 1933. Home of the 'Sainei Sando' (kendo, judo, kyudo) practised by the Imperial Palace guards and the venue of imperial-review tournaments (tenran shiai); Nakayama Hakudo served there as kendo instructor in the prewar era. Yukio Mishima trained kendo and iaido here from the late 1960s and gave his final public lecture for the Palace Police's 84th anniversary at their headquarters in May 1970.
