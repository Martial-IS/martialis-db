  en: 'Private university in Tokyo founded in 1900. Its karate club, founded around 1924, produced prominent Shotokan karate instructors including Masatoshi Nakayama, Hirokazu Kanazawa, Hidetaka Nishiyama, and Mas Oyama, many of whom went on to senior roles in the Japan Karate Association.

'
