description:
  en: Kendo and iaido dojo in Tokyo, headed by Nakayama Hakudo after the Shindo Munen-ryu lineage of Negishi Shingoro, and the home of Nakayama's iaido teaching. Minoru Mochizuki studied kendo and iaido with Nakayama there in the late 1920s. In 1930 Gichin Funakoshi's karate teaching base was set up nearby, and Nakayama offered the Funakoshis the use of the dojo when it was unoccupied.
