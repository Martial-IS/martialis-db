description:
  en: Aikido dojo in Jūsō, Yodogawa-ku, Osaka, currently headed by Miyako Fujitani. Its origins go back to a dojo (武徳館道場) founded in Kobe in 1969 by the father of the Jūsō aikido master, moved to Jūsō, Osaka in 1972, and rebuilt as the Tenshin Dojo in 1976. In the same period it was run by Steven Seagal, making him the first non-Japanese to operate an aikido dojo in Japan.
  ja: 大阪市淀川区十三にある合氣道道場で、現道場長は藤谷美也子。1969年に神戸で創設された武徳館道場を前身とし、1972年に十三へ移設、1976年に天心道場として再建された。スティーヴン・セガールが一時道場を運営し、外国人として初めて日本で合氣道道場を主宰した人物となった。
