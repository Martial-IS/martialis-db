description:
  en: Teacher-training college in Tokyo, now the University of Tsukuba, and the rival of the Butokukai's Bujutsu Vocational College in producing specialist martial arts instructors. Kanō Jigorō became its president in 1893 and founded its gekiken club in 1896; judo, kendo and calisthenics became regular subjects in 1906, and from 1913 its three martial arts courses granted a nationally recognised teaching licence. The dan and kyū system was first used in kendo here, under Takano Sasaburō in 1908.
