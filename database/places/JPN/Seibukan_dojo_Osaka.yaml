description:
  en: 'The jujutsu dojo opened by Handa Yataro at Dojima-ura-cho, Kita-ku, Osaka in 1878, where he established

    Daito-ryu jujutsu together with the associated Daito Bunbukan. The Fusen-ryu master Mataemon Tanabe cross-trained

    here (degeiko) from 1898, and Uyenishi Sadakazu, Taro Miyake, Yukio Tani and Seizo Yamamoto trained here before

    taking jujutsu to the West. Tanabe''s student Fushimi Tatsusaburo succeeded Handa as head of the dojo. A different

    establishment from the 精武館 (Seibukan) in Kyobashi, Tokyo; an

    earlier Handa practice hall (演武場) at Dojima is attested for Meiji 6-7 (1873-74).

'
  ja: '半田弥太郎が1878年に大阪市北区堂島裏町に開いた柔術道場。ここで大東文武館とともに大東流柔術が興された。不遷流の

    田辺又右衛門は1898年から出稽古に通い、上西貞一・三宅多留次・谷幸雄・山本清蔵らもここで修行した後、海外に柔術を伝えた。

    後に田辺の門人伏見辰三郎が半田の後を継いだ。東京・京橋の精武館とは別の道場であり、

    明治6-7年（1873-74年）には堂島に半田の演武場があったことが確認されている。

'
