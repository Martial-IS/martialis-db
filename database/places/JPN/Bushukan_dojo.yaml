description:
  en: Dojo founded in 1903 in Shizuoka City (Fujimi Yokocho) by Onaga Kuro, teaching kendo together with Rikishin-ryu iai and the other arts of the school. Minoru Mochizuki entered the dojo in 1918 to begin kendo. The school is still active as of the WEB Hiden dojo guide.
