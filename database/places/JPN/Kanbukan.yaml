description:
  en: >-
    Karate school in Tokyo, founded by Yoon Kwe-byung in 1940 as a sister school of Tōyama Kanken's
    Shūdōkan. It was known for full-contact sparring in modified kendo armour (bōgu). After Yoon returned to
    Korea it was renamed Renbukan in 1950.
notes: >-
  Green & Svinth have Yoon training at the Kanbukan rather than founding it, and give the later name as
  Renbukai.
