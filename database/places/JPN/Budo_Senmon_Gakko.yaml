description:
  en: >-
    The Dai Nippon Butokukai's martial-arts teacher-training school in Kyoto, opened on 1905-10-01 as the Bujutsu Kyoin Yoseijo and renamed Budokugakko and then Bujutsu Senmon Gakko in 1911-1912 and Budo Senmon Gakko in 1919 (abbreviated Busen). Training took place in the Butokuden (武徳殿), the Butokukai's own hall. Budo teaching was abolished under the GHQ budo ban in February 1946, when the school was renamed Kyoto Bunka Senmon Gakko; it closed on 1947-01-31. Its kendo faculty was headed by Naito Takaharu as chief professor (主任教授).
  ja: >-
    大日本武徳会が京都に設立した武道教員養成学校。1905年（明治38年）10月1日に武術教員養成所として開設、 1911年に武徳学校、1912年に武術専門学校、1919年に武道専門学校（略称・武専）と改称。1946年、連合国軍の 武道禁止令により京都文科専門学校に改称・改編され、1947年1月31日に廃校となった。剣道は内藤高治が 主任教授を務めた。
