description:
  en: >-
    The original Tokyo dojo of Mas Oyama, opened in 1953 and the birthplace of Kyokushin karate. Foreign
    students such as Roger Lesourd trained directly under Oyama here. It moved into the new Kyokushinkaikan
    building in Nishi-Ikebukuro in 1964 and is today the Sohonbu (headquarters dojo) of the International
    Karate Organization Kyokushinkaikan.
  ja: '1953年に開かれた大山倍達の最初の道場であり、極真カラテ発祥の地。ロジェ・ルスールら海外の弟子が大山のもとで直接稽古し、後に国際空手道連盟極真会館の中核となった。

'
notes: >-
  Founding year: both Wikipedia articles give 1953. The IKO's own history gives May 1954 (the "Oyama
  Dojo" sign at Mejiro) and puts the dojo behind Rikkyo University from June 1956; the Kyokushin article
  puts the 1953 dojo behind Rikkyo and says Oyama renamed his school "Oyama Dojo" around 1956.
