description:
  en: Shintō Munen-ryū dojo in Edo founded by Saitō Yakurō, one of the three great fencing academies of the late Edo period, with an estimated three thousand students. Negishi Shingorō trained here from 1863 to 1866.
notes: Bennett gives the founding year as 1826 and separately says Saitō opened it at twenty-eight, which agrees. Bennett names Takasugi Shinsaku, Kido Kōin and Shinagawa Yajirō among its students, and Saitō's sons Kannosuke and Shintarō; none of the five has a record here.
