description:
  en: 'The headquarters dojo of the Japan Karate Association (JKA), built in 1955 in Yotsuya, Tokyo. It housed the JKA''s two-year specialist instructor training program (kenshusei) that graduated instructors such as Hirokazu Kanazawa, and was where foreign students including Ari Anastasiadis trained.

'
  ja: '日本空手協会（JKA）の本部道場。1955年に東京・四谷に建設され、金澤弘和らを輩出した二年制の指導員養成制度（研修生制度）が置かれ、アリ・アナスタシアディスら外国人も稽古した。

'
