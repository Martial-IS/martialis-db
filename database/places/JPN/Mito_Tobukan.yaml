description:
  en: >-
    Private kenjutsu dojo in Mito, Ibaraki, opened 1874-01-01 by Kozawa Torakichi in his own residence after the abolition of the Mito domain. Taught Hokushin Ittō-ryū kenjutsu and Shin Tamiya-ryū battojutsu; Naitō Takaharu and Monna Tadashi trained there before going on to the Keishichō and the Butokukai. One of the three great private dojos of Japan (kenshi247); private ownership has continued in the Kozawa family, and the dojo still practises kendo, iaido, naginata, Hokushin Ittō-ryū, and Shin Tamiya-ryū (JA wiki, Mito Tobukan).
  ja: >-
    水戸の私塾道場。1874年（明治7年）1月1日、小澤寅吉が自邸に開いた。北辰一刀流剣術・新田宮流抜刀術を指南し、 内藤高治・門奈正を輩出した。日本の三大私塾道場の一つ。
hasEvidence:
