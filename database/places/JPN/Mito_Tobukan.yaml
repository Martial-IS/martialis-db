    quotation: 廃藩後、日本伝統の士風の衰頽を憂い、明治7年（1874年）1月1日、自邸に道場「東武館」を開く。北辰一刀流剣術、新田宮流抜刀術を指南し、門下から内藤高治、門奈正らを輩出した。
    informationType: infotype:secondary
    supports: true
    evidenceType: evidencetype:direct
  - basedOnSource: 01M2Z6TY1P20R7J66038919FD2
    quotation: "一般財団法人水戸東武館（みととうぶかん、英語: Mito Tobukan）は、茨城県水戸市において剣道、居合道、なぎなた及び北辰一刀流剣術、新田宮流抜刀術を修練する道場「水戸東武館」を運営し、これらの伝統文化を伝承するために活動する財団法人。全日本剣道連盟、日本古武道協会に加盟している。"
    informationType: infotype:secondary
    supports: true
    evidenceType: evidencetype:direct
  - basedOnSource: 01M3016DNJE2M8WA3XYMQSHN9R
    quotation: "Of the three great private dojo in Japan (日本の３大私塾道場) – Honma Dojo (Chiba), Shubukan (Hyogo), and Tobukan (Ibaraki) – two remain extant at the time of writing this article: Shubukan and Tobukan."
    informationType: infotype:secondary
    supports: true
    evidenceType: evidencetype:direct
