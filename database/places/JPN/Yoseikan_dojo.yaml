description:
  en: The dojo founded by Minoru Mochizuki in Shizuoka City in November 1931, during his convalescence from pleurisy and tuberculosis (his hospital and convalescence costs were covered by Jigoro Kano, and his family built the dojo). Morihei Ueshiba attended the opening ceremony, along with Admiral Takeshita, General Miura, Harunosuke Enomoto and Yasuhiro Konishi. Mochizuki taught judo, aiki-jujutsu and Katori Shinto-ryu there. Rebuilt after the war in 1947; its direction was transferred to Hiroo Mochizuki in 2000.
