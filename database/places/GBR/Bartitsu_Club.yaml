description:
  en: >-
    E. W. Barton-Wright's club and academy for Bartitsu and physical therapy in a basement hall at 67b
    Shaftesbury Avenue, Soho. Its instructors included the jujutsuka Yukio Tani, Sadakazu Uyenishi and
    Seizo Yamamoto, the Swiss wrestler Armand Cherpillod and the stick-fighting master Pierre Vigny;
    Alfred Hutton's historical fencing group also met there. It closed in 1902–1903.
notes: >-
  Kaneo Tani also came over as an instructor and soon went home (en Wikipedia); not recorded. Charles
  Sefton and Archibald Corble, likely Hutton students there (en Wikipedia), are not recorded. The Tani
  evidence from Green and Svinth only calls him Barton-Wright's employee.
hasEvidence:
  - basedOnSource: 01M5G930MN1VM84DEZNGEZP48E
    quotation: >-
      Between 1899 and 1900, Barton-Wright hired self-defense specialists from Japan and Switzerland to
      help him promote and teach his “antagonistics,” as self-defense methods were then known.
    locator: '452'
    locatorLabel: page
    informationType: infotype:secondary
    supports: true
    evidenceType: evidencetype:direct
