description:
  en: 'The first jujutsu dojo in the United Kingdom, established by Sadakazu Uyenishi in 1903 at 31 Golden Square,

    Piccadilly Circus, London. Uyenishi taught jujutsu, performed demonstrations and took on challengers here for

    four years, including classes for the British Army and women''s self-defence classes. He left the school in the

    charge of his senior student William Garrud when he returned to Japan in late 1908; it continued through the

    Garruds and influenced the politicisation of jujutsu as women''s self-defence. The building was demolished by 1930.

'
