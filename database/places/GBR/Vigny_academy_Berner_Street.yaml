description:
  en: >-
    Pierre Vigny's self-defence academy and salle d'armes at 18 Berner Street, London, opened in 1903 after
    the Bartitsu Club closed. His wife, née Sanderson, was assistant instructor, and Sadakazu Uyenishi
    taught jujutsu classes there.
notes: >-
  No source dates its closing; Vigny returned to Geneva in 1912.
