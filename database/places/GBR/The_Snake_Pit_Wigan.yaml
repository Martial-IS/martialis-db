description:
  en: The Snake Pit, originally Riley's Gym, is a historic catch wrestling gym in Aspull, Wigan, England. Founded in 1948 by Billy Riley, it produced legendary wrestlers including Karl Gotch and Billy Robinson, and is regarded as the spiritual home of catch wrestling. It was revived under Roy Wood and continues to host the Catch Wrestling World Championships.
