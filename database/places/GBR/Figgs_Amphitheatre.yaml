description:
  en: >-
    James Figg's amphitheatre and fighting school in Oxford Road, London, opened in 1719, where he taught
    boxing, fencing, quarterstaff and cudgel and staged fights for crowds of up to a thousand. His
    student Thomas Sibblis took it over in 1731 when Figg moved to Poland Street.
notes: >-
  Green and Svinth (p. 228) place Figg's first amphitheatre on Tottenham Court Road and the later one at
  the Adam and Eve pub on Oxford Road; en Wikipedia's Taylor article puts Figg's "Great Booth" on
  Tottenham Court Road. The site follows the Figg article.
