description:
  en: >-
    Jack Broughton's amphitheatre in Oxford Road, London, opened in 1743 for prizefights and sparring.
    Broughton sparred and coached there until his defeat by Jack Slack in 1750 and ran it until
    1753–1754; the Disorderly Houses Act of 1752 brought boxing academies under regulation.
notes: >-
  Broughton's separate Haymarket school with "mufflers" (1747, en Wikipedia) is not recorded as a place.
