description:
  en: >-
    Mestre Pastinha's capoeira Angola academy in Salvador, established in 1949 and registered in
    1952; from 1955 in a colonial house on the Pelourinho, the main capoeira Angola school of the
    1960s.
notes: >-
  It grew from the Gengibirra roda in Liberdade, which its mestres handed to Pastinha on 23 February
  1941 (Assunção, pp. 151-152); two attempts to run it, in 1941 and 1944, failed. Registered with
  the notary on 1 October 1952. Lost the Pelourinho house in the early 1970s, when the building was
  restored. Gato led its orchestra. Assunção dates its establishment, at the Sicool soap factory in
  Brotas, to 1949 (p. 152).
