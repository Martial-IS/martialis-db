description:
  en: Brussels karate club founded in 1962 by Claude Goetz and Jean De Haes as the first karate-only school in Brussels, later renamed the Centre National de Karate (CNK). Jean-Claude Van Damme trained there from 1971, earning his black belt from Goetz in 1978, and later taught students with disabilities and children at Goetz's schools. The club survives today as the World Champion CNK, still headed by Goetz.
  fr: Club de karaté bruxellois fondé en 1962 par Claude Goetz et Jean De Haes, première école bruxelloise consacrée uniquement au karaté, devenue ensuite le Centre National de Karaté (CNK). Jean-Claude Van Damme s'y est entraîné à partir de 1971 et y a reçu sa ceinture noire de Claude Goetz en 1978, avant d'y enseigner auprès d'élèves en situation de handicap et d'enfants. Le club subsiste aujourd'hui sous le nom de World Champion CNK, toujours dirigé par Goetz.
