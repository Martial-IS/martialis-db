description:
  en: >-
    The first permanent judo dojo in Canada, founded in Vancouver in 1924 by Shigetaka Sasaki as the
    Tai Iku Dojo and renamed Kidokan by Kanō Jigorō on his visit in 1932. The other British Columbia
    dojos became its branches. All Japanese-Canadian dojos closed in 1941.
hasEvidence:
  - basedOnSource: 01M5G930MN7DVCGK42EP9G1XK9
    quotation: >-
      At the same time, the Founder of Judo, Dr. Jigoro Kano, on his return from the 1932 Olympic
      Games in Los Angeles, visited the Tai Iku Dojo in Vancouver. He renamed the dojo, Kidokan -
      “House of Intrinsic Energy.” All other dojos in B.C. became branches of the Kidokan.
    locator: '25'
    locatorLabel: page
    informationType: infotype:secondary
    supports: true
    evidenceType: evidencetype:direct
