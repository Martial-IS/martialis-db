description:
  en: >-
    Judo dojo at Steveston, British Columbia, opened in 1927 as a branch of Shigetaka Sasaki's Tai Iku
    Dojo, with Sasaki teaching there twice a week; closed by the wartime expulsion and revived in 1953 by
    Tomoaki Doi and Frank Sakai.
