type: Style
# Template only: `make schema` substitutes a throwaway ULID for the null `id`
# below. Every record under database/ carries a real ULID.
id: null
name:
  en: Style Name
  ja: 日本語名
aka:
  en: Alternative Name
# Origin period, culture-neutral - one of styleclass:traditional,
# styleclass:modern, styleclass:other. Culture-specific period terms
# (koryu/gendai for Japanese arts, neijia/waijia for Chinese arts) go in tags
# below, not here - never apply one culture's period vocabulary to another
# culture's art.
styleType: styleclass:modern
# How the style is composed/practised (0..n) - styleform:hybrid and/or
# styleform:sport. Omit if neither applies. 'sport' means principally a
# rule-governed competition with no substantial non-competitive identity
# (Boxing, MMA) - a style that merely has a competitive form (Judo) does not
# qualify.
# Typed, sourced relationships to other styles. styleRelationType is one of
# stylerel:derived_from, stylerel:split_from, stylerel:influenced_by,
# stylerel:sibling_style_of, stylerel:variant_of.
hasStyleRelationAssertion:
  - id: 01M3YH91AWHBGXTBV9Q6KMQVXM
    relatedStyle: 01KJJAWN29MA64W22606R3WD9B
    styleRelationType: stylerel:derived_from
    hasConfidence:
      confidenceLevel: conflevel:probable
      assessedBy: agent:EXAMPLE
      confidenceRationale: Style relationship documented in historical sources
    notes: ""
    hasEvidence:
      - basedOnSource: 01KJJAWN29MA64W22606R3WD9Y
        informationType: infotype:secondary
        supports: true
# Founding carries the EDTF date (see person.yaml's birthEvent comment for the
# syntax), the place, the founder(s) and its own evidence.
foundedEvent:
  startDate: '1882'
  location:
    countryCode: eucountry:JPN
  founder:
    - 01KJJAWN28MWKKSN4J02MVY1S1
  hasEvidence:
    - basedOnSource: 01KJJAWN29MA64W22606R3WD9Y
      informationType: infotype:secondary
      supports: true
dissolvedEvent: null
# database/ranking-systems/Dan_Kyu.yaml; omit if not yet researched.
rankSystem: 01M11K25NF0E7HG8HWVWM2P3FG
# Set false only to positively assert this style has no ranking system of its own (e.g. MMA).
confersRank: null
description:
  en: |
    Brief description of the style...
# Research notes: what is known, suspected, or still to be investigated.
# notes: ...
# rights (optional): copyright/licence status of the photo itself, e.g.
# mediarights:public_domain_mark or mediarights:cc-by-sa-4.0. Leave it out if
# unknown - see ontology/vocabularies.ttl's media-rights scheme.
photos:
  - contentUrl: https://example.org/photo.jpg
    imageAttribution:
      uri: https://example.org/photo.jpg
      cite: Where the photo is from
hasEvidence:
  - basedOnSource: 01KJJAWN29MA64W22606R3WD9Y
    informationType: infotype:secondary
    supports: true
# The same entity in external authorities, as CURIEs naming the entity, not a
# web page: wd: (Wikidata), dbr: (DBpedia), viaf:, isni:, lcnaf:, ndlna:,
# orcid:. A Wikipedia article, an official site or a profile page is not an
# identity and does not validate here; cite it as a Source instead.
sameAs:
  - wd:Q5616
tags:
  - grappling
  - throwing
  - gendai
