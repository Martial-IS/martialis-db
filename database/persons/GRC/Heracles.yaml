description:
  en: >-
    Divine hero of Greek mythology, son of Zeus and Alcmene. He learned wrestling from Autolycus,
    wrestled the giant Antaeus, killed the boxer Eryx in a match, and as his ninth labour took the war
    belt of the Amazon queen Hippolyta.
