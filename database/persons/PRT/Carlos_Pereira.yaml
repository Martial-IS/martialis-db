description:
  en: Portuguese engineer and aikido pioneer, student of Georges Stobbaerts, who organized and structured
    aikido in Portugal from the 1960s. Also a karateka, he was president of the Portuguese Karate Federation
    and later moved to Brazil. His first aikido student was the playwright Jaime Salazar Sampaio, the
    first Portuguese aikido black belt. He taught aikido at the Academia de Budo in the 1960s.
  pt: Engenheiro português e pioneiro do Aikido, aluno de Georges Stobbaerts, que organizou e estruturou
    o Aikido em Portugal a partir dos anos 1960. Também praticante de Karate, foi presidente da Federação
    Portuguesa de Karate e mais tarde mudou-se para o Brasil. O seu primeiro aluno de Aikido foi o dramaturgo
    Jaime Salazar Sampaio, o primeiro cinto negro português de Aikido. Ensinou Aikido na Academia de Budo
    nos anos 1960.
notes: 'Carlos Manuel Pereira (Eng.) is described in Stobbaerts'' 2001 interview as the true pioneer of
  aikido in Portugal: he organized and structured the art, taught it for many years at the Academia de
  Budo, also worked in karate and was president of the Portuguese Karate Federation, and later moved to
  Brazil. He and his karate group left the Academia de Budo as a group. His first aikido student was the
  playwright Jaime Salazar Sampaio, the first Portuguese aikido black belt.'
