description:
  en: Portuguese aikido master (6th dan Aikikai), student of Takeji Tomita (1985-2004), founder of Takemusu
    Aiki Portugal.
  pt: Mestre português de aikido (6º dan Aikikai), aluno de Takeji Tomita (1985-2004), fundador da Takemusu
    Aiki Portugal.
notes: '- Carlos Portas began martial arts training with karate in 1972 in Aveiro, Portugal.

  - He moved to Sweden in 1982 and began practicing aikido with Takeji Tomita in 1985 after seeing a demonstration
  in Stockholm.

  - He returned to Portugal in 1993 and founded Aikido Dojo Aveiro in 1995, which later became Takemusu
  Aiki Portugal in 1996.

  - His rank progression: 4th dan from Aikikai (pre-2000), 5th dan from Takeji Tomita (by 2000), 6th dan
  from Aikikai Tokyo (later, recommended by Ulf Evenås Shihan).

  - He studied with Takeji Tomita from 1985 to 2004, and from 2013 joined Ulf Evenås Shihan''s Takemusu
  Aikido lineage.

  - Founder and head of Takemusu Aikido Carlos Portas (TACP), an independent aikido school in Aveiro.

  '
