description:
  pt: Primeiro presidente da Confederação Brasileira de Judô (1972-1979) e presidente da União Pan-Americana
    de Judô (1956-1972). Português-brasileiro que estudou com Takeo Yano e Ryuzo Ogawa, foi convidado
    especial do Kodokan para arbitrar nos Jogos Olímpicos de Tóquio 1964.
notes: '- "Augusto Cordeiro foi uma figura central no desenvolvimento organizacional do judô brasileiro,
  servindo como primeiro presidente da Confederação Brasileira de Judô de 1972 a 1979."

  - "Como presidente da União Pan-Americana de Judô (1956-1972), ajudou a estabelecer o judô como esporte
  pan-americano."

  - "Recebeu convite especial do Kodokan para arbitrar nos Jogos Olímpicos de Tóquio 1964."

