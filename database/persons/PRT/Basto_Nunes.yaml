description:
  pt: Professor de judo português, 9º dan, pioneiro do judo em Portugal e fundador do Judo Clube de Sintra - Judokai. Estudou com Antony Striker e foi discípulo direto de Kiyoshi Kobayashi.
notes: '- "José Manuel Bastos Nunes foi um dos pioneiros do judo em Portugal, começando a praticar em 1955 com Antony Striker."

  - "Fundou o Judo Clube de Sintra - Judokai, uma das escolas de judo mais importantes de Portugal."

  - "Foi agraciado com o 9º dan pela Federação Portuguesa de Judo em 2019 durante a Gala do 60º Aniversário da FPJ."

  - "Faleceu em 20 de janeiro de 2024, sendo homenageado em várias publicações desportivas portuguesas."

  - "A sua fotografia foi publicada na revista Tele-Judo e Karate-do em 1977, disponível no catálogo da Biblioteca Nacional de Portugal."

'
