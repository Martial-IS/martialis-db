description:
  pt: José Alexandre Gueifão foi um dos pioneiros do karate em Portugal, co-introdutor da prática do karate no país em 1964. Fundador da Suishinkan Portugal, foi praticante de judo desde 1960 e de karate desde 1964, tendo alcançado o grau máximo de 5º dan em karate Shotokai. Foi presidente da Associação Shotokai de Portugal e membro do Conselho de Graduações da ASP.
