notes: 'José Alexandre Gueifão nasceu em Lisboa em 7 de dezembro de 1940 e faleceu em 24 de julho de 2025.

  Iniciou-se na prática de judo em 1960 e no karate em 1964, sendo co-introdutor do karate em Portugal.

  Fundador da Suishinkan Portugal, foi presidente da Associação Shotokai de Portugal (1999-2006) e membro do Conselho de Graduações da ASP.

  Teve dois filhos, incluindo Pedro Gueifão (4º dan de karate Shotokai).

  Participou em numerosos estágios com mestres japoneses incluindo Tetsuji Murakami, Shigeru Egami, Motohiro Yanagisawa, Yoshiharu Takisawa, Yoshinori Takita e Hidemitsu Nakao.

  Foi professor de judo no Colégio Militar sob orientação do Tenente Coronel Freire de Almeida.

  Possuiu diversas certificações incluindo Curso de Formação para Agentes do Ensino de 2º Grau pela CDAM, Curso de Treinador de Karate Nível III pela FNK-P, e Curso de Treinador de Desporto Karate Grau 4 pelo IPDJ.

'
