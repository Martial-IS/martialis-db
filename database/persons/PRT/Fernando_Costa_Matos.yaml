description:
  en: Portuguese judoka, first Olympic judo athlete from Portugal (Tokyo 1964), 9th dan, student of Kiyoshi
    Kobayashi, former president of Portuguese Judo Federation.
  pt: Judoca português, primeiro atleta olímpico de judo de Portugal (Tóquio 1964), 9º dan, aluno de Kiyoshi
    Kobayashi, ex-presidente da Federação Portuguesa de Judo.
notes: Fernando Costa Matos was born in Ponta Delgada, Azores in 1941. He began practicing judo in 1959
  at INEF with Kiyoshi Kobayashi, who is considered the father of Portuguese judo. He started training
  at Judo Clube de Portugal in 1961. He was the first Portuguese judoka to compete in the Olympics, participating
  in Tokyo 1964 where he also served as Portugal's flag bearer. He later trained in Japan for two years.
  His competitive career included European Championships in 1963. He served as national team coach for
  the 1972 and 1992 Olympics. He was president of the Portuguese Judo Federation and received the 9th
  dan in 2019 at the FPJ 60th anniversary gala. He was also a multi-sport athlete, practicing swimming,
  sailing, rowing, water polo, handball, and football in his youth.
