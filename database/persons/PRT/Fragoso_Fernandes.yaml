notes: "Full name: António Luís Rivara Fragoso Fernandes. Philosophy professor at University of Lisbon\
  \ (1976-1982). \nPhD in Philosophy from Universidade Nova de Lisboa with dissertation on Kant. \nAuthor\
  \ of \"Da Aporia à Cisão. Uma interpretação do Opus Postumum Kantiano\" (2006). \nAssistant in Department\
  \ of Philosophy at Faculty of Letters, University of Lisbon. \nKarate teacher at Academia de Budo, described\
  \ by José Araújo as \"one of the people who most marked me in Martial Arts, for his serious, rigorous\
  \ and deeply committed approach.\" \nStudent of Luís Pires Martins from the first day of his teaching.\n"
