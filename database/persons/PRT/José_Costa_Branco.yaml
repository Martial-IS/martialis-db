description:
  en: Portuguese judoka born in Mozambique, Olympic athlete at 1980 Moscow Games, student of Kiyoshi Kobayashi,
    3rd dan holder, and also national shooting champion.
  pt: Judoca português nascido em Moçambique, atleta olímpico nos Jogos de Moscovo 1980, aluno de Kiyoshi
    Kobayashi, 3º dan, e também campeão nacional de tiro.
notes: "José da Costa Branco (born March 13, 1937 in Lourenço Marques, Mozambique) is a Portuguese judoka\
  \ and shooting champion. \nHe began judo in Mozambique at the Clube de Judo de Lourenço Marques. After\
  \ moving to Portugal following the independence of Mozambique, he joined Judo Clube de Portugal in 1975\
  \ where he became a student of Kiyoshi Kobayashi. \nHe represented Portugal at the 1980 Moscow Olympics\
  \ in the -65kg category, winning one match and losing one. He was part of a small Portuguese delegation\
  \ of only 11 athletes due to the US-led boycott of the Games.\nAccording to his own account in interviews,\
  \ Kobayashi was a crucial mentor after relocating from Mozambique.\n\
  He also became a national shooting champion in Portugal, demonstrating versatility across different\
  \ sports.\nHis 3rd dan rank was documented in the 1983 book \"Judo: da iniciação à competição\" published\
  \ by Centelha.\n"
