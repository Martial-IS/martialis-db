      cite: Manual de Graduações e Regulamento de Graduações. Federação Portuguesa de Judo (Dezembro 2020)
      quotation: Em 1955, os judocas do Porto organizados em torno do professor Jackie Hugnet, criam o
        Círculo de Judo do Porto, onde Hugnet foi professor durante sete anos, lecionando três vezes por
