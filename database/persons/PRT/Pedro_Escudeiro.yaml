notes: '- Pedro Escudeiro is a Portuguese aikido practitioner who began aikido in January 1983, at age
  11, at the Aiki-Shuren Dojo de Portugal (the school of Tristão da Cunha).

  - In 1998 he took on the editorship of the school periodical "Yamabushi", which led him to develop the
  "Aikido em Portugal" project: a series of interviews documenting the history of aikido in Portugal,
  published in the Surya magazine of the Centro de Artes Orientais.

  - His interviews include those with Carlos Portas, Tristão da Cunha, José Araújo, Leopoldo Ferreira
  and others; the interviewees had final approval of the published texts.

  - Listed as a 2nd dan taijutsu instructor at the Ginásio Luddance in Carcavelos in the 2003 Iwama Ryu
  dojos list.

  - Birth year (~1971) inferred from his statement of being 11 years old in January 1983.

