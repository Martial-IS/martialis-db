  en: Portuguese aikido master (8th dan Iwama Shin Shin Aikido / Iwama Ryu), founder and Technical Director
    of the Associação Portuguesa Aiki-Shuren Dojo (APASD). Began aikido in Melbourne in 1980/81, was uchi-deshi
    of Morihiro Saito at Iwama from 1986, and continued with Hitohiro Saito after 2002.
  pt: Mestre português de aikido (8º dan Iwama Shin Shin Aikido / Iwama Ryu), fundador e Director Técnico
    da Associação Portuguesa Aiki-Shuren Dojo (APASD). Iniciou o Aikido em Melbourne em 1980/81, foi uchi
    deshi de Morihiro Saito em Iwama desde 1986, e continuou com Hitohiro Saito depois de 2002.
