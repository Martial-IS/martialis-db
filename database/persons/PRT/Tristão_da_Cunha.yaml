notes: '- Tristão da Cunha began aikido in 1980/81 in Melbourne while at university, first with Tony Smibert
  (Aikikai) and then with Barry Knight (traditional/Iwama aikido).

  - First Portuguese to train at the Iwama dojo; first stay as uchi-deshi May 1986, six months, returning
  repeatedly until Morihiro Saito''s death in 2002.

  - Saito gave the name Aiki-Shuren Dojo for the dojo in Portugal; the Associação Portuguesa Aiki-Shuren
  Dojo (APASD) was constituted 16 January 1989.

  - Promoted to 8th dan (VIII dan Dentō Iwama Ryu) by Hitohiro Saito at the Kagami Biraki ceremony in
  Iwama on 17 January 2016, together with Alessandro Tittarelli Shihan; the grade is described as equivalent
  to a menkyo license.

  - He is also a practitioner and teacher of shuriken jutsu (Negishi Ryu, renamed Saito Ryu Shuriken Jutsu
  in honour of Morihiro Saito).

  - Earlier martial arts: judo (2 years as a child), full-contact (c. 2 years), Ryukyu kobujutsu and Shaolin
  Chun Fa Kempo with Professor Belmonte (c. 2 years).

  - The teacher''s surname appears as "Barry Knight" in the CAO interview and "Barry Night" on the Aikishurendojo
  pages; takumadojo.com.au confirms "Barry Knight" of Caulfield, Melbourne as an Iwama-lineage teacher.

  '
