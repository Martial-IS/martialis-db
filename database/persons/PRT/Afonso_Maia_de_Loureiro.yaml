notes: 'Afonso Maia de Loureiro nasceu na Ilha de Moçambique (então colónia portuguesa) em 1917 e faleceu
  em Lisboa em 1999.

  Foi um dos primeiros judocas portugueses, tendo começado a treinar em 1954 com Antony Striker, um instrutor
  suíço que abriu uma sala no Largo do Intendente em Lisboa.

  É mencionado em várias fontes históricas sobre o desenvolvimento do judo em Portugal, incluindo o website
  Judolândia e vídeos comemorativos da Federação Portuguesa de Judo.

  O seu nome completo era Afonso Henriques Ivens-Ferraz Maia de Loureiro.

  Foi listado como 3º dan no manual de graduações da FPJ de 2021.

  '
