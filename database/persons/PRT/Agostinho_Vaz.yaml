description:
  en: Portuguese aikido teacher, 5th dan Aikikai and technical director of the Associação Cultural Portuguesa
    de Aikido (ACPA). After judo (1969-1974), he began aikido in 1977 in Almada under Katsumi Motomura
    and then Toshio Kawakami of the Shiseikai association, and later followed Nobuyoshi Tamura and Seiichi
    Sugano as his main references. He has taught in Almada since 1985 and served as president of the Federação
    Portuguesa de Aikido.
  pt: Professor português de Aikido, 5º dan Aikikai e diretor técnico da Associação Cultural Portuguesa
    de Aikido (ACPA). Depois do judo (1969-1974), iniciou o Aikido em 1977 em Almada sob Katsumi Motomura
    e depois Toshio Kawakami da associação Shiseikai, seguindo mais tarde Nobuyoshi Tamura e Seiichi Sugano
    como principais referências. Ensina em Almada desde 1985 e foi presidente da Federação Portuguesa
    de Aikido.
