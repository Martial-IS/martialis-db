notes: "Born in Lugar de Catassol (current Praceta/Rotunda do Lavrador) in Maia. Started judo in 1968 at Clube de Judo do Porto under Nobuyoshi Yamamoto (5th dan). \nBegan karate in 1971 at Bushidokan Porto under António Cacho (5th dan). First seminar with Tetsuji Murakami in January 1972 (7th kyu yellow belt). \nReceived karate ranks from Murakami: 2nd kyu (1973), 1st kyu (1976), 1st dan (1977), 2nd dan (1980), 3rd dan (1985). All dan ranks recognized by Nihon Karate-Do Shotokai (NKS). \n4th dan awarded by Associação Shotokai de Portugal in 2009 (recognized by NKS). 5th dan awarded at Hombu Dojo Shotokan of NKS in 2012. \nStarted teaching Murakami Method of Karate-Do Shotokai in August 1972. Instructor at UNICER in Leça do Balio (1972-1974). \nFounded Escola Murakami da Maia on September 9, 1974, authorized by Tetsuji Murakami. \nStarted aikido practice on March 17, 2006 at Mussubi Escola de Aikido / Takemusu Aiki Portugal under Carlos Portas. \nCredited karate instructor by Federação Nacional de Karate - Portugal and Associação Shotokai de Portugal. \nMember 331 of União Portuguesa de Budo (1971). Founding member of Associação Murakami-Kai Shotokai de Portugal (today Associação Shotokai de Portugal) in 1977.\n"
