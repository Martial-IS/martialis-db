description:
  pt: António Roquete de Andrade, conhecido como "Tona", foi um judoca português que participou nos Jogos Olímpicos de Montreal 1976. Foi aluno e sucessor de Fernando Costa Matos como treinador principal da AHBE, tendo sido promovido a 7º dan pela Federação Portuguesa de Judo em 2009.
