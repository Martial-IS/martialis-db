    de Setúbal), onde é Diretor Técnico e presidente da sua sucessora, a ADAS-Aikido Buikukai Portugal.
    Iniciou o Aikido em julho de 1975 no Clube Naval Setubalense com Misao Honda e passou o seu 1º dan
    com este mestre a 29 de junho de 1980.
