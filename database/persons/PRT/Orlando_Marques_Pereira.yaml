notes: '- Orlando Marques Pereira (commonly Orlando Marques) is a Portuguese aikido teacher and the founder
  of the ADAS (Associação Desportiva de Aikido de Setúbal).

  - Began aikido in July 1975 at the Clube Naval Setubalense with Misao Honda, and passed his 1st dan
  with Honda on 29 June 1980, one of Portugal''s first two yudansha registered with the Hombu Dojo Aikikai
  in Tokyo.

  - Technical Director of the ADAS since its founding on 23 November 1998, and head instructor at the
  ADAS dojo in Setúbal (Rua Diogo Cão 20A).

  - President of the ADAS''s successor organization, ADAS-Aikido Buikukai Portugal, appointed by the Buikukai
  of Osaka, Japan.

  - Holds the rank of 6th dan Aikikai.

  '
