notes: "Full name: Henrique Carinhas Martins Nunes. Born in Benguela, Angola (then Portuguese colony).\
  \ \nStarted judo in 1954 with Afonso Henriques Maia Loureiro. Became student of Kiyoshi Kobayashi in\
  \ 1959 when Kobayashi arrived in Portugal. \nNational champion multiple times (first championship medal\
  \ in 1966 from Kobayashi). Known for extensive collection of judo materials (videos, books, magazines)\
  \ referred to as his \"santuário do judo\" (judo sanctuary). \nDescribed Kiyoshi Kobayashi as \"the\
  \ Nureyev of standing judo\" for his elegance and technical precision. \nHas expressed concern about\
  \ modern judo teaching methods and commercialization. 8th dan awarded in 2019.\n"
