notes: '- Luís Filipe Gomes Antunes (b. 18 October 1954) is a Portuguese aikido master, 7th dan and shihan
  of the Aikikai of Tokyo.

  - Began aikido on 1 August 1970 at a seminar in Castel-Jaloux, France, with Hirokazu Kobayashi, while
  a karate practitioner; also trained under Misao Honda''s direction in Portugal.

  - Direct student of Nobuyoshi Tamura from 1980 until Tamura''s death in 2010, on the recommendation
  of Kobayashi.

  - Founded the first Aikikai-only dojo in Portugal at the Grupo Desportivo do Instituto Nacional de Estatística
  (GDINE) in 1980; co-founded the Associação Desportiva Aikikai de Portugal (AKP) in 1982/3, where he
  served as the technical figure.

  - President of the Federação Portuguesa de Aikido, resigning on 26 July 2000 over a funding dispute
  with the Instituto Nacional do Desporto.

  - Has taught at the Clube Atlético de Alvalade since 1977; Aikikai Foundation delegate in Portugal and
  Technical Director of the AKP; technical advisor for aikido in Senegal and Cabo Verde.

  - Awarded the 7th dan and the title of shihan by the Hombu Dojo, delivered personally by the Dôshu Moriteru
  Ueshiba on 9 February 2016.

  - Sources disagree on the birth year: the CAO interview (age 47 in 2000) and the wix profile say 1953,
  while the Clube Atlético de Alvalade page gives 18 October 1954; the specific date was preferred.

  '
