description:
  en: Portuguese aikido master (7th dan and shihan, Aikikai of Tokyo). He began aikido on 1 August 1970
    with Hirokazu Kobayashi, was a direct student of Nobuyoshi Tamura from 1980 until Tamura's death in
    2010, founded the first Aikikai-only dojo in Portugal (GDINE, 1980), co-founded the Associação Desportiva
    Aikikai de Portugal, and served as president of the Federação Portuguesa de Aikido. He has taught
    at the Clube Atlético de Alvalade since 1977.
  pt: Mestre português de aikido (7º dan e shihan, Aikikai de Tóquio). Iniciou o Aikido a 1 de agosto
    de 1970 com Hirokazu Kobayashi, foi aluno direto de Nobuyoshi Tamura de 1980 até à morte de Tamura
    em 2010, fundou o primeiro dojo exclusivamente Aikikai em Portugal (GDINE, 1980), cofundou a Associação
    Desportiva Aikikai de Portugal e foi presidente da Federação Portuguesa de Aikido. Ensina no Clube
    Atlético de Alvalade desde 1977.
