description:
  en: >-
    Estonian-born strongman and wrestler, trained from 1898 at Vladislav Krajewski's athletic club in
    Saint Petersburg. A leading European champion around 1900, he worked the music halls of Paris, London
    and Vienna and lost twice to Frank Gotch (1908, 1911).
notes: >-
  Dates differ: en Wikipedia 1877 birth; Green and Svinth 1878–1968. None recorded.
