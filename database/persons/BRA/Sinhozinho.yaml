description:
  en: >-
    Athlete and physical-education teacher in Rio de Janeiro in the 1920s and 1930s, son of a
    military officer and politician from Santos, who taught capoeira as a combat technique without
    music or ritual and kept it alive in the city.
notes: >-
  His students beat two of Mestre Bimba's in Rio in 1949 (Assunção, p. 131). English Wikipedia calls
  his and Burlamaqui's approach capoeira utilitária. Assunção gives his death as 1960 (p. 128).
