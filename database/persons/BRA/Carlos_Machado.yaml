description:
  en: Brazilian Jiu-Jitsu master and the eldest of the five Machado brothers. He met Chuck Norris in 1988
    and became Norris's primary BJJ instructor. Norris earned his BJJ black belt under Carlos. Carlos
    taught Norris on the set of Walker, Texas Ranger where he ran an academy in the same building. He
    also appeared in episodes of the show as a stunt coordinator and actor.
