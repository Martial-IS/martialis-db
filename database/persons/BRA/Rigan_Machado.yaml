description:
  en: Brazilian Jiu-Jitsu grandmaster and member of the Machado family. He is a 9th degree red belt promoted by Rorion Gracie and a former Pan American champion. He was one of Chuck Norris's primary BJJ instructors and taught Norris for over 30 years. Norris helped Rigan obtain US citizenship and opened a free academy in his mall in Tarzana, California.
