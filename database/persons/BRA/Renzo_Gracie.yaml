description:
  en: 'Brazilian mixed martial artist and jiu-jitsu practitioner, member of the renowned Gracie family and 7th-degree coral belt in BJJ under Carlos Gracie Jr. He founded the Renzo Gracie Academy in Manhattan and trained fighters including Georges St-Pierre, Matt Serra, Chris Weidman, and John Danaher. A two-time ADCC world champion, he competed in the UFC, Pride, and other promotions.

'
