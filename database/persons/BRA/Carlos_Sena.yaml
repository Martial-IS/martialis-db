description:
  en: >-
    Capoeira teacher from Salvador, a student of Mestre Bimba from 1949 and technical director of
    his academy from 1954. In 1955 he opened his own school, Senavox, with a more stylized,
    sport-oriented capoeira.
notes: >-
  Helped draft the Technical Rules of Capoeira adopted by the Brazilian Boxing Confederation in 1972
  (Assunção, p. 192).
