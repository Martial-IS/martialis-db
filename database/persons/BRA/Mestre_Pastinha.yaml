description:
  en: >-
    Capoeira Angola master from Salvador; opened a capoeira school in 1910 and opposed borrowing from
    other martial arts. Most capoeira Angola lineages pass through his students.
notes: >-
  By his own manuscripts he withdrew from capoeira from 1912 until 1941 (Assunção, p. 150). Civil
  name spelled Pastiña in Assunção (p. 149). He trained with Benedito from the age of ten, for some
  months or, per Kay Shaffer, two years (pp. 149-150).
