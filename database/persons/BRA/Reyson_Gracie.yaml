description:
  en: 'Brazilian jiu-jitsu master, third son of BJJ co-founder Carlos Gracie. A 9th-degree red belt, he is regarded as the founder of Brazilian jiu-jitsu in the state of Amazonas, where he taught in Manaus in the late 1970s, and also helped develop the art in Bahia. He was the BJJ teacher of Osvaldo Alves.

'
  pt: 'Mestre de jiu-jitsu brasileiro, terceiro filho de Carlos Gracie, cofundador do BJJ. Faixa vermelha 9º grau, é considerado o fundador do jiu-jitsu brasileiro no estado do Amazonas, onde ensinou em Manaus no final dos anos 1970, e também contribuiu para o desenvolvimento da arte na Bahia. Foi o professor de BJJ de Osvaldo Alves.

'
