description:
  en: >-
    Capoeira master from Salvador who created capoeira regional in the late 1920s and early 1930s,
    with formal training sequences and coloured scarves for ranks.
notes: >-
  Green & Svinth (p. 39) and Bira Almeida give his birth year as 1899. Green & Svinth (p. 38): he
  "may have been taught by a jiu-jitsu teacher within the same lineage as Carlos Gracie" (citing
  Taylor 2005); no teacher named. His father taught him batuque. He dated the start of the
  Regional to 1933 (1953) and to 1928 (1973) (Assunção, p. 131).
