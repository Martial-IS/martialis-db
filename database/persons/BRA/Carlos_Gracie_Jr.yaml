description:
  en: 'Brazilian jiu-jitsu practitioner and coach, son of BJJ co-founder Carlos Gracie. He is the founder of the Confederação Brasileira de Jiu-Jitsu (CBJJ/IBJJF) and co-founder of the Gracie Barra team. He was awarded a 9th-degree red belt in BJJ.

'
  pt: 'Praticante e treinador de jiu-jitsu brasileiro, filho de Carlos Gracie, cofundador do BJJ. É o fundador da Confederação Brasileira de Jiu-Jitsu (CBJJ/IBJJF) e cofundador da equipe Gracie Barra. Recebeu o grau de faixa vermelha 9º grau.

'
