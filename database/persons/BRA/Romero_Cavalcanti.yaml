description:
  en: 'Brazilian jiu-jitsu master and co-founder of the Alliance Jiu-Jitsu team. Trained under Rolls Gracie, who awarded him his

    black belt in 1982, making Cavalcanti the last black belt Rolls promoted before his death that year. Founded the Jacare

    Jiu-Jitsu Academy, from which emerged champions including Fabio Gurgel, Alexandre Paiva, the Vieira brothers and Rodrigo

    "Comprido" Medeiros. Moved to the United States in 1995, first in Miami and later Atlanta. An 8th-degree red-and-white

    coral belt, he mentored the Vieira brothers, whose Checkmat team traces its lineage through him.

'
