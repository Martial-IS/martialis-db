description:
  en: 'Brazilian Jiu-Jitsu grandmaster and member of the Gracie family. Son of Hélio Gracie, he is widely
    regarded as one of the greatest BJJ practitioners of all time. Undefeated in MMA (11-0, all by submission),
    he won the Vale Tudo Japan tournament in 1994 and 1995, and defeated Nobuhiko Takada at Pride 1 and
    Pride 4. He is president of the Jiu-Jitsu Global Federation (JJGF) and features in the documentary
    Choke (1999).

    '
