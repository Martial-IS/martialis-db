description:
  en: Brazilian-American Jiu-Jitsu grandmaster and the eldest son of Hélio Gracie. He introduced Gracie
    Jiu-Jitsu to the United States, opening the first American Gracie Academy, and co-founded the Ultimate
    Fighting Championship (UFC) with Art Davie in 1993. He holds a 9th-degree red belt, promoted by his
    father in 2005, and is the founder of the Gracie Diet and Gracie University.
