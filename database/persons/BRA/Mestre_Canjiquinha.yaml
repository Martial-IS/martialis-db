description:
  en: >-
    Capoeira mestre from Salvador, a student of Mestre Aberrê from 1935 and contra-mestre at Mestre
    Pastinha's academy from 1951, who kept a style of his own between Angola and Regional and spread
    it through folklore shows and films.
notes: >-
