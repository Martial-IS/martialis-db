description:
  en: 'Brazilian martial artist and member of the Gracie family, considered by some the family''s best
    ever fighter. He trained under Helio Gracie and graduated a generation of jiu-jitsu black belts, including
    Carlos Gracie Jr., Rickson Gracie, and the "Famous Five". He died in a hang-gliding accident in 1982.

    '
  pt: 'Artista marcial brasileiro e membro da família Gracie, considerado por alguns o melhor lutador
    da família. Treinou sob Hélio Gracie e graduou uma geração de faixas pretas de jiu-jitsu, incluindo
    Carlos Gracie Jr., Rickson Gracie e os "Cinco Famosos". Morreu num acidente de asa-delta em 1982.

    '
