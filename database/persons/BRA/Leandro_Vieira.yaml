description:
  en: 'Brazilian jiu-jitsu instructor and competitor, co-founder of Checkmat with his

    brothers Leonardo and Ricardo Vieira, and Brazilian jiu-jitsu head coach for the

    MMA team at American Kickboxing Academy (AKA) in San Jose. He has coached MMA

    fighters including Cain Velasquez, Daniel Cormier, Luke Rockhold and Josh Thomson,

    and awarded Velasquez his BJJ black belt in October 2013.

    '
