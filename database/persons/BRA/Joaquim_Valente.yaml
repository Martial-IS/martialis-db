description:
  en: Brazilian Jiu-Jitsu professor and the youngest of the three Valente Brothers. He trained under Grandmaster
    Hélio Gracie from age 2 and received his Professor's Diploma from Hélio Gracie in 2007. He moved to
    Miami in 2007 to study criminology at Barry University. He is a primary instructor at the Valente
    Brothers academy.
