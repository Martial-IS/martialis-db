description:
  en: >-
    Capoeira mestre from southern Bahia who learned Angola and Regional in Itabuna, spent some time
    at Mestre Bimba's academy, settled in São Paulo in the 1960s and founded the Cordão de Ouro
    group with Mestre Brasília. His LPs were the training music of a generation.
notes: >-
  He learned Angola with Mestre Sururu and Regional from two students of Bimba teaching in Itabuna,
  all unnamed or without records (Assunção, p. 174). Created the Miudinho game (p. 200). Wikidata gives his birth date as 16 January 1938.
