description:
  en: >-
    Capoeira mestre from Itabuna, southern Bahia, who fought prize matches from 1948, taught in Rio
    de Janeiro from the 1950s with an academy in Bonsucesso, trained most of the city's 1960s
    mestres and was among the first to show capoeira abroad.
