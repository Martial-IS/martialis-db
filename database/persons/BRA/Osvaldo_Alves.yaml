description:
  en: 'Brazilian jiu-jitsu master known as the "Encyclopedia of Jiu-Jitsu", a 9th-degree red belt. He
    was a two-time Pan American judo champion and trained at Tenri University in Japan, bringing new techniques
    to jiu-jitsu. He was the judo mentor of Rolls Gracie and helped develop the art through students such
    as Carlos Gracie Jr. and Paulo Filho.

    '
  pt: 'Mestre de jiu-jitsu brasileiro conhecido como a "Enciclopédia do Jiu-Jitsu", faixa vermelha 9º
    grau. Foi bicampeão pan-americano de judô e treinou na Universidade Tenri no Japão, trazendo novas
    técnicas ao jiu-jitsu. Foi o mentor de judô de Rolls Gracie e contribuiu para o desenvolvimento da
    arte através de alunos como Carlos Gracie Jr. e Paulo Filho.

    '
