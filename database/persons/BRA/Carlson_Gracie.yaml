  en: 'Brazilian Jiu-Jitsu grandmaster and head of the Carlson Gracie Academy. Eldest son of Carlos Gracie and nephew of Hélio Gracie, he developed the Carlson Gracie Team''s distinct "warrior style" emphasizing physical prowess and aggression. An MMA pioneer, he trained numerous champions including Vitor Belfort.

