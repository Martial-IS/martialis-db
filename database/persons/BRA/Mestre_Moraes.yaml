description:
  en: >-
    Capoeira Angola mestre born on the island of Maré and raised in Salvador, who trained at Mestre
    Pastinha's academy under João Grande and João Pequeno, founded the Grupo de Capoeira Angola
    Pelourinho in Rio de Janeiro in 1980 and led the revival of capoeira Angola from Salvador after
    1982.
notes: >-
  A marine, transferred to Rio de Janeiro in the early 1970s; teaching capoeira Angola in Belford
  Roxo by 1974 (Assunção, p. 182).
