description:
  en: >-
    Sixteenth-century Freifechter from Ernsbrunn in Lower Austria, bodyguard to Cardinal Matthäus Lang,
    whose Ergrundung Ritterlicher Kunst der Fechterey (1516) is the earliest known printed fencing book,
    written for beginners in the Liechtenauer tradition.
