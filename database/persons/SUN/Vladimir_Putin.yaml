description:
  en: President of Russia, martial artist trained in judo and SAMBO under Anatoliy Rakhlin from age 11, Master of Sports in SAMBO, 8th dan in judo
  ru: Президент России, мастер боевых искусств, тренировался в дзюдо и самбо у Анатолия Рахлина с 11 лет, мастер спорта по самбо, 8 дан по дзюдо
notes: 'Vladimir Vladimirovich Putin (born 1952) is the President of Russia and a martial artist.

  He began training in judo and SAMBO at age 11 in 1964 under Anatoliy Rakhlin in Leningrad.

  He achieved the rank of Master of Sports in SAMBO and is a multiple champion of St Petersburg in SAMBO.

  In 2012, he was awarded the 8th dan in judo by the International Judo Federation during the IJF''s 60th anniversary celebrations.

  Putin has co-authored a book on judo and continues to practice martial arts.

  His training under Rakhlin is well-documented and he has mentioned his martial arts background in interviews and official biographies.

'
