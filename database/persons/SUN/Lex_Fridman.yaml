description:
  en: 'Soviet-born American computer scientist and podcaster, host of the Lex Fridman Podcast. Born in

    the Tajik Soviet Socialist Republic in 1983, his family moved to the Chicago area shortly after

    the collapse of the Soviet Union. Trained Brazilian jiu-jitsu at Balance Studios in Philadelphia

    under the Migliarese brothers, Phil and Ricardo, who guided him from white belt to black belt

    and awarded him the first stripe on his black belt in April 2023.

    '
