description:
  en: Soviet and Russian SAMBO and judo coach, trainer of Vladimir Putin, holder of 8th dan in judo and Master of Sports of the USSR title
  ru: Советский и российский тренер по самбо и дзюдо, тренер Владимира Путина, обладатель 8-го дана по дзюдо и звания «Мастер спорта СССР»
notes: 'Anatoliy Solomonovich Rakhlin (1938-2013) was a prominent Soviet and Russian SAMBO and judo coach.

  He is best known as the childhood trainer of Vladimir Putin, who began training with him at age 11 in 1965.

  Rakhlin trained Putin for 11 years, helping him achieve Master of Sports ranks in both SAMBO and judo.

  He was the head coach of the "Trud" sports society in Leningrad/Saint Petersburg.

  He held the 8th dan rank in judo and was an Honorary Coach of the Russian Federation.

  He continued to maintain a close relationship with Putin throughout his life, being invited to important personal and state events.

'
