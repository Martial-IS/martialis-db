description:
  en: Soviet judo and SAMBO practitioner, student of Vasili Oshchepkov, teacher of Anatoliy Rakhlin
  ru: Советский мастер дзюдо и самбо, ученик Василия Ощепкова, учитель Анатолия Рахлина
notes: 'Sergei Dashkevich (1896-1955) was a Soviet judo and SAMBO practitioner.

  He studied under Vasili Oshchepkov in 1931 at instructor courses for factory and university collectives
  in Moscow.

  He taught SAMBO classes in Leningrad, where Anatoliy Rakhlin was his student from 1952.

  Dashkevich played a role in the development of judo and SAMBO in the Leningrad region.

  He is considered one of the founders of Leningrad judo.

  '
