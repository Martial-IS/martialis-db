  ru: Советский мастер боевых искусств, один из основателей самбо, первый русский, получивший чёрный пояс
    по дзюдо, ученик Дзигоро Кано
notes: 'Vasili Sergeyevich Oshchepkov (1893-1938) was a Soviet martial artist and one of the three founders
  of SAMBO (along with Anatoly Kharlampiyev and Viktor Spiridonov).

  He studied judo under Jigoro Kano at the Kodokan in Tokyo from 1911 to 1917, becoming the first Russian
  to earn a black belt in judo.

  He was awarded 1st dan in June 1913 and 2nd dan in October 1917, becoming the first Russian and third
  European to achieve this rank.

  Oshchepkov played a key role in developing SAMBO by combining judo techniques with traditional Russian
  wrestling styles.

  He served as a military intelligence officer and was arrested during the Great Purge, executed on October
  10, 1938.

  He was posthumously rehabilitated in 1957 and recognized for his contributions to Soviet martial arts.

