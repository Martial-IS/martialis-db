description:
  en: Soviet martial artist, one of the founders of SAMBO, student of Vasili Oshchepkov, Honored Master of Sports of the USSR (1947)
  ru: Советский мастер боевых искусств, один из основателей самбо, ученик Василия Ощепкова, Заслуженный мастер спорта СССР (1947)
notes: 'Anatoly Arkadyevich Kharlampiyev (1906-1979) was a Soviet martial artist and one of the three founders of SAMBO (along with Vasili Oshchepkov and Viktor Spiridonov).

  He studied judo under Vasili Oshchepkov at the State Central Order of Lenin Institute of Physical Culture, graduating in 1936.

  Kharlampiyev played a key role in systematizing and developing SAMBO as a distinct martial art, incorporating techniques from various wrestling styles.

  He was awarded the title of Honored Master of Sports of the USSR in 1947.

  He authored several books on SAMBO and served as a coach and judge in the sport.

  His grandfather was a renowned circus strongman and wrestler, which influenced his interest in martial arts.

'
