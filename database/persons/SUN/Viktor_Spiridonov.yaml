description:
  en: >-
    Soviet self-defence instructor, head of Dynamo's Division of Self-Defense without Weapons, who built
    a system on European jujitsu learned from books, with wrestling and boxing elements; adopted by the
    national security forces in the 1920s and known successively as samoz, sam and Sambo. Green & Svinth
    give 1883–1943.
notes: >-
  Wikidata (Q4431271) gives 1882–1944; dates left off the record.
