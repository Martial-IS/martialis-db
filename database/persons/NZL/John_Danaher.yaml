description:
  en: 'New Zealand Brazilian jiu-jitsu and mixed martial arts instructor and coach, widely regarded as
    one of the best BJJ coaches in the world. A 6th-degree black belt under Renzo Gracie, Danaher taught
    at the Renzo Gracie Academy in New York, coached Georges St-Pierre through his UFC championship run,
    and developed an influential leg-lock system through his Danaher Death Squad team. He later founded
    New Wave Jiu Jitsu in Austin, Texas.

    '
