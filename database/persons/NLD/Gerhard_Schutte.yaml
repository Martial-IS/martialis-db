description:
  en: Bloemendaal dentist and pioneer of judo in the Netherlands, affectionately known as "opa" Schutte.
    Came to judo at the age of 46 shortly after the Second World War under the judo pioneer Jaap Nauwelaerts
    de Agé. Founded the Kenamju judo school in Haarlem in 1948 and the Nederlandse Amateur Judo Associatie
    (NAJA) in 1950, which later merged into the Judo Bond Nederland. His student Jon Bluming received
    his 1st dan from Schutte after only 12 months of training at the Tung Jen club in Amsterdam; he also
    introduced Felix De Smedt to Tokio Hirano, and De Smedt's shodan was awarded by Schutte in September
    1952. Remained active in judo into old age.
