description:
  en: Dutch judo pioneer. Took judo lessons in France after World War II with Awazu, Deherdt and Bonnet Maury, and later with Ichiro Abe in Brussels, and ran the Judo Instituut Van Der Horst on the Oudkerkhof in Utrecht in the late 1940s and the 1950s, where Anton Geesink took his first judo lessons. The school became Dutch team champion five times in that period. As national coach he led Willem Ruska to his first world title and the Dutch team to the European title; in the early 1960s he became a lecturer at the CIOS in Sittard. Van der Horst finished 1st dan in 1950 and was ultimately awarded the 9th dan for his services to judo.
notes: Teacher lineage now asserted for Ichiro Abe (Brussels) and Jean de Herdt ('Deherdt' in the JBN memorial); Awazu, Bonnet Maury and Morioka are named as teachers in the same memorial but not yet asserted as structured entries.
