description:
  en: Dutch judoka, the first non-Japanese to become World Champion (1961, again 1965) and Olympic Champion (1964, open class, beating Akio Kaminaga in Tokyo). Won a record 21 European Championship titles. Awarded 9th dan in 1986 (first European) and the 10th dan by the International Judo Federation in 1997 - one of only three 10th-dan judoka outside Japan. Quit competitive judo in 1967, spent 1973-1974 training for a professional wrestling career under the Funks in Amarillo, Texas, and later held top IJF and IOC positions.
notes: Teacher lineage is the focus of this entry; competitive achievements and administrative career (IJF member of the executive committee, IOC member) are summarized in the description and not itemized.
