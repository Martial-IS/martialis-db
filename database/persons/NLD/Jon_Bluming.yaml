description:
  en: Dutch martial artist, 9th dan judo, 10th dan Kyokushin karate and 10th dan hapkido, founder of Kyokushin
    Budokai. Trained at the Kodokan in Tokyo under Toshiro Daigo, Yoshimi Osawa and Kazuo Ito, and a close
    associate of Donn F. Draeger and Masutatsu Oyama. National coach of the Dutch judo team who won the
    1957 European championship, and coach of Wim Ruska during his 1960s-70s title run as well as of Chris
    Dolman and Antonio Inoki's New Japan Pro-Wrestling associate Otti Roethof.
