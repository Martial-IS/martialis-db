notes: 'Teacher lineage wired on the basis of Bluming''s own official biography (jonbluming.nl), the Realfighting
  interview, and his first-person EJMAS account: judo under Gerhard "opa" Schutte at the Tung Jen club
  in Amsterdam (1953-58, 1st dan after 12 months), under Donn Draeger in Tokyo (1959-61), in the Kodokan
  Kenshusei class under Mifune, Daigo and Osawa (1959-61), and 3rd dan from Tokio Hirano (1957). An English
  Wikipedia claim of training under "Eddy Roosterman" at the Tung-Yang Club could not be corroborated
  by any primary or Dutch source (the official biography credits only Schutte as his first judo sensei)
  and has been dropped as likely unsourced. Kazuo Ito is retained at low confidence pending corroboration.
  The Ruska coaching relationship is corroborated by English Wikipedia, the USAdojo/Realfighting interview,
  the NOS obituary, the Ons Amsterdam profile and Robert W. Smith''s "Martial Musings".'
