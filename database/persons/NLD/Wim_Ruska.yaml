description:
  en: Dutch judoka and professional wrestler, the only judoka to win two gold medals at a single Olympic
    Games (Munich 1972, heavyweight and open class). Won two world titles (1967 Salt Lake City, 1971 Ludwigshafen),
    seven European titles and many Dutch national titles. Started judo at the Dutch Navy and trained under
    Jon Bluming in the 1960s-70s; reached 8th dan. After 1972 he became national coach of the Netherlands
    for about a year and later competed in professional wrestling for New Japan Pro-Wrestling and the
    WWF. Inducted into the IJF Hall of Fame in 2013.
notes: English Wikipedia's prose gives the birth date as August 24, but its own infobox and Dutch Wikipedia
  both give August 29, 1940; the 29th is used here. Death place Hoorn (North Holland) per Dutch Wikipedia
  and the English infobox. The Bluming teacher assertion draws on six sources (Wikipedia EN/NL, Ons Amsterdam
  profile, NOS obituary, USAdojo interview, JudoInside retrospective, Martial Musings); the van der Horst
  assertion on the JBN memorial, Dutch Wikipedia and TheaterEncyclopedie.
