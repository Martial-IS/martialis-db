description:
  en: >-
    Australian middleweight boxer and teacher, "Father of Australian Boxing", a protégé of Jem Mace. After
    beating Abe Hicken in 1879 he opened a boxing academy at his White Horse Hotel in Sydney, with Mace as
    an instructor, introduced the Queensberry Rules to Australia, and trained Bob Fitzsimmons, Peter
    Jackson, Young Griffo and Frank Slavin. He controlled Australian boxing into the early 1900s.
notes: >-
  en Wikipedia gives his death as 12 July 1917 in the lead and 7 December 1917 in the infobox; only the
  year is recorded.
