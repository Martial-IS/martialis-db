description:
  en: >-
    Australian heavyweight boxer born on Saint Croix, a sailor before he boxed. After early lessons with
    Jack Dowridge he trained under Larry Foley in Sydney and had a long international career; he was in
    the International Boxing Hall of Fame's first class (1990).
