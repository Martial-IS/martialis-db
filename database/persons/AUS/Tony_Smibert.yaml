notes: '- Tony Smibert (Anthony Charles Smibert, b. 8 January 1949 in Melbourne) is an Australian painter and aikido teacher.

  - Began judo in his early teens and aikido in September 1964 at age 15, in the first aikido club in Australia (established by Arthur Moorshead in Melbourne, 1963).

  - Became a student of Seiichi Sugano in 1965 and remained his senior student until Sugano''s death in 2010; assisted in establishing aikido in Victoria and Aiki Kai Australia.

  - Vice-President of Aiki Kai Australia 1976-2010, elected president on Sugano''s death; trustee of the Aikido Foundation.

  - Represented Australia at the International Aikido Federation (IAF) 1980-1984, IAF vice-chairman 1984-2008, and member of the IAF Senior Council from 2008.

  - Awarded the 8th dan Aikikai and shihan title; the 8th dan was conferred by the Doshu at the Kagami Biraki in January 2025.

  - Appointed Member of the Order of Australia (AM) in the Queen''s Birthday Honours, June 2016, for service to aikido and the visual arts.

  - Also a prominent watercolourist and researcher of J.M.W. Turner''s techniques.

  - Was the first aikido teacher of Tristão da Cunha in Melbourne, c. 1980-81.

'
