  en: Australian aikido teacher (8th dan Aikikai, shihan) and artist, president of Aiki Kai Australia and member of the International Aikido Federation Senior Council. He began aikido in 1964 and was a lifelong student of Seiichi Sugano from 1965 until Sugano's death in 2010. He was awarded the 8th dan at the Kagami Biraki in January 2025.
