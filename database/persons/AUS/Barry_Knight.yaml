description:
  en: Australian aikido teacher (6th dan, Iwama Ryu) and Chief Instructor of Aikido Takemusu (Vic). A
    graduate in physics, engineering and risk management, he began aikido in Melbourne in 1970, practiced
    at the Aikikai Hombu Dojo in 1976, and was uchi-deshi under Morihiro Saito at Iwama from 1978 to 1980.
    He established the Rensei Dojo in Melbourne in the early 1980s and was the first teacher of Tristão
    da Cunha.
  pt: Professor australiano de aikido (6º dan, Iwama Ryu) e Chief Instructor do Aikido Takemusu (Vic).
    Licenciado em física, engenharia e gestão de risco, iniciou o Aikido em Melbourne em 1970, praticou
    no Hombu Dojo do Aikikai em 1976 e foi uchi deshi de Morihiro Saito em Iwama de 1978 a 1980. Estabeleceu
    o Rensei Dojo em Melbourne no início dos anos 1980 e foi o primeiro professor de Tristão da Cunha.
