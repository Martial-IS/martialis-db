notes: '- Barry Alan Knight (b. 1945) is an Australian aikido teacher and risk manager, graduate in physics,
  engineering and risk management.

  - Began aikido in Melbourne in 1970; practiced at the Aikikai Hombu Dojo in 1976; uchi-deshi at Iwama
  under Morihiro Saito 1978-1980.

  - One of three of Saito''s Australian students (with Michael Field and Derek Minus) to open private
  dojos in the early 1980s; established the Rensei Dojo (Aikido Takemusu, Iwama Ryu style) in Melbourne.

  - Chief Instructor of Aikido Takemusu (Vic); has ranked more than 100 black belt students up to 4th
  dan, with affiliated dojos interstate and abroad.

  - Was the first traditional (Iwama) aikido teacher of Tristão da Cunha in Melbourne, 1981-1985.

  - The Aikido Journal encyclopedia lists 5th dan Aikikai (Iwama style); his own dojo page states he was
  awarded 6th dan in January 1995, which the saitosensei site corroborates ("later 6th dan").

  - Also holds 4th dan in kyudo.

  - The surname appears as "Barry Knight" (Aikido Journal, takumadojo, rensei.htm), "Barry Night" (Aikishurendojo
  pages) and "Berry Knight" (saitosensei); Knight is the correct spelling.

