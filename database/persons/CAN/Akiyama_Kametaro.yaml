description:
  en: >-
    The first judoka in Canada to receive a black belt, from Shinzo Takagaki in 1925. Taught in
    Victoria before the war and co-founded the Seidokwan Academy of Judo in Montreal in 1952.
notes: Leyshon (p. 18) also shows his Kodokan shodan diploma dated 25 July 1929.
