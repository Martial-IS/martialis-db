description:
  en: 'Pioneer of Shotokan karate in Canada. Of Greek origin, born in Egypt, Anastasiadis trained at the Japan Karate Association (JKA) in Tokyo under Hirokazu Kanazawa, and was one of the very first foreigners to earn his black belt there in the late 1950s. He became the first person to teach karate in Canada, opening his first club in Montreal in 1957. He was the first non-Japanese to referee the All Japan Championship. By age 33 (1965) he held mastery in karate, judo, aikido, and bogotsu. He founded the first Canadian karate federation and collaborated with Hirokazu Kanazawa on instructional books and videos for the Shotokan Karate International Federation (SKIF). Among his early students was Gilles Dufour, who later became the successor of Roger Lesseau in Kyokushin.

'
  fr: 'Pionnier du karaté Shotokan au Canada. D''origine grecque, né en Égypte, Anastasiadis s''est formé à la Japan Karate Association (JKA) à Tokyo sous Hirokazu Kanazawa et fut l''un des tout premiers étrangers à obtenir sa ceinture noire là-bas à la fin des années 1950. Il est devenu la première personne à enseigner le karaté au Canada, ouvrant son premier club à Montréal en 1957. Il a été le premier non-Japonais à arbitrer le Championnat du Japon. À 33 ans (1965), il maîtrisait le karaté, le judo, l''aïkido et le bogotsu. Il a fondé la première fédération canadienne de karaté et a collaboré avec Hirokazu Kanazawa sur des livres et vidéos pédagogiques pour la Shotokan Karate International Federation (SKIF). Parmi ses premiers élèves figurait Gilles Dufour, qui est devenu plus tard le successeur de Roger Lesseau au Kyokushin.

'
