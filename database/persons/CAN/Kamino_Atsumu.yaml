description:
  en: >-
    Judo teacher known as the "Godfather of Judo in Canada". Founded the Kitsilano dojo in Vancouver
    (1932) and, after the wartime expulsion, the Kidokwan Judo Institute in Toronto (1946); organiser
    of the Canada Judo Yudanshakai. Died in 1959, a Kōdōkan 6th dan.
