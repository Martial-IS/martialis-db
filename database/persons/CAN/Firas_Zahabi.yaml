description:
  en: 'Canadian mixed martial arts coach and head trainer of Georges St-Pierre. Zahabi is the head coach
    and owner of Tristar Gym in Montreal, Quebec, which he took over in 2007. He cornered St-Pierre for
    the majority of his later career and is widely regarded as one of the top MMA coaches in the world.
    He holds a black belt in Brazilian jiu-jitsu under John Danaher, promoted in 2011.

    '
