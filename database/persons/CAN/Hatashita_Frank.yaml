description:
  en: >-
    Canadian judo teacher, known as "Canada's Mr. Judo". Founded the Hatashita Dojo in Toronto
    (1947), was third president of the Canadian Kodokan Black Belt Association (from 1961), president
    of the Pan-American Judo Union and an IJF vice-president; the first Canadian promoted to 8th dan.
