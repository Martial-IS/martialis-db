description:
  en: >-
    Canadian judo teacher and naval officer; co-founder of the Victoria Judo Club (1957). Trained at the
    Kodokan while assistant military attaché in Tokyo (1964–1967); later chairman of the National
    Grading Board. 7th dan.
notes: >-
  Leyshon (p. 133) also names Shinojima-sensei at the Kodokan (no record yet).
