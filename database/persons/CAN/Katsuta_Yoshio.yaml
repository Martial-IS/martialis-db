  en: >-
    Kōdōkan-trained judo teacher (4th dan on arrival in Canada in 1937) who founded the first dojo in
    Alberta, at Raymond, in 1943, and was the first president of the Alberta Kodokan Black Belt
    Association (1952–1957).
