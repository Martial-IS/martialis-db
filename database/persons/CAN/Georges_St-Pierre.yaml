description:
  en: 'Canadian former professional mixed martial artist and two-division champion in the Ultimate Fighting Championship (UFC), widely regarded as one of the greatest MMA fighters of all time. St-Pierre was a three-time former UFC Welterweight Champion (winning the title twice and the interim title once) and held the UFC Middleweight Championship, making him one of only four fighters in UFC history to hold titles in multiple weight divisions. He holds a 3rd dan black belt in Kyokushin Karate, a black belt in Brazilian Jiu-Jitsu, and black belts in Shotokan, Shidokan, and Gaidojutsu. St-Pierre was inducted into the UFC Hall of Fame in 2021 and appointed to the Order of Canada.

'
