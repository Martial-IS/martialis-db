description:
  en: >-
    Canadian-born judo teacher, educated in Japan; sensei of the prewar Fairview dojo in Vancouver and,
    after the Tashme camp, founder of the Seikeikan in Burlington, Ontario (1946). Canada's competitor
    at the 1958 World Championships and second president of the Canadian Kodokan Black Belt
    Association (1958–1961). 6th dan.
