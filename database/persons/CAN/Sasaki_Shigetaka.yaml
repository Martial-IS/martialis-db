description:
  en: >-
    Japanese-born judo teacher, known as the "Father of Canadian Judo". Came to Canada in 1922 as a
    2nd dan, founded the Tai Iku Dojo (later Kidokan) in Vancouver in 1924, taught the RCMP from
    1932, and was the first president of the Canadian Kodokan Black Belt Association (1956).
notes: >-
  Leyshon also has: judo instructor at Yonago High School before 1922 (p. 19); accompanied Kano to
  Berlin in 1936 (p. 30); taught at the Tashme internment camp (pp. 36, 102); 8th dan (p. 101).
