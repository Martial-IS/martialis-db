description:
  en: 'Kyokushin karate instructor in Quebec, Canada, best known as the first martial arts teacher of
    Georges St-Pierre. Couture operated a Kyokushin-kan dojo in the greater Montreal area and taught GSP
    from approximately ages 7-9 until his death when GSP was around 12-13.

    '
  fr: 'Instructeur de karaté Kyokushin au Québec, surtout connu comme le premier professeur d''arts martiaux
    de Georges St-Pierre. Couture opérait un dojo Kyokushin-kan dans la région de Montréal et a enseigné
    à GSP d''environ 7-9 ans jusqu''à son décès alors que GSP avait environ 12-13 ans.

    '
