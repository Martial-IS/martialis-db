description:
  en: 'Kyokushin karate pioneer in Quebec, Canada. Dufour began martial arts with Shotokan under René Stéziadis, then switched to Kyokushin in 1965 under Roger Lesseau (Lesourd), becoming Lesseau''s successor as chief instructor in 1972. He won the first Kyokushin Full Contact Championship at the Forum de Montréal on June 14, 1969. Dufour trained over 20,000 students over his career, including Jean Couture (later the first instructor of Georges St-Pierre), André Coulombe, André Gilbert, and Gaétan Sauvé. He authored seven books including L''histoire du karaté au Québec and was inducted into the Canadian Black Belt Hall of Fame (2019), the World Combat Arena Hall of Fame (2019), and the World Head of Family Sokeship Council Hall of Fame (2025).

'
  fr: 'Pionnier du karaté Kyokushin au Québec. Dufour a commencé les arts martiaux avec le Shotokan sous René Stéziadis, puis est passé au Kyokushin en 1965 sous Roger Lesseau (Lesourd), devenant son successeur comme instructeur en chef en 1972. Il a remporté le premier Championnat Full Contact Kyokushin au Forum de Montréal le 14 juin 1969. Dufour a formé plus de 20 000 élèves au cours de sa carrière, dont Jean Couture (premier instructeur de Georges St-Pierre), André Coulombe, André Gilbert et Gaétan Sauvé. Il est l''auteur de sept livres dont L''histoire du karaté au Québec et a été intronisé au Temple de la renommée des ceintures noires canadiennes (2019), au Temple de la renommée de la World Combat Arena (2019) et au Temple de la renommée du World Head of Family Sokeship Council (2025).

'
