description:
  en: 'Canadian actor and musician, best known for the John Wick, The Matrix and Speed franchises. For
    the John Wick films he undertook serious martial arts training: he studied judo for about four
    months before the first John Wick (2014), performed an ippon-seoi-nage on screen that became the
    signature technique of the throw''s Olympic champion, and received an honorary judo black belt
    from the International Judo Federation in 2017, presented by Nomura Tadahiro in Tokyo. He trained
    judo with black belt Monty Collier for John Wick 3: Parabellum (2019) and BJJ with Dave Camarillo,
    his primary trainer and grappling instructor on John Wick: Chapter 4 (2023).'
notes: 'Martial arts work is film-preparation training rather than a conventional competitive career. Reeves received an honorary (not tested) judo black belt. His BJJ rank is not publicly documented: reports of a blue belt promotion circulating online stem from a post by Dave Camarillo about another promotion at the same ceremony, not a Reeves promotion.'
