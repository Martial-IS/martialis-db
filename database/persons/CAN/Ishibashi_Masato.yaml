description:
  en: >-
    Japanese Canadian judo teacher, head instructor at the Angler, Ontario, prisoner-of-war camp 101
    during the war; one of the applicants for the 1956 charter of the Canadian Kodokan Black Belt
    Association, and in 1959 a leader of the breakaway Judo Association of Canada.
