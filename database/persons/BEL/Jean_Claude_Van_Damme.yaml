description:
  en: Belgian martial artist and actor best known as an action film star. He took up karate in Brussels
    at age 11 under Claude Goetz at the school that became the Centre National de Karate, earned his Shotokan
    black belt from Goetz in 1978, and briefly trained in full-contact kickboxing with Dominique Valera.
    He then built a competitive record in semi-contact karate (44 wins, 4 losses, 1976-1980) and kickboxing
    (18 wins, 1 loss, 1977-1982) before moving to the United States to pursue acting.
