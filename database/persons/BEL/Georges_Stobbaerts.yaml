description:
  pt: 'Georges Stobbaerts (1940–2014) foi um artista marcial de origem belga e nacionalidade portuguesa,
    nascido em Casablanca. Fundou em 1962 o primeiro dojo de Aikido e Kendo de África (Budo Club du Maroc)
    e foi o pioneiro que introduziu o Aikido em Portugal na década de 1960, fixando-se no país em 1971/72
    com o dojo Budokan de Portugal em Cascais. Foi uchideshi de Kiyoshi Nakakura em Kendo e Iaido, treinou
    Judo sob Kenshiro Abe, e recebeu o 8º dan de Aikido da Dai Nippon Butoku Kai, que lhe conferiu também
    o título de Hanshi e declarou a sua escola uma Ryu. Fundou o centro cultural TenChi em Sintra (1978)
    e criou a arte do movimento Tenchi Tessen (1985).

    '
  en: 'Georges Stobbaerts (1940–2014) was a Belgian-born, Portuguese-naturalised martial artist, born
    in Casablanca. He founded the first aikido and kendo dojo in Africa (Budo Club du Maroc, 1962) and
    was the pioneer who introduced aikido to Portugal in the 1960s, settling in the country in 1971/72
    with the Budokan of Portugal dojo in Cascais. He was uchi-deshi of Kiyoshi Nakakura in kendo and iaido,
    trained judo under Kenshiro Abe, and held 8th dan in aikido from the Dai Nippon Butoku Kai, which
    also conferred on him the title of Hanshi and declared his school a Ryu. He founded the TenChi cultural
    centre in Sintra (1978) and created the Tenchi Tessen art of movement (1985).

    '
notes: Stobbaerts was Aikikai delegate for Morocco at the beginning of his career, leaving after the death
  of Morihei Ueshiba (1969). Besides his formal teachers Kenshiro Abe (judo) and Kiyoshi Nakakura (kendo/iaido),
  he named as decisive influences Aritoshi Murashige, Tadashi Abe, Kisaburo Osawa, Masamichi Noro, Koichi
  Tohei and Itsuo Tsuda. He received his first dan in kendo and iaido, and various judo diplomas, from
  the Dai Nippon Butoku Kai. The DNBK declared his school (TenChi International) a Ryu. He was Technical
  Director for Aikido at the União Portuguesa de Budo for a time. In 1970, according to the Aikido Journal
  interview with Gérard Obellianne, there was a falling-out with Nobuyoshi Tamura at the Budo Club du
  Maroc in Casablanca; Tamura was no longer invited by Stobbaerts, and M'barek Alaoui and Emile Metzinger
  left Stobbaerts to create the Syu do kan under the Tamura (Aikikai) line. The Aikido Journal interview
  dates Stobbaerts' departure from Morocco to 1970, while his own sources say 1971.
