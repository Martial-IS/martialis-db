description:
  en: Karl Gotch (1924–2007), born Karl Istaz, was a Belgian catch wrestler, Olympian, and trainer known as the 'God of Wrestling' (Kamisama) in Japan. Trained at the Snake Pit under Billy Riley, he taught Satoru Sayama and Antonio Inoki, and his students founded Shooto, Pancrase, and PRIDE FC, making him a foundational figure in MMA.
