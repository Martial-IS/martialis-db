description:
  en: Belgian judoka, considered together with Marcel Clause the best and most successful student of Abe Ichiro. The first Belgian to win a European judo title (1954) and the only Belgian male judoka to win four European titles (1954, 1955, 1957, 1960). The first Belgian judoka promoted to 5th dan, and after his competitive career the first judo instructor of the Poseidon-Ryu judo club in Woluwe-Saint-Lambert, Brussels. A 7-fold Belgian national champion, he died in 1970.
