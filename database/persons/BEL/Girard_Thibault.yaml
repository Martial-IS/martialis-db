description:
  en: >-
    Fencing master from Antwerp who studied first under Lambert van Someron, then the Spanish Destreza at
    Sanlúcar de Barrameda (1605), won a masters' competition at Rotterdam about 1611 and taught in the
    Netherlands. His posthumous Academie de l'Espée (1628) is one of the most elaborate fencing books,
    joining Destreza-like geometry with occult and Pythagorean symbolism.
notes: >-
  The Destreza study at Sanlúcar names no teacher and has no place record, so it is not recorded as a
  claim.
