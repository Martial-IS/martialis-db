description:
  en: Belgian judoka and scholar of the martial arts. Earned his black belt at 16 under his principal
    teacher Felix De Smedt, founder of the Bushido-Kwai Mechelen academy; completed his judo kata studies
    with Marcel Clause in the period 1978-1992 and followed advanced stages under Hirano Tokio; between
    2005 and 2008 he studied kata with Fukuda Keiko in San Francisco. While residing in Japan he trained
    in Tenjin Shin'yo-ryu jujutsu under Tobari Kazu, under ne-waza expert Kurimura Yoji at the Kyoto Prefectural
    Police Academy, and under Okano Isao at the Seikijuku in Tokyo. A former -78kg member of the Belgian
    national team under national coach Valere Steegmans, he was Belgian champion in 1976. He holds 8th
    dan in judo, 6th dan in modern jujutsu and a Kyokushinkai black belt, holds the title of kyoshi, and holds menkyo in Kito-ryu. Full professor of exercise endocrinology
    and sports medicine at Ghent University, he has authored numerous academic
    studies of Kodokan judo kata. International referee since 1996 and
    current head of the Royal Judo & Karate Academy Bushido-Kwai.
