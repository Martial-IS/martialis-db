notes: Teacher edges to Abe Ichirō, Daigo Toshirō and Ōsawa Yoshimi rest solely on De Crée's own autobiographical
  author biography in his 2024 Revista de Artes Marciales Asiáticas article, which lists them among the
  judo teachers he studied with during his residence in Japan; the quotation and the rationale make explicit
  that this is De Crée's own self-reported claim. Edges to Tobari Kazu, Kurimura Yōji, Okano Isao and
  Imamura Haruo are not asserted because those persons are otherwise undocumented; they are covered in
  the description. The Judo Pour Tous page refers to Hirano Tokio as "Hirano Tokyo". His academic papers
  already covered here (Nanatsu-no-kata 2014, Kitō-ryū 2019, orphaned counter techniques 2015) are listed
  among his sources as cross-links to his scholarly output.
