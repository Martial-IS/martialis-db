description:
  en: Belgian judo pioneer, credited with introducing the sport to Belgium. Studied judo formally for the first time in Berlin in January 1941 at the school of Erich Rahn, the first Belgian to do so, continuing until 1943. Founded the first Belgian judo club, the Judo and Jujutsu Academy Bushido-Kwai, at Schelle on 20 May 1946; a Mechelen branch followed on 14 March 1951 and in 1996 the club became the first in Belgium to be granted the Royal predicate. Promoted to shodan in September 1952 and from that year a first-generation, dedicated student of Tokio Hirano. Pioneer of judo instruction to the Belgian police from the early 1950s and of children's and women's judo programmes. His notable students include Carl De Crée and Jeannine Meulemans. The city of Mechelen named its new combat sports hall after him in October 2012, following his death in August of that year.
