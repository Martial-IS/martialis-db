notes: The encyclopedic infobox lists his rank as "BJB 2nd dan & BKFS 6th dan" (BJB = Belgian Judo Bond; BKFS = the club's Bushido-Kwai Judo-Karate fighting system). Several of his own pupils obtained black belts before him (the October 1951 AFBJJ and February 1952 BEL.A.J.A. exams from which he was excluded). His shodan was awarded by the Dutchman Ger F. M. 'Opa' Schutte in September 1952, not by Hirano. The nidan promoted by Hirano was recognized administratively by the Belgian Judo Federation through its technical director Ichiro Abe - an organizational recognition, not a teacher relationship. Per the club historiek he also received a karate black belt from Japanese master Y. Araki (7th dan). Trained the Mechelen police corps from September 1954; left the Flemish Judo Federation in 1993; transferred club judo instruction in 2001. Mechelen named its new combat sports hall (Donkerlei) after him on 10 October 2012. The BKFS 6th dan is not recorded as a rank because BKFS is a Bushido-Kwai club hybrid ("based on a combination of Kodokan judo and Ashihara karate", English Wikipedia, source 01KZXXSB7NXHBH79ZMKH7Z1BT0) with no Style entity and too little independent evidence to justify creating one. Assessed confirmed, org 01KZXXSBCDJ8389BAV356M17G3 (the club). Record it as a rank if a BKFS Style is ever warranted.
