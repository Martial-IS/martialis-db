description:
  en: Belgian judoka, pioneer of judo in Belgium and founder in 1948 of the Club Sportif de la Police Judiciaire (CSPJ), later the Royal Judo Club de Mons. First encountered judo in 1944 while stationed in Aldershot, England during World War II. Early teacher of Marcel Clause, whom he taught from 1952 when Clause took up judo. Progressed to 1st dan in 1952, Kōdōkan 6th dan in 1982 before a jury chaired by Ichiro Abe, 7th dan in 1992, 8th dan in 2000, and in 2012 became the second judoka in Belgium to be promoted to 9th dan. Died in 2020 at age 99.
