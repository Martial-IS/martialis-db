description:
  en: Belgian karate pioneer and long-time coach of Jean-Claude Van Damme. With Jean De Haes he created
    the first karate school in Brussels in 1962, the ancestor of the Centre National de Karate (CNK).
    He trained in Paris alongside Tsutomu Ohshima, a disciple of Gichin Funakoshi. Goetz is credited with
    about a hundred coaching world titles, promoted the first full-contact karate tournament in Belgium,
    and remains at the head of what became the World Champion CNK.
