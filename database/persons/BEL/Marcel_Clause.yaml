description:
  en: Belgian judoka, considered together with Daniel Outelet the most skillful student of Abe Ichiro, excelling in both randori and judo kata. Took up judo in 1952 at age 23 under Robert Plomb. Won the 1960 national championships in the 2nd dan category and the Belgian National Trophy in 1963, 1964 and 1966, and was part of the Belgian national team at the 1960 and 1963 European Judo Championships for Teams. After Abe's return to Japan he served as Belgian national coach for two years. Promoted to 6th dan in 1978, 7th dan in 1987, and in 1997 became only the second non-Japanese ever to be promoted to Kodokan 8th dan. First non-Japanese asked by the Kodokan to teach a formal judo class there.
