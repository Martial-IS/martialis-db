description:
  en: >-
    Fifteenth-century German fencing master of unknown lineage, connected to the Liechtenauer
    tradition, an itinerant master-at-arms who trained men for judicial duels and wrote at least five
    fencing manuals (1440s–1467), with sections on astrology and numerology. He may have been an early
    member of the Marxbrüder.
notes: >-
  Dates differ: Green and Svinth ca. 1420 – ca. 1470s; Wiktenauer fl. 1433–1467; en Wikipedia c.
  1410–1415 – after 1482. No life events recorded.
