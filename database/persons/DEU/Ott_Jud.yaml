description:
  en: >-
    Fifteenth-century German wrestling master, a Jew baptised Christian, wrestling master to the princes
    of Austria. His wrestling treatise was copied into many later fight books, including Talhoffer's;
    Paulus Kal included him in the Society of Liechtenauer. He seems to have died before 1452.
