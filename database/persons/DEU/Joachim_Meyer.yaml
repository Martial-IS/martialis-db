description:
  en: >-
    German cutler, Freifechter and fencing master of Strasbourg, the last major master of the
    Liechtenauer tradition. His 1570 Gründtliche Beschreibung der Kunst des Fechtens covers longsword,
    dussack, rapier, dagger, wrestling and staff weapons; for the rapier he adapted what he learned abroad
    of Italian fencing to the German framework. The book was reprinted in 1600 and copied by Jakob Sutor
    and Theodori Verolini.
notes: >-
  Wiktenauer gives his baptism (16 August 1537); the birth year follows it. Green and Svinth (p. 253)
  also see Viggiani's lunge in his rapier.
