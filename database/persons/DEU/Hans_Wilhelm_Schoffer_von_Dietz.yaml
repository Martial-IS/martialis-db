description:
  en: >-
    Seventeenth-century German Freifechter from Diez an der Lahn, fencing master at the University of
    Marburg and, from 1623, at the Ritterakademie in Sorø. He was teaching assistant to Salvator Fabris,
    and his rapier treatise (1611, printed 1620) expands Fabris's teachings.
