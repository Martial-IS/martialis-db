description:
  en: >-
    Fourteenth-century German fencing master, the grand master of the German school (Kunst des
    Fechtens). The Pol Hausbuch says he travelled through many lands to learn the art, which he did not
    invent; he settled to teach in the later 1300s and bound his students to secrecy. His teaching
    survives in rhyming verses (the Zettel), glossed by later masters; Paulus Kal listed him first in
    the Society of Liechtenauer. Almost nothing else is known of his life.
notes: >-
  No source used here questions his existence (en Wikipedia doubts only his authorship of the Zettel),
  so no historicity claim is recorded. Candidate origins: Lichtenau in Franconia or Upper Austria.
