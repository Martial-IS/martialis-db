description:
  en: >-
    German fencing master of the late fourteenth or early fifteenth century, perhaps from Legnica, known
    for his sword-and-buckler teachings; he and his brother Jacob are on Paulus Kal's list of the Society
    of Liechtenauer. He seems to have died before 1452.
