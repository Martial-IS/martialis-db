description:
  en: >-
    Augsburg patrician and city official who spent lavish sums compiling huge illustrated compendia of
    fencing manuscripts to preserve the older German teachings; at least three survive. He likely
    trained with the masters of the Augsburg fencing guild. His spending led to embezzlement and his
    execution in 1579.
