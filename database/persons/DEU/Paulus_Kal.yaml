description:
  en: >-
    Fifteenth-century German fencing master of the Liechtenauer tradition, a student of Hans Stettner von
    Mörnsheim, who served as Schirrmeister at three courts and commanded men on campaign. His illustrated
    treatise (about 1460–1470) is the first to illustrate parts of Liechtenauer's Recital, and its
    introduction lists the seventeen masters of the Society of Liechtenauer.
