description:
  en: >-
    German fencing master and cleric ("Pfaffen", priest) of the fourteenth or fifteenth century, named in
    the Pol Hausbuch (Hs. 3227a), the earliest text of the Liechtenauer tradition, once attributed to
    him. He is not on Paulus Kal's list, and his relation to Liechtenauer is uncertain.
notes: >-
  Green and Svinth (pp. 218, 355) treat him as the author of the 1389 Hausbuch and as "in the
  Liechtenauer tradition"; Wiktenauer files the manuscript as the Pol Hausbuch and leaves his relation
  to Liechtenauer open.
