description:
  en: >-
    Fifteenth-century German fencing master of the Liechtenauer tradition from Salzburg. A long sword
    gloss attached to his name, probably written by a student or associate, revises Sigmund ain
    Ringeck's gloss and cites teachings of Hans Seydenfaden von Erfurt; Paulus Hector Mair acquired
    it in 1539.
