description:
  en: >-
    Bolognese fencing master active about 1500, heir of Dardi's school, whose students included Achille
    Marozzo and probably Antonio Manciolino, and the warriors Giovanni dalle Bande Nere and Count Guido
    Rangoni. Marozzo wrote that more warriors came from his school than from the Trojan horse. His
    fencing manual is lost.
notes: >-
  Green and Svinth (p. 249) say Dardi's school "passed on to later generations, to include" de Luca, with
  no named teacher, so no teacher claim is recorded.
