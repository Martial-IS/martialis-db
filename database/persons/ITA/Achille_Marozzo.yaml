description:
  en: >-
    Bolognese fencing master, a student of Guido Antonio de Luca, who kept a fencing school in Bologna.
    His illustrated Opera Nova (1536), dedicated to Count Guido Rangoni, became the dominant Italian
    fencing book and was reprinted into the seventeenth century.
