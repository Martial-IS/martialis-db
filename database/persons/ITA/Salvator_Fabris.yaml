description:
  en: >-
    Paduan knight and fencing master, the most celebrated teacher of the new rapier style. He served
    Johan Frederik of Holstein-Gottorp, archbishop of Bremen, in the 1590s, then was chief rapier
    instructor at the court of Christian IV of Denmark (1601–1606), who funded his De lo Schermo overo
    Scienza d'Arme (Copenhagen, 1606). His book and students made his style dominant in
    seventeenth-century German fencing. His teacher is not known.
