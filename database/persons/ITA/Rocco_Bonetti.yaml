description:
  en: >-
    Italian intelligence agent and fencing master (fl. c. 1570–1587) who came to England about 1569 and
    in 1576 opened at Blackfriars the first rapier school in England, charging far more than the English
    masters. His students included Sir Walter Raleigh and Lord Peregrine Willoughby.
hasEvidence:
  - basedOnSource: 01M5JTMYPENHER1RCARFPQMHQD
    quotation: >-
      Rocco Bonetti (/rɔk.ko/ /bɔˈnɛtti/; fl. c. 1570–1587) was an Italian intelligence agent and master
      of fencing who started the school of fencing at Blackfriars in London in 1576.
    informationType: infotype:secondary
    supports: true
    evidenceType: evidencetype:direct
  - basedOnSource: 01M5G930MN1VM84DEZNGEZP48E
    quotation: >-
      Like German fencing guilds, English masters taught the traditional weapons of sword and buckler,
      sword and dagger, two-handed sword, quarterstaff, and bill, only adding the Italian rapier and
      rapier and dagger after the arrival of the Italian masters Rocco Bonetti about 1571 and Vincentio
      Saviolo about 1590.
