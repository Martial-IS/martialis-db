description:
  en: >-
    Friulian knight, condottiero and fencing master (fl. 1381–1409), the earliest Italian master whose
    treatise survives. He studied with many Italian and German masters, above all Johane called Suveno,
    fought five duels against rival masters, and trained famous condottieri. For Niccolò III d'Este he
    wrote Il Fior di Battaglia (about 1409) on wrestling, dagger, sword, poleaxe and spear.
notes: >-
  Wiktenauer puts his birth in Cividale del Friuli; Green and Svinth call him "da Premariacco".
