  en: Entellus
description:
  en: >-
    Trojan or Sicilian hero, eponym of Entella, who in the fifth book of Virgil's Aeneid comes out of
    retirement to box the young Trojan Dares, first offering the bloodstained caestus of his brother Eryx,
    wins, and kills the prize bull with one blow.
