description:
  en: >-
    Bolognese fencing master and innovator whose Lo Schermo, a dialogue finished about 1551 and printed
    in 1575, recast the theory of the Bolognese school: the sword alone, seven guards with the right foot
    forward, rational names for the guards, and the thrust on the lunge as the perfect attack.
notes: >-
  Death: d. 1552 (Wiktenauer); Green and Svinth give 1517–ca. 1555. No life events recorded. Wiktenauer
  says he was influenced by Marozzo's teachings without clear evidence that he studied with him.
