description:
  en: >-
    Paduan rapier master who came to London about 1590, took on Rocco Bonetti's former school and taught
    under the Earl of Essex's patronage. His His Practise, in Two Bookes (1595) teaches rapier and dagger
    without the lunge, with circular footwork in the Spanish manner, and the code of honour. George
    Silver was his bitter critic.
