description:
  en: >-
    Milanese architect, engineer and mathematician who worked in Rome and, though not a professional
    master, became one of the most influential fencing theorists. His Trattato di Scientia d'Arme (1553)
    applied geometry to fencing, made the thrust the main attack and reduced the guards to four (prima to
    quarta), presaging the rapier style.
