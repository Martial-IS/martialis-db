name:
  en: Pietro Monte
aka:
  en:
    - Pedro Monte
    - Pietro del Monte
    - Pero Monti
    - Petrus Montius
description:
  en: >-
    Master of arms, historian and philosopher, Spanish or Italian by birth, who made his career in Italy,
    probably at the court of Milan. Castiglione's Courtier calls him the true and only master of every
    trained strength and agility, and names him as the teacher of Galeazzo da Sanseverino. His Latin
    Collectanea (printed 1509) cover wrestling, dagger, lance, swords, polearms, mounted combat and
    physical training.
notes: >-
  Dates differ: 1457–1509 (Wiktenauer), ca. 1460–1530 (Green and Svinth, p. 226); none recorded.
  Nationality is disputed (Green and Svinth: Spanish; Wiktenauer: unclear).
