description:
  en: >-
    Bolognese fencing master, mathematician and astronomer, professor of geometry at the University of
    Bologna. Licensed as a fencing master in 1412, he opened a school in Bologna and is credited as
    founder of the Bolognese (Dardi) school; his treatise on fencing and geometry is lost.
