description:
  en: >-
    Fifteenth-century fencing master from Pisa, perhaps the Philippo Vadi who served the d'Este of
    Ferrara. His De Arte Gladiatoria Dimicandi, given to Guidobaldo da Montefeltro, Duke of Urbino, in
    1482–1487, closely follows Fiore dei Liberi's work, with departures in names and method; it links
    Fiore and the Bolognese school.
notes: >-
  Wiktenauer notes that Vadi need not have belonged to Fiore's tradition in person: the d'Este owned
  copies of Fiore's treatise, which he could have studied. Recorded as learning from the book.
