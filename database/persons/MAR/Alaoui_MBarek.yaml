description:
  en: Moroccan aikido practitioner (died 2014), the first shodan of aikido in Morocco (awarded by Nobuyoshi
    Tamura in 1964) and the first 8th dan of aikido in North Africa. He began aikido in 1957 with European
    teachers including Georges Stobbaerts, and after the 1970 split followed the Tamura (Aikikai) line,
    founding the Syu do kan with Emile Metzinger. He served as technical director of the Aikido Federation
    of Morocco and trained thousands of students.
  pt: Praticante de aikido marroquino (morto em 2014), o primeiro shodan de Aikido em Marrocos (atribuído
    por Nobuyoshi Tamura em 1964) e o primeiro 8º dan de Aikido no Norte de África. Começou o Aikido em
    1957 com professores europeus incluindo Georges Stobbaerts, e após a cisão de 1970 seguiu a linha
    de Tamura (Aikikai), fundando o Syu do kan com Emile Metzinger. Foi diretor técnico da Federação de
    Aikido de Marrocos e formou milhares de alunos.
notes: Alaoui began aikido in 1957 with European teachers in Morocco (among them Georges Stobbaerts and
  Julien Naessens). He received his shodan from Nobuyoshi Tamura in 1964 as the first shodan in Morocco.
  In 1970 he and Emile Metzinger left Stobbaerts to create the Syu do kan, which followed Tamura's Aikikai
  line; the falling-out between Stobbaerts and Tamura at the Budo Club du Maroc in 1970 is documented
  in Gérard Obellianne's Aikido Journal interview. He stayed in Morocco when other teachers left, trained
  thousands of aikidoka, and was technical director of the Aikido Federation of Morocco. He died in 2014,
  described as the first 8th dan of aikido in North Africa.
