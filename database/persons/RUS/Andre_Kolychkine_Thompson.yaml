description:
  en: 'Judoka and coach considered the father of Cuban judo. Born in Finland and baptized in Saint Petersburg, he studied in Paris under Jean de Herdt, a disciple of Mikinosuke Kawaishi. Commissioned by Kawaishi, he introduced judo to Cuba in 1951, founded the Cuban Judo Foundation, and promoted the creation of the Pan American Judo Union. Director of the Cuban Judo Federation, coach of the national team, and author of "Judo: nueva didáctica"; reached 6th dan. Bert Becerra''s first teacher.

'
