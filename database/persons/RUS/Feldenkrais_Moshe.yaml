description:
  en: 'Moshé Feldenkrais (1904-1984) was a physicist and engineer, one of the introducers of judo in France
    in the 1930s and later the founder of the Feldenkrais Method of somatic education. Born in Slavuta
    in the Russian Empire (present-day Ukraine), he immigrated to Mandatory Palestine in 1918, where he
    studied jujutsu and self-defence, largely self-taught from books (he later told Jigoro Kano that he
    had studied judo by reading more than forty different books), and moved to Paris in 1928 to study
    physics, mathematics and engineering, obtaining a Doctor of Science in Physics at the University of
    Paris and working as a research assistant to Frédéric Joliot-Curie at the Radium Institute. After
    meeting Jigoro Kano in Paris in September 1933, he studied judo under Mikinosuke Kawaishi, earning
    his black belt in 1936 and 2nd dan in 1938. On 20 September 1936 he founded the Jiu-Jitsu Club de
    France with the help of his scientist colleagues and Paul Bonét-Maury, running it as one of its two
    vice-presidents; Jigoro Kano was honorary president of the club. Frédéric and Irène Joliot-Curie and
    Bertrand Goldschmidt took judo lessons from him at the institute. He published a French edition of
    his Hebrew jujutsu manual, La défense du faible contre l''agresseur, and between 1939 and 1940 worked
    under the physicist Paul Langevin. On the eve of the Nazi invasion in 1940 he fled to Britain, where
    he worked as a science officer in the Admiralty; his re-aggravated knee injury led him to develop
    the self-observation techniques published as Body and Mature Behavior (1948), the foundation of the
    Feldenkrais Method. He returned to Israel in 1951 and taught the method full-time in Tel Aviv from
    1954.

    '
  fr: 'Moshé Feldenkrais (1904-1984) était un physicien et ingénieur, l''un des introducteurs du judo
    en France dans les années 1930 et plus tard le fondateur de la méthode Feldenkrais d''éducation somatique.
    Né à Slavuta dans l''Empire russe (actuelle Ukraine), il émigre en Palestine mandataire en 1918, où
    il étudie le jujutsu et l''autodéfense, en grande partie en autodidacte à partir de livres (il dira
    plus tard à Jigoro Kano avoir étudié le judo en lisant plus de quarante ouvrages différents), puis
    s''installe à Paris en 1928 pour étudier la physique, les mathématiques et la mécanique, obtenant
    un doctorat ès sciences physiques à l''université de Paris et travaillant comme assistant de Frédéric
    Joliot-Curie à l''Institut du Radium. Après avoir rencontré Jigoro Kano à Paris en septembre 1933,
    il étudie le judo sous la direction de Mikinosuke Kawaishi, obtenant sa ceinture noire en 1936 et
    le 2e dan en 1938. Le 20 septembre 1936, il fonde le Jiu-jitsu Club de France avec l''aide de ses
    collègues scientifiques et de Paul Bonét-Maury, qu''il codirige comme l''un des deux vice-présidents
    ; Jigoro Kano en est le président d''honneur. Frédéric et Irène Joliot-Curie ainsi que Bertrand Goldschmidt
    prennent des leçons de judo avec lui à l''institut. Il publie une édition française de son manuel
    de jujutsu hébreu, La défense du faible contre l''agresseur, et travaille entre 1939 et 1940 sous
    la direction du physicien Paul Langevin. À la veille de l''invasion nazie de 1940, il se réfugie en
    Grande-Bretagne, où il travaille comme officier scientifique à l''Amirauté ; sa blessure au genou
    récidivée le conduit à développer les techniques d''auto-observation publiées dans Body and Mature
    Behavior (1948), fondement de la méthode Feldenkrais. Il retourne en Israël en 1951 et enseigne la
    méthode à plein temps à Tel-Aviv à partir de 1954.

    '
notes: 'Place of death recorded as Jaffa following Wikidata (Q180294); the English Wikipedia article gives
  Tel Aviv. Jaffa and Tel Aviv are conjoined municipalities (Tel Aviv-Yafo). Nationality: Russian by birth
  (born in the Russian Empire of Russian-subject parents; the English Wikipedia article gives the birth
  in the Empire and Wikidata cites Encyclopedia.com for citizenship 1904-1917); Israeli (opted; English
  Wikipedia infobox and lead describe him as Israeli); British (acquired; FEFNA states he became a British
  citizen in February 1949, Wikidata lists United Kingdom citizenship 1940-1949 without a reference -
  FEFNA is preferred for the date). Wikidata additionally lists Mandatory Palestine (1918-1933) and France
  (1933-1940) citizenships, both unreferenced; not recorded pending a sourcing decision. Budokwai: de
  Crée (2013) established from the club''s dan-rank register that Feldenkrais joined only in 1948 and
  that the claimed 1932 Budokwai shodan is a typo propagated from Judo Magazine (1959); the Koizumi study
  edge is therefore periodized 1948-1950 as probable.
  The Leggett edge rests on Feldenkrais''s own preface alone (possible). Koizumi wrote the foreword
  to the 1952 edition of Higher Judo. The 1936/1938 dan dates on the English Wikipedia article carry a
  citation-needed flag.'
