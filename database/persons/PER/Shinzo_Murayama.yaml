description:
  en: Japanese-born pioneer of judo in Peru. Born Shinzo Shiozaki in Kumamoto Prefecture in 1905, he started
    judo at age 12 and arrived in Peru at age 25 (c. 1930) with the aim of spreading the art. He was Alfredo
    San Bartolomé Morello's first judo teacher in Lima (1931-1936) and is regarded as the pioneer of judo's
    diffusion and development in Peru. Arequipa's Club Shinzo Murayama (founded 1992) and its annual Copa
    Shinzo Murayama tournament are named in his honour.
notes: 'The exact kanji of his Japanese name are not recorded in the sources found. Sources agree he was
  San Bartolomé''s first judo teacher in Lima but disagree on his dan grade: the Judo en Familia biography
  calls him 3rd dan of the Kodokan, while San Bartolomé''s own quoted anecdote calls him 2nd dan. No Japanese-language
  sources were found.'
