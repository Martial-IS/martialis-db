description:
  en: Peruvian-born pioneer of judo in Spain. He discovered judo in Lima in 1931, trained under Japanese teachers (Shinsho Siosaki Murayama, Makishima) in Peru, and arrived in Spain in 1947, giving the first judo classes in Madrid at the Gimnasio Juventud on Calle Fuencarral. He co-founded the first Spanish judo club, the Asociación Española de Judo y Jiu-jitsu (May 1950), later the Club Bushidokwai, and served as unofficial technical adviser of the Spanish Judo Department until Yves Klein's arrival in 1954. He published the Método de Judo del Gimnasio Bushidokwai and was awarded the Medalla de Oro al Mérito Deportivo in 1972.
notes: 'Sources disagree on the granter of the 3rd dan in 1954: the Judo en Familia biography says it was granted by Yves Klein (Kodokan delegate for Spain) with Ichiro Abe as sponsor, while the Sueños de Olimpia blog says it was granted by Ichiro Abe (Kodokan delegate for Europe). The Judo en Familia biography also casts doubt on the 2nd dan: San Bartolomé claimed the grade on arrival in Spain in 1947, and comparison with other judoka arriving from abroad raised doubts about it. While a 2nd dan in Peru he also learned karate and served as capitán de comandos in an intensive course under Japanese masters (Makishima, Kizutani, Hamada). He published the Método de Judo del Gimnasio Bushidokwai, printed in the family printing shop of Fernando Franco.'
