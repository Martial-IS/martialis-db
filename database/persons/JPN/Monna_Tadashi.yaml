description:
  en: >-
    One of the five shuchō (chief commissioners) who formulated the Dai-Nippon Teikoku Kenjutsu Kata (1911-1912). Born into a hereditary line of Mito-domain fu-karō. After his release from house confinement in 1868, he studied Suifu-ryū kenjutsu at the domain school Kōdōkan under Toyoshima Genpachi, receiving menkyō kaiden. In 1882 he entered the Mito Tobukan: Hokushin Ittō-ryū under Kozawa Torakichi, Shin Tamiya-ryū battojutsu under Kozawa Ichirō - menkyō kaiden in both - and from 1885 also instruction from Shimoe Hidetaro, 'the one who most fully inherited Shimoe's technique'. Brought to the Keishichō by Shimoe in 1888 (1888-1899); from 1899 the Kanagawa prefectural police, where he worked to establish the Butokukai's Kanagawa branch (Seirenshō 1899). Professor at the Butokukai headquarters in Kyoto from 1907, 'Waza Monna, Ki Takaharu' alongside Naitō Takaharu; hanshi in 1913 (special case, at 59). Dismissed from the headquarters in 1919, then taught in Nagoya until his death.
  ja: >-
    大日本帝国剣道形制定の五主査の一人。代々水戸藩付家老の出身。弘道館で豊島源八に水府流を学ぶ（免許皆伝）。1882年、 東武館に入門し、小澤寅吉に北辰一刀流、小澤一郎に新田宮流を学ぶ（いずれも免許皆伝）。1885年より下江秀太郎の 教えを受ける。「下江の技を最も受け継いだ」と評された。1888年から警視庁、1899年より神奈川県警（大日本武徳会 神奈川支部設立に尽力、精錬証）。1907年より大日本武徳会本部教授、「技の門奈、気の内藤」。1911年、剣道形制定 委員会の五主査の一人。1913年、範士（59歳、特例）。1919年、本部を解任され名古屋に移る。
notes: >-
  Death: JA wiki gives Shōwa 4 (1929) 9/22; Nakamura's Kendō Jiten (cited by the JA wiki) gives Shōwa 5 (1930) 9/22; kenshi247 also gives 1930 - recorded as an EDTF set. Place of death is likewise contested (JA wiki context: Kyoto; kenshi247: seclusion in Nagoya) - not modeled. Entry to Tobukan: kenshi247 says 'c. 1881'; the JA wiki gives Meiji 15 (1882) - 1882 used. The JA wiki's 28 heads taken at the Battle of Pyongyang (1894) carries the source's own caveat ('under certain circumstances') and is outside this database's scope (teaching/rank events only). The 1919 dismissal details (the relationship with Aiko; Nishikubo Hiromichi's discipline push) are treated with caution by the JA wiki itself; only the dismissal (1919) is modeled. Domoto Akihiko's Meiji Gekken-ka (2001) is cited by the JA wiki with page numbers (pp. 204-205 on the 1919 dismissal, p. 261 on the 1894 Pyongyang incident); not directly consulted, so not carried as a Source record.
