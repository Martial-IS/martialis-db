description:
  en: Japanese aikido teacher, a 3rd dan at the time, who came to Portugal around 1975/76 and taught aikido
    at the Escola de Budo in Lisbon (Largo de Sapadores) and in several dojos of Lisbon and Almada, launching
    the Shiseikai association in the country. He returned to Japan in 1978 and was replaced by Toshio
    Kawakami.
  pt: Professor japonês de Aikido, então 3º dan, que veio para Portugal por volta de 1975/76 e ensinou
    Aikido na antiga Escola de Budo em Lisboa (Largo de Sapadores) e em vários Dojos de Lisboa e Almada,
    lançando a associação Shiseikai no país. Regressou ao Japão em 1978, sendo substituído por Toshio
    Kawakami.
