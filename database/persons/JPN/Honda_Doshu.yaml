notes: '- Honda Doshū (本田土洲), known in Portugal as Misao Honda, was a Japanese aikido teacher and the
  founder of Aikido Aikikai in Portugal.

  - A student of Hirokazu Kobayashi, he went to Portugal as a young man and spread aikido there, teaching
  at the Academia de Budo from December 1971 to about August/September 1972 (Leopoldo Ferreira''s account).

  - In 1975 he returned to Portugal at the invitation of the "Escola de Budo" of Mitsuharu Tsuchiya; his
  first demonstration, on 10 May 1975 at the Clube Naval Setubalense, gave rise to the first Aikido Aikikai
  school in Portugal (ADAS).

  - In 1980 he formed Portugal''s first two yudansha registered with the Hombu Dojo Aikikai in Tokyo;
  one of them, Orlando Marques Pereira, passed his 1st dan with Honda on 29 June 1980. In his last years
  Honda was technical advisor to the ADAS.

  - In Japan he was president of the Senshu Aikido Association (泉州合気道協会); after his death the association
  was renamed Senshu Buikukai (泉州武育会) and taken over by Egawa Sensei, within the Buikukai network led
  by Kimura Jiro (Kobayashi Hirokazu''s successor).

  - The birth year 1944 comes from the YouTube video description only; no Portuguese or Japanese source
  corroborates it, so it is recorded with low confidence.

  - Died on 14 January 2011.

  '
