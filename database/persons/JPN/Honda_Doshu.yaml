description:
  en: Japanese aikido teacher (7th dan Aikikai, shihan) and founder of Aikido Aikikai in Portugal. A student
    of Hirokazu Kobayashi, he went to Portugal as a young man and spread aikido there, teaching at the
    Academia de Budo in 1971-72 and returning in 1975, when his first demonstration at the Clube Naval
    Setubalense gave rise to the first Aikido Aikikai school in Portugal. In Portugal he is known as Misao
    Honda; his Japanese name was Honda Doshū.
  pt: Professor japonês de aikido (7º dan Aikikai, shihan) e fundador do Aikido Aikikai em Portugal. Aluno
    de Hirokazu Kobayashi, foi para Portugal em jovem e aí difundiu o Aikido, ensinando na Academia de
    Budo em 1971-72 e regressando em 1975, quando a sua primeira demonstração no Clube Naval Setubalense
    deu origem à primeira escola de Aikido Aikikai em Portugal. Em Portugal é conhecido como Misao Honda;
    o seu nome japonês era Honda Doshū.
