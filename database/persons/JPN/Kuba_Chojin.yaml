description:
  en: Okinawan karateka of Tomari-te, neighbor of the Nagamine family in Tomari, Naha; Shoshin Nagamine's
    first teacher, with whom he began karate at 17 in 1926.
notes: Known only through Shoshin Nagamine's account. Nagamine, recovering from a gastroenteric disorder,
  began practicing karate at the backyard of his neighbor friend Chojin Kuba in 1926 at age 17; the ODKS
  tourism page and Charles Goodin's article describe Kuba as a practitioner of Tomari-te living in the
  same neighborhood. No biographical dates are recorded.
