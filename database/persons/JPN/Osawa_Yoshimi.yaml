notes: Japanese judoka known for exceptional foot techniques (ashi-waza). Nicknamed 'Current Ushiwakamaru' (昭和の小天狗) for his speed and agility despite small stature (167cm, 67kg). Waseda University professor who played key role in developing women's judo internationally. Served as head instructor at Waseda and held various positions in Kodokan and All Japan Judo Federation. Promoted to 10th dan in 2006 along with Ichiro Abe and Toshiro Daigo.
