notes: >-
  Kanji for Hiroaki not found; 小暮りき is the only native form seen.
  Author of Kuroobi Shosha Sekai o Iku (encyclopedia; no publisher or year).
  Lead: the Aikido Journal US history entry says he trained Tony Sereda in
  Chicago. Pending: BAA and JAA org records (technical adviser, chief
  director/CEO, rank conferredBy). Aiki News 82 PDF link is 404.
  The death notice relays Shishida via Eddy Wolput; the year is from the
  post date.
