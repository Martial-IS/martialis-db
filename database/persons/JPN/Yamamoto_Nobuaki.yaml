notes: Birth year estimated as 1942 based on being described as 26 years old in 1968 in Portuguese sources.
  Left for Iceland in early 1969. Returned to Portugal in May 2002 to attend International Judo Tournament
  in Luso. His own teacher (as a Kodokan student and former university champion in Japan) is unidentified;
  no place, period, or source details recorded for it.
