description:
  en: Nobuaki Yamamoto (born ~1942) was a Japanese judo master who taught at Clube de Judo do Porto in
    Portugal from 1968 to 1969. A 5th dan Kodokan student and former university champion in Japan, he
    was brought to Portugal under the Fundo de Fomento Desportivo program to teach judo.
  pt: Nobuaki Yamamoto (nascido ~1942) foi um instrutor de Judo e 5 dan Kodokan que ensinou no Clube de
    Judo do Porto em 1968-1969, ao abrigo do Fundo de Fomento Desportivo
