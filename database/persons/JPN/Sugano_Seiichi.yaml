notes: '- Sugano Seiichi (菅野誠一, 17 December 1939 - 29 August 2010) was a Japanese aikido teacher and 8th
  dan Aikikai Shihan.

  - Trained judo for six years before taking up aikido around age 18; entered the Aikikai Hombu Dojo in
  1957 and became an uchi-deshi of Morihei Ueshiba in 1959.

  - In 1965, as a 5th dan, he was appointed by Morihei Ueshiba to introduce aikido in Australia; he remained
  there 15 years and founded Aiki Kai Australia.

  - At the request of Nobuyoshi Tamura he went to Europe, teaching in Belgium, Luxembourg and France.

  - From 1988 he resided in New York City, co-instructing with Yoshimitsu Yamada at the New York Aikikai.

  - Suffered a below-the-knee amputation in 2003 but continued to teach.

  - Before his death he recommended Tony Smibert, Robert Botterill and Hanan Janiv for promotion to 7th
  dan and the title of shihan; they became trustees of the Sugano (Aikido) Foundation he established in
  Australia.

  - His teaching emphasized speed, power, timing and distance, with little formal weapons kata.

  '
