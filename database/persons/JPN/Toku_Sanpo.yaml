notes: 'The French interviews call him ''Sampo Toku'' or ''Sanbo Toku'' and locate his dojo at Komatsugawa;
  Wikipedia gives the Japanese name order Toku Sanpō (徳 三宝). The Japanese Wikipedia article adds: his
  real-name reading was Toku Mitaka (本名「とく みたか」); he was born on Tokunoshima (Amagi-cho Kanekyu, Oshima
  district, Kagoshima); he was recommended to Tokyo by Samura Kaichiro (佐村嘉一郎, later 10th dan, covered
  separately); after his 1917 reinstatement he taught Hayashi Iwazo and Ushijima Tatsukuma; he is credited
  with the ''knee-on-one-point'' (膝つき一本) saying; his death age is given as 58 (the English Wikipedia says
  57); his life was dramatized in the 1961 NHK series ''Asu wo Tsugeru Kane'' and he appears in the NHK
  taiga drama ''Idaten''. The ja Wikipedia and the English Wikipedia disagree on whether Tokugoro Ito
  was his teacher: the ja sources frame Ito as a fellow Kodokan student under Kano.'
