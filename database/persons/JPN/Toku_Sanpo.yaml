description:
  en: Pre-war Kodokan judoka known as 'Oni no Toku' (Toku of the Devilness), the 'demon of the Kodokan'
    of Mochizuki's interview, 9th dan of Kodokan judo. Famous for defeating 165 opponents in a single
    league as a young man and for the public rivalry with Mifune ('Waza no Mifune / Oni no Toku'). Expelled
    from the Kodokan in 1912 after defeating fifteen Brazilian Navy sailors, pardoned and reinstated by
    Kano in 1917. Ran his own dojo in Komatsugawa, Tokyo, where the young Minoru Mochizuki trained from
    1924.
