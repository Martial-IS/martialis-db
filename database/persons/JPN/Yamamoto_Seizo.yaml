description:
  en: 'Japanese jujutsuka of the Daito-ryu jujutsu school founded by Handa Yataro in Osaka. One of the
    first generation

    of Japanese jujutsu men invited to London: per the Bartitsu accounts, Barton-Wright arranged for Kaneo
    Tani,

    Seizo Yamamoto and Yukio Tani to travel to London and serve as instructors at the Bartitsu Club; Yamamoto
    and

    Kaneo Tani soon returned to Japan. Wolf (2016) identifies "S. Yamamoto" among the Bartitsu Club principals
    and

    lists him alongside Uyenishi and Taro Miyake among the products of Handa''s Osaka dojo.

    '
  ja: '半田弥太郎が大阪で開いた大東流柔術の柔術家（四段）。バーティツ設立の際にカネオ谷・山本清蔵・谷幸雄がロンドンへ招かれ、

    バーティツ学校の指導員となった最初期の日本人の一人。山本とカネオ谷は間もなく帰国した。

    '
