description:
  en: Master of Rikishin-ryu (力信流), a comprehensive martial art of jujutsu, kendo, iai and bojutsu. Came
    to Shizuoka from Okayama as the Shizuoka police headquarters jujutsu instructor (c. 1900), founded
    the Bushukan dojo in Shizuoka City in 1903, and served as a Shizuoka Prefecture police bujutsu professor
    (1908 and 1918). The dojo Minoru Mochizuki entered in 1918 to begin kendo.
