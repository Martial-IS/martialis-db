notes: 'The name 大長九郎 has two attested romanizations: ''Onaga Kuro'' (also rendered Onaga Kurou) and ''Daicho
  Kuro'', the latter used by the Shizuoka Prefecture Kendo Federation. Kruyning''s The Art of Ju-jutsu
  renders him ''Kuro Daicho'' (given name first), which initially obscured the identity; the Japanese
  Wikipedia article on Mochizuki Minoru confirms the kendo teacher and dojo. Birth and death dates are
  not established in the available sources.'
