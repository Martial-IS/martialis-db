description:
  en: Japanese aikido master who founded the Yoshinkan style of aikido. One of Morihei Ueshiba's most senior students, having trained as an uchi-deshi from 1932. Known for developing a structured, practical approach to aikido that was adopted by the Tokyo Metropolitan Police. Held the rank of 9th dan Aikikai and 10th dan IMAF.
