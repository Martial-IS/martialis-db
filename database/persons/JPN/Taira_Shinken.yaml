description:
  en: Okinawan martial artist and kobudo master. He studied karate under Gichin Funakoshi and kobudo under
    Moden Yabiku. He traveled across the Ryukyu Islands compiling 42 existing weapons kata, preserving
    Okinawan kobudo for future generations. He founded the Ryūkyū Kobudō Hozon Shinkokai in 1955 and was
    a major influence on Fumio Demura's kobudo training.
