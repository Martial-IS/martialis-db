description:
  en: Okinawan martial arts master (1942-2007) of Shorin-ryu Matsumura Seito karate and kobudo, uchi-deshi
    and heir of Hohan Soken; internationally recognized as the heir of Grand Master Soken's Matsumura
    Seito lineage.
notes: 'Nishihira studied the "orthodox" Shorin-ryu Matsumura Seito karate with Hohan Soken from age 15
  as one of a very few carefully selected uchi-deshi, and remained close to Soken until his death, taking
  care of him in his old age. He became a grand master recognized as the heir of Soken''s karate, but
  kept a low profile, handing the style only to a few students: Giuseppe Meloni, Ricky Rose, Theodore
  Lange, Steve Watson and Richard Boyden.'
