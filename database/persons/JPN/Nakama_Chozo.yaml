description:
  en: Okinawan Kobayashi Shorin-ryu karate-do teacher (1899-1982), primary student of Chosin Chibana who
    also studied with Chomo Hanashiro, Chotoku Kyan, Kenwa Mabuni, Choki Motobu and Kentsu Yabu; taught
    in Shuri from c. 1935 to 1982.
notes: Nakama taught karate in Shuri, Okinawa, from c. 1935 to 1982. The EN Wikipedia article on Hanashiro
  lists him among Hanashiro's most eminent disciples, stating he later became a disciple of Choshin Chibana
  - consistent with the primary-teacher claim in his own article. Per Motobu Naoki's Motobu-ryu blog,
  Nakama was a senior disciple of Chibana Choshin, learned kumite from Choki Motobu when Motobu briefly
  returned to Okinawa for the 1936 Roundtable of Karate Masters, had a close post-war relationship with
  Uehara Seikichi (exchanging techniques), and had no dojo of his own, teaching at a local community center
  and at his home; per Nakamoto Mamoru (Bunbukan Dojo), Nakama learned the Gojushiho kata from Hanashiro
  Chomo. Seijin Jahana's 1978 Aoi Umi article (interviewing the then 80-year-old Nakama) confirms he learned
  karate directly from Choki Motobu, whose own dojo opened around 1940 in Nishishinmachi (Kumecho), Naha
  after his return from Osaka, and records the story of the unpublished manuscript Nakama copied into
  four notebooks (later burnt in an air raid). The Motobu-ryu official history confirms Nakama "had also
  studied under Motobu Choki sensei" and was skilled at yakusoku kumite.
