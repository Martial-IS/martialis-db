description:
  en: >-
    Mito-domain retainer and one of the sword saints of the late Edo period, founder (sōke) of
    Hokushin Ittō-ryū, which he established by synthesizing Hokushin Musō-ryū and Ono-ha Ittō-ryū
    Nakanishi-ha. He ran the Genbukan dojo in Edo (established 1820 per Bennett; 1822 per the JA
    wiki), one of the three great dojos of Edo, and from 1839 served as the Mito domain's kenjutsu
    instructor. After the Restoration the Genbukan line continued through his sons Eijirō and
    Michisaburō: 'Shimoe Hidetaro, a disciple of Chiba Eijirō, became the Keishichō kenjutsu
    officer, and Naitō Takaharu and Monna Tadashi of Mito became Butokukai professors' (JA wiki).
  ja: >-
    江戸時代後期の武士・剣術家。北辰一刀流の流祖。幕末江戸三大道場の一つである玄武館を営み、1839年（天保10年）から
    水戸藩剣術師範。合理的かつ実戦的な剣術体系を確立し、宮本武蔵らとともに剣聖の一人に数えられる。
