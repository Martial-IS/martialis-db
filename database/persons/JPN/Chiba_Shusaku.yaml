notes: >-
  Birth year: JA wiki gives Kōan 5 (1793) or Kōan 6 (1794); Bennett and the EN wiki give 1794 - 
  recorded as an EDTF set. Birthplace disputed (Kesennuma, Miyagi, the most-supported theory per
  JA wiki); not modeled. Training: as a child he learned Hokushin Musō-ryū from the local swordsman
  Chiba Yoshinojō, and at 15/16 entered the Ono-ha Ittō-ryū Nakanishi-ha dojo under Asari
  Yoshinobu, becoming his son-in-law (JA wiki) - no periods recorded, so no teacher assertions.
  The Mito domain temporarily banned Hokushin Ittō-ryū after the Tengu-tō incident (JA wiki).
