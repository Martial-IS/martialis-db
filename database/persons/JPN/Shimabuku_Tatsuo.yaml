description:
  en: Okinawan martial artist (1908-1975), founder of Isshin-ryu karate; studied under Chotoku Kyan, Chojun
    Miyagi, Choki Motobu and Shinken Taira.
notes: 'Shimabuku began karate at age 13 with his uncle, who later sent him to study with Chotoku Kyan;
  he became one of Kyan''s best students and studied with him until 1939, learning the kata Passai, Useishi,
  Seisan, Naihanchi, Wansu, Chinto and Kusanku plus the weapons kata Tokumine nu kun and basic sai. He
  sought out Chojun Miyagi for Goju-ryu (Tensho, Seiunchin and Sanchin), studied about a year with Choki
  Motobu (1942), and in the late 1950s-early 1960s studied kobudo with Shinken Taira. He first called
  his style Chan-migwa-te (after Kyan''s nickname), then Sun nu Su-te, and founded Isshin-ryu ("One Heart
  Style") on January 15, 1956, blending Shorin-ryu, Goju-ryu and kobudo. Birth name Shinkichi Shimabuku.
  Wikidata also carries conflicting death dates (30 and 31 May 1975); the EN Wikipedia date (30 May) is
  used. Date conflict note: the primary biography by A.J. Advincula (1997) gives different training periods
  than the EN Wikipedia article - Kyan for four years from about age 23-24 (c. 1931-1935, vs the article''s
  1927-1939), Miyagi for about three years from c. 1936, and Motobu for one year in Naha in 1938 (vs the
  article''s 1942); the article dates are kept per the current curation policy, with the Advincula account
  recorded here. Advincula does not mention Shinken Taira, who is corroborated only indirectly through
  Eizo Shimabukuro''s interview.'
