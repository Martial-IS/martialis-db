description:
  en: Japanese aikido master, student of Morihiro Saito and Morihei Ueshiba, founder of Aïki Shin Myo Den (Takemusu Aiki)
notes: '- First visited Iwama in 1962 and decided to follow the teaching of Morihei Ueshiba and his assistant Morihiro Saito

  - Became Morihiro Saito''s uchideshi (live-in student) in 1968 and was adopted by the Saito family

  - Practiced at Iwama Dojo for about 7 years, studying under both Ueshiba (until his death in April 1969) and Saito

  - Moved to Sweden in August 1969 and opened his own dojo in 1976

  - Promoted to 7th dan by Aikikai in 1989, later promoted to 8th dan

  - Founded his own style called "Aïki Shin Myo Den" (Takemusu Aiki)

  - Known for his sword work with jumping entry movements

  - Taught extensively in Europe, particularly in Sweden

'
