description:
  en: >-
    Early non-resident judo student of Kanō Jigorō, also taught by him at Gakushūin; later a school
    principal, chamberlain to the imperial family and member of the House of Peers. Kanō appointed him
    head of the Kumamoto branch of the Kōdōkan in 1893. Kōdōkan 4th dan.
notes: >-
  The memoirs (English translation) spell him "Sumifumi Arima" on p. 20 and "Sumiomi Arima" on p. 57;
  no kanji in hand.
