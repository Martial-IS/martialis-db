notes: Born Shida Sadajiro in Aizuwakamatsu, Fukushima, third son of a samurai. Adopted by former Aizu Domain elder councillor Tanomo Saigo in 1884, taking name Hoshina Shiro, later reverted to Saigo in 1888 to resurrect family line. Enrolled at Kodokan in August 1882 as Jigoro Kano's second student. Along with Tsunejiro Tomita, first to be awarded shodan (black belt) in 1883. Key figure in 1886 Tokyo Metropolitan Police tournament where Kodokan judo defeated Totsuka-ha Yoshin-ryu jujutsu, establishing judo's superiority. Known for yama arashi technique and exceptional agility, nicknamed 'Cat' for ability to land on feet when thrown. Left Kodokan in 1890 after street brawl incident. Later worked as journalist in Nagasaki for 'Toyo Hinode Shimbun', taught judo, kyudo, and Japanese swimming. Died in Onomichi in 1922. Model for main character in Tomita Tsuneo's novel 'Sugata Sanshiro' (1942), adapted into Akira Kurosawa's 1943 film.
