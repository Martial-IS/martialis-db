description:
  en: 'Japanese jujutsuka who, with Takitaro Taki, brought jujutsu to Portugal (Lisbon, late 1909), then
    acted in

    Porto (16 Jun - mid Aug 1910) against Yamaguchi among others. Possibly the smallest Japanese wrestler
    of the era

    (1.45 m, 50 kg). Married Phoebe Laughton Parry (the British women''s jujutsu pioneer, covered here
    as Phoebe

    Roberts) in March 1907; the couple demonstrated at the Palace Theatre, Manchester in 1908, where Phoebe
    was billed

    as ''Miss Roberts, Lady Champion Ju-jitsu Wrestler of the World''. Hirano founded a Ju-jitsu Academy
    in Barcelona in

    1909, then moved to Portugal with Phoebe, teaching the PSP police in Porto and training Armando Gonçalves.

    Per Callan/Heffernan/Spenn (2019) he is thought to have drowned off Santa Cruz beach, Portugal in
    1915, his body

    never found; Phoebe remarried (Carlos de Castro Henriques) in 1916. Gonçalves''s own books (1914,
    1936, 1941,

    1942) attest his discipleship under Hirano.

    '
  pt: 'Mestre japonês de jujutsu que, com Takitaro Taki, trouxe o jujutsu a Portugal (Lisboa, finais de
    1909) e depois

    atuou no Porto (16 de junho - meados de agosto de 1910), entre outros contra Yamaguchi. Casou com
    Phoebe Laughton

    Parry, antiga aluna de Raku em Londres, e fixou residência com ela no Porto, onde ensinou a PSP e
    treinou Armando

    Gonçalves.

    '
notes: Teacher unidentified; no place, period, or source details recorded for his own training.
