description:
  en: >-
    Founder of Shorinji Kempo (1947), born Nakano Michiomi in Okayama Prefecture. He trained in
    Manchuria in aiki-jujutsu and Chinese quanfa, and set up the first dojo at Tadotsu, Shikoku. Draeger
    saw Hakko-ryu jujutsu in the system's techniques. His daughter Nakano Yuki succeeded him in 1980.
notes: >-
  Green & Svinth (p. 172): his teachers in Manchuria were his grandfather (aiki-jujutsu) and the quanfa
  masters Chen Liang, Wen Taizong and (reputedly) Huang Longbai; no records yet.
