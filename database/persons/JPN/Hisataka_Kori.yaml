description:
  en: Japanese karateka (1907-1988), founder of Shorinjiryu Kenkokan Karate; studied karate under Chotoku Kyan, kobudo under Sanda Kanagusuku, and judo at the Kodokan.
notes: Hisataka was a descendant of Seiwa, the 56th Emperor of Japan. He studied karate from Chotoku Kyan and weapons from kobudo pioneer Sanda Kanagusuku, learned the Kudaka family arts (Shishiryu weapons and Okinawa-te) from his father Seisei Kudaka, an uncle and his grandfather, and achieved 4th dan in judo at the Kodokan within a year under Sanpo Toku. In August 1930 he toured Taiwan with Kyan and Ryosei Kuwae. He founded the first Shorinjiryu Kenkokan dojo in Kumamoto in 1945, later relocating to Tokyo (Setagaya, then Shinjuku), and pioneered protective equipment (bogu) in karate kumite. His son Masayuki Hisataka continued the style. He used the title Shinan while teaching, later honored as Kaiso. The Kengokan biography adds that he was born Seiki Kudaka, of the Kudaka noble family of Kudaka Island; that his early instructors were his father, grandfather and uncle (Kudaka-ryu Okinawa-te and Shishiryu bojutsu); that he is likely to have met Higaonna Kanryo and Miyagi Chojun at the Naha Municipal Commercial School; that he trained with Sanda "Ufuchiku" Kanagusuku; and that during the Manchurian railway years he trained regularly with Minoru Mochizuki (whose Yoseikan Budo includes the form Happoken taught by Hisataka) and learned Baji Quan (Hakkyoku-ken) from a Chinese master. Kyan is described as "perhaps the main teacher" of Hisataka, and the style's kata Bassai, Seisan, Chinto, Kusanku and Nijushiho are traced through the Kyan lineage.
