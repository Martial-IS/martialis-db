notes: Morihiro Saito was a teacher of the Japanese martial art of aikido, with many students around the world. Saito's practice of aikido spanned 56 years, from the age of 18, when he first met aikido founder Morihei Ueshiba, until his death in 2002. He was born in Ibaraki Prefecture, Japan, on March 31, 1928, and died of cancer on May 13, 2002 in Iwama, Ibaraki Prefecture. Saito trained under Ueshiba for 23 years and after Ueshiba's passing, became the head of the Iwama Dojo and keeper of the Aiki Shrine. He is renowned for his depth of technical knowledge and dissemination of Aikido weapons, having trained in Aikido for more than 50 years and regarded as the world's technical expert on Aikido. He published many technical books and traveled extensively conducting seminars worldwide.
