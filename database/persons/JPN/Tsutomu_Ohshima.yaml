description:
  en: Japanese Shotokan karate master and founder of Shotokan Karate of America (SKA). He trained under Gichin Funakoshi at Waseda University and was awarded 5th dan by Funakoshi. He founded the first university karate club in the US at Caltech in 1957 and established the Southern California Karate Association, later renamed SKA. He translated Funakoshi's Karate-do Kyohan into English and was selected as Black Belt magazine's Japanese Instructor of the Year in 1968.
