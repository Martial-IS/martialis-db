notes: '- Sent by Jigoro Kano to study aikijujutsu with Morihei Ueshiba (1930), Shindo Muso-ryu jojutsu with Shimizu Takaji (清水隆次; the interviews render the name ''Koji Shimizu'', a misrendering per the Japanese Wikipedia), and the sword with Hakudo Nakayama; the stated purpose was to report Ueshiba''s techniques back to Kano (''espionner'' - monthly technical reports)

  - Member of the Kodokan''s Kobudo Kenkyukai (created by Kano in 1928, about thirty members, all judo champions). The four Katori Shinto-ryu shihan (Tamai, Kuboki, Ito Tanekichi, Shiina) came from Narita twice a month, paid by Kano; after three months only Mochizuki remained, and Kano asked him to form a new section, which he did with ten small-statured judoka

  - Refused three marriage/succession proposals: the Katori Shinto-ryu 19th Soke-ship, adoption as Morihei Ueshiba''s son-in-law (conveyed by Admiral Takeshita), and a pharmaceutical company president

  - Received two Daito-ryu transmission manuscripts from Ueshiba in 1932 (Goshinyo no te, Hiden ogi no koto); Tomiki received his slightly before. The Karaté-Bushido interview records the 1933 Okuden Inka diploma as the highest distinction of the school, with authorization to teach

  - Sokaku Takeda visited Ueshiba once while Mochizuki was in charge of the dojo; the Dragon Magazine interview places the visit at the end of the Ushigome dojo construction (c. 1931), the 1987 Karaté-Bushido interview dates it 1935 (discrepancy recorded, no assertion made)

  - Opened the Yoseikan dojo in Shizuoka in November 1931 during convalescence from pleurisy and tuberculosis (hospital and convalescence costs covered by Kano); Ueshiba attended the opening along with Admiral Takeshita, General Miura, Harunosuke Enomoto and Yasuhiro Konishi

  - The sutemi waza of his teaching were his own creation combining judo and aiki-jujutsu, with the inspiration drawn from Gyokushin-ryu

  - 1938-1945 in Mongolia: director of the Pao-To school (2 years), then sous-prefect of the Chinese department of Sei Sui Ga under the Mongolian government; organized the defense of his town when besieged in 1941; developed irrigation canals on the Yellow River (70 to 200 km) and built a school and two 200-meter bridges; received the highest decoration of the Mongolian government

  - Karate: taught by Kudaka in Mongolia (a style close to Shuri-te), basis for the kata Happoken; separately followed three months of Gichin Funakoshi''s courses in Tokyo, not considering himself really his student

  - After the war, visited the Iwama dojo to greet Ueshiba and there met Tadashi Abe, who challenged him and was knocked down with a kick (Abe is not the same person as Abbe Kenshiro)

  - Rebuilt the Yoseikan dojo in 1947; 1951-1953 in France, sent by the Association des Universités Japonaises; claims to have been the first qualified karate teacher in France; also took up English and French boxing

  - Tomiki and his brother were born the same day of the same year and became close friends

  - In 2000 transferred the direction of the Yoseikan dojo to his son Hiroo, founder of Yoseikan Budo

  - Age-five discrepancy: Kruyning says jujutsu from the grandfather; both interviews say judo at Takebe''s dojo in Tokyo (1912). The grandfather, per the 1987 interview, was a sword master (maitre d''armes) of a Tokaido samurai lineage; Mochizuki''s father Miozo practiced kenjutsu of the Itto-ryu school (一刀流; the Dragon Magazine OCR renders the school name as ''Ttto Ryu'', the corrected reading per the interview text ''de l''école Itto Ryu'') - see the Itto_ryu style entry

  - Kendo timeline: the Japanese Wikipedia dates the start of kendo to 1918 at the Bushukan dojo of Onaga Kuro (大長九郎, also romanized Daicho Kuro), a Rikishin-ryu master; the Dragon Magazine interview instead places it in 1924 at Komatsugawa with an unnamed teacher. Both are recorded; the divergence is not resolved. Kruyning''s ''Kuro Daicho'' (given-name-first) is the same Onaga/Daicho Kuro

  - The Shizuoka Kendo Federation history records that in 1924 Mochizuki and Murai Kyoichi spread Tenshin Shoden Katori Shinto-ryu at the Eishinkan dojo of Oka Fumio in Shizuoka City, before his Kodokan-era study of the school

  - Birth-date discrepancy: the Japanese Wikipedia gives 1907-04-11 while the English Wikipedia and Mochizuki''s own interviews give 1907-04-07; the first-person date is kept'
