description:
  en: Japanese-American Shito-ryu karate master and kobudo expert. He came to the United States in 1965 and became renowned for his karate and Okinawan weapons skills. He was Pat Morita's martial arts stunt double in The Karate Kid films and one of the inspirations for the Mr. Miyagi character. He authored numerous books on karate and kobudo and founded the Genbukai organization. He was promoted to 9th dan in Shito-ryu.
