description:
  en: Japanese master of Goju-ryu karate (1941-2015), senior student of Eiichi Miyazato, founder of Jundokan
    International; taught in Spokane, Washington, from 1969.
notes: 'Chinen''s family had Shuri-te and Yamanni-ryu kobudo connections (his granduncle was Masami Chinen,
  whom he called "grand-uncle Shobi"; the JA Wikipedia adds that his grandfather was a full-time te instructor
  and his great-grandfather belonged to the Yamane-ryu kobudo lineage), but he trained in Goju-ryu. He
  began training under Eiichi Miyazato in 1954 - after Chojun Miyagi''s death - so the Wikidata P1066
  teacher claim on Chōjun Miyagi is dropped as a lineage artifact rather than a direct relationship. In
  his 1997 interview with Dong Tran he states his main instructor was Miyazato Sensei, who taught him
  under Miyagi''s watchful eye, and that after Miyagi''s death in 1953 he helped Miyazato move the training
  equipment to the Jundokan. He was in Tokyo at the Yoyogi Dojo from 1958 to 1969 helping Morio Higaonna
  teach, and credited Higaonna with his technical education (the Shuriway biography says they developed
  randori together); he co-chaired the IOGKF (International Okinawan Goju-ryu Karate-do Federation) with
  Higaonna, laying its European and South African foundations between 1973 and 1979. Miyazato promoted
  him to yondan before he left for Spokane in 1969. He founded Jundokan International in 1987 (the Shuriway
  biography gives 1984, "in honor of his teacher, Sensei Ei''ichi Miyazato" - both dates recorded) and
  assisted as translator in the preparation of Classical Kata of Okinawan Karate (1987). The JA Wikipedia
  gives his 7th dan promotion by Miyazato as around 1988 and notes he suffered undiagnosed diabetes from
  1995, with diabetes and nephropathy as his cause of death. Birth date note: the JA Wikipedia lead gives
  July 8, 1941 while the body, the EN Wikipedia and the Shuriway biography give June 8, 1941 - the June
  date is kept.'
