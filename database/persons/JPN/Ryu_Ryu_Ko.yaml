description:
  en: Chinese martial artist (1852-1930), probably a practitioner of Fujian White Crane kung fu, who taught
    in Naha; his students included Higaonna Kanryō, founder of Naha-te, and Arakaki Seishō. His exact
    identity is disputed, with some scholars identifying him with Xie Zongxiang.
notes: Most knowledge of Ryū Ryū Ko comes from oral tradition among his students; his existence and identity
  are disputed. Tokashiki Iken's research identifies him with Xie Zhongxiang (謝宗祥), born in Changle, Fujian - an identification the Fuzhou Wushu Association disputes — while research by Filip Konjokrad points
  toward Liu Long Gong (劉龍公), a military officer and chief instructor at the Royal Bodyguard School who
  visited the Ryukyu Islands in 1838 and 1866. The EN Wikipedia article gives a floruit of 1793-1882,
  conflicting with the Wikidata-derived dates (1852-1930) used here; both are recorded under the possibly_same_as
  entry with Xie Zongxiang. Higaonna Kanryō studied with him in Fuzhou from 1867 to 1881, and he opened
  a public school there in 1883.
