notes: >-
  According to Japanese Wikipedia: Father was Okayama Hachiroji Masayuki (岡山八郎治正興), a Kishu hanshi.
  Studied Yoshin-ryu under Ichinori Oribe Giro (一柳織部義路) from age 15 for 7 years, then Shin no Shinto-ryu
  under Honma Joemon Kanzan Masato (本間丈右衛門環山正遠) for 6 years after first teacher's death. Founder of
  Tenjin Shinyo-ryu. Birth: Japanese Wikipedia gives 1790-05-17 and rejects 1786 and 1804, citing Oimatsu
  Shin'ichi (Juntendo University bulletin); Skoss and Tenyokai give 1787 (died 1863 aged 76). Iso and Chiba
  Shusaku, whose Gembukan stood across the street, exchanged techniques (Skoss).
