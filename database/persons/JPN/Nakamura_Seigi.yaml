description:
  en: Okinawan martial arts master (1924-1999) who learned both Shorin-ryu and Goju-ryu karate; a senior
    student of Shoshin Nagamine and for a number of years senior instructor at Nagamine's honbu dojo in
    Naha.
notes: Nakamura practiced with Shoshin Nagamine and was also influenced by Shinyei Kyan and Jokei Kushi,
  both senior students in Nagamine's dojo. The memorial article by Katherine Loukopoulos (a practitioner
  on Okinawa from December 1982) describes Nakamura as a Matsubayashi Shorin Ryu teacher at Nagamine's
  honbu dojo in Kumoji, Naha, who gave her special training for hours at a time, arranged her daily schedule
  - "Nakamura Seigi sensei oversaw everything" - and introduced her to Miyazato Eiichi (Jundokan, Goju-ryu)
  and Uehara Ko (kobudo), showing his Goju-ryu and weapons connections; Loukopoulos recalls him as "the
  only Okinawa elderly I saw who utilized an English- Japanese dictionary in order to communicate", and
  found him teaching there across the 1980s and 1990s. His students Chokei Kishaba and Katsuhiko Shinzato
  developed and founded the Shorin-ryu Kishaba Juku, which Nakamura profoundly influenced.
