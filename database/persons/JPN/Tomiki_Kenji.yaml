description:
  en: Japanese martial artist who specialized in aikido and judo, founder of Shodokan Aikido (competitive
    aikido).
notes: Student of both Jigoro Kano (judo) and Morihei Ueshiba (aikido). First person awarded 8th dan in
  aikido by Ueshiba (1940). Awarded 8th dan in judo by Kodokan (1971). Professor at Waseda University.
  Developed competitive aikido (aikido kyogi).
