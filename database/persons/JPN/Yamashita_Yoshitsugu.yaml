description:
  en: Yoshitsugu Yamashita (1865–1935) was a Japanese judoka. He was one of the earliest disciples of Jigoro Kano and the first person to be awarded 10th dan rank in judo, posthumously in 1935. He was also the first Japanese judo master to teach judo in the United States.
  ja: 山下義韶（やました よしつぐ、1865年2月16日 - 1935年10月26日）は、日本の柔道家。嘉納治五郎の最初期の弟子の一人で、1935年に柔道史上初めて10段を追贈された人物。また、アメリカ合衆国で柔道を指導した最初の日本人柔道家でもある。
