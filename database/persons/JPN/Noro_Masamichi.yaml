description:
  en: Japanese aikido teacher (1935-2013), uchi-deshi of Morihei Ueshiba from 1955, his "Official Delegate for Europe and Africa" from 1961, and founder of Kinomichi in Paris in 1979.
notes: Noro was presented to Morihei Ueshiba in 1955 through his uncle and became an uchi-deshi the same day, renouncing plans to become a medical doctor. From 1955 to 1961 he followed Ueshiba from Tokyo to Iwama; among the five uchi-deshi of that era were Yasuo Kobayashi and Nobuyoshi Tamura. He received 6th dan before being sent to Europe in 1961 as Ueshiba's official delegate for Europe and Africa (arriving in Marseille September 3, 1961), and renounced all dan above the 6th from that time. He opened more than 200 dojos in Europe and Africa, established his base in Paris in 1964, and created Kinomichi in 1979 after discussions with Kisshomaru Ueshiba. Kinomichi was recognized as an official sporting discipline by the French ministry of youth and sports in 2001.
