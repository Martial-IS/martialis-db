description:
  en: Nakayama Hakudo (1872-1958), known as the 'God of Kendo', was a Japanese swordsman and the founder
    of the iaido style Muso Shinden Ryu. He received hanshi (master instructor) ranks in kendo, iaido
    and jodo - the first 'Sandō no Hanshi' - and held menkyo kaiden in Shindo Munen Ryu as its 7th soke.
    Head of the Yushinkan dojo in Tokyo, he trained many of the top swordsmen of his day, including Kiyoshi
    Nakakura and Minoru Mochizuki, taught kendo and iaido to Gigo Funakoshi, and helped arrange the marriage
    of Nakakura to Morihei Ueshiba's daughter Matsuko.
  pt: Nakayama Hakudo (1872-1958), conhecido como o 'Deus do Kendo', foi um espadachim japonês e o fundador
    do estilo de iaido Muso Shinden Ryu. Recebeu os títulos de hanshi (mestre-instrutor) em kendo, iaido
    e jodo - o primeiro 'Sandō no Hanshi' - e detinha o menkyo kaiden em Shindo Munen Ryu como 7º soke.
    Chefe do dojo Yushinkan em Tóquio, treinou muitos dos melhores espadachins do seu tempo, incluindo
    Kiyoshi Nakakura e Minoru Mochizuki, ensinou kendo e iaido a Gigo Funakoshi e ajudou a arranjar o
    casamento de Nakakura com a filha de Morihei Ueshiba, Matsuko.
notes: Nakayama Hakudo was the second generation headmaster of the Yushinkan dojo and of the Kanto Ha
  Shindo Munen Ryu kenjutsu, creator of Muso Shinden Ryu iaido and of the Nakayama-no-Jo. He was a personal
  friend of Morihei Ueshiba and instrumental in arranging the marriage between Kiyoshi Nakakura and Matsuko
  Ueshiba. He was also the teacher of Minoru Mochizuki (developer of the Yoseikan) - now confirmed by
  Mochizuki's own first-person interviews (Dragon Magazine and Karaté-Bushido, September 1987), which
  record that Jigoro Kano sent Mochizuki to study kendo and iaido with him in the late 1920s alongside
  Ueshiba and Shimizu - and, according to the Shotokai Encyclopedia and JKR-UK, taught kendo and iaido
  to Gigo Funakoshi - a relationship recorded on Funakoshi's entry as possible for
  lack of primary sources. Mochizuki's interviews confirm the general pattern (Nakayama taught kendo and
  iaido to elite students of the Kano circle in this era) but never mention Gigō, so they do not change
  that assessment. His students at the Yushinkan included Nakakura Kiyoshi, who learned only Muso Shinden
  Ryu Iaido and Kendo. His own oral records on kendo are preserved in '中山博道剣道口述集 (Nakayama Hiromichi Kendo
  Kojutsushu)' compiled by Domoto Akihiko, Zendo Nakayama and Eiichi Inamura (Ski Journal, 1988). The
  teacher interactions for Negishi Shingoro, Uchida Ryogoro, Hosokawa Yoshimasa and Morimoto Tokumi now
  reference their full Person entries. The Kendoka shashin meikan (1925, kenshi247 translation) dates his
  kendo hanshi to Taisho 6 (1917), against 1920 in the Hakudo article; not resolved.
