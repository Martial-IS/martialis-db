description:
  en: Leading teacher of Okinawa Goju-ryu karate (born 1952), head of the Okinawa Gojuryu Kenkyu Kai, student of Eiichi Miyazato at the Jundokan; known as a researcher and practitioner of Goju-ryu kata bunkai.
notes: Taira started training at the Jundokan dojo of Eiichi Miyazato at age 16, with a break while joining the Japanese police force; he has trained continuously since age 21, traveling nightly from Gushikawa City to the Jundokan in Naha. He also holds 4th dan in judo, achieved during riot police training. In a Blitz Magazine interview (c. 2011-12, during his first visit to Australia) he states that Miyazato was also an instructor at the Police Academy and that a number of his seniors at the Jundokan were his seniors in the police force; his police work drove his pursuit of practical application practices. Miyazato taught by example and insisted the kata passed from Miyagi Chojun not be changed, which guides Taira's bunkai application practices - he teaches advanced kata versions while keeping the kihon versions unchanged, and emphasizes hojo-undo (chi'ishi), kakie drills and a "spiral" view of progression. He wishes to continue the legacy of Miyazato and Miyagi Chojun, and teaches seminars worldwide (US, Canada, Australia, France, Italy, Portugal, England, Lithuania, India and New Zealand per the Taira Kenkyukai France site, which also records the French branch since 2012).
