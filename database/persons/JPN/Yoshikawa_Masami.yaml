description:
  en: Kendo kyoshi 7th dan and police dojo instructor in Tokyo, described by Japanese Wikipedia as Yukio
    Mishima's kendo master (kendo no shi). The Funasaka family's first-hand account records that Mishima
    started kendo under Yoshikawa at the Himonya Police Station in Meguro and followed him when Yoshikawa
    moved to teach at the Shibuya Police Station; Japanese Wikipedia likewise places Mishima's regular
    Sunday practice with him at Himonya, where he also began iaido. Tom Bolling's resume instead dates
    formal instruction to June 1958 at the Higashi-Chofu Police Station. It was through Yoshikawa's introduction
    that Mishima formally entered Omori-ryu iai under Funasaka Yoshio.
notes: Life dates not found in the sources consulted.
