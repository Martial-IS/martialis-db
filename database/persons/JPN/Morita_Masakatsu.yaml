description:
  en: Japanese right-wing student activist, first-generation member of the Tatenokai and its second student
    president. Born in Yokkaichi and orphaned in early childhood, he was educated at the Catholic Kaisei
    schools and entered Waseda University in 1966, joining its karate club; he met Mishima on 19 June
    1967 through the Nichigakudo student league and joined the Tatenokai at its establishment in October
    1968, taking part in the first GSDF experience-enlistment camp at Takigahara. As one of the society's
    elite nine-man "kesshitai" he learned iai from May 1969 - practising at the Itabashi police station
    dojo and the Saineikan - and was given a nihonto by Mishima; with the society's core group he also
    trained in karate under Nakayama Masatoshi at the Japan Karate Association. Appointed student president
    in October 1969, he accompanied Mishima into the Ichigaya garrison on 25 November 1970 and died by
    seppuku after him, his kaishaku performed by Hiroyasu Koga.
