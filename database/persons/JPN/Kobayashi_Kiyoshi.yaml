description:
  en: Kobayashi Kiyoshi (小林清) was the «father» of Portuguese Judo and one of the founders of the Portuguese
    Judo Federation, and the greatest promoter of Judo in Portugal. Sensei Kobayashi was one of the highest grades in the world, 9th dan given by Kodokan in 1999.
  pt: O Mestre Kiyoshi Kobayashi, uma das mais altas graduações da Modalidade – 9º Dan, foi um dos grandes
    responsáveis pelo crescimento e desenvolvimento da modalidade em Portugal, sendo conhecido inclusive
    como "o pai do judo português". Foi Selecionador e Treinador da Equipa Nacional e acompanhou-as em
    Campeonatos da Europa e do Mundo, assim como nas edições dos Jogos Olímpicos de Montreal (1976), Los
    Angeles(1984) e Seul (1988).
