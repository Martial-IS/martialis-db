notes: Funakoshi taught karate in the vicinity of Nakayama Hakudo's Yushinkan kendo dojo in Koishikawa from 1930 (Black Belt, October 1971), and Nakayama offered him the use of the dojo in Hongo-Yumi-cho when it was unoccupied (Nagamine, Tales of Okinawan Grand Masters, p. 74). This is co-location and dojo-sharing; it is not evidence of a teacher relationship between Nakayama and Funakoshi, and neither source records any such teaching.
