description:
  en: Japanese Goju-ryu karateka (1920-1995), known as Shikan or Yoshitaka Akamine; pioneer of artistic karate who spread karate-do in South America, founded the Ken-Shin-Kan school and was an 8th dan of the Dai Nippon Butokukai.
notes: 'Akamine studied te (Okinawan martial arts) in Shuri under Chomo Hanashiro, Kentsu Yabu and Chotoku Kyan, then met Chojun Miyagi and devoted himself to Goju-ryu, where he was most influenced by Higa Seiko and Kanki Izumigawa (1st dan at 16 under Izumigawa, 2nd and 3rd dan at 18, 4th dan at 22 under Higa). He also studied Uechi-ryu, Higa''s Senbukan style, Gensei-ryu and kobudo (mainly under Shinsei Matayoshi). He opened a dojo called Shikan-kan in Ito, Shizuoka after the war; the school, founded as Ken-Shin-Kan, was renamed due to a name conflict. He was promoted to 8th dan by the Dai Nippon Butokukai (1955 or 1957), moved to Brazil (1957 or 1958), founded the Brazilian Karate-do Association in Sao Paulo in 1959, and established a new Kenshinkan school (1962 or 1968) with branches across South America, the US, Spain and Australia. He reportedly never accepted offers of promotion to 9th or 10th dan. The EN Wikipedia article on Sekō Higa names him among Higa''s students, consistent with the JA article''s account of his Goju-ryu training. The Bushido Reiryoku Kan biography (by his Chile representative Roberto Fernandez de la Reguera) adds that he began martial arts at a very early age under his grandfather; that he trained Shorin-ryu with Hanashiro, Yabu and Kyan and then Goju-ryu with Seiko Higa and Kanki Izumigawa as his second Goju-ryu master; that he received kobudo instruction from Shinko Matayoshi; that he participated in the October 1950 Nippon TV karate demonstration in Tokyo; that he immigrated to Brazil in 1957, ran the Brazilian Association of Karate-Do (over 1000 students in 1964), created the Ken-Shin-Kan in 1968 and established branches in Uruguay (1966, under Juan Carlos Rius) and Chile (1969, under the Fernandez de la Reguera brothers). The Toku In Kan biography (Uruguay branch) adds that he moved to Kawasaki at age five; that his Goju-ryu training was with Izumigawa and Seiko Higa, Shuri-te with Seitoku Higa and kobudo with Shinpo Matayoshi; that he created the "Shikan Ryu" teaching method (a conjunction of Izumigawa''s Goju-ryu, Seitoku Higa''s Shuri-te and Shito-ryu, Uechi-ryu and Aikido fundamentals); that he held 8th dan from the Budokan and Shuseki Shihan from Kanken Toyama (recognized by the Dai Nippon Butokukai); and that he was the first great master to introduce karate to Brazil (1957) and Uruguay. Note: the two descendant accounts differ slightly on some dates (Brazil 1957/1958, Ken-Shin-Kan 1962/1968) - the JA Wikipedia account is kept for those.'
