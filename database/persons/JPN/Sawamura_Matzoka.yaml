description:
  en: >-
    Japanese judoka and ship's mate who stayed in Iceland from 1958 and was
    the first qualified judo instructor of the Ármann club in Reykjavík, until
    1960.
notes: >-
  Búason (2012) is the only source so far. "Matzoka" is the thesis's
  spelling, probably from Icelandic newspapers; the Japanese given name is
  not known. Búason (pp. 7, 10) says he had taught judo in Helsinki, including
  the Helsinki police, married an Icelandic woman, and later taught the
  Suðurnes police (Morgunblaðið, 23 April 1960, p. 15). Leads: Icelandic
  newspapers on timarit.is from 1958-1960, the Ármann club magazine of 1959
  (Þorkell Magnússon, "Hnefaleikar – Judo"), and Finnish judo histories of
  the 1950s.
