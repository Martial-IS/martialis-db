description:
  en: Okinawan martial arts master (1889-1982), founder of the Shorin-ryu Matsumura Seito Okinawa Karate
    Kobudo Association; trained by his uncle Nabe Matsumura from age 13, he continued the Matsumura family
    tradition after emigrating back from Argentina in 1952.
notes: Soken began karate training at 13 under his uncle Nabe Matsumura (his mother Kami was Matsumura
  Sokon's granddaughter, and Nabe was her brother), learning Naihanchi Shodan/Nidan, Pinan Shodan/Nidan,
  Passai Sho/Dai, Chinto, Kusanku, Gojushiho, Sanchin, Rohai Jo/Chu/Ge and (at age 23) Hakutsuru; he called
  Kusanku the most important kata of the style. His 1978 interview with Ernie Estrada (a primary source)
  confirms he became his uncle's student around 1902-1903, learning Uchinan Sui-di, and that Bushi Matsumura
  left the "hands" of his teachings to Nabe; the George W. Alexander article adds that after ten years
  of basic training he began learning hakutsuru in 1912, that he also trained with Kenwa Mabuni and Gokenki
  (white crane), and studied weaponry under Komesu Ushi-no-Tanmei and Mantaka Tsuken. He emigrated to
  Argentina in 1924, working as a photographer and teaching karate to expatriates in Buenos Aires, and
  returned to Okinawa in 1952. He first called the style "Matsumura Shuri-te", renaming it Matsumura Seito
  Shorin-ryu in 1956 (the JA Wikipedia gives his birth year as 1891 and the style naming as around 1956;
  the Moerfelden lineage page dates the start of his teaching to 1945 and gives his years as 1890-1982).
  In the second part of the 1978 interview (by Ernest Estrada) he lists his kata as pinan shodan/nidan,
  naihanchi shodan/nidan, patsai-sho/dai, chinto, gojushiho, kusanku, rohai ichi-ni-san and hakutsuru
  (naming the Matsumura kusanku, the older version, the best kata of his youth), and his weapons as bo,
  sai, tuifa, kama, nunchaku, kusarigama and suruchin, his favorite being tsukenbo (learned from Komesu
  Ushi). He states he knew Taira Shinken well and taught him some of his older forms, that he formed the
  All Okinawa Kobujutsu Association in 1970, and was a member of the Ryukyu Historical Society, discussing
  the old Okinawan grappling art "ti" ("te-kumi" or "gyaku-te"). His senior students included Nishihira
  Kosei, Roy Suenaka and many others.
