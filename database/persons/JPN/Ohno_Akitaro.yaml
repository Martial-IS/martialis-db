description:
  en: 'Japanese jujutsuka who co-ran the Golden Square School of Jujutsu in Piccadilly, London with Sadakazu
    Uyenishi

    (aka Raku) in the early 1900s; Callan/Heffernan/Spenn (2019) record that from April 1905 Ohno travelled
    between

    the USA, Cuba, Europe and the UK. The Garruds and Emily Diana Watts trained with him at Golden Square
    alongside

    Uyenishi, Tani, Taro Miyake, Mitsuyo Maeda and Gunji Koizumi. His identity with the Akitaro Ono of
    the "Four

    Kings of Cuba" (Kodokan judo pioneers in the Americas) is likely but not conclusively established
    in the

    consulted sources; no firm birth or death dates have been found. The surname appears as both Ohno
    and Ono in

    contemporary and secondary sources.

    '
  ja: '上西貞一（Raku）とともにロンドン・ピカデリーのゴールデンスクエア柔術道場を共同運営した柔術家。Callan/Heffernan/Spenn

    (2019) によれば1905年4月以降、米国・キューバ・欧州・英国を往来した。姓は Ohno と Ono の両表記が資料に見られる。

    '
