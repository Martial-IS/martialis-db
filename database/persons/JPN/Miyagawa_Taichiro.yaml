description:
  en: 'Miyagawa Taichiro was born on Kaei first. He served the Kuroda clan as a retainer. He was an accomplished
    martial artist, having learned Itto-ryu kenjutsu and Jigo Tenshin Ryu jujutsu, which he taught at
    the Genyosha-linked dojo that would be the origin of the Meidokan. He participated in the Hagi Rebellion
    against the Meiji government.

    '
