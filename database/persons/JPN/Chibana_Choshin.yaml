description:
  en: Okinawan martial artist (1885-1969) who developed Kobayashi Shorin-ryu karate based on what he learned from Ankō Itosu; the first to establish a Japanese ryu name for an Okinawan karate style, naming Itosu's karate "Shorin-ryu" in 1929; called the "Last Warrior of Shuri".
notes: Chibana trained under Ankō Itosu from 1899 (about age 15) for thirteen years, until he turned 28; after Itosu's death he practiced alone for five years and then opened his first dojo in the Tori-hori district at age 34. He served as the first President of the Okinawa Karate Federation (formed May 1956) and was Karate Advisor and Senior Instructor for the Shuri Police Precinct 1954-1958. He received the title of Hanshi from the Dai Nippon Butokukai in 1957 and the Order of the Sacred Treasure, 4th Class in 1968 (Geoffrey Gaudion's account also mentions the "Fourth Order of Merit" from Emperor Hirohito). His many students included Yuchoku Higa (from 1943, remaining his disciple until his death), Katsuya Miyahira (from April 1933), Shugoro Nakazato (who received Chibana's personal black belt and founded Shorin-ryu Shorinkan, the page recording that Chibana "created the Shorin-ryu Shorinkan association" via his students) and, per Goodin and Gaudion, Arakaki Ankichi after his early study under Gusukuma and Hanashiro.
