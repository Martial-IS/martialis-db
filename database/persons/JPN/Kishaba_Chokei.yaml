description:
  en: Okinawan martial arts master (1929-2000), founder of the Shorin-ryu Kishaba Juku; studied under Hohan Soken, Shoshin Nagamine and Seigi Nakamura.
notes: 'Kishaba''s younger brother Chogi Kishaba was also an Okinawan martial arts master. His senior student in Okinawa was Katsuhiko Shinzato, who heads the Kishaba Juku. The Hawaii Karate Seinenkai memorial article states Kishaba "learned Shorin-Ryu from all of his instructors as well as the use of the kama from Soken". The EN Wikipedia article on Seigi Nakamura states Nakamura "profoundly influenced and inspired what is taught in Shorin-ryu Kishaba Juku", which Nakamura''s students Chokei Kishaba and Katsuhiko Shinzato developed and founded. No teacher edge to Masami Chinen is asserted: the only evidence was a Wikidata P1066 claim and neither the Seinenkai article nor the consulted EN Wikipedia articles name Chokei as Chinen''s student.'
