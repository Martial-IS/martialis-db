description:
  en: Zen monk, swordsman and key figure in the Bakumatsu period. Trained under Asari Yoshiaki in Nakanishi-ha Ittō-ryū and founded his own school, the Ittō-shōden Mutō-ryū, in 1885. Founder of the Shumpukan dojo in Tokyo. One of the ten swordsmen who led the Imperial Guard fencers, and teacher of Kagawa Senjirō, Nishikubo Hiromichi and Takano Sasaburō.
notes: >-
