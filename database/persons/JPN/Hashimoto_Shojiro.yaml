description:
  en: Japanese judoka of the Kodokan, 9th dan. Entered the Kodokan in 1908 and studied under Jigoro Kano. After graduating from Tokyo Higher Normal School in 1922 he became assistant professor and in 1941 professor there, training judo instructors; one of the teachers of Ichiro Abe at Tokyo Higher Normal School, and the one who arranged Abe's employment at the Kodokan. Skilled in uki-waza and osoto-gari. After retiring in 1946 he served as a standing director of the Kodokan.
