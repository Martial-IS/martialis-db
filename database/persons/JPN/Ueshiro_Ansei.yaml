description:
  en: Japanese Shorin-ryu karate master (1933-2002), nephew of Ankichi Arakaki and student of Shoshin
    Nagamine; sent by Nagamine to the United States in 1962 to spread Matsubayashi-lineage Shorin-ryu,
    he founded Ueshiro Shorin-Ryu Karate USA.
notes: Ueshiro was born in Kin, Okinawa on April 20, 1933, a direct descendant of the Okinawan "Bushi"
  warrior class, and the nephew of the renowned karate master Ankichi Arakaki. He learned karate from
  his father Anho Ueshiro, who was his first teacher along with Entasu Isaenta and Toguchi Seitoku. In
  the 1945 Battle of Okinawa he lost both parents and sustained severe injuries to his hands (per the
  Finding Karate biography he lost several fingers on both hands and suffered severe burns). Around 1946
  relatives enrolled him at the original Naha dojo of Shoshin Nagamine - himself a top student of Arakaki
  Ankichi - where he trained daily, overcoming his disabilities and becoming known for his strength, speed
  and expertise with the bo; he was promoted to sandan (3rd dan) by Nagamine in 1960 and eventually became
  Chief Instructor of the main Shorin-Ryu dojo in Naha (the Midtown biography states he was world champion
  1958-1962, retiring uncontested). In 1960 Nagamine and Okinawa's other preeminent masters selected him
  to bring karate-do to the United States; the US government issued a special visa in 1962, obtained through
  his student James Wax - a US Marine stationed in Okinawa who became the first American black belt in
  Matsubayashi-Ryu Shorin-Ryu in 1958, married Nagamine's niece, and returned to the US in 1961 - along
  with Robert Yarnall. Ueshiro arrived in the United States on September 15, 1962, one of the first Okinawans
  to teach karate in the US; his first students included James Wax and Frank Grant, and his classes were
  deliberately challenging two-hour sessions. By the late 1960s-70s his family had joined him and he had
  established many schools on the East Coast and Midwest. In 1969 he left the central Matsubayashi-Ryu
  organisation following disagreements over his creation of the Fukyugata Sandan kata; by the 1980s he
  had established Ueshiro Shorin-Ryu Karate USA, and in 1992 he and his students celebrated 30 years of
  Shorin-Ryu in the United States (the Shorinryu.com tribute carries photos of him with Nagamine in Okinawa,
  with James Wax, and of the New York City dojo in 1982). He received US citizenship in the early 1990s
  and died of a stroke on May 7, 2002 in Oceanside, New York; he is buried in Locust Valley, New York.
  His student Robert Scaglione continued the organization as Ueshiro Shorin-Ryu Karate USA.
