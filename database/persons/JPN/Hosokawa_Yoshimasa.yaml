description:
  en: 'Hosokawa Yoshimasa was a former samurai of the Yamauchi clan of Tosa domain (Kōchi Prefecture) and a

    Shihan of Musō Shinden Eishin-ryū (aka. Shimomura-ha Hasegawa Eishin-ryū). He was one of two teachers

    who accepted Nakayama Hakudō as a student of Tosa Eishin-ryū in 1916, making Hakudō the first outsider

    to learn the art. Hakudō received Menkyo (not Menkyo Kaiden) from Hosokawa after traveling to Kochi to

    train with him at his residence. Their relationship continued until Hosokawa''s death in 1923. He had received the school''s menkyo kaiden from Shimomura Shigeichi in 1868, and after the Meiji Restoration sat in the Kochi prefectural assembly and the House of Representatives.

'
  ja: 細川義昌は土佐藩（高知県）出身の元侍で、無双神伝英信流（下村派）の師範。1916年に中山博道が土佐英信流を初めて外部人として学べるように受け入れた師の一人。慶応4年（1868年）に下村茂市より無雙神傳英信流の免許皆伝を受け、明治維新後は高知県会議員・衆議院議員を務めた。博道は高知で彼のもとで免許を授けられ、1923年に細川の死去まで関係を続けた。
