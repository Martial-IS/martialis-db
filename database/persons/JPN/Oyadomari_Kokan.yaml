description:
  en: Ryukyuan karate master (1827-1905) of the Tomari-te style, disciple of Kishin Teruya, Giko Uku,
    Ason and Annan; teacher of Chōtoku Kyan.
notes: 'Oyadomari learned Passai, Rohai and Wanshu from Kishin Teruya, and the kata Naifanchi from Giko
  Uku; he was also a disciple of Ason and of Annan, a Chinese castaway said by legend to have taught the
  kata Chinto to Matsumura Sokon. Per the EN Wikipedia article on Chōtoku Kyan, Kyan studied Tomari-te
  with Kōkan Oyadomari (and Kōsaku Matsumora) after returning to Okinawa; the Seibukan official history
  likewise names 親泊興寛 (Oyadomari) among Kyan''s teachers, and Geoffrey Gaudion''s account lists "Pechin
  Oyadomari in Naha" as one of the three masters Chofu Kyan asked to teach his son (note: EN Wikipedia
  places Oyadomari in Tomari village, Gaudion in Naha - a discrepancy, though Oyadomari is consistently
  associated with Tomari-te).'
