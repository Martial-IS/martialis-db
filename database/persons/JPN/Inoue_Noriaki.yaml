description:
  en: >-
    Japanese martial artist, nephew of Ueshiba Morihei. He trained and taught
    with his uncle from the Omoto years to the Kobukan period, kept teaching
    the art as Aiki Budō after the war, and from 1956 called it Shinwa Taidō
    and then Shin'ei Taidō.
notes: >-
  Egami Shigeru reportedly visited Inoue to learn for his "soft karate"
  (ja.wikipedia anecdote, uncited; blogs give c. 1951). Needs Egami's own
  writing or the Aiki News issues ja.wikipedia lists before a claim. Deguchi
  Onisaburō named Aiki Budō and Shinwa Taidō (interview parts 2 and 3) and has
  no record. ja.wikipedia dates the Shinwa Taidō name to 1946; Inoue
  (interview part 3) and Pranin (2004) give 1956.
hasTeacherAssertion:
  - id: 01M764AMRBGH24XQQ9ZDJCSQE5
    teacher: 01KJJAWN28MWKKSN4J02MVY1TV
    assertedStyle: 01KJJAWN29MA64W22606R3WD9R
    role: teachrole:student
    hasConfidence:
      confidenceLevel: conflevel:probable
      assessedBy: agent:FSM
      confidenceRationale: >-
        Stanley Pranin calls Inoue Ueshiba's number one student, and Inoue
        (interview part 2) says he practised with his uncle. JA Wikipedia
        has Inoue teaching the new art before Ueshiba joined him at
        Omoto, and Inoue's students called him a co-founder. Pranin draws on
        Inoue's own interviews, and was a well-known and respected author on
        Aikido and martial arts.
    hasInteraction:
      - hasEvidence:
          - basedOnSource: 01M764AMRB4TX3N3P0RNGHN0HB
            quotation: >-
              Yoichiro was widely regarded as Morihei’s number one student and
              often taught in his uncle’s stead.
            informationType: infotype:secondary
            supports: true
            evidenceType: evidencetype:direct
          - basedOnSource: 01M764AMRBG8SN8CCXVWRYZGB6
            quotation: >-
              I said I didn’t want to practice with him but that I would
              practice with my uncle.
            informationType: infotype:primary
            supports: true
            evidenceType: evidencetype:indirect
          - basedOnSource: 01M764AMRBFM37319ZV5W2C31T
            quotation: 出口の下で、のち加わる植芝と共に、家伝の柔術を基礎とした新たな合気武術を教授し始める
            informationType: infotype:secondary
            supports: false
            evidenceType: evidencetype:indirect
  - id: 01M764AMRBRPM8SE2D8A9D54RE
    teacher: 01KJJAWN28MWKKSN4J02MVY1TW
    assertedStyle: 01KJJAWN29MA64W22606R3WD9C
    role: teachrole:seminar
    hasConfidence:
      confidenceLevel: conflevel:probable
      assessedBy: agent:FSM
      confidenceRationale: >-      
        Pranin states Inoue learned Daitō-ryū from Takeda in
        Shirataki, and in the 1988 interview Pranin reports Inoue's
        name and seal in Takeda's enrolment book, which Inoue confirms
        - but Inoue denies that Takeda taught him, he says he refused
        Takeda's training and signed only after taking ukemi for him.
        JA Wikipedia says he never enrolled (possibly missing the
        interview). Inoue concedes signing, paying and a week of
        practice, so the denial is over the word "taught": a short
        formal enrolment, not a student relation. We have, on one
        hand, complete admission of all formalities of a teaching
        relation, while a negation of the actual content of that
        relation. Covering the "quality" of instructions is not within
        our scope, merely establishing that it existed, and all things
        considered, the relation is at least probable, verging on
        confirmed.        
    hasInteraction:
      - interactionPeriod:
          startYear: 1915
        hasEvidence:
          - basedOnSource: 01M764AMRB4TX3N3P0RNGHN0HB
            quotation: >-
              Morihei and Yoichiro both spent several years living in Hokkaido
              where they learned the art of Daito-ryu Jujutsu from famous
              martial artist Sokaku Takeda in the small village of Shirataki.
            informationType: infotype:secondary
            supports: true
            evidenceType: evidencetype:direct
          - basedOnSource: 01M764AMRBG8SN8CCXVWRYZGB6
            quotation: >-
              When I met Takeda Sensei and he told me to practice with him I
              refused to do so saying I didn’t like his type of training.
            informationType: infotype:primary
            supports: false
            evidenceType: evidencetype:direct
          - basedOnSource: 01M764AMRBFM37319ZV5W2C31T
            quotation: 大東流の稽古法に疑問を抱き、武田の再三の勧めにもかかわらず大東流には入門しなかった
            informationType: infotype:secondary
            supports: false
            evidenceType: evidencetype:direct
      - interactionPeriod:
          startYear: 1931
          endYear: 1931
        hasEvidence:
          - basedOnSource: 01M76BK5Y7ZPYB8W835SEA3Y9Z
            quotation: >-
              When Takeda Sensei came in 1931 to Tokyo I served as his partner
              because my uncle was sick.
            informationType: infotype:primary
            supports: true
            evidenceType: evidencetype:direct
          - basedOnSource: 01M764AMRBG8SN8CCXVWRYZGB6
            quotation: If I remember correctly we practiced for one week.
            informationType: infotype:primary
            supports: true
            evidenceType: evidencetype:direct
          - basedOnSource: 01M764AMRBG8SN8CCXVWRYZGB6
            quotation: >-
              Sensei, if this took place in 1931 your name is indeed recorded
              with your seal in the Daito-ryu enrollment book.
            informationType: infotype:secondary
            supports: true
            evidenceType: evidencetype:direct
          - basedOnSource: 01M764AMRBG8SN8CCXVWRYZGB6
            quotation: Of course it is. He wouldn’t move unless I signed.
            informationType: infotype:primary
            supports: true
            evidenceType: evidencetype:indirect
          - basedOnSource: 01M764AMRBG8SN8CCXVWRYZGB6
            quotation: >-
              I answered in the following way: "No. I wasn’t taught by you. I
              took ukemi for you. You are the one who should sign your name."
            informationType: infotype:primary
            supports: false
            evidenceType: evidencetype:direct
  - id: 01M764AMRB0GKA52VDDQVGDVHG
    teacher: 01M764AMRBVPJKVZHRWAY213KC
    assertedStyle: 01KJJAWN29MA64W22606R3WD9B
    role: teachrole:student
    hasConfidence:
      confidenceLevel: conflevel:probable
      assessedBy: agent:FSM
      confidenceRationale: >-
        Pranin (2004) states Takagi was invited to Tanabe around 1911 to teach
        Judo to Ueshiba and the Inoue boys, JA wikipedia states Inoue studied
        Kōdōkan judo under Takagi from age 10 (but also uses Pranin as one of the sources).
    hasInteraction:
      - hasEvidence:
          - basedOnSource: 01M764AMRBBC9Y4YZENFBC6G72
            quotation: >-
              Around 1911, Yoichiro’s grandfather Yoroku, with the support of
              Zenzo, decided to invite a young judo instructor named Kiyoyuki
              Takagi who was traveling in the area to come to Tanabe. Their idea
              was to use judo practice as a means of channeling the youthful
              energies of their sons Morihei and Yoichiro and his brothers.
            informationType: infotype:secondary
            supports: true
            evidenceType: evidencetype:direct
          - basedOnSource: 01M764AMRBFM37319ZV5W2C31T
            quotation: 10歳の時に講道館柔道の高木喜代市に師事し、柔道を習い始める。
            informationType: infotype:secondary
            supports: true
            evidenceType: evidencetype:direct
