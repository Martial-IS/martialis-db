  en: 'Japanese jujutsu master of the Tenjin Shin''yo-ryu school. Handa Yataro studied Tenjin Shin''yo-ryu
    under him,

    and Handa later devised the Daito-ryu jujutsu curriculum largely from that school. A related figure,
    Yamana

    Shinjuro (山名新十郎) of Osaka, whose dojo Handa succeeded to on settling in the city in 1876, is regarded
    as a

    relation of Shinkuro.

    '
