description:
  en: Okinawan karate master and founder of Shito-ryu. He studied Shuri-te under Anko Itosu and Naha-te under Kanryo Higaonna, combining both traditions. He was regarded as the foremost authority on Okinawan kata and their applications. He moved to Osaka in 1929 to spread karate in mainland Japan and registered Shito-ryu with the Butokukai in 1939.
