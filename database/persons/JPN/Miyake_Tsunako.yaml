description:
  en: Prominent female Japanese martial artist and one of Kenji Tomiki's three top students. Known for expertise in multiple arts including Tomiki Aikido, Kodokan Judo, Jodo, and Tai Chi. Taught seminars in the United States and was listed as a primary influence by American judoka Karl Geis.
notes: '- Considered one of Tomiki Sensei''s three top students alongside Hideo Oba and Senta Yamada

  - Mentioned in Karl Geis''s resume as both 7th dan (Kodokan Judo) and 8th dan (Tomiki Aikido) teacher

  - Blog research mentions 5-dan in judo, 6-dan in aikido, 7-dan in jodo, and tai chi instructor qualifications

  - Taught seminars in the United States (Houston, Texas in 1988, 1992, 1997, 2007)

  - Said to be a "Living National Treasure"; investigated and debunked in blog research

  - Graduated from Nihon Taiiku Daigaku (Japan Physical Education College) and worked as PE teacher

  - Later focused on shiatsu and "Health Budo" (健康武道)

'
