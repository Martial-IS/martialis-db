notes: Shingai Tadaatsu was born on March 1, 1842, in the Edo residence of the Ōgaki Domain as the seventh
  son of samurai Shingai Yoshizō. At age 12, he entered Kubota-ha Tamiya-ryū under Shimamura Yūyū. He
  lost both parents at age 17 and worked as a servant while continuing sword training. He eventually surpassed
  his teacher and took the name 'Torao' (寅雄), borrowing one character from his teacher's name. During
  the Boshin War, he fought with the Ōgaki Domain and later joined the Owari Domain's 'Return to Righteousness
  Corps', where he contracted syphilis which caused his nose to collapse (earning him the nickname 'Noseless
  Shingai'). After the war, he became a sword instructor at the Owari Domain's Meirinkan school. After
  the abolition of domains, he made a living through sword exhibitions. Around 1882-1883, he became a
  sword instructor for the Tokyo Metropolitan Police Department. He later served as a kendo instructor
  for the Imperial Household Agency Police, Gakushūin, and Keio University. In 1908, he was awarded the
  rank of hanshi by the Dai Nippon Butoku Kai and served on the committee that established the Dai Nippon
  Teikoku Kendō Kata. Along with Negishi Shingorō and Tokuno Kaneshirō, he was called one of the 'Three
  Elders of Eastern Capital Kendo'. He was known as 'Kote-giri Shingai' (Shingai the Wrist-Cutter) for
  his skill at striking the kote (wrist) and 'Hana-kake Shingai' (Noseless Shingai) due to his collapsed
  nose from syphilis. In his later years, he was invited to the Kōnishī Brewery's dōjō Shūbukan, where
  he helped establish the Shūbukan Okunokata along with Tomiyama En (Jikishinkage-ryū) and Midamura Kengyō
  (Tendō-ryū). He died on February 9, 1920, from a cerebral hemorrhage while on his way to the Imperial
  Household Agency Police dōjō Saimeikan. His grave is at Aoyama Cemetery.
