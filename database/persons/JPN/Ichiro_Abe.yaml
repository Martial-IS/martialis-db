description:
  en: Japanese judoka of the Kodokan, one of only fifteen judoka to attain 10th dan. Arriving in Toulouse
    in November 1951 as the first official envoy of the Kodokan in Europe, he served as technical advisor
    at the Shudokan club of the Lasserre brothers, where French professors such as Pierre Roussel, Jacques
    Belaud, Luc Levannier and Guy Pelletier studied under him; the resulting Kodokan-versus-Kawaishi dispute
    produced the Union Fédérale des Amateurs du Judo Kodokan (October 1954) and its 1956 union with the
    Fédération française de judo et jiu-jitsu. He left France for Brussels in 1953, was technical director
    of the Belgian Judo Association, technical advisor of the European Judo Union from 1955, and headed
    the Kodokan's international department from 1969 until his death in 2022.
notes: >-
  Birth and death dates, full rank history and European career are established by the Kodokan
  Palace of the 10th dan page and the Japanese and English Wikipedia biographies. His teacher
  lineage is documented in the Kodokan Judo magazine interview (Judan Monogatari no. 13, April
  2012). Brousse gives his age at arrival as 21, inconsistent with the 1922 birth year.
