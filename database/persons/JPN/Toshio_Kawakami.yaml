description:
  en: Japanese aikido teacher of the Shiseikai association, who replaced Katsumi Motomura in Portugal
    in 1978. He taught aikido alongside the kenjutsu Kashima Shin Ryu at several Portuguese dojos, returning
    to Japan in late 1979.
  pt: Professor japonês de Aikido da associação Shiseikai, que substituiu Katsumi Motomura em Portugal
    em 1978. Ensinou Aikido a par do Kenjutsu Kashima Shin Ryu em vários Dojos portugueses, regressando
    ao Japão em finais de 1979.
