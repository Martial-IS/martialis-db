description:
  en: Satoru Sayama (born 1957) is a Japanese professional wrestler, martial artist, and founder of Shooto, one of the first true mixed martial arts organizations. Originally trained under Antonio Inoki and Karl Gotch, he became famous as the original Tiger Mask. In 1985 he founded Shooto, creating the first MMA gloves inspired by Bruce Lee's Enter the Dragon. He trained Yorinaga Nakamura and other shootists, and promoted Vale Tudo Japan events that led to the rise of Pride FC.
  ja: 佐山聡（さやま さとる、1957年11月27日 - ）は、日本のプロレスラー、武術家。初代タイガーマスクとして知られ、1985年に総合格闘技団体「修斗」を創設。ブルース・リーの影響で世界初のMMAグローブを開発。中村頼永らを育成し、Vale Tudo Japanを主催。アントニオ猪木、カール・ゴッチに師事。
