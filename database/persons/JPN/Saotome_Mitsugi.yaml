description:
  en: Japanese aikido teacher (born 1937), a direct disciple of Morihei Ueshiba and uchi-deshi at the Aikikai Hombu Dojo from 1959 until the Founder's death in 1969. Promoted to 6th dan (Shihan) in 1968, he was Chief Weapons Instructor at Hombu until 1975, when he relocated to Sarasota, Florida, and founded the Aikido Schools of Ueshiba.
  pt: Professor japonês de aikido (nascido em 1937), discípulo direto de Morihei Ueshiba e uchideshi no Aikikai Hombu Dojo de 1959 até à morte do Fundador em 1969. Promovido a 6º dan (Shihan) em 1968, foi instrutor-chefe de armas no Hombu até 1975, quando se mudou para Sarasota, Flórida, e fundou a Aikido Schools of Ueshiba.
