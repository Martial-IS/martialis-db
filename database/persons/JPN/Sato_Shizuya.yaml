description:
  en: Founder of Nihon Jujutsu, Meijin 10th dan Nihon Jujutsu (Kokusai Budoin IMAF), Hanshi 9th dan Judo (Kokusai Budoin IMAF). Student of Mifune Kyuzo at the Kodokan. Founded the US Embassy Judo Club in 1957 and served as its chief instructor until his death. Former Chief Director of Kokusai Budoin, IMAF (1982-2011).
