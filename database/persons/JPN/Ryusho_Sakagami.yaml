description:
  en: Japanese karateka and head of the Itosu-kai organization. He was a student of Kenwa Mabuni, founder
    of Shito-ryu, and became a leading figure in the style. He was the primary karate instructor of Fumio
    Demura, who began training under Sakagami at age 12 in 1950.
