description:
  en: Okinawan martial arts master (1934-2017), Goju-ryu student of Chōjun Miyagi and Yamani-ryu bojutsu
    student of Masami Chinen; one of the very few remaining practitioners of Yamani-ryu in Okinawa and
    co-founder of the Ryukyu Bujutsu Kenkyu Doyukai (RBKD).
notes: Kishaba's older brother Chokei Kishaba was also an Okinawan martial arts master. Kishaba practiced
  Yamani-ryu bojutsu privately under Masami Chinen, whose direct student he is named as in the EN Wikipedia
  article on Chinen, in the Haff interview with Toshihiro Oshiro ("his brother, Chogi Kishaba, who was
  a direct student of Masami Chinen"), and in the Houston Karate page on Yamanni Chinen Ryu, which states
  Masami Chinen was the last member of the Chinen family to teach the art and that upon his death the
  family passed the title of Soke to his student Chogi Kishaba, who had begun training with Chinen as
  a teenager and remained with him as a student until his death. The same interview states Kishaba's bo
  teacher was "a direct student of Chojun Miyagi, the founder of Goju-Ryu", and Oshiro describes him as
  the sole successor to Masami Chinen who knows all the Yamanni-ryu katas. In 1979 Kishaba sent his top
  students Toshihiro Oshiro and Kiyoshi Nishime to the United States, and in 1985 they co-founded the
  Ryukyu Bujutsu Kenkyu Doyukai (RBKD) with him, Kishaba serving as its head until his passing in 2017.
