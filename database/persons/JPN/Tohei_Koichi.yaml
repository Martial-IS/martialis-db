description:
  en: Japanese aikidoka, 10th dan, founder of the Ki Society and its style of aikido, officially Shin Shin Toitsu Aikido (literally 'aikido with mind and body unified'), commonly known as Ki-Aikido. A direct student of Morihei Ueshiba, he was the first head instructor of the Aikikai Hombu Dojo and spread aikido to Hawaii and the continental United States. He awarded Steven Seagal his 1st dan in 1974.
  ja: 日本の合気道家で十段。心身統一合氣道（氣の合氣道）を創始し、合気会本部道場初代師範を務めた。開祖植芝盛平の直弟子。1974年にスティーヴン・セガールに初段を許した。
