description:
  en: >-
    Second son of Chiba Shusaku; succeeded his father at the Genbukan dojo in Edo (Bennett). After
    his death in 1862 the dojo passed to his younger brother Michisaburō. His student Shimoe
    Hidetaro (from 1858) carried the Genbukan line into the Meiji era (JA wiki, Chiba Shusaku;
    Shimoe Hidetaro).
  ja: >-
    千葉周作の二男。父の死後、江戸の玄武館を継いだ。1862年（文久2年）没。門弟の下江秀太郎が明治期に活躍した。
hasEvidence:
- basedOnSource: 01M2Z6TY1P746106MK1A63MWF7
  quotation: 維新後は、千葉栄次郎門下の下江秀太郎が警視庁剣術世話係、水戸の内藤高治、門奈正が大日本武徳会教授となるなど、多くの剣士が活躍して、日本剣道の発展に尽くした。
  informationType: infotype:secondary
  supports: true
  evidenceType: evidencetype:direct
