description:
  en: Okinawan martial artist (1890-1954) who studied Shorin-ryu under Ankō Itosu and Naha-te under Higaonna Kanryō; co-established Shito-ryu with Kenwa Mabuni, founding the Okinawan branch of the style and serving as president of the Shinpan Shiroma Shito-ryu Preservation Society.
notes: Gusukuma began karate at age 13 under Anko Itosu, and in 1908 began training with Kanryo Higaonna along with Kenwa Mabuni. He served in the Japanese Navy from 1909, became a school teacher (professor at Shuri Dai Ichi Elementary School) and was known as an acupuncturist. He taught Shorin-ryu after World War II, regularly at Shuri Castle and at a home dojo in Nishihara, and was associated with Miyagi Chojun, Kyoda Jyuhatsu and Kyan Chotoku. His students per the Fighting Arts interview with Seikichi Iha included Yoki Uema (founder of Shorin-Ryu Shubukan), Seiichi Iju (who learned Gojushiho from Gusukuma and was the first teacher of Shugoro Nakazato), Seitoku Ishikawa and Seikichi Iha, who was accepted as his formal student in 1950 and trained with him for four years until Gusukuma's death in 1954 (the Grand River Karate bio likewise names Gusukuma among Iha's teachers); Arakaki Ankichi also studied under Gusukuma in his early years per Goodin and Gaudion. His student Horoku Ishikawa continued his branch of Shito-ryu.
