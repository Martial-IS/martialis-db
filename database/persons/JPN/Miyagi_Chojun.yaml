description:
  en: Okinawan martial artist (1888-1953), founder of the Gōjū-ryū school of karate by blending the Naha-te of his teacher Higaonna Kanryō with Chinese martial arts studied in Fuzhou; the first karate style officially recognized by the Dai Nippon Butokukai.
notes: Miyagi began studying under Ryuko Aragaki (Arakaki Seishō) at age 11 (the Kaizen Gojukan profile says 12) and was introduced to Higaonna Kanryō at age 14 (1902), training under him until Higaonna's death (military service interrupted training 1910-1912 in Miyakonojō). The JA Wikipedia notes he was born April 25, 1888 in Higashi-machi, Naha as the eldest son of a wealthy merchant family and was adopted in 1893 at age five into the Miyagi main family; the JA Wikipedia gives his death date as October 7, 1953 (the EN Wikipedia gives October 8 - the EN date is kept, the JA alternative recorded). He traveled to Fujian in May 1915 (visiting Ryū Ryū Ko's grave) and again after Higaonna's death, studying with Gokenki and adapting the Rokkishu exercises into the Tensho kata. He named the system Gōjū-ryū in 1929 (the JA Wikipedia gives 1931, citing the draft of his Goju-ryu Kempo manuscript of August 1931 held at the Okinawa Karate Museum - both dates recorded) and created the Gekisai kata in 1940. He was instrumental in registering karate at the Butokukai, developed the Junbi-undo, and performed Naha-te for Prince Hirohito (1921) and Prince Chichibu (1925); in 1926 he established the Karate Research Club with Hanashiro, Motobu and Mabuni. He died without naming a successor; his most experienced pupils at his death were Sekō Higa, Meitoku Yagi, Eiichi Miyazato, Koshin Iha and Seikichi Toguchi.
