description:
  en: Japanese martial artist (1893-1987), student of Motobu Chōki, founder of Kushin-ryu karate-do in Osaka in 1932; also a Kodokan judo 8th dan.
notes: Ueshima began learning Imma-ryu jujutsu at age 3 and karate kata (Pinan, Kusanku) from the Okinawan police officer Ueshima Suguru in Ako at age 9. He opened his Ueshima Judo dojo in Higashiyodogawa, Osaka in 1925, where several Okinawan karate teachers practiced and taught, including Motobu Choki's Shuri-te and Tomari-te, Kanegusuku Kaneshige (Shito-ryu, Kobayashi-ryu, Goju-ryu) and Chibana Choshin's Kobayashi-ryu. He helped edit Motobu's 1926 work Okinawa Kenpo Karate-jutsu Kumite-hen with Sugimoto Tokuji. He founded Kushin-ryu karate-do in 1932, developed from Imma-ryu and Goju-ryu. He was awarded a judo teaching license by the Dai Nippon Butokukai in 1933 and was the third person to receive the karate kyoshi title from it (July 1939, after Miyagi Chojun and Konishi Yasuhiro in May 1937); the Budo Japan article instead places the Kyoshi awards to Konishi, Ueshima and Miyagi together in 1937 - the JA Wikipedia date is kept, with the alternative recorded here. He performed at the Butokuden in 1935 together with his daughter. He received 8th dan in Kodokan judo in 1965. Joe Swift's article on Motobu lists Ueshima of Kushinryu among the Tokyo karate exponents sympathetic to Motobu's methods, corroborating the connection.
