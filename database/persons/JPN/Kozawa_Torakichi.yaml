description:
  en: >-
    Mito-domain retainer and swordsman (Hokushin Ittō-ryū, Shin Tamiya-ryū), given name Masakata.
    Kenjutsu professor at the domain school Kōdōkan; reportedly trained under Chiba Shusaku (JA
    wiki, 'according to accounts'). After the abolition of the han, opened the Tōbukan dojo in his
    own residence on 1874-01-01, teaching Hokushin Ittō-ryū kenjutsu and Shin Tamiya-ryū
    battojutsu, and produced Naitō Takaharu and Monna Tadashi (JA wiki, Kozawa Torakichi).
    Inducted into the All Japan Kendo Federation's Kendo Dendō in 2005.
  ja: >-
    水戸藩士。藩校弘道館の剣術方教授。廃藩後、1874年（明治7年）1月1日自邸に道場・東武館を開き、北辰一刀流剣術・新田宮流
    抜刀術を指南。内藤高治・門奈正を輩出した。2005年（平成17年）、剣道殿堂顕彰。
