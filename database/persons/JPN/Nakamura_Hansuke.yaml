description:
  en: Nakamura Hansuke (1845–1897) was a Japanese jūjutsuka of the Ryōi Shintō-ryū, born in Kurume. Appointed
    to the Tokyo Metropolitan Police jūjutsu staff in 1883, he became one of the strongest police jūjutsu
    instructors of the era, nicknamed "Shōki no Hansuke" for his enormous strength and iron-hard neck
    training. Fought the famous ~55-minute draw against the Kodokan's Yokoyama Sakujirō at the 1886 police
    jūjutsu matches; model for Murai Hansuke in Tomita Tsuneo's novel Sanshirō Sugata.
  ja: 中村半助（1845年 - 1897年）は、日本の柔術家。筑後国久留米藩出身で、良移心当流を修めた。1883年より東京警視庁の 柔術世話係（師範役）を務め、「鍾馗の半助」の異名をとった。1886年の警視庁柔術試合における講道館・横山作次郎との
    引き分けの一戦で知られ、富田常雄の小説『姿三四郎』の村井半助のモデルとなった。
notes: Learned Ryōi Shintō-ryū from childhood at Shimozaka Saizō's dōjō in Kushihara-chō, Kurume; neither
  Shimozaka nor the Ryōi Shintō-ryū style has a database entity yet, and the teacher relationship is single-sourced
  (Japanese Wikipedia) - recorded here as prose rather than a teachers[] edge for now. Appointed to the
  police jūjutsu staff in March 1883 on Shimozaka's recommendation, together with his fellow student Uehara
  Shōgo. Fought Tomita Tsunejirō in July 1886 at the Tenjin Shin'yō-ryū dōjō (Tomita's own account of
  the bout is contested by the Ryōi Shintōkai). A sumō-banzuke-style ranking of jūjutsuka placed him as
  the eastern yokozuna with Yokoyama Sakujirō as the western one. Performed Ryōi Shintō-ryū kata at the
  new Kodokan dōjō in 1894. Death year 1897 (Meiji 30).
