description:
  en: 'Okinawan karate master of Shuri-te, trained under Matsumura Sokon and Anko Itosu, and often considered Itosu''s top student. A soldier who served in the First Sino-Japanese War and was known as "Gunso" (sergeant), he taught karate at Okinawa Prefectural Normal School and was among the first people to demonstrate karate in Hawaii in 1927. His students included Kanken Toyama and Gima Shinkin.

'
  ja: '沖縄の空手家で、松村宗棍と糸洲安恒に師事した首里手の大家。糸洲の筆頭弟子と見なされる。日清戦争に従軍し「屋部軍曹」と呼ばれ、沖縄県師範学校で空手を指導。1927年にはハワイで空手を披露した最初の一人で、遠山寛賢や儀間真謹らを教えた。

'
