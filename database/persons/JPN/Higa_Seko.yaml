description:
  en: Okinawan Goju-ryu karate teacher (1898-1966), student of Higaonna Kanryō and Chōjun Miyagi, founder
    of the Goju-ryu Kokusai Karate Kobudo Renmei.
notes: Higa studied under Higaonna Kanryō from age 13 (1911) until Higaonna's death, then continued with
  Chōjun Miyagi for 38 years until Miyagi's death in 1953. He was an elementary school teacher for one
  year, then a policeman; the EN Wikipedia has him retiring in 1931 to open his dojo in the Kumoji section
  of Naha (one of only four students of Miyagi allowed to open a dojo while the master lived, with Jin'an
  Shinzato, Jinsei Kamiya and Meitoku Yagi), while the Shuriway biography also gives 1931 for leaving
  the force and opening his dojo in Naha. The EN Wikipedia gives his Saipan teaching as 1935-1937; the
  Shuriway biography gives 1937-1939 - both dates recorded. After WWII he opened a new dojo in Itoman-cho
  and taught at a high school karate club, Ryukyu University and the Naha prison. A 1952 newspaper document
  by Miyagi listed only Higa as "Headmaster" among his seniors, and Higa stepped in as Miyagi's temporary
  successor after his death. In 1956 nineteen karate teachers founded the Okinawa Karatedo Federation
  at Nagamine's dojo, with Higa as vice-chairman and, four years later, chairman. In 1960 he opened the
  Shodokan dojo in the Yogi district of Naha and founded the Goju-ryu Kokusai Karate Kobudo Renmei (International
  Karatedo and Kobudo Federation), serving as its first president from 1960 to 1966.
