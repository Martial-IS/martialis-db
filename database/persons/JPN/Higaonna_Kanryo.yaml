description:
  en: Ryukyuan martial artist (1853-1915), founder of the fighting style known at the time as Naha-te;
    studied Fujian White Crane kung fu under Ryū Ryū Ko in Fuzhou and taught Chōjun Miyagi, founder of
    Goju-ryu.
notes: 'Death date: the EN Wikipedia (October 1915), the JA Wikipedia (1915), the Cabinet Office biography
  (1915, bronchial asthma) and the Budo Japan interview with Morio Higaonna (1853-1915) all give 1915,
  so the Wikidata value (December 1916, imported from German Wikipedia) is rejected as a conflict. Birth
  date: 1853-03-10 is the lunar date; the JA Wikipedia and CAO give the Gregorian date April 17, 1853
  (lunar March 10). Higaonna was illiterate and his teachers'' names come from oral tradition. The IOGKF
  biography states he began learning Chinese kempo at fourteen, left for Foochow at sixteen (staying at
  the Ryukyu-kan settlement) and after nearly a year was accepted as personal disciple of Master Ryu Ryuko;
  the Selah biography gives his arrival in Fuzhou as 1869 and about 13 years of study, returning in 1881.
  The Cabinet Office biography gives his China departure as 1874 and return as 1877, with the flood story
  as the basis of his acceptance; the Budo Japan interview (Morio Higaonna) states he went to Fujian at
  15 to avenge his father''s enemies and studied under Lulukou. The EN Wikipedia article records the Fuzhou
  stay as 1867-1881 and that he first studied (about four years) with Wai Xinxian, Kojo Taitei and Iwah
  at the Kojo Dojo before training under Ryū Ryū Ko, who some identify with Xie Zongxiang - see the possibly_same_as
  entries on those persons. He learned four kata in China: Sanchin, Seisan, Sanseru and Bechurin. He began
  teaching Naha-te in 1905 at the Naha Commercial School (per the CAO biography, the first to teach it
  within the school curriculum).'
