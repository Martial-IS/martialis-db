notes: 'One of four shihan (master instructors) dispatched from Katori Shinto-ryu to teach at the Kodokan
  in Tokyo at Jigoro Kano''s request, along with Narimichi Tamai, Sozaemon Kuboki, and Ichizo Shiinato.
  This was part of the first effort to disseminate Katori Shinto-ryu outside the Chiba region. His own
  teacher within Katori Shinto-ryu is unidentified; no place, period, or source details recorded for it.

