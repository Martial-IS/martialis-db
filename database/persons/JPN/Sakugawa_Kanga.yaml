description:
  en: >-
    Okinawan pioneer of the Shuri lineage of karate, known as "Tode" (Chinese hand) Sakugawa. Sources
    disagree on whether he learned from Kushanku in Okinawa or in China.
notes: >-
  Cramer (p. 66): his dates vary by up to thirty years between authors; "some researchers" give an
  earlier teacher, Takahara Pechin. Green & Svinth (p. 207) say Sakugawa and Matsumura trained in
  Jigen-ryu kenjutsu in Satsuma.
