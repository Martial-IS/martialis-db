description:
  en: >-
    Okinawan karate teacher, senior student of Higaonna Kanryō and founder of Tōon-ryū, named after
    his teacher. A school teacher and principal; he later taught from his home in Ōita Prefecture.
notes: >-
  Cramer (pp. 116-118) also has: Butokukai recognition of Tōon-ryū in 1933; chief director and head
  instructor of the Butokukai's Naha branch; refused the Goju-ryu succession
  after Miyagi's death unless the style were renamed Tōon Goju-ryu.
