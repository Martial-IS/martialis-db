description:
  en: Okinawan martial arts master (born 1949) of Shorin-ryu and Yamanni-ryu, chief instructor of the Ryukyu Bujutsu Kenkyu Doyukai (RBKD) appointed by Chogi Kishaba; student of Shoshin Nagamine, Chogi Kishaba, Chokei Kishaba, Masao Shima and Seigi Nakamura; taught in the United States from 1978.
notes: Oshiro began informal karate and bojutsu at age eight or nine and started formal training at sixteen under Masao Shima at the dojo jointly run by Shima, Taba and Chokei Kishaba, meeting Chokei Kishaba when he made brown belt; he also trained at Shoshin Nagamine's Matsubayashi headquarters dojo, where Nagamine, Seigi Nakamura, Junko Yamaguchi and Jokei Kushi taught him Chinto kata (Nakamura especially deeply). He learned Yamanni-ryu bojutsu privately from Chogi Kishaba, who recommended him for training; Oshiro describes Chogi as the sole successor to Masami Chinen knowing all the Yamanni-ryu katas, and says "the foundation and 99% of my knowledge and technique came from Kishaba sensei". He retired as a detective in the Okinawan police, moved to the United States in 1978, and in 1985 co-founded the RBKD with Chogi Kishaba, becoming its chief instructor. He relocated back to Okinawa in 2018 (per the official Oshiro Dojo shihan page; the EN Wikipedia article gives summer 2019 - the official date is kept). The 2008 Haff interview records his ranks at the time as 6th dan Shorin-ryu and 7th dan Yamanni-Chinen-ryu; the 2017 dojo instructors page records 9th dan in Shima-Ha Shorin-Ryu karate and 8th dan in Yamanni-Ryu kobudo.
