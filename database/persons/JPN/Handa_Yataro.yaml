description:
  en: 'Japanese jujutsu master from Osaka, founder of Daito-ryu jujutsu (大東流柔術) and of the Seibukan dojo
    at

    Dojima-ura-cho, Kita-ku, Osaka in 1878. Born in 1847 as the son of the Kishu domain retainer Taniguchi
    Toemon, he

    trained in Sekiguchi Shinshin-ryu under Sekiguchi Ujitane (from 1860), in Tenjin Shin''yo-ryu under
    Yamana Shinkuro

    (山名新九郎) and in Shibukawa-ryu under Takenaka Isamu (竹中勇). After a warrior pilgrimage (musha shugyo)
    through Shikoku,

    Kyushu, Chugoku, Omi and Yamashiro in 1874, he settled in Osaka in 1876, succeeding to the dojo of
    Yamana Shinjuro

    (山名新十郎) - a different, related figure from his teacher Yamana Shinkuro - and in

    1878 established the Seibukan and founded Daito-ryu jujutsu. His students included Uyenishi Sadakazu,
    Taro Miyake,

    Yukio Tani and Seizo Yamamoto, who carried the school''s ground-grappling skills to London from 1900.
    He was the

    sempai (senior) of the Fusen-ryu master Mataemon Tanabe, who cross-trained (degeiko) at the Seibukan
    from 1898 and

    regularly taught there. Despite the similar name, his Daito-ryu jujutsu is a separate school from
    the Daito-ryu

    Aiki-jujutsu lineage of Takeda Sokaku.

    '
  ja: '大東流柔術の開祖であり、1878年に大阪市北区堂島裏町に盛武館を開いた柔術家。1847年に紀州藩士・谷口藤右衛門の子として

    生まれ、関口新心流を関口氏胤（1860年より）、天神真楊流を山名新九郎、澁川流を竹中勇に学んだ。1874年の武者修行

    （四国・九州・中国・江州・山城）を経て、1876年に大阪に移り山名新十郎の道場を継ぎ、1878年に盛武館を開いて大東流柔術を

    創始した。門人には上西貞一・三宅多留次・谷幸雄・山本清蔵らがおり、1900年からロンドンでその寝技を伝えた。不遷流の

    田辺又右衛門は半田の先輩で、1898年から盛武館に出稽古し常時指導にあたった。名称が似るが武田惣角系の

    大東流合気柔術とは別流派である。

    '
notes: The Japanese Wikipedia article on Daito-ryu jujutsu, which cites the 日本現今人名辞典 (1900) and Fukuoka
  Masami's 月刊秘伝 article (2021, taken as-is from the WebHiden index), is the main source for Handa's biography;
  no death date has been found in any consulted source. The dojo founding date is given as 1878 by JA
  Wikipedia (with an earlier Handa practice hall at Dojima attested for Meiji 6-7, 1873-74, by the J-STAGE
  research note), whereas Wolf (2016) and EN Wikipedia describe the Osaka dojo as "opened in 1897" - the
  1878 date is preferred here as it rests on the JA Wikipedia account sourced to the contemporary biographical
  dictionary. The name kanji appear as both 弥太郎 (shinjitai, used here) and 彌太郎 (kyūjitai); both are attested.
