description:
  en: Okinawan karateka (1932-2024), Hanshi 10th dan Shidokan karate, student of Shinpan Gusukuma and Katsuya Miyahira; senior-most Shorin-ryu practitioner in the United States, based in Lansing, Michigan.
notes: 'Iha began karate training under his uncle and was accepted as a formal student of Shinpan Gusukuma in 1950, training with him for four years (until Gusukuma''s death in 1954); he was then introduced to Katsuya Miyahira by his friend Shoei Miyazato and accepted as Miyahira''s student in 1954. Rank progression per the Fighting Arts interview: 5-dan shihan (1963, teaching in Manila at the dojo of Latino Gonzales), 6-dan (1964, teaching US Marines at Futenma and opening his own Nishihara dojo), kyoshi 7-dan (1967, sent to Los Angeles - the first Okinawan master instructor of Shorin-ryu in Southern California since Kentsu Yabu in 1927), kyoshi 8-dan (September 1978), and hanshi 9-dan certified by Miyahira on March 12, 1989. He moved to Lansing, Michigan in April 1975, running the Original Okinawa Karate dojo; he was US Branch Chief of the Okinawa Shorin-ryu Karatedo Association and later North American Director for Shorin-ryu Shidokan. On May 19, 2020, Okinawa Governor Denny Tamaki awarded him the title of Intangible Cultural Asset - the first such award to an individual living outside Okinawa. The obituary gives his rank as Hanshi 10th dan. Note: the Grand River Karate bio gives 1931 as his birth year, while the Fighting Arts interview (primary) gives July 12, 1932.'
