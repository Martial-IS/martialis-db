description:
  en: Okinawan martial arts master (1898-1976), a former policeman who formed the Yamani-ryu bojutsu school
    and taught bojutsu privately at his home in Tobaru, Shuri; possibly studied karate under Chōjun Miyagi;
    students included Chōgi Kishaba and Chōkei Kishaba.
notes: Chinen named his Yamani-ryu style after his grandfather Sanra Chinen (1842-1925; EN Wikipedia's Chinen article says father, its Yamanni-ryu article, Motobu Naoki and Ryukyu Bugei say grandson), also a teacher of bojutsu, known
  as Yamani Usumei and Yamane Tanmei. Motobu Naoki's article "Forgotten Masters of Karate" confirms Chinen
  Sanra as the Yamane-ryu bojutsu founder (a commoner of yago Yamanmee, hence the name) and states that
  after the war his grandson Chinen Masami served as head of the family; Higa Seitoku of the Bugeikan
  studied under Masami and received the only shihan license Masami ever issued, making the Bugeikan the
  legitimate successor of the Yamane-ryu; Yabiku Moden and Oshiro Chojo also studied under Chinen Sanra.
  The IKKF masters gallery describes him as the founder of Yamani-ryu and names Shuguro Nakazato and Seitoku
  Higa among his top students (corroborating the EN Wikipedia article, which records his kata preserved
  by Seitoku Higa of the Bugeikan and Shugoro Nakazato of Shorin-ryu). The Houston Karate page on Yamanni
  Chinen Ryu states Masami Chinen was the last member of the Chinen family to teach the art, and that
  upon his death the family passed the title of Soke to his student Chogi Kishaba, who had begun training
  with Chinen as a teenager and remained his student until his death. During the Second World War he lived
  with the martial arts master Horoku Ishikawa in Tainan, Taiwan; he also worked at the Shuri City Hall.
  The Haff interview with Toshihiro Oshiro states his teacher Masami Chinen "studied Shuri style karate,
  I believe, and also some under Sensei Miyagi to understand stances, maybe footwork" - a hedged single
  mention, hence the Miyagi teacher edge is asserted as possible. His student
  Chōgi Kishaba practiced Yamani-ryu alongside Goju-ryu under Chōjun Miyagi.
