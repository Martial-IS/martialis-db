description:
  en: 'Uchida Ryōgorō Shigeyoshi (1837-1921) was a Japanese jojutsu practitioner and holder of Menkyo Kaiden

    in the Haruyoshi branch of Shintō Musō-ryū. Born Hiraoka Ryōgorō, he was adopted into the Uchida family

    as a teenager. He founded Uchida-ryū Tanjōjutsu, a system of short staff (tanjō) techniques originally

    called "Sutteki" (stick method). He was one of only two teachers Nakayama Hakudō studied under in

    1912 at Shiba Park, Tokyo, where Hakudo learned Shintō Musō-ryū jōjutsu and valued the jo training

    among his most valuable pursuits.

'
