notes: 'The claim that Gigō studied kendo and iaido under Hakudo Nakayama (1936-1945) is recorded here
  as possible. It is attested only in English-language lineage/secondary material
  (Shotokai Encyclopedia - the organization of Gigō''s own students - and JKR-UK), is absent from Japanese-language
  sources, and is not corroborated by first-person accounts including Gichin Funakoshi''s autobiography
  Karate-do: My Way of Life, which describes Nakayama offering the Funakoshis the use of his Yushinkan
  dojo but says nothing of any teaching. The Nagamine and Black Belt sources document the shared dojo
  but not the relationship.'
