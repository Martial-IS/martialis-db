description:
  en: Okinawan karate master (1907-1997), founder of the Matsubayashi-ryu school of Shorin-ryu karate in 1947; also a soldier, police superintendent, Naha City assemblyman (1953-1957) and author of The Essence of Okinawan Karate-Do and Tales of Okinawa's Great Masters.
notes: Nagamine began karate in the summer of 1923 (his 17th year by Japanese count) under his next-door neighbour Chojin Kuba of Tomari-te, and trained at night on the Tomari Primary School grounds under the old master Kotatsu Iha. In Shuri he studied under Taro Shimabukuro (島袋太郎, a disciple of Kiyuna Pechin - distinct from the Seibukan founder Shimabukuro Zenryo, who was in Osaka from 1926 and whom EN Wikipedia confuses with him) from around 1924, and under Ankichi Arakaki, a senior disciple of Kyan Chotoku, from 1925 or 1926 (Quast 2021). The English autobiography's 1926 and 1928 dates conflict with the Japanese text Quast quotes and with Arakaki's death in December 1927; its c. 1927 date for Iha may be shifted the same way and is unchecked. Conscripted in the winter of 1927 (Yanagihara 2020, via Quast; the autobiography says 1928) into the 47th Infantry Regiment (Jinan Incident, China), he was discharged in 1931 and became a police officer; stationed at the Kadena Police Station he studied directly under Chotoku Kyan from December 1931 through August 1936. In 1936, while studying at the Tokyo Metropolitan Police Academy, he received instruction from Motobu Choki for six months in Hongo ward. He was awarded the Renshi title by the Dai Nippon Butokukai in 1940 (May 1940 on Chojun Miyagi's recommendation per his autobiography; July 1940 together with Higa Seiko per JA Wikipedia). He also practiced kendo from 1938 (sandan in 1941). He founded Matsubayashi-ryu in 1947, named in honor of Sokon Matsumura and Kosaku Matsumora, and opened his dojo in Naha in 1953. He was police marshal of Naha in 1946, first vice chairman of the Okinawa Karate-do Federation in 1956 and its chairman 1961-1969, and organized the World Matsubayashi-ryu Karate-do Federation in 1977. Awarded the Order of the Rising Sun, 5th Class in 1982; designated one of the first "Okinawa Prefecture Intangible Cultural Asset" holders in 1997, the first in the Okinawan karate world, and died the same year in a Naha hospital of acute renal failure. He was succeeded in 1997 by his son Takayoshi Nagamine. His student Katsuhiko Shinzato translated The Essence of Okinawan Karate-Do into English; Patrick McCarthy translated Tales of Okinawa's Great Masters.
