description:
  en: Japanese judoka, graduate of the Busen (Dainihon Budo Senmon Gakko) in Kyoto, who never lost a match
    in his competitive career. Sent to France in 1953, he became a leading judo teacher in Europe and
    Africa and arts director of the Dutch Judo Federation, where he trained Anton Geesink for the 1961
    World and 1964 Olympic titles. Founded the Michigami Dojo in Bordeaux in 1963 and was promoted to
    9th dan in 1975. Brought to Aquitaine by André Nocquet in the mid-1950s, he became the Collège des
    ceintures noires' national technical director and drew around 90% of the region's clubs to the Collège,
    training champions including Bernard Sudre.
