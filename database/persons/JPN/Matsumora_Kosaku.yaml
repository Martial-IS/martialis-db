description:
  en: Ryukyuan karate master (1829-1898) of the Tomari-te style, student of Karyu Uku and Kishin Teruya;
    teacher of Chōtoku Kyan (kata Chinto) and Chōki Motobu; became an Okinawan folk hero at 20 for disarming
    a Satsuma overlord with a wet towel.
notes: Matsumora studied Tomari-te under Karyu Uku (aka Giko Uku) and Kishin Teruya, and also studied
  Jigen-ryu. He taught Chotoku Kyan the kata Chinto (his own version, distinct from Matsumura Sokon's).
  The story of his fame comes from Shōshin Nagamine's account. His name honors Matsumora in Nagamine's
  Matsubayashi-ryu, named for Matsumura Sokon (Matsu) and Matsumora (Bayashi). The Motobu-ryu official
  history records that Motobu Choki studied under Matsumora from age 19, and that during kumite practice
  one of Motobu's hands struck Matsumora's face, leading Matsumora to praise the young Motobu's martial
  talent (Ryukyu Shimpo, Showa 11); Geoffrey Gaudion's account likewise describes Matsumora as impressed
  by Motobu's enthusiasm, teaching him Naihanchi and Passai while refusing to teach kumite for fear Motobu
  would use it in the street. Christopher Caile's Fighting Arts article describes Matsumora as the restorer
  of Tomari-te, one of the Shorin-ryu "Uhu Bushi" alongside Matsumura Sokon as restorer of Shuri-te.
