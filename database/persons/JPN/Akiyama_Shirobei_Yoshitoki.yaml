notes: >-
  Skoss (the Kubota line's account): he learned three unarmed techniques from a local man while
  studying medicine in China, then devised some three hundred more during one hundred days at the
  Dazaifu Tenmangu Shrine, where a snow-laden willow gave the school its name. The Chinese teacher
  is not named.
