description:
  en: >-
    Meiji kengō of the Jikishin Kage-ryū Otani-ha. Taught by Inoue Denbei and then by Otani Nobutomo (Kōbusho head), who awarded him a teaching license in 1856; assistant instructor at the Kōbusho from March 1856, head instructor from 1858 (Bennett). Pioneered the public gekiken kagyō paid fencing exhibitions from 1873, first at his training hall in Shitaya Kurumasaka, Tokyo (Bennett). Naitō Takaharu trained at his dojo for a year from April 1883 (JA wiki, Naitō; kenshi247 2012). Listed among the Meiji kengō of Jikishin Kage-ryū (JA wiki); Kendo Dendō first-batch inductee (2003).
  ja: >-
    直心影流（男谷派）の明治の剣豪。直心影流剣術の主な門人として挙げられ、剣道殿堂第一次顕彰者（2003年）。
notes: >-
  Bennett's years (1830-94) agree with Wikidata (1830-12-19, Edo; 1894-09-11, Shitaya, beriberi). Married Taka, niece of Katsu Kaishu, in 1858 (Bennett) - not modeled. Participated in the Battle of Ueno (Wikidata).
