notes: '- Saitō Hitohiro (斎藤 仁弘), born 12 February 1957 in Iwama, Ibaraki, is the son of Morihiro Saito. He began aikido at age seven under Morihei Ueshiba, who cared for him like a grandson; after Ueshiba''s death in 1969 he continued under his father.

  - After high school he studied cooking in Sendai (one year) and Osaka (two years), where he also trained at Seiseki Abe''s dojo and studied calligraphy under him.

  - Returned to Iwama in 1978 and ran a restaurant for about seven years before devoting himself fully to aikido; also taught weekly at the Yoyogi Uehara dojo in Tokyo.

  - Appointed official instructor at the Iwama dojo in 1986; took over most of the dojo''s running as his father''s health declined in the late 1990s.

  - Opened his own dojo, the Tanrenkan (鍛錬館), in 2000, sponsored by his father.

  - After Morihiro Saito''s death in May 2002 he initially maintained the Founder''s dojo and Aiki Jinja for the Aikikai, but separated from the Aikikai in November 2003 and founded Iwama Shin-Shin Aiki Shuren-kai (ISSASK) in February 2004.

  - Has been known as Hitohira (仁平) since 2009. Also a professional chef, calligrapher, painter and sculptor of nōmen masks; his sons began teaching internationally in 2016.

'
