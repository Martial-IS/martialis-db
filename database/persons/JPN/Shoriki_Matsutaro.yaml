description:
  en: >-
    Japanese Home Ministry police official, president of the Yomiuri Shimbun,
    founder of the Yomiuri Giants and politician. A Kodokan judo practitioner
    from 1907 and chairman of the Diet Judo League, he received the Kodokan
    10th dan in 1969.
  ja: >-
    内務官僚、読売新聞社社長、実業家、政治家。1907年に講道館に入門し、
    1969年に講道館から十段位を贈られた。
notes: >-
  Information on direct teachers is elusive, but a forum post points towards
  at least some level of direct learning from Mifune. The photograph itself
  was not seen when the forum thread was read. Dan ranks other than the 10th
  are not recorded: the sources give different sequences before it. The
  10th dan was posthumous: he died on 9 October 1969 and the certificate is
  dated 8 October.
