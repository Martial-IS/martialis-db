description:
  en: 'Ueda Heitaro (1877-1949) was a Japanese kendo master, three-time participant in the Tenran shiai (imperial martial arts tournaments), and the only kenshi to be deified as a Shinto kami. He served as head instructor for the Dai Nippon Butoku Kai Kagawa branch, Kagawa police, Takamatsu prison, and several schools. He was a student of Naito Takaharu in kendo, and from 1919 studied Tosa Eishin-ryu iaijutsu under Hosokawa Yoshimasa, receiving menkyo kaiden in Muso Shinden Eishin-ryu in 1923.

'
  ja: '植田平太郎（1877-1949）は、日本の剣道家で、昭和天覧試合に3回出場し、唯一神道の神として祀られた剣士。大日本武徳会香川支部、香川県警察部、高松監獄署、高松高等商業学校、高松商業学校、高松第一中学校の剣道師範を務めた。1919年に細川義昌に師事し、1923年に無双神伝英信流抜刀術の免許皆伝を受けた。

'
