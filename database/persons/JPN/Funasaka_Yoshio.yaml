description:
  en: Master (shihan) of Omori-ryu iai, from the family behind the Taiseido martial-arts bookshop in Shibuya,
    Tokyo. Japanese Wikipedia states that Yukio Mishima, who had begun iai practice in November 1965,
    was formally admitted to Omori-ryu iai with Funasaka as its master in early 1966 through the introduction
    of his kendo teacher Yoshikawa Masami, at the police-station dojo in Meguro where they also met Funasaka's
    elder brother, the kendoka Funasaka Hiroshi. In his own account to Christopher Ross, he was nineteen
    years old when he taught Mishima iai forms - practised with shinken, real blades, in those days -
    including the kaishaku form that assists at a seppuku; the school "is now called Omori Ryu, but we
    called it Hasegawa Eishin Ryu". He recalled Mishima as friendly and polite, and judged his kendo acceptable
    though unspectacular.
