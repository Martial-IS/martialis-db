description:
  en: >-
    Judo historian and teacher, head of the Kodokan's Library and
    Documentation Department and curator of its Judo Museum, and author of
    books on judo and Kanō Jigorō. He taught judo in more than ten countries,
    including two years in Iceland, where Iura Yoshihiko succeeded him.
notes: >-
  Studied at 東京教育大学 体育学部武道学科, graduating in 1973, then its master's course; no instructors named, so an
  unidentified-teacher entry. Also an associate professor at Kagawa University, and
  president (理事長, 2008) then vice-president of the Japanese Academy of Budo
  (日本武道学会), which has no record. The Iceland years and club are not given;
  the AJJF interview with Iura places them just before Iura's first stay.
  Wikidata gives 14 April 2020 as the date of death, against the Kodokan's 9
  April.
