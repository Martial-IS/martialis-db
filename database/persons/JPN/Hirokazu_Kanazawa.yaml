description:
  en: 'Japanese master of Shotokan karate, ranked 10th dan, who held the 2nd dan in Judo. Kanazawa trained under Gichin Funakoshi and Masatoshi Nakayama at Takushoku University, won the inaugural All Japan Karate Championship kumite title in 1957, and was among the first graduates of the JKA instructor training programme. After teaching for the JKA in Japan and abroad, he left the association and founded the Shotokan Karate-Do International Federation (SKIF), which he led as Soke and Chief Instructor until his death in 2019. He was among the last living karateka to have learned directly from Gichin Funakoshi.

'
