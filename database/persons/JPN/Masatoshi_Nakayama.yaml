description:
  en: 'Japanese master of Shotokan karate and the founder and first Chief Instructor of the Japan Karate Association (JKA). Nakayama began training under Gichin Funakoshi and his son Gigō Funakoshi at Takushoku University, helped establish the JKA in 1949 with Funakoshi as its formal head, and served as its Chief Instructor until his death in 1987. He was the first Shotokan master to attain 9th dan while alive and was posthumously awarded 10th dan. He developed the JKA instructor training program and karate''s first match system, spread Shotokan karate worldwide through his students, and authored the 11-volume Best Karate series. His notable students included Hirokazu Kanazawa, Keinosuke Enoeda, and Hiroshi Shirai.

'
  ja: '松濤館流空手道の達人で、日本空手協会（JKA）の設立者・初代首席師範。拓殖大学で船越義珍とその子・義豪（ギゴウ）に師事し、1949年のJKA設立を支援して首席師範を務めた。存命中に松濤館流で初めて九段に達し、没後十段を追贈された。JKA指導員養成制度と試合方式を確立し、弟子を通じて世界各地に松濤館空手を広め、『ベスト空手』全11巻を著した。著名な弟子には金澤弘和、榎枝慶之輔、白井寛らがいる。

'
