    - uri: https://ryukyu-bugei.com/?p=6586
      quotation: When he [Konishi] met Funakoshi Gichin in June 1925, he was finally able to learn Karate.
        However, since its contents was only Kata, together with Ōtsuka Hironori 大塚博紀 (1892–1982, founder
        of Wadō-ryū Karate-dō and Jūjutsu Kenpō) who was also a disciple of Funakoshi, Konishi began to
        devise Yakusoku Kumite 約束組手 and the like. Later Konishi studied Karate with Motobu Chōki and Mabuni
        Kenwa.
      informationType: infotype:secondary
      supports: true
      cite: Ryukyu Bugei website
      evidenceType: evidencetype:direct
    - basedOnSource: 01M6C5JZZG7H6GKWRW49CVXWKE
      quotation: >-
        Funakoshi was given the grade of Renshi, and later Tashi, and it is ironic that Konishi was on
        the Butokukai's karate examining board, since of course he was actually Funakoshi's student.
      informationType: infotype:secondary
      supports: true
      evidenceType: evidencetype:direct
