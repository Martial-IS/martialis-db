description:
  en: 'Japanese-Brazilian judo master known as the "Father of Judo in Santos", who introduced judo to the city in 1947 and founded the Academia Santista de Judô in 1949, the 7th branch of Ryuzo Ogawa''s Budokan network. He was a Pan American judo champion (4th dan, 1956) and was Osvaldo Alves''s first judo teacher.

'
  pt: 'Mestre de judô nipo-brasileiro conhecido como o "Pai do Judô em Santos", que introduziu o judô na cidade em 1947 e fundou a Academia Santista de Judô em 1949, a 7ª filial da rede Budokan de Ryuzo Ogawa. Foi campeão pan-americano de judô (4º dan, 1956) e o primeiro professor de judô de Osvaldo Alves.

'
