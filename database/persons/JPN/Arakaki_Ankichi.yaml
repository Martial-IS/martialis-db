description:
  en: Okinawan martial arts master (1899-1927), Shorin-ryu master who trained under Shinpan Gusukuma,
    Chōmo Hanashiro, Chōshin Chibana and Chotoku Kyan; extremely important in the education of Shōshin
    Nagamine, founder of Matsubayashi-ryu.
notes: Arakaki was nicknamed Uwayaguwa Ankichi and was famed for his tsumasaki-geri (toe kick), a technique
  he is said to have invented. He died at 28 of a stomach (peptic) ulcer, which is a documented cause
  of death (Wikidata P509/P1196). He began training with Shinpan Gusukuma, his primary school teacher,
  and also trained with Chōmo Hanashiro (another school teacher) before becoming a student of Chōshin
  Chibana, founder of Kobayashi Shorin-ryu. The Gaudion essay adds that after his discharge from military
  service in 1921 he moved to the village of Kadena, where he learned karate from Chotoku Kyan. Per the
  Shima Karate biography he was born into a wealthy family in Shuri and dropped out of middle school in
  his teens; at 19 he defeated a giant wrestler from Yomitan in a sumo tournament.
