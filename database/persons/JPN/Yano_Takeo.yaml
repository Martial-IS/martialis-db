description:
  en: >-
    Japanese judoka active in Brazil, where he fought members of the Gracie family and took part
    in the early growth of jiu-jitsu. Nicknamed "The Eastern Demon"; the heel hook in Brazilian
    jiu-jitsu is attributed to him.
  pt: >-
    Judoca japonês com atividade no Brasil, onde lutou contra membros da família Gracie e teve
    papel nos primórdios do jiu-jitsu. Apelidado "Demônio Oriental", é-lhe atribuída a chave de
    calcanhar no jiu-jitsu brasileiro.
