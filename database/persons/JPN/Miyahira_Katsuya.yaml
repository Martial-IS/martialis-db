description:
  en: Okinawan martial artist (1918-2010), grand master and founder of the Shorin-ryu Shidokan style of
    Okinawan karate, Hanshi 10th dan; student of Choshin Chibana, also instructed by Anbun Tokuda and
    Choki Motobu.
notes: Miyahira created the Shidokan branch of Kobayashi Shorin-ryu after the death of his teacher Choshin
  Chibana, and was president of the Okinawa Shorin-ryu Karate Association (Okinawa Shorin Ryu Karatedo
  Kyokai) until his death. The EN Wikipedia article on Chibana names him as founder of the Shōrin-ryū
  Shidōkan school, Hanshi 10th dan. His student Seikichi Iha is recorded on Wikidata (P802). Per the Shorinryu.de
  biography, Miyahira was taught at age five by his father (from the Toyama military school, versed in
  gymnastics and kendo), began deep karate study in April 1933 under Chibana Choshin studying traditional
  Shuri-te, was influenced by senior students such as Yoshitsugu Teichi, Kangi Shoya, Yasuyoshi Kamikosu,
  Tsuguyoshi Miyagi, Chozo Nakama and Shinji Tawada, practiced at the College of Shuri under Tokuda Anbun
  from September 1933, and deepened his kumite in the dojo of Motobu Choki. He spent the last years of
  the war as a teacher in Manchuria. After his return he founded his first dojo in Nishihara, taught at
  Ryukyu University from 1953, and built the Shidokan dojo in the garden of his home in Tsuboya in 1956.
  The Grand River Karate bio dates the opening of his Nishihara dojo to 1948. He was honored by the Japan
  Martial Arts Association in 1989 for distinguished service to the martial arts.
