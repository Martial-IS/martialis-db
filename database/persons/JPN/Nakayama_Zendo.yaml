description:
  en: 'Nakayama Zendo (1900–1981), born Nakayama Yoshimichi, was the eldest son and designated successor

    of Nakayama Hakudo, founder of Muso Shinden Ryu and 7th soke of Shindo Munen Ryu. He inherited all

    of his father''s martial knowledge - Shindo Munen Ryu kenjutsu, Muso Shinden Ryu iaido, and Shindo

    Muso Ryu jodo - receiving Menkyo Kaiden in Shindo Munen Ryu from Hakudo himself. A Butokukai

    Seirensho holder (1925) and Kyoshi in kendo (1929), iaido and jodo (1927), he was the 8th headmaster

    of the Yushinkan dojo after his father''s death in 1958. After a period of retreat from the martial

    arts during and after the Pacific War - when Hakudo was briefly imprisoned as a war responsibility

    suspect and the Yushinkan dojo was lost - Zendo later gave interviews to Domoto Akihiko that formed

    the basis of the Nakayama Hakudo Kendo Kojutsushu. He transmitted Hakudo''s kendo kata knowledge to

    Ogawa Takeshi, the 10th headmaster of the Yushinkan.

    '
  ja: '中山善道（1900年−1981年）は、夢想神伝流を創始した中山博道の長男であり、神道無念流の8代目宗家。博道から神道無念流の免許皆伝を継承し、博道死後1958年に有信館の宗家として継承した。大日本武徳会の精錬証（1925年）、教士（1927年居合・杖、1929年剣道）を保有。戦中・戦後の混乱で博道が一時収監された影響を受け、有信館を失った後、堂本昭彦への口述により『中山博道剣道口述集』を残した。

    '
