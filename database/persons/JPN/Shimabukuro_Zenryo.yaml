description:
  en: Okinawan karate master (1909-1969), founder of Shorin-ryu Seibukan karate; student of Chotoku Kyan.
notes: The official Seibukan history (priority source) gives his birth as November 5, 1909 in Shuri Kubagawa, Naha - agreeing with Wikidata and correcting the EN Wikipedia date (November 14, 1908). It records that he went to Osaka at 18 (1926) for work, settled in Chatan in 1933 as a confectioner, and began training under Chotoku Kyan in 1935 (Showa 10) - the EN Wikipedia gives 1932 for the start of Kyan training. He opened a dojo in Chatan in 1952, instructed US Army 503rd Airborne soldiers from 1961, and built the Seibukan dojo in 1962, also creating the Wanshu kata. He was president of the Okinawa Karate Union in 1965, and when the All-Okinawa Karate Federation formed in 1967 he was made vice president and awarded Hanshi 10th dan by it (the EN Wikipedia records a 10th dan red belt in 1964 within the Okinawan Karate-do United Association instead - the official 1967 date is kept). He died at 61 in Osaka in October 1969 on his way back from the All Japan championship. His students included his son Zenpo Shimabukuro (second head of Seibukan), nephew Zenji Shimabukuro, and American paratrooper William Fuller Jr. The Shuriway biography describes him as the foremost disciple of Kyan, with ten years of private training.
