description:
  en: >-
    Japanese karate teacher who spread Goju-ryu in Japan and abroad, founder of the International
    Karate-do Goju Kai Association. He introduced free sparring (jiyu kumite) at the Ritsumeikan
    University karate club in the 1930s. His claim to be Miyagi Chōjun's successor is disputed.
notes: >-
  Cramer gives his death as 1989 (p. 131) and 1988 (p. 135). Born Yoshimi; he says he took the name
  Gōgen at Miyagi's wish (p. 133).
