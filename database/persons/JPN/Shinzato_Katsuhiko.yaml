description:
  en: Okinawan martial arts master (born 1939), head of the Shorin-ryu Kishaba Juku since 2000; student of Shoshin Nagamine, Seigi Nakamura and Chokei Kishaba, and translator of Nagamine's The Essence of Okinawan Karate-Do.
notes: Shinzato began karate in 1957 under Tsunetaka Shimabukuro while studying English literature at the University of the Ryukyus (he states in a Dnevnik newspaper interview that he entered the university and started karate in 1957), later studying applied linguistics at Indiana University - the interview confirms he continued karate at a US graduate school. He returned to Okinawa in 1967 and joined Shoshin Nagamine's dojo, and also studied under Seigi Nakamura and Chokei Kishaba, as well as Chogi Kishaba (Yamane-ryu bojutsu, per Christopher Caile's 2024 Fighting Arts article). In the Dnevnik interview he names Chokei Kishaba as "the master that has had the greatest influence on me" and explains the study circle "Kishaba Juku" is named after Kishaba's last name in honor of his unique training methods; the interview gives Kishaba's dates as 1931-2000, differing from the 1929-10-04 used here (Seinenkai memorial). He practiced most days for six hours, and was one of the contributors to the Encyclopaedia of Okinawan karate and kobudo (沖縄空手古武道事典, Kashiwashobo, Tokyo, c. 2010), whose information gathering began in 2003; the interview, conducted around 2010 during a seminar in Slovenia, gives his age as 69, slightly at odds with the Wikidata-derived birth date. He is a professor of linguistics at Okinawa International University - Caile's 2024 article confirms this and records that Shinzato explained the Okinawan meaning of "Bushi" (an honorific, unlike the Japanese warrior-class term) - and became Juko Cho (head) of the Shorin-ryu Kishaba Juku after Chokei Kishaba's death in 2000, still head per the Omine dojo history page (2023) and Caile (2024). The harvested birth date (1939-02-10) comes from Wikidata.
