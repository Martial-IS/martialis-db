description:
  en: Takeshita Isamu (January 5, 1870 – July 1, 1949) was a Japanese naval admiral and diplomat. As Japan's naval attaché to the United States, he arranged for Yoshiaki Yamashita to teach judo to President Theodore Roosevelt at the White House in 1904. He later became a student of Morihei Ueshiba in aikido at the Kobukan dojo and demonstrated aikibudo in North America in 1935. He was the first president of the Kobukai Foundation and chairman of the Japan Sumo Association. Born Yamamoto, he was adopted into the Takeshita family as a boy.
notes: >-
  Aikido Journal gives his dates as 4 December 1869 - 6 July 1949: the birth date is the lunisolar date
  明治2年12月4日 written as a Western date (Gregorian 1870-01-05, as in JA Wikipedia); the death date
  differs from JA Wikipedia (1 July). Aikido Journal also states he was born Yamamoto and adopted into the
  Takeshita family as a second son.
