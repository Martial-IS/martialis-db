description:
  en: Okinawan karateka of Shuri-te, of Shuri, Naha; disciple of Kiyuna Pechin and one of Shoshin Nagamine's
    early teachers (1928).
notes: Shoshin Nagamine's autobiography states he became Taro Shimabukuro's disciple in March 1928, walking
  the 8 km between Shuri and Naha daily; Taro, "senior of me by one year", encouraged the young Nagamine
  and referred him to Ankichi Arakaki. Motobu Naoki's article on the 1918 Ryukyu Shimpo survey of karate
  masters lists Shimabukuro Taro among the disciples of Kiyuna Pechin (Kiyuna Tanmei), himself said to
  be a disciple of Matsumura Sokon. Distinct from Shimabukuro Zenryo (島袋善良, Seibukan founder, 1909-1969),
  who was living in Osaka from 1926 and did not begin karate under Kyan until 1935 - EN Wikipedia's Nagamine
  Shoshin article conflates the two. Cramer's "Taro Shimabuku" (Kyan's student, p. 97) is taken to be
  this man, from the same circle as Nagamine and Arakaki.
