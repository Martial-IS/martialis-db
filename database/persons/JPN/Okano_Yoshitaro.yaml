notes: Born in Tonoshō, Shozu District, Kagawa Prefecture. Studied Tenjin Shinyo-ryu and Muso-ryu jujutsu
  at age 17, teacher unidentified, before enrolling at Kodokan at age 20 (1906). Attended Dai Nippon Butoku
  Kai Martial Arts Teacher Training School as first-year student. Career included positions at Dai Nippon
  Butoku Kai, Okayama Prefectural Police, Sixth Higher School, Eighth Higher School, and Nagoya University.
  Known for expertise in ground techniques (ne-waza) and contributions to student judo. 10th dan was awarded
  posthumously on the date of his death.
