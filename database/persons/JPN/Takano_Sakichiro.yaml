description:
  en: 'Kenjutsu instructor of Nakanishi-ha Ittō-ryū and grandfather of Takano Sasaburō, who trained his grandson in the
    style from early childhood. Born into the Horiuchi family of Ōno-hara village, Chichibu district, and adopted into
    the Takano family. Went to Edo and entered the Itto-ryu Nakanishi dojo, where he became a senior disciple of the
    4th-generation head of Nakanishi-ha Itto-ryu (中西子正; ja.wikipedia''s dedicated article on him gives this name and
    generation, while the English-language kenshi247 biography of his grandson instead names his teacher "Nakanishi Chubei
    Tanemasa," described as a direct disciple of the 4th Ono-ha sōke, Ono Tadaichi - the two accounts do not fully agree
    on the intermediate teacher''s identity or exact generation). Received menkyo kaiden in the style, then returned home
    to serve as kenjutsu instructor to the Oshi domain (忍藩) and ran a small dojo on the grounds of Chichibu Shrine.'
notes: 'Fellow disciples at the Nakanishi dojo per ja.wikipedia''s dedicated article: 寺田宗有, 白井亨, 高柳又四郎,
  浅利義信, 千葉周作 and 浅利義明 (the article gives the kanji without readings) - the last being Yamaoka Tesshu''s own teacher, which
  ja.wikipedia''s main Takano Sasaburo article gives as the reason Tesshu took a particular interest in Sasaburo (fellow-disciple
  tie, not a direct teacher-student link between Sakichiro and Tesshu). Birth year: kenshi247 gives 1802, ja.wikipedia''s
  dedicated article gives 1803 (categorised there under 1803年生); recorded as an unreconciled range above rather than
  picking one.'
