description:
  en: Japanese judoka, winner of the All-Japan Judo Championships in 1948 and Olympic coach for the All-Japan
    Judo Federation in the early 1970s. As coach and trainer at Tenri University he served as a Japanese
    national team coach and worked intensively with Anton Geesink, who trained at Tenri annually from
    1956 pursuing the 1961 World and 1964 Olympic titles.
notes: Birth and death dates follow USAdojo (25 May 1918 / 6 March 1996); Wikidata lists 15 May 1918.
  Place of birth not given in sources consulted.
