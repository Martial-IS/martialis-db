description:
  en: Japanese aikido teacher and current head instructor of the Tenshin Dojo in Osaka. Daughter of the
    Jūsō aikido master, she was granted 1st dan by the founder Morihei Ueshiba. She married Steven Seagal
    in 1974 and co-established the Tenshin Dojo; after Seagal returned to the United States she ran the
    dojo on her own. Currently holds the rank of 7th dan. She was the
    model for the female aikido teacher Hanayama Yuriko in the NHK morning drama 'Man-tian'.
  ja: 大阪・天心道場の現道場長。十三の合気道師範の娘で、開祖植芝盛平翁より初段を允可される。1974年にスティーブン・セガールと結婚し天心道場を設立。セガール帰国後は一人で道場を切り盛りした。現在合気道七段。NHK連続テレビ小説『まんてん』の花山百合子のモデルとなった。
