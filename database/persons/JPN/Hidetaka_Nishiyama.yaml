description:
  en: 'Japanese Shotokan karate master who helped establish the Japan Karate Association (JKA) and pioneered traditional karate in the United States. He founded the American Amateur Karate Federation (AAKF) and the International Traditional Karate Federation (ITKF). He authored the seminal textbook ''Karate: The Art of Empty-Hand Fighting'' (1960). He was awarded the Order of the Sacred Treasure by the Emperor of Japan in 2000 and posthumously promoted to 10th dan.'
