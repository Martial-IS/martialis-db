description:
  en: Japanese-French martial artist, son of Minoru Mochizuki and creator of Yoseikan Budo. First Japanese
    to present karate in Europe (France, 1957) and first holder of a 10th dan of karate in France. Veterinary
    surgeon by training (Nihon Daigaku, 1962). Received the soke title of the Yoseikan school from his
    father in 2000.
