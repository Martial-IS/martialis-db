notes: '- Introduced karate to France in 1957, teaching Shotokan at Henry Pleé''s dojo via Jim Alcheik;
  returned to Japan in December 1958 to finish veterinary studies (diploma 1962); sent again to France
  by his father in 1963, where he introduced Wado-ryu and also taught aikido. - Studied Shotokan karate
  in Tokyo and later Wado-ryu with Shinji Michihara and, to a lesser extent, Hironori Otsuka (see the
  teachers list; Michihara has no Person entry yet). - 1964 first technical advisor of the aikido and
  karate sections of the FFJDA; participated in the creation of the FFKAMA and of the European Karate
  Union in 1965. - In 1965 began developing a new method initially named YOKEN, later renamed Yoseikan
  Budo in homage to his father; the French federation was created in 1975, the Centre international du
  Yoseikan Budo in 1978, and the World Yoseikan Federation (WYF) in 1997. - In 2000, at the WYF summer
  stage at Saintes-Maries-de-la-Mer, received the soke title of the Yoseikan school written by his 93-year-old
  father (non-hereditary), becoming the sole moral head of the school worldwide; opened the Hiroo Mochizuki
  Center (HMC) in Salon-de-Provence in 2012. - His sons Mitchi-Hito and Kyoshi continue the art (6th dan each, per the fr Wikipedia Yoseikan budo article). - The UK federation
  site gives his karate grade as 9th dan while the fr Wikipedia infobox says 10th dan; the fr Wikipedia
  figure is used in the rank entries.'
