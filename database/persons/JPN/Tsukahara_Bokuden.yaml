notes: >-
  Second son of Urabe Kakuken; adopted by Tsukahara Yasumoto, lord of Tsukahara castle. Learned the Kashima chuko-ryu from his father and Katori Shinto-ryu from his adoptive father (school page); neither father has a record. The birth place label follows the school (born into the Kashima shrine family).
