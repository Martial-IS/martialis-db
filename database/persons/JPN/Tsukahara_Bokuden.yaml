  hasEvidence:
  - basedOnSource: 01M6BGZPMB016Z305BQW68W7F3
    quotation: '一四八九年卜部覚賢の次男に生まれ、その後、塚原城主土佐守安幹の養子となった塚原卜傳高幹は実父から「鹿島中古流」を、養父からは「香取神道流」を学び、また武者修行による修練を重ね、かつ鹿島神宮に一千日の参籠祈願をして「心新たにして事に当たれ」との神示を受けるとともに、「鹿島の太刀」の極意を悟り、流派名を「鹿島新當流」と改め、生家卜部吉川家に継承され、今日に及んでいる。'
    informationType: infotype:secondary
    supports: true
    evidenceType: evidencetype:direct
description:
  en: >-
    Swordsman of the Kashima Shrine tradition who named the Kashima Shinto-ryu; teacher of Saito Denkibo.
