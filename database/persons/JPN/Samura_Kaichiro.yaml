description:
  en: Kodokan judoka, one of the longest-living 10th dan (belt degree) judo practitioners in the world,
    awarded his 10th dan in April 1948. Son of the master Masaaki Samura of Takeuchi Santo-ryu jujutsu,
    he joined the Kodokan in 1898, became head of the judo section of the Dai Nippon Butoku Kai in 1899,
    and began teaching at the Kodokan in 1931. It was on his advice that the young Toku Sanpo came to
    Tokyo.
