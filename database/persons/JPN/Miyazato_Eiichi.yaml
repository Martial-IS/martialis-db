description:
  en: Okinawan master of Goju-ryu karate (1922-1999), senior student of Chōjun Miyagi and his officially
    recognized successor; held 10th dan in karate and 7th dan in judo, founder of the Jundokan dojo.
notes: 'Miyazato''s father Jiro had been a student of Kanryo Higaonna, and Miyagi accepted the young Miyazato
  as his student; he began training under Miyagi at age 13 in 1935 (some sources say age 15, after first
  training with his own father) and, apart from a wartime interruption (deployed to Manchuria), trained
  with him continuously until Miyagi''s death in 1953. His elder brother Eiko was a longtime student at
  Miyagi''s Garden Dojo. After Miyagi''s death the family communicated that the founder wanted Miyazato
  to succeed him, and the Goju-ryu committee voted almost unanimously in February 1954 to make him the
  official successor. He opened his own dojo, the Jundokan, in Asato, Naha in 1956 (the Bushido Karate
  Club Ireland article and Finding Karate give 1957 - the EN Wikipedia date is kept), retired from the
  Ryukyu police in 1971, and served as Chairman of the Okinawa Prefecture Karate-do Federation (1981 director,
  1991 chairman). He was a major judoka: All Okinawa Judo Champion and All Japan Police Judo Champion,
  7th dan from the Kodokan (May 1, 1981), and posthumously 8th dan. He was awarded the title of Hanshi
  by the All Japan Karate-do Federation (September 8, 1979) and 10th dan Hanshi by the Okinawa Gojuryu
  Karatedo Kyokai (March 20, 1988). Note: the Puro Karate translation of the Musil/Moyer interviews gives
  his birth year as 1921 in the header, while the EN Wikipedia, Finding Karate and Bushido Karate give
  1922 - the 1922 date is kept.'
