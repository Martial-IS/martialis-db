description:
  en: Career Japanese army officer and postwar Ground Self-Defense Force general. Commissioned from the
    Military Academy (52nd class) in 1939, he became a tank regiment company commander, graduated the
    War College, and ended the war as a major instructing at the Nakano intelligence school. Rejoining
    the police reserve in 1952 after the purges, with US Army special-warfare schooling, he helped create
    the psychological warfare defence course of the GSDF Intelligence School in Kodaira, Tokyo, headed
    its education section from March 1967 and served as deputy commandant (major-general rank) from July
    1969 until retiring in February 1972. From late 1967 he was the de facto instructor of Yukio Mishima's
    Tatenokai, giving guerrilla-warfare lectures and leading street exercises and infiltration drills,
    while opposing the final coup plan. After retirement he published several books on Mishima, including
    Jieitai "Kage no Butai" - Mishima Yukio o Koroshita Shinjitsu no Kokuhaku (Kodansha, 2001).
