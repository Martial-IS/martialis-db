    quotation: Aussi, dès 1928, il a créé la Kobudo Kenkyukaï, section de recherche sur les arts martiaux traditionnels anciens. Cette section, dont je faisais partie, regroupait au départ une trentaine de membres, tous champions de judo. Deux fois par mois, sur la demande de Kano sensei, qui payait les cours, quatre professeurs du Tenshin Shoden Katori Shinto Ryu venaient spécialement de Narita à Tokyo pour nous enseigner leur art.
