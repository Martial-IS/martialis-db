description:
  en: >-
    Japanese educator who founded judo. Credited with introducing black and white belts and dan
    ranks, and with the mottoes seiryoku zen'yō (精力善用, 'good use of energy') and jita kyōei
    (自他共栄, 'mutual welfare and benefit').
  ja: >-
    講道館柔道を創始した教育者で、貴族院議員も務めた。日本のオリンピック初参加を推進した人物で、「柔道の父」と呼ばれる。
  pt: 'Jigoro Kano (em japonês: 嘉納治五郎, Kanō Jigorō) (Mikage, 28 de outubro de 1860 – 4 de maio de 1938) foi o fundador da arte marcial Judo.

'
