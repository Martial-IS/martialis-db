notes: '- By 1927 assistant instructor in Funakoshi''s Shotokan school; in 1929 organised the first school karate club at Tokyo University; the term ''Wado-ryu'' was coined by Eiichi Eriguchi in 1934. - In 1938 registered his style with the Dai Nippon Butoku Kai as ''Shinshu Wadoryu Karate-Jujutsu'', soon shortened to Wado-ryu; in 1944 appointed Japan''s Chief Karate Instructor. - In 1952 the Wado-ryu honbu was established at the Meiji University dojo, renamed Zen Nippon Karate Renmei in 1954; in 1965 he recorded his karate on film with Yoshiaki Ajari. - In 1980 stepped down from the Wadokai over a conflict; on 1 April 1981 founded the Wadoryu Karatedo Renmei, retiring after a few months in favour of his son Jiro (Hironori Otsuka II, followed by Kazutaka as III). - Hiroo Mochizuki is listed among notable Wado-ryu practitioners in the Wado-ryu Wikipedia article. - Otsuka is also referenced in the entry on Konishi Yasuhiro.'
