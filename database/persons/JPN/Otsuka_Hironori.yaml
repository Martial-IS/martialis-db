description:
  en: Japanese karate master, creator and first Grand Master of Wado-ryu karate. Held menkyo kaiden in Shindo Yoshin-ryu jujutsu under Nakayama Tatsusaburo, studied karate under Gichin Funakoshi from 1922 (one of his first promoted black belts, 1924) and later with Kenwa Mabuni and Motobu Choki, and merged Shindo Yoshin-ryu with Okinawan karate into Wado-ryu, registered with the Dai Nippon Butoku Kai in 1938.
