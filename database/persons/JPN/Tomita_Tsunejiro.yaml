    cite: Japanese Wikipedia - Tomita Tsunejirō
    quotation: >-
      富田 常次郎（とみた つねじろう、1865年3月22日（慶応元年2月25日） - 1937年1月13日）は、日本の柔道家（講道館7段・大日本武徳会柔道範士）。旧姓：山田。 青年期より講道館創始者の嘉納治五郎と寝食を共にし、同館で最初の入門者・初段位取得者となって講道館四天王の1人に数えられた。
    informationType: infotype:secondary
    supports: true
    evidenceType: evidencetype:direct
notes: 'Original surname Yamada, later adopted into Tomita family. First student of Jigoro Kano at Kodokan in 1882, first person to receive shodan rank in 1883. One of the "Kodokan Four Heavenly Kings" alongside Shiro Saigo, Yoshitsugu Yamashita, and Sakujiro Yokoyama. Son Tsuneo Tomita was author of "Sugata Sanshirō". Went to USA in 1904 with Mitsuyo Maeda as part of judo demonstration team invited by President Theodore Roosevelt. Founded Tokyo Sports Club in Akasaka, Tokyo. Promoted to 7th dan in 1927 and awarded Butokukai Hanshi title.

'
