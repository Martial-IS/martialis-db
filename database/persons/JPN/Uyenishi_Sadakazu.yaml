description:
  en: 'Japanese jujutsuka, professional wrestler and a celebrated figure of Edwardian London from 1900
    to 1908.

    One of the first Japanese jujitsu practitioners to both teach jujitsu and compete using the art outside
    Japan.

    His first martial art was kenjutsu; he then trained in jujitsu at the Osaka dojo of Yataro Handa,
    where Mataemon

    Tanabe taught. In 1900 he travelled to London at the invitation of E.W. Barton-Wright and joined Yukio
    Tani on

    the faculty of the Bartitsu Club. After the club closed (c. 1902) he taught at Pierre Vigny''s self-defence
    academy

    and, by 1903, opened his own dojo, the School of Japanese Self Defence, at 31 Golden Square, Piccadilly
    Circus -

    the first jujutsu dojo in the UK. In 1905, writing as "Raku" with the help of his student E.H. Nelson,
    he produced

    the Text-Book of Ju-Jutsu. He later taught hand-to-hand combat at Aldershot Military School and Shorncliffe
    Army Camp,

    and in 1907-8 undertook a highly successful tour of Spain, Portugal and other European countries performing
    exhibitions

    and challenge matches. He returned to Japan in late 1908, leaving the Golden Square school to his
    senior student

    William Garrud, and died some years before the Second World War. His students included William and
    Edith Garrud and

    Emily Diana Watts.

    '
notes: Handa's Daito-ryu jujutsu (from which Uyenishi held 2nd dan) is distinct from the Takeda Sokaku
  lineage represented by the Daito-ryu_aiki-jujutsu entry; the teacher edge and rank point at Handa Yataro's
  Daito-ryu jujutsu, founded at his Seibukan dojo in Osaka. The Handa dojo training and the Tanabe teaching
  connection rest on the peer-reviewed Brough (2020) article and the Wolf (2016) research article - the
  latter quoting the 1904 Health and Strength interview ("Uyenishi learned the art from Mr. Yataro Handa
  of Osaka"), dating the Handa dojo to 1897 (Sekiguchi-ryu-derived Daito-ryu), and noting Handa was Tanabe's
  sempai - with en/ja/es Wikipedia and the Bartitsu Society as apud. JA Wikipedia dates the Seibukan founding
  to 1878 (with an earlier Dojima practice hall attested for 1873-74), preferred over the Wolf/EN-Wikipedia
  1897 date. Rank attested only in ja-wikipedia; date unknown (before 1900). Gunji Koizumi reportedly
  once taught at Uyenishi's Golden Square school (ja-wikipedia). Gutiérrez/Rosa/Pérez (2010) give a precise
  birth date (1880-12-22) and a Lisbon Colyseu debut of 21 Dec 1907 - an A Bola-based earlier record suggested
  27 Dec 1907; the peer-reviewed paper is preferred. Callan/Heffernan/Spenn (2019) independently confirm
  the Osaka birth (1880) and add that Golden Square was co-run by Uyenishi (aka Raku) and Ohno Akitaro,
  and that Uyenishi passed ownership of the school to the Garruds in 1906. The same paper documents continued
  Portugal activity through Dec 1909 (Porto, Teatro Águia d'Ouro 19-29 Dec 1908; second Lisbon run 20
  Nov-25 Dec 1909), which undercuts the "returned to Japan in late 1908" phrasing in the description.
