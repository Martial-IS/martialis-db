description:
  en: Japanese kendo and iaido master (9th dan Hanshi in both) and aikidoka, one of Japan's top swordsmen and the top kendo student of Nakayama Hakudo. Entering the Yushinkan in 1930, he became Ueshiba's adopted son in 1932 through his marriage to Matsuko Ueshiba, taking the name Morihiro Ueshiba and training at the Kobukan; he left the Ueshiba family in 1937 over Oomoto-kyo differences. After the war he returned to Kagoshima, overcame a 1951 leg injury by developing the left jodan stance, won nine straight at the East-West Kendo Tournament, and taught kendo in Europe from 1969, helping found the European Kendo Federation. Georges Stobbaerts was his uchi-deshi in kendo and iaido.
  pt: Mestre japonês de Kendo e Iaido (9º dan, Hanshi em ambos) e aikidoca, um dos melhores espadachins do Japão e o melhor aluno de kendo de Nakayama Hakudo. Entrando no Yushinkan em 1930, tornou-se filho adotivo de Ueshiba em 1932 através do casamento com Matsuko Ueshiba, tomando o nome Morihiro Ueshiba e treinando no Kobukan; deixou a família Ueshiba em 1937 por divergências sobre o Oomoto-kyo. Após a guerra regressou a Kagoshima, superou uma lesão na perna em 1951 desenvolvendo a postura jodan esquerda, venceu nove consecutivas no Torneio de Kendo Leste-Oeste, e ensinou kendo na Europa a partir de 1969, ajudando a fundar a Federação Europeia de Kendo. Georges Stobbaerts foi seu uchideshi em Kendo e Iaido.
