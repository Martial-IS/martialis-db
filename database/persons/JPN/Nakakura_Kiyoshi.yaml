notes: Nakakura was born in Higashikushira, Kagoshima in 1910. He trained at the Daidokan Budo School in Kagoshima (1927-29) before entering the Yushinkan of Hakudo Nakayama in 1930. He served in the Imperial Guard from 1931. In 1932 he married Matsuko, daughter of Morihei Ueshiba, and was adopted into the Ueshiba family as Morihiro Ueshiba, living and training at the Kobukan until he left the family in 1937 over differences regarding the Oomoto-kyo religion; the succession passed to Ueshiba's birth son Kisshomaru. After the war he returned to Kagoshima, worked in agriculture, and from 1953 served in the Kagoshima prefectural police. A 1951 injury to his left ankle led him to develop the left jodan stance. He won nine straight bouts at the All Japan East-West Kendo Tournament, earning the nickname 'the ogre of the East-West tournament'. He participated in the kendo demonstration at the 1964 Tokyo Olympics (Olympedia). In 1969 he visited Europe for the first time, helping found the European Kendo Federation, and coached Japan at the 1970 World Kendo Championships. From 1992 an annual Brussels seminar, the 'Nakakura Cup', was held in his honour. He retired from practice in 1999 at 88 and died on 9 February 2000.
