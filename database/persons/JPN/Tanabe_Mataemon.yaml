description:
  en: >-
    Japanese jujutsu practitioner, fourth head of the Fusen-ryu school founded by Motsugai
    Takeda. His fame came from challenge-match wins over several Kodokan members - most famously
    Takisaburo Tobari in 1891 - and came to be considered one of the greatest modern jujutsuka.
    Nicknamed "Newaza Tanabe" and "Newaza no Tatsujin" for his mastery of ground techniques, he
    was also equally skilled in standing techniques. He was one of the twenty representing
    masters chosen in 1895 to open the jujutsu division of the Dai Nippon Butoku Kai, where he
    taught until his retirement in 1922. He declined to join the Kodokan; Kano incorporated his
    ground techniques into judo after seeing Kodokan experts struggle against him. He was the
    inspiration for the character Gennosuke Higaki in Tsuneo Tomita's Sanshiro Sugata novel
    series. Died in Osaka, 1942.
notes: Teacher recorded without a person reference (father Torajiro Tanabe, otherwise undocumented). Hoare's
  translation of the 1939 DaiNippon Judo-shi account ("Tanabe Mataemon Talks About His Fusen-Ryu Jujitsu")
  is treated as the authoritative account of Tanabe's life and is cited here wherever it overlaps with
  Wikipedia; it places his childhood training under his grandfather Takeda Sadaharu and confirms menkyo
  kaiden at 17, the 1890 Keishicho appointment, and the Kyoshi (1906) / Hanshi (1927) titles within the
  Dai Nippon Butoku Kai. The English Wikipedia article lists Miyake and Uyenishi as notable students and
  calls Tani "possibly-though unlikely"; the Fusen-ryu article lists both Miyake and Tani as the school's
  most known apprentices. Wikidata's death date matches EN Wikipedia (1942); the death place (Osaka) comes
  from EN Wikipedia and Hoare. Oimatsu (cited in Hoare) states that "Tani was a student of Tanabe Mataemon
  in Kobe".
