description:
  en: 'Japanese novelist, playwright and essayist, considered one of the most important stylists of the
    postwar

    Japanese language, and a committed physical-culturalist who pursued the samurai ideal of bunbu ryodo
    -

    the twin ways of the pen and the sword. Frail in youth, from September 1955 he rebuilt himself through

    systematic training that he never abandoned: weight training three times a week for the rest of his

    life, boxing under Nichidai coach Kojima Tomoo for about a year (1956-57), kendo from late 1958,

    reaching 5th dan, Omori-ryu iaido from November 1965 (2nd dan), and karate at the Japan Karate

    Association honbu dojo under chief instructor Nakayama Masatoshi from July 1967 (shodan, June 1970).

    He trained with the Ground Self-Defense Force in 1967 and formed the Tatenokai, a private militia
    of

    about a hundred students whose martial training he organised personally: jukendo testing during GSDF

    enlistment camps, weekly karate for his core members under Nakayama Masatoshi at the Japan Karate

    Association, and iai for the eight-man elite guard at the Saineikan, alongside guerrilla instruction

    by JSDF officers.

    An ultranationalist, he remains politically controversial in Japan; he died by seppuku at the Ichigaya

    headquarters on 25 November 1970 after a failed coup attempt.

    '
  ja: '戦後日本語文学を代表する小説家・劇作家・随筆家であり、文武両道を掲げて肉体鍛錬に打ち込んだ人物。1955年9月から生涯ボディビルを続け、1956年から約1年間は日大拳闘部の小島智雄の指導でボクシングを経験。1958年末から剣道を始めて五段に至り、1965年11月から居合（大森流、二段）、1967年7月から日本空手協会本部道場で中山正敏のもと空手を学び初段を取得した。1967年に陸上自衛隊へ体験入隊し、体験入隊での銃剣道、日本空手協会での中山正敏による空手、済寧館での居合など、隊員の武術訓練を自ら手配した民兵組織「楯の会」を結成。超国家主義者としてその政治的行動は現在も議論の対象であり、1970年11月25日に市ヶ谷駐屯地での決起の末、割腹自殺を遂げた。

    '
