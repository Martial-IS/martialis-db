description:
  en: Japanese aikido teacher (8th dan Aikikai, shihan) and direct student of Morihei Ueshiba who was one of the principal architects of the development of aikido in France and Europe. Entering the Aikikai Hombu Dojo as an uchi-deshi in 1953, he departed for France in 1964, succeeding Tadashi Abe as the Aikikai representative there, and served as National Technical Director of the FFAB until his death in 2010.
  pt: Professor japonês de aikido (8º dan Aikikai, shihan) e aluno direto de Morihei Ueshiba, foi um dos principais arquitetos do desenvolvimento do Aikido em França e na Europa. Tendo ingressado no Hombu Dojo do Aikikai como uchi deshi em 1953, partiu para França em 1964, sucedendo a Tadashi Abe como representante do Aikikai no país, e foi Diretor Técnico Nacional da FFAB até à sua morte em 2010.
