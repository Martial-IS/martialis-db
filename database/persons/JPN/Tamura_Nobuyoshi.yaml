notes: '- Tamura Nobuyoshi (田村信喜, 2 March 1933 - 9 July 2010) was a Japanese aikido teacher and direct student of Morihei Ueshiba.

  - Son of a kendo teacher; trained kendo and judo in his youth before entering the Aikikai Hombu Dojo as an uchi-deshi in 1953 (the Budo Japan article dates the entry to 5 August 1952).

  - A favored uke of Ueshiba, he served as otomo (assistant) on the founder''s 1961 trip to the Hawaiian Islands.

  - Departed for France in 1964, succeeding Tadashi Abe as the Aikikai representative there, and taught in France for about 45 years; National Technical Director of the FFAB (Fédération Française d''Aïkido et de Budo).

  - His dojo was the Shumeikan Dojo in Bras, France. He was naturalized as a French citizen.

  - Awarded the Chevalier de l''Ordre National du Mérite by the French government in 1999.

  - Former students include Luís Antunes (Portugal), Pierre Chassang, Toshiro Suga, Nebi Vural, Mickaël Martin, Jorge Rojo Gutierrez and Alain Peyrache.

  - Sources use slightly different kanji for the given name: 信喜 (article title) vs 信嘉 (in the article body); 信喜 is preferred.

  - In 1970 there was a falling-out with Georges Stobbaerts at the Budo Club du Maroc in Casablanca; Tamura was no longer invited by Stobbaerts, and when he returned to Morocco he taught with M''barek Alaoui and Emile Metzinger, who had left Stobbaerts to create the Syu do kan (Aikido Journal interview with Gérard Obellianne). The two-bloc division between Stobbaerts'' group and Tamura''s Aikikai group is also reflected in the FPA history of aikido in Portugal.

'
