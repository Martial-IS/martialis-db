description:
  en: Okinawan martial arts master (1860-1930), grandson and student of Matsumura Sōkon who continued
    the Matsumura family style of Shorin-ryu karate; his only student was his nephew Hohan Sōken, to whom
    he passed his menkyo kaiden.
notes: As Sōkon's grandson, Nabe received thorough training in the family style, including the secret
  White Crane system taught only to immediate family members. Per Soken's own 1978 interview (primary),
  Bushi Matsumura "left the 'hands' of his teachings" to Nabe on his death, and Nabe in turn "only learned
  from Bushi Matsumura and only taught me what he had learned" - Soken was his uncle's only student, as
  Nabe "would only teach or demonstrate for family members". The title "Nabe-tanmei" (tanmei = "respected
  senior or respected old man") is attested by Soken. His training methods, per Soken, included balance
  exercises on banana leaves, pine tree conditioning, and teaching the secret hakutsuru (white crane)
  kata only after ten years of training. The Moerfelden lineage page likewise calls Nabe the successor
  and "heir to the Matsumura Shorin Ryu" and Soken "probably his only long-time student".
