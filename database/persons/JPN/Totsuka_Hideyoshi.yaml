description:
  en: >-
    Ninth head of the Totsuka-ha Yōshin-ryū, eldest son and successor of Totsuka Hikosuke, the first
    Dai Nippon Butokukai hanshi (1903), who helped Kanō Jigorō devise the judo kata sanctioned by the
    Butokukai in 1906.
