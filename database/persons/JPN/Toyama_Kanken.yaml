description:
  en: >-
    Karate teacher, a student of Itosu Ankō like Funakoshi Gichin. In 1924 he moved to Taiwan, where he
    worked in an elementary school and studied some Chinese quanfa. In 1930 he returned to Japan and opened
    his dōjō, the Shūdōkan, where he taught Itosu's karate and some quanfa under the name Shurite. Yoon
    Byung-in and Yoon Kwe-byung studied under him.
notes: Began teaching Richard Kim kobudo in 1939, per the Kokusai Butokukai timeline - see Richard Kim.
  The Richard Kim source and Mönig name the same person by name only; no source joins the two accounts.
