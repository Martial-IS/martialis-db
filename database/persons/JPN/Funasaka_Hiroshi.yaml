description:
  en: Kendoka and owner of the Taiseido martial-arts bookshop in Shibuya, Tokyo; elder brother of the
    Omori-ryu iai master Funasaka Yoshio. He was Mishima's senior at the kendo dojo they both attended,
    and after Mishima wrote a laudatory preface to his wartime memoir Eirei no Zekkyo (Cries of the Heroic
    Dead, 1966), he let Mishima choose a sword from his collection in September 1966 - a blade attributed
    to Seki no Magoroku that Japanese Wikipedia records he had bought from Nakamura Yasuichiro for 50,000
    yen, though Christopher Ross's interviewee judged it a second-generation Kanemoto. The sword was used
    in the Ichigaya incident of 25 November 1970.
