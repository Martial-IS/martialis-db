description:
  en: Japanese aikido teacher (8th dan Aikikai, shihan) and direct student of Morihei Ueshiba, initiator
    of Kobayashi aikido. After studying at the Aikikai Hombu Dojo in Tokyo from 1946, he returned to Osaka
    in 1954 and became chief instructor for the Kansai region. From 1964 he taught aikido in Europe every
    year until 1996.
  pt: Professor japonês de aikido (8º dan Aikikai, shihan) e aluno direto de Morihei Ueshiba, iniciador
    do Kobayashi aikido. Após estudar no Hombu Dojo do Aikikai em Tóquio desde 1946, regressou a Osaka
    em 1954 e tornou-se instrutor-chefe da região de Kansai. A partir de 1964 ensinou Aikido na Europa
    todos os anos até 1996.
