notes: '- Kobayashi Hirokazu (小林裕和, 14 February 1929 - 28 August 1998) was a Japanese aikido teacher and
  direct student of Morihei Ueshiba.

  - From age 7 he studied karate, kendo and judo. At 15 he was stationed as a kamikaze pilot on an aircraft
  carrier; after his plane suffered a technical defect he survived the carrier being torpedoed and sinking.

  - Entered the Aikikai Hombu Dojo in 1946 with a recommendation letter from his karate teacher and studied
  under Ueshiba for about nine years; friendly with Morihiro Saito, with whom he shared the role of uke
  to Ueshiba (Kobayashi following with the sword).

  - Returned to Osaka in 1954; from 1957 taught full-time, including at universities in Osaka and Kobe;
  became chief instructor for Kansai in 1970 and served as Ueshiba''s uke on his visits.

  - Rank progression: 6th dan 1962, 7th dan 1964, 8th dan 1970 (Aikikai).

  - Sent by Ueshiba to teach in Europe from 1964; gave regular courses in France, Switzerland, Belgium,
  Italy, Germany and the Netherlands every year until 1996.

  - Initiator of Kobayashi aikido (国際合気道研修会小林裕和派). A member of the Aikikai Foundation, he did not want
  his own organisation until months before his death, when he allowed his students to found the Académie
  autonome d''aikido.

  - Per Guillaume Erard''s research, his connection to Takuma Hisa and Daito-ryu Aiki-jujutsu was brief
  and informal, not a formal study relationship.

  - Former students include André Cognard, Kimura Jiro (his successor in Japan), Tetsuro Nariyama, Misao
  Honda (who introduced aikido in Portugal at Kobayashi''s request) and Luís Antunes.

  - Died of sepsis on 28 August 1998.

  '
