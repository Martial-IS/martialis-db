description:
  en: Okinawan martial artist (1920-2016), founder of the Shorinkan school of Kobayashi Shorin-ryu; trained under Seiichi Iju, Choshin Chibana and Masami Chinen; designated an intangible cultural asset holder by Okinawa Prefecture.
notes: 'Nakazato trained in karate under Seiichi Iju from 1935 to 1940 in Osaka, and in kobudo (bo, sai, nunchaku, tonfa, nichokama) under Seiro Tonaki from 1936 to 1940. He joined the Japanese army in 1942, and after the war became a student of Chosin Chibana, helping him open the Dai Ichi Dojo in 1951 and receiving his shihan license in 1955. He opened his Nakazato Dojo at Aja near Naha in 1955, and resumed bojutsu under Masami Chinen (1955-1958). He was designated an intangible cultural asset holder by Okinawa Prefecture in 2000 and awarded the Order of the Rising Sun, 5th Class on November 4, 2007. Per the Shorinkan Family Karate history page, Chibana presented his personal black belt to Nakazato as his most influential student; Nakazato was awarded 9th dan by Chibana in 1967, became president of the Okinawan Shorin-Ryu Shorinkan Karate-do Kyokai after Chibana''s death in 1969, was promoted to 10th dan in 1980, and is credited with introducing the Gorin kata; the page also records the Ken Bunka Korosha Cultural Award (announced November 2, 2006, presented November 8, 2006) and the Order of the Rising Sun (November 4, 2007, the only martial artist among 960 recipients). The O.B.I. Karate School (Virginia Beach, via his student Noel Smith) confirms he created the Shorin-ryu Shorinkan association. Note: the Wikidata birth/death dates (14 Aug 1919 / 25 Aug 2016) differ slightly from the EN Wikipedia dates used here; the Shorinkan Family Karate page gives 1921.'
