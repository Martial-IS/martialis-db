description:
  en: Ryukyuan politician and tōde (karate) practitioner (1839-1910), student of Matsumura Sōkon, steward
    to the Ryukyuan king and later to the Shō family; father of Chōtoku Kyan.
notes: Chōfu Kyan belonged to the Kyan clan of Shuri court officials (Shō-shi Kyan Tunchi, 11th generation).
  He served as sanseikan (councillor) during the Ryukyu Kingdom period, went to Tokyo in 1873 as part
  of the congratulatory embassy, and after the dissolution of the han served the former king Shō Tai as
  his steward (kafu), accompanying him to Tokyo and living in the Sho family residence. He studied tōde
  under Matsumura Sōkon. The Seibukan official history describes him as a distinguished politician active
  from the end of the Ryukyu Kingdom into the Meiji era, "a man of both martial and literary cultivation"
  (文武両道にたけた高潔な人格者), also known as a karateka of Matsumura's school, and records that he gave his son Chōtoku
  his first karate instruction. Geoffrey Gaudion likewise describes him as excellent in Chinese classics,
  Japanese arts and lettering, and an "excellent karateman", who asked three masters (Matsumura Sokon,
  Anko Itosu and Pechin Oyadomari) to teach his son "not because he could not do so himself, but because
  he loved his son too much to be severe in karate exercises", training the boy in sumo and karate wrestling
  outdoors on cold winter days. He was adopted into the Kyan family from the Motonaga branch of the Motobu
  Udun.
