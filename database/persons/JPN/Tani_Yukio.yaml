description:
  en: 'Pioneering Japanese jujutsu and judo instructor and professional challenge wrestler, one of the first jujutsu

    stylists to teach and compete outside Japan. Early training in Japan was tied to his father, a Tenjin Shinyo-ryu

    master; he is rumored to have studied with Mataemon Tanabe and had some training in Yataro Handa''s Seibukan school

    in Osaka. In 1900 the nineteen-year-old travelled to London at Barton-Wright''s invitation and, with Sadakazu

    Uyenishi, staffed the Bartitsu School of Arms; he then pioneered the music-hall challenge circuit under William

    Bankier. From 1918 he was the first professional jujutsu teacher at Gunji Koizumi''s Budokwai, where Jigoro Kano

    awarded him 2nd dan judo in 1920 (eventually 4th dan). His leading student Masutaro Otani founded the MOSJ, which

    evolved into the British Judo Council. Died in London, 24 January 1950.

'
  ja: 日本の柔術・柔道の先駆者およびプロの挑戦レスラー。海外で教鞭をとり、試合を行った最初期の柔術家の一人。1900年、バートン＝ライトの招きでロンドンに渡り、上西貞一とともにバーティツ学校の講師を務めた。1918年から小泉軍治の武道会で初のプロ講師となり、1920年には嘉納治五郎から柔道二段を授与された。1950年1月24日、ロンドンにて死去。
notes: 'Tani''s early jujutsu training was heavily tied to his father, a Tenjin Shinyo-ryu master whose name is not given in the sources; teacher unidentified, kept as prose only. The Tenjin Shinyo-ryu and Fusen-ryu associations are contested/unclear in the sources, hence low confidence - see individual entries. The Handa teacher edge points at Handa Yataro and his Daito-ryu jujutsu at the Osaka Seibukan; JA Wikipedia records Tani as a 2nd dan student of that school. Tani''s Handa training is cited in the 1904 Jewell interview (via Wolf 2016) and the peer-reviewed BJS paper (Brough et al. 2023), but judo historian Oimatsu, per Wolf 2016, places Tani with Tanabe Mataemon at the Senbukan in Kobe - the edge is thus close to disputed and kept as possible. Arrival in Britain: Richard Bowen''s research (per Noble 2000) dates it to September 1900 against Tani''s own "26 September 1899"; the peer-reviewed Callan/Heffernan/Spenn (2019) article independently gives September 1899, so the 1899 reading now has two scholarly backers. Noble dates the stroke to 1936 whereas Wikipedia gives 1937.'
