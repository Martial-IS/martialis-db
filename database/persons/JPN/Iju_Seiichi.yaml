description:
  en: Okinawan martial artist, Shito-ryu karate student of Shinpan Gusukuma, dojo owner in Osaka, and
    first teacher of Shūgorō Nakazato (1935-1940).
notes: 'Iju studied Shito-ryu karate as a student of Shinpan Gusukuma and had a dojo in Osaka, Japan.
  He was the first teacher of Shugoro Nakazato (1935-1940), who then became a student of Chosin Chibana.
  The version of the Gojushiho kata practiced in Shorin-ryu Shorinkan is credited to Iju and his lineage,
  known as "Iju Gojushiho": the Piemonte study states Gusukuma handed down two versions of the kata, the
  longer one transmitted by Iju and similar to the version of Chozo Nakama; the Iha article on Gusukuma
  confirms Iju taught Nakazato the kata Gojushiho. Birth/death dates are unknown; the Gojushiho lineage
  article estimates Iju was not born before 1900 (he was a student of Gusukuma, b. 1890, and is never
  mentioned as a student of Anko Itosu).'
