description:
  en: Spanish judo pioneer; first Spanish black belt (Kodokan 1st dan, 22 July 1954, Ichiro Abe); trained
    under Alfredo San Bartolomé (1948–1957) and Kawaishi Mikinosuke (green belt 1952, brown belt 1953);
    founded Gimnasio Samurái (1958); disseminated judo into state institutions and Real Madrid; published
    Cinturón Negro de Judo (1971); awarded 7th dan posthumously by RFEJYDA; traveled to France to study
    Kawaishi's method; connected to Haku Michigami via trips from Madrid to Bordeaux.
notes: 'Fernando Franco de Sarabia Jim (?-1988). Began sport 1944 (gymnastics), dedicated to judo from
  1948. Part of founding core of judo in Madrid under San Bartolomé. Trained with Kawaishi in France.
  Key figure in early Spanish judo. Traveled to Bordeaux on Lambretta to train with Master Japanese Michigami.
  Source: Olimpiaduerme blog (2015-10-02) announces him as first Spanish black belt; RFEJYDA newsletter
  (2022-10-28) provides comprehensive biography; Judo en Familia bio page records his dan grades and teaching
  role.'
