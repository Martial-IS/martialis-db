notes: >-
  Studied judo under Kunisaburo Iizuka at Keio University (1918-1919); 4th dan by 1927. Introduced
  to Katori Shinto-ryu by Jigoro Kano in 1927. The Katori training is recorded under the four
  dispatched shihan (Tamai, Kuboki, Ito, Shiina), not Iizasa Morisada, the 18th Soke: Mochizuki's
  1987 interview records that Morisada died in 1897 without a male heir. Met Morihei Ueshiba around
  1931-1932; aikido teaching license in 1935. Studied Yoshin Koryu under Genro Kanaya from around
  1928, reaching kyoshi level by 1938. Sword instruction for Kurosawa's Seven Samurai, Hidden
  Fortress and Yojimbo, and Inagaki's Samurai Trilogy.
