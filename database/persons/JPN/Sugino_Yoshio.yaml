description:
  en: Yoshio Sugino (杉野嘉男) was a Japanese martial artist and film choreographer. He was a direct student of Morihei Ueshiba (Aikido), Kunisaburo Iizuka (Judo), and masters of Katori Shinto-ryu. He is also known for providing sword instruction for Akira Kurosawa's film 'Seven Samurai', amongst others.
