description:
  en: >-
    Judo teacher and kata instructor, head coach of the Ármann judo club in
    Reykjavík for over 25 years. Formerly on the staff of the Kodokan
    International Department and a teacher at Kanazawa University.
notes: >-
  THere's quite a bit of information scattered, but nothing
  conclusive... adding the breadcrumbs here.
  AJJF interview (p. 1): started judo at 10 at 大道塾 宇佐美道場,
  Kawaguchi, and studied at 東京教育大学 (Tokyo Higher Normal School
  record), in its last cohort (so about 1973-1977); no instructors
  named, so no teacher claim. Ármann podcast ep. 1
  (https://open.spotify.com/episode/4IqlNMqw1a6ZafeXffPgOO) describes
  the first club as "very small judo club, 28 tatamis" with an unnamed
  "old 8th dan" teacher. Judo club adviser (柔道部の顧問) 中村良三
  recommended him for Iceland, where he replaced his senior (先輩) 村
  田直樹; in the podcast he is "my teacher at the university". Neither
  source says he taught Iura judo, and little is known of him, so no
  record or teacher claim. KAKEN lists a 中村良三 as a Tsukuba
  professor (2004-05) researching judo weight loss; probably him,
  unconfirmed. Not Ryozo Nakamura of Ohio (1930-1992, in the US from
  1967). Podcast ep. 5
  (https://open.spotify.com/episode/0WmIlgFeNLndm5pZ8HlfZc): Nobuyuki
  Sato (probably 佐藤宣践) was a close friend of this university
  teacher. The profile gives出身：埼玉県 (origin, not birthplace). The
  embassy flyer (2020) names Sveinbjörn Jun Iura, Icelandic judo
  champion, as his son. The BJA (2024) gives the decoration as for
  developing judo outside Japan; the embassy gives service to the
  embassy (日本国在外公館業務功労). Ármann podcast "Interview with
  sensei Mr. Yoshihiko Iura"
