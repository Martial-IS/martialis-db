description:
  en: 'Japanese Daitō-ryū aikijūjutsu master and representative instructor (kyōju dairi) under founder
    Takeda Sōkaku. He introduced Morihei Ueshiba, founder of aikidō, to Takeda in 1915. After World War
    II he taught Daitō-ryū in Tokyo, training students including Masutatsu Oyama, Richard Kim, and Choi
    Yong-sul.

    '
  ja: '大東流合気柔術の師範で、開祖・武田惣角のもとで教授代理を務めた。1915年に合気道創始者の植芝盛平を武田に紹介した。戦後は東京で大東流を指導し、大山倍達、リチャード・キム、崔龍述らを教えた。

    '
