description:
  en: Okinawan Shorin-ryu karate master (1910-1994), founder of the Kyudokan school, Hanshi 10th dan; studied under Jiro Shiroma, Jinnan Shinzato, Seiei Miyahira and Choshin Chibana; politician and Naha City Council member.
notes: Higa began training under Jiro Shiroma in 1927 (Shuri-te, for six years according to the Shuriway biography, which also names Jinnan Shinzato of the Naha-te school - a disciple of Chojun Miyagi - and Seiei Miyahira as his teachers after Shiroma's death in 1933), and began studies under Choshin Chibana in 1948 (the Shuriway biography gives 1943 for meeting Chibana and says he became Chibana's main pupil, receiving the first Hanshi 9th dan conferred by Chibana in 1965). He received the rank of Hanshi 10th dan in 1976. He founded the Kyudokan dojo (1947 per Shuriway; 1954 per the Budo Japan interview with his nephew Higa Minoru - both dates kept here). He served as first vice-president of the Okinawa Shorin-ryu Karate-do Association (1961), president of the Okinawa Prefecture Karatedo Federation and the All Okinawa Karatedo Federation (of which he was third president), and was a politician who served as a Naha City Council member and chair of the Naha City Council on eight successive occasions. The Kata Step by Step article on Chibana states Higa adhered to the principle that "the teacher is more important than the style" and remained Chibana's disciple until his death. His student Minoru Higa is recorded on Wikidata (P802).
