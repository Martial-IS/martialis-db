description:
  en: Antonio Inoki (1943–2022) was a Japanese professional wrestler, martial artist, and politician. He founded New Japan Pro-Wrestling in 1972 and fought Muhammad Ali in the 1976 wrestler-vs-boxer match that paved the way for modern MMA. He trained Satoru Sayama (the original Tiger Mask) and was a key figure in the development of shoot wrestling and mixed martial arts in Japan. He was also elected to the Japanese House of Councillors and negotiated the release of Japanese hostages in Iraq.
  ja: アントニオ猪木（1943–2022）は、日本のプロレスラー、武術家、政治家。1972年に新日本プロレスを創設。1976年のモハメド・アリ戦は総合格闘技の先駆けとなった。佐山聡（初代タイガーマスク）を育成し、シュートレスリングと総合格闘技の発展に貢献。参議院議員も務め、イラクの人質解放にも尽力した。
