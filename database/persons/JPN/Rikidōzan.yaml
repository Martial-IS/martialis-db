description:
  en: Rikidōzan (1924–1963), born Kim Sin-rak, was a Korean-born Japanese professional wrestler and the
    'Father of Japanese Professional Wrestling'. Initially a sumo wrestler, he founded the Japan Pro Wrestling
    Alliance in 1953 and became Japan's first post-war hero by defeating American wrestlers. He trained
    Antonio Inoki, who later founded New Japan Pro-Wrestling. Rikidōzan was stabbed by a yakuza member
    and died in 1963 at age 39.
  ja: 力道山（1924–1963）は、朝鮮出身で日本に帰化したプロレスラー。「日本プロレス界の父」と呼ばれる。元大相撲関脇からプロレスに転向し、1953年に日本プロレス協会を設立。空手チョップを武器にアメリカ人レスラーを次々と破り、戦後日本の英雄となった。アントニオ猪木を育成。1963年に刺殺された。
