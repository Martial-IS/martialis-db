description:
  en: Okinawan karate master (1945-2012), son of Shoshin Nagamine and second sōke (head) of the Matsubayashi-ryu
    karate system from 1997; founder of the World Matsubayashi-ryu Karate-do Association (WMKA).
notes: Takayoshi commenced Matsubayashi-ryu training under his father at age six. At his father's direction
  he went to the United States in the late 1960s at age 20, staying over 10 years and opening a dojo in
  Cincinnati, Ohio, and returned to Okinawa in 1979 to assist his father with the World Honbu Dojo. In
  1991 his father retired and passed the leadership to him; in 1992 he formed the World Matsubayashi-ryu
  (Shorin-ryu) Karate-do Association (WMKA), and in 1997, after his father's death, took the position
  of second sōke. He was promoted to Hanshisei 10th dan in October 2008. He also served at times as a
  Naha City Councilman and a Criminal Investigator for the United States Marine Corps. The Blitz Magazine
  article (December 2012, interview during his Australia visit) confirms his birth in Naha in August 1945,
  karate from age six as the son of the founder (named a living intangible cultural asset by Japan), the
  Hanshisei 10th dan rank, over 10 years teaching in the Ohio region of the US, and the WMKA leadership,
  and records his explanation of the five fundamentals philosophy. The WMKA memorial page notes his last
  visit to Florida in 2011. The Kodokan Cummings dojo in Canberra (his student Reece Cummings) records
  time as a live-in uchi-deshi with him in Okinawa.
