description:
  en: One of the two leading authorities in early Shōwa kendo (alongside Nakayama Hakudo), known as "昭和の剣聖" (Shōwa's Sword
    Saint). Trained in Nakanishi-ha Ittō-ryū from his grandfather Takano Sakichirō, then studied under Yamaoka Tesshu. Served
    as a gekken instructor for the Tokyo Metropolitan Police from 1886, then transferred to the Saitama prefectural police as
    martial-arts instructor in 1888, rising to keibu. Founded the Meishinkan
    dojo in Urawa (1890) and later Shudogakuin (1918). Lecturer, then (from 1916) professor, at Tokyo Higher Normal School
    (1908–1936), where he implemented the dan and kyu ranking system for kendo. Served on the Dai-Nippon Teikoku Kenjutsu
    Kata Committee (1911–1912), producing the ten-form Dai-Nippon Teikoku Kenjutsu Kata ratified by the Butokukai on 16
    October 1912. Awarded the title of hanshi by the Butokukai in 1913, and Junior Fourth Rank and the Order of the Sacred
    Treasure, 4th class, in 1936. Author of the influential kendo textbook 剣道 (1915). Posthumously inducted into the All
    Japan Kendo Federation's Kendo Hall of Fame (2003).
notes: >-
  Birth date: Japanese Wikipedia gives 文久2年6月13日 (lunisolar) = 1862-07-09 Gregorian. Wikidata
  (Q1713377) records 1862-06-28; the 1955 Chichibu Shrine monument inscription gives 文久二年六月二日. Not
  resolved. Kata at age 5 before the Oshi domain lord: ja.wikipedia and the monument give 56
  (組太刀56本); kenshi247 gives 50; 56 is preferred. His son Takano Hiromasa (弘正, 1900-1987) inherited
  Nakanishi-ha Ittō-ryū and was a kendo hanshi.
