description:
  en: >-
    Mito-domain swordsman of the Hokushin Ittō-ryū, born into the Ichige family. Entered the Mito Tobukan
    at 12 (1874) under Kozawa Torakichi - kirigami at 14, mokuroku at 18 - and trained at Sakakibara
    Kenkichi's dojo in Tokyo for a year (1883-1884) before a country pilgrimage. In 1881, at 19, adopted
    into the Naitō family. Joined the Keishichō in 1888 and later opened the Yōshinkan dojo in Tokyo and
    served as gekiken shihan of the Tōkyō Senmon Gakkō (Waseda). One of five kendo teachers named for the
    Butokuden in Kyoto in 1899, where he served until his death and was chief kendo professor of the
    Bujutsu Kyōin Yoseijo, later the Budo Senmon Gakko, 'Waza Monna, Ki Takaharu' alongside Monna Tadashi.
    Chief commissioner of the 1911 Dai-Nippon Teikoku Kenjutsu Kata; opposed kendo's sportification and
    the 1929 Tenran shiai, died before it was held.
  ja: >-
    北辰一刀流の剣道家。水戸藩士・市毛家の六男として生まれる。12歳で小澤寅吉の東武館に入門（14歳で切紙、
    18歳で目録）、1881年内藤儀左衛門の養嗣子となる。1883年上京し榊原鍵吉の道場で一年修行。1888年警視庁に入庁。
    1899年京都の武徳殿に五教授の一人として奉職、武術教員養成所（のち武道専門学校）の剣道主任教授を務め、
    「西の内藤、東の高野」と言われた。1911年大日本帝国剣道形制定の主査委員。競技化を嫌い切り返し・掛かり稽古
    を徹底指導、昭和天覧試合に反対し、開催直前に脳出血で急死。
