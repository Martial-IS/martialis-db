notes: >-
  Licenses at the Tobukan - kirigami at 14 (c.1876), mokuroku at 18 (c.1880)
  (JA wiki Naitō) - not modeled: the Menkyo rank-grade vocabulary has no kirigami/mokuroku tokens, and the
  JA wiki records no menkyō for Naitō. Junior Sixth Rank (従六位) appears only in the JA wiki infobox
  awards, without a footnote - left here pending a source. kenshi247 (Finding Naito, 2020) gives the
  birth as 'the 25th of September in 1862', which does not match the JA wiki's 文久2年10月25日（旧暦）
  = 1862-12-16 (the JA wiki's own Gregorian conversion, matching EN wiki and the prior database value);
  treated as a kenshi247 transcription slip. 1901 Butokusai draw (1-1) with Takano Sasaburō, shinpan
  Mihashi Kan'ichirō (JA wiki Naitō; kenshi247 2012).
