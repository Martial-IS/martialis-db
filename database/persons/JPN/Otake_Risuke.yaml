notes: 'Japanese martial artist born in Narita, Chiba. Entered Tenshin Shōden Katori Shintō-ryū in 1942
  at age 16 as disciple of Hayashi Yazaemon. Received gokui kaiden (highest level) in 1967 at age 42,
  becoming the school''s teaching master. Designated guardian of the tradition when Katori Shinto-ryū
  was recognized as Intangible Cultural Asset of Chiba Prefecture in 1960. Authored several books including
  ''The Deity and the Sword: Katori Shinto-ryu'' and ''Strategy and the Art of Peace''. Member of Chiba
  Prefecture Board of Registrars and Appraisers for Muskets and Swords since 1979. Provided martial arts
  instruction for film ''The Chronicle of the Higurashi'' (蜩ノ記). Died on 7 June 2021.'
