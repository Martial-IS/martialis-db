description:
  en: Yorinaga Nakamura (born 1963) is a Japanese martial arts instructor and former Shooto champion.
    He trained under Satoru Sayama at the Tiger Gym, won the first Shooto tournament in 1986, and later
    studied under Dan Inosanto in the US. He founded the USA Shooto Association and IUMA Japan, and is
    the highest ranked Shooto instructor worldwide certified by Sayama.
  ja: 中村頼永（なかむら よりなが、1963年12月19日 - ）は、三重県出身の日本の武術家。佐山聡のタイガージムで修斗を学び、1986年に第1回修斗トーナメントで優勝。その後渡米しダン・イノサントに師事。USA修斗およびIUMA日本振藩國術館を設立。佐山聡公認の世界最高位修斗インストラクター。
