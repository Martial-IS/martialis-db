description:
  en: 'Morimoto Tokumi was a former samurai of the Tosa/Yamauchi clan and a Shihan of the Goto-ha branch
    of

    Musō Jikiden Eishin-ryū. He received Menkyo Kaiden in Musō Jikiden Eishin-ryū from Gotō Magobei

    Masasuke, making him a contemporary of Ōe Masamichi. He was one of two teachers who accepted

    Nakayama Hakudō as a student of Tosa Eishin-ryū in 1916, and Nakayama received Menkyo Kaiden in

    Goto-ha Muso Jikiden Eishin-ryū from Morimoto in 1922.

    '
