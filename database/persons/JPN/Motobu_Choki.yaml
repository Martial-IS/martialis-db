description:
  en: Okinawan karate master (1870-1944) and founder of Nihon Denryu Heiho Motobu Kenpo (Motobu-ryu),
    born into the royal Motobu Udundi family; studied under Ankō Itosu, Matsumura Sōkon, Sakuma and Kōsaku
    Matsumora, and became famous in mainland Japan after defeating a foreign boxer in Kyoto at age 52.
notes: 'Motobu was born into the Motobu Udundi, a cadet branch of the Ryukyuan royal family descended
  from Sho Shitsu''s sixth prince, Motobu Prince Chōhei. At age 12 (kazoe) he and his elder brother Chōyū
  were taught karate by Ankō Itosu, hired as a tutor at the Motobu Udundi, studying primarily under Itosu
  for seven or eight years (Naihanchi and Channan); always losing to the five-years-older Chōyū in kumite,
  he secretly continued under Matsumura Sōkon and Sakuma Pechin - Matsumura, himself Itosu''s teacher,
  was described by Motobu as without equal among recent Tode masters - and from age 19 or 20 studied under
  Kōsaku Matsumora, especially irikumi; the Motobu-ryu official history records Matsumora''s praise of
  Motobu''s martial talent (Ryukyu Shimpo, Showa 11). He was nicknamed "Motobu no Saru" ("Motobu the Monkey",
  or "Saru Gomen"). He engaged in countless kake-dameshi at the Tsuji pleasure quarter and, by 24 or 25,
  his fame was known across Okinawa. After a business failure he moved to mainland Japan around 1921;
  in November 1922, in Kyoto, he jumped into a boxing-vs-judo exhibition and knocked out the foreign boxer
  with one blow at age 52 (the WEB Hiden profile describes a Russian boxer knocked out in round two with
  a kosa one-knuckle strike). The match was covered in King magazine (September 1925 issue), the first
  magazine in Japan to sell over a million copies, making Tode known nationwide. In 1923 he opened a dojo
  in Shikanjima, Osaka, demonstrated at Mikage (Hyogo), and formed the Tode-jutsu Fukyukai. In May 1926
  he published Okinawa Kenpo Tode-jutsu Kumite-hen, the oldest kumite book in karate history, containing
  the twelve yakusoku kumite known as the "Choki twelve". In 1927 he moved to Tokyo, where Konishi Yasuhiro
  organized the Motobu Choki Support Society; he became first shihan of the Toyo University karate club
  (1929) and first shihan of the Waseda University karate club (1930), and in 1929 Ōtsuka Hironori became
  his student. Around 1930 he established the Daidokan at Koishiki Haramachi (now Hakusan, Bunkyo) - the
  first formally named karate-only dojo in Japan, named after the zen saying "daido munmon" (the great
  way has no gate). Nagamine Shoshin also studied under him there. In 1932 he published his second book,
  Watashi no Todejutsu, with full sequence photographs of Naihanchi and warnings against the corruption
  of kata; the champion boxer Piston Horiguchi visited the Daidokan and was shown his punches all deflected
  while Motobu wore only a dotera. He was known for emphasizing Naihanchi - "he knows no other kata" was
  said of him - but he also taught Passai, Seisan and the Hakugyoku kata. He returned to Okinawa in 1936,
  attending the Ryukyu Shimpo "Roundtable of Karate Masters" on October 25, 1936 (the day later designated
  "Karate Day" in 2005) and granting an exclusive "Jitsusen-dan" interview on November 7; JA Wikipedia
  dates this return to 1937. He closed the Daidokan in 1941 and, after a stay in Osaka, returned to Okinawa
  for good in 1942, dying in April 1944 at 74; his grave is in Kaizuka, Osaka Prefecture. In his later
  years he resumed the practice of kenjutsu and bojutsu. He named his style Nihon Denryu Heiho Motobu
  Kenpo (日本伝流兵法本部拳法), commonly known as Motobu-ryu; his son Chōsei heads the Motobu-ryu. Students recorded
  by JA Wikipedia include Marukawa Kenji, Nakata Mizuhiko, Takano Genjuro, Higashionna Hiroshi, Sodeyama
  Toyosaku (Shindo Jinen-ryu), Ueshima Sannosuke (Kushin-ryu), Miyahira Katsuya (Kobayashi-ryu) and Nakama
  Chomo; guest students included Ōtsuka Hironori, Konishi Yasuhiro and Nagamine Shoshin. Note: the birth
  date used here is the solar date May 5, 1870 (Meiji 3, 4th month, 5th day by the lunar calendar), per
  the Motobu-ryu official history and JA Wikipedia; EN Wikipedia uses the lunar date April 5, 1870 directly.'
