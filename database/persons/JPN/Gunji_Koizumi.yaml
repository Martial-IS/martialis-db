description:
  en: Japanese judoka and jujutsuka. Founder of the Budokwai (1918), known as the 'Father of British Judo.'
    Studied Tenjin Shinyo-ryu under Nobushige Tago, later Shin-Shin-Ryu under Yamada Nobukatsu and Akishima-Ryu
    under Akishima Tsunejiro. Converted to Kodokan Judo in 1920 under Jigoro Kano. Co-founded the British
    Judo Association (1948) and European Judo Union (1948). Author of 'My Study of Judo' (1960). Held
    8th dan Kodokan.
notes: Death officially recorded as 15 April 1965; Callan (2011) gives 14 April. 8th dan awarded 17 November
  1962 per Japanese sources (Kudo 1965); some Western sources suggest posthumous promotion.
