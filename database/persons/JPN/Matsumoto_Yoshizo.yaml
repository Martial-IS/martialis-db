description:
  en: Japanese judoka and educator, born 1914. A teacher of judo at Tokyo Higher Normal School and later
    a professor at Tokyo Education University, he was the mentor of Ichiro Abe and, as the person who
    single-handedly handled the Kodokan's international negotiations before an international department
    existed, offered Abe the posting to France in 1951. Author of judo coaching works.
