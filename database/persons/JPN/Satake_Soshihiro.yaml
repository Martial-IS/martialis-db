notes: Soshihiro Satake was a Japanese-born Brazilian martial artist and teacher. He started as a sumo
  wrestler before joining the Kodokan dojo academy in May 1892. He graduated from Waseda University in
  1904 and was a member of the Ten'gu Club sports social group. Together with Mitsuyo Maeda, he formed
  the head of the second generation of Kodokan judoka. In 1904, he traveled to the United States with
  Tsunejiro Tomita and Maeda, arriving in New York City on December 8, 1904. He traveled extensively throughout
  the Americas and Europe, including Cuba where he was known as one of the 'Four Kings of Cuba' along
  with Maeda, Akitaro Ono, and Tokugoro Ito. He settled in Mexico for a time, teaching judo at military
  academies and establishing a sock manufacturing business in Mexico City. He returned to Japan in 1934
  and died on May 11, 1936, at approximately 55 years of age. His grave is at Rinsen-ji temple in Aoyama,
  Tokyo. He is considered one of the primary founders of Brazilian jiu-jitsu and pioneered judo in Brazil,
  the United Kingdom, and other countries.
