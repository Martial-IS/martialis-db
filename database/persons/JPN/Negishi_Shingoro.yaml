description:
  en: 'Negishi Shingorō (1844-1913) was a samurai from Nagaoka Domain and the 6th and last Edo-period

    headmaster of Shindō Munen-ryū kenjutsu. He opened the Yūshinkan dojo in Tokyo in 1885 and taught

    swordsmanship to the Tokyo Metropolitan Police Force. A participant in the Boshin War and survivor

    of the Battle of Hokuetsu, he was declared Hanshi of Shindō Munen-ryū by the Dai Nippon Butokukai

    in 1906 and served on the committee that created the Dai Nippon Teikoku Kendo Kata in 1912. His most

    famous student was Nakayama Hakudō, whom he also adopted as his son.

'
