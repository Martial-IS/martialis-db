description:
  en: Okinawan karate master (1870-1945), third son of court official Chōfu Kyan; studied under Matsumura
    Sōkon, Kōkan Oyadomari and Kōsaku Matsumora, and had a large influence on Shorin-ryu and related styles;
    a participant in the 1936 meeting of Okinawan masters where the term "karate" was standardized.
notes: Kyan studied under Matsumura Sōkon from age 16 for two years; afterwards he moved to Tokyo with
  his father into the circle of the former king Shō Tai, and after returning studied Tomari-te with Kōsaku
  Matsumora and Kōkan Oyadomari (probably around age 20, though the sources disagree on the chronology).
  The Seibukan official history (of student Shimabukuro Zenryo) records that Kyan received his first karate
  instruction from his father at Meiji 8 (1875) and from the age of 16 learned the Seisan and Gojushiho
  kata from Matsumura Sokon through his father, then at 20 studied under Matsumura (Shuri-te) and Oyadomari
  (Tomari-te); it also gives the Kyan family descent from Shosei King's tenth prince, Haneji Prince Chomu,
  Kyan's study of Chinese classics at the Nisshisha school in Tokyo from age 12, and his later teaching
  around the Hija River from age 38. Geoffrey Gaudion's account adds that Kyan's father asked three masters
  - Matsumura Sokon, Anko Itosu and Pechin Oyadomari - to teach his son (the Itosu connection appears
  only in this source). His father Chōfu, himself a student of Matsumura Sōkon, possibly taught Kyan tegumi
  in his early years. Kyan was small and asthmatic with poor eyesight, nicknamed Chan Migwa ("squinty-eyed
  Chan"). Tatsuo Shimabuku and Zenryō Shimabukuro trained with him for over 10 years each.
