description:
  en: Shindo Muso-ryu jojutsu teacher, considered the 25th and last (unofficial) headmaster of the school,
    who spread jodo internationally. Jigoro Kano arranged for Minoru Mochizuki to study Shindo Muso-ryu
    jojutsu with him in 1930, alongside the studies Kano arranged with Morihei Ueshiba and Hakudo Nakayama.
