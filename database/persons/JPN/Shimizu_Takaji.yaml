notes: The Dragon Magazine and Karaté-Bushido interviews render the jo teacher's name as 'Koji Shimizu',
  but the Japanese Wikipedia article on Mochizuki Minoru records the teacher of Shindo Muso-ryu jojutsu
  as 清水隆次 (Shimizu Takaji), the well-documented 25th and last (unofficial) headmaster of Shindo Muso-ryu
  (1896-1978). 'Koji' in the interviews is therefore treated as a misrendering of 'Takaji'; the name 'Shimizu
  Koji' is kept as an aka for traceability.
