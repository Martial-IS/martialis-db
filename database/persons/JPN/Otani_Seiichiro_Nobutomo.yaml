description:
  en: Jikishin Kage-ryū master of the late Tokugawa period and head of the Kōbusho, the shogunate's
    military academy. Taught Sakakibara Kenkichi, awarded him a teaching licence in 1856 and recommended
    him for a post at the Kōbusho. The Otani-ha branch of Jikishin Kage-ryū is named after him.
