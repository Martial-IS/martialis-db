notes: '3rd generation headmaster (宗家三代目) of Tenjin Shinyo-ryu. Adopted son of previous headmaster Iso
  Masatari Mataemon. Also known as Matsunaga Seizaemon (松永清左衛門). Described as short and thin (短身痩躯). Teacher
  of Jigoro Kano (嘉納治五郎), Inoue Keitaro (井上敬太郎), and others. Buried at Ryogen-ji Temple in Matsugaya,
  Taito Ward, Tokyo.

