description:
  en: >-
    Edo-period jujutsu master of the Yōshin-ryū (Totsuka-ha), jujutsu instructor at the shogunate's
    Kōbusho from 1860; his school, later in Chiba, was regarded before the Meiji restoration as among the
    strongest in Japan. Father and predecessor of Totsuka Hideyoshi.
