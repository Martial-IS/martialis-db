notes: 'Organizational figure rather than a martial artist - the Japanese Wikipedia notes explicitly that
  Risei never actually learned judo (自身は実際に柔道を学んだことはない). No dan grade is recorded for him. His career:
  graduate of Kokugakuin University; served at the Imperial Household Agency (宮内省図書寮御用掛) before becoming
  a Kodokan director; succeeded Nanjō Jirō as 3rd Kodokan head in November 1946 upon the latter''s resignation
  through illness, serving until 1980; first president of the All Japan Judo Federation from 1949 until
  1980; IJF president from 1952 until 1965 (one Japanese account, 『柔道界のデスマッチ』, claims the 1965 resignation
  was a forced ouster). Successfully campaigned to have judo made an official Olympic sport for the 1964
  Tokyo Games. His eldest son Kanō Yukimitsu later served as Kodokan head and All Japan Judo Federation
  president. The encyclopedic infoboxes describe him as president of the Kodokan and of the Japanese judo
  federation, a shorthand for these roles in the December 1951 awarding of de Herdt''s 4th dan.

  '
