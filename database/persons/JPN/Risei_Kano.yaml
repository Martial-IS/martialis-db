description:
  en: 'Japanese judo administrator, second son of Kanō Jigorō, the founder of judo. Never practiced judo
    himself, but as an organizational figure shaped postwar Japanese and international judo: third head
    (館長) of the Kōdōkan (1946-1980), first president of the All Japan Judo Federation (1949-1980), and
    president of the International Judo Federation (1952-1965), under whom the first World Judo Championships
    were held from 1956. Handled the aftermath of the dissolution of the Dai Nippon Butokukai in 1946,
    including recognition of Butokukai dan grades as Kodokan grades, took part in the negotiations with
    the occupation authorities to restore judo education in schools, hosted the All Japan Judo Championships
    under Kodokan auspices in 1948, and petitioned IOC president Avery Brundage in 1960 to make judo an
    official sport of the 1964 Tokyo Olympics. Awarded Jean de Herdt his 4th dan in December 1951, in
    his capacity as president of the Kodokan and of the Japanese judo federation.'
