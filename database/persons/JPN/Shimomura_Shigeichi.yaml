name:
  ja-Latn: Shimomura Shigeichi
  ja: 下村 茂市
nationality:
- countryCode: eucountry:JPN
  wikidata: wd:Q17
description:
  en: >-
    Tosa-domain shihan of the Muso Shinden Eishin-ryu (Shimomura-ha line) at the domain school
    Chidokan in the late Edo period; he taught the school until the Meiji Restoration and was also a
    shihan of Takagi-ryu jujutsu kenpo (JA wiki). He granted the school's menkyo kaiden to Hosokawa
    Yoshimasa in 1868, on the eve of the Boshin war.
  ja: >-
    幕末に土佐藩の藩校・致道館で無雙神傳英信流（下村派）を教授した師範。高木流体術拳法の師範も兼ねた。
    慶応4年（1868年）、細川義昌に無雙神傳英信流の免許皆伝を授けた。
hasEvidence:
- basedOnSource: 01M325EAQGDD9A6EEK7W8RGQFD
  quotation: その後、幕末に至り土佐藩の藩校・致道館において同流の師範であった下村茂市が明治維新までこれを教授したが、下村茂市も柔術をよくし、高木流体術拳法の師範も兼ねていた。
  informationType: infotype:secondary
  supports: true
  evidenceType: evidencetype:direct
- basedOnSource: 01M325EAQGDD9A6EEK7W8RGQFD
  quotation: 細川義昌（島村右馬丞の実子）は居合の他、竹内流（呑敵流）小具足組打、無外流剣術、川心流槍術、甲州流軍学や砲術を修行し、戊辰戦争の高松征討出陣の慶応4年（1868年）に下村茂市より無雙神傳英信流の免許皆伝を授かった。
  informationType: infotype:secondary
  supports: true
  evidenceType: evidencetype:direct
