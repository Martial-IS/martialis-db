description:
  en: >-
    Japanese judoka and coach. Captain of the Chuo University team, he
    coached at the Renshuden and the Budokwai in London from 1962 to 1967
    and was GB national coach for three years.
notes: >-
  The BJA obituary and the BJC tribute (2019) give the 1960 Asian Games
  title; Búason (2012, p. 19) has him Tokyo champion in 1957 and Asian
  champion in 1958. Judo was not on the Asian Games programme in 1958 or
  1962... need to check which event is meant. The death year is the tribute's date
  (Tokyo, 26 September 2019). Leggett invited him on George Whyman's
  recommendation to replace Saburo Matsushita at the Renshuden. No
  teacher claim, Leggett was his host, not (confirmed) his teacher.
