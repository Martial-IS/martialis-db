description:
  en: 'Japanese jujutsu fighter, instructor, catch wrestler and author, a protégé of Fusen-ryu

    ground-fighting master Mataemon Tanabe and, with Yukio Tani, one of the pioneers of jujutsu

    in Britain. Trained under Tanabe, then Uyemura in Kyoto and Yataro Handa in Osaka, he worked

    as an instructor in Nara and Kobe before a brawl led to his dismissal and departure for London

    in 1904. There he famously defeated Yukio Tani in a challenge match, then joined forces with him

    to open the Japanese School of Jujutsu at 305 Oxford Street and co-author "The Game of Ju-Jitsu"

    (1906). From 1914 he lived in the United States (Seattle, Chicago, New York), teaching alongside

    Kodokan judoka Shozo Kuwashima, and continued competing into his 50s at Madison Square Garden.

    '
notes: Wikidata lists birth year 1882 (P569, imported from an older English Wikipedia revision); EN and
  JA Wikipedia give 1881-08-15, preferred here. The Bartitsu interview (Sunday Times, 3 Sep 1905) is the
  primary source for the Tanabe-Uyemura-Handa training sequence; the BJS paper (mas.166) corroborates
  it and stresses that Tani, Miyake and Uyenishi came from Handa's Osaka dojo, not the Kodokan. The Handa
  teacher edge points at Handa Yataro's Daito-ryu jujutsu and his Osaka Seibukan; JA Wikipedia records
  Miyake as a 5th dan (五段) of that school, matching the "fifth degree in ju-jitsu" of the 1905 interview.
  JA Wikipedia (citing Sasaki Shigetsu) records an 8th dan from the Butokukai in Okayama, and (citing
  Judo magazine, 1918) notes he held no Kodokan rank at the time of the 1917 Santel match. Oki Shikina,
  the Danzan-ryu trainee who became Miyake's apprentice on their return from Japan (1928/31).
