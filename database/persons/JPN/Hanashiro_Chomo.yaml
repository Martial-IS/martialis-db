description:
  en: Okinawan martial arts master (1869-1945) of the Shuri-te tradition, student of Matsumura Sōkon and
    assistant to Ankō Itosu; the first to formally use the kanji kara (空, "empty") for "karate" instead
    of to/tang (唐), in writings dating from 1905.
notes: Hanashiro started karate practice at a very young age under Sōkon Matsumura, later becoming Itosu's
  assistant until Itosu's death in 1915. Along with Yabu Kentsu he was among the first Okinawans to enlist
  in the Japanese military and participated in the Russo-Japanese War; his military experience influenced
  the karate he taught at middle and normal schools, introducing formalities such as lining up by seniority,
  bowing, and yakusoku kumite. He participated in the October 25, 1936 assembly of the "Great Masters
  of Okinawa Karate", advocating the official adoption of the term "karate". His teaching is corroborated
  by Charles Goodin's article (Arakaki Ankichi "studied under Gusukuma Shimpan, Hanashiro Chomo, Chibana
  Choshin and Kyan Chotoku") and by Geoffrey Gaudion's account of Arakaki, whose "first teachers were
  Shinpan Gusukuma and Chomo Hanashiro"; Christopher Caile's Fighting Arts essay lists him among the noted
  karate practitioners of the "Bushi" era alongside Kentsu Yabu, Chotoku Kyan and Chojun Miyagi.
