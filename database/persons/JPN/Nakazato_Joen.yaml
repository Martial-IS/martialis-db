description:
  en: Okinawan karate master (1922-2010), student of Chōtoku Kyan and founder of the Shorinji-ryu style
    in 1955; held senior positions in the Okinawan karate federations and was recognized as an Okinawa
    Prefecture Intangible Cultural Asset holder.
notes: 'Nakazato was born in Chinen Village (present-day Chinen, Nanjo City) in 1922. He studied under
  Chotoku Kyan - known as the "Kensei" - from 1938 to 1943 (the Shorinji-ryu Shinkokai lineage page gives
  the exact dates April 1937 to December 1943, six years and eight months while a student at the Okinawa
  Prefecture Agriculture School, which matches the ODKS monument page''s "six years and eight months"
  despite its rounded 1938 start), learning the essence of Shuri-te and Tomari-te. After army service
  in World War II he opened a dojo in Kumamoto Prefecture in 1947 (at Matsubashi per the Shinkokai lineage
  page), and upon returning to Okinawa in 1952 established a dojo in the courtyard of his old home in
  Chinen village. He vowed to pass on Kyan''s style in its entirety without any change, and in 1955 founded
  the Shorinji-Ryu style (the Shinkokai lineage page dates the naming to 1954, after the Shaolin temple;
  the ODKS page gives 1955). The style is based on Shuri-te and Tomari-te with techniques derived from
  the eight kata passed down from Kyan, characterized by low kicks, kake-te, shuto and neko-ashi movements,
  and trained under the Zen teaching of "pouring one bowl of water into another". He held several important
  positions: Vice Chairman of the Japan Karatedo Federation Okinawa Branch, Vice Chairman of the Okinawa
  Karate Federation, and Chairman of the All Okinawa Karate Do Federation. In 1989 he was awarded the
  title of 10th dan Shorinji-Ryu Hanshi; in 2000 he was recognized as a holder of Okinawa Prefecture''s
  intangible cultural asset "Okinawa Karate and Kobujutsu"; and in 2007 he was selected as an Okinawa
  Prefecture Person of Cultural Merit. A commemorative monument stands at 589 Chinen, Chinen, Nanjo City.
  His student Hitoshi Oyakawa heads the Okinawa Karate-do Shorinji-ryu Shinkokai; Seiei Nakaza (born 1942)
  also began karate under him in 1957.'
