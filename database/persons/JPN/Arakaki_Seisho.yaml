description:
  en: Okinawan martial artist and master of Tōde (1840-1918), royal court official with the title of Chikudon
    Peichin and Chinese language interpreter; his students included Higaonna Kanryō, Chōjun Miyagi, Funakoshi
    Gichin, Uechi Kanbun, Kanken Tōyama, Mabuni Kenwa and Chitose Tsuyoshi.
notes: 'The EN Wikipedia article records Wai Xinxian of Fuzhou as his only recorded martial arts instructor;
  the Wikidata P1066 teacher claim (Ryū Ryū Ko) is not carried as a teacher edge, since no source states
  it and the Ryū Ryū Ko article only notes that some have speculated Wai Xinxian was Ryū Ryū Ko himself.
  Wai Xinxian has no Person record here. The JA Wikipedia article and the
  ODKS history state that Arakaki himself studied tōde under the Tei-shi Yabu Pechin (formerly Hokama);
  "Pechin" is an Okinawan court rank rather than a surname, and the name is too ambiguous to safely resolve
  to a Person entity here, so the claim is kept as prose rather than a teacher edge - a research lead,
  not (yet) a sourced assertion. Famous kata taught by Arakaki: Unshu, Seisan, Shihohai, Sōchin, Niseishi,
  Shisōchin and Sanchin, plus the weapons kata Arakaki-no-kun, Arakaki-no-sai and Sesoku-no-kun. Birth
  place per EN Wikipedia is Kumemura or Sesoko, while the JA Wikipedia gives Higashi-wakasa-machi, Naha
  (the Naha geo is used); the EN Wikipedia death year (1918) conflicts with the JA Wikipedia and ODKS
  (1920), with the 1918 date kept and the alternative recorded here. Nicknamed "Mayaa Arakaki" (Cat Arakaki)
  or "Arakaki Guwa". He demonstrated the kata Jusanpo and kumite at the 1867 celebration of the Chinese
  investiture mission at the royal villa in Shuri, and possibly accompanied the Shō Tai tribute mission
  to Beijing in 1867.'
