notes: Oshima Masateru (also known as Oshima Ichigaku Masateru) was the 7th Soke of Edo-line Yagyu Shingan-ryū
  Taijutsu (Araki-do). He taught Yagyu-ryu bojutsu to a young Jigoro Kano, as documented in Kano's own
  writings. He was a member of the Shinsengumi and, with the assistance of Yamaoka Tesshu, opened a dojo
  in Tokyo during the Meiji era to teach the style. He succeeded Goto Yagyu-sai (not in database) and
  taught Hoshino Tenchi, who was active in the Meiji literary world and taught women's martial arts at
  Meiji Girls' School. The Edo transmission of his teachings was later passed to the Hokuriku region,
  but its current whereabouts are unknown. His own teacher, Goto Yagyu-sai (not in database), is named
  only as a predecessor in the Soke succession; no place, period, or source details are recorded for the
  training relationship itself.
