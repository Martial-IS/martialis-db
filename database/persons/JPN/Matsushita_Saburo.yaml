description:
  en: >-
    Japanese judoka, Kōdōkan 9th dan. Twice winner of the All Japan
    Students' championship, he taught at the Budokwai and the Renshuden in
    London from 1958 to 1961, later became a professor at Nihon University
    and directed the Kōdōkan's Education and Instruction Department.
notes: >-
  The BJC tribute to Watanabe has him leave the Renshuden in 1961 after
  four years in the UK; De Crée (2024, p. 130, note 1) has him demonstrate
  at the Budokwai Annual Display in 1962. The IJF says only "the early
  60's". The 1955 students' title (Watson's Facebook post) has no Event
  record.
