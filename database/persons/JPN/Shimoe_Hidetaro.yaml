description:
  en: >-
    Utsunomiya-domain samurai and Hokushin Ittō-ryū kenjutsu master, called 'Oni Shū' and 'Japan's
    No. 1 Master of the Thrust'. Head (jukutō) of the Edo Genbukan dojo at 19 (1866). Kenjutsu
    instructor for the Utsunomiya domain (1867), then a Keishichō gekiken sewagake (1879-1884,
    again 1887-1898). At the Mito Tobukan (1885-1887) he taught Monna Tadashi, who 'most fully
    inherited Shimoe's technique', and Naitō Takaharu, and brought both to the Keishichō in
    1887-1888. Later gekiken shihan for the Aichi (1898) and Miyagi (1899) prefectural police and
    the Army 2nd Division.
  ja: >-
    宇都宮藩士、北辰一刀流の剣術家。「鬼秀」「日本一の突きの名人」と呼ばれた。玄武館で19歳にして塾頭に就く。
    明治期は警察官として剣術を指南し、水戸東武館で門奈正・内藤高治に稽古をつけた。
