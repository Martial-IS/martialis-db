description:
  en: Japanese jujutsuka of Tenjin Shinyo-ryu. Student of Genjuro Jinbo. Received menkyo (1879) and menkyo
    kaiden (1890) in Tenjin Shinyo-ryu. Appointed as Keishicho martial arts instructor in 1886. Operated
    the Seibukan dojo in Kyobashi, Tokyo. Described by Gunji Koizumi as "quite an impressive figure with
    a long grey beard." Teacher of Gunji Koizumi, founder of the Budokwai.
