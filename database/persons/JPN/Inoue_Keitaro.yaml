notes: >-
  A second teacher relationship is suspected but no specific teacher, place, period, or source has been identified; retained as a lead for future discovery. No Wikidata item exists for Anahara Village itself, so the QID points to Gunma Prefecture, the modern successor region. Lead: an E-Judo forum post (judo.forumotion.com/t2885-kano-genyosha-connection) says he was Kano
  Jigoro's third Tenjin Shinyo-ryu teacher, and Japanese Wikipedia says he became the first judo
  instructor at the Gakushuin (April 1883 to March 1886) because his student Kano was its deputy
  head. Kano has no teacher claim for him yet.
