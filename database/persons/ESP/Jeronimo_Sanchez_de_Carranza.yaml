description:
  en: >-
    Spanish nobleman, knight and fencing master from Seville, in the service of the Duke of Medina
    Sidonia, later governor of Honduras and head master of arms at court. His treatise De la Filosofía de
    las Armas (written 1569, printed 1582) founded la Verdadera Destreza, a fencing system based on
    geometry and philosophy; later Spanish masters honoured him as its first inventor.
notes: >-
  Death year unsettled (1600? on Wiktenauer; c. 1600 or 1608 in en Wikipedia); none recorded.
