description:
  en: >-
    Spanish nobleman and fencing master from Baeza, Carranza's greatest student and successor, appointed
    head master of arms at court by Philip IV in 1624 and fencing master to the king. One of the most
    prolific fencing writers, he at first celebrated Carranza and later attacked his legacy, splitting
    the Destreza into Carrancistas and Pachequistas.
