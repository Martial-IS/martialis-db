description:
  en: >-
    Korean taekwondo teacher and army officer. A Chung Do Kwan member and student of Lee Won-kuk, he taught
    tangsu-do in the army from 1947 and co-founded the Oh Do Kwan with Choi Hong-hi in 1954. In 1959 he
    was sent to Saigon to teach the army's Chung Do Kwan system to South Vietnamese soldiers and police.
