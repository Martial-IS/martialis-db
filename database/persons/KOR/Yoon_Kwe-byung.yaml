description:
  en: >-
    Korean karate teacher. He studied Shurite karate under Tōyama Kanken at the Shūdōkan and in 1940
    founded the Kanbukan in Tokyo, a sister school of the Shūdōkan known for full-contact sparring in bōgu.
    Back in Korea he joined the Chosŏn Yŏn-Mu Kwan, and in 1951 took over the school from Chun Sang-sup and
    renamed it Jidokwan. He brought bōgu sparring to Korean taekwondo.
notes: >-
