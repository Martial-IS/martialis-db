description:
  en: >-
    Korean karate teacher, founder in 1946 of the YMCA Kwŏnbŏp Bu, later the Chang Moo Kwan, one of the
    five original kwan of taekwondo. As a child in Manchuria he learned quanfa from a Mongolian instructor;
    in Japan he studied Shurite karate under Tōyama Kanken at the Shūdōkan. He disappeared in 1951 during
    the Korean War.
notes: >-
  The quanfa teacher is not named, so no teacher claim. Wikidata (Q3572556) gives 1920–1983; Green &
  Svinth give 1919 and say he was living in North Korea as of 1995. Dates other than the G&S birth year
  left out.
