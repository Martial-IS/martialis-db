description:
  en: >-
    Korean taekwondo teacher, a student of Lee Won-kuk and his successor as head of the Chung Do Kwan. He
    later claimed he crafted the name taekwondo at the 1955 naming session, a claim Choi Hong-hi also made.
    With Kang Won-shik he promoted Choi to an honorary 4th dan in 1955. His style was Shotokan karate.
