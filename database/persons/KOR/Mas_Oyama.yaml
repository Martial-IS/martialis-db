description:
  en: 'Founder of Kyokushin Karate, the first and most influential style of full contact karate. Born in Korea, Oyama trained in Shotokan under Gichin Funakoshi at Takushoku University, in Goju-ryu under Nei-chu So, and in Daito-ryu under Kotaro Yoshida. He won the first post-WWII All Japan Tournament in 1947, spent 18 months training in solitude on Mt. Kiyosumi, and opened his first dojo in 1953. He is legendary for fighting and defeating bulls bare-handed. Oyama established the International Karate Organization Kyokushinkaikan in 1964 and held the first All Japan Open Tournament in 1969 and the first World Open Tournament in 1975. He authored several books including What is Karate? (1958). He died of lung cancer in 1994.

'
