description:
  en: >-
    South Korean Army Major General and martial artist, founder of the International Taekwon-Do Federation
    (ITF) in 1966. He claimed to have studied Shotokan karate under Funakoshi Gichin in Japan; the claim is
    disputed. In 1954 he founded the Oh Do Kwan in the army with Nam Tae-hi. He claimed he submitted the
    name taekwondo at the 1955 naming session, a claim Son Duk-sung also made for himself. He wrote the
    first English taekwondo textbook (1965). He went into exile in Canada in 1972 and later moved to North
    Korea in 1979, where he continued promoting taekwondo until his death.
