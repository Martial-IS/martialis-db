description:
  en: >-
    Korean taekwondo leader. An early member of the karate division of the Chosŏn Yŏn-Mu Kwan, he reopened
    it with Yoon Kwe-byung in 1951 as the Jidokwan and became its head in 1967. As chairman of the Korea
    Taekwondo Association's technical committee he wrote its 1971 manual, the first with only the new
    taekwondo forms. Later secretary general and vice president of the WTF, he was a central figure in
    making taekwondo a full-contact sport.
notes: He says he learned karate in the Kwŏnbŏp Bu but names no teacher, so there is no teacher claim.
