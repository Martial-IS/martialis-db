description:
  en: 'South Korean taekwondo master, one of the twelve original masters of the Korea Taekwon-Do Association. He served as Secretary-General of the International Taekwon-Do Federation (ITF) under Choi Hong-hi and was Technical Chairman. In 1990 he founded the Global Taekwon-Do Federation (GTF). He was a pioneer of taekwondo in Canada, Russia, China, Japan, North Korea, and Eastern Europe. He trained initially in boxing, judo, and karate before specializing in taekwondo. During the Vietnam War he served as the army''s leading martial arts instructor for South Korean, Vietnamese, and American soldiers.

'
