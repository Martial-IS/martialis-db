notes: Segarra (2018), Tang Soo Do History V15b, ties the Osan Air Base "Tang Soo!" teaching and battle-cry origin to Master Chun Sik Kim, not to Shin; the description's Osan claim currently rests only on Wikipedia and needs a second look. The same source also lists the founding officers and 1975 charter attendees of the U.S. Tang Soo Do Moo Duk Kwan Federation without Shin among them, despite crediting him with "doing all the ground work" building it. The book's only "Korea University" mention is in H.C. Hwang's own biography (graduated September 1969), not Shin's - the "taught at Korea University" claim is not corroborated here.
description:
  en: South Korean Tang Soo Do grandmaster and founder of the World Tang Soo Do Association (WTSDA). He began training under Hwang Kee at the Seoul Moo Duk Kwan Central Gym at age 12. He taught at Seoul Central YMCA and various police and military institutions. Recruited into the Korean Air Force in 1958, he taught martial arts to American soldiers at Osan Air Base, including Chuck Norris. He moved to the US in 1968, helped build the U.S. Tang Soo Do Federation, and later founded the WTSDA in 1982. He authored six volumes of the 'Traditional Tang Soo Do' series.
