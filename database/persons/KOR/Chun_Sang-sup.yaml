name:
  en: Chun Sang-sup
aka:
  en:
    - Chŏn Sang Sŏp
    - Chun Sang Sup
description:
  en: >-
    Korean karate teacher, founder of the karate division (Kwŏnbŏp Bu) of the Chosŏn Yŏn-Mu Kwan in 1946,
    later the Jidokwan, one of the five original kwan of taekwondo. He learned karate in Japan; accounts
    differ on whether his teacher was Funakoshi Gichin or Mabuni Kenwa. He disappeared during the Korean
    War, and Yoon Kwe-byung took over the school in 1951.
notes: >-
  Mönig is not consistent: p. 53 says the claims vary, p. 62 (summary) says Chŏn learned Shotokan directly
  from Funakoshi. Note 32 (p. 53) says "He studied probably with both karate masters". Both claims kept at
  possible.
