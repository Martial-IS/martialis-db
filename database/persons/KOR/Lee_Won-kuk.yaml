description:
  en: >-
    Korean martial artist who learned Shotokan karate from Funakoshi Gichin in Japan. In 1944 he founded
    the Chung Do Kwan, the first tangsu-do (karate) school in Korea, and was its senior instructor in the
    years after liberation. He fled to Japan in 1950, accused of pro-Japanese activities, and Son Duk-sung
    took over the school. His style became part of Taekwondo from 1955.
