description:
  en: >-
    South Korean martial artist, founder of the Moo Duk Kwan, the only one of the five original kwan founders
    who never trained in Japan. He said he learned a Chinese martial art from Yang Kook-jin in Manchuria
    and taekkyon as a child; both claims are disputed. Lee Won-kuk claimed Hwang trained at his Chung Do
    Kwan. By his own writings he learned karate from books. He called his art hwasu-do, from 1947 Tang
    Soo Do, and from the late 1950s Soo Bahk Do. His system influenced American Tang Soo Do through his
    student Shin Jae Chul.
notes: >-
  Green & Svinth (p. 199) say Hwang trained in Shotokan karate while working for the South Manchuria
  Railways; Mönig (p. 53) says he never went to Japan and was mostly self-taught. The taekkyon claim is
  disputed by the Korea T'aekkyŏn Association (Mönig p. 53); no teacher is named, so no claim. The karate
  books are not named: Segarra guesses "More than likely this was Gichin Funakoshis [...] Karate Do Kyohan
  or his earlier works"; Mönig's Figure 5.1 says "Books of Funakoshi" (table, no title). No document
  transmission until a title is sourced.
