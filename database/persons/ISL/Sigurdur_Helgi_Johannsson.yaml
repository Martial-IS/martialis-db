description:
  en: >-
    Pioneer of judo in Iceland. He proposed that the Ármann boxing section
    take up judo after the 1956 boxing ban, taught there from 1958,
    co-founded Judokwai (later Judofélag Reykjavíkur) in 1965, and was the
    first vice-chairman of the Judo Federation of Iceland in 1973.
notes: >-
  Búason (2012) interviewed him in October and November 2012. He studied
  for a month at the Kringelbach Institut in Copenhagen in 1958 (p. 7); no
  Place record and no teacher named. Charles Palmer, IJF president, granted
  the 1967 2nd dan together with Ichiro Abe; Palmer has no Person record.
