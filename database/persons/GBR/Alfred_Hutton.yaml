description:
  en: >-
    British Army officer and antiquarian who led the revival of historical fencing in England. He learned
    fencing at the Angelo school in St James' Street, reconstructed the systems of George Silver and
    Achille Marozzo, wrote Cold Steel (1889), and about 1899–1902 taught stage fencing at the Bartitsu Club,
    where he learned jujutsu and the Vigny method from the other instructors.
