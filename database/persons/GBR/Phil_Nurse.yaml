description:
  en: 'English former Muay Thai kickboxer and the owner and senior instructor at The Wat in Manhattan,
    New York City. Nurse was Georges St-Pierre''s Muay Thai striking coach from 2006 to 2009, training
    him at The Wat. He is a European Light Welterweight Champion, Double British Champion, and was awarded
    the title of Ajarn (Master) in Muay Thai in 2015.

