description:
  en: >-
    English booth fighter and bare-knuckle champion, one of the most scientific boxers of his time. He
    won the English heavyweight title in 1861 and held the world title in 1870–1871 in the United
    States. His exhibitions in America, Australia and New Zealand spread gloved, points-scored boxing;
    with his protégé Larry Foley he schooled a generation of Australian boxers.
