description:
  en: >-  
    Neil Adams is an English judoka, world champion in 1981 and
    Olympic silver medallist in 1980 and 1984, representing Great
    Britain, Neil is widely regarded as Britain's most successful male
    judoka ever. Later a coach at the national level, he is also
    well-known as the IJF's television commentator and, more
    generally, as "the voice of Judo". Neil started his Judo career in
    his hometown, Rugby, going to Coventry soon after where, under the
    guidance of his father, where he obtained his first national
    successes, before going to the Budokwai at 16 years old to further
    advance his Judo and a path that would lead him to international
    success.
    Neil's tai otoshi and newaza are particularly well known.        
