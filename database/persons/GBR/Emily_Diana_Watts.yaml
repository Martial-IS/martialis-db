description:
  en: 'Among the first female instructors of jujitsu in the Western world, and an innovator in physical
    culture. By 1903

    she joined the Golden Square dojo of Uyenishi and Akitaro Ono in London, and by 1906 was teaching
    her own class of

    boys at the Prince''s Skating Club. Her 1906 book The Fine Art of Jujitsu was the first English-language
    work to

    detail Kodokan judo kata (nage no kata). Her 1914 The Renaissance of the Greek Ideal presented an
    original system

    of calisthenics inspired by Greek statuary, and she spent four decades on the international lecture
    circuit.

    '
notes: Emily Diana Watts performed alongside Phoebe Roberts at the December 1904 Caxton Hall demonstration
  organized by the Japanese School of Ju-jitsu, alongside Tani, Uyenishi and others (per Callan/Heffernan/Spenn).
  She taught jujitsu to Mary Russell, Duchess of Bedford c. 1905 (per the Wikipedia image caption). Akitaro
  Ono, co-owner with Uyenishi of the Golden Square dojo Watts joined in 1903; the teacher interaction
  here references only Uyenishi.
