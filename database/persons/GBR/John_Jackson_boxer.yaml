description:
  en: >-
    English prizefighter, "Gentleman" John Jackson, who beat Daniel Mendoza in 1795 and then ran a
    boxing academy for gentlemen at 13 Bond Street, London. Lord Byron was among his students. At George
    IV's coronation in 1821 he led the prizefighters who kept order at Westminster Abbey.
