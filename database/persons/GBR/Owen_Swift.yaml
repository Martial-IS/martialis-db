description:
  en: >-
    English lightweight prizefighter. The death of "Brighton Bill" Phelps after their 1838 bout, and
    Swift's conviction for manslaughter, led to the London Prize Ring Rules. In 1838 he twice beat Jack
    Adams in France; in Paris he also beat Charles Lecour in a savate-against-boxing assault. He later
    kept a tavern in Soho.
