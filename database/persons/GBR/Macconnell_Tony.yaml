description:
  en: >-
    British judoka and coach, international athelete during the 1960s
    and 1970s, manager of the British judo team in the years up to the
    1980 Moscow Olympics and later of the Swedish Judo team. 
notes: >-
  The obituary (IJF, 9 July 2019) says he died "on Sunday", which would be
  7 July 2019. Judo, No. 10, May 1981, p. 26, says he was leaving the
  British team to become National Coach of Norway.
hasEvidence:
  - basedOnSource: 01M8EWHQFPY8K2A0ZEW4KXJSJ0
    quotation: >-
      Tony Macconnell, 79, who passed away on Sunday, was a famed member of
      British Judo and was a key part of the management team when Britain
      were enjoying their glory years in the sport.
