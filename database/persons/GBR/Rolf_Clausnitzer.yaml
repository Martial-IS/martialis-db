name:
  en: Rolf Clausnitzer
description:
  en: >-
    Wing Chun practitioner who grew up in Hong Kong, one of the first Westerners to study the art.
    He trained with Wong Shun-leung and in the UK with Greco Wong, and co-wrote Wing-Chun Kung-Fu
    (1969), an early book on the art.
notes: >-
  Judkins and Nielson pp. 274-276. Interviewed Ip Man in 1960.
