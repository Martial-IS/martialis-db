description:
  en: 'British physical culture instructor (specialised in boxing and wrestling) who became a pioneering
    jujutsu

    instructor. Introduced to jujutsu in 1899 alongside his wife Edith, he studied under Yukio Tani and
    Sadakazu

    Uyenishi, first at the Bartitsu School of Arms and then at the Golden Square dojo, and also trained
    with Taro

    Miyake, Mitsuyo Maeda, Gunji Koizumi and Akitaro Ohno there. When Uyenishi left for Japan in 1908,
    Garrud took over

    the Golden Square dojo, running it with Edith until their retirement in 1925. Wrote "The Complete
    Jujitsuan" (1914),

    dedicated to "Professor S.K. Uyenishi ''Raku''", which became a standard jujitsu/judo text republished
    at least seven

    times. During the First World War he trained the Volunteer Civil Force in jujutsu.

    '
notes: Birth/death years per English Wikipedia and Royal Armouries (1873-1960); Wikidata gives 1871-1936
  - discrepancy noted, Wikipedia cited as the more detailed source. Wife Edith Garrud, trainer of the
  suffragette Bodyguard unit, is covered separately. Miyake, Maeda, Koizumi and Ohno are named as training
  companions at the Golden Square Dojo (Brough 2020, Wikipedia) but no teacher edge is asserted - only
  Tani and Uyenishi are attested as his teachers.
