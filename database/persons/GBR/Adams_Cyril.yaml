description:
  en: >-
    Judo coach at the Coventry Judo Club and for the Midland Area team of British Judo;
    father and first coach of Neil Adams.
notes: >-
  Coventry Evening Telegraph items (BNA, paywalled) have him competing
  for Coventry as a brown belt (25 Mar 1966) and as a county and
  Midlands area junior coach (24 Nov 1973). Neil is very clear in his
  father role, and the Cyril Neil Ahsley podcast episode has more
  information. In another interview, Neil specifically mentions his
  father as shodan, and as someone who got involved in Judo later in
  life. The interviews point to a degree of connections with people in
  British judo - like those that would take in Neil at the Budokwai -
  that warrants more investigations.
