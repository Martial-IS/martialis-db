description:
  en: Billy Riley (1896–1977) was an English catch wrestler and coach. He founded Riley's Gym, later known
    as the Snake Pit, in Wigan in 1948. He trained Karl Gotch, Billy Robinson, and other wrestlers who
    became foundational figures in catch wrestling, professional wrestling, and modern MMA.
