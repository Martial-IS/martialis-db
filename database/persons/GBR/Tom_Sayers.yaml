description:
  en: >-
    English prizefighter who, though small, fought much bigger men and lost only one of sixteen bouts.
    Heavyweight champion of England from 1857, he fought the American John C. Heenan to a draw at
    Farnborough in 1860, the last great event of the bare-knuckle ring, and retired.
