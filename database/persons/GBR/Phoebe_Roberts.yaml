description:
  en: 'Welsh-born pioneer of women''s jujutsu, among the first female instructors of the art in Britain. Born Phoebe Parry

    in Monmouthshire, she was adopted by the Roberts family, London manufacturing chemists, and changed her name. At

    16 she joined Uyenishi''s Golden Square School of Jujutsu in 1903 and was promoted to instructor within a year of

    training. From December 1904 she performed alongside her teachers Yukio Tani and Sadakazu Uyenishi, including the Caxton Hall

    demonstration with Emily Diana Watts (December 1904), the 1905 Aldershot army demonstrations, a June 1905 Japan Society

    garden party at the Royal Botanic Gardens, and a November 1905 Marlborough Hall demonstration alongside Kanaya, Tani,

    Miyake, Huji and Eida. In 1906 she appeared in Sporting Life demonstrating alongside Miyake, Hirano, Yamashita and

    Omura at the headquarters of the Japanese School of Ju-Jitsu. Featured in Sandow''s Magazine, Health and

    Strength, and The Lady''s Realm, and shown as ''ladies instructor'' in Tani and Miyake''s The Game of Ju-Jitsu (1906)

    at the Japanese School of Ju-Jitsu, 305 Oxford Street. Married fellow instructor Juzo (Juso) Hirano (the Japanese

    jujutsuka known here as Hirano Yuzo) in March 1907; the couple performed at the Palace Theatre, Manchester in 1908, where Phoebe was

    billed as ''Miss Roberts, Lady Champion Ju-jitsu Wrestler of the World'', before touring Spain with other instructors

    and teaching women''s self-defence in Barcelona on 31 July 1908. Followed Hirano to his Barcelona Ju-jitsu Academy

    (1909) and then to Portugal; after Hirano drowned off Santa Cruz beach in 1915 she remarried, as Phoebe

    Laughton-Parry, Carlos de Castro Henriques in 1916. She died in Porto in October 1937.

'
notes: 'Birth name Phoebe Parry; "Roberts" from her adoptive family, London manufacturing chemists. Name sequence: Phoebe Hirano after the 1907 marriage, then Phoebe Laughton-Parry, then Phoebe Laughton-Parry de Castro Henriques after the 1916 remarriage. Spouse Juzo/Juso Hirano is covered here as Hirano Yuzo - the Portuguese corpus reads his name Yuzo, Callan/Heffernan/Spenn and Brough write Juzo/Juso. Death dated October 1937 per Callan/Heffernan/Spenn; the Portuguese-language narrative in the Hirano Yuzo entry gives 1938 - the academic account is cited here. The Bartitsu Society article instead places her death in Lisbon in 1936 and describes "Phoebe Roberts" as a professional pseudonym for Phoebe Laughton Parry, with her training beginning circa 1904 (aged about fifteen) at the Japanese School of Ju-Jitsu - these details differ from Callan/Heffernan/Spenn and are recorded for completeness rather than cited as authoritative. Joined Uyenishi''s 1907-08 Iberian tour per Brough (2020). Callan/Heffernan/Spenn (2019) note that after the Barcelona demonstration of 31 July 1908, Hirano "fought as a present to his son", suggesting the couple had a son by July 1908.'
