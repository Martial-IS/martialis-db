description:
  en: 'English actress and judoka, the first non-Japanese woman to obtain a black belt in judo. Born in London in 1896

    into an acting dynasty, she worked in the West End from 1914. She trained in judo with Gunji Koizumi at the

    Budokwai from 1926, where the ladies'' classes were taught by Koizumi and Yukio Tani, reaching 4th kyu by 1932. On

    an around-the-world trip in 1934 she trained in Japan, first in Kobe and Kyoto, then in Tokyo under Kanō Jigorō,

    who devised a training regime for her and allowed her to practise in the Kodokan main dojo with the men. After

    reaching Kodokan 1st kyu she graded for shōdan at the Kyoto Butokukai in February 1935 - the first non-Japanese

    woman black belt. On her return she was Honorary Secretary of the Budokwai''s ladies'' section; she is the subject of

    an Oxford Dictionary of National Biography entry.

'
notes: The shōdan was presented by Prince Nashimoto on 23 February 1935, after a three-day grading under Professor Isogai (examining kime no kata, nage no kata and katame no kata); her achievement was reported across Australia, New Zealand, North America, Britain and mainland Europe. In Tokyo the Kodokan asked her to write an article for its Judo magazine (October 1934). After her return she was featured in a London Evening News article (January 1936) and wrote a Daily Mirror weekly series on women's self-defence (October 1937). Second marriage to barrister Robert John (Robin) Mayer (1924, divorced after the trip); she took the surname Ovington in 1951 from partner Warwick Parker Ovington. The Kodokan 10th dan holders she met were the first six men so awarded (Isogai Hajime and Mifune Kyuzo among them). The dan grading was conducted at the Butokukai (Dai Nippon Butokukai) in Kyoto rather than the Kodokan.
