description:
  en: >-
    English prizefighter known as George the Barber, a student of James Figg, in whose booth he fought
    from 1719. He took over Figg's booth in Tottenham Court Road after Figg's death in 1734 and is
    counted champion of England for three years after Tom Pipes.
notes: >-
  Green and Svinth give his birth year as 1716, which does not fit fighting in Figg's booth from 1719
  (en Wikipedia); no birth date recorded.
