description:
  en: >-
    English judoka, 8th dan. Member of the first British Olympic judo team
    in 1964 and European open-weight silver medallist in 1965, he was chief
    instructor of the Budokwai, chairman of the British Judo Association
    (1985-1987) and founder of the British Sumo Association.
notes: >-
  Teizo Kawamura, also named among his Budokwai teachers, has no Person
  record. In Japan: the BJA obituary and Olympedia give three years at the
  Kodokan, the Guardian four, the Legacy site "nearly four years"
  (1961-1964). His later London Judo Society (London Budokan) years are not
  dated; the club has no Place record. A Slow Boat to Yokohama (2010) may
  name his Kodokan teachers. Oxford DNB entry not consulted.
