description:
  en: >-
    English fencing master and pamphleteer, author of a notorious attack on women (1615) and of The
    Schoole of the Noble and Worthy Science of Defence (1617), centred on the rapier and quarterstaff,
    in which he dismissed George Silver. He claimed to have been fencing instructor to Prince Henry.
