description:
  en: >-
    Wife of Pierre Vigny, known as Miss Sanderson, who gave fencing demonstrations in Barton-Wright's
    women's classes, was assistant instructor at Vigny's London academy, and developed a method of
    self-defence with an umbrella.
notes: >-
  en Wikipedia names Vigny's wife Miss Sanderson, his assistant instructor, and later his wife
  Marguerite; fr Wikipedia names her Marguerite only. Read as one person.
