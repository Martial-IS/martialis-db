description:
  en: >-
    Britain's first woman jujutsu teacher, and among the earliest women to instruct martial arts
    in the West. Born Edith Margaret Williams in Bath, she trained as a physical culture
    instructor and met fellow instructor William Garrud in 1892, marrying him the following
    year. Introduced to jujutsu in 1899, she studied under Yukio Tani and Sadakazu Uyenishi at
    the Bartitsu School of Arms and continued under Uyenishi at his Golden Square Dojo; when
    Uyenishi returned to Japan in 1908 the Garruds took over the dojo, Edith teaching the
    women's and children's classes. Around 1909 she opened her own dojo, the School of Ju-jutsu,
    at Argyll Place. A member of the Women's Freedom League from 1906 and head of its Women's
    Athletic Society from 1908, she became celebrated for the Suffragettes' Self-Defence Club
    she ran for WSPU members and, from 1913, for training the WSPU 'Bodyguard' of around thirty
    women who protected Emmeline Pankhurst. She taught and demonstrated in a signature red
    jujutsu jacket, published widely on women's self-defence (including the 1910 essay "The
    World We Live In" in Votes for Women), choreographed suffragette theatre, and continued
    teaching with William until their retirement in 1925.
notes: 'Née Edith Margaret Williams. Active at the Bartitsu School of Arms 1899-1902 before Uyenishi''s
  Golden Square dojo, per Wikipedia. The dojo at Argyll Place was at 9 Argyll Place, Regent Street (Brough
  2020, citing Callan/Heffernan/Spenn and Wolf & Wolf). She wore a red jujutsu jacket rather than the
  traditional white to stand out on stage (Wolf & Wolf 2013). From 1911 she hid WSPU members wanted by
  the police for arson, and from 1911-1913 moved her self-defence club to the Palladium Academy in Argyll
  Street. Son Owen died in the First World War. Her teacher links rest on the same evidence as William
  Garrud''s: explicit "studied under/trained under" language in Wikipedia and Callan/Heffernan/Spenn for
  Uyenishi and Tani; the vaguer "trained with" references to Miyake, Maeda, Koizumi and Ohno are deliberately
  not asserted as teacher edges (see William Garrud).'
