description:
  en: >-
    English Jewish prizefighter from the East End of London whose scientific, defensive style and
    books (The Art of Boxing) shaped boxing technique. Richard Humphries was his early mentor and second
    and then his rival in three bouts (1788–1790). He ran a boxing school in Capel Court and lost to John
    Jackson in 1795.
