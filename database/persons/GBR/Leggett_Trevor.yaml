description:
  en: 'British judoka, author and translator, one of the first Europeans to hold a dan rank (London Budokwai
    shodan in 1935). He taught judo at the Budokwai from 1945 and became a senior instructor in 1954,
    chaired the July 1948 London conference that founded the European Judo Union, and is named ''Chairman
    of the European Judo Union'' in Moshe Feldenkrais''s preface to Higher Judo (1952), which thanks him
    for critical reading of the typescript and advice on the mat. He held 6th dan from the Kodokan, founded
    the competition-oriented Renshuden dojo in 1959, headed the BBC''s Japanese Service for 24 years,
    and wrote extensively on judo, Zen and Indian philosophy, being awarded the Japanese Order of the
    Sacred Treasure in 1984.

    '
  fr: 'Judoka, écrivain et traducteur britannique, l''un des premiers Européens à obtenir un grade dan
    (shodan au London Budokwai en 1935). Il enseigna le judo au Budokwai à partir de 1945 et devint instructeur
    principal en 1954, présida en juillet 1948 la conférence de Londres qui fonda l''Union européenne
    de judo, et est nommé « président de l''Union européenne de judo » dans la préface de Moshe Feldenkrais
    à Higher Judo (1952), qui le remercie pour la relecture du manuscrit et ses conseils sur le tapis.
    Il détenait le 6e dan du Kodokan, fonda le dojo Renshuden en 1959, dirigea le service japonais de
    la BBC pendant 24 ans, et écrivit abondamment sur le judo, le zen et la philosophie indienne, recevant
    en 1984 l''Ordre japonais du Trésor sacré.

    '
notes: EJU chairmanship is recorded on the EJU officers list (start 1948); the EJU FAQ lists presidents
  (J. Barnes 1949, A. Torti 1949-1952), suggesting 'Chairman' per Feldenkrais's 1952 preface was a distinct
  office. The teacher edge to Yukio Tani rests on a single Wikidata statement (possible).
