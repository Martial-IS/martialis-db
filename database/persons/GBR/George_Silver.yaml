description:
  en: >-
    English gentleman and writer on swordplay of unknown martial lineage, not a professional master nor
    a member of the London Masters of Defence. He championed the native English weapons against the
    Italian rapier masters Bonetti and Saviolo, with his brother Toby challenged Saviolo to a public
    match, and wrote Paradoxes of Defence (1599) and Bref Instructions upon my Paradoxes of Defence
    (published 1898).
notes: >-
  Dates: ca. 1550s/1560s to the 1620s (Wiktenauer, en Wikipedia, Green and Svinth); none recorded. His
  brother Toby is not recorded.
