description:
  en: >-
    Cornish-born New Zealand boxer, the first world champion in three weight classes; he won the world
    heavyweight title from James J. Corbett in 1897. Jem Mace's school and tournaments in Timaru shaped
    his start, and Larry Foley in Sydney trained him and guided his career.
