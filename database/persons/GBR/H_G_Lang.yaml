description:
  en: >-
    British superintendent of the Indian Police who wrote The Walking Stick Method of Self Defence
    (1923), drawn largely from Pierre Vigny's system, which he learned from Vigny's student Percy Rolt.
    In the 1940s the book was the basis of self-defence training for Jews in Mandatory Palestine.
notes: >-
  Stub; dates unknown (Green and Svinth). en Wikipedia gives the Vigny line through Percy Rolt; fr
  Wikipedia calls Lang Vigny's own student. Both kept, the direct one at a lower level.
