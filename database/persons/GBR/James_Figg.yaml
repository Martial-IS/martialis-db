description:
  en: >-
    English prizefighter and teacher of boxing, backsword, quarterstaff and cudgel, from Thame. In 1719
    he opened an amphitheatre and fighting school in London; he is counted as the first champion of
    England, 1719–1730. His pupils included Jack Broughton, George Taylor and Thomas Sibblis.
