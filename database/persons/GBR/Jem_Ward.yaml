description:
  en: >-
    English prizefighter, "The Black Diamond", champion of England 1825–1831, though sanctioned for
    throwing a fight in 1822. In retirement he kept a hotel in Liverpool, painted, and taught boxing;
    his student Tom King beat Jem Mace for the title.
