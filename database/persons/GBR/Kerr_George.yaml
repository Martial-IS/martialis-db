description:
  en: >-
    Scottish judoka and coach, IJF 10th dan. European champion in 1957 after
    training at the Budokwai and in Japan, he founded The Edinburgh Club,
    coached Peter Seisenbacher to two Olympic titles and was chairman and
    president of the British Judo Association.
notes: >-
  Dates in Japan differ: the Consulate-General has him go after the 1957
  European title, for four years, back in 1961, and PORT Magazine has him
  travel to Tokyo in 1957; "At 18" (Scottish Sports Hall of Fame) and the
  voyage past Suez during the crisis (The Scotsman) point to 1956.
  JudoScotland gives four years and three months.
  First dan at 15 (Hall of Fame) or 16 (Consulate-General); no rank claim.
  The Scotsman names Charles Palmer, then at the Budokwai, as his mentor
  after his return from Japan; Palmer has no Person record. The full birth
  date is from Wikipedia and Wikidata only. The 10th dan is an IJF grade,
  not a Kōdōkan one. Autobiography: My Journey to the 10th Dan.
