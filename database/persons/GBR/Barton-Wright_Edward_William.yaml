description:
  en: 'English entrepreneur specialising in self-defence training and physical therapy, remembered as
    one of the first

    Europeans to both learn and teach Japanese martial arts and as a pioneer of the concept of hybrid
    martial arts.

    While working in Kobe, Japan (c. 1895-1898) he studied jujutsu in at least two styles, including Shinden
    Fudo-ryu

    in Kobe and Kodokan judo in Tokyo; the BJS paper also notes he had some training in judo and taught
    Shinden Fudo

    ryu (Immovable Heart school) jujutsu techniques. Returning to England in 1898 he combined these arts
    with British

    boxing, French savate and Vigny stick fighting to form Bartitsu, and in 1900 established the Bartitsu
    School of

    Arms and Physical Culture in London. He brought over talented young jujutsuka - notably Yukio Tani
    and Sadakazu

    Uyenishi - to teach at his club, giving jujutsu its start in the U.K. Died in 1951.

    '
notes: Wikidata gives death date 26 April 1951 while English Wikipedia gives 13 September 1951; the Wikipedia
  date is used here, with a note. The account that Barton-Wright studied jujutsu in at least two styles
  (Shinden Fudo-ryu in Kobe and Kodokan judo in Tokyo) comes from English Wikipedia (citing Wolf, The
  Bartitsu Compendium); note Wikipedia's Shinden Fudo-ryu article cautions that the version Barton-Wright
  studied ("Shinden Fudo ryu Kempo") may not be the same lineage as the Shinden Fudo-ryu Dakentaijutsu
  recorded elsewhere. The individual instructors behind his teacher edges are unnamed in the sources.
