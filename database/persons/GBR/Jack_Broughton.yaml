description:
  en: >-
    English prizefighter, a former pupil of James Figg and champion of England from 1738 until Jack
    Slack beat him in 1750. He wrote the first boxing rules (1743), ran his own amphitheatre in Oxford
    Road, coached gentlemen with "mufflers", the first boxing gloves, and was later called the father of
    English boxing.
