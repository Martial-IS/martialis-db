description:
  en: >-
    English middleweight prize fighter from Hinckley, taught at Dick Cain's sparring rooms in Leicester,
    English middleweight champion from 1846 and the only man to beat Tom Sayers. In retirement he ran
    London taverns and a boxing club, was Jem Mace's matchmaker, and mentored Mace and Tom King.
notes: >-
  The infobox gives 1 May 1820 as birth date; the lead gives 20 May.
