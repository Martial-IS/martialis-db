description:
  en: >-
    British boxer born into slavery in New York, who came to England in 1777. He trained and managed
    his countryman Tom Molineaux for the fights with Tom Cribb, and in the 1820s ran a boxing academy
    whose pupils included William Hazlitt and Lord Byron.
