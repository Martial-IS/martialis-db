description:
  en: >-
    Swiss wrestling champion who taught gymnastics and freestyle wrestling at the Bartitsu Club in
    London from 1901, where Yukio Tani and Sadakazu Uyenishi taught him jujutsu, and fought in the
    music-hall challenge matches. Back in Switzerland he taught physical education and self-defence to
    police forces.
