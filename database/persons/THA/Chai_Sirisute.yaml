description:
  en: Chai Sirisute (born 1948), known as Ajarn Chai, is a Thai Muay Thai instructor who founded the Thai
    Boxing Association of the US in 1968 and is credited with introducing Muay Thai to the United States.
    He trained Dan Inosanto in Muay Thai starting in 1978, and through him influenced the integration
    of Muay Thai into Jeet Kune Do.
notes: Trained Muay Thai from age 4 in Thailand and also earned a black belt in Shorin-ryu karate at age
  12; teachers unidentified, not well documented in available sources.
