description:
  en: Wong Shun-leung (1935–1997) was a Hong Kong Wing Chun grandmaster, a student of Ip Man, and the senior kung fu brother (sihing) who served as Bruce Lee's primary instructor in Wing Chun. Known for over a hundred challenge fights (beimo), he never lost a match.
