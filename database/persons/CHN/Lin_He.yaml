description:
  en: >-
    Hakka martial arts teacher of Lam Gar from Huiyang, who founded the Lin Jia Martial Arts
    Institute in Lianghua Xu, Huidong, in 1862. Teacher of Cheung Lai-chuen and of his nephew Lam
    Yiu-kwai.
notes: >-
  Judkins and Nielson pp. 106, 125. Began local arts at fourteen; at seventeen says he studied
  with a former monk from Fujian (p. 106). No teacher claim recorded.
