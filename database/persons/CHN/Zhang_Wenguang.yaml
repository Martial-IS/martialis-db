description:
  en: Chinese Hui martial artist, educator, and 9th duan wushu master. Co-founder of Beijing Sport University's
    wushu department and one of China's 'Three Martial Arts Titans' (武林三泰斗). Born in Tongxu, Henan. Studied
    Cha Quan under master Chang Zhenfang from 1929, then systematized multiple martial arts at the Nanjing
    Central Guoshu Institute from 1933 under masters Huang Bonian, Jiang Rongqiao, and others. Won the
    1934 national lightweight Chinese wrestling championship. Performed at the 1936 Berlin Olympics - 
    the first time Chinese martial arts were showcased on the Olympic stage - demonstrating Cha Quan,
    Plum Blossom Saber, and Suokou Spear, with the 'Empty Hands Seize Spear' routine performed alongside
    Wen Jingming earning ovations. Co-drafted China's first Wushu Competition Rules in 1958. Trained Wu
    Bin, Li Junfeng, and generations of wushu coaches and athletes. Authored over 10 treatises including
    Chinese Cha Quan, Cha Quan Comprehensive Forms, Youth Fist, Chinese Wrestling, Broadcast Taijiquan,
    Women's Self-Defense, and散手拳法. Vice Chairman of the Chinese Wushu Association. Received over 30 honors
    including the New China Sports Pioneer Award, National Sports Honor Medal, and International Wushu
    Contribution Award.
