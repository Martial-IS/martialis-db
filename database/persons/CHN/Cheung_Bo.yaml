description:
  en: >-
    Wing Chun teacher in Foshan and dim sum chef at the Tien Hoi restaurant, first teacher of Sum
    Nung. He taught restaurant staff, a home class, and the 'Hui Yi' school.
notes: >-
  Judkins and Nielson pp. 194-195: native of Zheng village, Sihui. His lineage is not well
  understood: said to have learned from an unnamed monk, and from Wai Yuk-sang, possibly a student
  of Au Si (pupil of Fung Siu-ching) or of Leung Jan's Gulao system. No teacher claim recorded.
