description:
  en: Chinese martial artist and actor born in Guangzhou. Trained Changquan under his mother Bow-sim Mark
    and Wu Bin at the Beijing Shichahai Sports School. Also trained Wing Chun under Ip Chun and received
    film mentorship from Yuen Woo-ping. Starred in over 80 films including Ip Man, Hero, and Rogue One.
