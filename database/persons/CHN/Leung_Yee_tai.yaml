description:
  en: Leung Yee-tai was a Chinese Wing Chun practitioner of the late Qing Dynasty and a member of the
    Red Boat Opera Company, known for his expertise with the long pole. He exchanged pole techniques with
    Wong Wah-bo for Wing Chun knowledge and together they taught Leung Jan.
