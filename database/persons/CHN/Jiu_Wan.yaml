description:
  en: >-
    Wing Chun teacher from Foshan, nephew and student of Jiu Chao. He taught at the Foshan Jingwu
    Association in the late 1940s, fled to Hong Kong in 1949, joined Ip Man and later ran a large
    school there.
notes: >-
  Judkins and Nielson pp. 191-192, 229-230, 244. First teacher: his cousin Jiu Tong, a student of
  Chan Yiu-min (not recorded). Introduced Lee Shing to Ip Man in 1954 (p. 230). Wikidata gives 1929-1974.
