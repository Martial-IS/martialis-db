notes: 小生奕 ("Xiaosheng Yi") is a stage epithet, not a Western-style personal name - 小生 is the young-male-lead
  role type in Cantonese opera, 奕 the given name. Famous Cantonese opera performer who Lee Hoi-chuen
  apprenticed under from 1911, learning opera performance and martial arts, and who gave him the stage
  name Li Hoi-chuen - see database/persons/CHN/Lee_Hoi_chuen.yaml. Otherwise undocumented.
