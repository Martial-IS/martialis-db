description:
  en: Chinese wushu athlete, world champion, and martial arts director. Born in Shandong. Recruited by
    Wu Bin in 1994 to join the Beijing Wushu Team, where he trained until 2001. Achieved Wuying (武英) level
    at age 15, the highest honor grade in wushu. Won national shuangdao champion in 2000. After leaving
    Beijing, joined Cirque du Soleil's KA show at MGM Grand Las Vegas (2003-2006) as main actor, martial
    arts coach, and choreographer. Competed for Hong Kong from 2006. Two-time World Champion in nangun
    (2009 Toronto, 2011 Ankara). Won nanquan+nangun gold at 2009 East Asian Games. Silver medalist at
    2010 Asian Games. Married Lo Nga Ching, a two-time world wushu champion. Known as 'Jaden He' in international contexts.
