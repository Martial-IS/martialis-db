description:
  en: Chinese-American martial artist who founded the Chinese Wushu Research Institute (CWRI) in Boston, 1976. Specialized in Fu-style Wudangquan, Tai Chi Chuan, and Wu Dang sword. First to introduce standardized Wushu to American audiences. Mother of actor Donnie Yen.
