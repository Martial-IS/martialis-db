description:
  en: 'Chinese martial artist, actor, and film director. Born in Beijing. Manchu (满族), descended from
    the Uya (乌雅氏) clan of the Plain White Banner. Entered Beijing Shichahai Sports School at age 6 (circa
    1980) and was selected for the Beijing Wushu Team in 1989, where he trained under coach Wu Bin. Won
    multiple national wushu championships in quanshu, daoshu, qiangshu, and duilian between 1984 and 1994.
    Graduated from Beijing Sport University in 1995. Starred in Wolf Warrior (2015), Wolf Warrior 2 (2017,
    highest-grossing Chinese film), The Wandering Earth (2019), and The Wandering Earth 2 (2023). Named
    Forbes China Celebrity 100 #1 in 2019. Awarded National First-Class Actor title in June 2024.'
