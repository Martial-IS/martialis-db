description:
  en: >-
    Wing Chun teacher and doctor of traditional Chinese medicine in Foshan, son of Chan Wah-shun. He
    taught at his clinic, the Chan Ancestral Hall, and from 1932 also in Wuzhou, Guangxi.
notes: >-
  Judkins and Nielson p. 190. Leung Ting's stories of a lazy, gambling youth are judged
  unsupported. Students include Jiu Chao and Jiu Tong.
