description:
  en: Chinese Cantonese opera singer and actor, one of the 'Four Great Clowns of Cantonese Opera'. He
    practiced Taijiquan for decades and was his son Bruce Lee's first martial arts teacher, introducing
    him to Tai Chi. He was part of a touring Cantonese opera company that was in San Francisco when Bruce
    was born.
