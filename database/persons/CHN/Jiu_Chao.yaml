description:
  en: >-
    Wing Chun teacher from Foshan, student of Chan Yiu-min. After 1945 he taught for the Zhong Yi
    Athletic Association in Foshan and at his own school in Shiqi, Zhongshan, and served in the
    Foshan plain-clothes police.
notes: >-
  Judkins and Nielson pp. 120, 190-191, 206. Probably trained in Hung Gar first (p. 191). Over 100
  students, including Pan Nam. Asked Ip Man to correct his forms in the police years (p. 206); not
  recorded as a teacher claim. Wikidata gives his death as 1968.
