description:
  en: Chinese martial artist and son of Fu Zhensong. Trained his father's Fu-style Wudangquan lineage,
    which integrated Tai Chi, Bagua Zhang, Xing Yi Quan, and Wu Dang sword. Taught students including
    Bow Sim Mark (who trained under him for 10 years, instructor 1968-74). Grandson of one of the Northern
    Five Tigers and founder of the Nanking Central Kuoshu Institute.
