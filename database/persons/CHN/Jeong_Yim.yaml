description:
  en: >-
    Choy Li Fut teacher, disciple of Chan Heung, who reopened the Hung Sing school in Foshan in 1867
    and gave Foshan's Choy Li Fut its character.
notes: >-
  Judkins and Nielson pp. 96-97, 118. Traditions give him a life of 33 years or of over eighty (p.
  96). A 1930s novel, Foshan Hung Sing Kwoon, made him co-founder of the style; the book treats
  most of his biography as legend (pp. 96, 118). Successor at Hung Sing: Chan Ngau Sing
  (1864-1926), no record.
