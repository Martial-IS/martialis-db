description:
  en: >-
    Creator of Choy Li Fut, which he made public in 1836. A militia instructor in Shunde, he founded
    a network of branch schools from about 1848.
notes: >-
  Judkins and Nielson pp. 92-96. His teachers in the tradition are his uncle Yuen Woo, Li Yau San
  and the monk Choy Fok of Mt. Luofu, all tied to Shaolin legend; the book calls the account
  improbable, then impossible (p. 92). No teacher claim recorded. Students who opened branches:
  Lung Ji Choi (Guangxi), Chan Din Yao and Chan Din Fune (Foshan) (p. 95).
