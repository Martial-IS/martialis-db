description:
  en: Chinese Hui martial artist, qigong master, founder of Sheng Zhen Meditation, and world-renowned
    wushu coach. Born in Gaocheng, Hebei. Specializes in Baguazhang and Taijiquan. Enrolled at Beijing
    Physical Education University in 1960, studying under Zhang Wenguang. Co-founded the Beijing Wushu
    Team with Wu Bin in 1974 and served as head coach from 1974 to 1988, during which the team won the
    national championship for 12 straight years and his students won 56 individual gold medals. Also starred
    in the 1982 film Wu Lin Zhi and choreographed action scenes. Later served as head coach of the Philippines
    national wushu team (1988-1991). Founded the International Sheng Zhen Society in 1995. Author of several
    publications on wushu and Sheng Zhen Meditation.
