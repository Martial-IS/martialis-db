description:
  en: Chinese wushu athlete regarded as one of the greatest female wushu athletes of all time. Born in
    Jinzhou, Liaoning. Started training wushu in 1983; joined Liaoning Wushu Team in 1985 under coach
    Pan Qingfu. Transferred to Beijing Wushu Team in 1995 to train under Wu Bin. Two-time World Champion
    in jianshu (1993 Kuala Lumpur, 2001 Yerevan). Won gold in women's changquan all-around at the 1998
    Asian Games in Bangkok. Won gold at the 1996 Asian Wushu Championships in Manila. Two-time National
    Games gold medalist (1997, 2001). Named one of the 'Top 100 Outstanding Chinese Martial Artists' in
    1995 as the youngest recipient. Retired in December 2001. Serves as executive vice chairman of Binzhou
    Municipal Wushu Association. As of 2026, dispatched by the IWUF as expert coach for Youth Olympics
    training camps.
