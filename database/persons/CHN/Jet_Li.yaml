description:
  en: Chinese martial artist, actor, and philanthropist. Trained as a wushu athlete at the Beijing Shichahai
    Sports School and won multiple national championships with the Beijing Wushu Team between 1974 and
    1979. After retiring from competitive wushu at age 18 due to a knee injury, he made his acting debut
    with Shaolin Temple (1982). Established himself as a leading action star with the Once Upon a Time
    in China series (1991-1993) and went on to star in numerous international films including Lethal Weapon
    4, Romeo Must Die, Hero, and The Expendables series. Master of several wushu styles including changquan
    and fanziquan. Founded One Foundation in 2007 and co-founded Taiji Zen meditation program. Named one
    of Time magazine's 100 most influential people in 2010. Inducted into the Martial Arts History Museum
    Hall of Fame in 2023.
