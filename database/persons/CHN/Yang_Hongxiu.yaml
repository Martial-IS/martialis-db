description:
  en: Chinese Hui Muslim martial artist and Cha Quan master, born in Guanxian, Shandong. Learned Cha Quan
    from masters Zhang Jintang (张金堂) and Ma Laowei (马老维), both renowned Cha Quan practitioners from Guanxian.
    Became the progenitor of the Yang-style branch of Cha Quan (杨式查拳), known for its expansive and generous
    form (舒展大方，势正招圆). In 1915, hired by the Shandong Martial Arts Training Institute to teach Cha Quan
    and Tan Tui. Assisted Ma Liang (马良) in compiling New Chinese Martial Arts (中华新武术), published 1918.
    In 1919, taught at the Chinese Martial Arts Society in Shanghai. Notable students include Wang Ziping,
    Ma Jinbiao, Yu Zhensheng, and Ma Yongkui. Nicknamed 'Big Spear Yang' (大枪杨) for his spear skill and
    'Fast Fist Yang' (快拳杨) for his speed.
