description:
  en: Ip Man (1893–1972) was a Hong Kong martial artist and grandmaster of Wing Chun. He is best known for training Bruce Lee and for systematizing the teaching of Wing Chun in Hong Kong. His students included Wong Shun-leung, Chu Shong-tin, and Bruce Lee.
notes: >-
  Judkins and Nielson give 14 October 1893 (p. 179, after Ip Chun) and 1 December 1972 (p. 262);
  the dates kept here are the better-sourced ones. Captain of a plain-clothes detective unit in
  Foshan 1945–1949 (p. 205). Fled to Hong Kong in 1949; first public class May 1950 (p. 227).
