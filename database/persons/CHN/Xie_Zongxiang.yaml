description:
  en: Chinese martial artist (1852-1930) of Fujian, practitioner of Minghe quan (Whooping Crane fist),
    possibly to be identified with Ryū Ryū Ko; teacher of Higaonna Kanryō.
notes: The identification with Ryū Ryū Ko (Q954330) follows Tokashiki Iken's research and is disputed
  by the Fuzhou Wushu Association, which argues Xie Zhongxiang was of non-aristocratic origin and worked
  as an apprentice shoemaker rather than as the aristocratic bricklayer/basket-weaver of the Ryū Ryū Ko
  oral tradition. See the possibly_same_as entry on Ryū Ryū Ko.
