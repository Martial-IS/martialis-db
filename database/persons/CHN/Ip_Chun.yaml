description:
  en: >-
    Wing Chun teacher, elder son and student of Ip Man. He trained from the age of seven in Foshan,
    moved to Hong Kong in 1962, resumed his studies there and was the first treasurer of the Ving
    Tsun Athletic Association (1967).
notes: >-
  Judkins and Nielson pp. 184-185, 254-259. Teacher and Cantonese opera enthusiast in Foshan; sent
  to the countryside for re-education c. 1958-1959 (p. 255).
