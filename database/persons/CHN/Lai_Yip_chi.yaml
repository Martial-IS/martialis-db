description:
  en: >-
    Wing Chun practitioner and bone-setter from a wealthy Foshan family, student of Lui Yu-chai. He
    first taught in public in 1941, without fees, mostly to working-class students.
notes: >-
  Judkins and Nielson pp. 192-194. Death: 1968 (Huang Xiao Hui and Huang Hong) or 1970, killed by
  Red Guards (Leung Ting); not recorded. The Pan Nam lineage says he also learned an esoteric Wing
  Chun from a stranger met at the Pawnshop Owner's Association (p. 193).
