description:
  en: >-
    Wing Chun teacher in Hong Kong and staff member of the Restaurant Workers Union, Ip Man's first
    official student in Hong Kong (1950). He opened his own school in the mid-1950s with his
    teacher's blessing.
notes: >-
  Judkins and Nielson pp. 227-231, 244. Before Wing Chun he studied Choy Li Fut, White Eyebrow and
  Dragon (teachers not named). Lost the union election in 1953 and regained office in 1954 (pp.
  229, 237).
