description:
  en: Chinese wushu athlete and three-time national all-around champion. Born in Dingxing, Hebei. Trained
    at Beijing Shichahai Sports School under Wu Bin from age 8-9, becoming a founding member of the Beijing
    Wushu Team in 1974. Won 3 consecutive national all-around championships (1981-1983) and accumulated
    over 80 medals. Specialized in Changquan, daoshu, and gunshu. Emigrated to the US in
    1989, founded Wushu West martial arts school in Berkeley, California.
