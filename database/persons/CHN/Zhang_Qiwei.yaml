description:
  en: Chinese Hui Muslim martial arts master from Guanxian, Shandong, considered the representative of
    the Zhang-style branch of Cha Quan. Began studying under master Zhang Qian at age 7; by age 20 had
    achieved mastery of Cha Quan, Hua Quan, Pao Quan, Hong Quan, and Tui Quan. Renowned for his Iron Sand
    Palm and skill with the Tiger-Tail Phoenix-Wing Tang. Despite invitations to serve as martial arts
    instructor for Shandong military governor Ma Liang, he refused, preferring to remain in his hometown
    teaching. His most celebrated student was Chang Zhenfang, who became one of the most influential Cha
    Quan transmitters of the 20th century. Other notable students included Zhang Xitai, Zhang Fengling,
    Zhang Yingzhen, and Zhang Yingjian.
