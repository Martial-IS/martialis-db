description:
  en: Leung Jan (c.1825–1901) was a Chinese martial artist and Wing Chun grandmaster. Known as the 'King
    of Wing Chun' in Foshan, he is one of the earliest well-documented practitioners of Wing Chun. He
    taught Chan Wah-shun and his own son Leung Bik.
notes: >-
  Birth year: 1816 (Leung Ting) or 1826 (Huang Xiao Hui and Huang Hong), per Judkins and Nielson
  pp. 173–174; en-wiki gives 1821. Leung Ting dates his death to 1890 or 1891, in Gulao. Retired to
  Gulao c. 1895 and taught local youths there, the origin of Pin Sun Wing Chun (p. 175).
