description:
  en: Chinese martial artist and wushu coach, described as the father of modern Wushu. From a young age
    in Huzhou, Zhejiang, he practiced Tan Tui and Liu He Quan before studying Cha Quan under Zhang Wenguang
    at Beijing Physical Culture University (1959-1963). Founded the Beijing Wushu Team in 1974 and produced
    more wushu champions than any other coach in China, including Jet Li, Wu Jing, Hao Zhihua, and Hei
    Zhihong. Held positions as Chairman of the Technical Department of the Chinese Wushu Research Institute
    (1986-1992), president of the Beijing Wushu Institute, and top positions in the Chinese Wushu Association,
    Asian Wushu Federation, and International Wushu Federation. One of only 19 9th-level duan masters
    in China. Author of 18 wushu books.
