description:
  en: Chan Wah-shun (c. 1849–1913) was a Chinese martial artist and Wing Chun grandmaster. Nicknamed 'Money
    Changer Wah', he was a student of Leung Jan and the teacher of Ip Man, who became his 16th and last
    student.
notes: >-
  Birth year: sources differ: 1833 (Leung Ting), c. 1836 (en-wiki; also Judkins and Nielson p. 77),
  1849 (Huang Xiao Hui and Huang Hong). Judkins and Nielson (pp. 175–176) judge 1849 more plausible.
  Retired after a stroke in 1911 and returned to his native village in Shunde (Judkins and Nielson
  pp. 177–178); the book does not say where he died, en-wiki has Foshan.
