description:
  en: >-
    Wing Chun teacher in Foshan, second disciple of Chan Wah-shun. He completed Ip Man's early
    training and was the only Wing Chun teacher who taught in public in Foshan in the late 1910s and
    early 1920s.
notes: >-
  Judkins and Nielson: school on Shi Lu Tou Street, Foshan (p. 188); Leung Ting's claim that he
  taught in the back room of an opium den is unsubstantiated (p. 188). His students included Lee
  Shing and, in part, Yiu Choi; Yuen Kay-san and Ip Man practised at his school (p. 189). Retired
  to the home of Yiu Choi (p. 198).
