description:
  en: >-
    Wing Chun practitioner in Foshan from a wealthy family of pigment manufacturers, friend of Ip
    Man. He never taught a class; his only known disciple, Sum Nung, spread his line.
notes: >-
  Judkins and Nielson pp. 197-199. Teachers per most accounts: Fok Bo-chuen, then Fung Siu-ching,
  both said to be students of 'Painted Face' Kam; the book finds no evidence that any of them
  existed (pp. 197-198). No teacher claim recorded. Practised at Ng Chung-so's and Cheung Bo's
  classes (p. 198).
