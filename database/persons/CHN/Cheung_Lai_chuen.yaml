description:
  en: >-
    Creator of Bak Mei (White Eyebrow). Trained in Lee Gar and in Lam Gar under Lin He; he promoted
    the Hakka styles in Guangzhou, was tied to the Nationalists and fled to Hong Kong in 1949.
notes: >-
  Judkins and Nielson pp. 125-129. Earlier teachers: Lam Sek, a doctor, and Li Mung, a Lee Gar
  master (no records). The style's oral tradition adds a wandering monk (p. 125).
