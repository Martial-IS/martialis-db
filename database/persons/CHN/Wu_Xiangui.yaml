description:
  en: >-
    Tea merchant from Fuzhou who settled in Naha in 1912 and taught Fujian White Crane boxing at night
    above his shop. A member of the 1920s karate study groups with Chojun Miyagi, Kenwa Mabuni and
    Shinko Matayoshi; he gave the Nipai (Neipai) kata to Mabuni and Kyoda and was Miyagi's interpreter
    on his 1936 trip to China. Cramer gives 1886–1940.
