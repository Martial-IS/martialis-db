description:
  en: >-
    Legendary Buddhist nun of the Wing Chun creation story, said to have escaped the destruction of
    the Shaolin Temple and taught Yim Wing-chun. No credible historical record names her.
notes: >-
  Judkins and Nielson pp. 8-10. She first appears as a traitor in an 1890s novel and becomes a
  heroine only in the 1930s (p. 9).
