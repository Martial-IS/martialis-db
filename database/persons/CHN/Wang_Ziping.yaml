description:
  en: Chinese Hui Muslim martial artist, Cha Quan master, and renowned traumatologist. Born in Cangzhou, Hebei. Learned Cha Quan under Yang Hongxiu, the progenitor of the Yang-style branch of Cha Quan, and Huaquan under Sha Baosing. In 1928, appointed first Head of the Shaolin Division at the newly established Central Guoshu Institute in Nanjing. Later served as Vice Director of the Institute. Vice Chairman of the Chinese Wushu Association (1958-1966). Chief Referee of the First National Wushu Exhibition (1959). Renowned for defeating foreign strongmen including the Russian Kang Tai'er in 1919. Authored 'Twenty Fist Methods' and 'Twenty Postures to Dispel Illness and Lengthen Life' (1958). Also a renowned bone-setter in Shanghai. One of the 'Five Northern Tigers' sent south in 1929. Died in 1973.
