description:
  en: Chinese Hui Muslim martial artist and Cha Quan master, born in Guanxian, Shandong. Learned Cha Quan
    from the renowned master Zhang Qiwei as a youth, becoming the leading practitioner of the Zhang-style
    Cha Quan lineage. Entered the Nanjing Central Guoshu Institute in 1930, where his swordsmanship earned
    the admiration of director Zhang Zhijiang. After the Marco Polo Bridge Incident in 1937, joined Feng
    Yuxiang's anti-Japanese 44th Brigade martial arts team as captain, fighting at Fangshan and Liulihe.
    Invited to teach in Beijing in 1956, he became Vice Chairman of the Beijing Wushu Association (1960)
    and contributed to national wushu curriculum development. Authored Four Roads Cha Quan and Roads 1-3
    Cha Quan, and contributed to national wushu textbook and competition rules compilation. Broke the
    tradition of teaching only Hui Muslims, systematically transmitting Cha Quan to students of all backgrounds.
    His most distinguished student was Zhang Wenguang, who became China's first wushu professor. Died
    in 1979.
  zh: 中国回族武术家、查拳大师，山东冠县人。自幼随查拳名家张其维习武，成为张氏查拳门下的佼佼者。 1930年入南京中央国术馆进修，剑术深得馆长张之江赏识。1937年七七事变后加入冯玉祥部四十四旅 抗日大刀队任队长，在房山琉璃河一带战斗中杀敌。1956年应邀赴京任教，1960年任北京市武术协会
    副主席。编著《四路查拳》《一、二、三路查拳》，参与国家武术教材和竞赛规则编写。打破查拳 不收汉族人的惯例，系统传授查拳技艺。最杰出的弟子为张文广（中国第一位武术教授）。1979年逝世。
