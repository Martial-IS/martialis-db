description:
  en: Wong Wah-bo was a martial artist and opera singer of the late Qing Dynasty, belonging to the Red
    Boat Opera Company. A notable figure in the development of Wing Chun, he was a student of Leung Lan-kwai
    and, together with Leung Yee-tai, taught Leung Jan.
