description:
  en: >-
    Wing Chun practitioner in Foshan, son of a pharmacy owner, student of Yuen Chai-wan and Ng
    Chung-so. He did not teach in public; with his brother he opened the club where Ng Chung-so
    taught.
notes: >-
  Judkins and Nielson p. 198: native of Bao'an County; one son and five other disciples. The
  'Three Heroes of Wing Chun' title (with Ip Man and Yuen Kay-san) is a later invention (pp.
  198-199).
