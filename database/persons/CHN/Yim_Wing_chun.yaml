  zh-Latn: Yan Yongchun
aka:
  en:
    - Yim Wing Chun
description:
  en: >-
    Legendary heroine of the Wing Chun creation story: a tofu merchant's daughter taught by the nun
    Ng Mui, who passed the art to her husband Leung Bok-chau. The story is a late invention.
notes: >-
  Judkins and Nielson pp. 8-10. The Ip family version continues: Leung Bok-chau to Leung Lan-kwai
  to Wong Wah-bo (pp. 8-9, 172). Leung Bok-chau has no record.
