description:
  en: >-
    Tibetan White Crane master from Sanshui, Guangdong, who named the Bak Hok Pai branch. He taught
    in Guangzhou in the 1920s, moved to Hong Kong in 1930 and to Macau after the Japanese
    occupation. Also an author, poet, artist and doctor of traditional Chinese medicine.
notes: >-
  Judkins and Nielson pp. 234-235; en-wiki Tibetan White Crane. Teacher: Zhu Ziyao in Jiangxi
  Province (book p. 234) or Wong Lam-hoi (en-wiki); the accounts differ, so no teacher claim.
  en-wiki gives his death as 1968. Ran a school in Guangzhou with Gu Ru Zhang in the 1920s (p.
  234).
