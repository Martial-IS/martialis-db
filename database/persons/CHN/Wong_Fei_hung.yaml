description:
  en: >-
    Hung Gar teacher and doctor in Foshan and Guangzhou, son and student of Wong Kei-ying. A
    military and militia instructor as a young man, he later ran the Po Chi Lam clinic in Foshan;
    novels and over sixty films made him a folk hero.
notes: >-
  Judkins and Nielson pp. 21, 58, 70-71, 76-77, 86, 118, 222. Very little reliable information
  about him survives (p. 70). Modern Hung Gar descends from his lineage (p. 86).
