description:
  en: >-
    James Yimm Lee (1920–1972) was an American martial arts pioneer, teacher, author, and publisher. No
    relation to Bruce Lee, he was already an established kung fu and iron-palm instructor in Oakland when he
    chose to train with Bruce, twenty years his junior; the two opened the Oakland branch of the Jun Fan Gung
    Fu Institute, and James taught jeet kune do in his garage. He was one of three students Bruce certified
    as instructors, and authored 'Wing Chun Kung Fu' (1972) with a foreword by Bruce Lee.
notes: >-
  The relationship with Bruce Lee ran both ways: the sources call James Bruce's mentor, partner and training
  partner, and also say he trained with Bruce and was certified by him. He was twenty years older and already
  an established teacher when they met (Like Water: first contact in mid-1962).
