description:
  en: American martial artist, researcher, and author of The Kanō Chronicles. Director of the US Embassy
    Judo Club, Tokyo. Board Member of the Tokyo Judo Federation. Advisor to the International Martial
    Arts Federation (IMAF). Certified judo instructor, All Japan Judo Federation. Former US Army political-military
    affairs officer and US State Department Foreign Service officer. Direct student of Sato Shizuya in
    Nihon Jujutsu for over 20 years. Also practices Shintō Musō ryū jōdō, Hapkidō, and Takeuchi ryū jūjutsu.
