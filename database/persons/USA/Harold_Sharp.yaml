description:
  en: American judoka and author of books on judo
notes: Promoted to 10th dan by Nanka Judo Yudanshakai on October 31, 2020. Inducted into USA Judo Hall of Fame in 2019. Won the Japan Foreigner Judo Championship in 1954. Co-authored "The Sport of Judo" and "The Techniques of Judo" which sold over 250,000 copies worldwide.
