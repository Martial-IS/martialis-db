description:
  en: Chuck Norris (1940–2026) was an American martial artist, actor, and founder of the Chuck Norris System (formerly Chun Kuk Do) and American Tang Soo Do. He served in the US Air Force in South Korea, where he began training in Tang Soo Do. He became undefeated world middleweight karate champion and trained regularly with Bruce Lee, who invited him to co-star in Way of the Dragon (1972). He later became a major action film and television star.
