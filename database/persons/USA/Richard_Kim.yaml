  en: 'American martial artist and founder of the Zen Bei Butoku Kai. A student of Daito-ryu master Kotaro Yoshida, from whom he received the menkyo kaiden, Kim introduced Masutatsu Oyama to Yoshida and was widely regarded as the foremost martial arts historian in the US.

'
