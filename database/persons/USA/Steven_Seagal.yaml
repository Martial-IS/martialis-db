description:
  en: American actor, producer and martial artist. He studied karate under Fumio Demura before taking up aikido under Harry Ishisaka at the Orange County Aikikai. He received his 1st dan from Koichi Tohei in the summer of 1974, then moved to Japan where, with his wife Miyako Fujitani, he ran the Tenshin Dojo in Osaka as the first westerner to operate an aikido dojo in Japan. He returned to the United States in the early 1980s and became a film actor from 1988 (Above the Law). The Aikido Journal Encyclopedia records him at 6th dan.
  ja: アメリカの俳優・武道家。出村文男の下で空手を、ハリー・石坂の下で合気道を学んだ。1974年夏に藤平光一から初段を許され、その後来日して妻の藤谷美也子とともに大阪で天心道場を運営し、外国人として初めて日本で合気道道場を主宰した。1980年代前半に米国へ戻り、1988年から俳優として活躍。合気道ジャーナル百科事典は6段と記録している。
