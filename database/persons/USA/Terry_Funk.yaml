description:
  en: American professional wrestler and actor, younger brother of Dory Funk Jr. and son of Dory Funk.
    Together with his brother he trained Anton Geesink in Amarillo, Texas for about a month in late 1973,
    after All Japan Pro Wrestling recruited Geesink ahead of his professional wrestling debut.
notes: Entry scope is the teacher relationship with Anton Geesink (with his brother Dory Funk Jr.); his
  long professional wrestling career is summarized in the linked Wikipedia article.
