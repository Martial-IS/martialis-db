description:
  en: American judoka and Olympic bronze medalist (1996, 2004), World Champion (1999), and 7th degree black belt. He trained under his father James Pedro Sr. He later coached Kayla Harrison (2x Olympic gold medalist), Travis Stevens (Olympic silver medalist), and Ronda Rousey (Olympic bronze medalist) at Pedro's Judo Center in Wakefield, Massachusetts. He was the head coach of the US Olympic Judo team in 2012.
