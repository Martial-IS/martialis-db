notes: 'Donn F. Draeger (1922-1982) was an American martial artist, author, and pioneer in the study of Asian martial arts.

  He served in the US Marine Corps during World War II and the Korean War, achieving the rank of lieutenant colonel.

  In 1967, he became the first non-Japanese practitioner to enter the Tenshin Shoden Katori Shinto-ryu school under Risuke Otake.

  He also trained in Chinese martial arts (xingyiquan and baguazhang) under Wang Shujin at Meiji Shrine in Japan.

  Draeger was a prolific author who wrote extensively about martial arts, co-founding the International Hoplology Society.

  He played a key role in introducing Asian martial arts to Western audiences through his writing and teaching.

  He held black belts in judo, karate, and kendo, and was known for his rigorous academic approach to martial arts studies.

'
