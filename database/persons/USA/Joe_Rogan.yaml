  en: 'American podcaster, UFC color commentator, and martial artist. Host of The Joe Rogan Experience, consistently one of the most popular podcasts worldwide. A black belt in taekwondo, Brazilian jiu-jitsu (gi under Jean Jacques Machado), and no-gi BJJ (10th Planet under Eddie Bravo). Rogan''s influential podcast and UFC commentary have made him one of the most prominent martial arts advocates and influencers in the world.

