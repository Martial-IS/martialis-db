description:
  en: "South Korean-born taekwondo grandmaster and founder of the Jae Hun Kim Tae Kwon Do Institute. He\
    \ was personally trained by General Choi Hong Hi, founder of modern Taekwon-do, and Grandmaster Jung\
    \ Tae Park. He received his Grandmaster rank from Kukkiwon in 1993. Joe Rogan trained under him at\
    \ the Boston institute, earning his black belt at age 15. \n\nKim earned a B.S. from MIT and an MBA\
    \ from Harvard Business School, later serving as Vice President at General Electric. He served as\
    \ a Captain in the Korean Air Force and coached the US National Taekwondo Team in 1979. His institute\
    \ grew to 22 schools across the US, Singapore, Korea, Ireland, and China. He was named Grandmaster\
    \ of the Year by Taekwondo Times in 2013.\n"
