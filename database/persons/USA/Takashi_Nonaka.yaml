description:
  en: >-
    Hawaiian aikido teacher in Hilo. He began aikido under Koichi Tohei in 1955, served as Tohei's
    uke and as Morihei Ueshiba's translator during the 1961 Hawaii visit, and stayed with Tohei's
    Ki Society after 1974.
