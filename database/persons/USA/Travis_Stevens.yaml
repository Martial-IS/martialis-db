description:
  en: American judoka, 2016 Olympic silver medalist in the -81 kg division, and 6th dan black belt in judo. Holds a black belt in Brazilian jiu-jitsu under John Danaher and Renzo Gracie, awarded by Danaher in November 2013. He trains at and teaches out of FUJI Gym in Wakefield, Massachusetts, and was coached by Jimmy Pedro.
