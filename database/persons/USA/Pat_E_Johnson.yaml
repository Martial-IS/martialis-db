description:
  en: American Tang Soo Do grandmaster (9th dan) and pioneering sport-karate figure. Began training in
    Korean Tang Soo Do Moo Duk Kwan in 1963 while stationed in South Korea as a US Army chaplain, earning
    his black belt in about thirteen months. Rose to chief instructor of Chuck Norris's Sherman Oaks school
    (1968), captained Norris's undefeated black belt competition team (1968-1973), won the 1971 national
    Tang Soo Do title, and created the penalty-point system still used in karate tournaments. Served as
    executive vice president of Norris's National Tang Soo Do Congress (1973-1979) and then of the United
    Fighting Arts Federation (1979-1986), before leaving over philosophical differences and reforming
    the NTC, which he led until his death. Choreographed the fight scenes and played the referee in the
    Karate Kid films, training Ralph Macchio, Pat Morita and William Zabka for their roles.
