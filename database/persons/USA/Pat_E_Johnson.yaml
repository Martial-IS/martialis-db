notes: 'Johnson''s post-1986 leadership of the reformed National Tang Soo Do Congress is recorded in the
  NTC description rather than as an officers entry: available sources disagree on his pre-1979 NTC title
  (executive vice president vs president) and none names his reformed-congress title. A Tang Soo Do Masters
  profile describes him as heading the reformed congress, though still without naming a title. His Korean-era
  instructor (1963-65 army service, corroborated by two independent sources) is left unidentified: Wikipedia
  is the only source naming him, and it contradicts itself - body text ''Kang Lo Hee'' vs achievements
  list ''Kang Do Hee'', the same list that also mislabels the art as taekwondo; the obituary and the Tang
  Soo Do World profile name no instructor at all. Research lead, untested: Shin Jae Chul taught Moo Duk
  Kwan to US soldiers at Osan Air Base from 1958 - within Johnson''s 1963-65 Korea service window - but
  Johnson''s exact posting in Korea is not recorded in our sources and nothing found connects the two
  men.'
