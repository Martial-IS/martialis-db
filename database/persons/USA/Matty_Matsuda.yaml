description:
  en: Japanese-American judoka and professional wrestler. He moved to America as a teenager, giving judo
    exhibitions. He was inspired by Frank Gotch to take up professional wrestling. After a famous match
    with Roy 'Pop' Moore, he became Moore's judo instructor. He wrestled across the Midwest and claimed
    the welterweight championship.
