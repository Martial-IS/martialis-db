description:
  en: American Shotokan Karate instructor based in Revere, Massachusetts. Founded East Coast Karate. Taught
    competitive Shotokan Karate; John Paul Salvitti trained under him from his competitive years onward
    and earned a 5th degree black belt. Also appeared as a fighter in Mortal Kombat. Introduced Salvitti
    to Donnie Yen after seeing Yen on the cover of Inside Kung Fu in 1982. Still teaching as of 2015.
