description:
  en: American professional wrestler and wrestling trainer, son of Dory Funk and brother of Terry Funk.
    Ran the Funking Conservatory wrestling school in Amarillo, Texas, and trained Anton Geesink together
    with Terry Funk for about a month in late 1973 before Geesink's professional wrestling debut.
notes: Catch wrestling lineage attributed to Anton Geesink is via this entry and Terry Funk; the actual
  weightlifting-based amateur wrestling background of the Funks is described in the linked Wikipedia article.
