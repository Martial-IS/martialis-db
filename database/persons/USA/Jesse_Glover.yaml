description:
  en: 'Jesse Glover (1935–2012) was an African-American martial artist and Bruce Lee''s first student.
    He met Lee in 1959 at Edison Technical College in Seattle. He wrote the memoir ''Bruce Lee: Between
    Wing Chun and Jeet Kune Do'' and was a champion judoka.'
