description:
  en: American aikido teacher, founder of the Orange County Aikikai (first as the Westminster Aikido School in 1964) and its chief instructor until his early death. An early instructor in the Orange County, California area, he contributed greatly to the development of aikido in Southern California. He trained under Koichi Tohei, who supported him in founding the Orange County Aiki Kai; he was affiliated with the Ki Society for a period before becoming independent. He had risen to the rank of godan (5th dan) by the time of his death and was the first aikido teacher of Steven Seagal.
