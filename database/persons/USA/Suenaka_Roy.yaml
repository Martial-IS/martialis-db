description:
  en: American martial arts practitioner and author (1940-2020), 1st generation student of aikido founder Morihei Ueshiba and student of Hohan Soken in Matsumura Seito Hakutsuru Shorin-ryu; founder of Wadokai Aikido in 1975.
notes: 'Suenaka began martial arts training with his father Warren Suenaka (family jiujitsu and kenjitsu) and also studied under Henry Okazaki and James Mitose. He attended Koichi Tohei''s aikido demonstrations in 1953 and took up kendo in 1955. Transferred to Tachikawa Air Base, Japan in 1961, he trained directly under Morihei Ueshiba at the Hombu dojo and also trained at the Kodokan under Kyuzo Mifune. He was transferred to Naha, Okinawa in 1961 where he set up his own dojo. His official biography adds further dated instructors: Goju-ryu under Eiichi Miyazato (1967-1972), Kyokushin karate under Masutatsu Oyama (1961-1963) and Kobayashi karate under Chosin Chibana (1962), plus masanobu Shinjo/Kinjo Goju-ryu study (1964-1965) and aikido under Koichi Tohei (1953-1976). He founded Wadokai Aikido in 1975 in Charleston, South Carolina.'
