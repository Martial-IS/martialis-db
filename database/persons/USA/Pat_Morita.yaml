description:
  en: American actor and comedian, known for Arnold on Happy Days and Oscar-nominated as karate mentor
    Mr. Miyagi in The Karate Kid (1984) and its sequels. He had no martial arts experience before the
    films; for the first production he was trained in Goju-ryu karate alongside Ralph Macchio by fight
    coordinator Pat E. Johnson, while Fumio Demura - one of the inspirations for the Miyagi character
    - doubled his fight scenes.
