notes: >-
  Managing editor of Aiki News/Aikido Journal from 1990 for six years; in Japan 1987-1997; with Meik Skoss runs a dojo in New Jersey. Also Tomiki aikido 4th dan (Jiyushinkai, JAA) and tankendo 3rd dan. Her Shinto Muso-ryu teacher's teacher was Nishioka Tsuneo (book introduction).
