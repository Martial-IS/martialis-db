description:
  en: >-
    American aikido teacher, a student at the Aikikai Hombu Dojo in Tokyo
    and later a leading aikido teacher in Northern California.
notes: >-
  Birth year unsettled: Wikipedia gives 1937 with a citation-needed tag,
  Wikidata 1937-03-10 without a source, and the 2002 Aikido Journal
  introduction says he was 22 when he sailed for Japan in 1962. First aikido
  teacher Robert Tann and judo teacher Yasutoshi "Moon" Watanabe have no
  records. Students named by Wikipedia (George Leonard, Richard
  Strozzi-Heckler, Dan Millman) and colleagues Frank Doran and Bill Witt are
  not in the database a the time of writing.
