notes: Charles Yerkow (born 1912) was an early American judo pioneer and author. Emilio Bruno (1972) describes
  him as "one of our very excellent judo pioneers" who "published the first judo book in the U.S. during
  World War II" and "did much to throw proper light on judo as a sport and method of self defense in the
  U.S." Bruno also notes that "he did not receive the credit he deserved because the skills he demonstrated
  in his book didn't come up to the perfection expected by old, critical Black-Belters of the early days."
  The cover of Modern Judo states he was attracted to judo "more than twenty years ago" (suggesting he
  began around the late 1920s). No death date has been identified.
