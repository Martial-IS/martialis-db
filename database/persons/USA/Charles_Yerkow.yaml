description:
  en: American judo pioneer and author born in 1912. He began practicing judo in the late 1920s and became
    an early instructor of the art in the United States. He taught judo at Queens College and at various
    YMCA clubs in the New York City area. He served as vice-chairman of the National AAU Judo Committee
    and was awarded a second-degree black belt by the Kodokan in Tokyo. Yerkow published six books on
    judo, including the three-volume Modern Judo series (Basic, Advanced, and 40 Gokyo Techniques), Sport
    Judo, Judo Katas, and Official Judo. Emilio Bruno described him in a 1972 letter as "one of our very
    excellent judo pioneers" who "published the first judo book in the U.S. during World War II."
