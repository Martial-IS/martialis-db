description:
  en: American judoka and member of the Strategic Air Command (SAC) Judo program. He won a silver medal
    at the US National Championships in Chicago in 1958 (over 81kg) and was a member of the 1958 US Pan-American
    Judo Team. He was an early instructor of James Pedro Sr., who later became an Olympic alternate and
    father/coach of World Champion Jimmy Pedro Jr.
