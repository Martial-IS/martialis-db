notes: 'AnnMaria De Mars (born 1958) is an American judoka and statistics professor.

  She became the first American to win a World Judo Championships in 1984, winning the -56 kg division in Vienna.

  She trained under Yoshimi Osawa at Waseda University in Tokyo in 1976 as an exchange student.

  De Mars holds a PhD in educational psychology and statistics from the University of California, Santa Barbara.

  She was promoted to 6th dan in judo and continues to be involved in the judo community as an instructor and advocate.

'
