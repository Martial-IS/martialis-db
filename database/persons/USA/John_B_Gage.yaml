description:
  en: Senior Instructor (Shihan) of the International Nihon Jujutsu Association (INJA). Nihon Jujutsu
    Kyoshi 7 Dan and Judo Renshi 4 Dan (Kokusai Budoin IMAF), Judo 3 Dan (All Japan Judo Federation).
    Member of US Embassy Judo Club since 1986, Program Director 2011-2015. Director of Kokusai Budoin
    IMAF Headquarters Japan. Editor of Gendo Newsletter and the INJA websites.
