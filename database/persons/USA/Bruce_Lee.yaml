description:
  en: Bruce Lee (1940–1973) was a Hong Kong and American martial artist, actor, and filmmaker. He founded Jeet Kune Do, a hybrid martial arts philosophy drawn from his training in Wing Chun, boxing, and other disciplines. He is credited with popularizing Chinese martial arts films globally and is regarded as one of the most influential martial artists in cinema history.
