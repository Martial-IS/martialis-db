description:
  en: American actor best known as Johnny Lawrence in The Karate Kid (1984), its sequels, and Cobra Kai
    (2018-2025), which he also co-executive produced. He had no martial arts training before being cast
    in The Karate Kid - he was a high-school wrestler - and was trained for the film by Pat E. Johnson,
    Chuck Norris's chief instructor. He continued training with Johnson after the film ended and returned
    to karate and taekwondo training to prepare for Cobra Kai, crediting karate conditioning with healing
    a wrestling back injury.
