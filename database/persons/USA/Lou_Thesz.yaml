description:
  en: >-
    American professional wrestler and coach, several times world heavyweight champion. After
    Greco-Roman wrestling with his father he trained nearly four years under George Tragos, then under Ed
    "Strangler" Lewis, his trainer and manager. He was a hand-to-hand combat instructor at Fort Lewis in
    the Second World War and late in life head coach of the CACC Snake Pit Japan.
