description:
  en: >-
    American bare-knuckle boxer, possibly a former slave, who came to London in 1809. Trained by Bill
    Richmond, he fought Tom Cribb for the English title in 1810 and 1811 and lost both times, the first
    amid a crowd invasion and accusations of a fix.
