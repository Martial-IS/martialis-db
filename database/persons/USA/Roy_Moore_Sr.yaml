description:
  en: American wrestling and judo coach, known as 'Pop' Moore. Trained by Frank Gotch in wrestling and
    by Manjiro Matsuda in judo. He became a world wrestling champion and later a 5th degree judo black
    belt. At Jigoro Kano's request, he implemented the weight class system in judo. He coached the Japanese
    Olympic wrestling team in 1932 and was the foster father and judo instructor of Emilio 'Mel' Bruno.
