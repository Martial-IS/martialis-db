description:
  en: American judoka, founder of Southern Pacific Judo Yudanshakai, and USJF Hall of Fame inductee
notes: Kenneth Kuniyuki was one of the first Kudans (9th dan) promoted in the United States Judo Federation.
  He founded the Southern Pacific Judo Yudanshakai in 1990 and served on the Board of Governors and as
  chairman of the Board of Examiners Promotion Committee. He was the Head Sensei of Seinan Judo Dojo for
  over 45 years and served as U.S. National Judo Coach for multiple international competitions including
  the 1956 World Judo Championships in Tokyo.
