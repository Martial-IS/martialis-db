description:
  en: American judo pioneer and the first non-Asian in the United States to receive 5th dan (1954)
    and later 6th dan. He was taught judo by his foster father Roy 'Pop' Moore and received his 1st dan
    certified by Jigoro Kano in 1935 (awarded by the Kodokan, not as a personal student). He was appointed
    supervisor of Judo and Combative Measures at Strategic Air Command headquarters in 1951, creating
    the SAC Judo program that trained thousands of airmen. He coached the US Judo team at the 1958 and
    1961 World Championships and prepared the USAF team for the 1964 Olympic tryouts. He was known as
    the 'father of Air Force Judo'.
