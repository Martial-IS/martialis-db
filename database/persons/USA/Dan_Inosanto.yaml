description:
  en: Dan Inosanto (born 1936) is a Filipino-American martial arts instructor and actor. He was one of
    three people appointed to teach at the Jun Fan Gung Fu institutes under Bruce Lee, and after Lee's
    death became the principal spokesperson and historian for Jeet Kune Do. He also holds expertise in
    Filipino Martial Arts (Kali-Eskrima), Shooto, Muay Thai, and Brazilian Jiu-Jitsu.
