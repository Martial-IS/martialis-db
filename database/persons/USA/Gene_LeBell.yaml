notes: 'Gene LeBell (1932-2022) was an American judoka, stuntman, actor, and professional wrestler.

  Nicknamed "Judo Gene" and "The Godfather of Grappling", he is credited with popularizing grappling in professional fighting circles.

  He worked on over 1,000 films and TV shows as a stuntman and actor, and authored 12 books.

  In addition to Ishikawa Takahiko, he also trained under Shig Tashma, Larry Coughran, Kenneth Kinyuki, and Fuji Nazawa in the U.S.

  He was AAU National Judo Champion in 1954 and 1955.

  Known for his catchphrase "When in doubt, choke him out!" and for wearing pink judo gis.

  Trained many notable martial artists including Chuck Norris, Benny Urquidez, and Ronda Rousey.

'
