description:
  en: American actor best known as Daniel LaRusso in The Karate Kid (1984) and its sequels, and in Cobra
    Kai (2018-2025). Apart from four jiu-jitsu lessons as a child, he had no martial arts experience before
    The Karate Kid; before filming he was trained in Okinawan Goju-ryu karate by fight coordinator Pat
    E. Johnson. He performed the majority of his own stunts in the films and, decades later, on Cobra
    Kai.
