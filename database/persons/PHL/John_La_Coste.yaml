description:
  en: John La Coste (Juanito Lacoste) was a Filipino martial arts master. Considered by many
    to be the deadliest Filipino master living in Stockton, California, his system was heavily based in
    the Moro Moro bladed arts. He is listed among the great escrimador masters alongside Dan Inosanto,
    and his techniques form the basis of the Inosanto-LaCoste Kali system taught at the Inosanto Academy.
notes: >-
  Learned various Filipino martial arts systems in the Philippines, teachers unidentified; not documented
  in available sources. Dates 1888-1977 appear only in a Dragon Martial Arts Academy Facebook photo post
  ; not recorded until a citable source gives them. Dan Inosanto's own
  books (e.g. The Filipino Martial Arts, 1980) are the likeliest place.
