description:
  en: Norwegian judo pioneer and overrettssakfører (senior public prosecutor) born January 7, 1905 in Oslo. He learned jujutsu during World War II in the Norwegian resistance movement (Milorg) and continued training after the war. He transitioned from jujutsu to judo around 1951, studying through books (Charles Yerkow's 1947 Modern Judo among them) and annual trips to Copenhagen. He co-founded the Norwegian Judo and Jiu-Jitsu Club (NJJK) on October 12, 1960, serving as its first chairman until 1964. He was among the initiators of the Norwegian Judo Federation in 1967 but declined the presidency. He was awarded 1st dan in 1956, 2nd dan in 1959, and 3rd dan in 1962, and received honorary 4th dan in 1975. He died on January 9, 1985, two days after his 80th birthday. He is often called "judoens far" (father of judo) in Norway, a simplification but one that captures his central role in establishing judo as a lasting activity.
