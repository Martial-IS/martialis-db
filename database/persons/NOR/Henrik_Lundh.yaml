notes: Henrik Lundh (1905-1985) should not be confused with Henrik Julius Lundh (1894-1985), a civil servant and jurist with the same name who was a byråsjef in the Ministry of Justice, State Conciliator, and stipendiary magistrate. The civil servant Henrik Lundh received his doctorate in law, sat in the exile government, and died in February 1985. Our Henrik Lundh was an overrettssakforer who died January 9, 1985. Sam Melberg (1912-1998) was a key figure in early Norwegian judo, starting jujutsu courses in Halden in 1940 and moving to Oslo in 1941. Lundh and Melberg continued training together after the war, but there is no direct quote from Lundh about Melberg being his teacher - the relationship is described in the JudoMania article's narrative. Lundh sewed his own judogi and helped pack sawdust into mats in a basement at Bislett Bad before real mats arrived in 1961. He was also active in friluftsliv, rowing, motorcycles, veteran cars, and gardening. He was an honorary member of De Norske Studenters Roklubb.
