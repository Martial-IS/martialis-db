description:
  en: 'French Kyokushin karate master who brought Kyokushinkai to Canada. Lesourd trained directly under
    Mas Oyama at the Oyama Dojo in Japan from 1956 to 1960, earning the rank of 3rd dan (Sandan) and the
    title of Branch Chief for Canada. He established the first Kyokushin dojo in Canada in Montreal in
    1968 and later founded Samourai Karate in 1973. Among his students were Gilles Dufour (his successor),
    Andrey Coulombe, Roman Szyrajew, John Goff, and others who would go on to become influential figures
    in Canadian Kyokushin.

    '
  fr: 'Maître de karaté Kyokushin français ayant introduit le Kyokushinkai au Canada. Lesourd s''est entraîné
    directement sous Mas Oyama au Oyama Dojo au Japon de 1956 à 1960, obtenant le rang de 3e dan (Sandan)
    et le titre de chef de section pour le Canada. Il a établi le premier dojo Kyokushin au Canada à Montréal
    en 1968 et a ensuite fondé le Samourai Karate en 1973. Parmi ses élèves figuraient Gilles Dufour (son
    successeur), Andrey Coulombe, Roman Szyrajew, John Goff, et d''autres qui deviendront des figures
    influentes du Kyokushin canadien.

    '
