description:
  en: >-
    French master-at-arms in savate and canne who founded his own walking-stick and umbrella
    self-defence method around 1898 in Geneva, where he had a school of arms. He was the stick-fighting
    instructor of Barton-Wright's Bartitsu Club in London, opened his own academy at 18 Berner Street in
    1903, and returned to Geneva in 1912. His wife Marguerite, his assistant instructor, developed an
    umbrella self-defence method.
notes: >-
  No source names his own teachers; Green and Svinth (pp. 219–220) say he taught Charlemont's style of
  savate in Geneva. Green and Svinth and en Wikipedia's Bartitsu article call him Swiss (Swiss Army);
  en and fr Wikipedia give French birth and French artillery service from 1886. en Wikipedia gives 22
  November 1943 for his death and Wikidata 22 September, so only the year is recorded. Green and
  Svinth give 1869 for his birth.
