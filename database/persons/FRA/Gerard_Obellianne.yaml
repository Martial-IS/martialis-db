description:
  en: French aikido teacher born in Rabat in 1942, a student of Georges Stobbaerts from 1967/68 who took
    over direction of the Budo Club du Maroc when Stobbaerts left Morocco in 1970. His decisive training
    came under Hirokazu Kobayashi, whom he followed from 1970 to 1982 and who appointed him delegate of
    the Aikikai Osaka Hombu for Morocco (1972-1980); from 1982 he followed the teaching of Nobuyoshi Tamura.
    After the Budo Club du Maroc closed he co-founded the Bu Iku Kan club in Casablanca with Jean Visconti.
    He returned to France in 1987, creating a club at the Mont-de-Marsan air base, and later served as
    co-secrétaire of the FFAB's CSDGE Aikido and as a member of the FFAB's Conseil de l'Aïkido.
  pt: Professor francês de aikido nascido em Rabat em 1942, aluno de Georges Stobbaerts desde 1967/68
    que assumiu a direção do Budo Club du Maroc quando Stobbaerts saiu de Marrocos em 1970. A sua formação
    decisiva veio com Hirokazu Kobayashi, que seguiu de 1970 a 1982 e que o nomeou delegado do Aikikai
    Osaka Hombu para Marrocos (1972-1980); a partir de 1982 seguiu o ensino de Nobuyoshi Tamura. Depois
    do fecho do Budo Club du Maroc co-fundou o clube Bu Iku Kan em Casablanca com Jean Visconti. Regressou
    a França em 1987, criando um clube na base aérea de Mont-de-Marsan, e serviu mais tarde como co-secretário
    da CSDGE Aikido da FFAB e como membro do Conselho de Aikido da FFAB.
notes: Obellianne was born in Rabat to a French family (grandfather sent to Morocco before WWII; father
  studied near Nancy then taught in Morocco) and worked in the French education system in Morocco as instituteur,
  professeur, conseiller pédagogique and inspecteur. In 1970 there was a falling-out between Stobbaerts
  and Tamura at the Budo Club du Maroc; Tamura subsequently went with M'Barek Alaoui and Emile Metzinger,
  who left Stobbaerts to create the Syu do kan. Obellianne taught aikido at the École Normale Hébraïque
  of Casablanca, where Jean-Marc Duclos substituted for him for a few months (Duclos, dafina forum 2008).
  The Aikido Journal interview dates Stobbaerts' departure from Morocco to 1970, while Stobbaerts' own
  sources say 1971. After returning to France in 1987 he taught at a lycée near Mont-de-Marsan and created
  a club at the air base. He is described in the dafina post as 'technicien régional de la ligue Aquitaine
  d'une des 2 fédérations française d'aïkido'.
