description:
  en: >-
    French boxing master, son and successor of Joseph Charlemont at the head of the Académie de boxe in
    the rue des Martyrs until his death. He beat the English sailor Jerry Driscoll in Paris in 1899 and
    trained many French boxing teachers, among them Pierre Baruzy.
notes: >-
  Birth date: fr Wikipedia gives 21 November 1862; his father's 1899 book gives 22 November.
