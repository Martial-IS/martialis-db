notes: >-
  The Adams lessons followed the 1838 Swift–Adams fight at Charenton (fr Wikipedia). Dumas placed them in
  London; Charlemont, from Lecour himself, says Paris. Lecour also took part in the 1846–1847 savate and
  boxing exhibitions with English boxers. fr Wikipedia has him learn canne and bâton from Pisseux;
  Charlemont (p. 46) names Leboucher.
