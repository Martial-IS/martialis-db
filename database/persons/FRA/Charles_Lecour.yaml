description:
  en: >-
    French savate and canne master who joined savate kicks with English boxing punches to form French
    boxing. He learned savate from Michel Casseux, canne and bâton from Leboucher, and took boxing lessons
    from the English professional Adams in Paris. With his brother Hubert he opened a salle in the passage des Panoramas in 1832 and
    taught many aristocratic and literary students. He left the salle to Hubert in 1848 and stopped
    teaching in 1884.
  fr: >-
    Maître de savate et de canne qui réunit les coups de pied de la savate et les coups de poing de la
    boxe anglaise en boxe française. Élève de Michel Casseux pour la savate et de l'Anglais Adams pour la
    boxe, il ouvre en 1832 avec son frère Hubert une salle passage des Panoramas.
