description:
  en: French judoka and teacher, one of the reputed French professors and judoka around whom Ichiro Abe,
    technical advisor of the Shudokan club in Toulouse (1951-1953), reinforced the rayonnement of Kodokan
    judo in France. Michel Brousse counts him among the rare champions of the time who practised the Kodokan
    "art de la souplesse" against the Kawaishi method.
  fr: Judoka et professeur français, l'un des professeurs et judokas français réputés autour desquels
    Ichiro Abe, conseiller technique du club Shudokan de Toulouse (1951-1953), renforça le rayonnement
    du judo Kodokan en France. Michel Brousse le compte parmi les rares champions qui pratiquaient alors
    l'"art de la souplesse" du Kodokan, contre la méthode Kawaishi.
