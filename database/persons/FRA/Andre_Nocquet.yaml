  fr: Judoka français, 1er dan élève de Mikinosuke Kawaishi. Fonda en 1943 la première association de judo du Sud-Ouest en Charente, puis en 1946 le Judo-Club d'Angoulême. Fit venir Michigami Haku et Awazu Shōzō pour enseigner dans la région.
