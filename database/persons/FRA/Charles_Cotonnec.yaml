description:
  en: >-
    Breton physician and cultural nationalist who, with the Cornish folklorist William Tregoning Hooper,
    organised the first Inter-Celtic wrestling meeting at Quimperlé in 1928, and in 1930 founded the
    FALSAB to revive gouren and the traditional Breton sports.
hasEvidence:
  - basedOnSource: 01M5G930MN1VM84DEZNGEZP48E
    quotation: >-
      In 1930, Cotonnec established the Fédération des Amis de la Luttes et des Sports Athlétiques Bretons
      (FALSAB, Federation of the Friends of Wrestling and the Athletic Sports of the Bretons), for the
      purpose of revitalizing traditional Breton sports and culture.
