description:
  en: French karate and kickboxing pioneer, a dominant figure in European karate from the late 1960s, known as the French karate king and Europe's counterpart to Joe Lewis. He trained under Henry Plée and was a professional kickboxing champion. Jean-Claude Van Damme briefly studied kickboxing with him in Paris in the late 1970s.
