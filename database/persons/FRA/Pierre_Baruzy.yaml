description:
  en: >-
    French industrialist and French boxing champion. A student of Charles Charlemont from age 13, he
    won eleven national titles between 1922 and 1935, became president of the Académie de boxe française
    in 1930, and after the Second World War led the academic camp of French boxing; he was founding
    president of the Comité national de boxe française in 1965.
