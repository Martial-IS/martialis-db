description:
  en: French aikido practitioner who began aikido in Casablanca in 1964, a student of Georges Stobbaerts
    who, with M'barek Alaoui, left him in 1970 to found the Syu do kan following the Tamura (Aikikai)
    line. He later became an aikido teacher and is recorded as a member of the FFAB's CSDGE (Commission
    Spécialisée des Dans et Grades Équivalents) in the 2013 Manuel du Pratiquant.
  pt: Praticante de aikido francês que começou o aikido em Casablanca em 1964, aluno de Georges Stobbaerts
    que, com M'barek Alaoui, o deixou em 1970 para fundar o Syu do kan seguindo a linha de Tamura (Aikikai).
    Tornou-se mais tarde professor de aikido e é registado como membro da CSDGE da FFAB no Manuel du Pratiquant
    de 2013.
notes: The Aikido Journal interview with Alaoui spells the first name 'Emilie' (feminine form), while
  the Aikido Journal interview with Obellianne and the FFAB Manuel du Pratiquant use 'Emile'; the masculine
  form is used here. The nationality is inferred as French from his later role in the FFAB; no source
  states it explicitly.
