description:
  en: >-
    French canne, savate and English boxing teacher in Paris, among the first to teach formal methods
    of canne and staff fencing. He wrote a 25-lesson method in 1844 and taught a quick
    self-defence "method of the traveller" from his salle in the passage Verdeau.
