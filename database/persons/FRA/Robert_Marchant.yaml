notes: Also spelled "Marchand" in some sources. He had been in France training under Kawaishi Mikinosuke
  and Awazu Shozo and was working to establish judo clubs across Europe. His first visit to Oslo in 1954
  was planned with Jean Gailhat, general secretary of the French Judo Federation.
