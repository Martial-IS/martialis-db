description:
  en: Judo instructor active in France and England who visited Norway annually from 1954 to 1964, grading
    numerous Norwegians to black belt. Lundh described him as "hovedinstruktør i Frankrike" (head instructor
    in France); other sources identify him as English. He trained according to Kawaishi's system and was
    the central figure in early Norwegian judo grading, though he was reportedly in conflict with Kodokan
    and Abe.
