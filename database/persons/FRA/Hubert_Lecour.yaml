description:
  en: >-
    French savate and canne master, younger brother and partner of Charles Lecour. The two opened a
    salle in the passage des Panoramas in 1832 and gave public exhibitions; Hubert took the salle over in
    1848. Le Sport (1861) said he could strike 80 blows with the canne in a quarter of a minute.
