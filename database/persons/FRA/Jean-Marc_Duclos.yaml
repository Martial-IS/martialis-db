description:
  en: French-Portuguese aikido teacher, student of Georges Stobbaerts from 1964 to 1998 (judo briefly
    from 1964, aikido from 1968) and technical director of the Associação Portuguesa de Aikido e Disciplinas
    Associadas (APADA). He received 5th dan from Stobbaerts. He studied aikido with Gérard Obélianne in
    Casablanca during 1971-73 and kendo and iaido under Claude Durix. Since 2000 he has studied under
    Mitsugi Saotome Shihan. He was the principal mentor of the FPA's history of aikido in Portugal and
    held leadership roles in the APADA, the CDAM and the FPADA.
  pt: Professor de Aikido luso-francês, aluno de Georges Stobbaerts de 1964 a 1998 (Judo brevemente desde
    1964, Aikido desde 1968) e diretor técnico da Associação Portuguesa de Aikido e Disciplinas Associadas
    (APADA). Recebeu o 5º dan das mãos de Stobbaerts. Estudou Aikido com Gérard Obélianne em Casablanca
    entre 1971 e 1973 e Kendo e Iaido com Claude Durix. Desde 2000 estuda com o Shihan Mitsugi Saotome.
    Foi o principal mentor da história do Aikido em Portugal publicada pela FPA e ocupou cargos de liderança
    na APADA, na CDAM e na FPADA.
notes: The 34 years Duclos cites (1964-1998) is the overall span of Stobbaerts as his master across both
  judo and aikido, not a judo-training span; judo was dropped early when aikido took over in 1968. Duclos
  moved definitively to Portugal in September 1974, having visited in summer 1972 and Easter 1973. He
  was living in Casablanca when he began practice. His APADA/CDAM/FPADA leadership tenures are recorded
  as officers entries on those organizations' files. He also practised hatha yoga with Ana Oliveira and
  Maria Augusta de Vasconcelos and kendo/iaido under Claude Durix. He taught aikido as a monitor at the
  École Normale Hébraïque of Casablanca around 1971/72 and substituted for Gérard Obellianne there for
  a few months (dafina.net forum post, 2008).
