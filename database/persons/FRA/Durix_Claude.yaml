description:
  en: French ophthalmologist and writer (1921-2012), specialist of Japan, Zen Buddhism and calligraphy. He began the martial arts in 1945 and held twelve black belt grades (4th dan kendo, 3rd dan judo, 3rd dan iaido, 2nd dan aikido), competing in three kendo world championships (Tokyo 1970, Los Angeles 1973, London 1976). He was introduced to iaido by Kiyoshi Nakakura and practised at the dojo of Morihiro Okada. He was the kendo and iaido master of Jean-Marc Duclos in Morocco and accompanied Georges Stobbaerts on his trips to Japan. A 1956 first trip to Japan led him to Zen - friend of Sengoku Roshi of the Manpuku-ji temple, he spread Zen in Morocco and Europe and authored 'Le Sabre et la Vie' (1985).
  pt: 'Oftalmologista e escritor francês (1921-2012), especialista do Japão, do budismo zen e da caligrafia. Iniciou as artes marciais em 1945 e detinha doze graus de cinto negro (4º dan de kendo, 3º dan de judo, 3º dan de iaido, 2º dan de aikido), tendo competido em três campeonatos mundiais de kendo (Tóquio 1970, Los Angeles 1973, Londres 1976). Foi introduzido ao iaido por Kiyoshi Nakakura e praticou no dojo de Morihiro Okada. Foi o mestre de Kendo e Iaido de Jean-Marc Duclos em Marrocos e acompanhou Georges Stobbaerts nas suas viagens ao Japão. Uma primeira viagem ao Japão em 1956 levou-o ao Zen: amigo de Sengoku Roshi do templo Manpuku-ji, difundiu o zen em Marrocos e na Europa e escreveu ''Le Sabre et la Vie'' (1985).'
notes: Durix was born in Villeneuve-l'Archevêque and worked as an ophthalmologist in Casablanca for over thirty years (1950-1986), his adopted country. He began the martial arts in 1945. On his first trip to Japan in 1956 he discovered Zen Buddhism at the Manpuku-ji temple and became a friend of its superior Sengoku Roshi, who charged him with introducing an adapted Zen to the West; he founded zen dojos in Casablanca, Rabat and Marrakech. After Sengoku Roshi's death in 1971 he met Taisen Deshimaru in Paris, became a dendoshi and vice-president of the Association Zen Internationale, resigning in April 1981. A calligrapher and writer on Zen, he authored 'Le Sabre et la Vie' (1985) on iaido. He competed in three kendo world championships - Tokyo 1970, Los Angeles 1973 and London 1976.
