description:
  en: >-
    Parisian savate and canne master, known as Michel or Pisseux. He opened the first savate salle about
    1825 at La Courtille and later taught in the rue Buffault. His students included Charles Lecour, and
    an 1843 savate treatise was written by one of his students.
  fr: >-
    Maître de savate et de canne parisien, dit Michel ou Pisseux. Il ouvre la première salle de savate
    vers 1825 à la Courtille, puis enseigne rue Buffault. Charles Lecour est de ses élèves.
