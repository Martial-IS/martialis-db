description:
  en: 'Paul Bonét-Maury (1900-1972) was a French pharmacist and radiobiologist who was one of the principal
    architects of the development of judo in France. Doctor of pharmacy in 1924 and of science in 1938,
    he entered Marie Curie''s laboratory in 1925 to study the action of X-rays and radioactivity on living
    cells, and later created and directed the radioprotection service of the Institut du Radium (1950-1962).
    He discovered judo in 1936 during Jigoro Kano''s visit to France and became one of the two vice-presidents
    of the Jiu-Jitsu Club de France founded by Moshé Feldenkrais, under whose direction he had begun studying
    judo. When the Club Franco-Japonais merged into the JJCF in 1939, he became its president, a role
    he kept through the Occupation, bringing the club into the Fédération française de lutte in 1942 and
    serving as president of the FFL from July 1944. In December 1946 he founded the Fédération française
    de judo et de jiu-jitsu (FFJJ), which he presided until 1956; in 1949 he launched the idea of an international
    judo federation, became secretary-general of the International Judo Federation (1956-1971) and secretary-general
    of the European Judo Union. He was the second Frenchman to obtain a black belt in judo, reached 5th
    dan in his lifetime, and was posthumously honoured with 6th dan on 14 September 1975. He co-wrote
    Judo et Jiu-jitsu (1948, with Jean de Herdt) and Le Judo (PUF Que sais-je, 1971, with Henri Courtine).

    '
  fr: 'Paul Bonét-Maury (1900-1972) était un pharmacien et radiobiologiste français, l''un des principaux
    artisans du développement du judo en France. Docteur en pharmacie en 1924 et ès sciences en 1938,
    il entre en 1925 dans le laboratoire de Marie Curie pour étudier l''action des rayons X et de la radioactivité
    sur les cellules vivantes, puis crée et dirige le service de radioprotection de l''Institut du Radium
    (1950-1962). Il découvre le judo en 1936 à l''occasion de la visite en France de Jigoro Kano et devient
    l''un des deux vice-présidents du Jiu-jitsu Club de France fondé par Moshe Feldenkrais, sous la direction
    duquel il a débuté l''étude du judo. Lorsque le Club Franco-Japonais fusionne avec le JJCF en 1939,
    il en devient le président, fonction qu''il conserve pendant l''Occupation, faisant entrer le club
    dans la Fédération française de lutte en 1942 et présidant la FFL à partir de juillet 1944. En décembre
    1946, il fonde la Fédération française de judo et de jiu-jitsu (FFJJ), qu''il préside jusqu''en 1956
    ; en 1949, il lance l''idée d''une fédération internationale de judo, devient secrétaire général de
    la Fédération internationale de judo (1956-1971) et secrétaire général de l''Union européenne de judo.
    Deuxième Français à obtenir sa ceinture noire de judo, il atteint le 5e dan de son vivant et est honoré
    du 6e dan à titre posthume le 14 septembre 1975. Il coécrit Judo et Jiu-jitsu (1948, avec Jean de
    Herdt) et Le Judo (PUF Que sais-je, 1971, avec Henri Courtine).

    '
notes: 'Death date recorded as 17 April 1972 following the Paris civil registry (Archives de Paris, acte
  de naissance n° 460, année 1900, with marginal death note, as cited by fr.wikipedia) and Wikidata, which
  agree on that date; Grognet (2015) gives 2 April 1972, treated here as a divergent account (see the
  supports: false reference on death).'
