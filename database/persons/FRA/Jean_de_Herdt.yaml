notes: 'The 2013 over-blog tribute claims de Herdt reached 6th dan; this is contested by de Herdt''s own
  account in Les Pionniers du Judo Français, which records that the Kodokan experts proposed the 6th dan
  in December 1951 and that he refused it in agreement with Kawaishi, passing the 5th dan in June 1956
  instead, and that his 6th dan certificate was never signed because Kawaishi was already ill. Michel
  Brousse''s archival reconstruction establishes that the grade awarded in December 1951 was the 4th dan
  only, remitted by Risei Kano (president of the Kodokan) - not, as the 2018 Boisramé & Andréucci biography
  claims, by ambassador Yotaro Sugimura (who had died in 1939). Brousse also contests the biography''s
  claims about de Herdt founding the Fédération française de judo, the Collège des ceintures noires and
  the Panamerican Judo Confederation, and notes that de Herdt''s 1952 European title was won without fighting
  for lack of an opponent. The E-Judo forum post (Cichorei Kano, 2013) adds that de Herdt was the first
  European judo champion and a four-time European champion.

  Martin (2011, Essai sur les territoires du judo en France) names the co-director "Jean Beaujean"
  rather than "Paul Beaujean"; resolve which given name is correct before citing either.
  '
