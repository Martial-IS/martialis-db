description:
  en: 'French judoka, the first European judo champion and the first French pupil of Mikinosuke Kawaishi,
    whom he met in 1935. During Kawaishi''s absence from France he co-directed French judo with Paul Beaujean,
    and his students included André Kolychkine, who introduced judo to Cuba.

    '
