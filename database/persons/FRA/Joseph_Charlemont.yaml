description:
  en: >-
    French boxing and canne master who codified the academic form of French boxing. He learned the
    Joinville method in the army and taught at Arras from 1862, building on the methods of Louis
    Vigneron, with whom he trained from 1861, and Charles Lecour. After the Commune he was in exile in Brussels, where he wrote his first
    book (1878). Back in Paris he founded the Académie de boxe in 1887 and published L'art de la boxe
    française et de la canne in 1899. His son Charles succeeded him.
  fr: >-
    Maître de boxe française et de canne qui en codifie la forme académique. Formé à la méthode de
    Joinville, il enseigne à Arras dès 1862 une méthode fondée sur celles de Louis Vigneron, avec qui il s'entraîne
    dès 1861, et de Charles Lecour ;
    exilé à Bruxelles après la Commune, il fonde à Paris l'Académie de boxe en 1887. Son fils Charles lui
    succède.
notes: >-
  Death year: fr Wikipedia gives 15 September 1929 and cites the Paris death record; Green and Svinth
