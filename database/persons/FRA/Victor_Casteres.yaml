description:
  en: >-
    French boxing teacher, a lithographic engraver before he taught. He took his first lessons from
    Joseph Charlemont in 1883 and continued with Charles Charlemont, taught boxing in a café on the
    boulevard Magenta in 1891, and opened his own salle in the rue d'Amsterdam in 1892, moved to the rue
    Nouvelle in 1895, where he taught the Charlemont method.
