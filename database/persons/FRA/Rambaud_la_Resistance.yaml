description:
  en: >-
    French savate fighter and music-hall acrobat known as "la Résistance", a student of Charles Lecour.
    He lost to Louis Vigneron in 1850 in a bout organised by Louis Leboucher; Green and Svinth cite a
    poem on his win over the English boxer Dickson in 1852.
notes: >-
  Stub; no first name or dates. fr Wikipedia (Vigneron) gives Vigneron as winner over Dickson in 1854;
  Green and Svinth (p. 259) give Rambaud over Dickson in 1852. Not resolved.
