description:
  en: >-
    French boxing and canne master and strongman. He made his name in 1850 by beating Rambaud "la
    Résistance", taught in Paris, and performed in music halls; during the 1856–1860 ban on French boxing
    he hid his teaching in theatrical gymnastics. He lost to Joseph Charlemont in 1867 and died in 1871
    during a fairground act in which he fired a cannon carried on his back.
