description:
  en: French citizen who introduced aikido to Portugal. A student of Georges Stobbaerts at the Budo Club
    du Maroc in Casablanca (about 2nd kyu after four years), he moved to Portugal before the Carnation
    Revolution and, at the request of Dr. Pires Martins of the Academia de Budo, agreed to lead the first
    Portuguese aikido class (created December 1966) on condition that his teacher Stobbaerts direct it.
    He later returned to France.
  pt: Cidadão francês que introduziu o Aikido em Portugal. Aluno de Georges Stobbaerts no Budo Club du
    Maroc em Casablanca (cerca de 2º kyu após quatro anos), mudou-se para Portugal antes do 25 de Abril
    e, a pedido do Dr. Pires Martins da Academia de Budo, aceitou dirigir a primeira aula de Aikido em
    Portugal (criada em dezembro de 1966) com a condição de que o seu professor Stobbaerts a orientasse.
    Regressou mais tarde a França.
notes: The date of the first aikido class at the Academia de Budo is given as December 1966 in the FPA
  history but as 1965 in Araújo's chapter of 'A Génese do Karate em Portugal' and in the Aikido Marcial
  Dôjo Clube history; Laurent's own Surya interview (dl_32_1.pdf) is not yet processed. The class was
  later taken over by Carlos Manuel Pereira.
