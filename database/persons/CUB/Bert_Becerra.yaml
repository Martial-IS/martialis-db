description:
  en: 'Cuban judoka and coach, head of Becerra Judo & Jujitsu in Garland, Texas. Began judo in 1954 in Havana under A. Kolychkine, the father of Cuban judo, later training under Moc Kan Sent and Fernando Yi and competing for Cuba''s national youth teams. Left Cuba in 1970, settling in Miami, and moved to Texas in 1995, where he opened his club and taught jujitsu at Richland College. Promoted to judo hachidan (8th dan) in 2012, with additional dan grades in jujitsu and Goju-ryu karate. John Carmack trained judo at his club and was promoted to brown belt in 2007.

'
