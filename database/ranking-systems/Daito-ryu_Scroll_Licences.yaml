name:
  en: Daitō-ryū Scroll Licences
  ja: 大東流伝授巻
rankSystemKind: enumerated
gradeScheme: https://w3id.org/martialis/vocab/rank-grade/daito-ryu
derivedFromSystem: 01M11K25NF0E7HG8HWVWM2P3FJ
description:
  en: >-
    The Daitō-ryū transmission-scroll ladder: Hiden mokuroku, Aiki no jutsu, Hiden ōgi,
    Goshin'yō no te, Kaishaku sōden and Menkyo kaiden, with Seitō sōden above it. Each
    scroll certifies one segment of the curriculum. The dan levels added after the war are a
    separate system, and the teaching licence (kyōju dairi) is not a rung of this ladder.
hasEvidence:
- basedOnSource: 01M84B6YBSGNFH8EHTXJ9M2C42
  quotation: >-
    Traditionally, the recognition of a student's abilities was done by granting certificates
    recognizing one's proficiency in a certain segment of the curriculum of Daito-ryu Aikijujutsu.
  informationType: infotype:secondary
  supports: true
  evidenceType: evidencetype:direct
- basedOnSource: 01M84B6YBSGNFH8EHTXJ9M2C42
  quotation: >-
    One thing which has to be understood is that they remain two separate system [sic]; someone
    with a certificate of a certain part of the curriculum is not automatically granted a level
    which would normally cover the same part of the said curriculum.
  informationType: infotype:secondary
  supports: true
  evidenceType: evidencetype:direct
