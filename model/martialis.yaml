id: https://martial.is/model
name: martialis
title: Martialis data model
description: >-
  Single source of truth for the Martialis lineage database. The authoring JSON
  Schema, the JSON-LD context, the OWL ontology and the structural SHACL shapes
  are generated from this file. Authored separately and never generated here:
  the SKOS controlled vocabulary (ontology/vocabularies.ttl), the
  completeness/quality SHACL shapes, and the graph materialisation rules.
license: CC0-1.0
version: 1.0.0

prefixes:
  linkml: https://w3id.org/linkml/
  martialis: https://w3id.org/martialis/ontology#
  sdo: https://schema.org/
  prov: http://www.w3.org/ns/prov#
  dcterms: http://purl.org/dc/terms/
  skos: http://www.w3.org/2004/02/skos/core#
  org: http://www.w3.org/ns/org#
  bibo: http://purl.org/ontology/bibo/
  fabio: http://purl.org/spar/fabio/
  xsd: http://www.w3.org/2001/XMLSchema#
  rdf: http://www.w3.org/1999/02/22-rdf-syntax-ns#
  rdfs: http://www.w3.org/2000/01/rdf-schema#
  wd: http://www.wikidata.org/entity/
  dbr: http://dbpedia.org/resource/
  viaf: http://viaf.org/viaf/
  isni: https://isni.org/isni/
  lcnaf: http://id.loc.gov/authorities/names/
  ndlna: http://id.ndl.go.jp/auth/ndlna/
  orcid: https://orcid.org/
  eucountry: http://publications.europa.eu/resource/authority/country/
  country: https://w3id.org/martialis/vocab/country/
  agent: https://martial.is/agent/
  placeclass: https://w3id.org/martialis/vocab/place-classification/
  conflevel: https://w3id.org/martialis/vocab/confidence-level/
  srcclass: https://w3id.org/martialis/vocab/source-classification/
  infotype: https://w3id.org/martialis/vocab/information-type/
  evidencetype: https://w3id.org/martialis/vocab/evidence-type/
  affrel: https://w3id.org/martialis/vocab/affiliation-relation/
  instrcap: https://w3id.org/martialis/vocab/instructor-capacity/
  orgclass: https://w3id.org/martialis/vocab/org-classification/
  datecal: https://w3id.org/martialis/vocab/date-calendar/
  dissmanner: https://w3id.org/martialis/vocab/dissolution-manner/
  editrel: https://w3id.org/martialis/vocab/edition-relation/
  eventclass: https://w3id.org/martialis/vocab/event-classification/
  eventrole: https://w3id.org/martialis/vocab/event-role/
  honortype: https://w3id.org/martialis/vocab/honor-type/
  peerreview: https://w3id.org/martialis/vocab/peer-review/
  rankgrade: https://w3id.org/martialis/vocab/rank-grade/
  honorgrade: https://w3id.org/martialis/vocab/honor-grade/
  ranktype: https://w3id.org/martialis/vocab/rank-type/
  srcgenre: https://w3id.org/martialis/vocab/source-genre/
  styleclass: https://w3id.org/martialis/vocab/style-classification/
  styleform: https://w3id.org/martialis/vocab/style-form/
  stylerel: https://w3id.org/martialis/vocab/style-relation/
  teachrole: https://w3id.org/martialis/vocab/teacher-role/
  mediarights: https://w3id.org/martialis/vocab/media-rights/
  hist: https://w3id.org/martialis/vocab/historicity/

default_prefix: martialis
default_range: string

imports:
  - linkml:types
  - martialis-enums

# ---------------------------------------------------------------------------
# External alignment anchors. Abstract mixins: they contribute an
# rdfs:subClassOf axiom and nothing else.
# ---------------------------------------------------------------------------
classes:

  ProvAgent:
    class_uri: prov:Agent
    mixin: true
  ProvEntity:
    class_uri: prov:Entity
    mixin: true
  SdoPerson:
    class_uri: sdo:Person
    mixin: true
  SdoOrganization:
    class_uri: sdo:Organization
    mixin: true
  OrgOrganization:
    class_uri: org:Organization
    mixin: true
  SdoPlace:
    class_uri: sdo:Place
    mixin: true
  SdoSportsActivityLocation:
    class_uri: sdo:SportsActivityLocation
    mixin: true
  SdoGeoCoordinates:
    class_uri: sdo:GeoCoordinates
    mixin: true
  SdoImageObject:
    class_uri: sdo:ImageObject
    mixin: true
  SdoVideoObject:
    class_uri: sdo:VideoObject
    mixin: true
  SdoCreativeWork:
    class_uri: sdo:CreativeWork
    mixin: true
  SdoEvent:
    class_uri: sdo:Event
    mixin: true
  SdoIntangible:
    class_uri: sdo:Intangible
    mixin: true
  BiboDocument:
    class_uri: bibo:Document
    mixin: true
  FabioExpression:
    class_uri: fabio:Expression
    mixin: true

  Agent:
    class_uri: martialis:Agent
    description: >-
      A person or an organization: the abstract superclass of Person and Organization.
    abstract: true
    mixins:
      - ProvAgent

  # =========================================================================
  # Entities
  # =========================================================================

  Person:
    class_uri: martialis:Person
    description: >-
      A person recorded in the database: the subject of lineage, rank and honor claims, or a
      party to them such as a teacher, an examiner or an author.
    is_a: Agent
    mixins:
      - SdoPerson
    slots:
      - id
      - type
      - name
      - aka
      - nationality
      - birthEvent
      - deathEvent
      - description
      - notes
      - image
      - photos
      - videos
      - hasTeacherAssertion
      - hasRankAssertion
      - hasHonorAssertion
      - hasDocumentTransmissionAssertion
      - hasIdentityAssertion
      - hasHistoricityAssertion
      - hasEvidence
      - tags
      - sameAs
    slot_usage:
      hasEvidence:
        required: true

  Organization:
    class_uri: martialis:Organization
    description: >-
      An association, federation, governing body or lineage organization: a body that acts,
      governs or confers. A school or training establishment is a Place, even when it employs
      staff and has a head.
    is_a: Agent
    mixins:
      - SdoOrganization
      - OrgOrganization
    slots:
      - id
      - type
      - name
      - aka
      - orgType
      - hasSite
      - foundedEvent
      - dissolvedEvent
      - hasAffiliationAssertion
      - hasOfficerRole
      - hasMembership
      - website
      - logo
      - photos
      - videos
      - description
      - notes
      - hasEvidence
      - tags
      - sameAs
    slot_usage:
      hasEvidence:
        required: true

  Place:
    class_uri: martialis:Place
    description: >-
      A training establishment, where training happens: a dojo, club, academy or school
      programme. It always occupies at least one site, but its identity is the establishment's
      continuity, not its address, so a move is a new dated site, not a new record. Distinct
      from any Organization that governs it; its teaching staff are hasInstructorRole and its
      offices hasOfficerRole.
    mixins:
      - SdoSportsActivityLocation
    slots:
      - id
      - type
      - name
      - aka
      - placeType
      - hasSite
      - hasAffiliationAssertion
      - hasInstructorRole
      - hasOfficerRole
      - foundedEvent
      - dissolvedEvent
      - website
      - logo
      - photos
      - videos
      - description
      - notes
      - hasEvidence
      - tags
      - sameAs
    slot_usage:
      hasSite:
        required: true
      hasEvidence:
        required: true

  Style:
    class_uri: martialis:Style
    description: >-
      A martial art, style or school of practice: a named system such as Karate, Shotokan or
      Daito-ryu. Styles relate to each other through StyleRelationAssertion.
    mixins:
      - SdoCreativeWork
    slots:
      - id
      - type
      - name
      - aka
      - styleType
      - styleForm
      - hasStyleRelationAssertion
      - foundedEvent
      - dissolvedEvent
      - rankSystem
      - confersRank
      - description
      - notes
      - photos
      - videos
      - hasEvidence
      - tags
      - sameAs
    slot_usage:
      hasEvidence:
        required: true

  Source:
    class_uri: martialis:Source
    description: >-
      A bibliographic source cited as evidence: a book, article, web page, video, thesis,
      interview or archival document. Its bibliographic form is sourceType.
    mixins:
      - ProvEntity
      - SdoCreativeWork
      - BiboDocument
      - FabioExpression
    slots:
      - id
      - type
      - title
      - nativeTitle
      - sourceType
      - sourceGenre
      - hasContributor
      - publisher
      - issuedDate
      - issuedOriginal
      - issuedCalendar
      - accessedDate
      - archivedDate
      - editionOf
      - sourceClassification
      - lineageTradition
      - peerReview
      - selfPublished
      - volume
      - issue
      - page
      - edition
      - chapterNumber
      - part
      - section
      - archive
      - archiveCollection
      - archiveLocation
      - callNumber
      - url
      - archiveUrl
      - image
      - language
      - isbn
      - issn
      - doi
      - pmid
      - pmcid
      - wikidata
      - oclc
      - archiveOrgId
      - ndl
      - cinii
      - handle
      - description
      - notes
      - tags
    attributes:
      partOf:
        slot_uri: martialis:partOf
        range: Source
        description: >-
          The larger Source this one is part of: an article's journal or website edition, a
          chapter's book.
      specializationOf:
        slot_uri: martialis:specializationOf
        range: Source
        description: >-
          The resource this Source is one dated state of: a capture of a web page whose content
          changes, or a revised issue of a roster. The state inherits every field of that
          resource it does not state itself; evidence cites the state, never the resource.
  Event:
    class_uri: martialis:Event
    description: >-
      A dated happening in martial-arts history: a tournament, grading, seminar, course or
      ceremony. Claims point at it with martialis:atEvent.
    mixins:
      - SdoEvent
    slots:
      - id
      - type
      - name
      - aka
      - eventType
      - eventDate
      - dateOriginal
      - dateCalendar
      - eventPlace
      - location
      - organizer
      - about
      - hasParticipation
      - website
      - photos
      - videos
      - description
      - notes
      - sameAs
      - hasEvidence
      - tags
    slot_usage:
      hasEvidence:
        required: true
    attributes:
      superEvent:
        slot_uri: sdo:superEvent
        range: Event
        description: A larger Event this one is part of.

  RankingSystem:
    class_uri: martialis:RankingSystem
    description: >-
      A named, sourced grading system that a style's practitioners are ranked in, such as
      dan-kyu, menkyo or a state sports classification.
    mixins:
      - SdoIntangible
    slots:
      - id
      - type
      - name
      - aka
      - rankSystemKind
      - minOrdinal
      - maxOrdinal
      - gradeScheme
      - derivedFromSystem
      - foundedEvent
      - description
      - notes
      - hasEvidence
    slot_usage:
      hasEvidence:
        required: true

  # =========================================================================
  # Value structures
  # =========================================================================

  LanguageMap:
    class_uri: martialis:LanguageMap
    description: >-
      A JSON-LD language map, e.g. {en: "...", pt: "..."}. Open object; the
      generated context marks every slot ranged to it with @container: @language
      and the generated OWL/SHACL treat its values as language-tagged strings.

  GeoRef:
    class_uri: martialis:GeoRef
    description: "A place reference: free-text label plus an authority IRI."
    mixins: [SdoPlace]
    slots: [label, countryCode, wikidata, geo]

  Coordinates:
    class_uri: martialis:Coordinates
    description: >-
      A WGS84 point. Latitude and longitude are both required, so a coordinate cannot be
      recorded half-formed.
    mixins: [SdoGeoCoordinates]
    slots: [latitude, longitude]
    slot_usage:
      latitude:
        required: true
      longitude:
        required: true

  NationalityEntry:
    class_uri: martialis:NationalityEntry
    description: >-
      One nationality of a person: a country code, optionally with its Wikidata item.
    slots: [countryCode, wikidata]

  TimeInterval:
    class_uri: martialis:TimeInterval
    description: >-
      A time interval with optional start and end years.
    slots: [startYear, endYear]

  Confidence:
    class_uri: martialis:Confidence
    description: >-
      A confidence assessment applied to an assertion.
    mixins: [ProvEntity]
    slots: [confidenceLevel, assessedBy, confidenceRationale]

  SourceAssertionRelation:
    class_uri: martialis:SourceAssertionRelation
    mixins: [ProvEntity]
    description: >-
      One evidence record: a Source plus the curator's reading of it, which says whether the
      Source supports the claim and how.
    slots: [basedOnSource, uri, archiveUri, cite, locator, locatorLabel, quotation, informationType, supports, evidenceType]

  Attribution:
    class_uri: martialis:Attribution
    description: Crediting a media item to a source; carries no supports semantics.
    slots: [basedOnSource, uri, archiveUri, cite, quotation, informationType, evidenceType]

  Photo:
    class_uri: martialis:Photo
    description: >-
      An image file depicting an entity: its URL, its attribution to a source and its rights
      status.
    mixins: [SdoImageObject]
    slots: [contentUrl, imageAttribution, rights]

  Video:
    class_uri: martialis:Video
    description: >-
      A video file about an entity: its URL, its attribution to a source and its rights status.
    mixins: [SdoVideoObject]
    slots: [contentUrl, imageAttribution, rights]

  Assertion:
    class_uri: martialis:Assertion
    abstract: true
    mixins: [ProvEntity]
    description: >-
      A sourced claim nested in an entity record, typed by what it asserts: a teacher
      relationship, a rank, an honor, an affiliation, a style relation, a document transmission,
      a candidate identity, a historicity, a participation in an event, an instructor or officer role, or a membership. Every
      claim has its own ULID, so it keeps its identity when the claims around it are added,
      removed or reordered.
    slots: [id]
  LifeEvent:
    class_uri: martialis:LifeEvent
    abstract: true
    mixins: [ProvEntity, SdoEvent]
    description: >-
      A dated event in the life of a person, place, organization, style or ranking system: a
      birth, death, founding or dissolution.
  BirthEvent:
    class_uri: martialis:BirthEvent
    description: >-
      A person's birth: its date, place and evidence.
    is_a: LifeEvent
    slots: [birthDate, dateOriginal, dateCalendar, birthPlace, hasEvidence]

  DeathEvent:
    class_uri: martialis:DeathEvent
    description: >-
      A person's death: its date, place and evidence.
    is_a: LifeEvent
    slots: [deathDate, dateOriginal, dateCalendar, deathPlace, hasEvidence]

  FoundingEvent:
    class_uri: martialis:FoundingEvent
    description: >-
      The founding of a place, organization, style or ranking system: its date, place, founders
      and evidence.
    is_a: LifeEvent
    slots: [startDate, dateOriginal, dateCalendar, eventPlace, location, founder, atEvent, hasEvidence]

  DissolutionEvent:
    class_uri: martialis:DissolutionEvent
    description: >-
      The end of a place, organization, style or ranking system: its date, place, manner, reason
      and evidence.
    is_a: LifeEvent
    slots: [endDate, dateOriginal, dateCalendar, eventPlace, location, atEvent, dissolutionManner, dissolutionReason, hasEvidence]

  AffiliationAssertion:
    class_uri: martialis:AffiliationAssertion
    description: >-
      A typed, sourced claim that the subject (a Place or Organization) is affiliated with, or
      descends from, the related Organization.
    is_a: Assertion
    slots: [affiliationRelation, atEvent, validDuring, hasConfidence, notes, hasEvidence]
    slot_usage:
      hasEvidence:
        required: true
    attributes:
      relatedOrganization:
        slot_uri: martialis:relatedOrganization
        range: Organization
        required: true
        description: >-
          The organization the subject is affiliated with or descends from, as affiliationRelation says.

  InstructorRole:
    class_uri: martialis:InstructorRole
    description: >-
      A time-bounded, sourced record that a Person served on the instructional staff of a Place.
      Not a teacher-student claim.
    is_a: Assertion
    slots: [instructor, instructorCapacity, instructorStyle, instructorPeriod, hasConfidence, notes, hasEvidence]
    slot_usage:
      hasEvidence:
        required: true

  OfficerRole:
    class_uri: martialis:OfficerRole
    description: >-
      A time-bounded, sourced record that a Person held an officer position in an Organization
      or at a Place. Distinct from HonorAssertion, which has no natural end.
    is_a: Assertion
    slots: [officer, officerTitle, officerPeriod, hasConfidence, notes, hasEvidence]
    slot_usage:
      hasEvidence:
        required: true

  Membership:
    class_uri: martialis:Membership
    description: >-
      A sourced claim that a Person was a member of an Organization, with no office implied.
      An office is an OfficerRole; an organization's membership of another organization is an
      AffiliationAssertion.
    is_a: Assertion
    slots: [member, membershipPeriod, hasConfidence, notes, hasEvidence]
    slot_usage:
      hasEvidence:
        required: true

  Site:
    class_uri: martialis:Site
    mixins: [ProvEntity]
    description: >-
      A site a Place or Organization occupied: its locality (required), an optional street
      address and map point, an optional Place it sat within, and the period when the sources
      date it. The only home for where a Place or Organization is; the current locality is the
      site or sites with no end year. No period means the period is unsourced, not that the site
      covers the record's whole life.
    slots: [location, address, withinPlace, sitePeriod, notes, hasEvidence]
    slot_usage:
      location:
        required: true

  TeacherAssertion:
    class_uri: martialis:TeacherAssertion
    is_a: Assertion
    description: >-
      A claim that a person taught the subject a style. The teacher is martialis:teacher.
      With no teacher, the claim states that a teacher existed whom no
      source names: every interaction then needs a Place or Event anchor and a dated period,
      and no wasTaughtBy/teaches edge is materialized. A claim assessed doubtful or refuted
      stays a TeacherAssertion and gives no edge either. Evidence attaches to the
      interactions.
    slots: [assertedStyle, role, hasConfidence, hasInteraction, notes, hasEvidence]
    slot_usage:
      hasInteraction:
        required: true
    attributes:
      teacher:
        slot_uri: martialis:teacher
        range: Person
        description: >-
          The teacher. Omit it when no source identifies the teacher; every
          interaction then needs a Place or Event anchor and a dated period.

  TeacherInteraction:
    class_uri: martialis:TeacherInteraction
    description: >-
      A place/period/evidence record within a teacher-student relationship.
    mixins: [ProvEntity]
    slots: [interactionPlace, atEvent, interactionPeriod, notes, hasEvidence]

  RankAssertion:
    class_uri: martialis:RankAssertion
    description: >-
      A claim that the subject (Person) holds a rank in a Style (rankStyle). The rank is a
      (rankSystem, rankType/rankOrdinal or rankGrade) tuple.
    is_a: Assertion
    slots: [rankSystem, rankType, rankOrdinal, rankGrade, conferredBy, grantedBy, atEvent, dateConferred, dateOriginal, dateCalendar, hasConfidence, notes, hasEvidence]
    slot_usage:
      rankSystem:
        required: true
      hasEvidence:
        required: true
    attributes:
      rankStyle:
        slot_uri: martialis:rankStyle
        range: Style
        description: The style the rank is in.

  HonorAssertion:
    class_uri: martialis:HonorAssertion
    description: >-
      A non-style-specific title, certificate, or honor (e.g. Hanshi, Kyoshi). Subject is the
      honored Person; conferredBy is the granting Organization.
    is_a: Assertion
    slots: [honorValue, honorType, honorGrade, conferredBy, grantedBy, atEvent, dateConferred, dateOriginal, dateCalendar, hasConfidence, notes, hasEvidence]
    slot_usage:
      hasEvidence:
        required: true

  DocumentTransmissionAssertion:
    class_uri: martialis:DocumentTransmissionAssertion
    description: >-
      A claim that the subject (Person) learned from a document rather than a person (densho,
      manual, book, video), referenced via transmissionDocument.
    is_a: Assertion
    slots: [transmissionDocument, assertedStyle, atEvent, validDuring, hasConfidence, notes, hasEvidence]
    slot_usage:
      hasEvidence:
        required: true

  IdentityAssertion:
    class_uri: martialis:IdentityAssertion
    is_a: Assertion
    description: >-
      A sourced hypothesis that the subject and the identity candidate may be the same individual,
      for example under another name. Weaker than owl:sameAs.
    slots: [hasConfidence, notes, hasEvidence]
    slot_usage:
      hasEvidence:
        required: true
    attributes:
      identityCandidate:
        slot_uri: martialis:identityCandidate
        range: Person
        required: true
        description: The Person record that may be the same individual as the subject.

  HistoricityAssertion:
    class_uri: martialis:HistoricityAssertion
    is_a: Assertion
    description: >-
      A sourced claim about whether the subject existed as one historical individual: historical,
      legendary, composite, or a title. Recorded only when a source questions it. It does not
      cap the confidence of other claims about the subject.
    slots: [hasConfidence, notes, hasEvidence]
    slot_usage:
      hasEvidence:
        required: true
    attributes:
      historicity:
        slot_uri: martialis:historicity
        range: Historicity
        required: true
        description: >-
          What the subject is, as the evidence shows it: historical, legendary, composite or
          title.

  StyleRelationAssertion:
    class_uri: martialis:StyleRelationAssertion
    description: >-
      A typed, sourced relationship between two styles: derived_from, split_from, influenced_by,
      sibling_style_of, or variant_of. sibling_style_of requires no shared parent.
    is_a: Assertion
    slots: [styleRelationType, hasConfidence, notes, hasEvidence]
    slot_usage:
      hasEvidence:
        required: true
    attributes:
      relatedStyle:
        slot_uri: martialis:relatedStyle
        range: Style
        required: true
        description: The style the subject relates to, as styleRelationType says.

  Participation:
    class_uri: martialis:Participation
    description: >-
      A participation record in an Event: the participating agent (a Person as participant, or
      an Organization as participantOrganization), their role, and the evidence.
    is_a: Assertion
    slots: [participationRole, participationStyle, hasConfidence, notes, hasEvidence]
    slot_usage:
      hasEvidence:
        required: true
    attributes:
      participant:
        slot_uri: martialis:participant
        range: Person
        description: The participating person.
      participantOrganization:
        slot_uri: martialis:participantOrganization
        range: Organization
        description: >-
          The participating Organization of a Participation, when no person is named. A distinct
          predicate from participant, because the two value shapes (Person and Organization)
          cannot share one IRI.
  Contributor:
    class_uri: martialis:Contributor
    description: >-
      A person or body credited on a Source in a CSL contributor role, named in CSL name parts
      and optionally linked to a Person or Organization record.
    slots: [contributorRole, family, given, literal, droppingParticle, nonDroppingParticle, suffix, contributorPerson, contributorOrg]

  Publisher:
    class_uri: martialis:Publisher
    description: >-
      The publisher of a Source: its name, optionally linked to an Organization record.
    slots: [publisherName, publisherOrg]

  EditionOf:
    class_uri: martialis:EditionOf
    description: >-
      The work a Source is an edition, translation, reprint or facsimile of, and the kind of
      relation.
    slots: [editionOfSource, editionRelationType]

# ---------------------------------------------------------------------------
# Slots
# ---------------------------------------------------------------------------
slots:

  id:
    identifier: true
    range: string
    pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
    description: >-
      ULID of the record, or of a claim: every Assertion and Participation carries its own, the
      graded conclusions being exactly the nodes that have hasConfidence.

  type:
    designates_type: true
    required: true
    description: Entity class, designating the node type.

  name:
    slot_uri: sdo:name
    range: LanguageMap
    inlined: true
    required: true
    description: Primary name, as a language map.

  aka:
    slot_uri: sdo:alternateName
    range: LanguageMap
    inlined: true
    description: Alternative names, as a language map.

  nationality:
    slot_uri: sdo:nationality
    range: NationalityEntry
    multivalued: true
    inlined_as_list: true
    description: Nationalities, each a country code and optional Wikidata Q-ID.

  description:
    slot_uri: sdo:description
    range: LanguageMap
    inlined: true
    description: Reader-facing description, as a language map.

  title:
    slot_uri: sdo:name
    description: >-
      A plain, unlocalised title (a Source). Required on every Source except a
      dated state, which inherits it (enforced in SHACL).

  nativeTitle:
    slot_uri: sdo:alternateName

  label:
    slot_uri: sdo:name
    description: "A plain, unlocalised display name (a location, a link)."

  notes:
    slot_uri: martialis:researchNote
    description: >-
      A research note recording what is known, suspected, or still to be investigated about a
      record. Kept out of the export (YAML: notes).

  tags:
    slot_uri: sdo:keywords
    multivalued: true

  # ---- type / classification -------------------------------------------

  placeType:
    slot_uri: martialis:placeType
    description: >-
      Type: dojo, club, university, school, temple, gym, military, academy, team, other.
      'school' here is an education institution.
    range: PlaceClassification
    required: true

  orgType:
    slot_uri: martialis:orgType
    description: >-
      Type: federation, governing_body, school, association, other. 'school' here is a teaching
      lineage, not an education institution.
    range: OrgClassification
    required: true

  styleType:
    slot_uri: martialis:styleType
    description: >-
      Origin period, deliberately culture-neutral: traditional, modern, other. Culture-specific
      period terms belong in tags.
    range: StyleClassification
    required: true

  sourceType:
    slot_uri: martialis:sourceType
    range: SourceType
    description: >-
      The bibliographic form: a CSL-JSON item type, plus the extension 'website' (exported as
      CSL 'periodical'). Required on every Source except a dated state, which inherits it.

  eventType:
    slot_uri: martialis:eventType
    description: >-
      Type of event: founding, tournament, challenge, seminar, course, demonstration, grading,
      ceremony, recognition, exchange, or other.
    range: EventClassification
    required: true

  rankSystemKind:
    slot_uri: martialis:rankingSystemKind
    description: >-
      'numbered' (an open-ended integer ladder, recorded as rankType/rankOrdinal) or
      'enumerated' (a fixed ordered list of grades, a skos:ConceptScheme).
    range: RankSystemKind
    required: true

  sourceGenre:
    slot_uri: martialis:sourceGenre
    description: >-
      What the content is (biography, obituary, interview, promotional, ...), independent of
      sourceType's bibliographic form - a `webpage` can be any of these.
    range: SourceGenre

  sourceClassification:
    slot_uri: martialis:sourceClassification
    description: >-
      The Source's form relative to the record it carries (Mills): original, derivative or
      authored. Set once on the Source.
    range: SourceClassification

  lineageTradition:
    slot_uri: martialis:lineageTradition
    description: >-
      True when the Source is a lineage or organisation recounting its own past (a school or
      federation history, a founding story, a genealogy chart, a densho), so it shares one origin
      with every other account from inside that lineage and cannot corroborate them. Not set on
      everything a body publishes: its record of its own act (a grade register, a same-day
      announcement, a current member list) is not tradition. Extends the Mills independence test;
      orthogonal to martialis:sourceClassification: an original densho is still lineage-internal.
    range: boolean

  peerReview:
    slot_uri: martialis:peerReview
    description: >-
      Whether this Source was peer-reviewed before publication. Inherited from its container
      through partOf (materialized at export time) unless stated on the item. Absent when not
      established.
    range: PeerReview

  # ---- location ---------------------------------------------------------

  location:
    slot_uri: sdo:location
    range: GeoRef
    inlined: true
    description: >-
      An embedded place reference (free-text label, country code, optional
      authority IRI and point), not a Place entity. Carried by Site (where a
      Place or Organization is) and by Event and the life events (where something
      happened); a Place or Organization has no location of its own. The specific
      Place an event happened at is martialis:eventPlace; keeping the two on
      separate predicates keeps a Place entity and a GeoRef apart.

  birthPlace:
    slot_uri: sdo:location
    range: GeoRef
    inlined: true
    description: >-
      Where the birth took place. Exported as the birth event's schema:location; the
      export also states it on the person as schema:birthPlace.

  deathPlace:
    slot_uri: sdo:location
    range: GeoRef
    inlined: true
    description: >-
      Where the death took place. Exported as the death event's schema:location; the
      export also states it on the person as schema:deathPlace.

  countryCode:
    slot_uri: sdo:addressCountry
    range: uriorcurie

  wikidata:
    slot_uri: sdo:sameAs
    range: uriorcurie
    description: >-
      The Wikidata item that IS this source, place reference or nationality, as a wd: CURIE.
      A source has one only when it is a work with its own item (a book, a periodical); a
      Wikipedia article has none, and the item of its subject is not its identity. An entity
      record lists its identity links, Wikidata among them, in sameAs.

  geo:
    slot_uri: sdo:geo
    range: Coordinates
    inlined: true
    description: >-
      An optional WGS84 point, for a reference precise enough to show on a map.
      The wikidata IRI stays authoritative for identity; coordinates are for
      display.

  latitude:
    slot_uri: sdo:latitude
    range: double
    minimum_value: -90
    maximum_value: 90
    description: >-
      WGS84 latitude in decimal degrees. Double, not decimal: JSON-LD
      serialises a fractional number in exponential form (e.g. "3.57E1"),
      which is an ill-formed xsd:decimal lexical but a valid xsd:double one.

  longitude:
    slot_uri: sdo:longitude
    range: double
    minimum_value: -180
    maximum_value: 180
    description: WGS84 longitude in decimal degrees.

  address:
    slot_uri: sdo:address

  withinPlace:
    slot_uri: martialis:withinPlace
    range: Place
    description: >-
      The Place this site sat within (a dojo inside a hall, an HQ housed at a dojo), dated by
      the site's own period.
  # ---- events / dates ---------------------------------------------------

  birthEvent:
    slot_uri: martialis:birthEvent
    description: >-
      Links a Person to their birth LifeEvent, which carries the date, location, and sources.
    range: BirthEvent
    inlined: true

  deathEvent:
    slot_uri: martialis:deathEvent
    description: >-
      Links a Person to their death LifeEvent, which carries the date, location, and sources.
    range: DeathEvent
    inlined: true

  foundedEvent:
    slot_uri: martialis:foundedEvent
    description: >-
      Founding event with date, location, and sources. Used by Style, Organization, Place, and
      RankingSystem (YAML 'instituted').
    range: FoundingEvent
    inlined: true

  dissolvedEvent:
    slot_uri: martialis:dissolvedEvent
    description: >-
      Dissolution event, if applicable. Used by Style, Organization, and Place.
    range: DissolutionEvent
    inlined: true

  birthDate:
    slot_uri: sdo:startDate
    range: string
    description: >-
      When the birth took place, in EDTF. Exported as the birth event's schema:startDate;
      the export also states a plain ISO date on the person as schema:birthDate.
    pattern: &edtf "^(?:(?:-?[0-9]{4}(?:-[0-9]{2}(?:-[0-9]{2})?)?|[0-9]{3}X|[0-9]{2}XX)[?~%]?|(?:(?:-?[0-9]{4}(?:-[0-9]{2}(?:-[0-9]{2})?)?|[0-9]{3}X|[0-9]{2}XX)[?~%]?|\\.\\.|unknown)/(?:(?:-?[0-9]{4}(?:-[0-9]{2}(?:-[0-9]{2})?)?|[0-9]{3}X|[0-9]{2}XX)[?~%]?|\\.\\.|unknown)|\\[(?:-?[0-9]{4}(?:-[0-9]{2}(?:-[0-9]{2})?)?|[0-9]{3}X|[0-9]{2}XX)[?~%]?(?:,(?:-?[0-9]{4}(?:-[0-9]{2}(?:-[0-9]{2})?)?|[0-9]{3}X|[0-9]{2}XX)[?~%]?)+\\])$"

  deathDate:
    slot_uri: sdo:startDate
    pattern: *edtf
    description: >-
      When the death took place, in EDTF. Exported as the death event's schema:startDate;
      the export also states a plain ISO date on the person as schema:deathDate.

  startDate:
    slot_uri: sdo:startDate
    pattern: *edtf

  endDate:
    slot_uri: sdo:endDate
    pattern: *edtf

  dateConferred:
    slot_uri: martialis:dateConferred
    pattern: *edtf
    description: >-
      When the rank or honor was conferred, in EDTF.

  issuedDate:
    slot_uri: sdo:datePublished
    pattern: *edtf

  accessedDate:
    slot_uri: martialis:accessed
    description: >-
      When the curator consulted this source (CSL 'accessed').
    pattern: *edtf

  archivedDate:
    slot_uri: martialis:archiveDate
    description: >-
      Snapshot date of archiveUrl. Distinct from schema:archivedAt, which carries the archiveUrl
      IRI itself, not a date.
    pattern: *edtf

  eventDate:
    slot_uri: sdo:startDate
    pattern: *edtf
    required: true

  dateOriginal:
    slot_uri: martialis:dateOriginal
    description: >-
      Free-text date as given by the source, when it differs from the Gregorian-equivalent EDTF
      value in the paired date property. Paired with martialis:dateCalendar.

  issuedOriginal:
    slot_uri: martialis:dateOriginal

  dateCalendar:
    slot_uri: martialis:dateCalendar
    description: >-
      Calendar system a source's own date was expressed in: julian, japanese-nengo,
      japanese-lunisolar, other-lunisolar, or other.
    range: DateCalendar

  issuedCalendar:
    slot_uri: martialis:dateCalendar
    range: DateCalendar

  dissolutionManner:
    slot_uri: martialis:dissolutionManner
    description: >-
      Organization-only. How the organization ended: merged, split, superseded, suppressed,
      renamed, defunct, or unknown.
    range: DissolutionManner

  dissolutionReason:
    slot_uri: martialis:dissolutionReason
    description: >-
      Free-text detail of how and why the entity ended that no closed vocabulary carries: a
      decree number, an occupation order, the terms of a unification.
  # ---- assertions and roles --------------------------------------------

  hasTeacherAssertion:
    slot_uri: martialis:hasTeacherAssertion
    description: >-
      Links a Person to their TeacherAssertions: claims of having studied under a teacher. The
      assertion names the teacher when a source identifies one; evidence
      attaches to the assertion's interactions.
    range: TeacherAssertion
    multivalued: true
    inlined_as_list: true

  hasRankAssertion:
    slot_uri: martialis:hasRankAssertion
    description: >-
      Links a Person to their RankAssertions: claims of holding a rank in a style.
    range: RankAssertion
    multivalued: true
    inlined_as_list: true

  hasHonorAssertion:
    slot_uri: martialis:hasHonorAssertion
    description: >-
      Links a Person to their HonorAssertions: non-style-specific titles or certificates
      (Hanshi, Kyoshi). Distinct from OfficerRole, which is a tenured office with a real end.
    range: HonorAssertion
    multivalued: true
    inlined_as_list: true

  hasDocumentTransmissionAssertion:
    slot_uri: martialis:hasDocumentTransmissionAssertion
    description: >-
      Links a Person to their DocumentTransmissionAssertions: claims of learning from a document
      rather than a person.
    range: DocumentTransmissionAssertion
    multivalued: true
    inlined_as_list: true

  hasIdentityAssertion:
    slot_uri: martialis:hasIdentityAssertion
    description: >-
      Links a Person to their IdentityAssertions: sourced hypotheses that two Person records may
      be the same individual.
    range: IdentityAssertion
    multivalued: true
    inlined_as_list: true

  hasHistoricityAssertion:
    slot_uri: martialis:hasHistoricityAssertion
    description: >-
      Links a Person to their HistoricityAssertions: sourced, graded claims about whether the
      person existed as one historical individual. Competing readings are separate entries.
    range: HistoricityAssertion
    multivalued: true
    inlined_as_list: true

  hasStyleRelationAssertion:
    slot_uri: martialis:hasStyleRelationAssertion
    description: >-
      Links a Style to its StyleRelationAssertions: typed, sourced relationships to other
      styles.
    range: StyleRelationAssertion
    multivalued: true
    inlined_as_list: true

  hasAffiliationAssertion:
    slot_uri: martialis:hasAffiliationAssertion
    description: >-
      Domain intentionally omitted: applies to both Place and Organization.
    range: AffiliationAssertion
    multivalued: true
    inlined_as_list: true

  hasInstructorRole:
    slot_uri: martialis:hasInstructorRole
    description: >-
      Links a venue to a record of someone who taught there.
    range: InstructorRole
    multivalued: true
    inlined_as_list: true

  hasOfficerRole:
    slot_uri: martialis:hasOfficerRole
    description: >-
      Links an Organization or Place to a record of someone who held office there. Domain
      intentionally omitted: an office can be held in an Organization or at a Place.
    range: OfficerRole
    multivalued: true
    inlined_as_list: true

  hasMembership:
    slot_uri: martialis:hasMembership
    description: >-
      Links an Organization to the records of its individual members.
    range: Membership
    multivalued: true
    inlined_as_list: true

  hasSite:
    slot_uri: martialis:hasSite
    range: Site
    multivalued: true
    inlined_as_list: true
    description: >-
      The sites this establishment or body occupied, one entry per site, dated when the sources
      date the moves. Required on Place, optional on Organization. The only home for where a
      Place or Organization is.
  hasParticipation:
    slot_uri: martialis:hasParticipation
    description: >-
      Links an event to a participation record (participant or
      participantOrganization: who took part; participationRole: their role).
    range: Participation
    multivalued: true
    inlined_as_list: true

  hasInteraction:
    slot_uri: martialis:hasInteraction
    description: >-
      Links a TeacherAssertion to its TeacherInteraction records (where, when, evidence).
    range: TeacherInteraction
    multivalued: true
    inlined_as_list: true

  assertedStyle:
    slot_uri: martialis:assertedStyle
    description: >-
      The style associated with a teacher-student assertion, denial, or document-transmission
      claim (assertedStyle).
    range: Style

  role:
    slot_uri: martialis:role
    description: >-
      Type of student-teacher relationship: student, uchi_deshi, seminar, private, examination,
      coach. Event roles use martialis:participationRole.
    range: TeacherRole

  hasConfidence:
    slot_uri: martialis:hasConfidence
    description: >-
      Links an Assertion to its Confidence assessment.
    range: Confidence
    inlined: true
    required: true

  interactionPlace:
    slot_uri: martialis:interactionPlace
    description: >-
      The Place where a teacher-student interaction occurred. Materialized into the
      martialis:trainedAt convenience edge at export time, and into martialis:taughtAt when the
      teacher is identified.
    range: Place

  interactionPeriod:
    slot_uri: martialis:interactionPeriod
    description: >-
      The period during which this teacher-student interaction took place.
    range: TimeInterval
    inlined: true

  instructor:
    slot_uri: martialis:instructor
    description: >-
      The person who taught at the venue. A venue-staff fact only; it asserts nothing about
      students.
    range: Person
    required: true

  instructorCapacity:
    slot_uri: martialis:instructorCapacity
    description: >-
      Capacity: head_instructor, instructor, technical_director, guest.
    range: InstructorCapacity

  instructorStyle:
    slot_uri: martialis:instructorStyle
    description: >-
      Which programme at the venue this instructor role covers (e.g. an MMA class vs a
      separately-graded BJJ class).
    range: Style

  instructorPeriod:
    slot_uri: martialis:instructorPeriod
    description: >-
      The period during which this person served on the venue's instructional staff.
    range: TimeInterval
    inlined: true

  officer:
    slot_uri: martialis:officer
    description: >-
      The person who held the office.
    range: Person
    required: true

  officerTitle:
    slot_uri: martialis:officerTitle
    description: >-
      Office held, e.g. President, Vice-President, Teaching Coordinator, Secretary-General. Free
      text.
    required: true

  member:
    slot_uri: martialis:member
    description: >-
      The person who was a member.
    range: Person
    required: true

  membershipPeriod:
    slot_uri: martialis:membershipPeriod
    description: >-
      The period of this membership, when the sources date it.
    range: TimeInterval
    inlined: true

  officerPeriod:
    slot_uri: martialis:officerPeriod
    description: >-
      The tenure period of this officer record; a real end (expiry, resignation, succession) is
      what distinguishes it from a Honor.
    range: TimeInterval
    inlined: true

  sitePeriod:
    slot_uri: martialis:sitePeriod
    description: >-
      The period during which a site was occupied. Absent means the period is unsourced.
    range: TimeInterval
    inlined: true

  affiliationRelation:
    slot_uri: martialis:affiliationRelation
    description: >-
      Relation kind: member_of, branch_of, recognised_by (ties) or derived_from, split_from,
      merged_from, replaces, renamed_from (organization genealogy).
    range: AffiliationRelation
    required: true

  validDuring:
    slot_uri: martialis:validDuring
    description: >-
      The period during which an assertion held (used by DocumentTransmissionAssertion and
      AffiliationAssertion; teacher relationships carry periods on their interactions instead).
    range: TimeInterval
    inlined: true

  rankSystem:
    slot_uri: martialis:rankSystem
    description: >-
      The RankingSystem a Style's practitioners are ranked in, or that a RankAssertion's rank
      belongs to. Absent on a Style means rank is unresearched.
    range: RankingSystem

  rankType:
    slot_uri: martialis:rankType
    description: >-
      Which half of a numbered ladder a grade is on: dan (ascending), kyu (descending), or
      dan_unspecified. Only meaningful for a 'numbered' system.
    range: RankType

  rankOrdinal:
    slot_uri: martialis:rankOrdinal
    description: >-
      The grade number within a numbered RankingSystem (e.g. 6 for 6th dan). Mutually exclusive
      with martialis:rankGrade.
    range: integer

  rankGrade:
    slot_uri: martialis:rankGrade
    description: >-
      The specific grade within an enumerated RankingSystem's scheme (e.g. Menkyo Kaiden).
      Mutually exclusive with martialis:rankOrdinal/rankType.
    range: RankGrade

  conferredBy:
    slot_uri: martialis:conferredBy
    description: >-
      The organization that conferred the rank or honor.
    range: Organization

  grantedBy:
    slot_uri: martialis:grantedBy
    description: >-
      Person that granted the rank or honor. Granting organizations use conferredBy.
    range: Person

  honorType:
    slot_uri: martialis:honorType
    description: >-
      Category of honor: title, certificate, noble_rank, license, decoration (a state or
      military order or medal), or other.
    range: HonorType

  honorValue:
    slot_uri: martialis:honorValue
    required: true
    description: >-
      The honor as conferred, for example "Kyoshi" or "Hanshi".
  honorGrade:
    slot_uri: martialis:honorGrade
    description: >-
      The specific grade within an ordered honorific scheme, when the honor is a rung on a
      ladder; currently shogo (renshi/kyoshi/hanshi). The rung only; the conferring body is the
      assertion's conferredBy.
    range: HonorGrade

  transmissionDocument:
    slot_uri: martialis:transmissionDocument
    description: >-
      The document (densho, manual, book, video) through which the transmission occurred.
    range: Source
    required: true

  styleRelationType:
    slot_uri: martialis:styleRelationType
    description: >-
      Relation kind: derived_from, split_from, influenced_by, sibling_style_of, variant_of.
      variant_of is materialized as martialis:variantOf/hasVariant.
    range: StyleRelation
    required: true

  styleForm:
    slot_uri: martialis:styleForm
    description: >-
      How a style is composed or practised, independent of origin period: hybrid and/or sport.
      Multi-valued. 'sport' means principally rule-governed competition.
    range: StyleForm
    multivalued: true

  founder:
    slot_uri: martialis:founder
    description: >-
      Person(s) who founded the style, organization, or place. Multi-valued to support
      co-founders.
    range: Person
    multivalued: true

  atEvent:
    slot_uri: martialis:atEvent
    description: >-
      Optional link from an assertion or life event to the canonical Event record(s) it took
      place at. Multivalued.
    range: Event
    multivalued: true

  organizer:
    slot_uri: sdo:organizer
    range: Organization
    multivalued: true

  about:
    slot_uri: sdo:about
    range: Style
    multivalued: true

  eventPlace:
    slot_uri: martialis:eventPlace
    range: Place
    description: >-
      The Place an Event, FoundingEvent or DissolutionEvent happened at. Narrower than
      schema:location, but mapped to it rather than a sub-property of it: on these classes
      schema:location holds only the GeoRef of the location slot.
  participationRole:
    slot_uri: martialis:participationRole
    description: >-
      The role an agent played in an Event: competitor, official, organizer, demonstrator,
      guest, instructor, signatory, or other. A student's attendance is a TeacherAssertion on the
      student's record, linked with martialis:atEvent.
    range: EventRole
    required: true

  participationStyle:
    slot_uri: martialis:participationStyle
    description: >-
      The style a participant specifically taught or practised at this event. Optional; omitted
      on single-style events.
    range: Style
    multivalued: true

  # ---- evidence ---------------------------------------------------------

  hasEvidence:
    slot_uri: martialis:hasEvidence
    description: >-
      Links an entity (assertion, interaction, life event, or top-level entity) to its evidence
      records.
    range: SourceAssertionRelation
    multivalued: true
    inlined_as_list: true

  basedOnSource:
    slot_uri: martialis:basedOnSource
    description: >-
      The Source backing this evidence record.
    range: Source

  uri:
    slot_uri: sdo:url
    range: uri

  contentUrl:
    slot_uri: sdo:contentUrl
    range: uri
    required: true

  archiveUri:
    slot_uri: sdo:archivedAt
    range: uri

  archiveUrl:
    slot_uri: sdo:archivedAt
    range: uri

  url:
    slot_uri: sdo:url
    range: uri

  website:
    slot_uri: sdo:url
    range: uri

  cite:
    slot_uri: sdo:citation

  locator:
    slot_uri: martialis:sourceLocation
    description: >-
      Where the cited claim sits within the work (YAML: locator) - page number, timestamp,
      section, etc. Paired with martialis:sourceLocatorLabel.

  locatorLabel:
    slot_uri: martialis:sourceLocatorLabel
    description: >-
      What kind of locator martialis:sourceLocation is: CSL's citation-locator vocabulary (page,
      volume, chapter, folio, section, timestamp, ...). Optional.
    range: SourceLocatorLabel

  quotation:
    slot_uri: martialis:quotation
    description: >-
      The passage of the source that states the claim, transcribed verbatim: the source's words,
      order, case and punctuation. Editorial interventions are square-bracketed, as in standard
      transcription: [...] for an omission inside the passage, [sic] after an error in the source,
      and a short clarifying insertion where the excerpt would be unclear without it; never a fact
      the source does not state.

  informationType:
    slot_uri: martialis:informationType
    description: >-
      The informant's proximity to the specific fact cited (Mills): primary (first-hand),
      secondary (learned from others) or undetermined (the informant cannot be identified). Set
      per citation. Absent when not yet assessed.
    range: InformationType

  supports:
    slot_uri: martialis:supports
    description: >-
      Whether the source supports or contradicts the assertion (true/false).
    range: boolean

  evidenceType:
    slot_uri: martialis:evidenceType
    description: >-
      How the cited information bears on the claim (Mills): direct, indirect or negative.
      Independent of martialis:supports, which gives the direction. Absent when not yet
      assessed.
    range: EvidenceType

  imageAttribution:
    slot_uri: martialis:imageAttribution
    description: >-
      Credits/attribution for an image or video, indicating its source. Distinct from
      hasEvidence: attribution carries no supports/contradicts semantics.
    range: Attribution
    inlined: true
    required: true

  # ---- confidence -------------------------------------------------------

  confidenceLevel:
    slot_uri: martialis:confidenceLevel
    description: >-
      The curator's conclusion about the claim after weighing all its evidence: refuted,
      doubtful, possible, probable or confirmed, ordered by martialis:gradeOrdinal. A certainty scale
      only: contested evidence is carried by martialis:supports false, not by a level.
    range: ConfidenceLevel
    required: true

  assessedBy:
    slot_uri: martialis:assessedBy
    description: >-
      The agent who performed the confidence assessment (https://martial.is/agent/).
    range: uriorcurie

  confidenceRationale:
    slot_uri: martialis:confidenceRationale
    description: >-
      Free-text justification for the confidence level: what the evidence does and does not
      establish.

  # ---- intervals --------------------------------------------------------

  startYear:
    slot_uri: martialis:startYear
    description: >-
      The start of a TimeInterval, as a bare integer year (xsd:integer rather than xsd:gYear).
    range: integer
    minimum_value: 1

  endYear:
    slot_uri: martialis:endYear
    description: >-
      The end of a TimeInterval; absent when the period is ongoing or unknown.
    range: integer
    minimum_value: 1

  # ---- media / links ----------------------------------------------------

  image:
    slot_uri: martialis:primaryImage
    range: Photo
    inlined: true
    description: >-
      The single primary depiction of an entity. The multivalued photos gallery uses
      schema:image; a single-valued slot cannot share that IRI without its maxCount 1 shape
      firing on the gallery.
  logo:
    slot_uri: sdo:logo
    range: Photo
    inlined: true

  photos:
    slot_uri: sdo:image
    range: Photo
    multivalued: true
    inlined_as_list: true
    description: A gallery of depictions; the generic sdo:image relation.

  videos:
    slot_uri: sdo:video
    range: Video
    multivalued: true
    inlined_as_list: true

  rights:
    slot_uri: martialis:mediaRights
    range: MediaRights
    description: >-
      Copyright or licence status of the media file itself, as one value on a single axis: a
      Creative Commons licence where one was granted, otherwise a rightsstatements.org
      statement. Absence means the status has not been evaluated. Distinct from
      imageAttribution, which credits the item to a source and makes no legal claim, and from
      informationType and evidenceType, which are epistemic.
  sameAs:
    slot_uri: sdo:sameAs
    range: uriorcurie
    multivalued: true
    pattern: "^(wd:Q[1-9][0-9]*|dbr:[^\\s]+|viaf:[1-9][0-9]*|isni:[0-9]{15}[0-9X]|lcnaf:n[a-z]?[0-9]+|ndlna:[0-9]+|orcid:[0-9]{4}-[0-9]{4}-[0-9]{4}-[0-9]{3}[0-9X])$"
    description: >-
      The same entity in an external authority, as a CURIE naming the entity itself (not a
      web page about it): wd: (Wikidata), dbr: (DBpedia), viaf:, isni:, lcnaf: (Library of
      Congress names), ndlna: (National Diet Library), orcid:. Nothing else belongs here: a
      web page, a Wikipedia article or an official site is not an identity.

  # ---- source-specific --------------------------------------------------

  hasContributor:
    slot_uri: martialis:hasContributor
    description: >-
      Links a Source to a contributor node (a CSL contributor role plus a CSL name-variable
      shape).
    range: Contributor
    multivalued: true
    inlined_as_list: true

  contributorRole:
    slot_uri: martialis:contributorRole
    description: >-
      CSL's 26-value contributor role vocabulary: author, editor, translator, interviewer,
      director, compiler, illustrator, and others.
    range: ContributorRole
    required: true

  family:
    slot_uri: sdo:familyName
  given:
    slot_uri: sdo:givenName
  literal:
    slot_uri: sdo:name
  droppingParticle:
    slot_uri: martialis:droppingParticle
  nonDroppingParticle:
    slot_uri: martialis:nonDroppingParticle
    description: >-
      CSL name-variable non-dropping-particle: a name part retained when the name is
      alphabetized (e.g. 'de' in 'de Gaulle, Charles').
  suffix:
    slot_uri: martialis:suffix
  contributorPerson:
    slot_uri: martialis:contributorPerson
    description: >-
      Links a contributor to their own Person entry, when one exists.
    range: Person
  contributorOrg:
    slot_uri: martialis:contributorOrg
    description: >-
      Links a corporate contributor (e.g. an editorial board credited as a body) to its own
      Organization entry, when it is in the database.
    range: Organization

  publisherName:
    slot_uri: sdo:name
    required: true
  publisher:
    slot_uri: sdo:publisher
    range: Publisher
    inlined: true
  publisherOrg:
    slot_uri: martialis:publisherOrg
    description: >-
      Links a Source's publisher to its own Organization entry, when one exists.
    range: Organization

  editionOf:
    slot_uri: martialis:editionOf
    description: >-
      Links a Source to the node recording which work it is an edition, translation, reprint, or
      facsimile of.
    range: EditionOf
    inlined: true
  editionOfSource:
    slot_uri: martialis:editionOfSource
    description: >-
      The work this edition/translation/reprint/facsimile is of. Aligned with
      dcterms:isVersionOf ("a resource of which the described resource is a version, edition, or
      adaptation").
    range: Source
  editionRelationType:
    slot_uri: martialis:editionRelationType
    description: >-
      edition | translation | reprint | facsimile.
    range: EditionRelation

  selfPublished:
    slot_uri: martialis:selfPublished
    description: >-
      Whether the publisher and the contributor(s) are the same party. Preferably derived from
      the linked entities rather than asserted.
    range: boolean

  volume:
    slot_uri: bibo:volume
  issue:
    slot_uri: bibo:issue
  page:
    slot_uri: bibo:pages
  edition:
    slot_uri: sdo:bookEdition
  chapterNumber:
    slot_uri: martialis:chapterNumber
    description: >-
      Chapter number of this item within the containing work. CSL 'chapter-number'.
  part:
    slot_uri: martialis:partNumber
  section:
    slot_uri: martialis:section
    description: >-
      Section of the container in which this item appears (e.g. a newspaper section). CSL 'section'.
  language:
    slot_uri: sdo:inLanguage

  archive:
    slot_uri: martialis:archive
    description: >-
      Archival repository holding this item (e.g. 'National Diet Library'). CSL 'archive'.
  archiveCollection:
    slot_uri: martialis:archiveCollection
    description: >-
      Collection within the archive that holds this item. CSL 'archive_collection'.
  archiveLocation:
    slot_uri: martialis:archiveLocation
    description: >-
      Location of this item within the archive (e.g. box and folder). CSL 'archive_location'.
  callNumber:
    slot_uri: martialis:callNumber
    description: >-
      Shelfmark or call number within the archive. CSL 'call-number'.

  isbn:
    slot_uri: sdo:isbn
  issn:
    slot_uri: sdo:issn
  doi:
    slot_uri: martialis:doi
    description: >-
      Digital Object Identifier.
  pmid:
    slot_uri: martialis:pmid
    description: >-
      PubMed identifier (CSL 'PMID').
  pmcid:
    slot_uri: martialis:pmcid
    description: >-
      PubMed Central identifier (CSL 'PMCID').
  oclc:
    slot_uri: martialis:oclc
    description: >-
      WorldCat/OCLC control number.
  archiveOrgId:
    slot_uri: martialis:archiveOrgId
    description: >-
      archive.org item identifier.
  ndl:
    slot_uri: martialis:ndl
    description: >-
      National Diet Library (Japan) identifier.
  cinii:
    slot_uri: martialis:cinii
    description: >-
      CiNii (Japanese academic literature database) identifier.
  handle:
    slot_uri: martialis:handle
    description: >-
      Handle System persistent identifier.

  minOrdinal:
    slot_uri: martialis:minOrdinal
    description: >-
      Lowest valid grade number (kyu side), if this system bounds it. Absent for the unbounded
      default.
    range: integer
  maxOrdinal:
    slot_uri: martialis:maxOrdinal
    description: >-
      Highest valid grade number (dan side), if this system bounds it. Absent for the unbounded
      default.
    range: integer
  gradeScheme:
    slot_uri: martialis:gradeScheme
    description: >-
      The skos:ConceptScheme enumerating this system's grades (see ontology/vocabularies.ttl),
      required when martialis:rankingSystemKind is 'enumerated'.
    range: uri
  derivedFromSystem:
    slot_uri: martialis:derivedFromSystem
    description: >-
      This RankingSystem's grading concept derives from a more generic ancestor system. Distinct
      from martialis:variantOf (style-to-style).
    range: RankingSystem

  confersRank:
    slot_uri: martialis:confersRank
    description: >-
      false asserts that this style confers no ranking system of its own (e.g. MMA). Distinct
      from omitting martialis:rankSystem, which means unresearched.
    range: boolean

